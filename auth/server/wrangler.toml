# 🔑 moontr 로그인 다리 — 아이폰 앱 카카오 로그인 (먼저 플래너 · 교무실 타이쿤, 파이어베이스 moon-d528d)
# 처음 한 번 (이 폴더에서):
#   npx wrangler@4 secret put FB_SA     ← 파이어베이스 콘솔 › 프로젝트 설정 › 서비스 계정 › '새 비공개 키 생성'으로 받은 JSON 파일 내용을 통째로 붙여 넣어요
#   npx wrangler@4 deploy
# (wrangler 없이: Cloudflare 대시보드 › Workers › 만들기 → 이름 moontr-auth → worker.js 내용 붙여 넣고 배포 → 설정 › 변수 › 비밀(Secret) FB_SA)
# 주소: https://moontr-auth.bellachord.workers.dev  (first/index.html 의 AUTH_BRIDGE)
name = "moontr-auth"
main = "worker.js"
compatibility_date = "2026-09-01"
