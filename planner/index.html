<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>문쌤 타이쿤 · 건물 단면 타워</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Jua&family=Press+Start+2P&family=Nanum+Pen+Script&family=Black+Han+Sans&family=Gowun+Batang:wght@400;700&family=Nanum+Gothic+Coding:wght@400;700&family=Noto+Sans+KR:wght@300;500;700&display=swap">
<style>
/* 대문(moontr.site) [플래너]에 끼워 넣는 문쌤 타이쿤 화면 = 1번 건물 단면 타워 (교무실 타이쿤 /tycoon 의 최신 그림을 옮겨 옴, 늘 부스 네온 색). 시간표는 대문 시간표(moontr_config/timetable)를 그대로 읽어요 */
:root{
  --bg:#07070C; --ink:#EDEDF5; --muted:#8C8CA6; --panel:#0B0B12; --line:#2A2A3A;
  --accent:#FFD400; --accent2:#2FE3F0; --hi:#FF5FAE; --ok:#5BEA6F;
  --ui:'Do Hyeon','Malgun Gothic',sans-serif; --num:'Press Start 2P',monospace;
  --box-b:2px solid var(--line); --box-r:0; --box-sh:0 0 0 1px #000, 0 0 14px rgba(47,227,240,.12);
  --h-ink:var(--accent2); --on-ink:#16131A;
  color-scheme:dark;
}
:root[data-v="b"]{
  --bg:#3E5A3A; --ink:#3B2A1C; --muted:#8A7058; --panel:#FFF4DE; --line:#6B4A2E;
  --accent:#E8743B; --accent2:#3C8C6E; --hi:#E24C6A; --ok:#3C8C6E;
  --ui:'Jua','Malgun Gothic',sans-serif;
  --box-b:3px solid #6B4A2E; --box-r:6px; --box-sh:inset 0 -4px 0 #EAD3AE, 0 4px 0 #2A3A27;
  --h-ink:#B5532A; --on-ink:#FFF4DE; color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;gap:8px;padding-block:8px;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.box{background:var(--panel);border:var(--box-b);border-radius:var(--box-r);box-shadow:var(--box-sh)}
.top{display:flex;flex-direction:column;gap:6px;padding:7px 10px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--num);font-size:12px;color:var(--accent);white-space:nowrap}
.logo small{display:block;font-family:var(--ui);font-size:12px;color:var(--muted);margin-top:3px}
.stat{display:flex;flex-direction:column;gap:2px;padding:0 10px;border-left:2px solid color-mix(in srgb,var(--line) 70%,transparent)}
.stat span{font-size:11px;color:var(--muted)}
.stat b{font-family:var(--num);font-size:12px;font-weight:400;white-space:nowrap;font-variant-numeric:tabular-nums}
.stat b.k{font-family:var(--ui);font-size:16px}
.stat b.y{color:var(--accent)}
.sp{flex:1}
.lab{font-size:12px;color:var(--muted)}
.btn{font-family:var(--ui);font-size:13px;color:var(--ink);background:transparent;border:2px solid color-mix(in srgb,var(--ink) 30%,transparent);border-radius:var(--box-r);padding:3px 8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--on-ink)}
.btn:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.btn b{font-family:var(--num);font-size:9px;font-weight:400;margin-right:5px}
.btn.wait{opacity:.38;cursor:not-allowed;border-style:dashed}
.structs{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.structs .grp{flex-basis:100%;height:0}
.structs .lab{margin-right:2px}
/* 본문: 구조마다 패널 자리가 달라요 */
.main{position:relative;display:grid;gap:8px;min-height:0;grid-template-columns:minmax(0,1fr) 270px;grid-template-areas:"map side"}
.main[data-l="left"]{grid-template-columns:250px minmax(0,1fr);grid-template-areas:"side map"}
.main[data-l="bottom"]{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"map" "side"}
.main[data-l="none"],.main[data-l="overlay"]{grid-template-columns:1fr;grid-template-areas:"map"}
.mapcol{grid-area:map;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
.frame{position:relative;line-height:0}
.frame canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.side{grid-area:side;display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto}
.main[data-l="none"] .side{display:none}
.main[data-l="bottom"] .side{flex-direction:row;overflow:visible}
.main[data-l="bottom"] .side .card{flex:1;min-width:0}
.main[data-l="bottom"] .side .opt{display:none}
.main[data-l="bottom"] .tt{grid-template-columns:none;grid-template-rows:auto auto auto;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:1px 6px;text-align:center}
.main[data-l="bottom"] .side .card:first-child{flex:0 0 260px}
.main[data-l="bottom"] .side .card:nth-child(2){flex:1 1 auto}
.main[data-l="overlay"] .side{position:absolute;right:14px;top:12px;width:250px;z-index:2;pointer-events:none;max-height:calc(100% - 24px)}
.main[data-l="overlay"] .side .card{opacity:.92}
.main[data-l="overlay"] .side .opt{display:none}
.card{padding:8px 10px}
.card h3{margin:0 0 6px;font-family:var(--num);font-size:9px;font-weight:400;color:var(--h-ink);display:flex;justify-content:space-between;gap:6px}
.card h3 em{font-family:var(--ui);font-style:normal;font-size:11px;color:var(--muted)}
.where{font-size:21px;line-height:1.2}
.act{font-size:14px;color:var(--muted)}
.bar{height:9px;margin:7px 0 5px;background:color-mix(in srgb,var(--ink) 15%,transparent);border:2px solid color-mix(in srgb,var(--ink) 35%,transparent)}
.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--accent) 0 6px,color-mix(in srgb,var(--accent) 70%,#000) 6px 8px)}
.nx{font-size:13px}
.nx b{color:var(--accent);font-weight:400}
.tt{display:grid;grid-template-columns:auto 1fr auto;gap:2px 7px;font-size:13px;align-items:center}
.tt .p{font-family:var(--num);font-size:8px;color:var(--muted);white-space:nowrap}
.tt .t{font-size:11px;color:var(--muted)}
.tt .cur{color:var(--accent)}
.tt .free{color:var(--muted)}
.chip{display:inline-block;padding:0 5px;border:1.5px solid currentColor;border-radius:var(--box-r);font-size:12px;white-space:nowrap}
.chip.hr{color:var(--hi)}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.todo li{display:flex;gap:7px;align-items:center}
.todo i{width:11px;height:11px;border:2px solid currentColor;flex:none}
.todo li.done{color:var(--muted);text-decoration:line-through}
.todo li.done i{background:var(--ok);border-color:var(--ok)}
.tag2{font-family:var(--ui);font-size:10px;padding:1px 6px;border-radius:999px;background:color-mix(in srgb,var(--muted) 30%,transparent);color:var(--ink)}
.desc{font-size:13px;line-height:1.4;color:var(--muted);min-height:1.4em}
.desc b{color:var(--accent);font-weight:400}
@media (max-width:900px){
  body{overflow:auto} .app{height:auto}
  .main,.main[data-l]{grid-template-columns:1fr;grid-template-rows:auto auto;grid-template-areas:"map" "side"}
  .main[data-l="overlay"] .side{position:static;width:auto;pointer-events:auto}
  .main[data-l="none"] .side{display:flex}
  .main[data-l="bottom"] .side{flex-direction:column}
}
/* 허브 안에서는 위 정보 바 · 옆 패널 없이 그림만 */
.top,.side{display:none!important}
.app{grid-template-rows:1fr;padding:0;gap:0}
.main,.main[data-l]{grid-template-columns:1fr!important;grid-template-rows:1fr!important;grid-template-areas:"map"!important}
body{overflow:hidden!important;cursor:pointer}
@media (max-width:900px){ .app{height:100%} }
</style>
</head>
<body>

<div class="app">
  <header class="top box">
    <div class="row">
      <div class="logo">MOONTR TYCOON<small>문쌤의 하루 · 구조 시안</small></div>
      <div class="stat"><span>DATE</span><b id="sDate">--</b></div>
      <div class="stat"><span>TIME</span><b class="y" id="sTime">--:--</b></div>
      <div class="stat"><span>지금</span><b class="k" id="sSlot">--</b></div>
      <div class="sp"></div>
      <span class="lab">미리보기 시간</span>
      <div class="row" style="gap:5px" id="ctl">
        <button class="btn on" data-speed="1">실시간</button><button class="btn" data-speed="60">×60</button><button class="btn" data-speed="600">×600</button>
        <button class="btn" data-jump="1,08:25">월 조회</button><button class="btn" data-jump="2,10:33">화 쉬는 시간</button><button class="btn" data-jump="3,12:40">수 점심</button><button class="btn" data-jump="5,16:45">금 퇴근</button><button class="btn" data-jump="6,11:00">토요일</button>
      </div>
      <span class="lab">색 (확정)</span>
      <div class="row" style="gap:5px" id="pal"><button class="btn on" data-v="a">A NEON</button><button class="btn" data-v="b">B COZY</button></div>
    </div>
    <div class="structs" id="structs"></div>
    <div class="desc" id="desc"></div>
  </header>
  <div class="main" id="main" data-l="side">
    <section class="mapcol" id="mapcol">
      <div class="frame" id="frame"><canvas id="cv" width="960" height="540"></canvas></div>
    </section>
    <aside class="side">
      <div class="card box">
        <h3>NOW <em id="nTag"></em></h3>
        <div class="where" id="nWhere">--</div><div class="act" id="nAct">--</div>
        <div class="bar"><i id="nBar" style="width:0%"></i></div><div class="nx" id="nNext">--</div>
      </div>
      <div class="card box"><h3>TODAY <em id="tDay"></em></h3><div class="tt" id="tt"></div></div>
      <div class="card box opt"><h3>TO DO <span class="tag2">2단계 · 예시</span></h3>
        <ul class="todo"><li class="done"><i></i>1-10 가정통신문 회수</li><li><i></i>3-2 미도약 출석 확인</li><li><i></i>통사 기말 학습지 인쇄</li></ul></div>
    </aside>
  </div>
</div>

<script>
/* ===================== 시간표 · 하루 상태 ===================== */
const BELL = [["조회","08:20","08:40"],["1","08:40","09:30"],["2","09:40","10:30"],["3","10:40","11:30"],["4","11:40","12:30"],
  ["점심","12:30","13:30"],["5","13:30","14:20"],["6","14:30","15:20"],["7","15:30","16:20"],["종례","16:20","16:35"]];
// 아래 TT · BELL 은 처음 잠깐 쓰는 예시예요. 곧 대문 시간표(moontr_config/timetable)를 읽어 바꿔요 → loadTimetable()
const TT = { 1:{1:"1-4",3:"1-6",4:"3-1",6:"1-10"}, 2:{2:"1-5",3:"1-7",5:"3-2"}, 3:{1:"1-8",4:"1-9",6:"1-11"}, 4:{2:"3-3",3:"1-4",5:"1-10"}, 5:{1:"1-6",3:"1-5",6:"1-10"} };
const TAUGHT = new Set(["1-4","1-5","1-6","1-7","1-8","1-9","1-10","1-11","3-1","3-2","3-3"]);
const DAYS = ["일","월","화","수","목","금","토"];
const mm = s => { const [h, m] = s.split(":").map(Number); return h*60 + m; };
const hhmm = m => String(Math.floor(m/60)).padStart(2,"0") + ":" + String(Math.floor(m%60)).padStart(2,"0");
const LABEL = {};   // 시간표 칸 이름 (대문 시간표의 긴 이름을 짧게: "3학년 1반 윤리와사상" → "3-1 윤사")
const NAME = id => ({ office:"교무실", home:"집", "1-10":"1-10 우리 반" })[id] || LABEL[id] || id;
function stateAt(d){
  const day = d.getDay(), m = d.getHours()*60 + d.getMinutes() + d.getSeconds()/60;
  if (day === 0 || day === 6) return { place:"home", act:"주말 · 푹 쉬는 날", s:0, e:1440, m, slot:"주말" };
  if (m < mm("07:50")) return { place:"home", act:"출근 준비", s:0, e:mm("07:50"), m, slot:"출근 전" };
  if (m >= mm(OFF)) return { place:"home", act:"퇴근 후 · 저녁 시간", s:mm(OFF), e:1440, m, slot:"퇴근 후" };
  const DB = dayBell(day);
  for (const [p, a, b] of DB){
    const s = mm(a), e = mm(b);
    if (m >= s && m < e){
      if (p === "조회" || p === "종례") return { place:"1-10", act:`우리 반 ${p}`, s, e, m, slot:p, p };
      if (p === "점심") return { place:"office", act:"점심시간", s, e, m, slot:"점심", p, lunch:true };
      const r = (TT[day] || {})[p];
      return r ? { place:r, act:`${p}교시 수업 중`, s, e, m, slot:`${p}교시`, p } : { place:"office", act:`${p}교시 공강 · 업무`, s, e, m, slot:`${p}교시 공강`, p };
    }
  }
  if (m < dayStart(day)) return { place:"office", act:"출근 · 하루 준비", s:mm("07:50"), e:dayStart(day), m, slot:"출근" };
  if (m >= dayEnd(day)) return { place:"office", act:"업무 정리 · 퇴근 준비", s:dayEnd(day), e:mm(OFF), m, slot:"정리" };
  const nx = DB.find(([, a]) => mm(a) > m), pv = [...DB].reverse().find(([, , b]) => mm(b) <= m);
  const r = nx && (TT[day] || {})[nx[0]], be = nx ? mm(nx[1]) : m + 1, bs = pv ? mm(pv[2]) : m;
  // 쉬는 시간: 먼저 교무실로 돌아왔다가, 종 치기 4분 전에 다음 교실로 가요
  if (r && m >= be - 4) return { place:r, act:`${nx[0]}교시 ${r} 교실로 가요`, s:be - 4, e:be, m, slot:"쉬는 시간", brk:true, go:true };
  return { place:"office", act:r ? `쉬는 시간 · 다음 ${nx[0]}교시 ${r}` : "쉬는 시간 · 교무실", s:bs, e:r ? be - 4 : be, m, slot:"쉬는 시간", brk:true };
}
/* 대문 시간표 불러오기: 교시 시각(bell)과 요일별 수업(week)을 플래너 형식으로 바꿔요 */
const SUBJ = [[/윤리와\s*사상|윤사/, "윤사"], [/생활과\s*윤리|생윤/, "생윤"], [/통합\s*사회|통사/, "통사"], [/창체|창의/, "창체"]];
function roomOf(c){
  const t = String(c || "").trim(); if (!t) return "";
  const ids = [...t.matchAll(/(\d)\s*학년\s*(\d+)\s*반|(\d)\s*-\s*(\d+)/g)].map(m => m[1] ? `${m[1]}-${m[2]}` : `${m[3]}-${m[4]}`);
  const sub = (SUBJ.find(([re]) => re.test(t)) || [, ""])[1];
  if (ids.length > 1) { const id = ids.join("/"); LABEL[id] = ids.join("/"); return id; }
  if (ids.length === 1) { const id = ids[0]; LABEL[id] = id === "1-10" ? "1-10" : `${id}${sub ? " " + sub : ""}`; return id; }
  const gr = (t.match(/(\d)\s*학년/) || [])[1] || "x", rest = t.replace(/\d\s*학년/, "").trim();
  const id = `${gr}-${rest}`; LABEL[id] = rest.slice(0, 6); return id;   // 예: "3학년 미도약" → 3-미도약 (칸에는 "미도약")
}
async function loadTimetable(){
  try {
    const r = await fetch("https://firestore.googleapis.com/v1/projects/moon-d528d/databases/(default)/documents/moontr_config/timetable?key=AIzaSyA3CxawUPIfGeBWyffsNbCSM3ymjKHLH6o");
    if (!r.ok) return;
    const j = await r.json(), F = j.fields || {};
    const conv = v => v.stringValue ?? v.integerValue ?? (v.arrayValue ? (v.arrayValue.values || []).map(conv) : v.mapValue ? Object.fromEntries(Object.entries(v.mapValue.fields || {}).map(([k, x]) => [k, conv(x)])) : null);
    const bell = F.bell ? conv(F.bell) : null, week = F.week ? conv(F.week) : null;
    if (Array.isArray(bell) && bell.length){
      const rows = [], add = (p, a, b) => rows.push([p, a, b]);
      const t = s => hhmm(mm(s));
      add("조회", hhmm(mm(bell[0].s) - 20), t(bell[0].s));
      bell.forEach((b, i) => {
        if (i > 0 && mm(b.s) - mm(bell[i - 1].e) >= 40) add("점심", t(bell[i - 1].e), t(b.s));   // 40분 넘게 비면 점심
        add(String(i + 1), t(b.s), t(b.e));
      });
      add("종례", t(bell[bell.length - 1].e), hhmm(mm(bell[bell.length - 1].e) + 15));
      BELL.length = 0; BELL.push(...rows);
    }
    if (week){
      Object.keys(TT).forEach(k => delete TT[k]); TAUGHT.clear(); TAUGHT.add("1-10");
      Object.entries(week).forEach(([d, list]) => { TT[d] = {}; (list || []).forEach((x, i) => { const id = roomOf(x && x.c); if (id){ TT[d][String(i + 1)] = id; TAUGHT.add(id); } }); });
    }
  } catch (e) { console.warn("시간표를 불러오지 못했어요", e); }
}
loadTimetable(); setInterval(loadTimetable, 10*60*1000);   // 대문에서 시간표를 고치면 10분 안에 반영
/* ✏️ 요일별 마지막 교시 (월 6 · 화 7 · 수 6 · 목 7 · 금 7) · 교사 퇴근 시각 */
const LAST = { 1:6, 2:7, 3:6, 4:7, 5:7 };
const OFF = "16:10";
/* 그날의 종 시간표: 마지막 교시 다음 교시는 빼고, 종례는 마지막 교시 바로 뒤 10분 (퇴근 시각을 넘지 않게) */
function dayBell(day){
  const last = LAST[day] || 7, rows = BELL.filter(([p]) => !/^\d+$/.test(p) || +p <= last).filter(([p]) => p !== "종례");
  const lp = [...rows].reverse().find(([p]) => /^\d+$/.test(p)), e0 = lp ? mm(lp[2]) : mm(OFF) - 10;
  rows.push(["종례", hhmm(e0), hhmm(Math.min(e0 + 10, mm(OFF)))]);
  return rows;
}
const dayStart = day => mm(dayBell(day)[0][1]), dayEnd = day => { const b = dayBell(day); return mm(b[b.length - 1][2]); };
const slotRoom = (day, p) => p === "조회" || p === "종례" ? "1-10" : p === "점심" ? "lunch" : (TT[day] || {})[p] || "";

/* ===================== 확정 색 A · B ===================== */
const PAL = {
  a:{ ground:"#07070C", dot:"#14142A", base:"#101020", hall:"#1A1A2E", hallLine:"#30305A", wall:"#23233A", wallTop:"#3D6BFF", edge:"#000000",
      fA:"#1D1D3A", fB:"#232345", oA:"#13243A", oB:"#182C46", hA:"#22152A", hB:"#28182F", desk:"#3A3A5C", deskTop:"#5A5A88", board:"#0F5A3A", boardEdge:"#8C8CA6",
      active:"#FFD400", hr:"#FF5FAE", glass:"#2FE3F0", skin:"#F2C9A0", path:"#1A1A2E", roof:"#B07CFF", night:"rgba(4,4,20,.45)", tuft:"#1E1E3A",
      uni:"#3B4C86", skirt:"#5A3F7A", sky:"#0B0B1A", apt:"#14142A", aptWin:"#1E1E3A", yard:"#17121F", tree:"#1F6B4A",
      ui:{ panel:"#0B0B12", ink:"#EDEDF5", muted:"#8C8CA6", acc:"#FFD400", acc2:"#2FE3F0", line:"#2A2A3A", ok:"#5BEA6F" }, font:"'Do Hyeon','Malgun Gothic',sans-serif" },

    else if (st.brk) msgs = ["문쌤은 교무실로 몸을 피했다!", nx ? `다음 상대: ${nx.p}교시 ${nx.r} (${nx.a})` : "오늘 남은 수업이 없다!"];
    else if (kind === "lunch") msgs = ["문쌤은 급식을 먹었다!", "HP가 조금 회복되었다! (기분상)"];
    else if (st.p === "조회" || st.p === "종례") msgs = [`1-10 친구들이 모였다! ${st.p}를 시작한다.`, "우리 반 분위기가 화기애애하다 ♥"];
    else if (kind === "hr") msgs = [`우리 반 1-10과 함께하는 ${st.slot}!`, "친구들의 눈빛이 반짝인다 ♥"];
    else if (kind === "paper") msgs = ["업무 서류 더미가 나타났다!", "문쌤은 결재를 사용했다! 효과는 굉장했다!"];
    else msgs = st.m - st.s < 2 ? [`야생의 ${st.slot} ${id}(이)가 나타났다!`, "가랏, 문쌤! 수업 시작!"] : ["문쌤의 명강의! 효과는 굉장했다!", "학생들의 집중력이 올라갔다!", "문쌤은 판서를 사용했다!", "질문이 쏟아진다! 문쌤은 친절하게 답했다!"];
    const mi = Math.floor(T/3.5) % msgs.length, line = msgs[mi], n = Math.min(line.length, Math.floor(((T % 3.5)/3.5)*line.length*2.2));
    ft(line.slice(0, n), 20, 232, 10, "#1A1A22", "left", "head");
    if (msgs[mi + 1] && n >= line.length) ft(msgs[(mi + 1) % msgs.length].slice(0, 0), 20, 250, 9, "#1A1A22");
    if (Math.sin(T*6) > 0) ft("▼", 294, 254, 7, "#1A1A22", "center", "head");
    const menu = [["수업", "상담"], ["가방", "퇴근"]], sel = id === "home" ? [1, 1] : kind === "paper" || kind === "lunch" ? [1, 0] : [0, 0];
    menu.forEach((row, r) => row.forEach((t, c) => { const x = 330 + c*72, y = 231 + r*17; if (sel[0] === r && sel[1] === c && Math.sin(T*5) > -.3) ft("▶", x - 9, y, 8, "#1A1A22", "center", "head"); ft(t, x, y, 10, "#1A1A22", "left", "head"); }));
    if (NIGHT){ g.globalAlpha = .18; rect(0, 0, W, 210, "#000020"); g.globalAlpha = 1; }
  }
  return { name:"몬스터 배틀", layout:"none", custom:true, draw, who:"20~30대 · 게임 세대, 유머",
    desc:"<b>추억의 몬스터 배틀 게임 화면</b>이에요. '야생의 3교시 1-6이(가) 나타났다!'처럼 교시가 상대로 나오고, 상대 HP는 수업 남은 시간, 내 HP는 하루 체력, EXP는 오늘 끝낸 수업이에요. 공강엔 '업무 서류 더미', 점심엔 급식판이 나오고 우리 반은 하트가 날려요." };
})();
NEWS.push(S13);
/* ===== END 13 ===== */

/*NEW_STRUCTS*/

const STRUCTS = [S1, S2, S3, S4, S5, S6, S7, S8, S9, S10, ...NEWS];
let SI = 0;

/* ===================== 시계 (미리보기 빨리 감기) ===================== */
let speed = 1, simAt = Date.now(), realAt = Date.now();
const simNow = () => new Date(simAt + (Date.now() - realAt) * speed);
function setSpeed(s){ simAt = simNow().getTime(); realAt = Date.now(); speed = s; }
function jumpTo(day, time){ const d = new Date(simNow()); d.setHours(...time.split(":").map(Number), 0, 0); d.setDate(d.getDate() + ((day - d.getDay() + 7) % 7)); simAt = d.getTime(); realAt = Date.now(); resetWalk(); }

/* ===================== 패널 ===================== */
const $ = id => document.getElementById(id);
function panel(d, st){
  const day = d.getDay(), m = st.m, tt = TT[day] || {};
  $("sDate").textContent = `${d.getMonth() + 1}/${d.getDate()} ${DAYS[day]}`;
  $("sTime").textContent = hhmm(d.getHours()*60 + d.getMinutes());
  $("sSlot").textContent = st.slot;
  $("nTag").textContent = `${SI + 1}. ${STRUCTS[SI].name}`;
  $("nWhere").textContent = WK.walking ? `→ ${NAME(WK.here)} 가는 중` : NAME(st.place);
  $("nAct").textContent = st.act;
  $("nBar").style.width = Math.max(0, Math.min(100, (m - st.s) / (st.e - st.s) * 100)) + "%";
  const nx = BELL.find(([p, a]) => mm(a) > m && tt[p]);
  $("nNext").innerHTML = day === 0 || day === 6 ? "다음 수업: 월요일" : nx ? `다음 <b>${nx[0]}교시 ${NAME(tt[nx[0]])}</b> · ${nx[1]}` : st.p && tt[st.p] ? "오늘 마지막 수업 중이에요" : "오늘 수업 끝! 수고했어요";
  $("tDay").textContent = `${DAYS[day]}요일 (예시)`;
  $("tt").innerHTML = day === 0 || day === 6 ? `<span class="p">WEEKEND</span><span>주말이에요</span><span></span>` : BELL.map(([p, a, b]) => {
    const cur = m >= mm(a) && m < mm(b) ? "cur" : "", r = slotRoom(day, p);
    const what = r === "lunch" ? `<span class="free">점심</span>` : r ? `<span class="chip ${r === "1-10" ? "hr" : ""}">${NAME(r)}</span>` : `<span class="free">공강</span>`;
    return `<span class="p ${cur}">${/\d/.test(p) ? p + "교시" : p}</span><span class="${cur}">${what}</span><span class="t">${a}</span>`;
  }).join("");
}

/* ===================== 화면 맞추기 · 고르기 ===================== */
const frame = $("frame"), col = $("mapcol");
function fit(){ const k = Math.min(col.clientWidth/16, (col.clientHeight || col.clientWidth*9/16)/9); frame.style.width = Math.floor(k*16) + "px"; frame.style.height = Math.floor(k*9) + "px"; }
new ResizeObserver(fit).observe(col);
// 후보 구조 (2 평면도 · 3 쿼터뷰 · 4 노선도는 빼기로 함, 번호는 그대로)
const READY = new Set([1, 5, 6, 7, 8, 9, 10]);
const okIdx = k => READY.has(k + 1) || (k >= 10 && k < STRUCTS.length);
const sBtn = (s, k) => `<button class="btn" data-s="${k}"><b>${k + 1}</b>${s.name}</button>`;
$("structs").innerHTML = `<span class="lab">후보</span>` + STRUCTS.map((s, k) => READY.has(k + 1) ? sBtn(s, k) : "").join("")
  + (NEWS.length ? `<span class="grp"></span><span class="lab">새 후보 · 연령대 · 성격별</span>` + STRUCTS.map((s, k) => k >= 10 ? sBtn(s, k) : "").join("") : "");
function pick(k){
  if (!okIdx(k)) k = [...READY][0] - 1;
  SI = k; resetWalk(); STRUCTS[k].reset?.();
  document.querySelectorAll("[data-s]").forEach(b => b.classList.toggle("on", +b.dataset.s === k));
  $("main").dataset.l = STRUCTS[k].layout; $("desc").innerHTML = `${k + 1}. ${STRUCTS[k].who ? `<b>추천: ${STRUCTS[k].who}</b> · ` : ""}${STRUCTS[k].desc}`;
  requestAnimationFrame(fit);
}
$("structs").addEventListener("click", e => { const b = e.target.closest("[data-s]"); if (b) pick(+b.dataset.s); });
$("ctl").addEventListener("click", e => {
  const s = e.target.closest("[data-speed]"); if (s){ setSpeed(+s.dataset.speed); document.querySelectorAll("[data-speed]").forEach(b => b.classList.toggle("on", b === s)); return; }
  const j = e.target.closest("[data-jump]"); if (j){ const [dd, tm] = j.dataset.jump.split(","); jumpTo(+dd, tm); }
});
$("pal").addEventListener("click", e => {
  const b = e.target.closest("[data-v]"); if (!b) return;
  V = b.dataset.v; P = PAL[V]; if (V === "a") delete document.documentElement.dataset.v; else document.documentElement.dataset.v = V;
  document.querySelectorAll("#pal .btn").forEach(x => x.classList.toggle("on", x === b));
});
pick(0);   // 1번 건물 단면 타워 (타이쿤 최신 그림, 예전에는 10번 위클리 플래너)
/* 대문 [플래너] 위쪽 게임 단추에서 불러 써요: 색 바꾸기 (a = NEON, b = COZY) · 시간은 setSpeed · jumpTo 를 그대로 */
function setPal(v){ if (!PAL[v]) return; V = v; P = PAL[v]; if (v === "a") delete document.documentElement.dataset.v; else document.documentElement.dataset.v = v; }
function goLive(){ simAt = Date.now(); realAt = Date.now(); speed = 1; resetWalk(); }
// 그림을 누르면 큰 창으로 (허브 안에서 볼 때)
document.addEventListener("click", () => { if (window.top !== window) window.open(location.href, "_blank", "noopener"); });

/* ===================== 그리기 루프 ===================== */
g.setTransform(2, 0, 0, 2, 0, 0); g.imageSmoothingEnabled = false;
let last = performance.now(), panelAt = 0;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function loop(now){
  const dt = Math.min(.1, (now - last)/1000); last = now; T = reduce ? 0 : now/1000;
  const d = simNow(), st = stateAt(d), S = STRUCTS[SI];
  const day = d.getDay(), hm = d.getHours()*60 + d.getMinutes();
  SCHOOL = day >= 1 && day <= 5 && hm >= mm("08:10") && hm < mm("16:40");
  NIGHT = hm < mm("06:30") || hm >= mm("18:30");
  BREAK = SCHOOL && !!st.brk; LUNCH = SCHOOL && !!st.lunch;
  g.setTransform(2, 0, 0, 2, 0, 0);
  if (!S.custom){ const raw = S.alias ? S.alias(st) : st.place; walkTo(S, S.mapId ? S.mapId(raw) : raw, d); stepWalk(S, dt); }
  S.draw(st);
  if (!S.custom && !S.ownMe){
    const piece = S.piece && WK.walking ? -Math.abs(Math.sin(T*12))*6 : 0;
    me(Math.round(WK.pos.x), Math.round(WK.pos.y + piece), frameNo(), WK.flip, S.meScale || 1);
    if (SI !== 6) bubble(bubText(st), WK.pos.x, WK.pos.y - 16);
  }
  if (now - panelAt > 400){ panelAt = now; panel(d, st); }
  requestAnimationFrame(loop);
}
fit(); requestAnimationFrame(loop);
</script>
</body>
</html>
