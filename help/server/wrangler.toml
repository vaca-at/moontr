# 💬 문의 채팅 서버 (스냅주 · 큰법당 · 캠핑장 · 소호랩이 함께 써요)
# 사용자가 남긴 글에 AI(Workers AI)가 먼저 답하고, 관리자는 moontr.site/help/ 문의함에서 답해요
# 배포: 이 폴더에서 npx wrangler@4 deploy
name = "moontr-help"
main = "worker.js"
compatibility_date = "2026-09-01"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "DESK"
class_name = "Desk"

# 무료 요금제에서도 쓸 수 있는 SQLite 저장소 방식
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Desk"]
