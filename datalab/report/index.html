<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나의 보고서 · 통합사회 데이터 · 알고리즘 실험실</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="../topics.js?v=11221500"></script>
<style>
/* 📄 나의 보고서 (2026-11-25): 선생님이 일괄 출력에서 '학생 화면으로 보내기'를 누르면, 출력물과 똑같은 보고서가 여기 나와요.
   데이터 실험실 · 알고리즘 실험실과 같은 학번 계정이에요. 보고서 모양은 선생님 화면(datalab/admin)의 인쇄 모양과 같아요 */
:root{--ink:#1A1A1A;--sub:#6E6E73;--line:#E5E5E8;--line2:#C9C9CF;--bg:#EEF0F3;--acc:#0057B8;--acc-s:#EAF2FC;--acc-l:#C9DCF3;--done:#0E8A5F;--warn:#B54708}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:400 14.5px/1.6 Pretendard,-apple-system,"Malgun Gothic",sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border:1px solid var(--ink);background:var(--ink);color:#fff;font-size:14px;font-weight:700;white-space:nowrap;text-decoration:none}
.btn.w{background:#fff;color:var(--ink);border-color:var(--line2)}
.btn.b{background:var(--acc);border-color:var(--acc)}
.btn.big{height:48px;padding:0 22px;font-size:16px}
.btn:disabled{opacity:.5;cursor:default}
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top .in{max-width:900px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{font-size:18px;letter-spacing:-.03em;margin-right:auto}
.top h1 small{display:block;font-size:12px;font-weight:500;color:var(--sub);letter-spacing:0}
.info{max-width:900px;margin:16px auto;padding:0 16px}
.note{font-size:13px;color:var(--sub)}
.card{background:#fff;border:1px solid var(--line);padding:22px 24px}
.card h2{font-size:19px;letter-spacing:-.03em;margin-bottom:6px}
.card p{font-size:14.5px;margin-bottom:6px}
.msg{padding:12px 14px;border:1px solid var(--acc-l);background:var(--acc-s);color:#1F3B63;font-size:14px;margin-bottom:12px}
.msg.o{border-color:#F5D58A;background:#FFF8E6;color:#7A4B00}
.lgrow{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 6px}
.lgrow input{height:44px;border:1px solid var(--line2);padding:0 12px;font-size:16px;width:150px;outline:none}
.lgrow input:focus{border-color:var(--ink)}
.bad{color:#B42318;font-size:13.5px;min-height:20px}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* ===== 보고서 (선생님 화면 인쇄 모양 그대로) ===== */
#printArea{-webkit-print-color-adjust:exact;print-color-adjust:exact;padding:0 0 40px}
.paper{background:#fff}
.paper h3{font-size:19px;letter-spacing:-.03em}
.paper .who{font-size:12.5px;color:var(--sub);margin-bottom:12px}
.paper section{padding:10px 0;border-top:1px solid var(--line)}
.paper section h4{font-size:13px;color:var(--acc);margin-bottom:2px}
.paper section p{white-space:pre-wrap;font-size:14px}
.fbbox{border:1px solid var(--line2);padding:12px 14px;margin-top:12px;font-size:14px}.fbbox p{white-space:pre-wrap}
.fbbox h4{font-size:13px;color:var(--acc);margin-bottom:4px}
.fbbox.sk{background:#F7F8FA}
.fbbox.stat h4 .note{font-weight:400;font-size:11.5px;margin-left:6px}
.stt{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px;font-variant-numeric:tabular-nums}
.stt th,.stt td{border-top:1px solid var(--line);padding:5px 6px;text-align:center}
.stt th{font-weight:600;color:var(--sub);font-size:12px;border-top:0}
.stt .l{text-align:left}
.top2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px;font-size:13px}
.top2 ol{padding-left:18px;margin-top:2px}.top2 .me{color:var(--acc)}
.top2 .cb{grid-template-columns:118px 1fr 70px}.top2 > div > b,.stp > b{display:block;margin-bottom:3px}
.stp{margin-top:10px;font-size:11px}.stp .cb2{grid-template-columns:150px 1fr 104px}
#printArea .bpage{break-after:page;page-break-after:always}
#printArea .bpage:last-child{break-after:auto;page-break-after:auto}
#printArea .bpage section{break-inside:avoid;padding:4px 0}#printArea .fbbox{break-inside:avoid;padding:8px 12px;margin-top:8px}
#printArea .bpage h3{font-size:15px;margin-top:6px!important}#printArea .bpage .who{margin-bottom:4px;font-size:11px}
#printArea .bpage section h4,#printArea .fbbox h4{font-size:11px;margin-bottom:0}#printArea .bpage section p,#printArea .fbbox p{font-size:11.5px;line-height:1.5}
#printArea .stt,#printArea .top2{font-size:11px}#printArea .stt th,#printArea .stt td{padding:3px 5px}
.storyp{height:262mm;overflow:hidden;display:flex;flex-direction:column;--fs:12.5px}
.storyp .sh{border-bottom:2px solid var(--acc);padding-bottom:8px;margin-bottom:12px;position:relative;padding-right:120px}
.storyp .sh small{display:block;font-size:11px;color:var(--acc);font-weight:700;letter-spacing:.04em}
.storyp .sh h2{font-size:24px;letter-spacing:-.03em;margin:2px 0}
.storyp .sh p{font-size:11.5px;color:var(--sub)}
.storyp .sc{border:1px solid var(--line);border-left:3px solid var(--acc);padding:9px 12px;margin-bottom:9px;font-size:var(--fs);line-height:1.65;break-inside:avoid}
.storyp .sc h3{font-size:calc(var(--fs) * 1.2);margin-bottom:3px;letter-spacing:-.02em}
.storyp .sc ul{padding-left:16px}.storyp .sc p{white-space:pre-wrap}
.storyp .sc .s7{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.storyp .sc .s7 span{border:1px solid var(--acc-l);background:var(--acc-s);padding:1px 7px;font-size:calc(var(--fs) * .85)}
.storyp .lk2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.storyp .lk{display:flex;gap:10px;align-items:center;border:1px solid var(--line2);padding:8px 10px}
.storyp .lk .qr{width:64px;height:64px;flex:none}.storyp .lk .qr svg{width:100%;height:100%;display:block}
.storyp .lk b{display:block;font-size:calc(var(--fs) * 1.1)}.storyp .lk u{display:block;text-decoration:none;color:var(--acc);font-weight:700;font-size:calc(var(--fs) * .95)}
.storyp .lk p{font-size:calc(var(--fs) * .88);color:var(--sub);line-height:1.45;margin-top:2px}
.storyp .sf{margin-top:auto;padding-top:6px;border-top:1px solid var(--line);font-size:10px;color:var(--sub);display:flex;justify-content:space-between}
.pgh{display:flex;justify-content:space-between}
.pgh.nmh{align-items:flex-start}
.nmbox{border:1.5px solid var(--acc);background:#fff;padding:4px 12px;text-align:right;font-size:11px;color:var(--sub);line-height:1.3;white-space:nowrap}
.nmbox b{display:block;font-size:21px;font-weight:800;color:var(--ink);letter-spacing:.03em}
.storyp .sh .nmbox{position:absolute;right:0;top:0}
.rbox{border:1.5px solid var(--ink);padding:10px 14px;margin-top:8px}
.rbox > h3:first-of-type{margin-top:4px!important}
.bt{font-size:13px!important;color:var(--ink)!important;margin-bottom:4px!important;letter-spacing:-.02em}
.bt .note{font-weight:400;font-size:11px;margin-left:6px}
#printArea .pg.fit{height:267mm;display:flex;flex-direction:column;overflow:hidden}
#printArea .pg.fit .pgb{flex:1;display:flex;flex-direction:column;justify-content:space-evenly}
#printArea .pg.fit .pgb > *{margin-top:0}
.chg{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:11px}
.chg .w{grid-column:1 / -1}
.chg h5{font-size:11.5px;margin:4px 0 3px}
.cb{display:grid;grid-template-columns:92px 1fr 64px;align-items:center;gap:6px;margin:2px 0}
.cb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb i{display:block;height:9px;background:#EEF0F3}.cb i b{display:block;height:100%;background:var(--acc-l)}
.cb.me i b{background:var(--acc)}.cb.me span{font-weight:700;color:var(--acc)}
.cb em{font-style:normal;color:var(--sub);font-variant-numeric:tabular-nums}
.cb2{display:grid;grid-template-columns:118px 1fr 74px;align-items:center;gap:6px;margin:2px 0}
.cb2 i{display:flex;flex-direction:column;gap:1px}.cb2 i b{display:block;height:5px;background:var(--acc)}.cb2 i b + b{background:var(--line2)}
.cb2 em{font-style:normal;color:var(--sub);font-size:10px}
.lg{font-size:10px;color:var(--sub);margin-left:6px;font-weight:400}.lg i{display:inline-block;width:10px;height:6px;background:var(--acc);margin:0 3px 0 6px}.lg i.c{background:var(--line2)}
.smap h5{font-size:11.5px;margin:4px 0 4px}
.smap ol{list-style:none;display:grid;gap:4px;padding:0;margin:0 0 6px}
.smap ol.d8{grid-template-columns:repeat(4,1fr)}.smap ol.d7{grid-template-columns:repeat(7,1fr)}
.smap li{border:1px solid var(--line2);padding:4px 6px;font-size:10px;line-height:1.3;position:relative;color:var(--sub)}
.smap li b{display:block;font-size:10.5px;color:var(--ink)}
.smap li.on{border-color:var(--acc);background:var(--acc-s);color:var(--ink)}
.smap li.on b::after{content:" ✓";color:var(--acc)}
.smap .off li{border-style:dashed}
/* 화면: A4 종이처럼 (좁은 화면은 통째로 줄여 보여 줘요) */
@media screen{
  #printArea .bpage{width:182mm;box-sizing:content-box;padding:14mm;margin:0 auto 18px;box-shadow:0 1px 3px rgba(0,0,0,.08),0 6px 24px rgba(0,0,0,.06)}
}
@page{size:A4;margin:14mm}
@media print{
  body{background:#fff}
  .top,.info{display:none!important}
  #printArea{zoom:1!important;padding:0}
  #printArea .bpage{margin:0;padding:0;box-shadow:none}
}
</style>
</head>
<body>
<header class="top"><div class="in">
  <h1>📄 나의 보고서<small>통합사회 AI활용탐구 · 데이터 실험실 · 알고리즘 실험실</small></h1>
  <span id="acts"></span>
</div></header>
<div class="info" id="info"><div class="card">여는 중…</div></div>
<div id="printArea"></div>
<script>
/* 학번 계정: 데이터 실험실(datalab:me) · 알고리즘 실험실(algolab:me)에 들어와 있으면 그대로, 아니면 여기서 학번 · 비밀번호로 열어요
   여기서 연 계정은 이 화면에서만 써요 (실험실에 들어간 것으로 남기지 않아요 · 다른 학생 기록과 섞이지 않게) */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const lsMe = (p) => { try { const v = JSON.parse(localStorage.getItem(p + ":me")); return v && v.key && v.sid ? v : null; } catch (e) { return null; } };
const fmtT = (ms) => new Date(ms).toLocaleString("ko-KR", { month: "long", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit" });
const R = { me: lsMe("datalab") || lsMe("algolab"), doc: null, busy: false, err: "" };
const BACK = `<div class="links"><a class="btn w" href="../">📊 데이터 실험실</a><a class="btn w" href="../../algolab/">🧩 알고리즘 실험실</a></div>`;

function fitZoom() {
  const pa = $("#printArea"), w = 210 * 96 / 25.4 + 16;   // A4 폭 + 여백
  pa.style.zoom = Math.min(1, (document.documentElement.clientWidth - 8) / w);
}
addEventListener("resize", fitZoom);

function render() {
  const info = $("#info"), pa = $("#printArea"), acts = $("#acts");
  if (!R.me) {
    acts.innerHTML = ""; pa.innerHTML = "";
    info.innerHTML = `<div class="card"><h2>학번과 비밀번호로 열어요</h2><p class="note">데이터 실험실 · 알고리즘 실험실에서 쓰는 학번 5자리와 비밀번호 4자리예요.</p>
      <div class="lgrow"><input id="sid" inputmode="numeric" maxlength="5" placeholder="학번 5자리" autocomplete="off"><input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="비밀번호 4자리" autocomplete="off"><button class="btn big" id="go" ${R.busy ? "disabled" : ""}>${R.busy ? "여는 중…" : "보고서 열기"}</button></div>
      <p class="bad">${esc(R.err)}</p><p class="note">비밀번호가 생각나지 않으면 선생님께 말씀해 주세요.</p>${BACK}</div>`;
    return;
  }
  const d = R.doc;
  if (!d) { info.innerHTML = `<div class="card">${esc(R.me.sid)} 학생의 보고서를 여는 중…</div>`; return; }
  const rep = d.rep;
  if (!rep || !rep.html) {
    acts.innerHTML = ""; pa.innerHTML = "";
    info.innerHTML = `<div class="card"><h2>${esc(R.me.sid)} 학생, 아직 선생님이 보고서를 보내지 않았어요</h2>
      <p>선생님이 반 보고서를 만들어 보내 주면 여기에 <b>선생님이 출력하는 것과 똑같은 보고서</b>(우리 반 탐구 이야기 · 나의 탐구 기록 · AI 피드백 · 그래프)가 나와요.</p>
      <p class="note">그 전에도 데이터 실험실의 각 탐구 → ‘나의 보고서’ 탭에서 탐구마다 한 장 보고서를 보고 인쇄할 수 있어요.</p>${BACK}</div>`;
    return;
  }
  const late = (d.updatedAt || 0) > rep.at;
  acts.innerHTML = `<button class="btn b big" data-act="print">🖨 인쇄 · PDF로 저장</button>`;
  info.innerHTML = `<div class="msg"><b>${esc(R.me.sid)} 학생의 보고서</b> · 선생님이 ${fmtT(rep.at)}에 보냈어요. 선생님이 출력하는 것과 똑같은 보고서예요.
    <br>인쇄 창에서 ‘PDF로 저장’을 고르면 파일로 간직할 수 있어요. 휴대폰에서는 공유 → 프린트(인쇄)로 PDF를 만들 수 있어요.</div>
    ${late ? `<div class="msg o">보고서를 받은 뒤(${fmtT(d.updatedAt)})에 고친 내용은 아직 들어가 있지 않아요. 고친 내용까지 넣으려면 선생님께 다시 보내 달라고 말씀드려요.</div>` : ""}`;
  pa.innerHTML = rep.html; fitZoom();
}

async function openDoc(me) {
  R.me = me; R.doc = null; render();
  try {
    const snap = await DL.fs.get(null, "datalab_members/" + me.key);
    if (!snap.exists) { R.me = null; R.err = "이 학번 · 비밀번호의 기록을 찾지 못했어요. 다시 확인해 주세요"; return render(); }
    R.doc = snap.data; render();
  } catch (e) { console.error(e); R.me = null; R.err = (DL.loginErr ? DL.loginErr(e) : "서버에 닿지 않아요. 잠시 뒤 다시 해 주세요"); render(); }
}
async function login() {
  const sid = $("#sid").value.trim(), pin = $("#pin").value.trim();
  if (!/^[0-9]{5}$/.test(sid)) { R.err = "학번은 숫자 다섯 자리예요 (예: 10305)"; return render(); }
  if (!/^[0-9]{4}$/.test(pin)) { R.err = "비밀번호는 숫자 네 자리예요"; return render(); }
  R.busy = true; R.err = ""; render();
  const key = await DL.keyOf(sid, pin); R.busy = false;
  openDoc({ sid, key });
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "go") return login();
  if (b.dataset.act === "print") return window.print();
});
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.target.id === "sid" || e.target.id === "pin")) login(); });
if (R.me) openDoc(R.me); else render();
</script>
<script type="module" src="/visit.js?app=datalab&hide=1"></script>
<script src="/refresh.js" defer></script>
</body>
</html>
