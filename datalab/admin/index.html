<style>
/* 선생님 화면: 학생 화면(연수 과정형)과 같은 문법 · 흰 바탕 · 남색 머리 띠 */
:root{--ink:#1A1A1A;--sub:#6E6E73;--line:#E5E5E8;--line2:#C9C9CF;--bg:#F7F7F8;--acc:#0057B8;--acc-s:#EAF2FC;--acc-l:#C9DCF3;--navy:#0E2A5C;--done:#0E8A5F;--warn:#B54708}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:400 14.5px/1.6 Pretendard,"Malgun Gothic",sans-serif;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.util{background:var(--navy);color:#C9D3E6;font-size:12.5px}
.util .in{max-width:1280px;margin:0 auto;padding:0 24px;height:34px;display:flex;align-items:center;justify-content:space-between}
.util b{color:#fff}
header{background:#fff;border-bottom:1px solid var(--line)}
header .in{max-width:1280px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;gap:30px}
.logo{font-size:18px;font-weight:800;letter-spacing:-.035em;display:flex;align-items:center;gap:10px;text-decoration:none}
.logo i{width:28px;height:28px;border:2px solid var(--ink);display:grid;place-items:center;font-style:normal;font-size:12px}
.logo small{font-size:12.5px;font-weight:600;color:var(--acc);margin-left:4px}
nav.tabs{display:flex;gap:4px;margin-left:auto}
nav.tabs button{height:64px;padding:0 14px;border:0;background:none;font-size:14.5px;font-weight:500;color:#444;border-bottom:2px solid transparent}
nav.tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
main{max-width:1280px;margin:0 auto;padding:26px 24px 70px}
.bar-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}

.bar-h p{color:var(--sub);font-size:13.5px}

.box h2{font-size:16.5px;margin-bottom:12px;letter-spacing:-.02em}
.kpi{display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border:1px solid var(--line);margin-bottom:16px}
.kpi div{padding:16px 18px;border-left:1px solid var(--line);font-size:13px;color:var(--sub)}
.kpi div:first-child{border-left:0}

table.tb{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff}
.tb th{border-top:2px solid var(--ink);background:var(--bg);padding:9px 8px;font-weight:600;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}

.hb{display:grid;grid-template-columns:220px 1fr 60px;gap:10px;align-items:center;height:26px;font-size:13px}

.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:46px;border:1px solid var(--line2);background:#fff;font-size:15px;font-weight:600}
/* 지도안 (인쇄용) */
.plan{background:#fff;border:1px solid var(--line);padding:30px 34px}
.plan h2{font-size:21px;text-align:center;letter-spacing:-.02em;margin-bottom:4px}
.plan .sub{text-align:center;color:var(--sub);font-size:13px;margin-bottom:18px}
.plan table{width:100%;border-collapse:collapse;font-size:12.8px;margin-bottom:14px}
.plan th,.plan td{border:1px solid #9AA3B2;padding:7px 8px;vertical-align:top;text-align:left}
.plan th{background:#EEF1F5;font-weight:700;text-align:center;white-space:nowrap}
.plan td.c{text-align:center;white-space:nowrap}
.plan ul{padding-left:16px}
#printArea{display:none}
@media print{
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  @page{size:A4;margin:14mm}
}
/* 인쇄 모양: #printArea 는 화면에서는 숨어 있다가 인쇄할 때만 보여요.
   그래서 아래 모양을 @media print 밖에 두어, 인쇄 직전에 화면 밖에서 쪽수를 잴 때(.measure)도 똑같이 적용돼요 */
#printArea.measure{display:block!important;position:absolute;left:-10000px;top:0;width:182mm;background:#fff}
#printArea .btn{display:none!important}
#printArea .plan,#printArea .paper{border:0;padding:0}
#printArea .bpage{break-after:page;page-break-after:always;margin:0}
#printArea > .bpage:last-child,#printArea > .stu:last-child > .bpage:last-child{break-after:auto;page-break-after:auto}   /* 맨 마지막 쪽만 (학생마다 묶음 .stu 안의 마지막 쪽은 그대로 쪽 나눔) */
#printArea .bpage section{break-inside:avoid;padding:4px 0}#printArea .fbbox{break-inside:avoid;padding:8px 12px;margin-top:8px}
#printArea .bpage h3{font-size:15px;margin-top:6px!important}#printArea .bpage .who{margin-bottom:4px;font-size:11px}
#printArea .bpage section h4,#printArea .fbbox h4{font-size:11px;margin-bottom:0}#printArea .bpage section p,#printArea .fbbox p{font-size:11.5px;line-height:1.5}
#printArea .stt,#printArea .top2{font-size:11px}#printArea .stt th,#printArea .stt td{padding:3px 5px}
/* 양면 맞춤 빈 쪽 · 우리 반 탐구 이야기(1쪽) */
#printArea .blankp{height:262mm;display:flex;align-items:flex-end;justify-content:center}
#printArea .blankp p{font-size:9px;color:#b5b5ba}
.storyp{height:262mm;overflow:hidden;display:flex;flex-direction:column;--fs:12.5px}
.storyp .sh{border-bottom:2px solid var(--acc);padding-bottom:8px;margin-bottom:12px}
.storyp .sh small{display:block;font-size:11px;color:var(--acc);font-weight:700;letter-spacing:.04em}
.storyp .sh h2{font-size:24px;letter-spacing:-.03em;margin:2px 0}
.storyp .sh p{font-size:11.5px;color:var(--sub)}
.storyp .sc{border:1px solid var(--line);border-left:3px solid var(--acc);padding:9px 12px;margin-bottom:9px;font-size:var(--fs);line-height:1.65;break-inside:avoid}
.storyp .sc h3{font-size:calc(var(--fs) * 1.2);margin-bottom:3px;letter-spacing:-.02em}
.storyp .sc ul{padding-left:16px}.storyp .sc p{white-space:pre-wrap}
/* 📚 1쪽 4 · 5칸 (2026-11-23): 알고리즘 실험실 소개 · 집에서도 이어서 (QR) */
.storyp .sc .s7{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.storyp .sc .s7 span{border:1px solid var(--acc-l);background:var(--acc-s);padding:1px 7px;font-size:calc(var(--fs) * .85)}
.storyp .lk2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.storyp .lk{display:flex;gap:10px;align-items:center;border:1px solid var(--line2);padding:8px 10px}
.storyp .lk .qr{width:64px;height:64px;flex:none}.storyp .lk .qr svg{width:100%;height:100%;display:block}
.storyp .lk b{display:block;font-size:calc(var(--fs) * 1.1)}.storyp .lk u{display:block;text-decoration:none;color:var(--acc);font-weight:700;font-size:calc(var(--fs) * .95)}
.storyp .lk p{font-size:calc(var(--fs) * .88);color:var(--sub);line-height:1.45;margin-top:2px}
/* 2 · 3쪽 (2026-11-23): 내 답 상자 · 통계 상자 / 피드백 · 세특 · 그래프 · 탐구 단계, 한 장에 들어가면 위아래 균형 있게 */
#printArea{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pgh{display:flex;justify-content:space-between}
.rbox{border:1.5px solid var(--ink);padding:10px 14px;margin-top:8px}
.rbox > h3:first-of-type{margin-top:4px!important}
.bt{font-size:13px!important;color:var(--ink)!important;margin-bottom:4px!important;letter-spacing:-.02em}
.bt .note{font-weight:400;font-size:11px;margin-left:6px}
#printArea .pg.fit{height:267mm;display:flex;flex-direction:column;overflow:hidden}
#printArea .pg.fit .pgb{flex:1;display:flex;flex-direction:column;justify-content:space-evenly}
#printArea .pg.fit .pgb > *{margin-top:0}
.chg{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:11px}
.chg .w{grid-column:1 / -1}
.chg h5{font-size:11.5px;margin:4px 0 3px}
.cb{display:grid;grid-template-columns:92px 1fr 64px;align-items:center;gap:6px;margin:2px 0}
.cb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb i{display:block;height:9px;background:#EEF0F3}.cb i b{display:block;height:100%;background:var(--acc-l)}
.cb.me i b{background:var(--acc)}.cb.me span{font-weight:700;color:var(--acc)}
.cb em{font-style:normal;color:var(--sub);font-variant-numeric:tabular-nums}
.cb2{display:grid;grid-template-columns:118px 1fr 74px;align-items:center;gap:6px;margin:2px 0}
.cb2 i{display:flex;flex-direction:column;gap:1px}.cb2 i b{display:block;height:5px;background:var(--acc)}.cb2 i b + b{background:var(--line2)}
.cb2 em{font-style:normal;color:var(--sub);font-size:10px}
.lg{font-size:10px;color:var(--sub);margin-left:6px;font-weight:400}.lg i{display:inline-block;width:10px;height:6px;background:var(--acc);margin:0 3px 0 6px}.lg i.c{background:var(--line2)}
.smap h5{font-size:11.5px;margin:4px 0 4px}
.smap ol{list-style:none;display:grid;gap:4px;padding:0;margin:0 0 6px}
.smap ol.d8{grid-template-columns:repeat(4,1fr)}.smap ol.d7{grid-template-columns:repeat(7,1fr)}
.smap li{border:1px solid var(--line2);padding:4px 6px;font-size:10px;line-height:1.3;position:relative;color:var(--sub)}
.smap li b{display:block;font-size:10.5px;color:var(--ink)}
.smap li.on{border-color:var(--acc);background:var(--acc-s);color:var(--ink)}
.smap li.on b::after{content:" ✓";color:var(--acc)}
.smap .off li{border-style:dashed}
.storyp .sf{margin-top:auto;padding-top:6px;border-top:1px solid var(--line);font-size:10px;color:var(--sub);display:flex;justify-content:space-between}
.storybox textarea{width:100%;min-height:110px;border:1px solid var(--line2);padding:10px;font:inherit;font-size:13px;margin-top:8px}
@media (max-width:900px){.two{grid-template-columns:1fr}.kpi{grid-template-columns:repeat(2,1fr)}nav.tabs{overflow-x:auto}}

<body>
<div class="util"><div class="in"><span>통합사회 데이터 실험실 · <b>선생님 화면</b></span><span id="who"></span></div></div>
<header><div class="in"><a class="logo" href="../"><i>DB</i>통합사회 데이터 실험실<small>선생님</small></a><nav class="tabs" id="tabs"></nav></div></header>
<main id="app"></main>
<div id="printArea"></div>
<script>
/* ===================== 선생님 화면 (moontr.site/datalab/admin/) =====================
   관리자 구글 계정으로만 들어와요(관리자가 아니면 바로 로그아웃). 학생 화면과 따로 둔 페이지예요.
   탭: 진행 현황 · 학생 보고서 · 세특 · 지도안 · 수업 실천 성찰 · 학생 관리
   AI(세특 초안 · 성찰문 초안)는 datalab/server 가 Firebase 로그인 표를 확인한 뒤에만 답해요. */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const { TOPICS, GROUPS, STEPS, REPORT, filled, stepDone, repVal } = DL;
const isAdmin = (e) => DL.ADMIN_EMAILS.includes(String(e || "").toLowerCase());
firebase.initializeApp(DL.FIREBASE_CONFIG);
const db = firebase.firestore(), auth = firebase.auth();
const A = { user: null, tab: location.hash.replace("#", "") || "prog", members: [], ban: "", sel: null, topic: TOPICS[0].id, out: {}, busy: false, msg: "" };
const TABS = [["prog", "진행 현황"], ["rep", "학생 보고서"], ["batch", "일괄 출력"], ["seteuk", "세특"], ["plan", "지도안"], ["refl", "수업 실천 성찰"], ["algo", "알고리즘 실험실"], ["users", "학생 관리"]];
const fmtT = (ms) => ms ? new Date(ms).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "—";
const topicsOf = (m) => TOPICS.filter((t) => (m.rec || {})[t.id] && (m.rec[t.id].s && Object.keys(m.rec[t.id].s).length));
const progOf = (t, x) => STEPS.filter((st) => stepDone(t, x, st.k)).length;
// 🖨 출력물 진도 (2026-11-23): 제출은 다섯 단계 이상이면 할 수 있어서, 제출한 탐구는 8단계를 모두 마친 것으로 보여 줘요
const progP = (t, x) => x.sub ? STEPS.length : progOf(t, x), stepP = (t, x, k) => !!x.sub || stepDone(t, x, k);
// 상태: 제출 · 멈춤 · 8단계 성찰 중(1~7단계를 다 마쳤거나 성찰을 쓰기 시작) · N단계 진행 중
// 2026-11-17 고침: 예전엔 '1~7단계 중 다섯 이상'이면 8단계로 봐서, 5단계를 쓰는 학생도 '8단계 성찰 중'으로 보였어요.
// 지금 단계 = 학생 화면이 남긴 활동 기록(x.log)의 마지막 단계, 기록이 없으면 아직 안 끝난 첫 단계
const stageOf = (m, t) => { const x = m.rec[t.id] || {}, s = x.s || {}; if (x.sub) return ["d", "제출"]; if ((m.stop || {})[t.id]) return ["w", "멈춤"];
  const all7 = STEPS.slice(0, 7).every((st) => stepDone(t, x, st.k));
  if (all7 || filled(s.reflect) || filled(s.aiRef)) return ["r", "8단계 성찰 중"];
  const last = (x.log || [])[(x.log || []).length - 1]; let i = last ? STEPS.findIndex((st) => st.k === last.k) : -1;
  if (i < 0 || i >= 7) i = Math.max(0, STEPS.findIndex((st) => !stepDone(t, x, st.k)));
  return ["o", `${i + 1}단계 진행 중`]; };
const stageTag = (m, t) => { const [c, n] = stageOf(m, t); return `<span class="st ${c}">${n}</span>`; };
const bans = () => [...new Set(A.members.map((m) => m.ban))].sort((a, b) => a.localeCompare(b, "ko", { numeric: true }));
const inBan = () => A.members.filter((m) => !A.ban || m.ban === A.ban).sort((a, b) => a.sid.localeCompare(b.sid));
const nbytes = (s) => { let b = 0; for (const ch of String(s || "")) b += ch === "\n" ? 2 : ch.charCodeAt(0) > 127 ? 3 : 1; return b; };

/* ---------- 로그인 ---------- */
auth.onAuthStateChanged((u) => {
  if (u && !isAdmin(u.email)) { auth.signOut(); A.msg = "관리자 구글 계정이 아니에요. 관리자 계정으로 다시 로그인해 주세요."; A.user = null; return render(); }

  const tok = await auth.currentUser.getIdToken();
  const r = await fetch(DL.AI_URL + path, { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + tok }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({})); if (!r.ok || j.error) throw new Error(j.error || ("서버 " + r.status)); return j;
}

    ai: (x.ai || []).slice(-6).map((a) => a.k === "review" ? `[AI 검토] 수치 ${a.scores.data} · 원인 ${a.scores.other} · 윤리 ${a.scores.concept}` : `[질문] ${a.q}`) }; }),
    ...algoOf(m).map(([id, x]) => ({ topic: `알고리즘 실험실 · ${ALGO.NAMES[id][1]} (판단 규칙을 카드로 조립하는 알고리즘 설계 탐구)`, steps: `${Object.keys(x.done || {}).length}/7단계${x.sub ? " · 제출" : ""}`,
      report: { "고른 규칙": algoRule(id, x.s), "가치 검토": String(x.s.why || "").slice(0, 600), "공정성 시험: 손해 보는 사람과 고칠 점": String(x.s.loser || "").slice(0, 600), "마치며": String(x.s.ref || "").slice(0, 600) },
      ai: (x.ai || []).slice(-4).map((a) => `[질문] ${a.q}`) }))];
}

/* 🧩 알고리즘 실험실 (/algolab): 같은 학번 문서의 rec["a_주제"] 를 읽어요 */
const algoOf = (m) => Object.entries(m.rec || {}).filter(([k, x]) => k.startsWith("a_") && x && x.s).map(([k, x]) => [k.slice(2), x]).filter(([id]) => ALGO.A[id]);
function algoRule(id, s) {
  const g = ALGO.A[id], c = g.crit.find((v) => v.id === s.crit); if (!c) return "아직 기준을 고르지 않음";
  const P = g.param, hp = P && [].concat(P.crit).includes(s.crit);
  return c.name + (hp ? ` · ${s.p}${P.unit}` : "") + g.optc.filter((o) => s[o.id]).map((o) => ` · ${o.n ? `${o.text} ${s[o.id + "N"]}${o.after}` : o.text.split("→")[0].replace(/^만약 /, "").trim()}`).join("");
}

    <p class="note" style="margin:10px 0 4px">5 · 가치 검토</p><p style="white-space:pre-wrap">${esc(x.s.why || "—")}</p>
    <p class="note" style="margin:10px 0 4px">6 · 공정성 시험: 손해 보는 사람과 고칠 점</p><p style="white-space:pre-wrap">${esc(x.s.loser || "—")}</p>

function repView() {

/* 🖨 일괄 출력 (2026-11-17): 반을 고르면 활동한 학생만 한 사람에 한 장씩
   보고서(데이터 실험실 · 알고리즘 실험실) + AI 피드백(학생에게: 잘한 점 · 격려) + 예상 세특(선택)
   AI 글은 학생 문서 fb { praise, cheer, seteuk, at } 에 저장해 두고, 학생이 그 뒤에 기록을 고쳤을 때만 다시 만들어요

const subT = (m) => topicsOf(m).filter((t) => !B.subOnly || m.rec[t.id].sub);
const subG = (m) => algoDid(m).filter(([, x]) => !B.subOnly || x.sub);
const hasSub = (m) => topicsOf(m).some((t) => m.rec[t.id].sub) || algoDid(m).some(([, x]) => x.sub);

/* 📊 우리 반 · 학년 통계 (2026-11-17 문쌤 요청): 한 장마다 '나 · 우리 반 · 학년'을 숫자로 비교해요 (학번 · 이름은 안 나와요)
   우리 반 = 같은 반(m.ban), 학년 = 학번 첫 자리가 같은 학생. 활동한 학생(탐구나 알고리즘을 시작한 학생)만 셉니다 */
let STC = {};   // 반 · 학년 통계를 한 번만 계산해 두는 곳 (일괄 출력 화면을 그릴 때마다 비워요)
const grpStat = (key, L) => STC[key] || (STC[key] = (() => {
  const act = L.filter(active), all = act.flatMap((m) => topicsOf(m).map((t) => [t, m.rec[t.id]])), tc = {}, ac = {};
  all.forEach(([t]) => { tc[t.id] = (tc[t.id] || 0) + 1; });
  act.forEach((m) => algoDid(m).forEach(([id]) => { ac[id] = (ac[id] || 0) + 1; }));
  return { n: act.length, tc, ac, top: Object.entries(tc).sort((a, b) => b[1] - a[1]).slice(0, 5),
    prog: all.length ? all.reduce((s, [t, x]) => s + progP(t, x), 0) / all.length : 0, steps: STEPS.map((st) => all.length ? all.filter(([t, x]) => stepP(t, x, st.k)).length / all.length * 100 : 0), sub: all.length ? Math.round(all.filter(([, x]) => x.sub).length / all.length * 100) : 0 };
})());
function statBox(m) {

  const stepsC = T.length ? `<div class="stp"><b>📶 단계별 완료율 <span class="lg"><i></i>${esc(m.ban)}반<i class="c"></i>${esc(g)}학년</span></b>${STEPS.map((st, i) => `<div class="cb2"><span>${i + 1}. ${esc(st.name)}</span><i><b style="width:${C.steps[i]}%"></b><b style="width:${G.steps[i]}%"></b></i><em>반 ${Math.round(C.steps[i])}% · 학년 ${Math.round(G.steps[i])}%</em></div>`).join("")}</div>` : "";

    <table class="stt"><thead><tr><th class="l"></th><th>나</th><th>우리 반</th><th>학년</th></tr></thead><tbody>
      ${T.map((t) => `<tr><td class="l">내가 고른 주제 · ${t.no}. ${esc(t.name)}</td><td>✓</td><td>${pick(C, C.tc, t.id)}</td><td>${pick(G, G.tc, t.id)}</td></tr>`).join("")}
      ${AL.map(([id]) => `<tr><td class="l">내가 고른 알고리즘 · ${esc(ALGO.NAMES[id][0])}</td><td>✓</td><td>${pick(C, C.ac, id)}</td><td>${pick(G, G.ac, id)}</td></tr>`).join("")}

    </tbody></table>
    <div class="top2"><div><b>🗳 우리 반이 많이 고른 주제</b>${top(C)}</div><div><b>🗳 ${esc(g)}학년이 많이 고른 주제</b>${top(G)}</div></div>${stepsC}</div>`;

const STORY_KEY = (ban) => "dl_story_" + ban;

const cutS = (s, n) => { s = String(s || "").replace(/\s+/g, " ").trim(); return s.length > n ? s.slice(0, n) + "…" : s; };
// 학생용 글에 혹시 남은 S01 같은 번호는 지워요
const storyClean = (t) => String(t || "").replace(/\s*[(\[]\s*S\d{2}(?:\s*[,·/와과및]\s*S\d{2})*\s*[)\]]/g, "").replace(/\bS\d{2}\b\s*(?:학생|친구)?\s*(?:은|는|이|가|의)?\s*/g, "");
// 🏫 이 반이 한 실험실 · 고른 주제의 사상가 (2026-11-23): 데이터 실험실만 한 반은 '두 실험실'이라고 쓰지 않게

  return { data: T.length > 0, algo: L.some((m) => algoDid(m).length > 0), gj: T.some((t) => t.g === "j"), gm: T.some((t) => t.g === "m"), thj: th("j"), thm: th("m") };
}
function storyPrompt(ban) {

  const I = classInfo(ban), labs = I.data && I.algo ? "두 실험실(데이터 실험실 · 알고리즘 실험실)" : I.algo ? "알고리즘 실험실" : "데이터 실험실";

// 붙여 넣은 글 → '## 제목' 마다 칸 하나
function storyCards(text) {
  return String(text || "").split(/^\s*#{1,3}\s+/m).map((p) => p.trim()).filter(Boolean).map((p) => {
    const [h, ...rest] = p.split("\n"), lines = rest.map((l) => l.trim()).filter(Boolean);
    let html = "", ul = false;
    lines.forEach((l) => { const li = /^[-*•]\s+/.test(l); if (li && !ul) { html += "<ul>"; ul = true; } if (!li && ul) { html += "</ul>"; ul = false; } const t = esc(l.replace(/^[-*•]\s+/, "")).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>"); html += li ? `<li>${t}</li>` : `<p>${t}</p>`; });
    if (ul) html += "</ul>";
    return rest.length ? `<div class="sc"><h3>${esc(h.replace(/\*\*/g, ""))}</h3>${html}</div>` : `<div class="sc"><p>${esc(h)}</p></div>`;

async function makeAll(list) {

  <div class="box"><h2>AI 검토 뒤 고쳐 쓰기</h2><p style="font-size:14px">AI 검토를 두 번 이상 받은 탐구 ${firsts.length}개에서, 첫 검토보다 마지막 검토의 점수(수치 인용 · 다른 원인 · 윤리적 근거, 6점 만점)가 평균 <b>${gain >= 0 ? "+" : ""}${gain.toFixed(2)}점</b> 바뀌었어요.</p><p class="note" style="margin-top:8px">AI 서버 검토 ${reviews.length}회 · 기본 점검 포함 전체 ${stats.AI검토}회 · 탐구 파트너 질문 ${stats.AI질문}회</p></div></div>
  <div class="box"><h2>학생 보고서 예시 (이름 · 학번 없이)</h2>${samples.map((s) => `<div class="paper" style="padding:16px 18px"><div class="who">${esc(s.주제)}</div><section><h4>결과</h4><p>${esc(s.결과)}</p></section><section><h4>해결안</h4><p>${esc(s.해결안)}</p></section><section><h4>AI 활용 성찰</h4><p>${esc(s.AI성찰)}</p></section></div>`).join("") || `<p class="note">제출한 보고서가 생기면 여기에 세 개까지 보여요</p>`}</div>
  <div class="box"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 style="margin:0">성찰문 초안</h2><button class="btn b sm" data-act="aiRefl" ${A.busy ? "disabled" : ""}>AI로 초안</button></div><textarea data-refl style="margin-top:10px" placeholder="위 통계와 예시를 바탕으로 AI가 초안을 써 줘요. 내 경험과 느낀 점으로 고쳐 써 주세요">${esc(draft)}</textarea></div></div>`;
}

function usersView() {
  const L = inBan();
  return `<div class="bar-h"><div><h1>학생 관리</h1><p>비밀번호를 잊은 학생은 새 비밀번호로 기록을 옮겨 줘요 (예전 비밀번호 기록은 지워져요)</p></div><div class="ctl">${banSel()}</div></div>
  <div class="box"><table class="tb"><thead><tr><th>학번</th><th>반</th><th>탐구</th><th>처음 들어온 때</th><th>새 비밀번호(숫자 4자리)</th><th></th></tr></thead><tbody>
  ${L.map((m) => `<tr><td><b>${esc(m.sid)}</b></td><td>${esc(m.ban)}</td><td>${topicsOf(m).length}개</td><td>${fmtT(m.at)}</td><td><input inputmode="numeric" maxlength="4" data-pin="${m.key}" style="width:110px"></td><td><button class="btn w sm" data-act="resetPin" data-v="${m.key}">비밀번호 바꾸기</button> <button class="btn w sm" data-act="delMember" data-v="${m.key}">기록 지우기</button></td></tr>`).join("") || `<tr><td colspan="6" class="note">학생이 없어요</td></tr>`}</tbody></table></div>`;
}

/* ---------- 누르기 ---------- */
document.addEventListener("change", (e) => {
  const a = e.target.dataset.act;
  if (a === "ban") { A.ban = e.target.value; A.banSet = true; A.sel = null; render(); }
  if (a === "topic") { A.topic = e.target.value; render(); }
});
document.addEventListener("input", (e) => { if (e.target.dataset.sk) A.out[e.target.dataset.sk] = e.target.value; if (e.target.hasAttribute("data-refl")) A.out.refl = e.target.value; });
document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-act]"); if (!b || b.tagName === "SELECT") return;
  const a = b.dataset.act, v = b.dataset.v, m = A.members.find((x) => x.key === v);
  if (a === "login") return login();
  if (a === "logout") { e.preventDefault(); return auth.signOut(); }
  if (a === "tab") { A.tab = v; A.msg = ""; history.replaceState(null, "", "#" + v); return render(); }
  if (a === "see" || a === "sel") { A.sel = v; A.tab = "rep"; render(); if (b.dataset.t) { const el = document.getElementById(`p_${v.slice(0, 8)}_${b.dataset.t}`); if (el) el.scrollIntoView({ block: "start" }); } return; }
  if (a === "algoF") { A.algoF = v; return render(); }
  if (a === "bSk") { B.seteuk = b.checked; return render(); }
  if (a === "bSt") { B.stat = b.checked; return render(); }
  if (a === "bMake") return makeAll(batchList().filter((x) => fbState(x) !== "ok"));
  if (a === "bSub") { B.subOnly = b.checked; return render(); }
  if (a === "bOne") return makeAll([m]);
  if (a === "bSy") { B.story = b.checked; return render(); }
  if (a === "bDx") { B.duplex = b.checked; return; }
  if (a === "storyCopy") { if (!A.ban) return; const q = storyPrompt(A.ban); try { await navigator.clipboard.writeText(q); b.textContent = "복사됨"; } catch (er) { prompt("아래를 복사해요", q); } return; }
  if (a === "bPrint") {
    if (B.story && A.ban && !storyGet(A.ban).trim() && !confirm(`${A.ban}반 '우리 반 탐구 이야기'가 아직 없어요.\n그대로 인쇄하면 1쪽 없이 보고서만 나와요. 계속할까요?\n\n(취소하면 아래 칸에서 먼저 만들 수 있어요)`)) { document.getElementById("storyIn")?.scrollIntoView({ block: "center" }); return; }
    return printBatch();
  }
  if (a === "printRep") { $("#printArea").innerHTML = paper(DL.topic(b.dataset.t), m); return window.print(); }
  if (a === "printPlan") { $("#printArea").innerHTML = planHTML(DL.topic(A.topic)); return window.print(); }
  if (a === "printRefl") { $("#printArea").innerHTML = $("#reflDoc").outerHTML; return window.print(); }
  if (a === "copyPrompt") { try { await navigator.clipboard.writeText(promptOf(m)); b.textContent = "복사됨"; } catch (er) { prompt("아래를 복사해요", promptOf(m)); } return; }
  if (a === "aiSeteuk") {
    A.busy = true; render();
    try { const j = await callAdminAI("/seteuk", { evidence: evidence(m) }); A.out[v] = j.text; A.msg = ""; } catch (er) { A.msg = "AI 서버에 연결하지 못했어요 (" + er.message + "). ‘프롬프트 복사’로 다른 AI에 붙여 넣어 쓸 수 있어요."; }
    A.busy = false; return render();
  }
  if (a === "saveSeteuk") { const txt = A.out[v] ?? m.seteuk ?? ""; await db.collection("datalab_members").doc(v).update({ seteuk: txt, seteukAt: Date.now() }); A.msg = `${m.sid} 세특을 저장했어요`; return render(); }
  if (a === "aiRefl") {
    A.busy = true; render();
    try { const j = await callAdminAI("/reflect", A.reflData); A.out.refl = j.text; A.msg = ""; } catch (er) { A.msg = "AI 서버에 연결하지 못했어요 (" + er.message + ")"; }
    A.busy = false; return render();
  }
  if (a === "resetPin") {
    const pin = (document.querySelector(`[data-pin="${v}"]`).value || "").trim();
    if (!/^[0-9]{4}$/.test(pin)) return alert("새 비밀번호는 숫자 네 자리예요");
    if (!confirm(`${m.sid} 학생의 비밀번호를 ${pin}(으)로 바꿀까요? 학생에게 새 비밀번호를 알려 주세요.`)) return;
    const nk = await DL.keyOf(m.sid, pin); if (nk === v) return alert("지금과 같은 비밀번호예요");
    const { key, ...data } = m, bt = db.batch(); bt.set(db.collection("datalab_members").doc(nk), { ...data, updatedAt: Date.now() }); bt.delete(db.collection("datalab_members").doc(v)); await bt.commit();
    A.msg = `${m.sid} 학생의 비밀번호를 바꿨어요`; return render();
  }
  // 주제 바꾸기 허락: 그 탐구를 멈춤(stop.주제)으로 → 학생이 '다시 확인'을 누르거나 다시 열면 새 주제를 시작할 수 있어요
  if (a === "stopT" || a === "unstopT") {
    const t = DL.topic(b.dataset.t);
    if (a === "stopT" && !confirm(`${m.sid} 학생의 ‘${t.no}. ${t.name}’ 탐구를 멈추고, 다른 주제를 시작할 수 있게 할까요?\n쓴 내용은 그대로 남고, ‘다시 열기’로 되돌릴 수 있어요.`)) return;
    try { await db.collection("datalab_members").doc(v).update({ ["stop." + t.id]: a === "stopT" ? Date.now() : firebase.firestore.FieldValue.delete() }); A.msg = a === "stopT" ? `${m.sid} 학생이 이제 다른 주제를 시작할 수 있어요. 학생 화면에서 ‘다시 확인’을 누르게 해 주세요` : `${m.sid} 학생의 ‘${t.name}’ 탐구를 다시 열었어요`; }
    catch (er) { A.msg = "바꾸지 못했어요 (" + (er.code || er.message) + ")"; }
    return render();
  }
  // 학생 화면의 반별 단계 완료율을 지금 학생 기록으로 다시 만들어요 (지운 학생 빼기)
  if (a === "cpSync") {
    const P = {};
    A.members.forEach((mm) => { const T = topicsOf(mm); if (!T.length || !mm.ban) return; const t = DL.topic(mm.rec.last) && mm.rec[mm.rec.last] ? DL.topic(mm.rec.last) : T[T.length - 1];
      (P[mm.ban] = P[mm.ban] || {})[mm.key.slice(0, 24)] = STEPS.map((st) => stepDone(t, mm.rec[t.id], st.k) ? 1 : 0).join(""); });
    try { const old = await db.collection("datalab_prog").get(), bt = db.batch(); old.docs.forEach((d) => { if (!P[d.id]) bt.delete(d.ref); }); Object.entries(P).forEach(([bn, p]) => bt.set(db.collection("datalab_prog").doc(bn), { p })); await bt.commit(); A.msg = `반별 완료율을 다시 맞췄어요 (${Object.keys(P).length}개 반)`; }
    catch (er) { A.msg = "다시 맞추지 못했어요 (" + (er.code || er.message) + "). Firestore 규칙에 datalab_prog 가 게시되었는지 확인해 주세요."; }
    return render();
  }
  if (a === "delMember") {
    if (!confirm(`${m.sid} 학생의 탐구 기록을 모두 지울까요? 되돌릴 수 없어요.`)) return;
    const bt = db.batch(); bt.delete(db.collection("datalab_members").doc(v)); bt.delete(db.collection("datalab_ids").doc(m.sid)); await bt.commit();
    A.msg = `${m.sid} 학생의 기록을 지웠어요 (같은 학번으로 다시 처음부터 시작할 수 있어요)`; return render();
  }
});
render();
</script>
<script type="module" src="/visit.js?app=datalab&hide=1"></script>
</body>
</html>
