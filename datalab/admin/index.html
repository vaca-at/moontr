<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>선생님 화면 · 통합사회 데이터 실험실</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="../topics.js?v=11170900"></script>
<script src="../../algolab/algos.js?v=11161900"></script>
<style>
/* 선생님 화면: 학생 화면(연수 과정형)과 같은 문법 · 흰 바탕 · 남색 머리 띠 */
:root{--ink:#1A1A1A;--sub:#6E6E73;--line:#E5E5E8;--line2:#C9C9CF;--bg:#F7F7F8;--acc:#0057B8;--acc-s:#EAF2FC;--acc-l:#C9DCF3;--navy:#0E2A5C;--done:#0E8A5F;--warn:#B54708}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:400 14.5px/1.6 Pretendard,"Malgun Gothic",sans-serif;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.util{background:var(--navy);color:#C9D3E6;font-size:12.5px}
.util .in{max-width:1280px;margin:0 auto;padding:0 24px;height:34px;display:flex;align-items:center;justify-content:space-between}
.util b{color:#fff}
header{background:#fff;border-bottom:1px solid var(--line)}
header .in{max-width:1280px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;gap:30px}
.logo{font-size:18px;font-weight:800;letter-spacing:-.035em;display:flex;align-items:center;gap:10px;text-decoration:none}
.logo i{width:28px;height:28px;border:2px solid var(--ink);display:grid;place-items:center;font-style:normal;font-size:12px}
.logo small{font-size:12.5px;font-weight:600;color:var(--acc);margin-left:4px}
nav.tabs{display:flex;gap:4px;margin-left:auto}
nav.tabs button{height:64px;padding:0 14px;border:0;background:none;font-size:14.5px;font-weight:500;color:#444;border-bottom:2px solid transparent}
nav.tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
main{max-width:1280px;margin:0 auto;padding:26px 24px 70px}
.bar-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.bar-h h1{font-size:23px;letter-spacing:-.035em}
.bar-h p{color:var(--sub);font-size:13.5px}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input[type=text],input[inputmode],textarea{border:1px solid var(--line2);background:#fff;padding:8px 10px;font-size:14px;border-radius:0;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--ink)}
textarea{width:100%;min-height:150px;resize:vertical;line-height:1.7}
.btn{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 14px;border:1px solid var(--ink);background:var(--ink);color:#fff;font-size:13.5px;font-weight:600;white-space:nowrap}
.btn.w{background:#fff;color:var(--ink);border-color:var(--line2)}
.btn.b{background:var(--acc);border-color:var(--acc)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.box{background:#fff;border:1px solid var(--line);padding:20px 22px;margin-bottom:16px}
.box h2{font-size:16.5px;margin-bottom:12px;letter-spacing:-.02em}
.kpi{display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border:1px solid var(--line);margin-bottom:16px}
.kpi div{padding:16px 18px;border-left:1px solid var(--line);font-size:13px;color:var(--sub)}
.kpi div:first-child{border-left:0}
.kpi b{display:block;font-size:24px;color:var(--ink);letter-spacing:-.02em;margin-top:2px}
table.tb{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff}
.tb th{border-top:2px solid var(--ink);background:var(--bg);padding:9px 8px;font-weight:600;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.tb td{padding:8px;border-bottom:1px solid var(--line);text-align:center;font-variant-numeric:tabular-nums;vertical-align:middle}
.tb td.l{text-align:left}
.tb tr:hover td{background:#FAFAFB}
.dots{display:inline-flex;gap:2px}
.dots i{width:12px;height:12px;background:#E5E7EB}
.dots i.on{background:var(--acc)}
.dots i.sub{background:var(--done)}
.st{font-size:12px;font-weight:600;padding:2px 7px;border:1px solid;white-space:nowrap}
.st.d{color:var(--done);border-color:#B7E0D1;background:#F1FAF6}.st.o{color:var(--acc);border-color:var(--acc-l);background:var(--acc-s)}.st.w{color:#999;border-color:var(--line)}.st.r{color:#7A4B00;border-color:#F5D58A;background:#FFF8E6}
.hb{display:grid;grid-template-columns:220px 1fr 60px;gap:10px;align-items:center;height:26px;font-size:13px}
.hb i{display:block;height:10px;background:var(--acc)}
.hb em{font-style:normal;text-align:right}
.two{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.list{background:#fff;border:1px solid var(--line);max-height:70vh;overflow:auto}
.list button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left;font-size:13.5px}
.list button.on{background:var(--acc-s);color:var(--acc);font-weight:700}
.paper{background:#fff;border:1px solid var(--line);padding:26px 30px;margin-bottom:14px}
.paper h3{font-size:19px;letter-spacing:-.03em}
.paper .who{font-size:12.5px;color:var(--sub);margin-bottom:12px}
.paper section{padding:10px 0;border-top:1px solid var(--line)}
.paper section h4{font-size:13px;color:var(--acc);margin-bottom:2px}
.paper section p{white-space:pre-wrap;font-size:14px}
.ailog{font-size:13px;color:#444}
.ailog div{padding:6px 0;border-top:1px dashed var(--line)}
.note{font-size:12.5px;color:var(--sub)}
.msg{padding:10px 14px;border:1px solid var(--acc-l);background:var(--acc-s);color:#1F3B63;font-size:13.5px;margin-bottom:14px}
.login{max-width:440px;margin:80px auto;background:#fff;border:1px solid var(--line);padding:34px}
.login h1{font-size:22px;letter-spacing:-.03em;margin-bottom:6px}
.login p{color:var(--sub);font-size:13.5px;margin-bottom:20px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:46px;border:1px solid var(--line2);background:#fff;font-size:15px;font-weight:600}
/* 지도안 (인쇄용) */
.plan{background:#fff;border:1px solid var(--line);padding:30px 34px}
.plan h2{font-size:21px;text-align:center;letter-spacing:-.02em;margin-bottom:4px}
.plan .sub{text-align:center;color:var(--sub);font-size:13px;margin-bottom:18px}
.plan table{width:100%;border-collapse:collapse;font-size:12.8px;margin-bottom:14px}
.plan th,.plan td{border:1px solid #9AA3B2;padding:7px 8px;vertical-align:top;text-align:left}
.plan th{background:#EEF1F5;font-weight:700;text-align:center;white-space:nowrap}
.plan td.c{text-align:center;white-space:nowrap}
.plan ul{padding-left:16px}
#printArea{display:none}
@media print{
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  #printArea .btn{display:none!important}
  #printArea .plan,#printArea .paper{border:0;padding:0}
  @page{size:A4;margin:14mm}
}
@media (max-width:900px){.two{grid-template-columns:1fr}.kpi{grid-template-columns:repeat(2,1fr)}nav.tabs{overflow-x:auto}}
</style>
</head>
<body>
<div class="util"><div class="in"><span>통합사회 데이터 실험실 · <b>선생님 화면</b></span><span id="who"></span></div></div>
<header><div class="in"><a class="logo" href="../"><i>통</i>통합사회 데이터 실험실<small>선생님</small></a><nav class="tabs" id="tabs"></nav></div></header>
<main id="app"></main>
<div id="printArea"></div>
<script>
/* ===================== 선생님 화면 (moontr.site/datalab/admin/) =====================
   관리자 구글 계정으로만 들어와요(관리자가 아니면 바로 로그아웃). 학생 화면과 따로 둔 페이지예요.
   탭: 진행 현황 · 학생 보고서 · 세특 · 지도안 · 수업 실천 성찰 · 학생 관리
   AI(세특 초안 · 성찰문 초안)는 datalab/server 가 Firebase 로그인 표를 확인한 뒤에만 답해요. */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const { TOPICS, GROUPS, STEPS, REPORT, filled, stepDone, repVal } = DL;
const isAdmin = (e) => DL.ADMIN_EMAILS.includes(String(e || "").toLowerCase());
firebase.initializeApp(DL.FIREBASE_CONFIG);
const db = firebase.firestore(), auth = firebase.auth();
const A = { user: null, tab: location.hash.replace("#", "") || "prog", members: [], ban: "", sel: null, topic: TOPICS[0].id, out: {}, busy: false, msg: "" };
const TABS = [["prog", "진행 현황"], ["rep", "학생 보고서"], ["seteuk", "세특"], ["plan", "지도안"], ["refl", "수업 실천 성찰"], ["algo", "알고리즘 실험실"], ["users", "학생 관리"]];
const fmtT = (ms) => ms ? new Date(ms).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "—";
const topicsOf = (m) => TOPICS.filter((t) => (m.rec || {})[t.id] && (m.rec[t.id].s && Object.keys(m.rec[t.id].s).length));
const progOf = (t, x) => STEPS.filter((st) => stepDone(t, x, st.k)).length;
// 상태: 제출 · 멈춤 · 8단계 성찰 중(1~7단계 가운데 다섯 이상 마쳤거나 성찰을 쓰기 시작) · 진행 중
const stageOf = (m, t) => { const x = m.rec[t.id] || {}, s = x.s || {}; if (x.sub) return ["d", "제출"]; if ((m.stop || {})[t.id]) return ["w", "멈춤"];
  const n7 = STEPS.slice(0, 7).filter((st) => stepDone(t, x, st.k)).length; return n7 >= 5 || String(s.reflect || s.aiRef || "").trim() ? ["r", "8단계 성찰 중"] : ["o", "진행 중"]; };
const stageTag = (m, t) => { const [c, n] = stageOf(m, t); return `<span class="st ${c}">${n}</span>`; };
const bans = () => [...new Set(A.members.map((m) => m.ban))].sort((a, b) => a.localeCompare(b, "ko", { numeric: true }));
const inBan = () => A.members.filter((m) => !A.ban || m.ban === A.ban).sort((a, b) => a.sid.localeCompare(b.sid));
const nbytes = (s) => { let b = 0; for (const ch of String(s || "")) b += ch === "\n" ? 2 : ch.charCodeAt(0) > 127 ? 3 : 1; return b; };

/* ---------- 로그인 ---------- */
auth.onAuthStateChanged((u) => {
  if (u && !isAdmin(u.email)) { auth.signOut(); A.msg = "관리자 구글 계정이 아니에요. 관리자 계정으로 다시 로그인해 주세요."; A.user = null; return render(); }
  A.user = u; if (u) watch(); render();
});
function login() { const p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({ prompt: "select_account" }); auth.signInWithPopup(p).catch((e) => { A.msg = "로그인하지 못했어요 (" + (e.code || e.message) + ")"; render(); }); }
let unsub = null;
function watch() {
  if (unsub) return;
  unsub = db.collection("datalab_members").onSnapshot((q) => { A.members = q.docs.map((d) => ({ key: d.id, ...d.data() })); if (!A.ban) A.ban = bans()[0] || ""; render(); }, (e) => { A.msg = "학생 기록을 불러오지 못했어요 (" + e.code + "). Firestore 보안 규칙에 datalab 규칙이 게시되었는지 확인해 주세요."; render(); });
}

/* ---------- AI (서버 datalab/server) ---------- */
async function callAdminAI(path, body) {
  const tok = await auth.currentUser.getIdToken();
  const r = await fetch(DL.AI_URL + path, { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + tok }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({})); if (!r.ok || j.error) throw new Error(j.error || ("서버 " + r.status)); return j;
}
// 세특 재료: 학번 · 이름 없이 제출한 탐구만
function evidence(m) {
  return [...topicsOf(m).map((t) => { const x = m.rec[t.id]; return { topic: `AI활용탐구 ${t.no} ${t.title}`, group: GROUPS[t.g].name, steps: `${progOf(t, x)}/8단계${x.sub ? " · 제출" : ""}`, claim: t.claim,
    report: Object.fromEntries(REPORT.map(([k, n]) => [n, String(repVal(t, x, k) || "").slice(0, 700)])),
    ai: (x.ai || []).slice(-6).map((a) => a.k === "review" ? `[AI 검토] 수치 ${a.scores.data} · 원인 ${a.scores.other} · 윤리 ${a.scores.concept}` : `[질문] ${a.q}`) }; }),
    ...algoOf(m).map(([id, x]) => ({ topic: `알고리즘 실험실 · ${ALGO.NAMES[id][1]} (판단 규칙을 카드로 조립하는 알고리즘 설계 탐구)`, steps: `${Object.keys(x.done || {}).length}/7단계${x.sub ? " · 제출" : ""}`,
      report: { "고른 규칙": algoRule(id, x.s), "가치 검토": String(x.s.why || "").slice(0, 600), "공정성 시험: 손해 보는 사람과 고칠 점": String(x.s.loser || "").slice(0, 600), "마치며": String(x.s.ref || "").slice(0, 600) },
      ai: (x.ai || []).slice(-4).map((a) => `[질문] ${a.q}`) }))];
}
const promptOf = (m) => `아래는 고등학교 통합사회 ‘AI활용탐구’(데이터 분석 · 8단계 문제해결학습)에서 한 학생이 실제로 남긴 탐구 기록이다. 이 기록만 근거로 학교생활기록부 ‘세부능력 및 특기사항’ 문장을 써 줘.
- 500자 안팎(공백 포함), 한 문단, ‘~함.’ ‘~임.’처럼 명사형으로 끝맺기
- 학생 이름 · 학번은 쓰지 말고 주어를 생략하기
- 탐구 주제, 데이터 정제 · 계산 · 시각화 과정, AI의 주장을 데이터로 검증한 장면, 개념(교정적 정의 또는 자본주의의 윤리적 쟁점) 연결, 해결안과 실행물, 성찰 가운데 실제로 기록에 있는 것만 구체적으로
- 기록에 없는 활동 · 수상 · 외부 대회 · 사교육 · 부모 직업은 쓰지 않기, 과장하는 꾸밈말(뛰어난, 탁월한) 쓰지 않기
[탐구 기록]
${JSON.stringify(evidence(m), null, 1)}`;

/* ---------- 화면 ---------- */
function render() {
  $("#who").innerHTML = A.user ? `${esc(A.user.email.replace(/@.*/, "@…"))} · <a href="#" data-act="logout" style="color:#fff">로그아웃</a>` : "";
  $("#tabs").innerHTML = A.user ? TABS.map(([k, n]) => `<button class="${A.tab === k ? "on" : ""}" data-act="tab" data-v="${k}">${n}</button>`).join("") : "";
  if (!A.user) { $("#app").innerHTML = `<div class="login"><h1>선생님 화면</h1><p>학생 탐구 기록 · 보고서 · 세특 · 지도안을 보는 화면이에요. 관리자 구글 계정으로 들어와요.</p><button class="gbtn" data-act="login"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>G 구글 계정으로 로그인</button>${A.msg ? `<p class="note" style="margin-top:14px;color:var(--warn)">${esc(A.msg)}</p>` : ""}</div>`; return; }
  const v = { prog: progView, rep: repView, seteuk: seteukView, plan: planView, refl: reflView, algo: algoView, users: usersView }[A.tab] || progView;
  $("#app").innerHTML = (A.msg ? `<div class="msg">${esc(A.msg)}</div>` : "") + v();
}
const banSel = () => `<select data-act="ban" aria-label="반">${bans().map((b) => `<option ${b === A.ban ? "selected" : ""}>${esc(b)}</option>`).join("")}<option value="" ${!A.ban ? "selected" : ""}>모든 반</option></select>`;
const topicSel = (all) => `<select data-act="topic" aria-label="주제">${all ? `<option value="">모든 주제</option>` : ""}${TOPICS.map((t) => `<option value="${t.id}" ${A.topic === t.id ? "selected" : ""}>AI활용탐구 ${t.no} · ${esc(t.name)}</option>`).join("")}</select>`;

function progView() {
  const L = inBan(), all = L.flatMap((m) => topicsOf(m).map((t) => [t, m.rec[t.id]]));
  const sub = all.filter(([, x]) => x.sub).length, ai = all.reduce((s, [, x]) => s + (x.ai || []).length, 0);
  // 주제 선택: 고른 주제는 많은 순, 아무도 안 고른 주제(0명)는 그 아래에 주제 번호 순으로 흐리게
  const cnt = TOPICS.map((t) => [t, all.filter(([u]) => u.id === t.id).length]);
  const per = cnt.filter(([, n]) => n).sort((a, b) => b[1] - a[1]), zero = cnt.filter(([, n]) => !n), mx = Math.max(1, ...per.map(([, n]) => n));
  const stepRate = STEPS.map((st) => all.length ? all.filter(([t, x]) => stepDone(t, x, st.k)).length / all.length * 100 : 0);
  return `<div class="bar-h"><div><h1>진행 현황</h1><p>학생이 쓰는 대로 바로 바뀌어요 · 학번 순</p></div><div class="ctl">${banSel()}</div></div>
  <div class="kpi"><div>학생<b>${L.length}명</b></div><div>시작한 탐구<b>${all.length}개</b></div><div>제출한 보고서<b>${sub}개</b></div><div>AI 검토 · 질문<b>${ai}회</b></div><div>평균 진도<b>${all.length ? Math.round(all.reduce((s, [t, x]) => s + progOf(t, x), 0) / all.length / 8 * 100) : 0}%</b></div></div>
  <div class="box"><h2>학생별 진행</h2><table class="tb"><thead><tr><th>학번</th><th>반</th><th>탐구</th><th>8단계 진행</th><th>AI</th><th>상태</th><th>마지막 저장</th><th></th></tr></thead><tbody>

/* 🧩 알고리즘 실험실 (/algolab): 같은 학번 문서의 rec["a_주제"] 를 읽어요 */
const algoOf = (m) => Object.entries(m.rec || {}).filter(([k, x]) => k.startsWith("a_") && x && x.s).map(([k, x]) => [k.slice(2), x]).filter(([id]) => ALGO.A[id]);
function algoRule(id, s) {
  const g = ALGO.A[id], c = g.crit.find((v) => v.id === s.crit); if (!c) return "아직 기준을 고르지 않음";
  const P = g.param, hp = P && [].concat(P.crit).includes(s.crit);
  return c.name + (hp ? ` · ${s.p}${P.unit}` : "") + g.optc.filter((o) => s[o.id]).map((o) => ` · ${o.n ? `${o.text} ${s[o.id + "N"]}${o.after}` : o.text.split("→")[0].replace(/^만약 /, "").trim()}`).join("");
}
function algoView() {
  const L = inBan(), rows = L.flatMap((m) => algoOf(m).map(([id, x]) => [m, id, x]));
  const sub = rows.filter(([, , x]) => x.sub).length;

  return `<div class="bar-h"><div><h1>알고리즘 실험실</h1><p>moontr.site/algolab · 학생이 고른 규칙 · 가치 검토 · 공정성 · 성찰 · 학번 순 · 세특 초안에도 함께 들어가요</p></div><div class="ctl">${banSel()}<a class="btn w" href="/algolab/" target="_blank" rel="noopener">학생 화면 ↗</a></div></div>
  <div class="kpi"><div>시작한 알고리즘<b>${rows.length}개</b></div><div>제출<b>${sub}개</b></div>${byAlgo.map(([id, r]) => `<div>${esc(ALGO.NAMES[id][0])}<b>${r.length}명</b></div>`).join("")}</div>
  <div class="box"><h2>학생별 진행</h2>${rows.length ? `<table class="tb"><thead><tr><th>학번</th><th>반</th><th>알고리즘</th><th>7단계</th><th>고른 규칙</th><th>상태</th><th>마지막 저장</th></tr></thead><tbody>
  ${rows.map(([m, id, x]) => `<tr><td><b>${esc(m.sid)}</b></td><td>${esc(m.ban)}</td><td class="l">${esc(ALGO.NAMES[id][1])}</td><td><span class="dots">${ALGO.STEPS.map((n, i) => `<i class="${(x.done || {})[i + 1] ? (i === 6 ? "sub" : "on") : ""}" title="${i + 1}. ${n}"></i>`).join("")}</span></td><td class="l" style="font-size:13px">${esc(algoRule(id, x.s))}</td><td>${x.sub ? `<span class="st d">제출</span>` : `<span class="st o">진행 중</span>`}</td><td>${fmtT(m.updatedAt)}</td></tr>`).join("")}</tbody></table>` : `<p class="note">이 반에서 알고리즘 실험실을 시작한 학생이 아직 없어요.</p>`}</div>
  ${rows.filter(([, , x]) => filled(x.s.why) || filled(x.s.loser) || filled(x.s.ref)).map(([m, id, x]) => `<details class="box"><summary><b>${esc(m.sid)}</b> · ${esc(ALGO.NAMES[id][1])} ${x.sub ? `<span class="st d">제출</span>` : ""}</summary>
    <p class="note" style="margin:10px 0 4px">고른 규칙</p><p>${esc(algoRule(id, x.s))}</p>
    <p class="note" style="margin:10px 0 4px">5 · 가치 검토</p><p style="white-space:pre-wrap">${esc(x.s.why || "—")}</p>
    <p class="note" style="margin:10px 0 4px">6 · 공정성 시험: 손해 보는 사람과 고칠 점</p><p style="white-space:pre-wrap">${esc(x.s.loser || "—")}</p>
    <p class="note" style="margin:10px 0 4px">7 · 마치며 (알고리즘은 중립적일까?)</p><p style="white-space:pre-wrap">${esc(x.s.ref || "—")}</p>
    ${(x.ai || []).length ? `<p class="note" style="margin:10px 0 4px">AI 짝꿍에게 한 질문</p>${x.ai.map((a) => `<p style="font-size:13px">· ${esc(a.q)}</p>`).join("")}` : ""}</details>`).join("")}`;
}

// 활동 기록: 학생 화면이 단계마다 남긴 날짜 · 시간 · 내용 (x.log)
const hm = (ms) => new Date(ms).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
const logHTML = (x) => (x.log || []).map((l) => { const i = STEPS.findIndex((s) => s.k === l.k); return `<div>${fmtT(l.from)}${l.at - l.from >= 60e3 ? ` ~ ${hm(l.at)}` : ""} · <b>${i + 1}단계 ${esc((STEPS[i] || {}).name || "")}</b>${l.d ? " ✓" : ""} — ${esc(l.c || "")}</div>`; }).join("") || `<div>기록 없음 (2026-11-16 저녁부터 남아요)</div>`;

}

  <table><tr><th style="width:15%">단계</th><th style="width:6%">시간</th><th style="width:31%">교수 활동</th><th style="width:31%">학습 활동</th><th style="width:17%">AI 활용 · 유의점</th></tr>
    ${PLAN_T.map(([nm, tf, sf, ai], i) => `<tr><td><b>${i + 1}. ${esc(nm)}</b></td><td class="c">${STEPS[i].min}분</td><td><ul>${tf(t).map((v) => `<li>${esc(v)}</li>`).join("")}</ul></td><td><ul>${sf(t).map((v) => `<li>${esc(v)}</li>`).join("")}</ul></td><td>${esc(ai)}</td></tr>`).join("")}</table>
  <table><tr><th style="width:15%">평가</th><td><ul><li>데이터 리터러시: 정제 · 계산이 정확하고, 그래프와 통계를 근거로 패턴을 설명하는가</li><li>AI 리터러시: AI의 결론을 수치로 검증하고, AI 활용 과정을 성찰하는가</li><li>윤리적 판단: 교과서 사상가(${esc(t.th.m)} · ${esc(t.th.r)})의 원리와 데이터로 확인한 사실을 이어 도덕 판단을 내리고, 맞서는 관점과 비교해 해결안을 정당화하는가</li></ul></td></tr>
    <tr><th>개별화</th><td>학생마다 살펴볼 대상과 나만의 탐구 질문을 고르고, 한 반 안에서도 20개 주제 가운데 하나를 선택해 서로 다른 데이터 · 결론 · 실행물을 만든다.</td></tr>
    <tr><th>기록 연계</th><td>단계 기록 · 한 장 보고서 · AI 활용 기록이 자동 저장되어 학생별 세부능력 및 특기사항의 근거로 쓰인다.</td></tr>
    <tr><th>유의점</th><td>개인 경험 · 타인 이름 등 개인정보를 쓰지 않게 한다. 화면의 숫자는 연습용 예시이므로 실제 통계는 출처에서 확인하도록 안내한다.</td></tr></table></div>`;
}
function planView() {
  const t = DL.topic(A.topic);
  return `<div class="bar-h"><div><h1>지도안</h1><p>아이에답 ‘데이터 분석’ 유형 · 8단계 수업 모형 · 주제마다 한 장</p></div><div class="ctl">${topicSel()}<button class="btn" data-act="printPlan">인쇄 · PDF로 저장</button></div></div>${planHTML(t)}`;
}

function reflView() {
  const L = inBan(), all = L.flatMap((m) => topicsOf(m).map((t) => [t, m.rec[t.id], m]));
  const reviews = all.flatMap(([, x]) => (x.ai || []).filter((a) => a.k === "review" && !a.local));
  const firsts = all.map(([, x]) => (x.ai || []).filter((a) => a.k === "review")).filter((r) => r.length >= 2);
  const gain = firsts.length ? firsts.reduce((s, r) => { const sc = (a) => a.scores.data + a.scores.other + a.scores.concept; return s + sc(r[r.length - 1]) - sc(r[0]); }, 0) / firsts.length : 0;
  const sub = all.filter(([, x]) => x.sub);
  const stats = { 반: A.ban || "모든 반", 학생: L.length, 시작한탐구: all.length, 제출: sub.length, 주제수: new Set(all.map(([t]) => t.id)).size, AI검토: all.reduce((s, [, x]) => s + (x.ai || []).filter((a) => a.k === "review").length, 0), AI질문: all.reduce((s, [, x]) => s + (x.ai || []).filter((a) => a.k === "ask").length, 0), 다시쓴뒤점수변화: +gain.toFixed(2),
    단계완료율: Object.fromEntries(STEPS.map((st, i) => [`${i + 1}.${st.name}`, all.length ? Math.round(all.filter(([t, x]) => stepDone(t, x, st.k)).length / all.length * 100) + "%" : "0%"])) };
  const samples = sub.slice(0, 3).map(([t, x]) => ({ 주제: `${t.no}. ${t.name}`, 결과: String(repVal(t, x, "result")).slice(0, 200), 해결안: String(repVal(t, x, "plan")).slice(0, 200), AI성찰: String(repVal(t, x, "ai")).slice(0, 200) }));
  A.reflData = { stats, samples };
  const draft = A.out.refl || "";
  return `<div class="bar-h"><div><h1>수업 실천 성찰</h1><p>아이에답 ‘수업 실천 성찰하기’에 올릴 자료 · 학번 없이 통계와 보고서 예시만</p></div><div class="ctl">${banSel()}<button class="btn" data-act="printRefl">인쇄 · PDF로 저장</button></div></div>
  <div id="reflDoc"><div class="kpi"><div>참여 학생<b>${stats.학생}명</b></div><div>시작한 탐구<b>${stats.시작한탐구}개</b></div><div>제출한 보고서<b>${stats.제출}개</b></div><div>선택된 주제<b>${stats.주제수}개</b></div><div>AI 검토 · 질문<b>${stats.AI검토 + stats.AI질문}회</b></div></div>
  <div class="two" style="grid-template-columns:1fr 1fr"><div class="box"><h2>단계별 완료율</h2>${STEPS.map((st, i) => { const v = parseInt(Object.values(stats.단계완료율)[i]); return `<div class="hb"><span>${i + 1}. ${esc(st.name)}</span><i style="width:${v}%"></i><em>${v}%</em></div>`; }).join("")}</div>
  <div class="box"><h2>AI 검토 뒤 고쳐 쓰기</h2><p style="font-size:14px">AI 검토를 두 번 이상 받은 탐구 ${firsts.length}개에서, 첫 검토보다 마지막 검토의 점수(수치 인용 · 다른 원인 · 윤리적 근거, 6점 만점)가 평균 <b>${gain >= 0 ? "+" : ""}${gain.toFixed(2)}점</b> 바뀌었어요.</p><p class="note" style="margin-top:8px">AI 서버 검토 ${reviews.length}회 · 기본 점검 포함 전체 ${stats.AI검토}회 · 탐구 파트너 질문 ${stats.AI질문}회</p></div></div>
  <div class="box"><h2>학생 보고서 예시 (이름 · 학번 없이)</h2>${samples.map((s) => `<div class="paper" style="padding:16px 18px"><div class="who">${esc(s.주제)}</div><section><h4>결과</h4><p>${esc(s.결과)}</p></section><section><h4>해결안</h4><p>${esc(s.해결안)}</p></section><section><h4>AI 활용 성찰</h4><p>${esc(s.AI성찰)}</p></section></div>`).join("") || `<p class="note">제출한 보고서가 생기면 여기에 세 개까지 보여요</p>`}</div>
  <div class="box"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 style="margin:0">성찰문 초안</h2><button class="btn b sm" data-act="aiRefl" ${A.busy ? "disabled" : ""}>AI로 초안</button></div><textarea data-refl style="margin-top:10px" placeholder="위 통계와 예시를 바탕으로 AI가 초안을 써 줘요. 내 경험과 느낀 점으로 고쳐 써 주세요">${esc(draft)}</textarea></div></div>`;
}

function usersView() {
  const L = inBan();
  return `<div class="bar-h"><div><h1>학생 관리</h1><p>비밀번호를 잊은 학생은 새 비밀번호로 기록을 옮겨 줘요 (예전 비밀번호 기록은 지워져요)</p></div><div class="ctl">${banSel()}</div></div>
  <div class="box"><table class="tb"><thead><tr><th>학번</th><th>반</th><th>탐구</th><th>처음 들어온 때</th><th>새 비밀번호(숫자 4자리)</th><th></th></tr></thead><tbody>
  ${L.map((m) => `<tr><td><b>${esc(m.sid)}</b></td><td>${esc(m.ban)}</td><td>${topicsOf(m).length}개</td><td>${fmtT(m.at)}</td><td><input inputmode="numeric" maxlength="4" data-pin="${m.key}" style="width:110px"></td><td><button class="btn w sm" data-act="resetPin" data-v="${m.key}">비밀번호 바꾸기</button> <button class="btn w sm" data-act="delMember" data-v="${m.key}">기록 지우기</button></td></tr>`).join("") || `<tr><td colspan="6" class="note">학생이 없어요</td></tr>`}</tbody></table></div>`;
}

/* ---------- 누르기 ---------- */
document.addEventListener("change", (e) => {
  const a = e.target.dataset.act;
  if (a === "ban") { A.ban = e.target.value; A.sel = null; render(); }
  if (a === "topic") { A.topic = e.target.value; render(); }
});
document.addEventListener("input", (e) => { if (e.target.dataset.sk) A.out[e.target.dataset.sk] = e.target.value; if (e.target.hasAttribute("data-refl")) A.out.refl = e.target.value; });
document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-act]"); if (!b || b.tagName === "SELECT") return;
  const a = b.dataset.act, v = b.dataset.v, m = A.members.find((x) => x.key === v);
  if (a === "login") return login();
  if (a === "logout") { e.preventDefault(); return auth.signOut(); }
  if (a === "tab") { A.tab = v; A.msg = ""; history.replaceState(null, "", "#" + v); return render(); }
  if (a === "see" || a === "sel") { A.sel = v; A.tab = "rep"; render(); if (b.dataset.t) { const el = document.getElementById(`p_${v.slice(0, 8)}_${b.dataset.t}`); if (el) el.scrollIntoView({ block: "start" }); } return; }
  if (a === "printRep") { $("#printArea").innerHTML = paper(DL.topic(b.dataset.t), m); return window.print(); }
  if (a === "printPlan") { $("#printArea").innerHTML = planHTML(DL.topic(A.topic)); return window.print(); }
  if (a === "printRefl") { $("#printArea").innerHTML = $("#reflDoc").outerHTML; return window.print(); }
  if (a === "copyPrompt") { try { await navigator.clipboard.writeText(promptOf(m)); b.textContent = "복사됨"; } catch (er) { prompt("아래를 복사해요", promptOf(m)); } return; }
  if (a === "aiSeteuk") {
    A.busy = true; render();
    try { const j = await callAdminAI("/seteuk", { evidence: evidence(m) }); A.out[v] = j.text; A.msg = ""; } catch (er) { A.msg = "AI 서버에 연결하지 못했어요 (" + er.message + "). ‘프롬프트 복사’로 다른 AI에 붙여 넣어 쓸 수 있어요."; }
    A.busy = false; return render();
  }
  if (a === "saveSeteuk") { const txt = A.out[v] ?? m.seteuk ?? ""; await db.collection("datalab_members").doc(v).update({ seteuk: txt, seteukAt: Date.now() }); A.msg = `${m.sid} 세특을 저장했어요`; return render(); }
  if (a === "aiRefl") {
    A.busy = true; render();
    try { const j = await callAdminAI("/reflect", A.reflData); A.out.refl = j.text; A.msg = ""; } catch (er) { A.msg = "AI 서버에 연결하지 못했어요 (" + er.message + ")"; }
    A.busy = false; return render();
  }
  if (a === "resetPin") {
    const pin = (document.querySelector(`[data-pin="${v}"]`).value || "").trim();
    if (!/^[0-9]{4}$/.test(pin)) return alert("새 비밀번호는 숫자 네 자리예요");
    if (!confirm(`${m.sid} 학생의 비밀번호를 ${pin}(으)로 바꿀까요? 학생에게 새 비밀번호를 알려 주세요.`)) return;
    const nk = await DL.keyOf(m.sid, pin); if (nk === v) return alert("지금과 같은 비밀번호예요");
    const { key, ...data } = m, bt = db.batch(); bt.set(db.collection("datalab_members").doc(nk), { ...data, updatedAt: Date.now() }); bt.delete(db.collection("datalab_members").doc(v)); await bt.commit();
    A.msg = `${m.sid} 학생의 비밀번호를 바꿨어요`; return render();
  }
  // 주제 바꾸기 허락: 그 탐구를 멈춤(stop.주제)으로 → 학생이 '다시 확인'을 누르거나 다시 열면 새 주제를 시작할 수 있어요
  if (a === "stopT" || a === "unstopT") {
    const t = DL.topic(b.dataset.t);
    if (a === "stopT" && !confirm(`${m.sid} 학생의 ‘${t.no}. ${t.name}’ 탐구를 멈추고, 다른 주제를 시작할 수 있게 할까요?\n쓴 내용은 그대로 남고, ‘다시 열기’로 되돌릴 수 있어요.`)) return;
    try { await db.collection("datalab_members").doc(v).update({ ["stop." + t.id]: a === "stopT" ? Date.now() : firebase.firestore.FieldValue.delete() }); A.msg = a === "stopT" ? `${m.sid} 학생이 이제 다른 주제를 시작할 수 있어요. 학생 화면에서 ‘다시 확인’을 누르게 해 주세요` : `${m.sid} 학생의 ‘${t.name}’ 탐구를 다시 열었어요`; }
    catch (er) { A.msg = "바꾸지 못했어요 (" + (er.code || er.message) + ")"; }
    return render();
  }
  // 학생 화면의 반별 단계 완료율을 지금 학생 기록으로 다시 만들어요 (지운 학생 빼기)
  if (a === "cpSync") {
    const P = {};
    A.members.forEach((mm) => { const T = topicsOf(mm); if (!T.length || !mm.ban) return; const t = DL.topic(mm.rec.last) && mm.rec[mm.rec.last] ? DL.topic(mm.rec.last) : T[T.length - 1];
      (P[mm.ban] = P[mm.ban] || {})[mm.key.slice(0, 24)] = STEPS.map((st) => stepDone(t, mm.rec[t.id], st.k) ? 1 : 0).join(""); });
    try { const old = await db.collection("datalab_prog").get(), bt = db.batch(); old.docs.forEach((d) => { if (!P[d.id]) bt.delete(d.ref); }); Object.entries(P).forEach(([bn, p]) => bt.set(db.collection("datalab_prog").doc(bn), { p })); await bt.commit(); A.msg = `반별 완료율을 다시 맞췄어요 (${Object.keys(P).length}개 반)`; }
    catch (er) { A.msg = "다시 맞추지 못했어요 (" + (er.code || er.message) + "). Firestore 규칙에 datalab_prog 가 게시되었는지 확인해 주세요."; }
    return render();
  }
  if (a === "delMember") {
    if (!confirm(`${m.sid} 학생의 탐구 기록을 모두 지울까요? 되돌릴 수 없어요.`)) return;
    const bt = db.batch(); bt.delete(db.collection("datalab_members").doc(v)); bt.delete(db.collection("datalab_ids").doc(m.sid)); await bt.commit();
    A.msg = `${m.sid} 학생의 기록을 지웠어요 (같은 학번으로 다시 처음부터 시작할 수 있어요)`; return render();
  }
});
render();
</script>
<script type="module" src="/visit.js?app=datalab&hide=1"></script>
</body>
</html>
