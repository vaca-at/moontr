# 🤖 통합사회 데이터 실험실 AI 서버 (moontr.site/datalab) — Anthropic Claude
# 처음 한 번 (이 폴더에서):
#   npm install
#   npx wrangler@4 secret put ANTHROPIC_API_KEY     ← Anthropic 콘솔에서 만든 API 키를 붙여 넣어요
#   npx wrangler@4 deploy
# 주소: https://moontr-datalab-ai.bellachord.workers.dev  (datalab/topics.js 의 AI_URL)
name = "moontr-datalab-ai"
main = "worker.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "QUOTA"
class_name = "Quota"

# 무료 요금제에서도 쓸 수 있는 SQLite 저장소 방식
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Quota"]
