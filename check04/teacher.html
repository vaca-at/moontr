<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>출석체크 - 교사용</title>
<style>
@font-face {
    font-family: 'OwnglyphYuntaeng';
    src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2608211801@font-160/font-160/%EC%98%A8%EA%B8%80%EC%9E%8E%20%EC%9C%A4%ED%83%B1%EC%B2%B4.woff2') format('woff2');
    font-weight: 400;
    font-display: swap;
}
  :root{
    --bg:#0f1210; --panel:#171c19; --panel2:#1d231f; --line:#2a322c;
    --present:#2ecf95; --present-bg:#16332a;
    --late:#e8b33c;   --late-bg:#33290f;
    --leave:#6aa9e0;  --leave-bg:#16283a;
    --absent:#d9634a; --absent-bg:#361a14;
    --muted:#8fbf9f; --ink:#eef4f0; --warn:#ff9a8f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:'OwnglyphYuntaeng','Pretendard','Apple SD Gothic Neo',sans-serif;
    font-size:19px;padding:24px 16px 60px;
  }
  .wrap{max-width:1200px;margin:0 auto;}
  h1{font-size:26px;margin:0 0 4px;font-weight:400;}
  .sub{color:var(--muted);font-size:16px;margin-bottom:18px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px;}
  label{font-size:16px;color:var(--muted);display:block;margin-bottom:6px;}
  textarea, input[type=text], input[type=password], input[type=file]{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;
    font-size:19px;background:var(--bg);color:var(--ink);font-family:inherit;
  }
  textarea{min-height:70px;resize:vertical;}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  button{
    padding:12px 18px;border:none;border-radius:10px;
    background:var(--present);color:#08221a;font-size:18px;cursor:pointer;font-family:inherit;
  }
  button.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line);}
  button:disabled{opacity:.5;}
  .link-box{display:flex;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;word-break:break-all;}
  .summary{font-size:18px;color:var(--muted);margin-bottom:16px;}
  .summary b{color:var(--ink);font-size:26px;font-weight:400;}

  .clock{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:16px;color:var(--muted);}
  .clock b{color:var(--ink);font-weight:400;font-size:20px;}
  .clock.warn b{color:var(--late);}
  .clock.closed b{color:var(--absent);}

  .main-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;align-items:start;}
  @media (max-width:860px){ .main-grid{grid-template-columns:1fr;} }

  .seatgrid{display:grid;grid-template-columns:repeat(auto-fill, minmax(84px, 1fr));gap:10px;}
  .seat{
    display:flex;flex-direction:column;align-items:center;gap:7px;
    padding:12px 6px 10px;border-radius:12px;border:1px solid var(--line);
    background:var(--panel2);cursor:pointer;transition:background .3s ease, border-color .3s ease;
  }
  .bulb{width:20px;height:20px;border-radius:50%;background:#2a322c;transition:background .35s ease, box-shadow .35s ease;}
  .seat.on-present{background:var(--present-bg);border-color:var(--present);}
  .seat.on-present .bulb{background:var(--present);box-shadow:0 0 12px 4px rgba(46,207,149,.5);}
  .seat.on-late{background:var(--late-bg);border-color:var(--late);}
  .seat.on-late .bulb{background:var(--late);box-shadow:0 0 12px 4px rgba(232,179,60,.45);}
  .seat.on-leave{background:var(--leave-bg);border-color:var(--leave);}
  .seat.on-leave .bulb{background:var(--leave);box-shadow:0 0 12px 4px rgba(106,169,224,.45);}
  .seat.on-absent{background:var(--absent-bg);border-color:var(--absent);}
  .seat.on-absent .bulb{background:var(--absent);}
  .seat.just-on .bulb{ animation: flicker .7s ease; }
  @keyframes flicker {
    0%{transform:scale(.5);opacity:.3;}
    55%{transform:scale(1.35);opacity:1;}
    100%{transform:scale(1);}
  }
  .seat .id{font-size:16px;}
  .seat .tag{font-size:13px;color:var(--muted);}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:15px;color:var(--muted);}
  .legend span{display:flex;align-items:center;gap:6px;}
  .legend i{width:11px;height:11px;border-radius:50%;display:inline-block;}

  .hint{font-size:15px;color:var(--muted);margin-top:10px;line-height:1.6;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--present);color:#08221a;padding:12px 22px;border-radius:22px;font-size:17px;opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:95;}
  .toast.show{opacity:1;}

  .qr-img-box{width:100%;aspect-ratio:1;border-radius:12px;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--bg);margin-bottom:12px;}
  .qr-img-box img{width:100%;height:100%;object-fit:contain;background:#fff;}
  .qr-img-box .empty{color:var(--muted);font-size:16px;text-align:center;padding:12px;}
  .qr-form{display:none;flex-direction:column;gap:8px;margin-top:8px;}
  .qr-form.show{display:flex;}
  .err{color:var(--warn);font-size:15px;display:none;}

  .gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:99;padding:20px;}
  .gate.hide{display:none;}
  .gate .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;width:min(360px,100%);}
  .gate h2{font-size:22px;margin:0 0 4px;font-weight:400;}
  .gate p{font-size:16px;color:var(--muted);margin:0 0 16px;}
  .gate input{margin-bottom:12px;}
  .gate button{width:100%;}

  .modal{position:fixed;inset:0;background:rgba(6,9,7,.72);display:none;align-items:center;justify-content:center;z-index:80;padding:20px;}
  .modal.show{display:flex;}
  .modal-panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:min(960px,100%);max-height:86vh;display:flex;flex-direction:column;}
  .modal-panel.narrow{width:min(520px,100%);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 22px;border-bottom:1px solid var(--line);}
  .modal-head h3{margin:0;font-size:22px;font-weight:400;}
  .modal-head .close{background:var(--panel2);color:var(--ink);border:1px solid var(--line);padding:8px 14px;font-size:17px;}
  .modal-body{padding:18px 22px;overflow:auto;}
  .modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}
  .modal-body table{width:100%;border-collapse:collapse;font-size:17px;}
  .modal-body th,.modal-body td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top;}
  .modal-body th{color:var(--muted);font-weight:400;}
  .modal-body td.c-present{color:var(--present);}
  .modal-body td.c-late{color:var(--late);}
  .modal-body td.c-leave{color:var(--leave);}
  .modal-body td.c-absent{color:var(--absent);}
  .modal-body td.c-none{color:var(--muted);}
  .loading{color:var(--muted);padding:30px 0;text-align:center;}

  .mark-group{margin-bottom:16px;}
  .mark-group h4{margin:0 0 8px;font-size:16px;color:var(--muted);font-weight:400;}
  .mark-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .mark-btns button{width:100%;padding:12px 6px;font-size:17px;}
  .mark-btns button.g{background:var(--present-bg);color:var(--present);border:1px solid var(--present);}
  .mark-btns button.y{background:var(--late-bg);color:var(--late);border:1px solid var(--late);}
  .mark-btns button.b{background:var(--leave-bg);color:var(--leave);border:1px solid var(--leave);}
  .mark-btns button.r{background:var(--absent-bg);color:var(--absent);border:1px solid var(--absent);}
  .mark-now{font-size:17px;color:var(--muted);margin:0 0 16px;}
  .mark-now b{color:var(--ink);font-weight:400;}
  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important;} }
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="box">
    <h2>교사용 화면</h2>
    <p>암호를 입력하면 오늘 현황이 열립니다.</p>
    <input type="password" id="gatePw" placeholder="암호">
    <button id="gateBtn">열기</button>
    <div class="err" id="gateErr">암호가 맞지 않습니다.</div>
  </div>
</div>

<div class="wrap">
  <h1><span id="clsTitle">…</span> · 교사용</h1>
  <div class="sub">자리를 누르면 출결을 바꿀 수 있어요.</div>

  <div class="clock" id="clock"><b id="clockMain">—</b><span id="clockSub"></span></div>

  <div class="card">
    <label>학생용 링크</label>
    <div class="link-box">
      <span id="studentUrl">…</span>
      <button class="ghost" id="copyBtn" style="flex-shrink:0;">복사</button>
    </div>
  </div>

  <div class="card">
    <label for="questionInput">오늘의 질문</label>
    <textarea id="questionInput"></textarea>
    <div class="row" style="margin-top:10px;"><button id="saveQBtn">질문 저장</button></div>
  </div>

  <div class="main-grid">
    <div class="card">
      <div class="summary">출석 <b id="presentCount">0</b> / <span id="totalCount">0</span>명<span id="extraCount"></span></div>
      <div class="seatgrid" id="grid"></div>
      <div class="legend">
        <span><i style="background:#2ecf95"></i>출석</span>
        <span><i style="background:#e8b33c"></i>지각</span>
        <span><i style="background:#6aa9e0"></i>조퇴</span>
        <span><i style="background:#d9634a"></i>결석</span>
        <span><i style="background:#2a322c"></i>미제출</span>
      </div>

      <div class="row" style="margin-top:18px;">
        <button id="viewToday">오늘 현황 보기</button>
        <button class="ghost" id="viewAll">지난 기록 보기</button>
        <button class="ghost" id="csvToday">오늘 CSV</button>
        <button class="ghost" id="csvAll">전체 CSV</button>
      </div>
      <div class="hint">'보기'는 화면에서 바로 확인하고, 'CSV'는 파일로 내려받습니다.</div>
    </div>

    <div class="card">
      <label>QR 사진</label>
      <div class="qr-img-box" id="qrImgBox"><div class="empty">등록된 사진이 없어요</div></div>
      <button class="ghost" id="qrToggleBtn" style="width:100%;">사진 등록/변경</button>
      <div class="qr-form" id="qrForm">
        <input type="file" id="qrFile" accept="image/*">
        <div class="err" id="qrErr"></div>
        <div class="row">
          <button id="qrSaveBtn" style="flex:1;">저장</button>
          <button class="ghost" id="qrCancelBtn">취소</button>
        </div>
      </div>

      <label style="margin-top:20px;">시간표</label>
      <div class="hint" id="ttBox" style="margin-top:0;"></div>

      <label style="margin-top:20px;" for="rosterInput">명단 (학번, 쉼표로 구분)</label>
      <textarea id="rosterInput"></textarea>
      <button id="saveRosterBtn" style="width:100%;margin-top:10px;">명단 저장</button>
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-panel">
    <div class="modal-head">
      <h3 id="modalTitle">오늘 현황</h3>
      <button class="close" id="modalClose">닫기</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="ghost" id="modalPrint">인쇄</button>
      <button id="modalOk">닫기</button>
    </div>
  </div>
</div>

<div class="modal" id="markModal">
  <div class="modal-panel narrow">
    <div class="modal-head">
      <h3 id="markTitle">출결 바꾸기</h3>
      <button class="close" id="markClose">닫기</button>
    </div>
    <div class="modal-body">
      <p class="mark-now" id="markNow"></p>
      <div class="mark-group">
        <h4>출석</h4>
        <div class="mark-btns">
          <button class="g" data-mark="출석">출석</button>
          <button class="y" data-mark="지각">지각</button>
          <button class="ghost" data-mark="">미제출로</button>
        </div>
      </div>
      <div class="mark-group">
        <h4>지각</h4>
        <div class="mark-btns">
          <button class="y" data-mark="질병지각">질병지각</button>
          <button class="y" data-mark="인정지각">인정지각</button>
          <button class="y" data-mark="미인정지각">미인정지각</button>
        </div>
      </div>
      <div class="mark-group">
        <h4>조퇴</h4>
        <div class="mark-btns">
          <button class="b" data-mark="질병조퇴">질병조퇴</button>
          <button class="b" data-mark="인정조퇴">인정조퇴</button>
          <button class="b" data-mark="미인정조퇴">미인정조퇴</button>
        </div>
      </div>
      <div class="mark-group">
        <h4>결석</h4>
        <div class="mark-btns">
          <button class="r" data-mark="질병결석">질병결석</button>
          <button class="r" data-mark="인정결석">인정결석</button>
          <button class="r" data-mark="미인정결석">미인정결석</button>
        </div>
      </div>
      <label for="markMemo">메모 (선택)</label>
      <input type="text" id="markMemo" placeholder="예: 보건실, 병원 예약">
      <div class="row" style="margin-top:10px;">
        <button class="ghost" id="markMemoSave" style="width:100%;">메모만 저장</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot, collection, query, where, getDocs }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA3CxawUPIfGeBWyffsNbCSM3ymjKHLH6o",
  authDomain: "moon-d528d.firebaseapp.com",
  projectId: "moon-d528d",
  storageBucket: "moon-d528d.firebasestorage.app",
  messagingSenderId: "126636401536",
  appId: "1:126636401536:web:25b8a8296ec42b86f99765"
};
const db = getFirestore(initializeApp(firebaseConfig));

const TEACHER_PW = '1234';   // 여기를 바꾸면 암호가 바뀝니다

/* ===== 시간표 (학생용 파일과 같게 맞춰 주세요) ===== */
const TIMETABLE = {
  1: { period: '4교시', start: '11:20', end: '12:10' },
  3: { period: '3교시', start: '10:20', end: '11:10' },
  4: { period: '6교시', start: '14:10', end: '15:00' }
};
const LATE_AFTER_MIN  = 5;
const CLOSE_AFTER_MIN = 20;

const DEFAULT_CLASS = '미도약';
const DEFAULT_ROSTER = ["30201","30204","30207","30209","30210","30211","30213","30214","30215","30216","30218","30219","30220","30225","30226","30405","30409","30411","30415","30416","30417","30420","30425","30501","30506","30507","30508","30509","30512","30514","30516","30518","30520","30521","30522","30523","30525"];
const DEFAULT_QUESTION = '오늘 이 시간, 어떤 마음으로 왔나요? 한 줄로 적어주세요.';
const DAYS = ['일','월','화','수','목','금','토'];

const params = new URLSearchParams(location.search);
const CLASS_NAME = params.get('class') || DEFAULT_CLASS;
const TODAY = todayStr();
const DAY_KEY = CLASS_NAME + '__' + TODAY;

function todayStr(){ const d=new Date(), p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function atTime(s){ const [h,m]=s.split(':').map(Number); const d=new Date(); d.setHours(h,m,0,0); return d; }
function hhmm(d){ const p=n=>String(n).padStart(2,'0'); return p(d.getHours())+':'+p(d.getMinutes()); }
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

const SLOT = TIMETABLE[new Date().getDay()] || null;
const CLOSE_AT = SLOT ? atTime(SLOT.start).getTime() + CLOSE_AFTER_MIN*60000 : null;

document.getElementById('clsTitle').textContent = CLASS_NAME;
document.getElementById('studentUrl').textContent =
  location.origin + location.pathname.replace(/teacher\d*\.html?$/,'') +
  (CLASS_NAME !== DEFAULT_CLASS ? '?class='+encodeURIComponent(CLASS_NAME) : '');

document.getElementById('ttBox').innerHTML =
  Object.keys(TIMETABLE).map(k => DAYS[k]+'요일 '+TIMETABLE[k].period+' '+TIMETABLE[k].start+'~'+TIMETABLE[k].end).join('<br>') +
  '<br><br>시작 ' + LATE_AFTER_MIN + '분 후부터 지각, ' + CLOSE_AFTER_MIN + '분 후 제출 마감' +
  '<br>바꾸려면 두 파일의 TIMETABLE 부분을 고치세요.';

let ROSTER = DEFAULT_ROSTER.slice(), records = {}, prevOn = new Set();

/* ===== 암호 ===== */
const gate = document.getElementById('gate');
if (sessionStorage.getItem('teacherOk') === '1') gate.classList.add('hide');
document.getElementById('gateBtn').addEventListener('click', () => {
  if (document.getElementById('gatePw').value === TEACHER_PW) {
    sessionStorage.setItem('teacherOk','1'); gate.classList.add('hide');
  } else document.getElementById('gateErr').style.display = 'block';
});
document.getElementById('gatePw').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('gateBtn').click();
});

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

/* ===== 시계 ===== */
function tick(){
  const el = document.getElementById('clock');
  const main = document.getElementById('clockMain');
  const sub = document.getElementById('clockSub');
  const now = new Date();
  el.classList.remove('warn','closed');
  if (!SLOT) { main.textContent = hhmm(now); sub.textContent = '오늘은 수업이 없는 날 (학생 제출 마감 없음)'; return; }
  const label = DAYS[now.getDay()]+'요일 '+SLOT.period+' · '+SLOT.start+'~'+SLOT.end;
  const left = CLOSE_AT - now.getTime();
  if (left <= 0) { el.classList.add('closed'); main.textContent = '제출 마감됨'; sub.textContent = label; }
  else if (left <= 5*60000) { el.classList.add('warn'); main.textContent = '마감까지 '+Math.ceil(left/60000)+'분'; sub.textContent = label; }
  else { main.textContent = hhmm(now); sub.textContent = label+' · '+hhmm(new Date(CLOSE_AT))+' 마감'; }
}
tick(); setInterval(tick, 1000);

/* ===== 반 설정 ===== */
onSnapshot(doc(db,'classes',CLASS_NAME), snap => {
  const d = snap.exists() ? snap.data() : {};
  const q = document.getElementById('questionInput');
  if (document.activeElement !== q) q.value = d.question || DEFAULT_QUESTION;
  if (Array.isArray(d.roster) && d.roster.length) ROSTER = d.roster;
  const r = document.getElementById('rosterInput');
  if (document.activeElement !== r) r.value = ROSTER.join(',');
  render();
}, e => console.error(e));

document.getElementById('saveQBtn').addEventListener('click', async () => {
  try{
    await setDoc(doc(db,'classes',CLASS_NAME),
      { question: document.getElementById('questionInput').value.trim() }, { merge:true });
    showToast('질문 저장됨 — 학생 화면에 바로 반영돼요');
  }catch(e){ showToast('저장 실패'); }
});
document.getElementById('saveRosterBtn').addEventListener('click', async () => {
  const ids = document.getElementById('rosterInput').value.split(',').map(s=>s.trim()).filter(Boolean);
  try{
    await setDoc(doc(db,'classes',CLASS_NAME), { roster: ids }, { merge:true });
    showToast('명단 '+ids.length+'명 저장됨');
  }catch(e){ showToast('저장 실패'); }
});

/* ===== 오늘 기록 실시간 ===== */
onSnapshot(query(collection(db,'attendance'), where('dayKey','==',DAY_KEY)), snap => {
  records = {};
  snap.forEach(d => { const r = d.data(); records[String(r.studentId)] = r; });
  render();
  if (document.getElementById('modal').classList.contains('show') && MODAL_MODE==='today') drawToday();
  if (document.getElementById('markModal').classList.contains('show')) drawMarkNow();
}, e => console.error(e));

function toneOf(status){
  if (!status) return '';
  if (status === '출석') return 'on-present';
  if (status.indexOf('지각') > -1) return 'on-late';
  if (status.indexOf('조퇴') > -1) return 'on-leave';
  if (status.indexOf('결석') > -1) return 'on-absent';
  return '';
}
function colorClass(status){
  const t = toneOf(status);
  return t ? t.replace('on-','c-') : 'c-none';
}

function buildList(){
  return ROSTER.map(id => {
    const r = records[String(id)] || {};
    return {
      id: String(id),
      status: r.status || '',
      tone: toneOf(r.status),
      answer: r.answer || '',
      time: r.time || '',
      memo: r.memo || ''
    };
  });
}

function render(){
  const list = buildList();
  const present = list.filter(s => s.status === '출석').length;
  const late = list.filter(s => s.tone === 'on-late').length;
  const leave = list.filter(s => s.tone === 'on-leave').length;
  const absent = list.filter(s => s.tone === 'on-absent').length;

  document.getElementById('presentCount').textContent = present + late;
  document.getElementById('totalCount').textContent = list.length;
  const extra = [];
  if (late) extra.push('지각 ' + late);
  if (leave) extra.push('조퇴 ' + leave);
  if (absent) extra.push('결석 ' + absent);
  document.getElementById('extraCount').textContent = extra.length ? ' · ' + extra.join(' · ') : '';

  document.getElementById('grid').innerHTML = list.map(s => {
    const justOn = s.tone && !prevOn.has(s.id);
    const tag = (s.status && s.status !== '출석') ? esc(s.status) : '';
    return `<div class="seat ${s.tone} ${justOn?'just-on':''}" data-id="${s.id}">
      <div class="bulb"></div><div class="id">${s.id}</div>
      ${tag ? '<div class="tag">'+tag+'</div>' : ''}
    </div>`;
  }).join('');

  prevOn = new Set(list.filter(s => s.tone).map(s => s.id));
}

/* ===== 출결 바꾸기 창 ===== */
let MARK_ID = null;
const markModal = document.getElementById('markModal');

function drawMarkNow(){
  const r = records[String(MARK_ID)] || {};
  const parts = [];
  parts.push('현재: <b>' + (r.status ? esc(r.status) : '미제출') + '</b>');
  if (r.time) parts.push('제출 ' + esc(r.time));
  if (r.answer) parts.push('답변: ' + esc(r.answer));
  if (r.memo) parts.push('메모: ' + esc(r.memo));
  document.getElementById('markNow').innerHTML = parts.join('<br>');
  document.getElementById('markMemo').value = r.memo || '';
}

document.getElementById('grid').addEventListener('click', e => {
  const seat = e.target.closest('.seat');
  if (!seat) return;
  MARK_ID = seat.dataset.id;
  document.getElementById('markTitle').textContent = MARK_ID + ' 출결 바꾸기';
  drawMarkNow();
  markModal.classList.add('show');
});

async function saveMark(fields){
  try{
    await setDoc(doc(db,'attendance', DAY_KEY+'__'+MARK_ID), Object.assign({
      dayKey: DAY_KEY, className: CLASS_NAME, date: TODAY, studentId: MARK_ID,
      period: SLOT ? SLOT.period : ''
    }, fields), { merge:true });
    return true;
  }catch(e){ showToast('저장 실패'); return false; }
}

markModal.addEventListener('click', async e => {
  if (e.target === markModal) { markModal.classList.remove('show'); return; }
  const btn = e.target.closest('[data-mark]');
  if (!btn) return;
  const mark = btn.dataset.mark;
  const ok = await saveMark({
    status: mark,
    memo: document.getElementById('markMemo').value.trim(),
    ts: Date.now(),
    time: mark ? new Date().toTimeString().slice(0,8) : ''
  });
  if (ok) { showToast(mark ? mark + '으로 변경' : '미제출로 되돌림'); markModal.classList.remove('show'); }
});
document.getElementById('markClose').addEventListener('click', () => markModal.classList.remove('show'));
document.getElementById('markMemoSave').addEventListener('click', async () => {
  const ok = await saveMark({ memo: document.getElementById('markMemo').value.trim() });
  if (ok) { showToast('메모 저장됨'); markModal.classList.remove('show'); }
});

/* ===== 현황 보기 ===== */
let MODAL_MODE = null;
const modal = document.getElementById('modal');
function openModal(t){ document.getElementById('modalTitle').textContent = t; modal.classList.add('show'); }
function closeModal(){ modal.classList.remove('show'); MODAL_MODE = null; }
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalOk').addEventListener('click', closeModal);
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); markModal.classList.remove('show'); }
});
document.getElementById('modalPrint').addEventListener('click', () => window.print());

function rowHtml(r){
  return `<tr>
    <td>${esc(r.studentId ?? r.id)}</td>
    <td class="${colorClass(r.status)}">${r.status ? esc(r.status) : '미제출'}</td>
    <td>${esc(r.time || '-')}</td>
    <td>${esc(r.answer || '')}</td>
    <td>${esc(r.memo || '')}</td>
  </tr>`;
}
const TH = '<thead><tr><th>학번</th><th>출결</th><th>시각</th><th>답변</th><th>메모</th></tr></thead>';

function drawToday(){
  const list = buildList();
  const order = { 'on-present':0, 'on-late':1, 'on-leave':2, 'on-absent':3, '':4 };
  const sorted = list.slice().sort((a,b) => order[a.tone]-order[b.tone] || (a.id>b.id?1:-1));
  const present = list.filter(s=>s.status==='출석').length;
  const none = list.filter(s=>!s.status);
  document.getElementById('modalBody').innerHTML = `
    <p class="summary" style="margin-bottom:14px;">${TODAY}${SLOT?' · '+SLOT.period:''} · 출석 <b>${present}</b> / ${list.length}명
    ${none.length ? '<br>미제출: ' + none.map(s=>s.id).join(', ') : ''}</p>
    <table>${TH}<tbody>${sorted.map(rowHtml).join('')}</tbody></table>`;
}

document.getElementById('viewToday').addEventListener('click', () => {
  MODAL_MODE='today'; openModal('오늘 현황 · '+CLASS_NAME); drawToday();
});

async function fetchAll(){
  const snap = await getDocs(query(collection(db,'attendance'), where('className','==',CLASS_NAME)));
  const rows = []; snap.forEach(d => rows.push(d.data())); return rows;
}

document.getElementById('viewAll').addEventListener('click', async () => {
  MODAL_MODE='all'; openModal('지난 기록 · '+CLASS_NAME);
  document.getElementById('modalBody').innerHTML = '<p class="loading">불러오는 중…</p>';
  try{
    const rows = await fetchAll();
    if (!rows.length) { document.getElementById('modalBody').innerHTML = '<p class="loading">아직 기록이 없어요.</p>'; return; }
    const byDate = {};
    rows.forEach(r => { (byDate[r.date] = byDate[r.date] || []).push(r); });
    document.getElementById('modalBody').innerHTML = Object.keys(byDate).sort().reverse().map(d => {
      const list = byDate[d].sort((a,b)=>a.studentId>b.studentId?1:-1);
      const on = list.filter(r=>r.status==='출석').length;
      return `<p class="summary" style="margin:18px 0 8px;">${d} · 출석 <b>${on}</b> / ${list.length}명</p>
        <table>${TH}<tbody>${list.map(rowHtml).join('')}</tbody></table>`;
    }).join('');
  }catch(e){ document.getElementById('modalBody').innerHTML = '<p class="loading">불러오지 못했어요.</p>'; }
});

/* ===== CSV ===== */
function downloadCsv(rows, filename){
  const head = ['반','날짜','교시','학번','출결','시각','답변','메모'];
  const q = v => '"' + String(v ?? '').replace(/"/g,'""') + '"';
  const csv = '\uFEFF' + head.map(q).join(',') + '\r\n' + rows.map(r=>r.map(q).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8;' }));
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}
document.getElementById('csvToday').addEventListener('click', () => {
  const rows = buildList().map(s => [CLASS_NAME, TODAY, SLOT?SLOT.period:'', s.id, s.status||'미제출', s.time, s.answer, s.memo]);
  downloadCsv(rows, `출석_${CLASS_NAME}_${TODAY}.csv`);
  showToast('오늘 기록을 내려받았어요');
});
document.getElementById('csvAll').addEventListener('click', async () => {
  try{
    const rows = (await fetchAll())
      .map(r => [r.className, r.date, r.period||'', r.studentId, r.status||'', r.time||'', r.answer||'', r.memo||''])
      .sort((a,b)=> a[1]===b[1] ? (a[3]>b[3]?1:-1) : (a[1]<b[1]?1:-1));
    downloadCsv(rows, `출석_${CLASS_NAME}_전체.csv`);
    showToast(rows.length + '줄을 내려받았어요');
  }catch(e){ showToast('내려받기 실패'); }
});

/* ===== QR ===== */
onSnapshot(doc(db,'qr',CLASS_NAME), snap => {
  const box = document.getElementById('qrImgBox');
  const d = snap.exists() ? snap.data() : {};
  if (d.dataUrl) { const img = document.createElement('img'); img.src = d.dataUrl; img.alt='QR'; box.replaceChildren(img); }
  else box.innerHTML = '<div class="empty">등록된 사진이 없어요</div>';
}, e => console.error(e));

function resizeImageFile(file, maxSize){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxSize || h > maxSize) { const s = maxSize/Math.max(w,h); w = Math.round(w*s); h = Math.round(h*s); }
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = () => reject(new Error('이미지를 읽을 수 없어요'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('파일을 읽을 수 없어요'));
    reader.readAsDataURL(file);
  });
}
document.getElementById('qrToggleBtn').addEventListener('click', () => document.getElementById('qrForm').classList.toggle('show'));
document.getElementById('qrCancelBtn').addEventListener('click', () => {
  document.getElementById('qrForm').classList.remove('show');
  document.getElementById('qrErr').style.display = 'none';
});
document.getElementById('qrSaveBtn').addEventListener('click', async () => {
  const fi = document.getElementById('qrFile'), errEl = document.getElementById('qrErr');
  errEl.style.display = 'none';
  if (!fi.files || !fi.files[0]) { errEl.textContent='사진 파일을 선택해주세요'; errEl.style.display='block'; return; }
  const btn = document.getElementById('qrSaveBtn');
  btn.disabled = true; btn.textContent = '저장 중...';
  try{
    const dataUrl = await resizeImageFile(fi.files[0], 600);
    if (dataUrl.length > 700000) throw new Error('사진 용량이 너무 커요. 더 작은 사진으로 해주세요.');
    await setDoc(doc(db,'qr',CLASS_NAME), { dataUrl, fileName: fi.files[0].name }, { merge:true });
    showToast('사진 저장됨');
    document.getElementById('qrForm').classList.remove('show'); fi.value = '';
  }catch(e){ errEl.textContent = e.message || '저장 실패'; errEl.style.display = 'block'; }
  btn.disabled = false; btn.textContent = '저장';
});

document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('studentUrl').textContent).then(()=>showToast('링크 복사됨'));
});
