<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>출석체크</title>
<style>
@font-face {
    font-family: 'OwnglyphYuntaeng';
    src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2608211801@font-160/font-160/%EC%98%A8%EA%B8%80%EC%9E%8E%20%EC%9C%A4%ED%83%B1%EC%B2%B4.woff2') format('woff2');
    font-weight: 400;
    font-display: swap;
}
  :root{
    --bg:#0f1210; --panel:#171c19; --panel2:#1d231f; --line:#2a322c;
    --present:#2ecf95; --present-bg:#16332a;
    --late:#e8b33c;   --late-bg:#33290f;
    --leave:#6aa9e0;  --leave-bg:#16283a;
    --absent:#d9634a; --absent-bg:#361a14;
    --muted:#8fbf9f; --ink:#eef4f0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:'OwnglyphYuntaeng','Pretendard','Apple SD Gothic Neo',sans-serif;
    font-size:19px;
    padding:24px 16px 60px;
  }
  .wrap{max-width:960px;margin:0 auto;}
  .top-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  @media (max-width:700px){ .top-grid{grid-template-columns:1fr;} }
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;height:100%;}
  .cls{font-size:15px;color:var(--muted);margin-bottom:4px;}
  h1{font-size:24px;margin:0 0 18px;line-height:1.5;font-weight:400;}
  label{font-size:16px;color:var(--muted);display:block;margin-bottom:6px;}
  input[type=text], textarea{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;
    font-size:19px;background:var(--bg);color:var(--ink);font-family:inherit;
    margin-bottom:14px;
  }
  textarea{min-height:80px;resize:vertical;}
  button{
    width:100%;padding:14px;border:none;border-radius:10px;
    background:var(--present);color:#08221a;font-size:19px;font-weight:400;cursor:pointer;
    font-family:inherit;
  }
  button:disabled{opacity:.5;cursor:default;}
  .form.hide{display:none;}
  .err{color:#ff9a8f;font-size:15px;margin:-8px 0 12px;display:none;}

  .clock{
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
    background:var(--bg);border:1px solid var(--line);border-radius:10px;
    padding:10px 14px;margin-bottom:16px;font-size:16px;color:var(--muted);
  }
  .clock b{color:var(--ink);font-weight:400;font-size:19px;}
  .clock.warn b{color:var(--late);}
  .clock.closed b{color:var(--absent);}

  .done{display:none;text-align:center;padding:2px 0 4px;}
  .done.show{display:block;}
  .done p{color:var(--muted);font-size:17px;margin:0;}
  .closed-msg{display:none;text-align:center;padding:10px 0;}
  .closed-msg.show{display:block;}
  .closed-msg p{color:var(--absent);font-size:18px;margin:0 0 6px;}
  .closed-msg span{color:var(--muted);font-size:16px;}

  .qr-img-box{
    width:100%;flex:1;min-height:220px;border-radius:12px;border:1.5px dashed var(--line);
    display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--bg);
  }
  .qr-img-box img{width:100%;height:100%;object-fit:contain;background:#fff;}
  .qr-img-box .empty{color:var(--muted);font-size:16px;text-align:center;padding:12px;}

  .summary{font-size:17px;color:var(--muted);margin-bottom:16px;}
  .summary b{color:var(--ink);font-size:24px;font-weight:400;}

  .seatgrid{display:grid;grid-template-columns:repeat(auto-fill, minmax(78px, 1fr));gap:10px;}
  .seat{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:10px 4px 8px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel2);transition:background .3s ease, border-color .3s ease;
  }
  .bulb{width:16px;height:16px;border-radius:50%;background:#2a322c;transition:background .35s ease, box-shadow .35s ease;}
  .seat.on-present{background:var(--present-bg);border-color:var(--present);}
  .seat.on-present .bulb{background:var(--present);box-shadow:0 0 10px 3px rgba(46,207,149,.5);}
  .seat.on-late{background:var(--late-bg);border-color:var(--late);}
  .seat.on-late .bulb{background:var(--late);box-shadow:0 0 10px 3px rgba(232,179,60,.45);}
  .seat.on-leave{background:var(--leave-bg);border-color:var(--leave);}
  .seat.on-leave .bulb{background:var(--leave);box-shadow:0 0 10px 3px rgba(106,169,224,.45);}
  .seat.on-absent{background:var(--absent-bg);border-color:var(--absent);}
  .seat.on-absent .bulb{background:var(--absent);}
  .seat.mine{border-width:2px;border-color:var(--ink);}
  .seat.just-on .bulb{ animation: flicker .7s ease; }
  @keyframes flicker {
    0%{transform:scale(.5);opacity:.3;}
    55%{transform:scale(1.35);opacity:1;}
    100%{transform:scale(1);}
  }
  .seat .id{font-size:15px;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:15px;color:var(--muted);}
  .legend span{display:flex;align-items:center;gap:6px;}
  .legend i{width:11px;height:11px;border-radius:50%;display:inline-block;}

  .admin-row{text-align:center;margin-top:20px;}
  .admin-btn{
    width:auto;padding:10px 20px;border-radius:999px;
    background:transparent;border:1px solid var(--line);
    color:var(--muted);font-size:16px;
  }
  .admin-btn:hover{color:var(--ink);border-color:var(--muted);}
  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-grid">
    <div class="card">
      <div class="cls" id="clsName">…</div>
      <h1 id="question">불러오는 중…</h1>

      <div class="clock" id="clock"><b id="clockMain">—</b><span id="clockSub"></span></div>

      <div class="form" id="form">
        <label for="studentId">학번</label>
        <input type="text" id="studentId" inputmode="numeric" pattern="[0-9]*" maxlength="5" placeholder="예: 30201">
        <div class="err" id="idErr">학번은 숫자 5자리로 입력해주세요</div>

        <label for="answer">답변</label>
        <textarea id="answer" placeholder="짧게 적어주세요"></textarea>
        <div class="err" id="answerErr">답변을 2자 이상 입력해주세요 (마침표 등 기호만은 안돼요)</div>

        <button id="submitBtn">제출하고 출석 체크</button>
      </div>

      <div class="done" id="done">
        <p id="doneMsg">내 자리에 불이 켜졌어요. 아래에서 확인해보세요.</p>
      </div>

      <div class="closed-msg" id="closedMsg">
        <p>제출 시간이 지났어요</p>
        <span>선생님께 말씀드리면 직접 처리해주십니다.</span>
      </div>
    </div>

    <div class="card">
      <div class="cls" style="margin-bottom:4px;" id="clsName2">…</div>
      <div class="cls" style="margin-bottom:12px;">QR로 접속하기</div>
      <div class="qr-img-box" id="qrImgBox">
        <div class="empty">등록된 QR 사진이 없어요</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="summary">우리 반 현황 · 출석 <b id="presentCount">0</b> / <span id="totalCount">0</span>명</div>
    <div class="seatgrid" id="grid"></div>
    <div class="legend">
      <span><i style="background:#2ecf95"></i>출석</span>
      <span><i style="background:#e8b33c"></i>지각</span>
      <span><i style="background:#6aa9e0"></i>조퇴</span>
      <span><i style="background:#d9634a"></i>결석</span>
      <span><i style="background:#2a322c"></i>미제출</span>
    </div>
  </div>

  <div class="admin-row">
    <button class="admin-btn" id="adminBtn">🔒 교사용(관리자) 모드</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot, collection, query, where }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA3CxawUPIfGeBWyffsNbCSM3ymjKHLH6o",
  authDomain: "moon-d528d.firebaseapp.com",
  projectId: "moon-d528d",
  storageBucket: "moon-d528d.firebasestorage.app",
  messagingSenderId: "126636401536",
  appId: "1:126636401536:web:25b8a8296ec42b86f99765"
};
const db = getFirestore(initializeApp(firebaseConfig));

/* ===== 시간표 =====
   0=일 1=월 2=화 3=수 4=목 5=금 6=토
   수업이 늘거나 바뀌면 이 부분만 고치면 됩니다. */
const TIMETABLE = {
  1: { period: '4교시', start: '11:20', end: '12:10' },
  3: { period: '3교시', start: '10:20', end: '11:10' },
  4: { period: '6교시', start: '14:10', end: '15:00' }
};
const LATE_AFTER_MIN  = 5;   // 시작 후 이만큼 지나면 지각
const CLOSE_AFTER_MIN = 20;  // 시작 후 이만큼 지나면 제출 마감

const DEFAULT_CLASS = '미도약';
const DEFAULT_ROSTER = ["30201","30204","30207","30209","30210","30211","30213","30214","30215","30216","30218","30219","30220","30225","30226","30405","30409","30411","30415","30416","30417","30420","30425","30501","30506","30507","30508","30509","30512","30514","30516","30518","30520","30521","30522","30523","30525"];
const DEFAULT_QUESTION = '오늘 이 시간, 어떤 마음으로 왔나요? 한 줄로 적어주세요.';
const DAYS = ['일','월','화','수','목','금','토'];

/* ===== 오늘의 질문 후보 =====
   여기에 줄을 더하거나 지우면 질문이 바뀝니다.
   (교사용 파일 teacher.html의 QUESTIONS 목록도 똑같이 맞춰 주세요) */
const QUESTIONS = [
  /* — 나의 장점 — */
  '친구들이 말해준 내 장점 중에, 제일 기분 좋았던 말은 뭐야?',
  '남들은 어려워하는데 나는 은근 잘하는 일, 하나만 자랑해줘.',
  '오늘 나 자신을 칭찬해준다면 어떤 점을 칭찬하고 싶어?',
  '올해 들어 내가 조금이라도 늘었다고 느낀 건 뭐야?',
  '우리 반에서 내가 맡으면 제일 잘할 것 같은 역할은?',
  '힘들 때 나를 버티게 해주는 내 성격은 어떤 점일까?',
  '친구가 나한테 고맙다고 했던 순간이 있다면 언제야?',
  '10년 뒤의 내가 지금의 나를 칭찬한다면 뭐라고 할까?',
  '나랑 친해지면 좋은 점 한 가지만 소개해줘.',

  /* — 즐거웠던 고등학교 추억 — */
  '고등학교 와서 제일 크게 웃었던 순간은 언제야?',
  '우리 반에서 있었던 제일 웃긴 일 하나만 알려줘.',
  '지금까지 먹어본 학교 급식 중에 최고는 뭐였어?',
  '체육대회, 축제, 수학여행 중에 제일 기억에 남는 장면은?',
  '쉬는 시간에 친구들이랑 했던 일 중 제일 재밌던 건 뭐야?',
  '고등학교 와서 새로 친해진 친구 이야기 하나만 해줄래?',
  '교복 입고 찍은 사진 중에 제일 마음에 드는 건 어떤 사진이야?',
  '딱 하루만 다시 돌아가고 싶은 날이 있다면 언제야?',
  '선생님이나 친구한테 들은 말 중에 제일 힘이 됐던 말은?',
  '우리 반 하면 떠오르는 장면 하나를 사진처럼 적어줘.',

  /* — 수능 보고 나서 하고 싶은 일 — */
  '수능 끝나고 딱 하루, 뭐든 할 수 있다면 뭐 할 거야?',
  '수능 끝나면 제일 먼저 먹고 싶은 음식은?',
  '수능 끝나고 가장 먼저 만나고 싶은 사람은 누구야?',
  '수능 끝나고 몰아서 보고 싶은 드라마나 영화, 게임 있어?',
  '수능 끝나고 꼭 가보고 싶은 곳 한 군데만 적어줘.',
  '수능 끝난 날 밤, 어떤 기분일 것 같아?',
  '수능 끝나면 새로 배워보고 싶은 게 있어?',
  '실컷 자고 일어난 수능 다음 날 아침, 제일 하고 싶은 일은?',
  '수능 끝나고 친구들이랑 꼭 같이 하고 싶은 일은?',

  /* — 졸업하면 하고 싶은 일 — */
  '졸업하면 제일 해보고 싶은 일은 뭐야?',
  '스무 살이 되면 꼭 해보고 싶은 건?',
  '졸업하고 1년 뒤, 어떤 모습이면 기분 좋을까?',
  '어른이 되면 꼭 가보고 싶은 도시나 나라가 있어?',
  '나중에 직접 돈을 벌면 제일 먼저 사고 싶은 건?',
  '10년 뒤 내 하루는 어떤 모습이었으면 좋겠어?',
  '졸업식 날, 누구한테 제일 먼저 고맙다고 말하고 싶어?',
  '언젠가 꼭 이뤄보고 싶은 작은 꿈 하나만 적어줘.',

  /* — 오늘 기분 — */
  '오늘 아침에 기분 좋았던 사소한 일, 하나 있었어?',
  '요즘 나를 웃게 만드는 건 뭐야?',
  '요즘 제일 자주 듣는 노래 한 곡 추천해줘.',
  '오늘 수업 끝나면 뭐 하고 싶어?',
  '이번 주에 스스로 잘했다고 생각하는 일 하나는?',
  '지금 내 기분을 음식으로 표현하면 뭐야?',
  '오늘 하루가 좋은 하루가 되려면 무슨 일이 일어나면 될까?'
];

/* 날짜+반 이름으로 고정된 수를 만들어, 같은 날은 모두 같은 질문을 보게 합니다 */
function hashOf(s){
  let h = 2166136261;
  for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
/* mode: 'daily' 날마다 바뀜(기본) · 'each' 학생마다 다른 질문 */
function autoQuestion(mode){
  if (!QUESTIONS.length) return DEFAULT_QUESTION;
  if (mode === 'each'){
    const key = 'qIdx__' + DAY_KEY;
    let i = Number(sessionStorage.getItem(key));
    if (!Number.isInteger(i) || !sessionStorage.getItem(key)){
      i = Math.floor(Math.random() * QUESTIONS.length);
      try{ sessionStorage.setItem(key, String(i)); }catch(e){}
    }
    return QUESTIONS[i % QUESTIONS.length];
  }
  /* 날마다: 목록을 한 바퀴 다 돌 때까지 같은 질문이 다시 나오지 않게 건너뛰며 고릅니다 */
  const n = QUESTIONS.length;
  const gcd = (a,b) => b ? gcd(b, a % b) : a;
  let step = 1;
  for (const s of [7,5,11,13,17,19,23,3]) if (gcd(s, n) === 1) { step = s; break; }
  const days = Math.floor(Date.parse(TODAY) / 86400000);
  return QUESTIONS[(days * step + hashOf(CLASS_NAME)) % n];
}

const params = new URLSearchParams(location.search);
const CLASS_NAME = params.get('class') || DEFAULT_CLASS;
const TODAY = todayStr();
const DAY_KEY = CLASS_NAME + '__' + TODAY;

function todayStr(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function atTime(hhmm){
  const [h,m] = hhmm.split(':').map(Number);
  const d = new Date(); d.setHours(h,m,0,0); return d;
}
function hhmm(d){ const p=n=>String(n).padStart(2,'0'); return p(d.getHours())+':'+p(d.getMinutes()); }

const SLOT = TIMETABLE[new Date().getDay()] || null;
const LATE_AT  = SLOT ? atTime(SLOT.start).getTime() + LATE_AFTER_MIN*60000 : null;
const CLOSE_AT = SLOT ? atTime(SLOT.start).getTime() + CLOSE_AFTER_MIN*60000 : null;

document.getElementById('clsName').textContent = CLASS_NAME;
document.getElementById('clsName2').textContent = CLASS_NAME;

let ROSTER = DEFAULT_ROSTER.slice();
let myId = null, prevOn = new Set(), records = {};
let currentQuestion = autoQuestion('daily');
document.getElementById('question').textContent = currentQuestion;  // 접속하자마자 먼저 보여주기

/* ===== 시계 · 마감 안내 ===== */
function tick(){
  const el = document.getElementById('clock');
  const main = document.getElementById('clockMain');
  const sub  = document.getElementById('clockSub');
  const now = new Date();
  el.classList.remove('warn','closed');

  if (!SLOT) {
    main.textContent = hhmm(now);
    sub.textContent = '오늘은 수업이 없는 날이에요 (마감 없이 제출 가능)';
    return;
  }
  const label = DAYS[now.getDay()] + '요일 ' + SLOT.period + ' · ' + SLOT.start + '~' + SLOT.end;
  const left = CLOSE_AT - now.getTime();

  if (left <= 0) {
    el.classList.add('closed');
    main.textContent = '제출 마감';
    sub.textContent = label;
    lockForm();
  } else if (left <= 5*60000) {
    el.classList.add('warn');
    main.textContent = '마감까지 ' + Math.ceil(left/60000) + '분';
    sub.textContent = label;
  } else {
    main.textContent = hhmm(now);
    sub.textContent = label + ' · ' + hhmm(new Date(CLOSE_AT)) + ' 마감';
  }
}
function lockForm(){
  if (document.getElementById('done').classList.contains('show')) return;
  document.getElementById('form').classList.add('hide');
  document.getElementById('closedMsg').classList.add('show');
}
tick();
setInterval(tick, 1000);

/* ===== 반 설정 ===== */
onSnapshot(doc(db,'classes',CLASS_NAME), snap => {
  const d = snap.exists() ? snap.data() : {};
  /* questionMode: 'daily'(기본) · 'each' · 'fixed'(선생님이 직접 적은 질문) */
  const mode = d.questionMode || 'daily';
  currentQuestion = (mode === 'fixed' && d.question) ? d.question : autoQuestion(mode);
  document.getElementById('question').textContent = currentQuestion;
  if (Array.isArray(d.roster) && d.roster.length) ROSTER = d.roster;
  render();
}, e => { console.error(e); document.getElementById('question').textContent = currentQuestion; });

/* ===== QR ===== */
onSnapshot(doc(db,'qr',CLASS_NAME), snap => {
  const box = document.getElementById('qrImgBox');
  const d = snap.exists() ? snap.data() : {};
  if (d.dataUrl) {
    const img = document.createElement('img');
    img.src = d.dataUrl; img.alt = 'QR';
    box.replaceChildren(img);
  } else box.innerHTML = '<div class="empty">등록된 QR 사진이 없어요</div>';
}, e => console.error(e));

/* ===== 오늘 기록 실시간 ===== */
onSnapshot(query(collection(db,'attendance'), where('dayKey','==',DAY_KEY)), snap => {
  records = {};
  snap.forEach(d => { const r = d.data(); records[String(r.studentId)] = r; });
  render();
}, e => console.error(e));

/* 상태 → 불 색깔 */
function toneOf(status){
  if (!status) return '';
  if (status === '출석') return 'on-present';
  if (status.indexOf('지각') > -1) return 'on-late';
  if (status.indexOf('조퇴') > -1) return 'on-leave';
  if (status.indexOf('결석') > -1) return 'on-absent';
  return '';
}

function render(){
  const list = ROSTER.map(id => {
    const rec = records[String(id)];
    return { id: String(id), tone: toneOf(rec && rec.status) };
  });
  document.getElementById('presentCount').textContent =
    list.filter(s => s.tone === 'on-present' || s.tone === 'on-late').length;
  document.getElementById('totalCount').textContent = list.length;

  document.getElementById('grid').innerHTML = list.map(s => {
    const justOn = s.tone && !prevOn.has(s.id);
    const mine = myId && s.id === String(myId);
    return `<div class="seat ${s.tone} ${justOn?'just-on':''} ${mine?'mine':''}">
      <div class="bulb"></div><div class="id">${s.id}</div></div>`;
  }).join('');

  prevOn = new Set(list.filter(s => s.tone).map(s => s.id));
}

/* ===== 입력 검사 ===== */
const isValidAnswer = s => { const t=(s||'').trim(); return t.length>=2 && /[\p{L}\p{N}]/u.test(t); };
const isValidId = s => /^\d{5}$/.test((s||'').trim());

document.getElementById('studentId').addEventListener('input', e => {
  e.target.value = e.target.value.replace(/\D/g,'').slice(0,5);
});

/* ===== 제출 ===== */
document.getElementById('submitBtn').addEventListener('click', async () => {
  if (CLOSE_AT && Date.now() > CLOSE_AT) { lockForm(); return; }

  const id = document.getElementById('studentId').value.trim();
  const answer = document.getElementById('answer').value.trim();
  let bad = false;

  document.getElementById('idErr').style.display = isValidId(id) ? 'none' : (bad=true,'block');
  document.getElementById('answerErr').style.display = isValidAnswer(answer) ? 'none' : (bad=true,'block');
  if (bad) return;

  const status = (LATE_AT && Date.now() > LATE_AT) ? '지각' : '출석';
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = '제출 중...';

  try{
    await setDoc(doc(db,'attendance', DAY_KEY+'__'+id), {
      dayKey: DAY_KEY, className: CLASS_NAME, date: TODAY, studentId: id,
      status, answer, question: currentQuestion, ts: Date.now(),
      time: new Date().toTimeString().slice(0,8),
      period: SLOT ? SLOT.period : ''
    }, { merge: true });

    myId = id;
    document.getElementById('form').classList.add('hide');
    document.getElementById('done').classList.add('show');
    document.getElementById('doneMsg').textContent = status === '지각'
      ? '지각으로 기록되었어요. 자리에 노란 불이 켜졌습니다.'
      : '내 자리에 불이 켜졌어요. 아래에서 확인해보세요.';
  }catch(e){
    btn.disabled = false; btn.textContent = '제출하고 출석 체크';
    alert('제출에 실패했어요: ' + (e.message || e));
  }
});

/* ===== 교사용(관리자) 모드로 이동 ===== */
document.getElementById('adminBtn').addEventListener('click', () => {
  location.href = location.pathname.replace(/[^/]*$/, 'teacher.html') +
    (CLASS_NAME !== DEFAULT_CLASS ? '?class=' + encodeURIComponent(CLASS_NAME) : '');
});
</script>
