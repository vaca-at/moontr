<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>출석체크 - 교사용</title>
<style>
  :root{
    --ink:#1c1f1a; --paper:#f6f4ee; --line:#d9d5c7;
    --present:#3f6b4a; --present-bg:#e4ede4;
    --absent:#b3492f; --absent-bg:#f6e2da;
    --muted:#8a8677;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;padding:20px 16px 60px;}
  .wrap{max-width:1200px;margin:0 auto;}
  h1{font-size:20px;margin:0 0 2px;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:16px;}
  .panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px;}
  textarea, input[type=text], input[type=password], input[type=file]{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:14px;background:var(--paper);color:var(--ink);font-family:inherit;}
  textarea{min-height:64px;resize:vertical;}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  button.small{padding:8px 14px;border:none;border-radius:8px;background:var(--ink);color:#fff;font-size:13px;cursor:pointer;}
  button.ghost{padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-size:13px;cursor:pointer;}
  .link-box{display:flex;gap:8px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;word-break:break-all;}
  .summary{font-size:14px;margin-bottom:14px;}
  .summary b{font-size:20px;}

  .main-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;align-items:start;}
  @media (max-width: 860px){ .main-grid{grid-template-columns:1fr;} }

  .seatgrid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(74px, 1fr));
    gap:10px;
  }
  .seat{
    display:flex;flex-direction:column;align-items:center;gap:7px;
    padding:12px 6px 10px;border-radius:14px;border:1.5px solid var(--line);
    background:#fbfaf6;cursor:pointer;transition:background .3s ease, border-color .3s ease;
  }
  .seat.present{background:var(--present-bg);border-color:var(--present);}
  .bulb{
    width:22px;height:22px;border-radius:50%;
    background:#d8d4c5;
    transition:background .35s ease, box-shadow .35s ease;
  }
  .seat.present .bulb{
    background:radial-gradient(circle at 35% 30%, #a9e0b6, var(--present));
    box-shadow:0 0 14px 4px rgba(63,107,74,0.55);
  }
  .seat.just-on .bulb{ animation: flicker .7s ease; }
  @keyframes flicker {
    0%{transform:scale(.5);opacity:.3;}
    55%{transform:scale(1.35);opacity:1;box-shadow:0 0 22px 8px rgba(63,107,74,0.7);}
    100%{transform:scale(1);}
  }
  .seat .id{font-size:12px;font-weight:700;}
  .seat .ans{font-size:10px;color:var(--muted);max-width:66px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .hint{font-size:12px;color:var(--muted);margin-top:8px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s ease;}
  .toast.show{opacity:1;}

  .qr-panel{position:sticky;top:20px;}
  .qr-img-box{
    width:100%;aspect-ratio:1;border-radius:12px;border:1.5px dashed var(--line);
    display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--paper);
    margin-bottom:12px;
  }
  .qr-img-box img{width:100%;height:100%;object-fit:contain;background:#fff;}
  .qr-img-box .empty{color:var(--muted);font-size:13px;text-align:center;padding:12px;}
  .qr-form{display:none;flex-direction:column;gap:8px;margin-top:8px;}
  .qr-form.show{display:flex;}
  .err{color:var(--absent);font-size:12px;display:none;}

  .gate{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .gate.hide{display:none;}
  .gate .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;width:min(340px,100%);}
  .gate h2{font-size:16px;margin:0 0 4px;}
  .gate p{font-size:12px;color:var(--muted);margin:0 0 14px;}
  .gate input{margin-bottom:10px;}
  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important;} }
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="box">
    <h2>교사용 화면</h2>
    <p>암호를 입력하면 오늘 현황이 열립니다.</p>
    <input type="password" id="gatePw" placeholder="암호">
    <button class="small" id="gateBtn" style="width:100%;">열기</button>
    <div class="err" id="gateErr">암호가 맞지 않습니다.</div>
  </div>
</div>

<div class="wrap">
  <h1><span id="clsTitle">…</span> · 교사용 (전자칠판)</h1>
  <div class="sub">학생이 제출하면 자리에 불이 바로 켜집니다. 자리를 눌러 수동으로 바꿀 수도 있어요.</div>

  <div class="panel">
    <label>학생용 링크 (수업 시작 전 학생들에게 공유)</label>
    <div class="link-box">
      <span id="studentUrl">…</span>
      <button class="ghost" id="copyBtn" style="flex-shrink:0;">복사</button>
    </div>
    <div class="hint">깃허브에서 파일을 고치면 베셀이 알아서 다시 띄워주므로, 이 링크는 계속 그대로입니다.</div>
  </div>

  <div class="panel">
    <label for="questionInput">오늘의 질문</label>
    <textarea id="questionInput"></textarea>
    <div class="row" style="margin-top:8px;">
      <button class="small" id="saveQBtn">질문 저장</button>
    </div>
  </div>

  <div class="main-grid">
    <div class="panel">
      <div class="summary">출석 <b id="presentCount">0</b> / <span id="totalCount">0</span>명</div>
      <div class="seatgrid" id="grid"></div>
      <div class="row" style="margin-top:16px;">
        <button class="ghost" id="csvToday">오늘 기록 CSV 내려받기</button>
        <button class="ghost" id="csvAll">전체 기록 CSV 내려받기</button>
      </div>
    </div>

    <div class="panel qr-panel">
      <label>QR 사진</label>
      <div class="qr-img-box" id="qrImgBox">
        <div class="empty">등록된 사진이 없어요</div>
      </div>
      <button class="ghost" id="qrToggleBtn" style="width:100%;">사진 등록/변경</button>

      <div class="qr-form" id="qrForm">
        <input type="file" id="qrFile" accept="image/*">
        <div class="err" id="qrErr"></div>
        <div class="row">
          <button class="small" id="qrSaveBtn" style="flex:1;">저장</button>
          <button class="ghost" id="qrCancelBtn">취소</button>
        </div>
      </div>

      <label style="margin-top:18px;" for="rosterInput">명단 (학번, 쉼표로 구분)</label>
      <textarea id="rosterInput"></textarea>
      <button class="small" id="saveRosterBtn" style="width:100%;margin-top:8px;">명단 저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, doc, setDoc, onSnapshot, collection, query, where, getDocs
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA3CxawUPIfGeBWyffsNbCSM3ymjKHLH6o",
  authDomain: "moon-d528d.firebaseapp.com",
  projectId: "moon-d528d",
  storageBucket: "moon-d528d.firebasestorage.app",
  messagingSenderId: "126636401536",
  appId: "1:126636401536:web:25b8a8296ec42b86f99765"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 여기를 바꾸면 교사 화면 암호가 바뀝니다 */
const TEACHER_PW = '1234';

const DEFAULT_CLASS = '미도약';
const DEFAULT_ROSTER = ["30201","30204","30207","30209","30210","30211","30213","30214","30215","30216","30218","30219","30220","30225","30226","30405","30409","30411","30415","30416","30417","30420","30425","30501","30506","30507","30508","30509","30512","30514","30516","30518","30520","30521","30522","30523","30525"];
const DEFAULT_QUESTION = '오늘 이 시간, 어떤 마음으로 왔나요? 한 줄로 적어주세요.';
const LIGHT_ON_MINUTES = 60;

const params = new URLSearchParams(location.search);
const CLASS_NAME = params.get('class') || DEFAULT_CLASS;
const TODAY = todayStr();
const DAY_KEY = CLASS_NAME + '__' + TODAY;

function todayStr(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}

document.getElementById('clsTitle').textContent = CLASS_NAME;
document.getElementById('studentUrl').textContent =
  location.origin + location.pathname.replace(/teacher\.html?$/, '') +
  (CLASS_NAME !== DEFAULT_CLASS ? '?class=' + encodeURIComponent(CLASS_NAME) : '');

let ROSTER = DEFAULT_ROSTER.slice();
let records = {};
let prevPresent = new Set();

/* ===== 암호 화면 ===== */
const gate = document.getElementById('gate');
if (sessionStorage.getItem('teacherOk') === '1') gate.classList.add('hide');
document.getElementById('gateBtn').addEventListener('click', () => {
  if (document.getElementById('gatePw').value === TEACHER_PW) {
    sessionStorage.setItem('teacherOk', '1');
    gate.classList.add('hide');
  } else {
    document.getElementById('gateErr').style.display = 'block';
  }
});
document.getElementById('gatePw').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('gateBtn').click();
});

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

/* ===== 반 설정 (질문 · 명단) ===== */
onSnapshot(doc(db, 'classes', CLASS_NAME), (snap) => {
  const d = snap.exists() ? snap.data() : {};
  const qEl = document.getElementById('questionInput');
  if (document.activeElement !== qEl) qEl.value = d.question || DEFAULT_QUESTION;
  if (Array.isArray(d.roster) && d.roster.length) ROSTER = d.roster;
  const rEl = document.getElementById('rosterInput');
  if (document.activeElement !== rEl) rEl.value = ROSTER.join(',');
  render();
}, e => console.error(e));

document.getElementById('saveQBtn').addEventListener('click', async () => {
  try{
    await setDoc(doc(db, 'classes', CLASS_NAME),
      { question: document.getElementById('questionInput').value.trim() }, { merge: true });
    showToast('질문 저장됨 — 학생 화면에 바로 반영돼요');
  }catch(e){ showToast('저장 실패'); }
});

document.getElementById('saveRosterBtn').addEventListener('click', async () => {
  const ids = document.getElementById('rosterInput').value
    .split(',').map(s => s.trim()).filter(Boolean);
  try{
    await setDoc(doc(db, 'classes', CLASS_NAME), { roster: ids }, { merge: true });
    showToast('명단 ' + ids.length + '명 저장됨');
  }catch(e){ showToast('저장 실패'); }
});

/* ===== 오늘 출석 실시간 ===== */
onSnapshot(
  query(collection(db, 'attendance'), where('dayKey', '==', DAY_KEY)),
  (snap) => {
    records = {};
    snap.forEach(d => { const r = d.data(); records[String(r.studentId)] = r; });
    render();
  },
  e => console.error(e)
);

function buildList(){
  return ROSTER.map(id => {
    const rec = records[String(id)];
    const minutesAgo = rec && rec.ts ? (Date.now() - rec.ts) / 60000 : Infinity;
    return {
      id: String(id),
      present: !!rec && rec.status === '출석' && minutesAgo <= LIGHT_ON_MINUTES,
      answer: rec ? (rec.answer || '') : '',
      time: rec ? (rec.time || '') : ''
    };
  });
}

function render(){
  const list = buildList();
  document.getElementById('presentCount').textContent = list.filter(s => s.present).length;
  document.getElementById('totalCount').textContent = list.length;

  document.getElementById('grid').innerHTML = list.map(s => {
    const justOn = s.present && !prevPresent.has(s.id);
    const ans = s.present ? String(s.answer).replace(/</g,'&lt;') : '';
    return `<div class="seat ${s.present ? 'present' : ''} ${justOn ? 'just-on' : ''}" data-id="${s.id}" data-present="${s.present}">
      <div class="bulb"></div>
      <div class="id">${s.id}</div>
      <div class="ans">${ans}</div>
    </div>`;
  }).join('');

  prevPresent = new Set(list.filter(s => s.present).map(s => s.id));
}

/* 자리를 눌러 수동으로 뒤집기 */
document.getElementById('grid').addEventListener('click', async (e) => {
  const seat = e.target.closest('.seat');
  if (!seat) return;
  const id = seat.dataset.id;
  const makePresent = seat.dataset.present !== 'true';
  try{
    await setDoc(doc(db, 'attendance', DAY_KEY + '__' + id), {
      dayKey: DAY_KEY, className: CLASS_NAME, date: TODAY, studentId: id,
      status: makePresent ? '출석' : '결석',
      ts: Date.now(),
      time: new Date().toTimeString().slice(0,8)
    }, { merge: true });
    showToast(makePresent ? '출석으로 변경' : '결석으로 변경');
  }catch(err){ showToast('변경 실패'); }
});

/* ===== CSV 내려받기 =====
   맨 앞의 \uFEFF 가 있어야 엑셀에서 한글이 깨지지 않습니다. */
function downloadCsv(rows, filename){
  const head = ['반','날짜','학번','출결','답변','제출시각'];
  const esc = v => '"' + String(v ?? '').replace(/"/g,'""') + '"';
  const body = rows.map(r => r.map(esc).join(',')).join('\r\n');
  const csv = '\uFEFF' + head.map(esc).join(',') + '\r\n' + body;
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

document.getElementById('csvToday').addEventListener('click', () => {
  const rows = buildList().map(s => [
    CLASS_NAME, TODAY, s.id, s.present ? '출석' : '결석', s.answer, s.time
  ]);
  downloadCsv(rows, `출석_${CLASS_NAME}_${TODAY}.csv`);
  showToast('오늘 기록을 내려받았어요');
});

document.getElementById('csvAll').addEventListener('click', async () => {
  try{
    const snap = await getDocs(
      query(collection(db, 'attendance'), where('className', '==', CLASS_NAME))
    );
    const rows = [];
    snap.forEach(d => {
      const r = d.data();
      rows.push([r.className, r.date, r.studentId, r.status, r.answer || '', r.time || '']);
    });
    rows.sort((a,b) => (a[1] === b[1]) ? (a[2] > b[2] ? 1 : -1) : (a[1] < b[1] ? 1 : -1));
    downloadCsv(rows, `출석_${CLASS_NAME}_전체.csv`);
    showToast(rows.length + '줄을 내려받았어요');
  }catch(e){ showToast('내려받기 실패'); }
});

/* ===== QR 사진 ===== */
onSnapshot(doc(db, 'qr', CLASS_NAME), (snap) => {
  const box = document.getElementById('qrImgBox');
  const d = snap.exists() ? snap.data() : {};
  if (d.dataUrl) {
    const img = document.createElement('img');
    img.src = d.dataUrl; img.alt = 'QR';
    box.replaceChildren(img);
  } else {
    box.innerHTML = '<div class="empty">등록된 사진이 없어요</div>';
  }
}, e => console.error(e));

function resizeImageFile(file, maxSize){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxSize || h > maxSize) {
          const scale = maxSize / Math.max(w, h);
          w = Math.round(w * scale); h = Math.round(h * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = () => reject(new Error('이미지를 읽을 수 없어요'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('파일을 읽을 수 없어요'));
    reader.readAsDataURL(file);
  });
}

document.getElementById('qrToggleBtn').addEventListener('click', () => {
  document.getElementById('qrForm').classList.toggle('show');
});
document.getElementById('qrCancelBtn').addEventListener('click', () => {
  document.getElementById('qrForm').classList.remove('show');
  document.getElementById('qrErr').style.display = 'none';
});

document.getElementById('qrSaveBtn').addEventListener('click', async () => {
  const fileInput = document.getElementById('qrFile');
  const errEl = document.getElementById('qrErr');
  errEl.style.display = 'none';

  if(!fileInput.files || !fileInput.files[0]){
    errEl.textContent = '사진 파일을 선택해주세요';
    errEl.style.display = 'block';
    return;
  }

  const btn = document.getElementById('qrSaveBtn');
  btn.disabled = true;
  btn.textContent = '저장 중...';
  try{
    const dataUrl = await resizeImageFile(fileInput.files[0], 600);
    if (dataUrl.length > 700000) throw new Error('사진 용량이 너무 커요. 더 작은 사진으로 해주세요.');
    await setDoc(doc(db, 'qr', CLASS_NAME), {
      dataUrl, fileName: fileInput.files[0].name
    }, { merge: true });
    showToast('사진 저장됨');
    document.getElementById('qrForm').classList.remove('show');
    fileInput.value = '';
  }catch(e){
    errEl.textContent = e.message || '저장 실패';
    errEl.style.display = 'block';
  }
  btn.disabled = false;
  btn.textContent = '저장';
});

document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('studentUrl').textContent)
    .then(() => showToast('링크 복사됨'));
});
</script>
</body>
</html>
