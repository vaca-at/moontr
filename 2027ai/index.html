<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디지털 도구로 확장하는 도덕·윤리 수업</title>
<meta name="description" content="도덕·윤리 선생님 3시간 연수: 생성형 AI로 수업용 웹앱을 만들어 깃허브로 올리고, 기록 저장과 개인정보까지 점검해요.">
<meta property="og:title" content="디지털 도구로 확장하는 도덕·윤리 수업">

<style>
/* ===== 디자인: 발표 화면 (2026-11-22)
   회색 바탕 위에 16:9 흰 슬라이드 한 장. 검은 글씨 · 파란 강조 하나 · 각진 단추 · 얇은 선.
   그라데이션 · 이모지 · 둥근 알약 단추는 쓰지 않아요 (문쌤: "AI스러운 디자인 싫음") */
:root{--ink:#1A1A1A;--sub:#6B6C72;--line:#E3E4E8;--line2:#C8C9CF;--bg:#ECEEF1;--acc:#0057B8;--acc-s:#EAF2FC;--acc-l:#C9DCF3;--ok:#0E8A5F;--ok-s:#E7F5EE;--warn:#B54708;--warn-s:#FDF1E7}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 Pretendard,-apple-system,"Malgun Gothic",sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:var(--acc)}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 18px;border:1px solid var(--ink);background:var(--ink);color:#fff;font-size:15px;font-weight:600;white-space:nowrap;text-decoration:none}
.btn:hover{background:#333}
.btn.w{background:#fff;color:var(--ink);border-color:var(--line2)}.btn.w:hover{border-color:var(--ink)}
.btn.b{background:var(--acc);border-color:var(--acc)}.btn.b:hover{background:#00489A}
.btn.sm{height:32px;padding:0 12px;font-size:13.5px}
.btn.lg{height:52px;padding:0 28px;font-size:17px}
.btn:disabled{opacity:.4;cursor:not-allowed}
/* 위 · 아래 띠 */
.bar{position:fixed;left:0;right:0;display:flex;align-items:center;gap:14px;padding:0 24px;z-index:5}
.bar.top{top:0;height:64px;padding-right:76px}   /* 오른쪽 끝은 새로고침 단추(refresh.js) 자리 */
.bar.bot{bottom:0;height:72px;padding-left:120px}   /* 왼쪽 아래는 방문 수(visit.js) 자리 */
.hello{border:1.5px solid var(--acc);background:#fff;color:var(--acc);padding:7px 16px;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.hello b{font-weight:800}
.utag{margin-left:auto;border:1px solid var(--line2);background:#fff;padding:7px 14px;font-size:14.5px;font-weight:700;white-space:nowrap}
.utag span{color:var(--sub);font-weight:500}
.ico{width:40px;height:40px;border:1px solid var(--line2);background:#fff;display:grid;place-items:center;font-size:15px;font-weight:700}
.ico:hover{border-color:var(--ink)}
.pg{font-size:16px;font-weight:700;color:var(--acc);min-width:80px}
.prog{width:160px;height:4px;background:#D7D9DE}.prog i{display:block;height:100%;background:var(--acc)}
.tm{margin:0 auto;display:flex;align-items:center;gap:12px}
.tm .clock{font:800 30px/1 Pretendard;color:var(--acc);font-variant-numeric:tabular-nums}
.tm .clock.over{color:var(--warn)}
.tm .lab{font-size:14px;color:#444}
.nav{display:flex;gap:10px}
.nav .btn{height:46px;min-width:104px;font-size:16px}
/* 슬라이드 무대 */
#view{position:fixed;top:64px;bottom:72px;left:0;right:0;display:grid;place-items:center}
#frame{position:relative}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:#fff;border:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.05)}
.sl{position:absolute;inset:0;padding:46px 64px 40px;overflow:auto;display:flex;flex-direction:column}
.kick{font-size:14.5px;font-weight:700;color:var(--acc);margin-bottom:6px}
.sl h2{font-size:34px;line-height:1.3;letter-spacing:-.04em;font-weight:800}
.sl .lead{font-size:18px;color:#444;margin-top:8px;max-width:1040px}
.body{margin-top:24px;flex:1;min-height:0}
.cols{display:grid;gap:18px}
.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}
.card{border:1px solid var(--line);padding:18px 20px;background:#fff}
.card h4{font-size:17px;font-weight:800;margin-bottom:6px;letter-spacing:-.02em}
.card p,.card li{font-size:15.5px;color:#333}
.card .n{font:800 13px/1 Pretendard;color:var(--acc);margin-bottom:8px;display:block}
.card.k{background:var(--acc-s);border-color:var(--acc-l)}
.card.g{background:#F7F7F8}
ul.l{padding-left:20px}ul.l li{margin:3px 0}
ol.s{list-style:none;counter-reset:s}ol.s li{counter-increment:s;position:relative;padding:7px 0 7px 38px;border-bottom:1px solid var(--line);font-size:16px}
ol.s li:before{content:counter(s);position:absolute;left:0;top:8px;width:24px;height:24px;background:var(--ink);color:#fff;font:700 13px/24px Pretendard;text-align:center}
ol.s li:last-child{border-bottom:0}
.key{border-left:4px solid var(--acc);background:var(--acc-s);padding:12px 18px;font-size:16.5px;font-weight:600;margin-top:16px}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th{background:#F4F5F7;font-weight:700;text-align:left;padding:9px 12px;border:1px solid var(--line)}
table.t td{padding:9px 12px;border:1px solid var(--line);vertical-align:top}
.badge{display:inline-flex;border:1.5px solid var(--ink);font-size:14px;font-weight:700;margin-bottom:10px;align-self:flex-start}
.badge span{padding:4px 12px;border-right:1.5px solid var(--ink)}
.badge span:last-child{border-right:0}
.badge .f{background:var(--ink);color:#fff}
.badge .in{color:var(--acc)}
/* 입력 */
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:14.5px;font-weight:700;margin-bottom:4px}
.fld textarea,.fld input,.fld select{width:100%;border:1px solid var(--line2);background:#fff;padding:9px 12px;font-size:15.5px;line-height:1.5;resize:vertical}
.fld textarea:focus,.fld input:focus,.fld select:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:var(--acc)}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pk{border:1px solid var(--line2);background:#fff;padding:8px 14px;font-size:15px;font-weight:600;text-align:left}
.pk:hover{border-color:var(--ink)}
.pk.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pk small{display:block;font-weight:400;font-size:13px;color:var(--sub)}
.pk.on small{color:#ddd}
.tri{display:flex;gap:4px}
.tri .pk{padding:4px 10px;font-size:13.5px}
.tri .pk.on.ok{background:var(--ok);border-color:var(--ok)}
.tri .pk.on.half{background:#8A6D1F;border-color:#8A6D1F}
.tri .pk.on.no{background:var(--warn);border-color:var(--warn)}
label.ck{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:15.5px;cursor:pointer}
label.ck input{width:18px;height:18px;margin-top:3px;accent-color:var(--acc);flex:none}
.pr{border:1px solid var(--line2);background:#F7F7F8;position:relative;margin-top:6px}
.pr pre{white-space:pre-wrap;word-break:keep-all;font:500 14.5px/1.6 Pretendard;padding:14px 16px 14px 16px;max-height:330px;overflow:auto}
.pr .btn{position:absolute;right:8px;top:8px}
.pr .hd{font-size:13px;font-weight:700;color:var(--sub);padding:8px 16px 0}
.team{border:1.5px dashed var(--line2);padding:14px 16px;margin-top:8px}
.team h5{font-size:14.5px;font-weight:800;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.team h5 em{font-style:normal;font-weight:600;color:var(--acc)}
.team .nt{font-size:15px;padding:4px 0;border-bottom:1px solid var(--line)}
.team .nt:last-child{border-bottom:0}
.team .nt b{color:var(--sub);font-weight:600;margin-right:6px}
.muted{color:var(--sub);font-size:14px}
.ok-t{color:var(--ok);font-weight:700}.warn-t{color:var(--warn);font-weight:700}
.mock{border:1px solid var(--line2);background:#fff;font-size:14px}
.mock .mh{background:#F4F5F7;border-bottom:1px solid var(--line2);padding:6px 10px;font-weight:700;font-size:13px;color:#444}
.mock .mb{padding:10px 12px}
.add{color:#116329;background:#E6FFEC}.del{color:#82071E;background:#FFEBE9}
.code{font:500 14px/1.6 Consolas,"D2Coding",monospace}
/* 단원 표지 */
.unit{position:absolute;inset:0;display:grid;grid-template-columns:400px 1fr}
.unit .lft{background:var(--ink);color:#fff;padding:56px 48px;display:flex;flex-direction:column}
.unit .lft .no{font:800 130px/1 Pretendard;letter-spacing:-.05em}
.unit .lft .nm{font-size:30px;font-weight:800;margin-top:14px;line-height:1.3}
.unit .lft .mn{margin-top:auto;font-size:17px;color:#bbb}
.unit .rgt{padding:56px 60px;overflow:auto}
.unit h3{font-size:15px;color:var(--acc);font-weight:800;margin:0 0 8px}
.unit .rgt ol.s{margin-bottom:26px}
.unit .rgt ol.s li span{float:right;color:var(--sub);font-size:14px}
/* 표지 */
.cover{position:absolute;inset:0;padding:80px 90px;display:flex;flex-direction:column}
.cover .k{font-size:17px;font-weight:700;color:var(--acc)}
.cover h1{font-size:58px;line-height:1.22;letter-spacing:-.05em;margin:16px 0 18px}
.cover .sub{font-size:21px;color:#444}
.cover .flow4{margin-top:auto;display:grid;grid-template-columns:repeat(4,1fr);border-top:2px solid var(--ink)}
.cover .flow4 div{padding:14px 16px 0 0;font-size:15px;color:#444}
.cover .flow4 b{display:block;font-size:19px;color:var(--ink)}
/* 로그인 · 강사 화면 (슬라이드 밖) */
.page{position:fixed;inset:0;overflow:auto;background:var(--bg)}
.login{max-width:560px;margin:7vh auto 40px;background:#fff;border:1px solid var(--line);padding:40px 44px}
.login .k{font-size:14px;font-weight:700;color:var(--acc)}
.login h1{font-size:28px;line-height:1.3;letter-spacing:-.04em;margin:6px 0 10px}
.login p{color:#444;font-size:15px}
.login .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.adm{max-width:1240px;margin:24px auto 60px;padding:0 20px}
.adm h2{font-size:22px;margin:26px 0 10px}
.adm table.t{background:#fff}
.adm .tools{display:flex;gap:8px;flex-wrap:wrap}
.cm{font-size:13.5px;border-bottom:1px solid var(--line);padding:4px 0}
.cm time{color:var(--sub);margin-right:8px;font-variant-numeric:tabular-nums}
/* 이용약관 */
.policy-foot{max-width:560px;margin:0 auto 40px;font-size:13px;color:var(--sub)}
.policy-foot summary{cursor:pointer;padding:8px 0}
.policy-foot .pol{background:#fff;border:1px solid var(--line);padding:16px 20px;color:#333}
.policy-foot h4{font-size:14px;margin:10px 0 4px}
.policy-foot ul{padding-left:18px}
.policy-foot table{border-collapse:collapse;width:100%;margin:6px 0}
.policy-foot th,.policy-foot td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.admin-fab{position:fixed;right:14px;bottom:14px;font-size:12px;color:var(--sub);border:1px solid var(--line2);background:#fff;padding:5px 10px;text-decoration:none}
dialog{border:1px solid var(--line2);padding:0;max-width:760px;width:calc(100% - 32px);max-height:80vh}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog .dh{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);font-weight:800}
dialog .db{padding:12px 20px 20px;overflow:auto;max-height:calc(80vh - 60px)}
.toc h4{font-size:14px;color:var(--acc);margin:12px 0 4px}
.toc button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 8px;font-size:15px}
.toc button:hover{background:#F4F5F7}
.toc button.on{font-weight:800;background:var(--acc-s)}
.toc button i{font-style:normal;color:var(--sub);display:inline-block;width:34px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;font-size:14.5px;opacity:0;pointer-events:none;transition:.2s;z-index:50}
#toast.on{opacity:1}
.hidden-pw{display:none}
/* 휴대폰 세로: 슬라이드를 줄이지 않고 화면 폭에 맞춰 흘려 보여요 */
@media (max-width:760px){
  body{overflow:auto}
  .bar,.bar.top,.bar.bot{padding:0 12px;gap:8px}
  .hello{font-size:13px;padding:5px 10px;max-width:58vw}
  .utag{display:none}
  .prog,.tm .lab{display:none}
  .tm .clock{font-size:22px}
  .nav .btn{min-width:72px;height:42px}
  #view{position:static;display:block;padding:72px 0 84px}
  #frame{width:auto!important;height:auto!important}
  #stage{position:relative;width:auto;height:auto;transform:none!important;margin:0 8px}
  .sl{position:relative;padding:24px 18px}
  .sl h2{font-size:24px}
  .c2,.c3,.c4{grid-template-columns:1fr}
  .unit,.cover{position:relative;grid-template-columns:1fr;padding:28px 20px}
  .unit .lft{padding:24px}.unit .lft .no{font-size:64px}.unit .rgt{padding:24px}
  .cover h1{font-size:34px}.cover .flow4{grid-template-columns:1fr 1fr;margin-top:30px}
}
@media print{.bar{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<dialog id="dlg"><div class="dh"><span id="dlgT"></span><button class="btn w sm" data-act="dclose">닫기</button></div><div class="db" id="dlgB"></div></dialog>

<script>
/* ===================== 디지털 도구로 확장하는 도덕·윤리 수업 · 발표식 웹앱 (2026-11-22) =====================
   - 교안 = 이 웹앱. 슬라이드를 [이전] [다음]으로 넘기며 강의하고, 연수생은 같은 화면에서 입력해요.
   - 줄기: 바이브코딩 매뉴얼(/vibe) · 소나기 연수(/sonagi) · 진로탐구 특강 이론편(/stuvibe) · 실습편(/vibelab)
   - 연수생: 닉네임 + 모둠 번호 + 모둠 안 내 번호. 사회자 · 시간지기 · 도움지기 · 발표자는 단원마다 한 칸씩 돌아가요.
   - 저장: 이 기기(localStorage 'ai2027-slides-v1') + 연수용 Firebase(sonagi-1cc00) ai2027_live/{무작위 32자}
     서버에는 닉네임 · 모둠 · 지금 쪽 · 내 주소 · 동의 · 사회자 기록 · 판정 · 한 문장 약속만 보내요.
   - 마지막 쪽에서 [완료하고 로그아웃]을 누르면 이 기기 기록과 서버 기록이 모두 지워져요.
   - 강사 화면: 주소 끝 #admin (관리자 구글 계정). 연수생 진행 · 모둠 기록 · 깃허브 커밋 모아 보기
   - 규칙은 저장소의 firestore-sonagi.rules (ai2027_live) — 고치면 Firebase 콘솔(sonagi-1cc00)에 붙여 넣어 게시해야 해요
   - 슬라이드 내용은 아래 SLIDES 한 곳에서 고쳐요. 예전 웹앱(단원 · 활동 화면)은 old.html 에 있어요 */
const FIREBASE_CONFIG = { apiKey: "AIzaSyDEZIz_7wQcWQWO6v_1C5vhoYzAryqo59k", authDomain: "sonagi-1cc00.firebaseapp.com", projectId: "sonagi-1cc00", storageBucket: "sonagi-1cc00.firebasestorage.app", messagingSenderId: "760377216121", appId: "1:760377216121:web:81b25b9af707412d2218a8" };
const ADMIN_EMAILS = ["bellachord@gmail.com", "anstjsdud@sen.go.kr"];
const LS = "ai2027-slides-v1";
const COL = "ai2027_live";
const FRESH = 12 * 3600 * 1000;   /* 12시간 안에 쓴 기록만 '오늘 연수'로 봐요 */

let db = null, auth = null;
try { firebase.initializeApp(FIREBASE_CONFIG); db = firebase.firestore(); db.settings({ experimentalAutoDetectLongPolling: true, merge: true }); auth = firebase.auth(); } catch (e) { console.error(e); }

const S = { me: null, cur: 0, rec: {}, admin: null, members: [], commits: {}, team: [], board: [] };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const R = (k) => S.rec[k] ?? "";
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("on"), 2200); }
function copyText(t) { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("복사했어요. AI 채팅 창에 붙여 넣으세요"), () => { const a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); document.execCommand("copy"); a.remove(); toast("복사했어요"); }); }
function rid() { const a = new Uint8Array(16); crypto.getRandomValues(a); return [...a].map((x) => x.toString(16).padStart(2, "0")).join(""); }

/* ---------- 모둠 역할: 단원마다 한 칸씩 돌아가요 (1단원 사회자 = 1번, 2단원 사회자 = 2번 …) ---------- */
const ROLES = ["사회자", "시간지기", "도움지기", "발표자"];
const roleOf = (seat, u) => (seat >= 1 && seat <= 4 ? ROLES[(seat - u + 4) % 4] : "함께하기");
const isChair = (u) => S.me && S.me.seat === u;

/* ---------- 화면 조각 ---------- */
const LAB = {};   /* 입력 칸 이름 → 제목 (마지막 쪽 '내 기록'에 써요) */
function inp(k, label, ph = "", rows = 2) { LAB[k] = label; return `<label class="fld"><span>${label}</span><textarea data-f="${k}" rows="${rows}" placeholder="${esc(ph)}">${esc(R(k))}</textarea></label>`; }
function line(k, label, ph = "") { LAB[k] = label; return `<label class="fld"><span>${label}</span><input data-f="${k}" placeholder="${esc(ph)}" value="${esc(R(k))}"></label>`; }
function pick(k, opts, label) { if (label) LAB[k] = label; return `<div class="picks">${opts.map(([v, t, s]) => `<button class="pk ${R(k) === v ? "on" : ""}" data-pick="${k}" data-v="${esc(v)}">${t}${s ? `<small>${s}</small>` : ""}</button>`).join("")}</div>`; }
function tri(k) { const v = R(k); return `<div class="tri">${[["ok", "됨"], ["half", "화면만"], ["no", "안 됨"]].map(([x, t]) => `<button class="pk ${x} ${v === x ? "on" : ""}" data-pick="${k}" data-v="${x}">${t}</button>`).join("")}</div>`; }

function P(text, head) { return `<div class="pr">${head ? `<div class="hd">${head}</div>` : ""}<pre>${esc(text)}</pre><button class="btn w sm" data-copy>복사</button></div>`; }

/* 깃허브 주소에서 저장소 찾기: 아이디.github.io/앱이름 → github.com/아이디/앱이름 */
function repoOf(url) {
  const u = String(url || "").trim();
  let m = u.match(/^https?:\/\/([a-z0-9-]+)\.github\.io(?:\/([^\/?#]+))?/i);
  if (m) return { o: m[1], r: m[2] || `${m[1]}.github.io` };
  m = u.match(/^https?:\/\/github\.com\/([^\/?#]+)\/([^\/?#]+)/i);
  if (m) return { o: m[1], r: m[2].replace(/\.git$/, "") };
  return null;
}
function repoHint(url) { if (!url) return ""; const r = repoOf(url); return r ? `저장소: github.com/${esc(r.o)}/${esc(r.r)}` : "깃허브 주소가 아니라 커밋 기록은 모으지 않습니다"; }
function myRecordsHTML() {

  const rows = [...extra, ...ks.filter((k) => k !== "url").map((k) => [LAB[k], R(k)])];
  return rows.length ? rows.map(([a, b]) => `<div class="cm"><b>${esc(a)}</b><br>${esc(b)}</div>`).join("") : `<p class="muted">아직 쓴 기록이 없습니다.</p>`;
}

const T = { end: 0, label: "", id: 0 };
function startTimer(min, label) { T.end = Date.now() + min * 60000; T.label = label; clearInterval(T.id); T.id = setInterval(tick, 500); tick(); }
function stopTimer() { clearInterval(T.id); T.end = 0; renderBottom(); }
function tick() {
  const el = $("clock"); if (!el) return;
  const left = Math.round((T.end - Date.now()) / 1000), a = Math.abs(left);
  el.textContent = (left < 0 ? "-" : "") + String(Math.floor(a / 60)).padStart(2, "0") + ":" + String(a % 60).padStart(2, "0");
  el.classList.toggle("over", left <= 0);
}

function loginView() {
  return `<div class="page"><div class="login"><div class="k">고등학교 도덕 · 윤리 1급 정교사 자격연수</div><h1>디지털 도구로 확장하는<br>도덕 · 윤리 수업</h1><p>닉네임과 모둠 번호로 들어갑니다. 이름은 받지 않습니다. 마지막 쪽에서 [완료하고 로그아웃]을 누르면 오늘 기록이 모두 지워집니다.</p>
    <div style="height:20px"></div><label class="fld"><span>닉네임 (1~12글자)</span><input id="lnick" maxlength="12" placeholder="예) 윤리쌤"></label>
    <div class="row"><label class="fld"><span>모둠 번호</span><select id="lteam"><option value="">고르기</option>${Array.from({ length: 12 }, (_, i) => `<option>${i + 1}</option>`).join("")}</select></label>
      <label class="fld"><span>모둠 안 내 번호</span><select id="lseat"><option value="">고르기</option>${[1, 2, 3, 4, 5, 6].map((i) => `<option>${i}</option>`).join("")}</select></label></div>
    <p class="muted" style="margin:-2px 0 16px">모둠 안 번호는 모둠에서 1~4번을 정해 주세요. 단원 번호와 같은 번호가 그 단원의 사회자입니다.</p>
    <button class="btn b lg" style="width:100%" data-act="login">시작하기</button>
    <p style="margin-top:14px;text-align:center"><button class="btn w sm" data-act="guest">발표 화면으로 보기 (저장하지 않음)</button></p></div>
    <footer class="policy-foot"><details><summary>디지털 도구로 확장하는 도덕 · 윤리 수업 · 이용약관 · <b>개인정보 처리방침</b></summary><div class="pol">${POLICY_HTML}</div></details></footer>
    <a class="admin-fab" href="#admin">강사</a></div>`;
}

/* ---------- 강사 화면 (#admin) ---------- */
function adminView() {
  if (!auth) return `<div class="page"><div class="adm"><p>Firebase를 불러오지 못했어요.</p></div></div>`;
  if (!S.admin) return `<div class="page"><div class="login"><div class="k">강사 화면</div><h1>연수생 진행 · 모둠 기록</h1><p>관리자 구글 계정으로 들어가요.</p><div style="height:18px"></div><button class="btn b lg" style="width:100%" data-act="alogin"><img src="https://moontr.site/google-g.svg" alt="" width="18" height="18" style="vertical-align:-5px;margin-right:8px;background:#fff;border-radius:5px;padding:2px">구글 계정으로 로그인</button><p style="margin-top:14px;text-align:center"><a href="#" data-act="toslides">슬라이드로 돌아가기</a></p></div></div>`;
  const M = S.members, teams = [...new Set(M.map((m) => m.team))].sort((a, b) => a - b);
  const aids = [["13", "1단원 · 내 교실의 불편", ["가장 많이 나온 불편", "가장 의외였던 불편"]], ["21", "2단원 · 내 주소", ["주소까지 간 사람 수", "가장 많이 멈춘 단계"]], ["22", "2단원 · 커밋 나누기", ["가장 많이 막힌 곳", "가장 좋았던 고친 이유"]], ["35", "3단원 · 짝의 체크리스트", ["'안 됨'이 가장 많은 항목", "판단이 갈린 항목"]], ["44", "4단원 · 갤러리", ["모둠 대표 한 문장", "다음에 반영할 피드백"]]];
  return `<div class="page"><div class="adm"><div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><h2 style="margin:10px 0 2px">연수생 진행</h2><p class="muted">${M.length}명 · 12시간 안에 들어온 분만 보여요 · 닉네임만 받아요</p></div>
    <div class="tools"><button class="btn w sm" data-act="areload">새로 불러오기</button><button class="btn w sm" data-act="acommits">깃허브 커밋 모아 보기</button><button class="btn w sm" data-act="toslides">슬라이드</button><button class="btn w sm" data-act="aclear">오늘 기록 모두 지우기</button><button class="btn w sm" data-act="aout">나가기</button></div></div>
    <table class="t" style="margin-top:12px"><tr><th>모둠</th><th>닉네임</th><th>지금 쪽</th><th>내 주소</th><th>커밋 동의</th><th>판정</th><th>한 문장</th></tr>
    ${M.map((m) => `<tr><td>${m.team}-${m.seat}</td><td>${esc(m.nick)}</td><td>${(m.cur || 0) + 1} / ${SLIDES.length}<br><span class="muted">${esc((SLIDES[m.cur || 0] || {}).t || "표지")}</span></td><td>${m.url ? `<a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.url.replace(/^https:\/\//, ""))}</a>` : ""}</td><td>${m.ok ? "동의" : ""}</td><td>${esc(m.verdict || "")}</td><td>${esc(m.mvp || "")}</td></tr>`).join("")}</table>
    <h2>모둠 기록</h2><table class="t"><tr><th>활동</th>${teams.map((t) => `<th>${t}모둠</th>`).join("")}</tr>
    ${aids.map(([aid, name, labs]) => `<tr><td><b>${name}</b></td>${teams.map((t) => `<td>${M.filter((m) => m.team === t).map((m) => ["a", "b"].map((n, i) => (m.notes || {})[`t_${aid}_${n}`] ? `<div class="cm"><span class="muted">${labs[i]}</span><br>${esc(m.notes[`t_${aid}_${n}`])}</div>` : "").join("")).join("")}</td>`).join("")}</tr>`).join("")}</table>
    <h2>깃허브 커밋 (동의한 분만)</h2><div id="acm">${commitsHTML()}</div></div></div>`;
}
function commitsHTML() {
  const M = S.members.filter((m) => m.ok && repoOf(m.url));
  if (!M.length) return `<p class="muted">커밋 기록에 동의하고 깃허브 주소를 올린 분이 아직 없어요.</p>`;
  return `<div class="cols c2">${M.map((m) => { const r = repoOf(m.url), c = S.commits[m.id]; return `<div class="card"><h4>${m.team}-${m.seat} ${esc(m.nick)} <span class="muted" style="font-weight:500">github.com/${esc(r.o)}/${esc(r.r)}</span></h4>
    ${!c ? `<p class="muted">[깃허브 커밋 모아 보기]를 누르면 불러와요.</p>` : c.err ? `<p class="warn-t">${esc(c.err)}</p>` : c.list.map((x) => `<div class="cm"><time>${new Date(x.d).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })}</time>${esc(x.m)}</div>`).join("") + `<button class="btn w sm" style="margin-top:8px" data-act="aiprompt" data-v="${m.id}">AI 요약 프롬프트 복사</button>`}</div>`; }).join("")}</div>`;
}
async function adminLoad() {
  try { const s = await db.collection(COL).get(); S.members = s.docs.map((d) => ({ id: d.id, ...d.data() })).filter((d) => Date.now() - (d.updatedAt || 0) < FRESH).sort((a, b) => (a.team - b.team) || (a.seat - b.seat)); }
  catch (e) { toast("불러오지 못했어요 (" + (e.code || e.message) + ")"); }
  render();
}
async function adminCommits() {
  const M = S.members.filter((m) => m.ok && repoOf(m.url));
  await Promise.all(M.map(async (m) => {
    const r = repoOf(m.url);
    try {
      const res = await fetch(`https://api.github.com/repos/${encodeURIComponent(r.o)}/${encodeURIComponent(r.r)}/commits?per_page=30`);
      if (!res.ok) throw new Error(res.status === 404 ? "저장소를 찾지 못했어요 (주소 · 공개 여부 확인)" : res.status === 403 ? "깃허브 조회 한도에 걸렸어요. 한 시간 뒤 다시 눌러 주세요" : "불러오지 못했어요 (" + res.status + ")");
      const j = await res.json();
      S.commits[m.id] = { list: j.map((x) => ({ m: (x.commit.message || "").split("\n")[0], d: x.commit.author && x.commit.author.date })).reverse() };
    } catch (e) { S.commits[m.id] = { err: e.message }; }
  }));
  const el = $("acm"); if (el) el.innerHTML = commitsHTML();
}
function aiPrompt(id) {
  const m = S.members.find((x) => x.id === id), c = S.commits[id]; if (!m || !c || !c.list) return;
  copyText(`아래는 연수생 한 명이 수업용 웹앱을 만들며 남긴 깃허브 커밋 기록이야 (오래된 것부터).\n무엇을, 왜 고쳤는지 세 줄로 요약하고, 고친 이유가 사용자 관찰에서 나왔는지 한 줄로 평가해 줘.\n\n${c.list.map((x) => `- ${x.d} ${x.m}`).join("\n")}`);
}

/* ---------- 이벤트 ---------- */
document.addEventListener("click", async (e) => {
  const cp = e.target.closest("[data-copy]"); if (cp) { copyText(cp.previousElementSibling.textContent); return; }
  const pk = e.target.closest("[data-pick]");
  if (pk) { const k = pk.dataset.pick; S.rec[k] = S.rec[k] === pk.dataset.v && !/^j_|^s_/.test(k) ? "" : pk.dataset.v; save(); keepScroll(render); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "next") go(S.cur + 1);
  else if (a === "prev") go(S.cur - 1);
  else if (a === "login") signIn($("lnick").value, +$("lteam").value, +$("lseat").value);
  else if (a === "guest") guest();
  else if (a === "gout") { $("dlg").close(); S.me = null; saveLocal(); render(); }
  else if (a === "toc") openDlg("목차", tocHTML());
  else if (a === "jump") { $("dlg").close(); go(+b.dataset.v); }
  else if (a === "dclose") $("dlg").close();
  else if (a === "fs") { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); }
  else if (a === "tstart") { const s = SLIDES[S.cur]; startTimer(s.time, s.tl || ""); renderBottom(); }
  else if (a === "tstop") stopTimer();
  else if (a === "treload") loadTeam();
  else if (a === "greload") loadGallery();
  else if (a === "dl") download();
  else if (a === "finish") { if ($("dlg").open) $("dlg").close(); finish(); }
  else if (a === "policy") openDlg("이용약관 · 개인정보 처리방침", POLICY_HTML);
  else if (a === "alogin") { const p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({ prompt: "select_account" }); auth.signInWithPopup(p).catch((er) => toast("로그인하지 못했어요 (" + (er.code || er.message) + ")")); }
  else if (a === "aout") auth.signOut();
  else if (a === "areload") adminLoad();
  else if (a === "acommits") { toast("깃허브에서 불러오는 중…"); adminCommits(); }
  else if (a === "aiprompt") aiPrompt(b.dataset.v);
  else if (a === "toslides") { e.preventDefault(); history.replaceState(null, "", location.pathname); render(); }
  else if (a === "aclear") {
    if (!confirm(`지금 보이는 ${S.members.length}명의 기록을 모두 지울까요? 되돌릴 수 없어요.`)) return;
    try { await Promise.all(S.members.map((m) => db.collection(COL).doc(m.id).delete())); toast("지웠어요"); } catch (er) { toast("지우지 못했어요 (" + (er.code || er.message) + ")"); }
    adminLoad();
  }
});
/* 다시 그려도 슬라이드 안 스크롤 자리를 지켜요 */
function keepScroll(fn) { const el = document.querySelector(".sl"), y = el ? el.scrollTop : 0; fn(); const n = document.querySelector(".sl"); if (n) n.scrollTop = y; }
document.addEventListener("input", (e) => {
  const f = e.target.dataset && e.target.dataset.f; if (!f) return;
  S.rec[f] = e.target.value; save();
  if (f === "url") { const h = $("repoHint"); if (h) h.innerHTML = repoHint(e.target.value); }
});
document.addEventListener("change", (e) => {
  const c = e.target.dataset && e.target.dataset.c;
  if (c) { S.rec[c] = e.target.checked; save(); if (SLIDES[S.cur].id === "checklist") keepScroll(render); return; }
  if (e.target.dataset && e.target.dataset.f && SLIDES[S.cur] && SLIDES[S.cur].live) keepScroll(render);
});
document.addEventListener("keydown", (e) => {
  if (!S.me || location.hash === "#admin" || $("dlg").open) return;
  if (/INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || "")) return;
  if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); go(S.cur + 1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(S.cur - 1); }
});
addEventListener("resize", fit);
addEventListener("hashchange", () => { if (location.hash === "#admin" && S.admin) adminLoad(); else render(); });

/* ---------- 시작 ---------- */
SLIDES.forEach((s) => { try { s.html(); } catch (e) {} });   /* 입력 칸 이름표(LAB)를 미리 모아요 */
loadLocal();
if (location.search.includes("admin") && location.hash !== "#admin") location.hash = "admin";
if (auth) auth.onAuthStateChanged((u) => {
  if (u && !ADMIN_EMAILS.includes(u.email)) { auth.signOut(); toast("관리자 계정이 아니에요"); S.admin = null; render(); return; }   /* 관리자가 아닌 구글 계정은 바로 나가요 */
  S.admin = u || null; if (u && location.hash === "#admin") adminLoad(); else render();
});
render();
</script>
