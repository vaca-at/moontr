<style>
/* ===== 디자인: 데이터 실험실과 같은 '연수 과정형' =====
   흰 바탕 · 검은 글씨 · 파란 강조 하나 · 각진 단추 · 얇은 선. 그라데이션 · 이모지 · 둥근 알약은 쓰지 않아요 (문쌤: "AI스러운 디자인 싫음") */
:root{--ink:#1A1A1A;--sub:#6E6E73;--line:#E5E5E8;--line2:#C9C9CF;--bg:#F7F7F8;--acc:#0057B8;--acc-s:#EAF2FC;--acc-l:#C9DCF3;--done:#0E8A5F;--warn:#B54708;--w:1180px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;color:var(--ink);font:400 15px/1.6 Pretendard,-apple-system,"Malgun Gothic",sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
.wrap{width:var(--w);max-width:calc(100% - 40px);margin:0 auto}
.top{border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:20}
.top .wrap{height:64px;display:flex;align-items:center;gap:30px}
.logo{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:800;letter-spacing:-.035em;white-space:nowrap}
.logo i{width:28px;height:28px;border:2px solid var(--ink);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;letter-spacing:0}
.gnb{display:flex;gap:24px;font-size:15px;font-weight:500;color:#444}
.gnb a{padding:20px 0;border-bottom:2px solid transparent;white-space:nowrap}
.gnb a.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.me{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:14px;color:#444;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 16px;border:1px solid var(--ink);background:var(--ink);color:#fff;font-size:14px;font-weight:600;white-space:nowrap}
.btn:hover{background:#333}
.btn.w{background:#fff;color:var(--ink);border-color:var(--line2)}.btn.w:hover{border-color:var(--ink)}
.btn.b{background:var(--acc);border-color:var(--acc)}
.btn.lg{height:48px;padding:0 26px;font-size:15px}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{color:var(--acc);text-decoration:underline;text-underline-offset:3px;background:none;border:0;padding:0;font-size:inherit}
/* 첫 화면 */
.hero{display:grid;grid-template-columns:1fr 400px;gap:48px;align-items:start;padding:44px 0 40px;border-bottom:1px solid var(--line)}
.hero .k{font-size:13.5px;font-weight:600;color:var(--acc)}
.hero h1{font-size:34px;line-height:1.32;letter-spacing:-.045em;margin:8px 0 12px}
.hero p{color:#444;font-size:16px}
.syl{margin-top:18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;font-size:14.5px}
.syl b{display:block;font-size:12.5px;color:var(--sub);font-weight:600;margin-bottom:2px}
.flow{display:grid;grid-template-columns:repeat(4,1fr);margin-top:20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.flow a{padding:14px 12px 14px 16px;border-left:1px solid var(--line);font-size:13px;color:var(--sub);display:block}
.flow a:first-child{border-left:0;padding-left:0}
.flow a:hover b{text-decoration:underline}
.flow b{display:block;color:var(--ink);font-size:15px;margin-top:2px;line-height:1.4}
.box{border:1px solid var(--line);padding:22px 22px 20px;background:#fff}
.box h3{font-size:17px;margin-bottom:6px}
.box p{font-size:13.5px;color:var(--sub);margin-bottom:14px}
.fld{margin-bottom:14px}
.fld label,.lab{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.fld label small,.lab small{font-weight:400;color:var(--sub);margin-left:6px}
textarea,input[type=text],input[type=url],input[inputmode],select{width:100%;border:1px solid var(--line2);background:#fff;padding:10px 12px;font-size:14.5px;border-radius:0;outline:none}
textarea{min-height:84px;resize:vertical;line-height:1.65}
textarea:focus,input:focus,select:focus{border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
/* 단원 화면 */
.crumb{margin:20px auto 0;font-size:13px;color:var(--sub)}
.crumb i{font-style:normal;margin:0 6px;color:#BBB}
.uhead{display:grid;grid-template-columns:1fr 340px;gap:40px;padding:14px 0 26px;border-bottom:1px solid var(--line)}
.uhead .cat{font-size:13.5px;font-weight:600;color:var(--acc)}
.uhead h1{font-size:28px;line-height:1.36;letter-spacing:-.04em;margin:6px 0 8px}
.uhead .lead{color:#444;font-size:15.5px}
.goals{margin-top:14px;padding-left:18px;font-size:14px;color:#333}
.goals li{margin:2px 0}
.prog{display:flex;align-items:center;gap:14px;margin-top:10px}
.bar{flex:1;height:8px;background:#EDEDF0}.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.prog small{font-size:13.5px;color:var(--sub);white-space:nowrap}.prog small b{color:var(--ink)}
.side{border:1px solid var(--line);padding:18px 20px;font-size:14px;align-self:start}
.side h4{font-size:13px;color:var(--sub);font-weight:600;margin-bottom:8px}
.side ol{list-style:none}.side li{margin:3px 0}
.side li.d{color:var(--done)}
.cur{border:1px solid var(--line);margin:24px 0 70px}
.row{display:grid;grid-template-columns:64px 1fr 74px 92px;align-items:center;padding:15px 20px;border-top:1px solid var(--line);font-size:15px;width:100%;background:#fff;border-left:0;border-right:0;border-bottom:0;text-align:left}
.cur>.row:first-child{border-top:0}
.row:hover{background:#FAFAFB}
.row .n{font-size:13px;color:var(--sub);font-weight:600}
.row small{display:block;font-size:13px;color:var(--sub)}
.row .t{font-size:13.5px;color:var(--sub);text-align:right;padding-right:16px}
.row.open{background:var(--acc-s)}
.st{font-size:12px;font-weight:600;padding:3px 8px;border:1px solid;white-space:nowrap;justify-self:end}
.st.d{color:var(--done);border-color:#B7E0D1;background:#F1FAF6}
.st.o{color:var(--acc);border-color:var(--acc-l);background:var(--acc-s)}
.st.w{color:#999;border-color:var(--line)}
.panel{padding:22px 26px 26px;border-top:1px solid var(--acc-l);background:#fff}
.ask{padding:13px 16px;background:var(--bg);border-left:3px solid var(--ink);font-size:15px;line-height:1.7;margin-bottom:16px}
.ask small{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:2px}
.note{font-size:13.5px;color:var(--sub);margin:-6px 0 14px}
.pv{white-space:pre-wrap;background:#FBFBFC;border:1px solid var(--line);padding:14px 16px;font:13.5px/1.7 ui-monospace,Consolas,"Malgun Gothic",monospace;margin:6px 0 10px;max-height:340px;overflow:auto}
.picks{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pk{min-height:36px;padding:6px 14px;border:1px solid var(--line2);background:#fff;font-size:14px;text-align:left}
.pk:hover{border-color:var(--ink)}
.pk.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.msg{margin-top:12px;padding:11px 14px;font-size:14px;border:1px solid}
.msg.ok{color:#0B5E41;border-color:#B7E0D1;background:#F1FAF6}
.msg.no{color:#7A2E0E;border-color:#F4C7A9;background:#FEF6EE}
.msg.info{color:#1F3B63;border-color:var(--acc-l);background:var(--acc-s)}
table.tb{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 12px}
.tb th{border-top:2px solid var(--ink);background:var(--bg);padding:9px 8px;font-weight:600;border-bottom:1px solid var(--line);font-size:13.5px;text-align:left}
.tb td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px;cursor:pointer}
.chk input{margin-top:5px;width:16px;height:16px;accent-color:var(--ink)}
.order{display:grid;gap:6px;margin-bottom:10px}
.order button{display:flex;gap:10px;align-items:center;min-height:42px;padding:6px 12px;border:1px solid var(--line2);background:#fff;text-align:left;font-size:14.5px}
.order button b{width:24px;height:24px;display:grid;place-items:center;border:1px solid var(--line2);font-size:12px;flex:none}
.order button.on{border-color:var(--ink)}.order button.on b{background:var(--ink);color:#fff;border-color:var(--ink)}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.apps a{border:1px solid var(--line);padding:12px 14px;font-size:14px;display:block}
.apps a:hover{border-color:var(--ink)}
.apps a b{display:block;font-size:14.5px}.apps a small{color:var(--sub);font-size:12.5px}
.seg{display:grid;grid-template-columns:repeat(3,auto);gap:4px;justify-content:start}
.seg button{height:30px;padding:0 10px;border:1px solid var(--line2);background:#fff;font-size:13px}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.f12{border:1px dashed var(--line2);padding:16px;margin:8px 0 12px;background:#FBFBFC}
.f12 .fake{display:flex;gap:8px;margin-top:8px}
/* 갤러리 */
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 0 70px}
.gcard{border:1px solid var(--line);padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.gcard h3{font-size:16px;letter-spacing:-.03em}
.gcard .mvp{font-size:14px;color:#333;border-left:3px solid var(--acc);padding-left:10px}
.gcard .notes{font-size:13px;color:var(--sub);border-top:1px solid var(--line);padding-top:8px}
.gcard .notes p{margin:4px 0}
/* 관리자 */
.adm{margin:24px 0 70px}
.adm table{width:100%;border-collapse:collapse;font-size:13.5px}
.adm th,.adm td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:center}
.adm th{background:var(--bg);border-top:2px solid var(--ink);font-weight:600}
.adm td:first-child,.adm th:first-child{text-align:left}
.adm .dot{display:inline-block;width:10px;height:10px;border:1px solid var(--line2)}
.adm .dot.d{background:var(--done);border-color:var(--done)}
.adm tr.sel td{background:var(--acc-s)}
.recv{border:1px solid var(--line);padding:16px 18px;margin-top:16px;font-size:14px}
.recv h4{margin:12px 0 4px;font-size:14px}
.recv pre{white-space:pre-wrap;font:13px/1.6 Pretendard,sans-serif;color:#333;background:var(--bg);padding:8px 10px}
.foot{border-top:1px solid var(--line);padding:22px 0 40px;font-size:12.5px;color:var(--sub)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.admin-btn{position:fixed;right:10px;bottom:10px;font-size:11px;color:#BBB;opacity:.5}
.admin-btn:hover{opacity:1;color:var(--sub)}
@media (max-width:900px){
  .top .wrap{gap:14px}.gnb{display:none}
  .hero,.uhead{grid-template-columns:1fr;gap:20px}
  .flow{grid-template-columns:1fr 1fr}.flow a:nth-child(3){border-left:0;padding-left:0}.flow a:nth-child(n+3){border-top:1px solid var(--line)}
  .row{grid-template-columns:48px 1fr 84px;padding:13px 14px}.row .t{display:none}
  .panel{padding:18px 14px 20px}
  .two,.three,.apps,.gal{grid-template-columns:1fr}
  .hero h1{font-size:27px}
}
</style>
</head>

function judge(j) {
  if (JUDGE.some(([k]) => j[k] === undefined)) return null;
  if (!j.reg) return ["ok", "정규 교육과정 밖(방과후 · 자율동아리 등)이라 심의 대상에서 제외될 수 있어요. 학교 담당자와 한 번 확인하세요."];
  if (j.pi) return ["no", "심의 필수예요. 학생 정보를 저장하거나 로그인을 요구해요. 수업 전에 학교운영위원회 심의를 받고, 필수기준 5개 기준 9개 항목을 모두 충족해야 해요."];
  if (j.cont) return ["no", "심의 대상일 수 있어요. 성취기준 관련 콘텐츠를 보급하는 경우예요. 학교 담당자와 확인하세요."];
  if (!j.stu) return ["ok", "교사 혼자 쓰는 수업 준비 · 행정 도구라 제외될 수 있어요. 학생이 접속하거나 학생별 기록을 저장하게 되면 다시 판단해요."];
  return ["info", "로그인 없이 교사가 만든 콘텐츠만 보여 주는 앱이라 제외될 수 있어요. 기능이 바뀌면 다시 판단하세요."];
}
/* 같은 순서로 섞기 (다시 그려도 순서가 바뀌지 않게) */
function shuffle(a, seed) { const b = [...a]; let s = seed; for (let i = b.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const k = Math.floor(s / 233280 * (i + 1)); [b[i], b[k]] = [b[k], b[i]]; } return b; }
