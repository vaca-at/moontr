<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>책상 친구 소식 확인</title>
<style>body { font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif; padding: 24px; color: #333; }</style>
</head>
<body>
<p id="msg">맥 앱 '책상 친구'가 새 문의를 확인하는 페이지예요. 브라우저에서 열 일은 없어요.</p>
<script type="module">
// 책상 친구(맥 앱)가 화면 없이 몰래 열어 두는 페이지예요.
// moontr.site 관리자 로그인(관리자 허브와 같은 로그인)이 있으면, 2분마다 새 문의 숫자를 세어 맥 앱에 건네요.
//  - 메타버스 문의: moontr-help 문의 서버의 /admin/threads (관리자 허브 · /help/ 문의함과 같은 곳)
//  - 아이아이노트 의견 · 문의: iinotePulse 함수 (관리자 허브와 같은 곳)
// 문의 내용 전체는 건네지 않고, 앱 이름 · 닉네임 · 마지막 한 줄만 건네요.
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const app = initializeApp({ apiKey: "AIzaSyA3CxawUPIfGeBWyffsNbCSM3ymjKHLH6o", authDomain: "moon-d528d.firebaseapp.com", projectId: "moon-d528d", storageBucket: "moon-d528d.firebasestorage.app", messagingSenderId: "126636401536", appId: "1:126636401536:web:25b8a8296ec42b86f99765" });
const auth = getAuth(app);
const ADMIN_EMAILS = ['anstjsdud@sen.go.kr', 'bellachord@gmail.com'];
const isAdminEmail = (e) => ADMIN_EMAILS.includes(String(e || '').toLowerCase());
const HELP = 'https://moontr-help.bellachord.workers.dev', II = 'https://asia-northeast3-iinote.cloudfunctions.net/iinotePulse';
const send = (o) => { try { webkit.messageHandlers.hgd.postMessage({ t: 'pulse', ...o }); } catch { document.getElementById('msg').textContent = JSON.stringify(o); } };
const short = (s) => String(s || '').slice(0, 40);

async function check() {
  const u = auth.currentUser;
  if (!u || !isAdminEmail(u.email)) return send({ login: false });
  const tok = await u.getIdToken(), H = { Authorization: 'Bearer ' + tok };
  const out = { login: true, items: [] };
  try {
    const r = await fetch(HELP + '/admin/threads', { headers: H, cache: 'no-store' });
    if (r.ok) { const j = await r.json(); for (const t of j.threads || []) if (t.unreadOp) out.items.push({ k: `help:${t.app}:${t.uid}:${t.updatedAt}`, app: j.apps?.[t.app] || t.app, who: short(t.name), last: short(t.last), url: 'https://moontr.site/help/' }); }
  } catch {}
  try {
    const r = await fetch(II, { headers: H, cache: 'no-store' });
    if (r.ok) { const j = await r.json(); for (const x of j.unread || []) out.items.push({ k: `ii:${x.at}:${x.n}`, app: '아이아이노트', who: '', last: short(x.last), n: x.n, url: 'https://iinote.co.kr/admin.html' }); }
  } catch {}
  send(out);
}
onAuthStateChanged(auth, (u) => {
  // 관리자가 아닌 계정이면 바로 로그아웃 (moontr.site 로그인이 남으면 다른 관리자 화면이 막혀요)
  if (u && !isAdminEmail(u.email)) { signOut(auth).catch(() => {}); return send({ login: false }); }
  check();
});
setInterval(check, 2 * 60 * 1000);
window.checkNow = check;   // 한교동을 짧게 누르면 바로 한 번 더 확인

// ───────── 📝 교무실 타이쿤 연결: 오늘 할 일 · D-day · 학교 일정 ─────────
// 교무실 타이쿤과 같은 로그인('tycoon' 이름 붙은 앱)을 써요. 타이쿤에 로그인해 두면 여기서도 같은 책상을 읽고 써요.
//  - 읽기: desk_users/{책상}/days/{오늘} 의 할 일, desk_users/{책상}/data/main 의 D-day · 학교 일정 (바뀌면 바로)
//  - 쓰기: 맥 앱의 사유리가 할 일을 더하고 · 끝내고 · 지우면 tyWrite() 로 같은 곳에 저장
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const tyApp = initializeApp({ apiKey: "AIzaSyA3CxawUPIfGeBWyffsNbCSM3ymjKHLH6o", authDomain: "moon-d528d.firebaseapp.com", projectId: "moon-d528d", storageBucket: "moon-d528d.firebasestorage.app", messagingSenderId: "126636401536", appId: "1:126636401536:web:25b8a8296ec42b86f99765" }, "tycoon");
const tyAuth = getAuth(tyApp), tyDb = getFirestore(tyApp);
const pad = (n) => String(n).padStart(2, '0'), dkey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const daysTo = (k) => Math.round((new Date(k + 'T00:00') - new Date(dkey(new Date()) + 'T00:00')) / 864e5);
let desk = null, today = dkey(new Date()), ty = { todos: [], memo: '' }, main = null, unsubs = [];
const sendTy = (o) => { try { webkit.messageHandlers.hgd.postMessage({ t: 'tycoon', ...o }); } catch {} };
function pushTy() {
  const dd = main?.dday?.d && main?.dday?.t ? { t: main.dday.t, n: daysTo(main.dday.d) } : null;
  const ev = (main?.events || []).map((e) => ({ t: e.t, n: daysTo(e.d) })).filter((e) => e.n >= 0).sort((a, b) => a.n - b.n).slice(0, 5);
  sendTy({ login: true, day: today, todos: ty.todos.map((x) => ({ t: x.t, d: !!x.d })), dday: dd, events: ev, bell: bellToday(), out: main?.outT || '16:10' });   // out = 퇴근 시각 (비워 두면 타이쿤처럼 16:10)
}
// 🔔 오늘 종 시간표: [{ p:'1', s:'08:20', e:'09:10', r:'2-3' }] (수업은 1 · 2 · 3 … 번호, 조회 · 점심 · 종례는 이름 그대로)
// 내 수업 칸(r)은 '하루만 바꾸기'(dayTT)가 있으면 그것, 없으면 요일 시간표(week)예요. 주말이면 빈 목록
function bellToday() {
  const wd = new Date(today + 'T00:00').getDay(); if (!main || wd === 0 || wd === 6) return [];
  const mm = (t) => { const [h, m] = String(t).split(':').map(Number); return h * 60 + m; };
  const week = (main.dayTT || {})[today] || (main.week || {})[wd] || {};
  let n = 0;
  return (main.bell || []).filter((b) => b && b.s && b.e && mm(b.e) > mm(b.s)).sort((a, b) => mm(a.s) - mm(b.s))
    .map((b) => { const p = b.k === '수업' ? String(++n) : b.k; return { p, s: b.s, e: b.e, r: String(week[p] || '').slice(0, 12) }; });
}
function watch() {
  unsubs.forEach((u) => u()); unsubs = [];
  today = dkey(new Date());
  unsubs.push(onSnapshot(doc(tyDb, 'desk_users', desk, 'days', today), (s) => { ty = s.exists() ? { todos: s.data().todos || [], memo: s.data().memo || '' } : { todos: [], memo: '' }; pushTy(); }, () => {}));
  unsubs.push(onSnapshot(doc(tyDb, 'desk_users', desk, 'data', 'main'), (s) => { main = s.exists() ? s.data() : null; pushTy(); }, () => {}));
}
onAuthStateChanged(tyAuth, async (u) => {
  if (!u) { desk = null; unsubs.forEach((f) => f()); unsubs = []; return sendTy({ login: false }); }
  let id = u.uid;
  try { const l = await getDoc(doc(tyDb, 'desk_links', u.uid)); if (l.exists() && l.data().desk) id = l.data().desk; } catch {}
  desk = id; watch();
});
setInterval(() => { if (desk && dkey(new Date()) !== today) watch(); }, 60 * 1000);   // 자정이 지나면 새 날 할 일로
// 사유리가 바꾼 할 일 저장: { op: 'add' | 'done' | 'undo' | 'del', t, i }
window.tyWrite = async (w) => {
  if (!desk) return;
  const ref = doc(tyDb, 'desk_users', desk, 'days', today), cur = await getDoc(ref), d = cur.exists() ? cur.data() : { todos: [], memo: '' };
  const todos = (d.todos || []).slice();
  const i = Number.isInteger(w.i) && todos[w.i] && todos[w.i].t === w.t ? w.i : todos.findIndex((x) => x.t === w.t);
  if (w.op === 'add' && w.t) todos.push({ t: String(w.t).slice(0, 80), d: false });
  if (w.op === 'done' && i >= 0) todos[i] = { ...todos[i], d: true };
  if (w.op === 'undo' && i >= 0) todos[i] = { ...todos[i], d: false };
  if (w.op === 'del' && i >= 0) todos.splice(i, 1);
  await setDoc(ref, { todos: todos.slice(0, 50), memo: d.memo || '', at: Date.now() });
};

// ───────── 📈 방문 수 튐 알림 ─────────
// 모든 웹앱이 visit.js 로 남기는 숫자(site_counts)를 10분마다 봐요. 숫자만 있고 누가 왔는지는 없어요 (누구나 읽을 수 있는 숫자)
//  - 앱마다 '이번 한 시간'(이름__h날짜 문서의 h00~h23 칸)이 15회 이상이면서 평소 한 시간의 3배 이상 → spike
//    평소 한 시간 = 지난 7일 방문 합 ÷ 7 ÷ 12 (사람들이 주로 오는 낮 12시간으로 나눠요)
//  - 오늘 방문이 벌써 어제 하루 전체(10회 이상)를 넘으면 → beat (하루 한 번)
//  - 밤 11시 ~ 아침 7시는 확인하지 않아요
//  - 메타버스 4곳(스냅주 · 큰법당 · 캠핑장 · 소호랩)은 각자 서버의 공개 숫자로 같은 방법으로 봐요
// 맥 앱에 건네는 것: { t:'visits', alerts:[{ k, kind, app, n, x, url }], total, yest, top:{ app, n } }
import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const vDb = getFirestore(app);
const HUB_URL = 'https://moontr.site/admin/';
// 🏯 메타버스 4곳은 자기 서버(Cloudflare)에서 따로 세요: /public/visits 의 days{날짜:수} · hours{날짜:[0시~23시]} (숫자만, 로그인 없이)
const RELAYS = [
  { a: 'snapzoo', name: '스냅주', url: 'https://snapzoo-rooms.bellachord.workers.dev' },
  { a: 'templestay', name: '큰법당', url: 'https://templestay-rooms.bellachord.workers.dev' },
  { a: 'campingjang', name: '캠핑장', url: 'https://campingjang-rooms.bellachord.workers.dev' },
  { a: 'soholab', name: '소호랩', url: 'https://soho-lab-rooms.bellachord.workers.dev' },
];
let V = null;
const vSend = (o) => { try { webkit.messageHandlers.hgd.postMessage({ t: 'visits', ...o }); } catch { document.getElementById('msg').textContent = JSON.stringify(o); } };
// 앱 이름(한국어)은 관리자 허브 페이지에서 읽어요: 관리자 화면 이름 · SITE_NAMES
async function vNames() {
  const N = {};
  try {
    const h = await (await fetch('/admin/index.html', { cache: 'no-store' })).text();
    const byPath = {};
    for (const m of h.matchAll(/name:'([^']+)',\s*admin:'([^']+)'/g)) byPath[m[2]] = m[1];
    for (const m of h.matchAll(/'([^']+)':\s*\{[^}\n]*?(?:site|seed):'([\w-]+)'/g)) if (byPath[m[1]]) N[m[2]] = byPath[m[1]];
    const b = h.match(/const SITE_NAMES = \{([\s\S]*?)\};/);
    if (b) for (const m of b[1].matchAll(/'?([\w-]+)'?\s*:\s*'([^']*)'/g)) if (!N[m[1]]) N[m[1]] = m[2];
  } catch {}
  return N;
}
// 하루에 한 번: 앱 목록 · 지난 7일 합 · 어제 하루 · 어제 시각별
async function vSetup() {
  const t = dkey(new Date()), y = dkey(new Date(Date.now() - 864e5)), week = new Set([...Array(7)].map((_, i) => dkey(new Date(Date.now() - (i + 1) * 864e5))));
  const v = { day: t, names: await vNames(), apps: new Set(), base: {}, yest: {}, yh: {}, told: new Set() };
  const snap = await getDocs(collection(vDb, 'site_counts'));
  snap.forEach((d) => {
    const m = d.id.match(/^(.+)__(d|h)(\d{4}-\d{2}-\d{2})$/); if (!m) return;
    const [, a, kind, day] = m, x = d.data();
    if (kind === 'd' && week.has(day)) { v.base[a] = (v.base[a] || 0) + (x.n || 0); v.apps.add(a); }
    if (kind === 'd' && day === y) v.yest[a] = x.n || 0;
    if (kind === 'h' && day === y) v.yh[a] = x;
    if (kind === 'h' && day === t) v.apps.add(a);
  });
  V = v;
}
async function vCheck() {
  const d = new Date(), H = d.getHours();
  if (H < 7 || H >= 23) return;
  try {
    if (!V || V.day !== dkey(d)) await vSetup();
    const hk = 'h' + String(H).padStart(2, '0'), alerts = [];
    let total = 0, yest = 0, top = null, yAny = Object.keys(V.yh).length > 0;
    // 튀었는지 보기: 이번 한 시간 15회↑ + 평소 한 시간(7일 합 ÷ 7 ÷ 12)의 3배↑ / 오늘이 어제 하루(10회↑)를 넘음
    const judge = (a, name, cur, today, base7, yd, on = 0) => {
      const avg = base7 / 7 / 12;
      if (cur >= 15 && cur >= 3 * Math.max(1, avg)) alerts.push({ k: `spike:${a}:${V.day}:${hk}`, kind: 'spike', id: a, on, app: name, n: cur, x: Math.round(cur / Math.max(1, avg)), url: HUB_URL });
      if (yd >= 10 && today > yd) alerts.push({ k: `beat:${a}:${V.day}`, kind: 'beat', id: a, on, app: name, n: today, x: yd, url: HUB_URL });
    };
    await Promise.all([...V.apps].map(async (a) => {
      let x = {}; try { const s = await getDoc(doc(vDb, 'site_counts', `${a}__h${V.day}`)); x = s.exists() ? s.data() : {}; } catch { return; }
      const today = Object.values(x).reduce((s, n) => s + (n || 0), 0), cur = x[hk] || 0, name = V.names[a] || a;
      total += today;
      const yx = V.yh[a] || {}; yest += Object.keys(yx).filter((k) => k <= hk).reduce((s, k) => s + (yx[k] || 0), 0);   // 어제 이 시각까지
      if (!top || today > top.n) top = { app: name, n: today };
      judge(a, name, cur, today, V.base[a] || 0, V.yest[a] || 0);
    }));
    // 🏯 메타버스 4곳
    const ys = dkey(new Date(Date.now() - 864e5)), wk = [...Array(7)].map((_, i) => dkey(new Date(Date.now() - (i + 1) * 864e5)));
    await Promise.all(RELAYS.map(async (R) => {
      let p; try { const r = await fetch(R.url + '/public/visits', { cache: 'no-store' }); if (!r.ok) return; p = await r.json(); } catch { return; }
      const D = p.days || {}, HH = p.hours || {}, today = D[V.day] || 0, cur = (HH[V.day] || [])[H] || 0;
      total += today;
      if (HH[ys]) { yest += HH[ys].slice(0, H + 1).reduce((s, n) => s + (n || 0), 0); }   // 웹앱 시간대 기록(어제)이 있을 때만 견줘요
      if (!top || today > top.n) top = { app: R.name, n: today };
      judge(R.a, R.name, cur, today, wk.reduce((s, k) => s + (D[k] || 0), 0), D[ys] || 0, p.online || 0);
    }));
    vSend({ alerts, total, yest: yAny ? yest : null, top: top && top.n ? top : null });
  } catch (e) { vSend({ error: String(e.message || e) }); }
}
vCheck();
setInterval(vCheck, 10 * 60 * 1000);
window.vCheck = vCheck;
</script>
</body>
</html>
