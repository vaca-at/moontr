<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도덕적 고려의 원</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#F2F9F3; --ink:#2F4A37; --main:#4FAE6E; --line:#D5EBDA; --r1:#BFE8C9; --r2:#FFF0B8; --r3:#F4F4F4; }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  /* 예쁜 스크롤 막대 */
  ::-webkit-scrollbar{width:12px;height:12px}
  ::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
  ::-webkit-scrollbar-button{display:none;width:0;height:0}
  ::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--main) 45%,#fff);border:3px solid transparent;border-radius:99px;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background-color:color-mix(in srgb,var(--main) 75%,#fff)}
  @supports not selector(::-webkit-scrollbar){ *{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--main) 45%,#fff) transparent} }
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Gowun Dodum',sans-serif;display:flex;justify-content:center;padding:24px 16px 60px}
  .wrap{width:100%;max-width:900px}
  .std{display:inline-block;background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px 14px;font-size:14px}
  h1{font-size:clamp(26px,4.5vw,40px);margin:10px 0 2px}
  .sub{margin:0 0 16px;opacity:.7}
  .game{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:center}
  /* 🎯 과녁 */
  .target{position:relative;width:min(100%,380px);aspect-ratio:1;margin:0 auto}
  .ring{position:absolute;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;justify-content:center}
  /* 원 이름은 과녁 아래 범례로 */
  .legend{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px;font-size:13px}
  .legend span{border-radius:999px;padding:2px 10px;border:1px solid #DDD}
  .ring.r3{width:100%;height:100%;background:var(--r3);border:2px dashed #DDD}
  .ring.r2{width:67%;height:67%;background:var(--r2)}
  .ring.r1{width:34%;height:34%;background:var(--r1)}
  .dot{position:absolute;transform:translate(-50%,-50%);font-size:clamp(22px,4vw,30px);line-height:1;animation:pop .35s ease-out;cursor:default;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))}
  @keyframes pop{from{transform:translate(-50%,-50%) scale(.2)}to{transform:translate(-50%,-50%) scale(1)}}
  /* 카드 */
  .card{background:#fff;border:2px solid var(--line);border-radius:24px;padding:22px;text-align:center}
  .num{color:var(--main);font-size:15px}
  .who{font-size:64px;line-height:1.1;margin:8px 0 4px}
  .name{font-size:clamp(22px,3.4vw,28px);margin:0 0 16px}
  .q{margin:0 0 10px;opacity:.75}
  .picks{display:grid;gap:8px}
  .pick{font:inherit;font-size:18px;border:2px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;color:var(--ink);transition:.15s}
  .pick:hover{transform:translateY(-1px);border-color:var(--main)}
  .pick.p1{background:var(--r1)} .pick.p2{background:var(--r2)} .pick.p3{background:#fff}
  /* 엔딩 */
  .end{grid-column:1 / -1;background:#fff;border:2px solid var(--line);border-radius:24px;padding:22px}
  .end-h{text-align:center}
  .end-h .big{font-size:56px;line-height:1.1}
  .end-h h2{margin:6px 0 4px;font-size:clamp(22px,3.6vw,30px)}
  .end-h p{margin:0 auto;max-width:600px;line-height:1.6}
  .tags{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:16px 0}
  .tag{border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.5;opacity:.6}
  .tag.on{opacity:1;border-color:var(--main);background:color-mix(in srgb,var(--main) 8%,#fff)}
  .tag b{font-size:16px}
  .reflect{margin-top:8px;background:#F8FCF9;border:2px dashed var(--line);border-radius:18px;padding:16px}
  .reflect h3{margin:0 0 8px;font-size:18px;line-height:1.5}
  textarea{width:100%;font:inherit;font-size:17px;border:2px solid var(--line);border-radius:14px;padding:10px 14px;min-height:110px;resize:vertical;color:var(--ink)}
  textarea:focus{outline:none;border-color:var(--main)}
  .btn{display:block;margin:14px auto 0;font:inherit;font-size:19px;border:0;border-radius:999px;background:var(--main);color:#fff;padding:11px 36px;cursor:pointer}
  .btn.line{background:#fff;color:var(--main);border:2px solid var(--main)}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .err{color:#D9534F;text-align:center;min-height:20px;margin:6px 0 0;font-size:15px}
  .thanks{text-align:center;padding:20px 6px}
  .thanks b{display:block;font-size:60px}
  @media (max-width:700px){ .game{grid-template-columns:1fr} .tags{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">
  <span class="std" id="std"></span>
  <h1 id="title">🎯 도덕적 고려의 원</h1>
  <p class="sub">카드를 하나씩 보고, 내가 생각하는 원에 넣어 보세요. 정답은 없어요.</p>
  <div class="game" id="game">
    <div><div class="target" id="target">
      <div class="ring r3"></div>
      <div class="ring r2"></div>
      <div class="ring r1"></div>
    </div>
    <div class="legend" id="legend"></div></div>
    <div class="card" id="card"></div>
  </div>
</div>

<script>
  /* ===== ✏️ 카드와 원 이름은 circle 에서 바꿔요 =====
     items: [이모지, 이름, 종류]  종류 H 사람 · A 고통을 느끼는 동물 · L 그 밖의 생명 · E 생태계 */
  const DATA = /*DATA*/{"code":"9도04-01","t":"생명 존중","text":"인간 이외의 생명체를 도덕적으로 고려해야 하는 이유를 정당화하고, 생명을 가진 존재들이 겪는 고통에 공감하며 생명을 소중히 여기는 태도를 기른다.","circle":{"rings":["💚 꼭 지켜야 해요","💛 지키면 좋아요","🤍 꼭 지킬 필요는 없어요"],"items":[["🧑","나와 우리 가족","H"],["🧒","지구 반대편의 아이","H"],["🐶","반려견","A"],["🐄","농장의 소","A"],["🦟","모기","L"],["🌳","마을 은행나무","L"],["🏞️","마을 앞 강","E"],["🌲","숲 생태계 전체","E"]],"tags":{"H":["인간 중심주의","🧑","인간만이 이성을 가진 존재로서 도덕적으로 고려할 대상이라고 봤어요. 자연은 인간을 위해 잘 쓰고 관리하는 대상이에요."],"A":["동물 중심주의","🐾","고통을 느낄 수 있는 동물까지 도덕적으로 고려해야 한다고 봤어요. (예: 싱어, 레건)"],"L":["생명 중심주의","🌱","살아 있는 모든 생명은 그 자체로 소중하다고 봤어요. (예: 슈바이처의 생명 외경, 테일러)"],"E":["생태 중심주의","🌏","강과 숲처럼 생명이 없는 것까지 포함한 생태계 전체를 도덕적으로 고려해야 한다고 봤어요. (예: 레오폴드의 대지 윤리)"]},"reflect":"원 바깥쪽에 둔 존재 하나를 골라 그 존재의 입장에서 한 줄 써 보세요. 내 원을 넓힌다면 어디까지 넓히고 싶나요?","starter":"내가 ○○라면"}}/*END*/;

  const $ = id => document.getElementById(id);
  const safe = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const C = DATA.circle, ORDER = ["H", "A", "L", "E"];
  document.title = "도덕적 고려의 원 · " + DATA.t;
  $("std").textContent = `🎯 [${DATA.code}] ${DATA.t}`;
  $("std").title = DATA.text;
  $("title").textContent = `🎯 '${DATA.t}' 도덕적 고려의 원`;
  $("legend").innerHTML = C.rings.map((r, i) => `<span style="background:var(--r${i + 1})">${safe(r)}</span>`).join("");

  let i = 0, place = [];   // place[카드 번호] = 원 번호(0 = 가장 안쪽)

  // 과녁 위에 이모지 놓기: 원마다 둥글게 돌려 놓아요
  function drawTarget() {
    document.querySelectorAll(".dot").forEach(d => d.remove());
    const R = [[0, 0.09], [1, 0.25], [2, 0.42]];   // [원 번호, 반지름(과녁 크기 비율)]
    R.forEach(([ring, rad]) => {
      const list = place.map((p, k) => p === ring ? k : -1).filter(k => k >= 0);
      list.forEach((k, n) => {
        const ang = (n / Math.max(list.length, 1)) * Math.PI * 2 - Math.PI / 2 + ring * 0.6;
        const r = list.length === 1 && ring === 0 ? 0 : rad;
        const d = document.createElement("span");
        d.className = "dot"; d.textContent = C.items[k][0]; d.title = C.items[k][1];
        d.style.left = (50 + Math.cos(ang) * r * 100) + "%";
        d.style.top = (50 + Math.sin(ang) * r * 100) + "%";
        $("target").appendChild(d);
      });
    });
  }

  function show() {
    const [e, name] = C.items[i];
    $("card").innerHTML = `<div class="num">카드 ${i + 1} / ${C.items.length}</div>
      <div class="who">${e}</div><p class="name">${safe(name)}</p>
      <p class="q">이 존재는 어느 원에 넣을까요?</p>
      <div class="picks">${C.rings.map((r, n) => `<button class="pick p${n + 1}" data-r="${n}">${safe(r)}</button>`).join("")}</div>`;
    $("card").querySelectorAll(".pick").forEach(b => b.onclick = () => {
      place[i] = +b.dataset.r; drawTarget();
      i++; i < C.items.length ? show() : ending();
    });
  }

  // 가장 안쪽 원(💚)에 어디까지 넣었나요? → 사람 < 동물 < 생명 < 생태계
  function ending() {
    const inner = C.items.filter((_, k) => place[k] === 0).map(x => x[2]);
    const top = [...ORDER].reverse().find(t => inner.includes(t)) || "H";
    const T = C.tags[top];
    const card = document.createElement("div");
    card.className = "end";
    card.innerHTML = `<div class="end-h"><div class="big">${T[1]}</div>
        <h2>내 원은 '${safe(T[0])}'와 닮았어요</h2><p>${safe(T[2])}</p></div>
      <div class="tags">${ORDER.map(t => `<div class="tag ${t === top ? "on" : ""}"><b>${C.tags[t][1]} ${safe(C.tags[t][0])}</b><br>${safe(C.tags[t][2])}</div>`).join("")}</div>
      <div class="reflect">
        <h3>💭 ${safe(C.reflect)}</h3>
        <textarea id="ref" maxlength="300">${safe(C.starter ? C.starter + " " : "")}</textarea>
        <p class="err" id="refErr"></p>
        <div class="row"><button class="btn line" id="again">🔄 다시 놓기</button><button class="btn" id="send">제출하기</button></div>
      </div>`;
    $("card").replaceWith(card); card.id = "card";
    card.scrollIntoView({ behavior: "smooth" });
    $("again").onclick = restart;
    $("send").onclick = () => {
      const r = $("ref").value.trim();
      if (r.length < (C.starter || "").length + 10) return $("refErr").textContent = "두세 줄로 내 생각을 조금 더 써 주세요.";
      // 이 기기에 남겨요 (🔐 관리자 대시보드에서 봐요)
      try {
        const names = n => C.items.filter((_, k) => place[k] === n).map(x => x[1]);
        const list = JSON.parse(localStorage.getItem(ADMIN.key) || "[]");
        list.push({ r1: names(0), r2: names(1), r3: names(2), who: T[0], reflect: r, at: Date.now() });
        localStorage.setItem(ADMIN.key, JSON.stringify(list));
      } catch (e) {}
      card.innerHTML = `<div class="thanks"><b>🙌</b><h2>제출했어요! 고마워요</h2><p>친구의 원과 내 원을 비교해 보세요. 어디가 달랐나요?</p>
        <button class="btn" id="again2">🔄 다시 놓기</button></div>`;
      $("again2").onclick = restart;
    };
  }
  function restart() {
    i = 0; place = []; drawTarget();
    const c = document.createElement("div"); c.className = "card"; $("card").replaceWith(c); c.id = "card";
    show();
  }

  // 🔐 관리자 대시보드에 보일 기록
  const ADMIN = { key: "circle.results." + DATA.code, title: "도덕적 고려의 원",
    cols: [["r1", C.rings[0]], ["r2", C.rings[1]], ["r3", C.rings[2]], ["who", "닮은 입장"], ["reflect", "성찰"], ["at", "제출 시각"]] };
  show();
</script>
<!-- ===== 🔐 관리자 대시보드 (처음 비밀번호 1234 · 대시보드에서 바꿀 수 있어요) =====
     지금은 이 기기에 저장된 기록만 보여요. 4단계에서 파이어스토어를 연결하면 모든 학생 기록이 모여요. -->
<style>
  .adm-btn{position:fixed;top:12px;right:12px;z-index:50;font:inherit;font-size:14px;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .adm-btn:hover{border-color:var(--main)}
  .adm{position:fixed;inset:0;z-index:60;background:rgba(40,30,30,.35);display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;overflow:auto}
  .adm[hidden]{display:none}
  .adm-in{background:#fff;color:var(--ink);border-radius:22px;width:100%;max-width:900px;padding:20px 22px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
  .adm-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .adm-h h2{margin:0;font-size:22px;flex:1}
  .adm-b{white-space:nowrap;font:inherit;font-size:14px;color:var(--ink);border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;cursor:pointer}
  .adm-b.main{background:var(--main);border-color:var(--main);color:#fff}
  .adm-b.warn:hover{border-color:#D9534F;color:#D9534F}
  .adm-in input{font:inherit;font-size:16px;border:2px solid var(--line);border-radius:12px;padding:8px 12px;width:auto;flex:1 1 150px;min-width:0}
  .adm-in input:focus{outline:none;border-color:var(--main)}
  .adm-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
  .adm-err{color:#D9534F;font-size:14px;min-height:20px;margin:6px 0 0}
  .adm-ok{color:#3FAE6F}
  .adm-stat{display:inline-block;background:color-mix(in srgb,var(--main) 12%,#fff);border-radius:14px;padding:6px 14px;margin-right:6px}
  .adm-stat b{font-size:20px}
  .adm-wrap{overflow-x:auto;border:2px solid var(--line);border-radius:14px;margin:12px 0}
  .adm-in table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
  .adm-in th,.adm-in td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top;word-break:keep-all;overflow-wrap:anywhere}
  .adm-in th{background:color-mix(in srgb,var(--main) 8%,#fff);white-space:nowrap}
  .adm-in tr:last-child td{border-bottom:0}
  .adm-del{white-space:nowrap;font:inherit;font-size:12px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:1px 8px;cursor:pointer}
  .adm-pw{background:color-mix(in srgb,var(--main) 6%,#fff);border-radius:14px;padding:10px 14px;margin-top:14px}
  .adm-pw h3{margin:0 0 4px;font-size:16px}
  @media print{.adm-btn,.adm{display:none !important}}
</style>
<button class="adm-btn" id="admBtn" type="button">🔐 관리자</button>
<div class="adm" id="adm" hidden><div class="adm-in" id="admIn" role="dialog" aria-label="관리자 대시보드"></div></div>
<script>
(() => {
  // ADMIN = { key: 기록이 저장된 이름, title: 제목, cols: [[칸 이름, 보이는 이름], …], onChange: 기록을 지운 뒤 할 일 }
  const PW_KEY = "admin.pw." + DATA.code, DEFAULT_PW = "1234";
  const $a = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const getPw = () => { try { return localStorage.getItem(PW_KEY) || DEFAULT_PW; } catch (e) { return DEFAULT_PW; } };
  const rows = () => { try { return JSON.parse(localStorage.getItem(ADMIN.key) || "[]"); } catch (e) { return []; } };
  const save = list => { try { localStorage.setItem(ADMIN.key, JSON.stringify(list)); } catch (e) {} ADMIN.onChange && ADMIN.onChange(); };
  const cell = (r, k) => k === "at" ? (r.at ? new Date(r.at).toLocaleString("ko-KR") : "") : Array.isArray(r[k]) ? r[k].join(", ") : (r[k] ?? "");
  let open = false;

  function show(html) { $a("admIn").innerHTML = html; $a("adm").hidden = false; open = true; }
  function close() { $a("adm").hidden = true; open = false; }
  const head = t => `<div class="adm-h"><h2>${t}</h2><button class="adm-b" id="admX" type="button">✕ 닫기</button></div>`;

  function login() {
    show(head("🔐 관리자 로그인") + `
      <p style="margin:0 0 6px">관리자 비밀번호를 넣어 주세요.</p>
      <div class="adm-row"><input type="password" id="admPw" placeholder="비밀번호" autocomplete="off"><button class="adm-b main" id="admGo" type="button">들어가기</button></div>
      <p class="adm-err" id="admErr"></p>`);
    $a("admPw").focus();
    const go = () => $a("admPw").value === getPw() ? dash() : ($a("admErr").textContent = "비밀번호가 맞지 않아요.");
    $a("admGo").onclick = go;
    $a("admPw").onkeydown = e => { if (e.key === "Enter") go(); };
  }

  function dash() {
    const list = rows(), view = list.map((r, i) => ({ r, i })).reverse();
    show(head("📊 관리자 대시보드 · " + esc(ADMIN.title)) + `
      <div><span class="adm-stat">기록 <b>${list.length}</b>개</span><span style="font-size:13px;opacity:.65">지금은 이 기기에 저장된 기록만 보여요</span></div>
      ${list.length ? `<div class="adm-wrap"><table><thead><tr><th>#</th>${ADMIN.cols.map(c => `<th>${esc(c[1])}</th>`).join("")}<th></th></tr></thead><tbody>
        ${view.map((v, n) => `<tr><td>${list.length - n}</td>${ADMIN.cols.map(c => `<td>${esc(cell(v.r, c[0]))}</td>`).join("")}<td><button class="adm-del" data-i="${v.i}" type="button">지우기</button></td></tr>`).join("")}
      </tbody></table></div>` : `<p style="opacity:.6;margin:14px 0">아직 기록이 없어요.</p>`}
      <div class="adm-row">
        <button class="adm-b main" id="admCsv" type="button" ${list.length ? "" : "disabled"}>⬇️ 엑셀(CSV)로 받기</button>
        <button class="adm-b warn" id="admClear" type="button" ${list.length ? "" : "disabled"}>🗑 모두 지우기</button>
        <button class="adm-b" id="admLock" type="button">🔒 잠그기</button>
      </div>
      <div class="adm-pw"><h3>🔑 비밀번호 바꾸기</h3>
        <div class="adm-row"><input type="password" id="admOld" placeholder="지금 비밀번호" autocomplete="off"><input type="password" id="admNew" placeholder="새 비밀번호 (4자 이상)" autocomplete="off"><input type="password" id="admNew2" placeholder="새 비밀번호 한 번 더" autocomplete="off"><button class="adm-b main" id="admChange" type="button">바꾸기</button></div>
        <p class="adm-err" id="admPwMsg"></p></div>`);
    $a("admLock").onclick = close;
    $a("admIn").querySelectorAll(".adm-del").forEach(b => b.onclick = () => {
      if (!confirm("이 기록을 지울까요?")) return;
      const l = rows(); l.splice(+b.dataset.i, 1); save(l); dash();
    });
    $a("admClear").onclick = () => { if (confirm("기록을 모두 지울까요? 되돌릴 수 없어요.")) { save([]); dash(); } };
    $a("admCsv").onclick = () => {
      const q = v => `"${String(v).replace(/"/g, '""')}"`;
      const csv = [ADMIN.cols.map(c => q(c[1])).join(",")].concat(rows().map(r => ADMIN.cols.map(c => q(cell(r, c[0]))).join(","))).join("\r\n");
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
      a.download = `${ADMIN.title}_${DATA.code}.csv`; document.body.appendChild(a); a.click(); a.remove();
    };
    $a("admChange").onclick = () => {
      const m = $a("admPwMsg"), o = $a("admOld").value, n = $a("admNew").value, n2 = $a("admNew2").value;
      m.className = "adm-err";
      if (o !== getPw()) return m.textContent = "지금 비밀번호가 맞지 않아요.";
      if (n.length < 4) return m.textContent = "새 비밀번호는 4자 이상으로 해 주세요.";
      if (n !== n2) return m.textContent = "새 비밀번호 두 칸이 서로 달라요.";
      try { localStorage.setItem(PW_KEY, n); } catch (e) {}
      m.className = "adm-err adm-ok"; m.textContent = "✓ 비밀번호를 바꿨어요. 다음부터 새 비밀번호로 들어와요.";
      ["admOld", "admNew", "admNew2"].forEach(k => $a(k).value = "");
    };
  }

  $a("admBtn").onclick = login;
  $a("adm").onclick = e => { if (e.target.id === "adm" || e.target.id === "admX") close(); };
  document.addEventListener("keydown", e => { if (open && e.key === "Escape") close(); });
})();
</script>
</body>
</html>
