<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 발표자 뽑기</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  /* 색은 여기서 바꿔요 */
  :root{ --bg:#FFF5F8; --ink:#4A3B42; --main:#F291B2; --soft:#FFE3EC; --line:#F5D3DF; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Gowun Dodum',sans-serif;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
  h1{margin:8px 0 4px;font-size:clamp(28px,5vw,48px)}
  .sub{margin:0 0 20px;opacity:.7}
  .set{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;background:#fff;border:2px solid var(--line);border-radius:20px;padding:12px 18px;font-size:18px}
  .set input{width:80px;font:inherit;padding:6px 10px;border:2px solid var(--line);border-radius:12px;text-align:center}
  .set input.wide{width:200px;text-align:left}
  .ball{margin:28px 0 20px;width:min(70vw,360px);aspect-ratio:1;border-radius:50%;background:#fff;border:10px solid var(--main);display:grid;place-items:center;font-size:clamp(90px,22vw,200px);font-weight:700;box-shadow:0 16px 40px rgba(242,145,178,.35);transition:transform .15s}
  .ball.rolling{transform:scale(.95)}
  .ball.done{animation:pop .5s}
  @keyframes pop{50%{transform:scale(1.08)}}
  .ball small{font-size:.25em;display:block;text-align:center;margin-top:-.4em;opacity:.6}
  .btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  button{font:inherit;font-size:22px;border:0;border-radius:999px;padding:14px 34px;cursor:pointer}
  .go{background:var(--main);color:#fff;box-shadow:0 6px 16px rgba(242,145,178,.4)}
  .go:disabled{opacity:.5;cursor:default}
  .reset{background:#fff;border:2px solid var(--line)}
  .msg{min-height:28px;margin:14px 0 6px;font-size:18px}
  .history{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:720px}
  .history span{background:var(--soft);border-radius:999px;padding:4px 14px;font-size:20px}
  .left{opacity:.7;font-size:15px;margin-top:10px}
</style>
</head>
<body>
  <h1>🎲 오늘의 발표자</h1>
  <p class="sub">누가 뽑힐까요?</p>

  <div class="set">
    <label>번호 <input id="from" type="number" value="1" min="1"></label> ~
    <label><input id="to" type="number" value="28" min="1"> 번</label>
    <label>결석 <input id="absent" class="wide" placeholder="예: 3, 15"></label>
  </div>

  <div class="ball" id="ball">?</div>

  <div class="btns">
    <button class="go" id="go">뽑기!</button>
    <button class="reset" id="reset">처음부터</button>
  </div>
  <p class="msg" id="msg"></p>
  <div class="history" id="history"></div>
  <p class="left" id="left"></p>

<script>
  // 뽑힌 번호는 이 기기에 기억해요 (새로고침해도 이어서)
  let picked = JSON.parse(localStorage.getItem("picker.picked") || "[]");
  const $ = id => document.getElementById(id);

  // 아직 안 뽑힌 번호 목록
  function pool() {
    const a = +$("from").value, b = +$("to").value;
    const absent = $("absent").value.split(/[,\s]+/).map(Number).filter(Boolean);
    const list = [];
    for (let n = Math.min(a, b); n <= Math.max(a, b); n++) {
      if (!picked.includes(n) && !absent.includes(n)) list.push(n);
    }
    return list;
  }
  function show() {
    $("history").innerHTML = picked.map((n, i) => `<span>${i + 1}. ${n}번</span>`).join("");
    const left = pool().length;
    $("left").textContent = `남은 번호 ${left}개`;
    $("go").disabled = left === 0;
    if (left === 0 && picked.length) $("msg").textContent = "모두 뽑았어요! [처음부터]를 눌러요.";
  }

  $("go").onclick = () => {
    const list = pool();
    if (!list.length) return;
    $("go").disabled = true;
    $("msg").textContent = "두구두구두구…";
    const ball = $("ball");
    ball.classList.remove("done");
    ball.classList.add("rolling");
    let count = 0;
    // 숫자가 빠르게 바뀌다가 점점 느려지며 멈춰요
    function spin() {
      ball.textContent = list[Math.floor(Math.random() * list.length)];
      count++;
      if (count < 22) setTimeout(spin, 40 + count * count * 0.6);
      else {
        const n = list[Math.floor(Math.random() * list.length)];
        ball.innerHTML = `${n}<small>번</small>`;
        ball.classList.remove("rolling");
        ball.classList.add("done");
        picked.push(n);
        localStorage.setItem("picker.picked", JSON.stringify(picked));
        $("msg").textContent = `🎉 ${n}번 친구, 발표해 주세요!`;
        show();
      }
    }
    spin();
  };

  $("reset").onclick = () => {
    if (picked.length && !confirm("뽑은 기록을 모두 지울까요?")) return;
    picked = [];
    localStorage.removeItem("picker.picked");
    $("ball").textContent = "?";
    $("msg").textContent = "";
    show();
  };
  ["from", "to", "absent"].forEach(id => $(id).addEventListener("input", show));
  show();
</script>
</body>
</html>
