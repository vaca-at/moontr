<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영상 보고 생각 쓰기</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#FFF6F1; --ink:#4E3B33; --main:#EE8F6A; --line:#F5DCCF; }
  *{box-sizing:border-box}
  /* 예쁜 스크롤 막대 */
  ::-webkit-scrollbar{width:12px;height:12px}
  ::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
  ::-webkit-scrollbar-button{display:none;width:0;height:0}
  ::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--main) 45%,#fff);border:3px solid transparent;border-radius:99px;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background-color:color-mix(in srgb,var(--main) 75%,#fff)}
  @supports not selector(::-webkit-scrollbar){ *{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--main) 45%,#fff) transparent} }
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Gowun Dodum',sans-serif;display:flex;justify-content:center;padding:24px 16px 60px}
  .wrap{width:100%;max-width:760px}
  .std{display:inline-block;background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px 14px;font-size:14px}
  h1{font-size:clamp(26px,4.5vw,38px);margin:10px 0 14px}
  .video{background:#fff;border:2px solid var(--line);border-radius:22px;padding:14px;margin-bottom:18px}
  .video iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:14px;display:block}
  .find{text-align:center;padding:20px 10px}
  .find p{margin:0;font-size:18px}
  /* 유튜브 마크 + 영상 보기 칩 */
  .yt-chip{display:inline-flex;align-items:center;gap:8px;margin-top:12px;background:#fff;color:var(--ink);text-decoration:none;border:2px solid var(--line);border-radius:999px;padding:6px 16px 6px 12px;font-size:16px;transition:.15s}
  .yt-chip:hover{border-color:#FF0000;box-shadow:0 4px 12px rgba(255,0,0,.12)}
  .yt-chip svg{width:26px;height:18px;flex:none}
  .find small{display:block;margin-top:10px;opacity:.6}
  .find code{background:#FFF1EA;border-radius:6px;padding:1px 6px}
  .card{background:#fff;border:2px solid var(--line);border-radius:22px;padding:20px}
  label{display:block;font-size:20px;margin:14px 0 4px}
  label:first-child{margin-top:0}
  .hint{font-size:14px;opacity:.65;margin:0 0 6px}
  textarea{width:100%;font:inherit;font-size:17px;border:2px solid var(--line);border-radius:14px;padding:10px 12px;min-height:84px;resize:vertical}
  textarea:focus{outline:none;border-color:var(--main)}
  .send{display:block;width:100%;margin-top:18px;font:inherit;font-size:21px;border:0;border-radius:999px;background:var(--main);color:#fff;padding:13px;cursor:pointer}
  .err{color:#D9534F;text-align:center;min-height:22px;margin:8px 0 0}
  h2{font-size:22px;margin:28px 0 10px}
  .mine{background:#fff;border-left:6px solid var(--main);border-radius:14px;padding:12px 16px;margin:10px 0;line-height:1.6}
  .mine small{opacity:.55}
  .mine button{font:inherit;font-size:14px;border:2px solid var(--line);background:#fff;border-radius:999px;padding:2px 12px;cursor:pointer;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <span class="std" id="std"></span>
  <h1 id="title">🎬 영상 보고 생각 쓰기</h1>

  <div class="video" id="video"></div>

  <div class="card">
    <label for="learn">💡 알게 된 점</label>
    <p class="hint">영상에서 새로 알게 된 사실이나 생각을 써요.</p>
    <textarea id="learn" maxlength="300"></textarea>
    <label for="feel">💗 느낀 점</label>
    <p class="hint">영상 속 장면 하나를 떠올리며, 그때 든 마음을 써요.</p>
    <textarea id="feel" maxlength="300"></textarea>
    <label for="ask">❓ 더 궁금한 점</label>
    <p class="hint">친구들과 이야기 나누고 싶은 질문을 하나 써요. (없으면 비워도 돼요)</p>
    <textarea id="ask" maxlength="200"></textarea>
    <button class="send" id="send">제출하기</button>
    <p class="err" id="err"></p>
  </div>

  <h2>📒 내가 쓴 생각</h2>
  <div id="list"></div>
</div>

<script>
  /* ===== ✏️ 영상 주소는 VIDEO_URL에 넣어요 (유튜브 주소 그대로) ===== */
  const VIDEO_URL = "";
  // ✏️ 영상을 몇 분 몇 초부터 보여 줄지 (예: "3:20"). 처음부터면 "0:00"
  const VIDEO_START = "3:20";
  const DATA = /*DATA*/{"code":"9도01-03","t":"행복한 삶","text":"행복에 관한 심리적, 사회적, 윤리적 접근 등을 통해 행복의 의미를 종합적으로 파악하고, 삶의 목적과 행복의 관계를 정립할 수 있다.","video":"행복이란 무엇인가 청소년"}/*END*/;

  const $ = id => document.getElementById(id);
  const KEY = "video." + DATA.code;
  const safe = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  document.title = "영상 보고 생각 쓰기 · " + DATA.t;
  $("std").textContent = `🎬 [${DATA.code}] ${DATA.t}`;
  $("std").title = DATA.text;
  $("title").textContent = `🎬 '${DATA.t}' 영상 보고 생각 쓰기`;

  // 유튜브 주소에서 영상 번호만 뽑아요
  function ytId(u) {
    const m = String(u).match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);
    return m ? m[1] : "";
  }
  // "3:20" → 200초 (주소에 t=200 이 붙어 있으면 그것도 알아들어요)
  function startSec() {
    const t = String(VIDEO_URL).match(/[?&](?:t|start)=(\d+)/);
    if (t) return +t[1];
    return String(VIDEO_START).split(":").reduce((s, n) => s * 60 + (+n || 0), 0);
  }
  const id = ytId(VIDEO_URL), start = startSec();
  $("video").innerHTML = id
    ? `<iframe src="https://www.youtube.com/embed/${id}?start=${start}" title="수업 영상" allowfullscreen></iframe>
       ${start ? `<p style="margin:8px 4px 0;font-size:14px;opacity:.65">▶ ${Math.floor(start / 60)}분 ${start % 60}초부터 시작해요</p>` : ""}`
    : `<div class="find"><p>index.html 파일에 유튜브 링크를 입력해주세요</p>
        <a class="yt-chip" href="https://www.youtube.com/results?search_query=${encodeURIComponent(DATA.video)}" target="_blank" rel="noopener">
          <svg viewBox="0 0 28 20" aria-hidden="true"><rect width="28" height="20" rx="5" fill="#FF0000"/><path d="M11 5.5v9l8-4.5z" fill="#fff"/></svg>영상 보기</a>
        <small>코드 맨 위 <code>VIDEO_URL</code>에 링크, <code>VIDEO_START</code>에 시작 시간을 넣어요</small></div>`;

  const load = () => JSON.parse(localStorage.getItem(KEY) || "[]");
  function render() {
    const list = load();
    $("list").innerHTML = list.length ? list.slice().reverse().map((x, i) => `
      <div class="mine"><small>${new Date(x.at).toLocaleString("ko-KR")}</small><br>
        💡 ${safe(x.learn)}<br>💗 ${safe(x.feel)}${x.ask ? `<br>❓ ${safe(x.ask)}` : ""}<br>
        <button data-copy="${list.length - 1 - i}">📋 복사</button></div>`).join("")
      : `<p style="opacity:.6">아직 쓴 생각이 없어요.</p>`;
  }
  $("send").onclick = () => {
    const learn = $("learn").value.trim(), feel = $("feel").value.trim();
    if (!learn || !feel) return $("err").textContent = "알게 된 점과 느낀 점을 모두 써 주세요.";
    $("err").textContent = "";
    const list = load();
    list.push({ learn, feel, ask: $("ask").value.trim(), at: Date.now() });
    localStorage.setItem(KEY, JSON.stringify(list));
    ["learn", "feel", "ask"].forEach(k => $(k).value = "");
    render();
    $("list").scrollIntoView({ behavior: "smooth" });
  };
  $("list").onclick = async e => {
    const b = e.target.closest("[data-copy]"); if (!b) return;
    const x = load()[b.dataset.copy];
    try { await navigator.clipboard.writeText(`[${DATA.code}] ${DATA.t}\n알게 된 점: ${x.learn}\n느낀 점: ${x.feel}\n궁금한 점: ${x.ask || "-"}`); b.textContent = "✓ 복사됨"; }
    catch (err) { alert("복사하지 못했어요."); }
  };
  render();
</script>
</body>
</html>
