<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영상 보고 생각 쓰기</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#FFF6F1; --ink:#4E3B33; --main:#EE8F6A; --line:#F5DCCF; }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  /* 예쁜 스크롤 막대 */
  ::-webkit-scrollbar{width:12px;height:12px}
  ::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
  ::-webkit-scrollbar-button{display:none;width:0;height:0}
  ::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--main) 45%,#fff);border:3px solid transparent;border-radius:99px;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background-color:color-mix(in srgb,var(--main) 75%,#fff)}
  @supports not selector(::-webkit-scrollbar){ *{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--main) 45%,#fff) transparent} }
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Gowun Dodum',sans-serif;display:flex;justify-content:center;padding:24px 16px 60px}
  .wrap{width:100%;max-width:760px}
  .std{display:inline-block;background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px 14px;font-size:14px}
  h1{font-size:clamp(26px,4.5vw,38px);margin:10px 0 14px}
  .box{background:#fff;border:2px solid var(--line);border-radius:22px;padding:18px 20px;margin-bottom:18px}

  /* 선생님 설정: ① 영상 제목 ② 영상 링크 ③ 시작 시간 */
  .setup h2{margin:0 0 4px;font-size:21px}
  .setup .sub{margin:0 0 14px;font-size:15px;opacity:.7}
  .step{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;margin-bottom:10px}
  .step .n{width:34px;height:34px;border-radius:50%;background:var(--main);color:#fff;display:grid;place-items:center;font-size:17px;margin-top:22px}
  .step label{display:block;font-size:16px;margin:0 0 4px}
  .step input{width:100%;font:inherit;font-size:16px;border:2px solid var(--line);border-radius:12px;padding:10px 12px}
  .step input:focus{outline:none;border-color:var(--main)}
  .find{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:13px;opacity:.85}
  .yt-chip{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--ink);text-decoration:none;border:2px solid var(--line);border-radius:999px;padding:3px 12px 3px 8px;font-size:14px;transition:.15s}
  .yt-chip:hover{border-color:#FF0000}
  .yt-chip svg{width:22px;height:15px;flex:none}
  .put{display:block;width:100%;margin-top:6px;font:inherit;font-size:19px;border:0;border-radius:999px;background:var(--main);color:#fff;padding:12px;cursor:pointer}
  .err{color:#D9534F;text-align:center;min-height:22px;margin:8px 0 0;font-size:15px}

  /* 영상 */
  .vtitle{margin:0 0 10px;font-size:22px}
  .video iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:14px;display:block}
  .vbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:14px}
  .vbar .when{opacity:.65;margin-right:auto}
  .mini{font:inherit;font-size:14px;border:2px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;cursor:pointer}
  .mini.main{background:var(--main);border-color:var(--main);color:#fff}

  /* 학생 쓰기 */
  .write label{display:block;font-size:20px;margin:14px 0 4px}
  .write label:first-child{margin-top:0}
  .hint{font-size:14px;opacity:.65;margin:0 0 6px}
  textarea{width:100%;font:inherit;font-size:17px;border:2px solid var(--line);border-radius:14px;padding:10px 12px;min-height:84px;resize:vertical}
  textarea:focus{outline:none;border-color:var(--main)}
  .send{display:block;width:100%;margin-top:18px;font:inherit;font-size:21px;border:0;border-radius:999px;background:var(--main);color:#fff;padding:13px;cursor:pointer}
  .thanks{text-align:center;padding:26px 10px}
  .thanks b{display:block;font-size:64px;line-height:1.2}
  .thanks h2{margin:6px 0}
  .thanks p{margin:0 0 14px;opacity:.75}
</style>
</head>
<body>
<div class="wrap">
  <span class="std" id="std"></span>
  <h1 id="title">🎬 영상 보고 생각 쓰기</h1>

  <!-- 선생님 설정 (학생용 주소로 들어오면 안 보여요) -->
  <div class="box setup" id="setup" hidden>
    <h2>🎬 선생님, 오늘 볼 영상을 넣어 주세요</h2>
    <p class="sub">코드를 고치지 않아도 돼요. 세 칸을 채우고 '영상 넣기'를 누르면 바로 영상이 나와요.</p>
    <div class="step"><span class="n">1</span><div>
      <label for="vTitle">영상 제목</label>
      <input id="vTitle" maxlength="60" placeholder="예: 행복이란 무엇일까?"></div></div>
    <div class="step"><span class="n">2</span><div>
      <label for="vUrl">영상 링크</label>
      <input id="vUrl" placeholder="유튜브 주소 붙여 넣기 (예: https://youtu.be/…)">
      <div class="find"><a class="yt-chip" id="ytFind" target="_blank" rel="noopener"><svg viewBox="0 0 28 20" aria-hidden="true"><rect width="28" height="20" rx="5" fill="#FF0000"/><path d="M11 5.5v9l8-4.5z" fill="#fff"/></svg>영상 보기</a>유튜브에서 영상을 고르고 주소를 복사해 와요</div></div></div>
    <div class="step"><span class="n">3</span><div>
      <label for="vStart">시작 시간</label>
      <input id="vStart" placeholder="예: 3:20 (비우면 처음부터)"></div></div>
    <button class="put" id="put">영상 넣기</button>
    <p class="err" id="vErr"></p>
  </div>

  <!-- 영상 -->
  <div class="box video" id="video" hidden>
    <h2 class="vtitle" id="vShowTitle"></h2>
    <div id="player"></div>
    <div class="vbar">
      <span class="when" id="when"></span>
      <button class="mini main" id="share">🔗 학생용 주소 복사</button>
      <button class="mini" id="change">🔄 영상 바꾸기</button>
    </div>
  </div>

  <!-- 학생 쓰기 → 제출하기 -->
  <div class="box write" id="write">
    <label for="learn">💡 알게 된 점</label>
    <p class="hint">영상에서 새로 알게 된 사실이나 생각을 써요.</p>
    <textarea id="learn" maxlength="300"></textarea>
    <label for="feel">💗 느낀 점</label>
    <p class="hint">영상 속 장면 하나를 떠올리며, 그때 든 마음을 써요.</p>
    <textarea id="feel" maxlength="300"></textarea>
    <label for="ask">❓ 더 궁금한 점</label>
    <p class="hint">친구들과 이야기 나누고 싶은 질문을 하나 써요. (없으면 비워도 돼요)</p>
    <textarea id="ask" maxlength="200"></textarea>
    <button class="send" id="send">제출하기</button>
    <p class="err" id="err"></p>
  </div>
</div>

<script>
  /* ===== 영상은 화면에서 넣어요 (코드를 고치지 않아도 돼요) =====
     늘 같은 영상을 쓰고 싶으면 아래 세 줄에 적어 둬도 돼요. */
  const VIDEO_TITLE = "";   // 예: "행복이란 무엇일까?"
  const VIDEO_URL = "";     // 예: "https://youtu.be/xxxxxxxxxxx"
  const VIDEO_START = "";   // 예: "3:20" (비우면 처음부터)
  const DATA = /*DATA*/{"code":"9도01-03","t":"행복한 삶","text":"행복에 관한 심리적, 사회적, 윤리적 접근 등을 통해 행복의 의미를 종합적으로 파악하고, 삶의 목적과 행복의 관계를 정립할 수 있다.","video":"행복이란 무엇인가 청소년"}/*END*/;

  const $ = id => document.getElementById(id);
  document.title = "영상 보고 생각 쓰기 · " + DATA.t;
  $("std").textContent = `🎬 [${DATA.code}] ${DATA.t}`;
  $("std").title = DATA.text;
  $("title").textContent = `🎬 '${DATA.t}' 영상 보고 생각 쓰기`;
  $("ytFind").href = "https://www.youtube.com/results?search_query=" + encodeURIComponent(DATA.video);

  // 유튜브 주소에서 영상 번호(11글자)만 뽑아요
  function ytId(u) {
    const m = String(u).match(/(?:youtu\.be\/|v=|shorts\/|embed\/|live\/)([\w-]{11})/);
    return m ? m[1] : "";
  }
  // "3:20", "1:02:30", "200", "3m20s" → 초
  function toSec(s) {
    s = String(s || "").trim(); if (!s) return 0;
    if (/[hms]/.test(s)) { const m = s.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s?)?$/); if (m) return (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0); }
    return s.split(":").reduce((a, n) => a * 60 + (+n || 0), 0);
  }
  const urlStart = u => { const m = String(u).match(/[?&](?:t|start)=([\dhms]+)/); return m ? toSec(m[1]) : 0; };
  const mmss = n => `${Math.floor(n / 60)}:${String(n % 60).padStart(2, "0")}`;

  /* 영상은 어디서 가져오나요? (앞에 있는 것이 먼저)
     ① 학생용 주소: 주소 뒤 ?v=영상번호&t=초&title=제목  → 학생은 설정 칸이 안 보여요
     ② 위의 VIDEO_URL
     ③ 선생님이 이 화면에서 넣은 영상 (이 기기에 기억) */
  const VKEY = "video.src." + DATA.code;
  const qs = new URLSearchParams(location.search);
  const student = /^[\w-]{11}$/.test(qs.get("v") || "");
  function source() {
    if (student) return { title: (qs.get("title") || "").slice(0, 60), id: qs.get("v"), start: Math.max(0, parseInt(qs.get("t")) || 0) };
    if (ytId(VIDEO_URL)) return { title: VIDEO_TITLE, id: ytId(VIDEO_URL), start: toSec(VIDEO_START) || urlStart(VIDEO_URL) };
    try { return JSON.parse(localStorage.getItem(VKEY) || "null"); } catch (e) { return null; }
  }

  let cur = null;
  function showVideo(src) {
    cur = src;
    $("setup").hidden = true; $("video").hidden = false;
    $("vShowTitle").textContent = src.title ? "📺 " + src.title : "";
    $("vShowTitle").hidden = !src.title;
    $("player").innerHTML = `<iframe src="https://www.youtube.com/embed/${src.id}?start=${src.start}&rel=0" title="${(src.title || "수업 영상").replace(/"/g, "&quot;")}" allowfullscreen></iframe>`;
    $("when").textContent = src.start ? `▶ ${mmss(src.start)}부터 시작해요` : "▶ 처음부터 재생해요";
    $("share").hidden = $("change").hidden = student;
    $("share").textContent = "🔗 학생용 주소 복사";
  }
  function showSetup(prev) {
    $("video").hidden = true; $("setup").hidden = false;
    $("vTitle").value = prev ? prev.title || "" : "";
    $("vUrl").value = prev ? "https://youtu.be/" + prev.id : "";
    $("vStart").value = prev && prev.start ? mmss(prev.start) : "";
    $("vErr").textContent = "";
  }

  $("put").onclick = () => {
    const u = $("vUrl").value.trim(), id = ytId(u);
    if (!id) return $("vErr").textContent = "영상 링크를 확인해 주세요. (youtube.com 또는 youtu.be 주소)";
    const src = { title: $("vTitle").value.trim(), id, start: toSec($("vStart").value) || urlStart(u) };
    try { localStorage.setItem(VKEY, JSON.stringify(src)); } catch (e) {}
    showVideo(src);
  };
  ["vTitle", "vUrl", "vStart"].forEach(k => $(k).onkeydown = e => { if (e.key === "Enter") $("put").click(); });
  $("change").onclick = () => showSetup(cur);
  $("share").onclick = async () => {
    if (!/^https?:$/.test(location.protocol)) return alert("학생용 주소는 웹앱을 배포한 뒤(3단계) 그 주소에서 만들 수 있어요.\n지금처럼 내 컴퓨터 파일로 열었을 때는 영상만 미리 볼 수 있어요.");
    const p = new URLSearchParams({ v: cur.id });
    if (cur.start) p.set("t", cur.start);
    if (cur.title) p.set("title", cur.title);
    const u = location.origin + location.pathname + "?" + p.toString();
    try { await navigator.clipboard.writeText(u); $("share").textContent = "✓ 복사됨! 학생들에게 보내요"; }
    catch (e) { prompt("이 주소를 복사해 학생들에게 보내요", u); }
  };

  const first = source();
  first ? showVideo(first) : showSetup(null);

  /* ===== 학생: 쓰고 → 제출하기 ===== */
  const KEY = "video.notes." + DATA.code;
  $("send").onclick = () => {
    const learn = $("learn").value.trim(), feel = $("feel").value.trim(), ask = $("ask").value.trim();
    if (!learn || !feel) return $("err").textContent = "알게 된 점과 느낀 점을 모두 써 주세요.";
    // 지금은 이 기기에만 남아요. (4단계에서 파이어스토어를 연결하면 선생님이 한곳에서 모아 봐요)
    try {
      const list = JSON.parse(localStorage.getItem(KEY) || "[]");
      list.push({ video: cur ? cur.title || cur.id : "", learn, feel, ask, at: Date.now() });
      localStorage.setItem(KEY, JSON.stringify(list));
    } catch (e) {}
    $("write").innerHTML = `<div class="thanks"><b>🙌</b><h2>제출했어요! 고마워요</h2><p>오늘 영상에서 얻은 생각을 친구들과 나눠 봐요.</p>
      <button class="mini" onclick="location.reload()">✏️ 다시 쓰기</button></div>`;
  };
</script>
</body>
</html>
