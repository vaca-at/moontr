<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>산출물 만들기</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#FFF5F8; --ink:#4A3B42; --main:#F291B2; --line:#F5D3DF; }
  *{box-sizing:border-box}
  /* 예쁜 스크롤 막대 */
  ::-webkit-scrollbar{width:12px;height:12px}
  ::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
  ::-webkit-scrollbar-button{display:none;width:0;height:0}
  ::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--main) 45%,#fff);border:3px solid transparent;border-radius:99px;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background-color:color-mix(in srgb,var(--main) 75%,#fff)}
  @supports not selector(::-webkit-scrollbar){ *{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--main) 45%,#fff) transparent} }
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Gowun Dodum',sans-serif;padding:22px 16px 60px}
  .wrap{max-width:1100px;margin:0 auto}
  .std{display:inline-block;background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px 14px;font-size:14px}
  h1{font-size:clamp(26px,4.5vw,38px);margin:10px 0 16px}
  .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
  .form{background:#fff;border:2px solid var(--line);border-radius:22px;padding:18px 20px}
  label{display:block;font-size:17px;margin:12px 0 4px}
  label:first-child{margin-top:0}
  input,textarea{width:100%;font:inherit;font-size:16px;border:2px solid var(--line);border-radius:12px;padding:9px 12px}
  input:focus,textarea:focus{outline:none;border-color:var(--main)}
  .themes{display:flex;gap:8px;margin-top:4px}
  .themes button{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer}
  .themes button.on{box-shadow:0 0 0 3px var(--ink)}
  .acts{display:flex;gap:10px;margin-top:16px}
  .acts button{flex:1;font:inherit;font-size:18px;border:0;border-radius:999px;background:var(--main);color:#fff;padding:11px;cursor:pointer}
  .acts button.line{background:#fff;color:var(--main);border:2px solid var(--main)}
  /* 완성 카드 */
  .poster{--a:#F291B2;--b:#FFE3EC;position:sticky;top:16px;background:var(--b);border-radius:26px;padding:28px 26px;min-height:520px;box-shadow:0 14px 34px rgba(0,0,0,.08);overflow-wrap:anywhere}
  .poster .kind{display:inline-block;background:var(--a);color:#fff;border-radius:999px;padding:3px 14px;font-size:14px}
  .poster h2{font-size:clamp(28px,4vw,40px);margin:14px 0 8px;line-height:1.25}
  .poster .msg{font-size:21px;background:#fff;border-radius:16px;padding:12px 16px;margin:12px 0;border-left:8px solid var(--a)}
  .poster ol{padding-left:0;list-style:none;counter-reset:n;margin:14px 0}
  .poster li{counter-increment:n;position:relative;padding:8px 0 8px 44px;font-size:18px}
  .poster li::before{content:counter(n);position:absolute;left:0;top:6px;width:32px;height:32px;border-radius:50%;background:var(--a);color:#fff;display:grid;place-items:center}
  .poster .vow{margin-top:16px;font-size:19px;border-top:2px dashed var(--a);padding-top:14px}
  .poster .by{text-align:right;opacity:.7;margin-top:14px}
  .ph{opacity:.4}
  @media (max-width:760px){ .grid{grid-template-columns:1fr} .poster{position:static} }
  @media print{ body{background:#fff;padding:0} .form,h1,.std{display:none} .grid{display:block} .poster{box-shadow:none;min-height:auto;-webkit-print-color-adjust:exact;print-color-adjust:exact} }
</style>
</head>
<body>
<div class="wrap">
  <span class="std" id="std"></span>
  <h1 id="title">🎨 산출물 만들기</h1>
  <div class="grid">
    <div class="form">
      <label for="f-title">제목</label><input id="f-title" maxlength="40">
      <label for="f-msg">핵심 메시지 한 줄</label><input id="f-msg" maxlength="80">
      <label for="f-r1">이유 · 근거 1</label><input id="f-r1" maxlength="80">
      <label for="f-r2">이유 · 근거 2</label><input id="f-r2" maxlength="80">
      <label for="f-r3">이유 · 근거 3</label><input id="f-r3" maxlength="80">
      <label for="f-vow">나의 실천 다짐</label><textarea id="f-vow" maxlength="120" rows="2"></textarea>
      <label for="f-nick">별명</label><input id="f-nick" maxlength="12" placeholder="이름 대신 별명">
      <label>색 테마</label><div class="themes" id="themes"></div>
      <div class="acts"><button onclick="print()">🖨 인쇄</button><button class="line" id="copy">📋 글 복사</button></div>
    </div>
    <div class="poster" id="poster"></div>
  </div>
</div>

<script>
  /* ===== ✏️ 성취기준과 만들 산출물 이름은 여기서 바꿔요 ===== */
  const DATA = /*DATA*/{"code":"9도01-03","t":"행복한 삶","text":"행복에 관한 심리적, 사회적, 윤리적 접근 등을 통해 행복의 의미를 종합적으로 파악하고, 삶의 목적과 행복의 관계를 정립할 수 있다.","make":"나의 행복 레시피 카드"}/*END*/;
  const THEMES = [["#F291B2", "#FFE3EC"], ["#5FA8D9", "#E3F1FB"], ["#5DB98A", "#E5F6EC"], ["#9A83D6", "#EEE8FA"]];

  const $ = id => document.getElementById(id);
  const safe = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const KEY = "make." + DATA.code;
  document.title = DATA.make + " 만들기";
  $("std").textContent = `🎨 [${DATA.code}] ${DATA.t}`;
  $("std").title = DATA.text;
  $("title").textContent = `🎨 ${DATA.make} 만들기`;

  const F = ["f-title", "f-msg", "f-r1", "f-r2", "f-r3", "f-vow", "f-nick"];
  const saved = JSON.parse(localStorage.getItem(KEY) || "{}");
  let theme = saved.theme || 0;
  F.forEach(k => { if (saved[k]) $(k).value = saved[k]; $(k).addEventListener("input", draw); });

  THEMES.forEach(([a, b], i) => {
    const btn = document.createElement("button");
    btn.style.background = `linear-gradient(135deg, ${a} 50%, ${b} 50%)`; btn.title = "색 " + (i + 1);
    btn.onclick = () => { theme = i; draw(); };
    $("themes").appendChild(btn);
  });

  const v = k => $(k).value.trim();
  const or = (k, ph) => v(k) ? safe(v(k)) : `<span class="ph">${ph}</span>`;
  function draw() {
    const [a, b] = THEMES[theme];
    const p = $("poster");
    p.style.setProperty("--a", a); p.style.setProperty("--b", b);
    document.querySelectorAll("#themes button").forEach((x, i) => x.classList.toggle("on", i === theme));
    p.innerHTML = `<span class="kind">${safe(DATA.make)}</span>
      <h2>${or("f-title", "제목을 써 주세요")}</h2>
      <div class="msg">${or("f-msg", "가장 하고 싶은 말 한 줄")}</div>
      <ol><li>${or("f-r1", "첫 번째 이유")}</li><li>${or("f-r2", "두 번째 이유")}</li><li>${or("f-r3", "세 번째 이유")}</li></ol>
      <div class="vow">✊ ${or("f-vow", "나는 이렇게 실천할게요")}</div>
      <div class="by">[${safe(DATA.code)}] ${safe(DATA.t)} · ${or("f-nick", "별명")}</div>`;
    const o = { theme }; F.forEach(k => o[k] = $(k).value); localStorage.setItem(KEY, JSON.stringify(o));
  }
  $("copy").onclick = async () => {
    const t = `${DATA.make}\n\n${v("f-title")}\n${v("f-msg")}\n1. ${v("f-r1")}\n2. ${v("f-r2")}\n3. ${v("f-r3")}\n다짐: ${v("f-vow")}\n- ${v("f-nick")}`;
    try { await navigator.clipboard.writeText(t); $("copy").textContent = "✓ 복사됨"; } catch (e) { alert("복사하지 못했어요."); }
  };
  draw();
</script>
</body>
</html>
