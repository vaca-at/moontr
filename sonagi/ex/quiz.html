<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>개념 퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#F1FAF5; --ink:#344A3F; --main:#5DB98A; --ok:#3FAE6F; --no:#E46A6A; --line:#D4ECDF; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Gowun Dodum',sans-serif;display:flex;justify-content:center;padding:24px 16px}
  .wrap{width:100%;max-width:720px}
  .std{display:inline-block;background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px 14px;font-size:14px}
  h1{text-align:center;font-size:clamp(26px,4.5vw,40px);margin:10px 0}
  .bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px 0 20px}
  .bar i{display:block;height:100%;background:var(--main);transition:width .3s}
  .card{background:#fff;border:2px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 8px 24px rgba(93,185,138,.15)}
  .num{color:var(--main);font-weight:700}
  .q{font-size:clamp(21px,3.3vw,28px);margin:6px 0 18px;line-height:1.45}
  .opts{display:grid;gap:10px}
  .opt{font:inherit;font-size:20px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 18px;cursor:pointer;transition:.15s}
  .opt:hover:not(:disabled){border-color:var(--main);background:#F6FCF9}
  .opt.right{border-color:var(--ok);background:#E5F6EC}
  .opt.wrong{border-color:var(--no);background:#FDECEC}
  .opt:disabled{cursor:default}
  .fb{margin-top:16px;padding:14px 18px;border-radius:16px;font-size:18px}
  .fb.ok{background:#E5F6EC} .fb.no{background:#FDECEC}
  .next{display:block;margin:18px auto 0;font:inherit;font-size:20px;border:0;border-radius:999px;background:var(--main);color:#fff;padding:12px 40px;cursor:pointer}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:20px}
  .nav .prev,.nav .go{font:inherit;font-size:18px;border-radius:999px;padding:10px 22px;cursor:pointer;white-space:nowrap}
  .nav .prev{background:#fff;border:2px solid var(--line);color:var(--ink)}
  .nav .prev:disabled{opacity:.35;cursor:default}
  .nav .go{border:0;background:var(--main);color:#fff}
  .dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:#fff;font:inherit;font-size:15px;cursor:pointer;padding:0}
  .dot.done{background:#E5F6EC;border-color:var(--main)}
  .dot.now{background:var(--main);border-color:var(--main);color:#fff}
  @media (max-width:520px){ .nav{flex-wrap:wrap} .dots{order:-1;width:100%} .nav .prev,.nav .go{flex:1} }
  .score{text-align:center;font-size:72px;margin:10px 0;color:var(--main)}
  .wrongs div{background:#FDF5F5;border-radius:14px;padding:12px 16px;margin:8px 0}
</style>
</head>
<body>
<div class="wrap">
  <span class="std" id="std"></span>
  <h1 id="title">✅ 개념 퀴즈</h1>
  <div class="bar"><i id="bar"></i></div>
  <div class="card" id="card"></div>
</div>

<script>
  /* ===== ✏️ 문제는 pairs([개념, 뜻])로 저절로 만들어져요 =====
     문제를 직접 더 넣고 싶으면 아래 EXTRA에 { q: "문제", options: ["보기1","보기2","보기3","보기4"], answer: 정답번호(0부터), explain: "해설" } 를 넣어요. */
  const DATA = /*DATA*/{"code":"9도01-03","t":"행복한 삶","text":"행복에 관한 심리적, 사회적, 윤리적 접근 등을 통해 행복의 의미를 종합적으로 파악하고, 삶의 목적과 행복의 관계를 정립할 수 있다.","pairs":[["행복","삶에서 만족과 기쁨을 느끼는 상태"],["쾌락","감각적인 즐거움이나 고통이 없는 상태"],["삶의 목적","삶에서 이루고자 하는 궁극적인 방향"],["덕","옳은 일을 꾸준히 실천하여 몸에 밴 좋은 품성"]]}/*END*/;
  const EXTRA = [];

  const $ = id => document.getElementById(id);
  const safe = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  document.title = "개념 퀴즈 · " + DATA.t;
  $("std").textContent = `✅ [${DATA.code}] ${DATA.t}`;
  $("std").title = DATA.text;
  $("title").textContent = `✅ '${DATA.t}' 개념 퀴즈`;

  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  // 뜻을 보여 주고 알맞은 개념을 고르는 문제
  function makeQuestions() {
    const terms = DATA.pairs.map(p => p[0]);
    return shuffle(DATA.pairs.map(([term, mean]) => {
      const options = shuffle(terms.slice());
      return { q: `"${mean}"<br>이 뜻에 알맞은 개념은?`, options, answer: options.indexOf(term), explain: `<b>${safe(term)}</b>: ${safe(mean)}` };
    })).concat(EXTRA);
  }

  const card = $("card");
  // picks[문제 번호] = 고른 보기 번호 (안 풀었으면 비어 있어요)
  let Q = [], i = 0, picks = [];

  function show() {
    const it = Q[i], k = picks[i], done = k !== undefined;
    const solved = picks.filter(x => x !== undefined).length;
    $("bar").style.width = (solved / Q.length * 100) + "%";
    card.innerHTML = `<div class="num">${i + 1} / ${Q.length}</div><p class="q">${it.q}</p>
      <div class="opts">${it.options.map((o, n) => `<button class="opt ${done && n === it.answer ? "right" : ""} ${done && n === k && k !== it.answer ? "wrong" : ""}" data-k="${n}" ${done ? "disabled" : ""}>${n + 1}. ${safe(o)}</button>`).join("")}</div>
      ${done ? `<div class="fb ${k === it.answer ? "ok" : "no"}"><b>${k === it.answer ? "🎉 맞았어요!" : "🤔 아쉬워요!"}</b><br>${it.explain}</div>` : ""}
      <div class="nav">
        <button class="prev" id="prev" ${i === 0 ? "disabled" : ""}>← 이전 문제</button>
        <span class="dots">${Q.map((_, n) => `<button class="dot ${n === i ? "now" : ""} ${picks[n] !== undefined ? "done" : ""}" data-go="${n}" aria-label="${n + 1}번 문제">${n + 1}</button>`).join("")}</span>
        ${i < Q.length - 1 ? `<button class="go" id="next">다음 문제 →</button>` : `<button class="go" id="next">결과 보기</button>`}
      </div>`;
    card.querySelectorAll(".opt").forEach(b => b.onclick = () => { picks[i] = +b.dataset.k; show(); $("next").focus(); });
    card.querySelectorAll(".dot").forEach(b => b.onclick = () => { i = +b.dataset.go; show(); });
    $("prev").onclick = () => { if (i > 0) { i--; show(); } };
    $("next").onclick = () => {
      if (i < Q.length - 1) { i++; show(); return; }
      const left = Q.length - solved;
      if (left && !confirm(`아직 안 푼 문제가 ${left}개 있어요. 그래도 결과를 볼까요?`)) return;
      finish();
    };
  }
  function finish() {
    $("bar").style.width = "100%";
    const score = Q.filter((it, n) => picks[n] === it.answer).length;
    const wrongs = Q.filter((it, n) => picks[n] !== it.answer);
    const msg = score === Q.length ? "완벽해요! 👏" : score >= Q.length * 0.6 ? "잘했어요! 틀린 것만 다시 봐요." : "다시 한 번 정리해 봐요. 할 수 있어요!";
    card.innerHTML = `<p style="text-align:center;margin:0">나의 점수</p><div class="score">${score} / ${Q.length}</div>
      <p style="text-align:center;font-size:20px">${msg}</p>
      ${wrongs.length ? `<div class="wrongs"><b>📌 틀리거나 안 푼 문제 다시 보기</b>${wrongs.map(w => `<div>${w.explain}</div>`).join("")}</div>` : ""}
      <button class="next" id="again">다시 풀기</button>`;
    $("again").onclick = begin;
  }
  function begin() { Q = makeQuestions(); i = 0; picks = []; show(); }
  // 키보드 ← → 로도 넘겨요
  document.addEventListener("keydown", e => {
    if (!$("prev") || e.target.matches("input,textarea")) return;
    if (e.key === "ArrowLeft") $("prev").click();
    if (e.key === "ArrowRight" && i < Q.length - 1) $("next").click();
  });
  begin();
</script>
</body>
</html>
