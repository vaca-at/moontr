<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 형성평가</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#F1FAF5; --ink:#344A3F; --main:#5DB98A; --ok:#3FAE6F; --no:#E46A6A; --line:#D4ECDF; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Gowun Dodum',sans-serif;display:flex;justify-content:center;padding:24px 16px}
  .wrap{width:100%;max-width:720px}
  h1{text-align:center;font-size:clamp(26px,4.5vw,40px);margin:8px 0}
  .bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px 0 20px}
  .bar i{display:block;height:100%;background:var(--main);transition:width .3s}
  .card{background:#fff;border:2px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 8px 24px rgba(93,185,138,.15)}
  .num{color:var(--main);font-weight:700}
  .q{font-size:clamp(22px,3.5vw,30px);margin:6px 0 18px;line-height:1.45}
  .opts{display:grid;gap:10px}
  .opts.ox{grid-template-columns:1fr 1fr}
  .opt{font:inherit;font-size:20px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 18px;cursor:pointer;transition:.15s}
  .opts.ox .opt{text-align:center;font-size:44px}
  .opt:hover:not(:disabled){border-color:var(--main);background:#F6FCF9}
  .opt.right{border-color:var(--ok);background:#E5F6EC}
  .opt.wrong{border-color:var(--no);background:#FDECEC}
  .opt:disabled{cursor:default}
  .fb{margin-top:16px;padding:14px 18px;border-radius:16px;font-size:18px;display:none}
  .fb.show{display:block}
  .fb.ok{background:#E5F6EC}
  .fb.no{background:#FDECEC}
  .next{display:block;margin:18px auto 0;font:inherit;font-size:20px;border:0;border-radius:999px;background:var(--main);color:#fff;padding:12px 40px;cursor:pointer}
  .score{text-align:center;font-size:72px;margin:10px 0;color:var(--main)}
  .wrongs{margin-top:16px}
  .wrongs div{background:#FDF5F5;border-radius:14px;padding:12px 16px;margin:8px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>✅ 물의 상태 변화 퀴즈</h1>
  <div class="bar"><i id="bar"></i></div>
  <div class="card" id="card"></div>
</div>

<script>
  /* ===== ✏️ 문제는 여기서 바꿔요 =====
     type: "ox" 또는 "choice"
     answer: OX는 "O" 또는 "X", 객관식은 보기 번호(0부터 셈: 첫 번째 보기 = 0) */
  const TITLE = "✅ 물의 상태 변화 퀴즈";
  const QUESTIONS = [
    { type: "choice", q: "얼음이 녹아 물이 되는 변화를 무엇이라고 할까요?",
      options: ["응고", "융해", "기화", "승화"], answer: 1,
      explain: "고체가 액체로 변하는 것을 '융해'라고 해요." },
    { type: "ox", q: "물이 끓을 때 생기는 거품은 공기 방울이다.", answer: "X",
      explain: "끓을 때 생기는 거품은 물이 기체로 변한 '수증기'예요." },
    { type: "choice", q: "추운 겨울 유리창 안쪽에 성에가 생기는 변화는?",
      options: ["융해", "액화", "승화(기체→고체)", "기화"], answer: 2,
      explain: "수증기가 바로 얼음 알갱이가 되는 '승화'예요." },
    { type: "ox", q: "물이 얼음이 되면 부피가 늘어난다.", answer: "O",
      explain: "그래서 물을 가득 넣은 병을 얼리면 터질 수 있어요." },
    { type: "choice", q: "상태가 변할 때 변하지 않는 것은?",
      options: ["부피", "모양", "분자의 배열", "물질의 종류(분자 자체)"], answer: 3,
      explain: "상태가 바뀌어도 물 분자 자체는 그대로예요. 배열과 운동만 달라져요." }
  ];

  const card = document.getElementById("card");
  document.querySelector("h1").textContent = TITLE;
  let i = 0, score = 0, wrongs = [];

  function show() {
    const Q = QUESTIONS[i];
    document.getElementById("bar").style.width = (i / QUESTIONS.length * 100) + "%";
    const opts = Q.type === "ox" ? ["O", "X"] : Q.options;
    card.innerHTML = `
      <div class="num">${i + 1} / ${QUESTIONS.length}</div>
      <p class="q">${Q.q}</p>
      <div class="opts ${Q.type === "ox" ? "ox" : ""}">
        ${opts.map((o, k) => `<button class="opt" data-k="${k}">${Q.type === "ox" ? (o === "O" ? "⭕" : "❌") : (k + 1) + ". " + o}</button>`).join("")}
      </div>
      <div class="fb" id="fb"></div>`;
    card.querySelectorAll(".opt").forEach(b => b.onclick = () => choose(+b.dataset.k));
  }

  function choose(k) {
    const Q = QUESTIONS[i];
    const right = Q.type === "ox" ? (Q.answer === "O" ? 0 : 1) : Q.answer;
    const ok = k === right;
    if (ok) score++; else wrongs.push(Q);
    card.querySelectorAll(".opt").forEach((b, n) => {
      b.disabled = true;
      if (n === right) b.classList.add("right");
      else if (n === k) b.classList.add("wrong");
    });
    const fb = document.getElementById("fb");
    fb.className = "fb show " + (ok ? "ok" : "no");
    fb.innerHTML = `<b>${ok ? "🎉 맞았어요!" : "🤔 아쉬워요!"}</b><br>${Q.explain}`;
    const btn = document.createElement("button");
    btn.className = "next";
    btn.textContent = i < QUESTIONS.length - 1 ? "다음 문제 →" : "결과 보기";
    btn.onclick = () => { i++; i < QUESTIONS.length ? show() : finish(); };
    card.appendChild(btn);
    btn.focus();
  }

  function finish() {
    document.getElementById("bar").style.width = "100%";
    const msg = score === QUESTIONS.length ? "완벽해요! 👏" : score >= QUESTIONS.length * 0.6 ? "잘했어요! 틀린 것만 다시 봐요." : "다시 한 번 정리해 봐요. 할 수 있어요!";
    card.innerHTML = `
      <p style="text-align:center;margin:0">나의 점수</p>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <p style="text-align:center;font-size:20px">${msg}</p>
      ${wrongs.length ? `<div class="wrongs"><b>📌 틀린 문제 다시 보기</b>${wrongs.map(w => `<div>${w.q}<br><small>👉 ${w.explain}</small></div>`).join("")}</div>` : ""}
      <button class="next" id="again">다시 풀기</button>`;
    document.getElementById("again").onclick = () => { i = 0; score = 0; wrongs = []; show(); };
  }

  show();
</script>
</body>
</html>
