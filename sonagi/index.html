<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>소나기 연수 · 바이브코딩 웹앱 실습</title>
<link rel="icon" href="icon-512.png" type="image/png" sizes="512x512">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#F291B2">
<!-- 카톡·문자 등 링크 미리보기 -->
<meta name="description" content="선생님을 위한 50분 실습 · 사례로 웹앱 만들고, 내 주소로 올리고, 파이어스토어 연결하고, 함께 검증하기">
<meta property="og:type" content="website">
<meta property="og:title" content="소나기 연수 · 바이브코딩 웹앱 실습">
<meta property="og:description" content="선생님을 위한 50분 실습 · 사례로 웹앱 만들고, 내 주소로 올리고, 파이어스토어 연결하고, 함께 검증하기">

<meta property="og:url" content="https://moontr.site/sonagi/">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<!-- 파이어베이스 (5단계 동료 검증 담벼락) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
@font-face{font-family:'OngleipUnz';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2406-1@1.0/Ownglyph_UNZ-Rg.woff2') format('woff2');font-weight:normal;font-display:swap;size-adjust:125%}

/* ===== 색 (vibe · stuvibe · vibelab과 같은 분홍 팔레트) ===== */
:root{
  --bg:#FFF7F2; --ink:#5B4850; --ink2:#957F87; --line:#F2DED6; --soft:#FFFBF7; --accent:#F291B2;
  --pink:#F291B2; --green:#7EC49A; --mustard:#D9A548; --rose:#E0698F; --sky:#79B4DE; --lav:#A893D6; --coral:#EE9D78; --teal:#5FBDB0;
  --code:#4B3E44; --code-ink:#FFE3EC;
  --hand:'OngleipUnz', 'Gowun Dodum', sans-serif;
  --body:'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none !important}

/* ===== 예쁜 스크롤 막대: 동글동글, 그 단계 색으로 (위아래 화살표 없음) ===== */
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-button{display:none;width:0;height:0}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--c,var(--accent)) 45%,#fff);border:3px solid transparent;border-radius:99px;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background-color:color-mix(in srgb,var(--c,var(--accent)) 75%,#fff)}
.prompt pre::-webkit-scrollbar,.pop-b::-webkit-scrollbar,dialog.pop::-webkit-scrollbar,.code::-webkit-scrollbar,.field textarea::-webkit-scrollbar{width:10px;height:10px}
.code::-webkit-scrollbar-thumb{background-color:rgba(255,227,236,.35)}
.code::-webkit-scrollbar-thumb:hover{background-color:rgba(255,227,236,.6)}
@supports not selector(::-webkit-scrollbar){
  *{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--c,var(--accent)) 45%,#fff) transparent}
  .code{scrollbar-color:rgba(255,227,236,.35) transparent}
}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:7.5rem}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
a{color:var(--rose)}
b{color:#3F2F36}
kbd{font-family:inherit;font-size:.85em;background:#fff;border:1px solid var(--line);border-bottom-width:3px;border-radius:.375rem;padding:0 .375rem}
.muted{color:var(--ink2);font-size:.9375rem}
.mark{background:linear-gradient(transparent 55%, color-mix(in srgb,var(--c,var(--accent)) 38%, transparent) 55%);padding:0 .125rem}

/* ===== 머리 + 단계 탭 ===== */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:2px solid var(--line)}
.head-in{max-width:1240px;margin:0 auto;padding:.625rem 1rem .25rem;display:flex;align-items:center;gap:.75rem}
.logo{width:2.25rem;height:2.25rem;border-radius:.625rem;box-shadow:0 2px 6px rgba(224,105,143,.25);flex:none}
.course{font-family:var(--hand);font-size:.875rem;color:#fff;background:var(--accent);padding:.0625rem .625rem .125rem;border-radius:999px;white-space:nowrap}
h1{margin:0;font-family:var(--hand);font-weight:400;font-size:1.5rem;line-height:1.2}
h1 small{font-size:1rem;color:var(--ink2)}
.total{margin-left:auto;font-family:var(--hand);color:var(--rose);border:2px dashed var(--rose);border-radius:999px;padding:0 .75rem;white-space:nowrap}
nav.steps{max-width:1240px;margin:0 auto;padding:.375rem 1rem .625rem;display:flex;gap:.5rem;overflow-x:auto;scrollbar-width:none}
nav.steps::-webkit-scrollbar{display:none}
.st-tab{--c:var(--pink);flex:1 0 auto;display:flex;align-items:center;gap:.5rem;border:2px solid color-mix(in srgb,var(--c) 40%,#fff);background:#fff;border-radius:999px;padding:.3125rem .875rem .3125rem .375rem;text-align:left;transition:background .15s}
.st-tab .no{flex:none;width:1.75rem;height:1.75rem;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;font-family:var(--hand);font-size:1.0625rem}
.st-tab .lab{font-family:var(--hand);font-size:1.0625rem;line-height:1.15;white-space:nowrap}
.st-tab .lab small{display:block;font-family:var(--body);font-size:.6875rem;color:var(--ink2)}
.st-tab:hover{background:color-mix(in srgb,var(--c) 12%,#fff)}
.st-tab.on{background:var(--c);border-color:var(--c);color:#fff}
.st-tab.on .no{background:#fff;color:var(--c)}
.st-tab.on .lab small{color:rgba(255,255,255,.9)}

/* ===== 페이지 ===== */
main{max-width:1240px;margin:0 auto;padding:1.25rem 1rem 2rem}
.page{--c:var(--pink)}
.page[hidden]{display:none}
.page-head{display:flex;align-items:flex-end;gap:.875rem;flex-wrap:wrap;margin:0 0 1.125rem}
.page-no{font-family:var(--hand);font-size:3.25rem;line-height:.85;color:var(--c)}
.page-title{flex:1;min-width:14rem}
.page-title h2{margin:0;font-family:var(--hand);font-weight:400;font-size:2rem;line-height:1.15}
.page-title p{margin:.125rem 0 0;color:var(--ink2)}
.page-title p.page-note{font-size:.8125rem;color:color-mix(in srgb,var(--c) 75%,var(--ink))}
.time{font-family:var(--hand);color:var(--c);border:2px dashed var(--c);border-radius:999px;padding:0 .75rem;white-space:nowrap}
h3.sec{font-family:var(--hand);font-weight:400;font-size:1.5rem;margin:2rem 0 .75rem;display:flex;align-items:center;gap:.5rem}
h3.sec::after{content:"";flex:1;height:2px;background:var(--line)}

/* ===== 바둑판 카드 ===== */
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem;grid-auto-flow:dense}
.bento.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{--c:var(--pink);position:relative;display:flex;flex-direction:column;background:#fff;border:2px solid color-mix(in srgb,var(--c) 30%,#fff);border-radius:1.25rem;padding:1rem 1.125rem 1rem;box-shadow:0 2px 0 color-mix(in srgb,var(--c) 18%,#fff)}
.card.w2{grid-column:span 2}
.card .ch{display:flex;align-items:center;gap:.5rem;margin:0 0 .5rem}
.card .ce{flex:none;width:2.25rem;height:2.25rem;border-radius:.75rem;display:grid;place-items:center;font-size:1.25rem;background:color-mix(in srgb,var(--c) 18%,#fff)}
.card .ct{margin:0;font-family:var(--hand);font-weight:400;font-size:1.375rem;line-height:1.2;color:color-mix(in srgb,var(--c) 70%,var(--ink))}
.card .key{margin:0 0 .5rem;font-size:1.125rem;line-height:1.55}
.card ul.pts{margin:0 0 .5rem;padding:0;list-style:none;display:grid;gap:.25rem}
.card ul.pts li{position:relative;padding-left:1.125rem;font-size:.9375rem}
.card ul.pts li::before{content:"";position:absolute;left:.25rem;top:.65em;width:.375rem;height:.375rem;border-radius:50%;background:var(--c)}
.card .foot{margin-top:auto;padding-top:.375rem;display:flex;gap:.375rem;flex-wrap:wrap}
.more-btn{border:2px solid color-mix(in srgb,var(--c) 45%,#fff);background:color-mix(in srgb,var(--c) 10%,#fff);color:color-mix(in srgb,var(--c) 65%,var(--ink));border-radius:999px;padding:.125rem .875rem;font-family:var(--hand);font-size:1rem}
.more-btn:hover{background:var(--c);color:#fff}
/* 1. 이론: 한 화면에 4×3 — 스크롤 없이 보이도록 조금 촘촘하게 */
.bento.flat{gap:.75rem;grid-auto-rows:1fr}
.bento.flat .card{padding:.75rem 1rem}
.bento.flat .card .ch{margin-bottom:.375rem}
.bento.flat .card .key{font-size:1.0625rem;line-height:1.5;margin:0}
.bento.flat .card .ch{padding-right:2rem}
.bento.flat .card .foot{position:absolute;top:.75rem;right:.75rem;padding:0;margin:0}
.bento.flat .more-btn{width:1.875rem;height:1.875rem;padding:0;display:grid;place-items:center;font-size:0}
.bento.flat .more-btn::after{content:"＋";font-size:1rem}
#p1 .page-head{margin-bottom:.75rem}
#p1 .pager{margin-top:1rem}
.card.click{cursor:pointer;transition:transform .12s, box-shadow .12s}
.card.click:hover{transform:translateY(-2px);box-shadow:0 6px 16px color-mix(in srgb,var(--c) 25%,transparent)}

/* ===== 공통 부품 ===== */
.box{background:var(--soft);border:2px solid var(--line);border-radius:1rem;padding:.75rem 1rem;margin:.625rem 0}
.box h4{margin:0 0 .25rem;font-family:var(--hand);font-weight:400;font-size:1.1875rem;color:var(--rose)}
.flow{display:flex;align-items:stretch;gap:.375rem;flex-wrap:wrap;margin:.5rem 0}
.flow .st{flex:1 1 8rem;background:var(--soft);border:2px solid var(--line);border-radius:.875rem;padding:.5rem .75rem;font-size:.9375rem}
.flow .ar{align-self:center;color:var(--ink2);font-size:1.25rem}
.chip{display:inline-flex;align-items:center;gap:.375rem;border:2px solid var(--line);background:#fff;border-radius:999px;padding:.125rem .75rem;font-size:.9375rem;text-decoration:none;color:var(--ink);white-space:nowrap}
a.chip:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:.375rem;margin:.5rem 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.375rem;border:0;border-radius:999px;padding:.5rem 1.125rem;background:var(--c,var(--accent));color:#fff;font-family:var(--hand);font-size:1.125rem;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.05);box-shadow:0 4px 12px color-mix(in srgb,var(--c,var(--accent)) 35%,transparent)}
.btn.line{background:#fff;color:color-mix(in srgb,var(--c) 70%,var(--ink));border:2px solid var(--c)}
.btn.sm{padding:.25rem .875rem;font-size:1rem}
.addr{font-family:ui-monospace,Consolas,monospace;font-size:.875rem;background:#fff;border:2px solid var(--line);border-radius:.625rem;padding:.25rem .625rem;margin:.25rem 0;word-break:break-all}
.addr.good{border-color:var(--green);background:color-mix(in srgb,var(--green) 10%,#fff)}
ol.num{margin:.25rem 0;padding:0;list-style:none;counter-reset:n;display:grid;gap:.4375rem}
ol.num > li{counter-increment:n;position:relative;padding-left:2.125rem}
ol.num > li::before{content:counter(n);position:absolute;left:0;top:.125rem;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--hand);font-size:.9375rem}
table.cmp{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:2px solid var(--line);border-radius:1rem;overflow:hidden;font-size:.9375rem}
table.cmp th,table.cmp td{padding:.5rem .75rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.cmp tr:last-child td{border-bottom:0}
table.cmp thead th{background:var(--soft);font-family:var(--hand);font-weight:400;font-size:1.0625rem}
.code{background:var(--code);color:var(--code-ink);border-radius:.875rem;padding:.75rem 1rem;font-family:ui-monospace,Consolas,monospace;font-size:.8125rem;line-height:1.6;white-space:pre;overflow-x:auto;margin:.5rem 0}
.code em{font-style:normal;background:#FFE08A;color:#4B3E44;border-radius:.25rem;padding:0 .125rem}

/* AI에게 보낼 문장 (복사 단추) */
.prompt{border:2px solid color-mix(in srgb,var(--c,var(--accent)) 45%,#fff);border-radius:1rem;background:#fff;margin:.625rem 0;overflow:hidden}
.prompt-h{display:flex;align-items:center;gap:.5rem;padding:.375rem .5rem .375rem .875rem;background:color-mix(in srgb,var(--c,var(--accent)) 12%,#fff);font-family:var(--hand);font-size:1.0625rem}
.prompt-h span{flex:1}
.copy{border:0;background:var(--c,var(--accent));color:#fff;border-radius:999px;padding:.125rem .875rem;font-family:var(--hand);font-size:1rem}
.copy.done{background:var(--green)}
.prompt pre{margin:0;padding:.75rem .875rem;white-space:pre-wrap;font-family:var(--body);font-size:.9375rem;line-height:1.6;max-height:22rem;overflow:auto}
/* 바꿔 쓸 곳 [대괄호] 노란 형광펜 */
mark.fill{background:linear-gradient(transparent 12%,#FFE58A 12%,#FFE58A 92%,transparent 92%);color:#5B3A00;font-weight:700;border-radius:.25rem;padding:0 .125rem;box-decoration-break:clone;-webkit-box-decoration-break:clone}

/* 체크 목록 (이 기기에 저장) */
.ticks{list-style:none;margin:.375rem 0;padding:0;display:grid;gap:.3125rem}
.ticks label{display:flex;gap:.5rem;align-items:flex-start;background:var(--soft);border:2px solid var(--line);border-radius:.75rem;padding:.375rem .625rem;cursor:pointer;font-size:.9375rem}
.ticks input{flex:none;width:1.125rem;height:1.125rem;margin:.25rem 0 0;accent-color:var(--c,var(--accent))}
.ticks label:has(input:checked){background:color-mix(in srgb,var(--c,var(--accent)) 12%,#fff);border-color:color-mix(in srgb,var(--c,var(--accent)) 45%,#fff)}
.ticks label:has(input:checked) span{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--c) 60%,transparent)}
.ticks small{display:block;color:var(--ink2);font-size:.8125rem}
.ticks label:has(input:checked) small{text-decoration:none}

/* 입력칸 */
.field{display:grid;gap:.25rem;margin:.5rem 0}
.field > span{font-family:var(--hand);font-size:1.0625rem}
.field input,.field textarea,.field select{width:100%;border:2px solid var(--line);border-radius:.75rem;background:#fff;padding:.4375rem .75rem;font-size:.9375rem}
.field textarea{min-height:5.5rem;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:.8125rem}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--c,var(--accent))}
.row{display:flex;gap:.75rem;flex-wrap:wrap}
.row > *{flex:1 1 12rem}

/* ===== 2. 사례 ===== */
.who-bar{display:flex;align-items:flex-end;gap:.75rem;flex-wrap:wrap;background:#fff;border:2px solid var(--line);border-radius:1.25rem;padding:.5rem 1rem .75rem;margin-bottom:1rem}
.who-bar .field{flex:1 1 11rem;margin:0}
.who-bar p{flex:2 1 18rem;margin:0}
.case-card.on{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent)}
.case-card .tag{display:inline-block;font-size:.75rem;color:color-mix(in srgb,var(--c) 70%,var(--ink));background:color-mix(in srgb,var(--c) 14%,#fff);border-radius:999px;padding:0 .5rem;margin:0 .25rem .25rem 0}
.case-card .lvdots{display:flex;gap:.25rem;margin-top:auto;padding-top:.375rem;font-size:.8125rem;color:var(--ink2)}
.detail{--c:var(--pink);margin-top:1.25rem;background:#fff;border:2px solid color-mix(in srgb,var(--c) 45%,#fff);border-radius:1.5rem;overflow:hidden}
.detail-h{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;background:color-mix(in srgb,var(--c) 16%,#fff);padding:.75rem 1.25rem}
.detail-h h3{margin:0;font-family:var(--hand);font-weight:400;font-size:1.625rem;flex:1;min-width:12rem}
.lv-tabs{display:flex;gap:.375rem;flex-wrap:wrap}
.lv-tab{border:2px solid var(--c);background:#fff;border-radius:999px;padding:.125rem .875rem;font-family:var(--hand);font-size:1.0625rem}
.lv-tab.on{background:var(--c);color:#fff}
.detail-b{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:1.25rem;padding:1rem 1.25rem 1.25rem}
/* 선물 3종 세트: 왼쪽 선물 하나, 오른쪽 선물 둘 · 셋 (높이를 꽉 채워 빈칸이 없게) */
.gifts{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:1.25rem;padding:1.75rem 1.25rem 1.25rem;align-items:stretch}
.gift-col{display:flex;flex-direction:column;gap:1.75rem;min-width:0}
.gift{position:relative;display:flex;flex-direction:column;min-width:0;background:color-mix(in srgb,var(--c) 6%,#fff);border:2px dashed color-mix(in srgb,var(--c) 50%,#fff);border-radius:1.25rem;padding:1.5rem 1.125rem 1.125rem}
.gift .rib{position:absolute;top:-.95rem;left:1rem;background:var(--c);color:#fff;font-family:var(--hand);font-size:1.0625rem;border-radius:999px;padding:.125rem .875rem;box-shadow:0 3px 8px color-mix(in srgb,var(--c) 35%,transparent)}
.gift h4{margin:0 0 .25rem;font-family:var(--hand);font-weight:400;font-size:1.375rem}
.gift .gd{margin:0 0 .5rem;font-size:.9375rem;color:var(--ink2)}
.gift .gd .chip{font-size:.8125rem;padding:0 .5rem;vertical-align:1px}
.g1 .prompt{flex:1;display:flex;flex-direction:column;margin-bottom:0}
.g1 .prompt pre{flex:1}
.btn.big{width:100%;padding:.75rem 1rem;font-size:1.25rem}
.g3{flex:1}
.thumb{position:relative;flex:1;min-height:12rem;display:block;width:100%;padding:0;border:2px solid color-mix(in srgb,var(--c) 35%,#fff);border-radius:.875rem;overflow:hidden;background:#fff}
.thumb iframe{position:absolute;top:0;left:0;width:250%;height:250%;transform:scale(.4);transform-origin:0 0;border:0;pointer-events:none}
.thumb-go{position:absolute;right:.5rem;bottom:.5rem;background:var(--c);color:#fff;font-family:var(--hand);font-size:1rem;border-radius:999px;padding:.125rem .75rem;box-shadow:0 3px 8px rgba(0,0,0,.15)}
.thumb:hover{border-color:var(--c)}
.thumb:hover .thumb-go{filter:brightness(1.08)}
@media (max-width:1060px){.gifts{grid-template-columns:minmax(0,1fr)}.thumb{min-height:16rem}}
.src{font-size:.8125rem;color:var(--ink2)}
.area-no{font-size:.8em;opacity:.7}
/* 성취기준 목록: 왼쪽 단부터 위→아래로 채우고(1 2 3 4 | 5 6 7), 두 단 사이에 흐린 세로 줄 */
.std-list{--c:var(--pink);position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(var(--rows,4),auto);grid-auto-flow:column;gap:.625rem 2.25rem}
.std-list::before{content:"";position:absolute;top:.25rem;bottom:.25rem;left:50%;border-left:2px dashed color-mix(in srgb,var(--c) 22%,transparent)}
.std{display:flex;flex-direction:column;gap:.125rem;text-align:left;background:#fff;border:2px solid color-mix(in srgb,var(--c) 28%,#fff);border-radius:1rem;padding:.625rem .875rem;transition:transform .12s, box-shadow .12s}
.std:hover{transform:translateY(-1px);box-shadow:0 4px 12px color-mix(in srgb,var(--c) 22%,transparent)}
.std.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 28%,transparent)}
.std-h{font-size:1.0625rem}
.std-code{font-family:ui-monospace,Consolas,monospace;font-size:.8125rem;color:color-mix(in srgb,var(--c) 70%,var(--ink))}

<script>
/* =========================================================
   0) 작은 도구들
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// 이 기기(브라우저)에만 남기는 저장 — 다른 사람에게는 보이지 않아요
const store = {
  get(k, d) { try { const v = localStorage.getItem("sonagi." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("sonagi." + k, JSON.stringify(v)); } catch (e) {} }
};
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 1600); }
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = text; ta.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (x) {} ta.remove(); return ok;
  }
}
// AI에게 보낼 문장 상자 (복사 단추 포함)
// [대괄호] = 선생님이 바꿔 쓸 곳 → 노란 형광펜 (성취기준 코드 [9도…]는 그대로)
const hiFill = html => html.replace(/\[([^\]\n]+)\]/g, (m, x) => /^9도\d/.test(x) ? m : `<mark class="fill">${m}</mark>`);
const P = (text, label = "🤖 AI에게 보낼 문장", id = "") => `<div class="prompt"${id ? ` id="${id}"` : ""}><div class="prompt-h"><span>${label}</span><button type="button" class="copy">📋 복사</button></div><pre>${hiFill(esc(text))}</pre></div>`;
// 체크 목록: 누른 것은 이 기기에 기억해요
function ticks(key, items) {
  const saved = store.get("tick." + key, {});
  return `<ul class="ticks">${items.map((it, i) => {
    const [t, s] = Array.isArray(it) ? it : [it, ""];
    return `<li><label><input type="checkbox" data-tick="${key}" data-i="${i}" ${saved[i] ? "checked" : ""}><span>${t}${s ? `<small>${s}</small>` : ""}</span></label></li>`;
  }).join("")}</ul>`;
}
const C = { pink: "var(--pink)", green: "var(--green)", mustard: "var(--mustard)", rose: "var(--rose)", sky: "var(--sky)", lav: "var(--lav)", coral: "var(--coral)", teal: "var(--teal)" };
const ICON = {
  github: "https://github.githubassets.com/favicons/favicon.svg",
  vercel: "https://assets.vercel.com/image/upload/front/favicon/vercel/favicon.ico",
  claude: "data:image/svg+xml," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><g stroke="#D97757" stroke-width="2.3" stroke-linecap="round">${
    [10, 7.5, 9.5, 8, 10, 7, 9.5, 8, 10, 7.5, 9, 8].map((r, i) => `<line x1="12" y1="12" x2="12" y2="${12 - r}" transform="rotate(${i * 30 + 8} 12 12)"/>`).join("")
  }</g></svg>`),
  gemini: "https://www.gstatic.com/lamda/images/gemini_sparkle_v002_d4735304ff6292a690345.svg"
};
const ico = k => `<img src="${ICON[k]}" alt="" width="16" height="16" style="vertical-align:-3px">`;
const ext = (href, label) => `<a class="chip" href="${href}" target="_blank" rel="noopener">${label}</a>`;

/* 카드 하나: 중요한 것만 보이고, 나머지는 [더 보기] 작은 창으로 */
function card(o, i, group) {
  return `<article class="card${o.w ? " w" + o.w : ""}${o.more ? " click" : ""}" style="--c:${o.c}" ${o.more ? `data-pop="${group}:${i}" tabindex="0" role="button" aria-haspopup="dialog"` : ""}>
    <div class="ch"><span class="ce">${o.e}</span><h3 class="ct">${o.t}</h3></div>
    <p class="key">${o.key}</p>
    ${o.pts ? `<ul class="pts">${o.pts.map(p => `<li>${p}</li>`).join("")}</ul>` : ""}
    ${o.html || ""}
    ${o.more ? `<div class="foot"><span class="more-btn">더 보기 ＋</span></div>` : ""}
  </article>`;
}

/* =========================================================
   1) 이론 한눈에 — 카드 내용 (바둑판)
   key = 첫 화면에 보이는 핵심, more = 눌렀을 때 작은 창
   ========================================================= */
const THEORY = [
  { e: "💬", t: "바이브코딩이란?", c: C.pink, w: 2,
    key: `만들고 싶은 것을 <span class="mark">말로 설명</span>하면, AI가 코드를 써 줘요.`,
    pts: ["나: <b>무엇을</b> 만들지 정하고, 눌러 보며 확인", "AI: <b>어떻게</b> 만들지 맡아 코드 쓰기"],
    more: `<p>2025년 2월, AI 연구자 <b>안드레이 카르파티</b>가 처음 쓴 말이에요. Vibe는 '느낌, 분위기'라는 뜻이에요.</p>
      <table class="cmp"><thead><tr><th>예전 코딩</th><th>바이브코딩</th></tr></thead>
      <tr><td>문법 공부</td><td>원하는 것을 설명</td></tr><tr><td>한 줄씩 직접 입력</td><td>AI가 코드 작성</td></tr><tr><td>오류도 직접 찾기</td><td>실행해 보고 다시 말하기</td></tr></table>
      <h4>선생님에게 좋은 점</h4>

/* index.html 틀(ex 폴더) 미리 불러 두기 — 고른 성취기준 내용을 넣어 맞춤 파일을 만들어요 */
const TPL = {};
function loadTemplates() {
  const files = new Set(ACTS.flatMap(a => [a.file, ...Object.values(a.alt || {}).map(x => x.file)]));
  files.forEach(f => fetch(f).then(r => r.ok ? r.text() : "").then(t => { TPL[f] = t; if (f === actView(curAct()).file) updateThumb(); }).catch(() => {}));
}
function makeHTML(a, s) {
  const t = TPL[actView(a, s).file]; if (!t) return "";
  const data = { code: s.code, t: s.t, text: s.text, q: s.q, pairs: s.pairs, bal: s.bal, sim: s.sim, circle: s.circle, carbon: s.carbon, video: s.video, news: s.news, make: s.make, grade: who().g };
  const json = JSON.stringify(data).replace(/</g, "\\u003c");
  return t.replace(/\/\*DATA\*\/[\s\S]*?\/\*END\*\//, () => "/*DATA*/" + json + "/*END*/");
}
function giftFile(mode) {
  const a = actView(curAct()), html = makeHTML(a, curStd());
  if (!html) { if (mode === "pv") window.open(a.file, "_blank", "noopener"); else toast("파일을 불러오는 중이에요. 잠시 뒤 다시 눌러 주세요"); return; }
  const url = URL.createObjectURL(new Blob([html], { type: "text/html;charset=utf-8" }));
  if (mode === "pv") window.open(url, "_blank");
  else { const l = document.createElement("a"); l.href = url; l.download = "index.html"; document.body.appendChild(l); l.click(); l.remove(); toast("index.html을 내려받았어요"); }
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

        <input data-app="${a.id}" data-k="good" maxlength="100" placeholder="👍 칭찬 한 가지">
        <input data-app="${a.id}" data-k="idea" maxlength="100" placeholder="💡 제안 한 가지">
        <button type="button" data-send="${a.id}">남기기</button>
        <small class="pw-count">🔒 웹앱을 올린 선생님에게만 보여요</small></div>`}
    </article>`).join("");
  box.querySelectorAll("input[data-app]").forEach(i => { const k = i.dataset.app + i.dataset.k; if (typing[k]) i.value = typing[k]; if (k === focus) i.focus(); });
}
// ④ 칸: 내가 올린 웹앱 (고치기 · 지우기)
function drawMine() {
  const box = $("#pwMine"); if (!box) return;
  const mine = PW.apps.filter(isMine);
  box.innerHTML = mine.length ? `<div class="pw-mine"><b>📌 내가 올린 웹앱</b>${mine.map(a => `<div><span>${esc(a.title)}</span>
      <button type="button" class="pw-del" data-edit-app="${a.id}" title="고치기">✏️ 고치기</button><button type="button" class="pw-del" data-del-app="${a.id}" title="지우기">🗑</button></div>`).join("")}</div>` : "";
}
// 📬 내가 받은 의견
function drawInbox() {
  const box = $("#pwInbox"); if (!box) return;
  if (!PW.me) { box.innerHTML = pwErr("위 ④ 칸에 닉네임 · 숫자 네 자리를 넣으면, 내 웹앱에 온 칭찬 · 제안이 여기에 모여요."); return; }
  const mine = PW.apps.filter(isMine);
  if (!mine.length) { box.innerHTML = pwErr("내 웹앱을 담벼락에 올리면, 다른 선생님들이 남긴 칭찬 · 제안이 여기에 모여요."); return; }
  box.innerHTML = `<div class="peer-wall">${mine.map(a => {
    const notes = PW.notes.filter(n => n.app === a.id);
    return `<article class="pw-card mine"><div class="pw-h"><h4>${esc(a.title)}<small>받은 의견 ${notes.length}개</small></h4></div>
      ${notes.length ? `<div class="pw-notes">${notes.map(n => `<div class="pw-note"><span>${n.good ? `<span class="two">👍 ${esc(n.good)}</span>` : ""}${n.idea ? `<span class="two">💡 ${esc(n.idea)}</span>` : ""}</span><small>${esc(n.by || "익명")}</small></div>`).join("")}</div>` : `<p class="pw-count">아직 받은 의견이 없어요. 옆 선생님께 담벼락을 알려 주세요!</p>`}
    </article>`;
  }).join("")}</div>`;
}
// 올리기 · 고치기
async function postApp() {
  const title = $("#pwTitle").value.trim();
  let url = $("#pwUrl").value.trim();
  if (url && !/^https?:\/\//.test(url)) url = "https://" + url;
  if (!(await pwLogin())) return;
  if (!title || !url) return toast("웹앱 이름과 주소를 적어 주세요");
  if (!PW.db) return toast("담벼락에 연결되지 않았어요. 잠시 뒤 다시 해 주세요");
  try {
    if (PW.editing) {
      await PW.db.collection("sonagi_apps").doc(PW.editing).update({ title, url });
      toast("고쳤어요!");
    } else {
      await PW.db.collection("sonagi_apps").add({ name: PW.me.name, title, url, pin: PW.me.h, noteCount: 0, at: firebase.firestore.FieldValue.serverTimestamp() });
      toast("담벼락에 올렸어요!");
    }
    endEdit(); $("#pwSec").scrollIntoView({ behavior: "smooth" });
  } catch (e) { toast("저장하지 못했어요. 주소가 https:// 로 시작하는지 확인해 주세요"); }
}
function startEdit(id) {
  const a = PW.apps.find(x => x.id === id); if (!a || !isMine(a)) return;
  PW.editing = id;
  $("#pwTitle").value = a.title; $("#pwUrl").value = a.url;
  $("#pwPost").textContent = "💾 고친 내용 저장"; $("#pwCancel").hidden = false;
  $("#pwTitle").closest(".card").scrollIntoView({ behavior: "smooth", block: "center" }); $("#pwTitle").focus();
}
function endEdit() {
  PW.editing = ""; if (!$("#pwTitle")) return;
  $("#pwTitle").value = ""; $("#pwUrl").value = "";
  $("#pwPost").textContent = "📌 담벼락에 올리기"; $("#pwCancel").hidden = true;
}
async function deleteApp(id) {
  const a = PW.apps.find(x => x.id === id); if (!a) return;
  if (!confirm("이 웹앱을 담벼락에서 지울까요?")) return;
  try {
    // 관리자는 아예 지우고, 올린 선생님은 담벼락에서 내려요(gone)
    if (PW.admin && !isMine(a)) await PW.db.collection("sonagi_apps").doc(id).delete();
    else await PW.db.collection("sonagi_apps").doc(id).update({ gone: true });
    if (PW.editing === id) endEdit();
    toast("지웠어요");
  } catch (e) { toast("지우지 못했어요"); }
}
// 의견 남기기 (화면에서는 웹앱을 올린 선생님에게만 보여요)
async function sendNote(app) {
  if (!PW.db) return toast("담벼락에 연결되지 않았어요");
  const get = k => ((document.querySelector(`input[data-app="${app}"][data-k="${k}"]`) || {}).value || "").trim();
  const good = get("good"), idea = get("idea");
  if (!good && !idea) return toast("칭찬이나 제안을 한 가지 이상 적어 주세요");
  const by = PW.me?.name || ($("#pwName") && $("#pwName").value.trim()) || store.get("peerName", "") || "익명";
  try {
    // 의견 저장 + 그 웹앱의 의견 수 1 올리기 (한 번에)
    const batch = PW.db.batch();
    batch.set(PW.db.collection("sonagi_notes").doc(), { app, good, idea, by: by.slice(0, 20), at: firebase.firestore.FieldValue.serverTimestamp() });
    batch.update(PW.db.collection("sonagi_apps").doc(app), { noteCount: firebase.firestore.FieldValue.increment(1) });
    await batch.commit();
    document.querySelectorAll(`input[data-app="${app}"]`).forEach(i => i.value = "");
    toast("의견을 남겼어요. 고마워요!");
  } catch (e) { toast("남기지 못했어요. 잠시 뒤 다시 해 주세요"); }
}
const AI_MORE = [
  { t: "🐞 오류 · 보안 점검", c: C.lav, html: P(`첨부한 index.html을 꼼꼼히 점검해 줘. 고치기 전에 먼저 목록으로 알려 줘.
1. 오류: 빈칸 입력, 아주 긴 글, 빠르게 여러 번 누르기, 휴대폰 화면에서 생길 문제
2. 보안: 코드에 들어 있으면 안 되는 비밀번호 · API 키, 화면에 그대로 넣어 위험한 학생 입력(HTML 끼워 넣기)
3. 개인정보: 꼭 필요하지 않은데 받는 정보
4. 빠진 기능: 처음 부탁한 기능 중 안 되는 것
각각 '얼마나 급한지(상 · 중 · 하)'를 붙여 주고, 내가 '고쳐 줘'라고 하면 그때 고친 index.html 전체를 줘.`) },
  { t: "🧪 학생 역할 테스트", c: C.lav, html: P(`너는 [중학교 2학년] 학생이야. 첨부한 웹앱을 수업 시간에 처음 써 본다고 생각하고 답해 줘.
1. 첫 화면에서 무엇을 해야 할지 바로 알겠어?

3. 장난치고 싶은 학생이라면 어떤 입력을 할 것 같아? 그때 웹앱은 어떻게 돼?
4. 친구에게 보여 주고 싶은 점 1가지
5. 고치면 좋을 점을 쉬운 것부터 순서대로`) },
  { t: "📜 보안 규칙 점검", c: C.lav, html: P(`아래는 내가 게시한 파이어스토어 보안 규칙이야. 첨부한 index.html과 함께 점검해 줘.
1. 누구나 기록을 고치거나 지울 수 있는 구멍이 있는지

4. 웹앱이 저장하는 칸과 규칙이 맞지 않아 저장이 막히는 곳이 있는지
문제가 있으면 고친 규칙 전체와, 바뀐 줄마다 쉬운 설명을 줘.

■ 내 보안 규칙
[여기에 규칙 탭의 내용 붙여 넣기]`) + `<p class="muted">규칙은 Firestore Database → <b>규칙</b> 탭에서 복사해요.</p>` }
];

/* 6. 꿀팁 */
function renderTips() {
  return `<div class="bento">${TIPS.map((o, i) => card(o, i, "tips")).join("")}</div>`;
}

/* =========================================================
   페이지 만들기 · 넘기기
   ========================================================= */
let cur = 1;
function build() {
  $("#steps").innerHTML = STEPS.map((s, i) => `<button type="button" class="st-tab" style="--c:${s.c}" data-go="${i + 1}"><span class="no">${i + 1}</span><span class="lab">${s.t}<small>${s.sub} · ${dur(s)}</small></span></button>`).join("");
  $("#main").innerHTML = STEPS.map((s, i) => `<section class="page" id="p${i + 1}" style="--c:${s.c}" hidden aria-labelledby="h${i + 1}">
    <div class="page-head"><span class="page-no">${i + 1}</span><div class="page-title"><h2 id="h${i + 1}">${s.title}</h2><p>${s.lead}</p>${s.note ? `<p class="page-note">${s.note}</p>` : ""}</div><span class="time">${s.when ? "📖" : "⏱"} ${dur(s)}</span></div>
    ${s.render()}
    <div class="pager">${i > 0 ? `<button type="button" class="btn line" data-go="${i}" style="--c:${STEPS[i - 1].c}">← ${STEPS[i - 1].t}</button>` : "<span></span>"}${i < STEPS.length - 1 ? `<button type="button" class="btn" data-go="${i + 2}" style="--c:${STEPS[i + 1].c}">${STEPS[i + 1].t} →</button>` : ""}</div>
  </section>`).join("");
  renderCaseDetail();
  updateFb();
  loadTemplates();
  initPeerWall();
}
function go(n, push = true) {
  n = Math.min(Math.max(1, +n || 1), STEPS.length);
  cur = n;
  if ($("#pop").open) $("#pop").close();
  document.querySelectorAll(".page").forEach((p, i) => p.hidden = i + 1 !== n);
  document.querySelectorAll(".st-tab").forEach((t, i) => { t.classList.toggle("on", i + 1 === n); t.setAttribute("aria-current", i + 1 === n ? "step" : "false"); });
  const on = $(".st-tab.on"); on && on.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
  if (push && location.hash !== "#" + n) history.pushState(null, "", "#" + n);
  window.scrollTo({ top: 0 });
}
window.addEventListener("popstate", () => go(location.hash.slice(1), false));

/* 작은 창 열기 */
const POPS = {
  theory: i => THEORY_VIEW[i], tips: i => TIPS[i],
  policy: () => ({ e: "📜", t: "이용약관 · 개인정보 처리방침", c: C.pink, more: $("#policyTpl").innerHTML }),
  dl: i => DL_MORE[i], deploy: i => DEPLOY_MORE[i], fb: i => FB_MORE[i], ai: i => AI_MORE[i]
};
function openPop(key) {
  const [g, i] = key.split(":"), o = POPS[g] && POPS[g](+i); if (!o) return;
  const d = $("#pop");
  d.style.setProperty("--c", o.c);
  $("#popTitle").innerHTML = o.e ? `${o.e} ${o.t}` : o.t;
  $("#popBody").innerHTML = (o.key && o.more ? `<p style="font-size:1.125rem">${o.key}</p>` : "") + (o.more || o.html || "");
  d.showModal(); $("#popBody").scrollTop = 0;
}

/* =========================================================
   누르기 · 입력 한곳에서 처리
   ========================================================= */
document.addEventListener("click", async e => {
  const t = e.target;
  const g = t.closest("[data-go]"); if (g) { go(g.dataset.go); return; }
  const cp = t.closest(".copy");
  if (cp) { const ok = await copyText(cp.closest(".prompt").querySelector("pre").textContent); cp.textContent = ok ? "✓ 복사됨" : "복사 실패"; cp.classList.toggle("done", ok); toast(ok ? "복사했어요! AI 채팅창에 붙여 넣으세요" : "직접 드래그해서 복사해 주세요"); setTimeout(() => { cp.textContent = "📋 복사"; cp.classList.remove("done"); }, 1800); return; }
  if (t.closest("[data-close]") || t === $("#pop")) { $("#pop").close(); return; }
  const pp = t.closest("[data-pop]"); if (pp && !t.closest("a,input,textarea,select,.prompt")) { openPop(pp.dataset.pop); return; }
  // 2단계: 영역 → 성취기준 → 활동 고르기
  const ar = t.closest("[data-area]");
  if (ar) {
    areaSel = ar.dataset.area; store.set("area", areaSel);
    if (!stdSel.startsWith("9도" + areaSel)) { stdSel = STDS.find(s => s.code.startsWith("9도" + areaSel)).code; store.set("std", stdSel); }
    renderCaseDetail(); $("#stdList").scrollIntoView({ behavior: "smooth", block: "center" }); return;
  }
  const sd = t.closest("[data-std]");
  if (sd) { stdSel = sd.dataset.std; store.set("std", stdSel); renderCaseDetail(); $("#actGrid").scrollIntoView({ behavior: "smooth", block: "center" }); return; }
  const ac = t.closest("[data-act]");
  if (ac) { actSel = ac.dataset.act; store.set("act", actSel); renderCaseDetail(); $("#caseDetail").scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if (t.closest("[data-dl]")) { giftFile("dl"); return; }
  if (t.closest("[data-pv]")) { giftFile("pv"); return; }
  // 5단계 동료 검증 담벼락
  if (t.closest("#pwPost")) { postApp(); return; }
  if (t.closest("#pwCancel")) { endEdit(); return; }
  if (t.closest("#pwOpen")) { pwLogin().then(ok => { if (ok) toast(PW.apps.some(isMine) ? "내 웹앱을 불러왔어요" : "아직 이 닉네임 · 네 자리로 올린 웹앱이 없어요"); }); return; }
  if (t.closest("#pwOut")) { pwLogout(); return; }
  if (t.closest("#pwAdminOpen")) { drawAdmin(true); return; }
  if (t.closest("#pwAdminOut")) { firebase.auth().signOut(); return; }
  if (t.closest("#pwOnly0")) { PW.only0 = !PW.only0; drawPeerWall(); return; }
  const ps = t.closest("[data-pw-sort]"); if (ps) { PW.sort = ps.dataset.pwSort; drawPeerWall(); return; }
  const sn = t.closest("[data-send]"); if (sn) { sendNote(sn.dataset.send); return; }
  const ea = t.closest("[data-edit-app]"); if (ea) { startEdit(ea.dataset.editApp); return; }
  const da = t.closest("[data-del-app]"); if (da) { deleteApp(da.dataset.delApp); return; }
});
document.addEventListener("submit", e => { if (e.target.id === "pwAdminForm") { e.preventDefault(); adminLogin(); } });
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-pop]:not(button),[data-area],[data-act]")) { e.preventDefault(); e.target.click(); }
  if (e.key === "Enter" && e.target.matches("input[data-app]")) sendNote(e.target.dataset.app);
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.tick) { const k = "tick." + t.dataset.tick, s = store.get(k, {}); s[t.dataset.i] = t.checked; store.set(k, s); }
  if (t.id === "fbRead" || t.id === "fbLen") updateFb();
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "pwName") store.set("peerName", t.value.trim());
  if (t.id === "fbCfg" || t.id === "fbWhat" || t.id === "fbMail") updateFb();
});

build();
go(location.hash.slice(1) || 1, false);
</script>
