
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>바이브코딩으로 웹앱 만들기 | 선생님을 위한 매뉴얼</title>
<meta name="description" content="코딩을 처음 해보는 선생님도 하나씩 따라 하며 교실에서 쓸 웹앱을 만드는 매뉴얼" />

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
@font-face{
  font-family:'OwnglyphYuntaeng';
  src:url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2608211801@font-160/font-160/%EC%98%A8%EA%B8%80%EC%9E%8E%20%EC%9C%A4%ED%83%B1%EC%B2%B4.woff2') format('woff2');
  font-weight:400;font-display:swap;
}
body[data-font="nanum"]{font-family:'NanumSquare',sans-serif}
body[data-font="pretendard"]{font-family:'Pretendard',sans-serif}
body[data-font="gowun"]{font-family:'Gowun Dodum',sans-serif}
body[data-font="yuntaeng"]{font-family:'OwnglyphYuntaeng',sans-serif}
body[data-font="yuntaeng"] .h1,body[data-font="yuntaeng"] .sec-h,body[data-font="yuntaeng"] .blk-h{letter-spacing:0}

body[data-design="a"]{
  --bg:#f7f8fa;--panel:#fff;--panel2:#f2f4f6;--ink:#191f28;--ink2:#4e5968;--ink3:#8b95a1;
  --line:#e5e8eb;--line2:#d1d6db;--accent:#3182f6;--accentInk:#fff;--accentSoft:#e8f3ff;--ok:#10b981;
  --rCard:18px;--rBtn:999px;--rSm:10px;
  --sideBg:#fff;--sideInk:#4e5968;--sideActBg:#e8f3ff;--sideActInk:#3182f6;--sideLine:#e5e8eb;--sideDim:#8b95a1;
  --shadow:0 1px 3px rgba(0,0,0,.05);
}
body[data-design="b"]{
  --bg:#fdfcf8;--panel:#fff;--panel2:#f0ece0;--ink:#2f3a4a;--ink2:#5a6270;--ink3:#9c9484;
  --line:#d9d2c2;--line2:#2f3a4a;--accent:#d64545;--accentInk:#fff;--accentSoft:#fbe9e9;--ok:#3f8f5f;
  --rCard:10px;--rBtn:8px;--rSm:6px;
  --sideBg:#f0ece0;--sideInk:#6b6355;--sideActBg:#fff;--sideActInk:#2f3a4a;--sideLine:#d9d2c2;--sideDim:#9c9484;
  --shadow:none;
}
body[data-design="c"]{
  --bg:#22362d;--panel:#2a4136;--panel2:#1b2b24;--ink:#f3f7f4;--ink2:#b7ccc0;--ink3:#8fa99b;
  --line:#3d5a4c;--line2:#5a7a68;--accent:#f2c94c;--accentInk:#1b2b24;--accentSoft:#354d41;--ok:#7bd389;
  --rCard:12px;--rBtn:8px;--rSm:8px;
  --sideBg:#1b2b24;--sideInk:#c3d6cb;--sideActBg:#354d41;--sideActInk:#f2c94c;--sideLine:#3d5a4c;--sideDim:#7d9789;
  --shadow:none;
}
body[data-design="d"]{
  --bg:#f1f3f5;--panel:#fff;--panel2:#f8f9fa;--ink:#1f2937;--ink2:#4b5563;--ink3:#9ca3af;
  --line:#dee2e6;--line2:#c6ccd3;--accent:#0f766e;--accentInk:#fff;--accentSoft:#e3f1ef;--ok:#0f766e;
  --rCard:6px;--rBtn:5px;--rSm:5px;
  --sideBg:#1f2937;--sideInk:#c3cbd6;--sideActBg:#0f766e;--sideActInk:#fff;--sideLine:#2c3949;--sideDim:#7a8799;
  --shadow:0 1px 2px rgba(0,0,0,.04);
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}

.wrap{max-width:1240px;margin:0 auto;padding:0 20px}

.head{background:var(--panel);border-bottom:1px solid var(--line)}
.head-in{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;padding:18px 0 14px;flex-wrap:wrap}
.kicker{display:inline-flex;align-items:center;gap:6px;font-size:.73rem;font-weight:800;color:var(--accent);background:var(--accentSoft);padding:4px 10px;border-radius:999px;margin-bottom:8px}
.h1{font-size:1.6rem;font-weight:800;letter-spacing:-.03em;line-height:1.3}
.sub{font-size:.9rem;color:var(--ink2);margin-top:5px;max-width:56ch}
.tools{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.tool-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.tool-cap{font-size:.72rem;font-weight:800;color:var(--ink3);margin-right:2px}
.tool-btn{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:800;color:var(--ink2);background:var(--panel2);padding:6px 11px;border-radius:var(--rBtn);border:1.5px solid transparent;white-space:nowrap;transition:.15s}
.tool-btn:hover{border-color:var(--line2)}
.tool-btn.on{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
.tool-btn[data-f="nanum"]{font-family:'NanumSquare',sans-serif}
.tool-btn[data-f="pretendard"]{font-family:'Pretendard',sans-serif}
.tool-btn[data-f="gowun"]{font-family:'Gowun Dodum',sans-serif}
.tool-btn[data-f="yuntaeng"]{font-family:'OwnglyphYuntaeng',sans-serif;font-size:.9rem}

.tabs{display:flex;gap:6px;padding:0 0 14px;overflow-x:auto}
body[data-design="b"] .tabs{align-items:flex-end;gap:4px;padding-bottom:0}
body[data-design="d"] .tabs{gap:0;padding-bottom:0}
.tab{flex:1 0 auto;min-width:180px;text-align:left;padding:11px 14px;transition:.15s}
.tab-n{display:block;font-size:.88rem;font-weight:800}
.tab-s{display:block;font-size:.72rem;margin-top:1px}
.tab-badge{font-size:.62rem;font-weight:800;padding:1px 6px;border-radius:999px;margin-left:5px;background:var(--panel);color:var(--ink3);border:1px solid var(--line)}
.tab.on .tab-badge{background:rgba(255,255,255,.25);border-color:transparent;color:inherit}
body[data-design="a"] .tab{border-radius:14px;background:var(--panel2)}
body[data-design="a"] .tab-n{color:var(--ink2)}body[data-design="a"] .tab-s{color:var(--ink3)}
body[data-design="a"] .tab.on{background:var(--accent)}
body[data-design="a"] .tab.on .tab-n,body[data-design="a"] .tab.on .tab-s{color:var(--accentInk)}
body[data-design="b"] .tab{border-radius:12px 12px 0 0;background:var(--panel2);border:1.5px solid var(--line);border-bottom:none;padding-bottom:12px}
body[data-design="b"] .tab-n{color:var(--ink3)}body[data-design="b"] .tab-s{color:var(--ink3)}
body[data-design="b"] .tab.on{background:var(--panel);border-color:var(--line2);border-width:2px}
body[data-design="b"] .tab.on .tab-n{color:var(--ink)}body[data-design="b"] .tab.on .tab-s{color:var(--accent)}
body[data-design="c"] .tab{border:1.5px dashed var(--line2);border-radius:10px}
body[data-design="c"] .tab-n{color:var(--ink)}body[data-design="c"] .tab-s{color:var(--ink3)}
body[data-design="c"] .tab.on{background:var(--accent);border-style:solid;border-color:var(--accent)}
body[data-design="c"] .tab.on .tab-n{color:var(--accentInk)}body[data-design="c"] .tab.on .tab-s{color:#6b5a1c}
body[data-design="d"] .tab{border-bottom:2.5px solid transparent;padding:12px 20px;flex:0 0 auto}
body[data-design="d"] .tab-n{color:var(--ink2)}body[data-design="d"] .tab-s{color:var(--ink3)}
body[data-design="d"] .tab.on{border-bottom-color:var(--accent)}
body[data-design="d"] .tab.on .tab-n{color:var(--accent)}

.grid{display:grid;grid-template-columns:236px minmax(0,1fr)}
body[data-design="b"] .grid{border-top:2px solid var(--line2)}
.side{background:var(--sideBg);border-right:1px solid var(--sideLine);padding:18px 12px 40px}
.side-in{position:sticky;top:14px}
.side-h{font-size:.68rem;font-weight:800;color:var(--sideDim);padding:0 8px 8px}
.side-i{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;font-size:.81rem;font-weight:700;color:var(--sideInk);border-radius:var(--rSm);margin-bottom:2px;transition:.15s}
.side-i:hover{background:var(--accentSoft)}
body[data-design="d"] .side-i:hover{background:#2c3949}
.side-i.on{background:var(--sideActBg);color:var(--sideActInk)}
.side-n{flex-shrink:0;font-size:.67rem;font-weight:800;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;border-radius:5px;background:var(--panel2);color:var(--ink3)}
body[data-design="c"] .side-n,body[data-design="d"] .side-n{background:rgba(255,255,255,.12);color:inherit}
.side-i.on .side-n{background:var(--accent);color:var(--accentInk)}
.side-txt{flex:1;min-width:0}
.side-pen{opacity:.45;display:flex;flex-shrink:0}
.side-pen:hover{opacity:1}
.sep{height:1px;background:var(--sideLine);margin:14px 8px}

.bnr-zone{padding:0 3px}
.zone-h{font-size:.65rem;font-weight:800;color:var(--sideDim);padding:0 6px 8px}
.bnr-big{display:block;width:100%;text-align:left;border-radius:13px;padding:15px 15px 14px;margin-bottom:9px;background:linear-gradient(135deg,#e8453f,#c62828);color:#fff;position:relative;overflow:hidden;transition:.15s}
body[data-design="c"] .bnr-big{background:linear-gradient(135deg,#b8453f,#8e2f2a)}
.bnr-big:hover{filter:brightness(1.07)}
.bnr-big::after{content:'';position:absolute;right:-24px;top:-24px;width:86px;height:86px;border-radius:50%;background:rgba(255,255,255,.12)}
.bnr-big .ic{display:block;font-size:1.15rem;margin-bottom:5px;position:relative}
.bnr-big .t{display:block;font-size:.9rem;font-weight:800;margin-bottom:3px;line-height:1.35;position:relative}
.bnr-big .d{display:block;font-size:.72rem;opacity:.92;line-height:1.45;position:relative}
.bnr-row{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:9px 11px;border-radius:var(--rSm);background:var(--panel2);margin-bottom:5px;font-size:.77rem;font-weight:700;color:var(--ink2);transition:.15s}
body[data-design="c"] .bnr-row,body[data-design="d"] .bnr-row{background:rgba(255,255,255,.07);color:var(--sideInk)}
.bnr-row:hover{filter:brightness(.97)}
.bnr-row .sq{width:18px;height:18px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.68rem;color:#fff;font-weight:800}
.bnr-row .ar{margin-left:auto;opacity:.45;font-size:.8rem}

.main{padding:26px 26px 70px;min-width:0}
body[data-design="b"] .main{background:linear-gradient(to right,transparent 44px,#f0b8b8 44px,#f0b8b8 45px,transparent 45px),repeating-linear-gradient(var(--bg) 0 30px,#e3e9f1 30px 31px);padding-left:62px}

.sec{padding:8px 0 46px;scroll-margin-top:16px}
.sec + .sec{border-top:1px solid var(--line)}
body[data-design="b"] .sec + .sec{border-top:1px dashed var(--line)}
.sec-top{display:flex;align-items:center;gap:10px;margin-bottom:6px;padding-top:26px}
.sec-num{flex-shrink:0;width:28px;height:28px;border-radius:9px;background:var(--accent);color:var(--accentInk);font-size:.8rem;font-weight:800;display:flex;align-items:center;justify-content:center}
.sec-tag{font-size:.71rem;font-weight:800;padding:3px 10px;border-radius:var(--rBtn);background:var(--panel2);color:var(--ink2)}
.sec-h{font-size:1.45rem;font-weight:800;letter-spacing:-.03em;line-height:1.35;margin-bottom:6px}
.sec-sub{font-size:.92rem;color:var(--ink2);max-width:64ch;margin-bottom:22px}

.blk{margin-bottom:20px}
.blk-h{font-size:1.08rem;font-weight:800;letter-spacing:-.02em;margin-bottom:10px}
.blk-p{font-size:.93rem;color:var(--ink2);max-width:70ch}
.blk-p + .blk-p{margin-top:11px}

.chat{background:var(--panel);border:1px solid var(--line);border-radius:var(--rCard);padding:20px;box-shadow:var(--shadow)}
.bub{display:flex;justify-content:flex-end;margin-bottom:9px}
.bub span{background:var(--accent);color:var(--accentInk);font-size:.9rem;font-weight:700;padding:10px 15px;border-radius:16px 16px 4px 16px;max-width:82%;line-height:1.6}
.chat-note{display:flex;gap:9px;align-items:flex-start;margin-top:14px;padding-top:13px;border-top:1px dashed var(--line)}
.chat-note .m{flex-shrink:0;font-size:.95rem}
.chat-note p{font-size:.86rem;color:var(--ink2)}

.note-box{background:var(--accentSoft);border-radius:var(--rCard);padding:16px 18px;display:flex;gap:11px;align-items:flex-start}
body[data-design="b"] .note-box{border-radius:0;border-left:3px solid var(--accent)}
.note-box .m{flex-shrink:0;font-size:1rem;line-height:1.5}
.note-box p{font-size:.9rem;color:var(--ink2);font-weight:700}
body[data-design="c"] .note-box p{color:var(--ink)}

.mini-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px}
.mini{background:var(--panel);border:1px solid var(--line);border-radius:var(--rCard);padding:16px 17px;box-shadow:var(--shadow)}
.mini .m{font-size:1.3rem;display:block;margin-bottom:8px}
.mini .t{display:block;font-size:.92rem;font-weight:800;margin-bottom:5px}
.mini .d{display:block;font-size:.83rem;color:var(--ink2);line-height:1.6}

.link-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:11px}
.link-box{display:block;background:var(--panel);border:1.5px solid var(--line);border-radius:var(--rCard);padding:17px 18px;transition:.15s;box-shadow:var(--shadow)}
.link-box:hover{border-color:var(--accent)}
.link-box .t{display:flex;align-items:center;gap:7px;font-size:1rem;font-weight:800;margin-bottom:4px}
.link-box .u{display:block;font-size:.8rem;color:var(--accent);font-weight:700;margin-bottom:7px}
.link-box .d{display:block;font-size:.83rem;color:var(--ink2)}

/* 번호 목록 */
.olist{display:flex;flex-direction:column;gap:11px}
.olist-i{display:flex;gap:12px;align-items:flex-start}
.olist-n{flex-shrink:0;width:25px;height:25px;border-radius:50%;background:var(--accent);color:var(--accentInk);font-size:.76rem;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
.olist-t{font-size:.91rem;color:var(--ink2);padding-top:1px}
.olist-t b{color:var(--ink);font-weight:800}

/* 체크 목록 */
.clist{background:var(--panel);border:1px solid var(--line);border-radius:var(--rCard);padding:16px 18px;box-shadow:var(--shadow)}
.clist-i{display:flex;gap:10px;align-items:flex-start;padding:7px 0}
.clist-i + .clist-i{border-top:1px dashed var(--line)}
.clist-b{flex-shrink:0;width:18px;height:18px;border-radius:5px;border:1.8px solid var(--line2);margin-top:3px;display:flex;align-items:center;justify-content:center;color:var(--ok)}
.clist-t{font-size:.89rem;color:var(--ink2)}

.xref{display:inline-flex;align-items:center;gap:7px;font-size:.84rem;font-weight:800;padding:9px 14px;border-radius:var(--rBtn);background:var(--panel2);color:var(--ink2);border:1.5px dashed var(--line2);transition:.15s}
.xref:hover{border-style:solid;border-color:var(--accent);color:var(--accent)}

.prompt{border:1px solid var(--line);border-radius:var(--rSm);overflow:hidden;background:var(--panel2)}
.prompt-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.prompt-l{font-size:.75rem;font-weight:800;color:var(--ink2)}
.copy{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:800;background:var(--panel);border:1px solid var(--line);color:var(--ink2);padding:5px 10px;border-radius:var(--rSm)}
.copy.done{background:var(--ok);border-color:var(--ok);color:#fff}
.prompt-c{padding:13px 14px;font-size:.85rem;line-height:1.75;color:var(--ink2);white-space:pre-wrap;word-break:break-word}

.sec-foot{display:flex;justify-content:flex-end;margin-top:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:.82rem;font-weight:800;padding:9px 16px;border-radius:var(--rBtn);background:var(--accent);color:var(--accentInk);transition:.15s}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--panel);border:1.5px solid var(--line);color:var(--ink2)}
.btn.ghost:hover{border-color:var(--line2);filter:none}
.btn.ok{background:var(--ok);color:#fff}
.btn.sm{font-size:.76rem;padding:6px 12px}
.btn.danger{background:transparent;border:1.5px solid #e06666;color:#e06666}
.btn[disabled]{opacity:.55;cursor:default}

.soon{background:var(--panel);border:1.5px dashed var(--line2);border-radius:var(--rCard);padding:56px 26px;text-align:center;margin-top:20px}
.soon-ic{width:56px;height:56px;margin:0 auto 16px;border-radius:50%;background:var(--panel2);color:var(--ink3);display:flex;align-items:center;justify-content:center;font-size:1.4rem}
.soon-h{font-size:1.3rem;font-weight:800;margin:10px 0 7px}
.soon-p{font-size:.9rem;color:var(--ink2);max-width:46ch;margin:0 auto 20px}
.tag{display:inline-block;font-size:.71rem;font-weight:800;padding:3px 10px;border-radius:var(--rBtn);background:var(--accent);color:var(--accentInk)}

.admin-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--accentSoft);border-radius:var(--rSm);padding:11px 15px;margin-bottom:18px}
.admin-bar-l{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--accent);font-weight:700}
.admin-bar-r{display:flex;gap:6px;flex-wrap:wrap}
.blk-tools{display:flex;gap:5px;justify-content:flex-end;margin-bottom:6px}
.edit-form{display:flex;flex-direction:column;gap:10px;background:var(--panel2);border-radius:var(--rSm);padding:15px;margin-bottom:18px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld-l{font-size:.73rem;font-weight:800;color:var(--ink3)}
.inp,.ta{width:100%;background:var(--panel);border:1.5px solid var(--line);border-radius:var(--rSm);padding:9px 11px;font-size:.85rem;color:var(--ink);resize:vertical}
.inp:focus,.ta:focus{border-color:var(--accent);outline:none}
.ta{min-height:70px;line-height:1.65}
.pair{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-bottom:6px;align-items:start}
.one{display:grid;grid-template-columns:1fr auto;gap:6px;margin-bottom:6px;align-items:start}

.back{position:fixed;inset:0;background:rgba(12,18,28,.5);display:flex;align-items:center;justify-content:center;padding:18px;z-index:90}
.sheet{background:var(--panel);border-radius:var(--rCard);width:100%;max-width:600px;max-height:88vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.sheet-t{font-size:1.08rem;font-weight:800}
.sheet-s{font-size:.82rem;color:var(--ink3);margin-top:2px}
.sheet-b{padding:18px 20px 22px;display:flex;flex-direction:column;gap:12px}
.x{width:30px;height:30px;border-radius:50%;color:var(--ink3);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.x:hover{background:var(--panel2)}
.pw{width:100%;text-align:center;font-size:1.5rem;letter-spacing:.4em;padding:12px;background:var(--panel2);border:1.5px solid var(--line);border-radius:var(--rSm);color:var(--ink)}
.err{font-size:.8rem;color:#e05555;font-weight:700;text-align:center}
.ref-body{font-size:.9rem;color:var(--ink2);white-space:pre-wrap;line-height:1.85}

/* ===================== 블록 ===================== */
function Block({ b, onRef, refs }){
  if(b.kind==='text') return <div className="blk">
    {b.heading&&<h3 className="blk-h">{b.heading}</h3>}
    {lines(b.text).map((p,i)=><p className="blk-p" key={i}>{HTML(p)}</p>)}</div>;

  if(b.kind==='chat') return <div className="blk">
    {b.heading&&<h3 className="blk-h">{b.heading}</h3>}
    <div className="chat">
      {(b.items||[]).map((t,i)=><div className="bub" key={i}><span>{t}</span></div>)}
      {b.text&&<div className="chat-note"><span className="m">💬</span><p>{b.text}</p></div>}
    </div></div>;

  if(b.kind==='note') return <div className="blk">
    <div className="note-box"><span className="m">{b.icon||'🌱'}</span><p>{b.text}</p></div></div>;

  if(b.kind==='mini') return <div className="blk">
    {b.heading&&<h3 className="blk-h">{b.heading}</h3>}
    {b.text&&<p className="blk-p" style={{marginBottom:13}}>{b.text}</p>}
    <div className="mini-grid">
      {(b.items||[]).map((it,i)=><div className="mini" key={i}>
        <span className="m">{it.m}</span><span className="t">{it.t}</span><span className="d">{it.d}</span></div>)}
    </div>
    {b.foot&&<p className="blk-p" style={{marginTop:13}}>{b.foot}</p>}</div>;

  if(b.kind==='links') return <div className="blk">
    {b.heading&&<h3 className="blk-h">{b.heading}</h3>}
    <div className="link-grid">
      {(b.items||[]).map((it,i)=><a className="link-box" key={i} href={`https://${it.u}`} target="_blank" rel="noopener">
        <span className="t"><span>{it.m}</span>{it.t}</span><span className="u">{it.u}</span><span className="d">{it.d}</span></a>)}
    </div>
    {b.foot&&<p className="blk-p" style={{marginTop:13}}>{b.foot}</p>}</div>;

  if(b.kind==='olist') return <div className="blk">
    {b.heading&&<h3 className="blk-h">{b.heading}</h3>}
    <div className="olist">
      {(b.items||[]).map((t,i)=><div className="olist-i" key={i}>
        <span className="olist-n">{i+1}</span><span className="olist-t">{HTML(t)}</span></div>)}
    </div></div>;

  if(b.kind==='clist') return <div className="blk">
    {b.heading&&<h3 className="blk-h">{b.heading}</h3>}
    <div className="clist">
      {(b.items||[]).map((t,i)=><div className="clist-i" key={i}>
        <span className="clist-b">{I.check({s:12,w:3})}</span><span className="clist-t">{HTML(t)}</span></div>)}
    </div></div>;

  if(b.kind==='xref'){
    const r=(refs||[]).find(x=>x.id===b.refId);
    if(!r) return null;
    return <div className="blk"><button className="xref" onClick={()=>onRef(r)}>
      <span>{b.text}</span><span>→ {r.name}</span></button></div>;
  }

  if(b.kind==='prompt') return <div className="blk">
    {b.heading&&<h3 className="blk-h">{b.heading}</h3>}<PromptBox text={b.text}/></div>;

  return null;
}

function PromptBox({ text }){
  const [d,setD]=useState(false);
  const mark=()=>{setD(true);setTimeout(()=>setD(false),1800)};
  const go=()=>{
    const fb=()=>{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';
      document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch{}document.body.removeChild(t);return ok};
    if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(text).then(mark).catch(()=>{fb()&&mark()});
    else fb()&&mark();
  };
  return <div className="prompt">
    <div className="prompt-h"><span className="prompt-l">그대로 복사해서 쓰는 문장</span>
      <button className={`copy ${d?'done':''}`} onClick={go}>
        {d?<>{I.check({s:13,w:3})}<span>복사했어요</span></>:<>{I.copy({s:13})}<span>복사</span></>}</button></div>
    <div className="prompt-c">{text}</div></div>;
}

    {f.kind==='xref'?<>

  return <div className="back" onClick={onClose}>
    <div className="sheet" onClick={e=>e.stopPropagation()}>
      <div className="sheet-h"><h3 className="sheet-t">{titles[kind]}</h3><button className="x" onClick={onClose}>{I.x()}</button></div>
      <div className="sheet-b">
        {kind==='phase'&&<>
          <div className="fld"><label className="fld-l">탭 이름</label><input className="inp" value={f.name||''} onChange={e=>set('name',e.target.value)} /></div>
          <div className="fld"><label className="fld-l">탭 아래 설명</label><input className="inp" value={f.sub||''} onChange={e=>set('sub',e.target.value)} /></div>
          <div className="fld"><label className="fld-l">준비 상태</label>
            <select className="inp" value={f.ready?'y':'n'} onChange={e=>set('ready',e.target.value==='y')}>
              <option value="y">내용 보여주기</option><option value="n">준비중으로 두기</option></select></div>
          {!f.ready&&<>
            <div className="fld"><label className="fld-l">준비중 제목</label><input className="inp" value={f.title||''} onChange={e=>set('title',e.target.value)} /></div>
            <div className="fld"><label className="fld-l">준비중 설명</label><textarea className="ta" value={f.desc||''} onChange={e=>set('desc',e.target.value)} /></div>
          </>}
        </>}
        {kind==='step'&&<>
          <div className="fld"><label className="fld-l">왼쪽 메뉴 이름</label><input className="inp" value={f.name||''} onChange={e=>set('name',e.target.value)} /></div>
          <div className="fld"><label className="fld-l">작은 딱지</label><input className="inp" value={f.tag||''} onChange={e=>set('tag',e.target.value)} /></div>
          <div className="fld"><label className="fld-l">본문 제목</label><input className="inp" value={f.title||''} onChange={e=>set('title',e.target.value)} /></div>
          <div className="fld"><label className="fld-l">본문 도입 설명</label><textarea className="ta" value={f.subtitle||''} onChange={e=>set('subtitle',e.target.value)} /></div>
        </>}
        {kind==='ref'&&<>
          <div className="fld"><label className="fld-l">배너 이름</label><input className="inp" value={f.name||''} onChange={e=>set('name',e.target.value)} /></div>
          <div className="fld"><label className="fld-l">아래 작은 설명</label><input className="inp" value={f.dim||''} onChange={e=>set('dim',e.target.value)} /></div>
          <div className="fld"><label className="fld-l">안에 들어갈 내용</label>
            <textarea className="ta" style={{minHeight:260}} value={f.body||''} onChange={e=>set('body',e.target.value)} /></div>
        </>}
        <div style={{display:'flex',gap:7,justifyContent:'flex-end'}}>
          <button className="btn ghost" onClick={onClose}>그만두기</button>
          <button className="btn" onClick={()=>onSave(f)}>저장</button></div>
      </div></div></div>;
}

function PwModal({ onOk, onClose }){
  const [v,setV]=useState(''),[e,setE]=useState('');const r=useRef(null);
  useEffect(()=>{r.current?.focus()},[]);
  const go=(ev)=>{ev.preventDefault(); v.trim()===ADMIN_PW?onOk():(setE('비밀번호가 맞지 않습니다.'),setV(''),r.current?.focus())};
  return <div className="back" onClick={onClose}>
    <div className="sheet" style={{maxWidth:400}} onClick={ev=>ev.stopPropagation()}>
      <div className="sheet-h"><h3 className="sheet-t">관리자 확인</h3><button className="x" onClick={onClose}>{I.x()}</button></div>
      <form className="sheet-b" onSubmit={go}>
        <p style={{fontSize:'.86rem',color:'var(--ink2)'}}>비밀번호를 넣으면 매뉴얼 내용을 직접 고칠 수 있습니다.</p>
        <input ref={r} type="password" className="pw" placeholder="••••" maxLength={12} value={v} onChange={ev=>{setV(ev.target.value);setE('')}} />
        {e&&<p className="err">{e}</p>}
        <div style={{display:'flex',gap:7}}>
          <button type="button" className="btn ghost" style={{flex:1}} onClick={onClose}>그만두기</button>
          <button type="submit" className="btn" style={{flex:1}}>확인</button></div>
      </form></div></div>;
}

function RefModal({ r, onClose }){
  return <div className="back" onClick={onClose}>
    <div className="sheet" onClick={e=>e.stopPropagation()}>
      <div className="sheet-h">
        <div><h3 className="sheet-t">{r.name}</h3><p className="sheet-s">{r.dim}</p></div>
        <button className="x" onClick={onClose}>{I.x()}</button></div>
      <div className="sheet-b"><p className="ref-body">{r.body}</p></div>
    </div></div>;
}

/* ===================== 메인 ===================== */
function App(){
  const [design,setDesign]=useState(()=>store.get(KEY.D)||'a');
  const [font,setFont]=useState(()=>store.get(KEY.F)||'nanum');
  const [data,setData]=useState(()=>{try{const s=store.get(KEY.DATA);const p=s?JSON.parse(s):null;
    return (p&&p.phases&&p.phases[0]&&p.phases[0].steps)?p:clone(DEFAULT_DATA)}catch{return clone(DEFAULT_DATA)}});
  const [done,setDone]=useState(()=>{try{const s=store.get(KEY.DONE);return s?JSON.parse(s):[]}catch{return []}});
  const [admin,setAdmin]=useState(()=>store.get(KEY.ADMIN)==='true');

  const [phaseId,setPhaseId]=useState(0);
  const [active,setActive]=useState(null);
  const [editBlk,setEditBlk]=useState(null);
  const [nameEdit,setNameEdit]=useState(null);
  const [refOpen,setRefOpen]=useState(null);
  const [pwOpen,setPwOpen]=useState(false);
  const [toast,setToast]=useState(null);
  const [saving,setSaving]=useState(false);
  const secRefs=useRef({});

  const say=(m)=>{setToast(m);setTimeout(()=>setToast(null),2400)};

  useEffect(()=>{document.body.dataset.design=design;store.set(KEY.D,design)},[design]);
  useEffect(()=>{document.body.dataset.font=font;store.set(KEY.F,font)},[font]);
  useEffect(()=>{store.set(KEY.DATA,JSON.stringify(data))},[data]);
  useEffect(()=>{store.set(KEY.DONE,JSON.stringify(done))},[done]);
  useEffect(()=>{store.set(KEY.ADMIN,String(admin))},[admin]);
  useEffect(()=>{if(cloudReady)cloudLoad().then(d=>{if(d&&d.phases&&d.phases[0]&&d.phases[0].steps)setData(d)}).catch(()=>{})},[]);

  const phase=useMemo(()=>data.phases.find(p=>p.id===phaseId)||data.phases[0],[data,phaseId]);
  const steps=phase.steps||[];

  useEffect(()=>{
    secRefs.current={};
    setActive(steps[0]?steps[0].id:null);
  },[phaseId]);

  useEffect(()=>{
    if(!phase.ready||!steps.length) return;
    const io=new IntersectionObserver((es)=>{
      const vis=es.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);
      if(vis[0]) setActive(vis[0].target.dataset.sid);
    },{rootMargin:'-18% 0px -68% 0px',threshold:0});
    Object.values(secRefs.current).forEach(el=>el&&io.observe(el));
    return ()=>io.disconnect();
  },[phaseId,phase.ready,steps.length,data]);

  const goStep=(id)=>{const el=secRefs.current[id];if(el)el.scrollIntoView({behavior:'smooth',block:'start'})};

  const upd=(fn)=>setData(p=>({...p,phases:p.phases.map(ph=>ph.id!==phaseId?ph:fn(ph))}));
  const saveBlock=(sid,f)=>{upd(ph=>({...ph,steps:ph.steps.map(s=>s.id!==sid?s:{...s,blocks:s.blocks.map(b=>b.id===f.id?f:b)})}));setEditBlk(null);say('고쳤습니다.')};
  const addBlock=(sid)=>{const id='b'+Date.now();
    upd(ph=>({...ph,steps:ph.steps.map(s=>s.id!==sid?s:{...s,blocks:[...s.blocks,{id,kind:'text',text:'여기에 내용을 적습니다.'}]})}));
    setEditBlk({sid,bid:id})};
  const delBlock=(sid,bid)=>{if(confirm('이 덩어리를 지울까요?'))upd(ph=>({...ph,steps:ph.steps.map(s=>s.id!==sid?s:{...s,blocks:s.blocks.filter(b=>b.id!==bid)})}))};
  const moveBlock=(sid,bid,d)=>upd(ph=>({...ph,steps:ph.steps.map(s=>{
    if(s.id!==sid)return s;const a=[...s.blocks];const i=a.findIndex(b=>b.id===bid);const j=i+d;
    if(j<0||j>=a.length)return s;[a[i],a[j]]=[a[j],a[i]];return{...s,blocks:a}})}));

  const saveName=(f)=>{
    const k=nameEdit.kind;
    if(k==='phase') setData(p=>({...p,phases:p.phases.map(x=>x.id===f.id?f:x)}));
    if(k==='step')  upd(ph=>({...ph,steps:ph.steps.map(x=>x.id===f.id?{...x,...f}:x)}));
    if(k==='ref')   setData(p=>({...p,refs:p.refs.map(x=>x.id===f.id?f:x)}));
    setNameEdit(null);say('고쳤습니다.');
  };

  const push=async()=>{if(!cloudReady){say('파이어베이스 설정이 없습니다.');return}setSaving(true);
    try{await cloudSave(data);say('모두에게 보이도록 올렸습니다.')}catch{say('올리지 못했습니다.')}setSaving(false)};
  const pull=async()=>{if(!cloudReady){say('파이어베이스 설정이 없습니다.');return}
    try{const d=await cloudLoad();d?(setData(d),say('가져왔습니다.')):say('올려둔 내용이 없습니다.')}catch{say('가져오지 못했습니다.')}};
  const reset=()=>{if(confirm('처음 내용으로 되돌릴까요?')){setData(clone(DEFAULT_DATA));say('되돌렸습니다.')}};

  return <>
    <header className="head"><div className="wrap">
      <div className="head-in">
        <div>
          <span className="kicker">{I.spark({s:13})} 선생님을 위한 매뉴얼</span>
          <h1 className="h1">바이브코딩으로 웹앱 만들기</h1>
          <p className="sub">코딩을 한 번도 안 해보셔도 괜찮습니다. 위에서부터 천천히 내려가며 하나씩 따라 해보세요.</p>
        </div>
        <div className="tools">
          <div className="tool-row"><span className="tool-cap">화면</span>
            {DESIGNS.map(d=><button key={d.k} className={`tool-btn ${design===d.k?'on':''}`} onClick={()=>setDesign(d.k)}>{d.n}</button>)}</div>
          <div className="tool-row"><span className="tool-cap">글꼴</span>
            {FONTS.map(f=><button key={f.k} className={`tool-btn ${font===f.k?'on':''}`} data-f={f.k} onClick={()=>setFont(f.k)}>{f.n}</button>)}</div>
          <div className="tool-row">
            <span className={`cloud-dot ${cloudReady?'on':''}`}><i></i>{cloudReady?'클라우드 연결됨':'내 브라우저에만 저장'}</span>
            {admin?<button className="tool-btn on" onClick={()=>{setAdmin(false);setEditBlk(null);say('편집을 끝냈습니다.')}}>{I.unlock({s:12})} 편집 끝내기</button>
                  :<button className="tool-btn" onClick={()=>setPwOpen(true)}>{I.lock({s:12})} 관리자</button>}
          </div>
        </div>
      </div>

      <nav className="tabs">
        {data.phases.map(p=>(
          <button key={p.id} className={`tab ${phaseId===p.id?'on':''}`}
            onClick={()=>{setPhaseId(p.id);setEditBlk(null);window.scrollTo({top:0,behavior:'smooth'})}}
            onDoubleClick={()=>admin&&setNameEdit({kind:'phase',target:p})}>
            <span className="tab-n">{p.name}{!p.ready&&<span className="tab-badge">준비중</span>}</span>
            <span className="tab-s">{p.sub}</span></button>))}
      </nav>
    </div></header>

    <div className="wrap"><div className="grid">
      <aside className="side"><div className="side-in">
        {phase.ready&&<>
          <div className="side-h">{phase.name} 차례대로 보기</div>
          <div className="side-list">
            {steps.map((s,i)=>(
              <button key={s.id} className={`side-i ${active===s.id?'on':''}`} onClick={()=>goStep(s.id)}>
                <span className="side-n">{i+1}</span><span className="side-txt">{s.name}</span>
                {admin&&<span className="side-pen" onClick={e=>{e.stopPropagation();setNameEdit({kind:'step',target:s})}}>{I.pen({s:12})}</span>}
              </button>))}
          </div>
          <div className="sep"></div>
        </>}

        <div className="bnr-zone">
          <div className="zone-h">언제든 펴보세요</div>
          {data.refs.map((r,i)=> i===0?(
            <button key={r.id} className="bnr-big" onClick={()=>setRefOpen(r)}
              onDoubleClick={()=>admin&&setNameEdit({kind:'ref',target:r})}>
              <span className="ic">{r.icon}</span><span className="t">{r.name}</span><span className="d">{r.dim}</span></button>
          ):(
            <button key={r.id} className="bnr-row" onClick={()=>setRefOpen(r)}
              onDoubleClick={()=>admin&&setNameEdit({kind:'ref',target:r})}>
              <span className="sq" style={{background:REF_COLORS[r.color]}}>{r.icon}</span>
              <span>{r.name}</span><span className="ar">›</span></button>
          ))}
          {admin&&<div className="zone-h" style={{paddingTop:6}}>배너는 두 번 누르면 고칩니다</div>}
        </div>
      </div></aside>

      <main className="main">
        {admin&&<div className="admin-bar">
          <div className="admin-bar-l">{I.pen({s:15})}<span>고치는 중입니다.</span></div>
          <div className="admin-bar-r">
            <button className="btn sm" onClick={push} disabled={saving}>{saving?'올리는 중…':'클라우드에 올리기'}</button>
            <button className="btn ghost sm" onClick={pull}>가져오기</button>
            <button className="btn ghost sm" onClick={reset}>처음 내용으로</button></div>
        </div>}

        {!phase.ready?(
          <div className="soon"><div className="soon-ic">⏳</div>
            <span className="tag">{phase.name} · 준비중</span>
            <h2 className="soon-h">{phase.title||phase.sub}</h2>
            <p className="soon-p">{phase.desc||'아직 준비 중입니다.'}</p></div>
        ):steps.map((s,i)=>(
          <section className="sec" key={s.id} data-sid={s.id} ref={el=>secRefs.current[s.id]=el}>
            <div className="sec-top"><span className="sec-num">{i+1}</span><span className="sec-tag">{s.tag}</span></div>
            <h2 className="sec-h">{s.title}</h2>
            <p className="sec-sub">{s.subtitle}</p>

            {s.blocks.map(b=>(
              <div key={b.id}>
                {admin&&<div className="blk-tools">
                  <button className="btn ghost sm" onClick={()=>moveBlock(s.id,b.id,-1)}>{I.up()}</button>
                  <button className="btn ghost sm" onClick={()=>moveBlock(s.id,b.id,1)}>{I.down()}</button>
                  <button className="btn ghost sm" onClick={()=>setEditBlk({sid:s.id,bid:b.id})}>{I.pen({s:12})}<span>고치기</span></button>
                  <button className="btn danger sm" onClick={()=>delBlock(s.id,b.id)}>{I.trash({s:12})}</button></div>}
                {editBlk&&editBlk.sid===s.id&&editBlk.bid===b.id
                  ?<BlockEdit b={b} refs={data.refs} onSave={f=>saveBlock(s.id,f)} onCancel={()=>setEditBlk(null)} />
                  :<Block b={b} refs={data.refs} onRef={setRefOpen} />}
              </div>))}

            {admin&&<button className="btn ghost sm" onClick={()=>addBlock(s.id)} style={{marginBottom:14}}>
              {I.plus({s:13})}<span>덩어리 더하기</span></button>}

            <div className="sec-foot">
              <button className={`btn ${done.includes(s.id)?'ok':'ghost'}`}
                onClick={()=>setDone(p=>p.includes(s.id)?p.filter(x=>x!==s.id):(say('잘하셨습니다.'),[...p,s.id]))}>
                {I.check({s:15,w:3})}<span>{done.includes(s.id)?'여기까지 봤어요':'다 봤어요'}</span></button>
            </div>
          </section>
        ))}
      </main>
    </div></div>

    <footer className="foot"><div className="wrap"><p>{data.footNote}</p></div></footer>

    {toast&&<div className="toast">{I.spark({s:15})}<span>{toast}</span></div>}
    {pwOpen&&<PwModal onOk={()=>{setAdmin(true);setPwOpen(false);say('이제 고칠 수 있습니다.')}} onClose={()=>setPwOpen(false)} />}
    {nameEdit&&<NameEdit kind={nameEdit.kind} target={nameEdit.target} onSave={saveName} onClose={()=>setNameEdit(null)} />}
    {refOpen&&<RefModal r={refOpen} onClose={()=>setRefOpen(null)} />}
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
