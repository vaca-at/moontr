<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>바이브코딩으로 웹앱 만들기 | 선생님을 위한 실전 매뉴얼</title>
<meta name="description" content="코딩을 처음 해보는 선생님도 단계별로 따라 하며 교실에서 쓸 웹앱을 만드는 매뉴얼" />

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
/* ==========================================================
   글꼴 4종
   ========================================================== */
@font-face{
  font-family:'OwnglyphYuntaeng';
  src:url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2608211801@font-160/font-160/%EC%98%A8%EA%B8%80%EC%9E%8E%20%EC%9C%A4%ED%83%B1%EC%B2%B4.woff2') format('woff2');
  font-weight:400;font-display:swap;
}
body[data-font="nanum"]{font-family:'NanumSquare',sans-serif}
body[data-font="pretendard"]{font-family:'Pretendard',sans-serif}
body[data-font="gowun"]{font-family:'Gowun Dodum',sans-serif}
body[data-font="yuntaeng"]{font-family:'OwnglyphYuntaeng',sans-serif;letter-spacing:.01em}
body[data-font="yuntaeng"] .h1,
body[data-font="yuntaeng"] .card-h,
body[data-font="yuntaeng"] .intro-h{letter-spacing:0}

/* ==========================================================
   디자인 A · 토스형 소프트 카드
   ========================================================== */
body[data-design="a"]{
  --bg:#f7f8fa; --panel:#fff; --panel2:#f2f4f6;
  --ink:#191f28; --ink2:#4e5968; --ink3:#8b95a1;
  --line:#e5e8eb; --line2:#d1d6db;
  --accent:#3182f6; --accentInk:#fff; --accentSoft:#e8f3ff;
  --ok:#10b981;
  --rCard:18px; --rBtn:999px; --rSm:10px;
  --sideBg:#fff; --sideInk:#4e5968; --sideActBg:#e8f3ff; --sideActInk:#3182f6; --sideLine:#e5e8eb;
  --shadow:0 1px 3px rgba(0,0,0,.05);
}
/* 디자인 B · 공책형 */
body[data-design="b"]{
  --bg:#fdfcf8; --panel:#fff; --panel2:#f0ece0;
  --ink:#2f3a4a; --ink2:#5a6270; --ink3:#9c9484;
  --line:#d9d2c2; --line2:#2f3a4a;
  --accent:#d64545; --accentInk:#fff; --accentSoft:#fbe9e9;
  --ok:#3f8f5f;
  --rCard:10px; --rBtn:8px; --rSm:6px;
  --sideBg:#f0ece0; --sideInk:#6b6355; --sideActBg:#fff; --sideActInk:#2f3a4a; --sideLine:#d9d2c2;
  --shadow:none;
}
/* 디자인 C · 칠판형 */
body[data-design="c"]{
  --bg:#22362d; --panel:#2a4136; --panel2:#1b2b24;
  --ink:#f3f7f4; --ink2:#b7ccc0; --ink3:#8fa99b;
  --line:#3d5a4c; --line2:#5a7a68;
  --accent:#f2c94c; --accentInk:#1b2b24; --accentSoft:#354d41;
  --ok:#7bd389;
  --rCard:12px; --rBtn:8px; --rSm:8px;
  --sideBg:#1b2b24; --sideInk:#c3d6cb; --sideActBg:#354d41; --sideActInk:#f2c94c; --sideLine:#3d5a4c;
  --shadow:none;
}
/* 디자인 D · 관리자 대시보드형 */
body[data-design="d"]{
  --bg:#f1f3f5; --panel:#fff; --panel2:#f8f9fa;
  --ink:#1f2937; --ink2:#4b5563; --ink3:#9ca3af;
  --line:#dee2e6; --line2:#c6ccd3;
  --accent:#0f766e; --accentInk:#fff; --accentSoft:#e3f1ef;
  --ok:#0f766e;
  --rCard:6px; --rBtn:5px; --rSm:5px;
  --sideBg:#1f2937; --sideInk:#c3cbd6; --sideActBg:#0f766e; --sideActInk:#fff; --sideLine:#2c3949;
  --shadow:0 1px 2px rgba(0,0,0,.04);
}

/* ==========================================================
   기본
   ========================================================== */
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased;transition:background-color .2s,color .2s}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:1240px;margin:0 auto;padding:0 20px}

/* ========== 헤더 ========== */
.head{background:var(--panel);border-bottom:1px solid var(--line)}
.head-in{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;padding:18px 0 14px;flex-wrap:wrap}
.kicker{display:inline-flex;align-items:center;gap:6px;font-size:.73rem;font-weight:800;color:var(--accent);background:var(--accentSoft);padding:4px 10px;border-radius:999px;margin-bottom:8px}
.h1{font-size:1.6rem;font-weight:800;letter-spacing:-.03em;line-height:1.3}
.sub{font-size:.9rem;color:var(--ink2);margin-top:5px;max-width:56ch}

.tools{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.tool-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.tool-cap{font-size:.72rem;font-weight:800;color:var(--ink3);margin-right:2px}
.tool-btn{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:800;color:var(--ink2);background:var(--panel2);padding:6px 11px;border-radius:var(--rBtn);border:1.5px solid transparent;transition:.15s;white-space:nowrap}
.tool-btn:hover{border-color:var(--line2)}
.tool-btn.on{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
.tool-btn[data-f="nanum"]{font-family:'NanumSquare',sans-serif}
.tool-btn[data-f="pretendard"]{font-family:'Pretendard',sans-serif}
.tool-btn[data-f="gowun"]{font-family:'Gowun Dodum',sans-serif}
.tool-btn[data-f="yuntaeng"]{font-family:'OwnglyphYuntaeng',sans-serif;font-size:.9rem}

/* ========== 가로 탭 ========== */
.tabs{display:flex;gap:6px;padding:0 0 14px;overflow-x:auto}
body[data-design="b"] .tabs{align-items:flex-end;gap:4px;padding-bottom:0}
body[data-design="c"] .tabs{padding-top:4px}
body[data-design="d"] .tabs{gap:0;padding-bottom:0}

.tab{flex:1 0 auto;min-width:152px;text-align:left;padding:11px 14px;transition:.15s}
.tab-n{display:block;font-size:.88rem;font-weight:800}
.tab-s{display:block;font-size:.72rem;margin-top:1px}
.tab-badge{font-size:.62rem;font-weight:800;padding:1px 6px;border-radius:999px;margin-left:5px;vertical-align:middle;background:var(--panel);color:var(--ink3);border:1px solid var(--line)}
.tab.on .tab-badge{background:rgba(255,255,255,.25);color:inherit;border-color:transparent}

body[data-design="a"] .tab{border-radius:14px;background:var(--panel2)}
body[data-design="a"] .tab-n{color:var(--ink2)} body[data-design="a"] .tab-s{color:var(--ink3)}
body[data-design="a"] .tab.on{background:var(--accent)}
body[data-design="a"] .tab.on .tab-n,body[data-design="a"] .tab.on .tab-s{color:var(--accentInk)}

body[data-design="b"] .tab{border-radius:12px 12px 0 0;background:var(--panel2);border:1.5px solid var(--line);border-bottom:none;padding-bottom:12px}
body[data-design="b"] .tab-n{color:var(--ink3)} body[data-design="b"] .tab-s{color:var(--ink3)}
body[data-design="b"] .tab.on{background:var(--panel);border-color:var(--line2);border-width:2px}
body[data-design="b"] .tab.on .tab-n{color:var(--ink)} body[data-design="b"] .tab.on .tab-s{color:var(--accent)}

body[data-design="c"] .tab{border:1.5px dashed var(--line2);border-radius:10px}
body[data-design="c"] .tab-n{color:var(--ink)} body[data-design="c"] .tab-s{color:var(--ink3)}
body[data-design="c"] .tab.on{background:var(--accent);border-style:solid;border-color:var(--accent)}
body[data-design="c"] .tab.on .tab-n{color:var(--accentInk)} body[data-design="c"] .tab.on .tab-s{color:#6b5a1c}

body[data-design="d"] .tab{border-bottom:2.5px solid transparent;padding:12px 20px;flex:0 0 auto;min-width:0}
body[data-design="d"] .tab-n{color:var(--ink2)} body[data-design="d"] .tab-s{color:var(--ink3)}
body[data-design="d"] .tab.on{border-bottom-color:var(--accent)}
body[data-design="d"] .tab.on .tab-n{color:var(--accent)}

/* ========== 본문 레이아웃 ========== */
.body-grid{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:70vh}
body[data-design="b"] .body-grid{border-top:2px solid var(--line2)}

.side{background:var(--sideBg);border-right:1px solid var(--sideLine);padding:18px 12px 40px}
.side-h{font-size:.7rem;font-weight:800;color:var(--ink3);padding:0 8px 9px}
body[data-design="d"] .side-h{color:#7a8799}
.side-i{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 10px;font-size:.82rem;font-weight:700;color:var(--sideInk);border-radius:var(--rSm);margin-bottom:3px;transition:.15s}
.side-i:hover{background:var(--accentSoft)}
body[data-design="d"] .side-i:hover{background:#2c3949}
.side-i.on{background:var(--sideActBg);color:var(--sideActInk)}
.side-n{flex-shrink:0;font-size:.67rem;font-weight:800;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;border-radius:4px;background:var(--panel2);color:var(--ink3)}
body[data-design="c"] .side-n,body[data-design="d"] .side-n{background:rgba(255,255,255,.12);color:inherit}
.side-i.on .side-n{background:var(--accent);color:var(--accentInk)}
.side-n.done{background:var(--ok);color:#fff}
.side-txt{flex:1;min-width:0}
.side-pen{opacity:.5;flex-shrink:0;display:flex}
.side-pen:hover{opacity:1}

.side-sep{height:1px;background:var(--sideLine);margin:14px 8px}
.prog-wrap{padding:0 10px}
.prog-top{display:flex;justify-content:space-between;font-size:.72rem;font-weight:800;color:var(--ink3);margin-bottom:6px}
body[data-design="d"] .prog-top{color:#8b97a8}
.prog-track{height:6px;border-radius:999px;background:var(--panel2);overflow:hidden}
body[data-design="c"] .prog-track,body[data-design="d"] .prog-track{background:rgba(255,255,255,.14)}
.prog-fill{height:100%;background:var(--accent);border-radius:999px;transition:width .35s}

.main{padding:22px 24px 60px;min-width:0}
body[data-design="b"] .main{
  background:
    linear-gradient(to right,transparent 40px,#f0b8b8 40px,#f0b8b8 41px,transparent 41px),
    repeating-linear-gradient(var(--bg) 0 29px,#e3e9f1 29px 30px);
  padding-left:56px
}

/* ========== 단계 소개 ========== */
.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--rCard);padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
body[data-design="b"] .intro{background:transparent;border:none;border-bottom:2px solid var(--line2);border-radius:0;padding:0 0 12px}
.intro-tags{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.tag{display:inline-block;font-size:.71rem;font-weight:800;padding:3px 10px;border-radius:var(--rBtn)}
.tag.solid{background:var(--accent);color:var(--accentInk)}
.tag.soft{background:var(--panel2);color:var(--ink2)}
.intro-h{font-size:1.22rem;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.intro-p{font-size:.87rem;color:var(--ink2);max-width:64ch}

/* ========== 카드 ========== */
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--rCard);box-shadow:var(--shadow);overflow:hidden}
body[data-design="b"] .card{background:transparent;border:none;box-shadow:none}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px}
body[data-design="b"] .card-top{padding:8px 0}
.badge{display:inline-block;font-size:.7rem;font-weight:800;padding:3px 10px;border-radius:var(--rBtn);background:var(--accentSoft);color:var(--accent);margin-bottom:8px}
body[data-design="c"] .badge{background:var(--accent);color:var(--accentInk)}
.card-h{font-size:1.06rem;font-weight:800;letter-spacing:-.02em;margin-bottom:5px}
.card-s{font-size:.86rem;color:var(--ink2);max-width:70ch}

.card-body{padding:18px 20px 20px;border-top:1px solid var(--line)}
body[data-design="b"] .card-body{padding:12px 0 20px;border-top:1px dashed var(--line)}

.tip{background:var(--panel2);border-radius:var(--rSm);padding:13px 15px;margin-bottom:14px}
body[data-design="b"] .tip{background:var(--accentSoft);border-left:3px solid var(--accent);border-radius:0}
.tip-h{display:flex;align-items:center;gap:6px;font-size:.79rem;font-weight:800;color:var(--accent);margin-bottom:5px}
.tip-p{font-size:.86rem;color:var(--ink2)}

.items{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.item{display:flex;gap:10px;align-items:flex-start}
.dot{flex-shrink:0;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:9px}
.item-t{font-size:.86rem;color:var(--ink2)}

.prompt{border:1px solid var(--line);border-radius:var(--rSm);overflow:hidden;background:var(--panel2)}
body[data-design="b"] .prompt{background:var(--panel);border:1.5px solid var(--line2)}
.prompt-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.prompt-l{font-size:.75rem;font-weight:800;color:var(--ink2)}
.copy{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:800;background:var(--panel);border:1px solid var(--line);color:var(--ink2);padding:5px 10px;border-radius:var(--rSm)}
.copy.done{background:var(--ok);border-color:var(--ok);color:#fff}
.prompt-c{padding:13px 14px;font-size:.84rem;line-height:1.75;color:var(--ink2);white-space:pre-wrap;word-break:break-word}

.card-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}

/* ========== 버튼 ========== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:.82rem;font-weight:800;padding:9px 16px;border-radius:var(--rBtn);background:var(--accent);color:var(--accentInk);transition:.15s}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--panel);border:1.5px solid var(--line);color:var(--ink2)}
.btn.ghost:hover{border-color:var(--line2);filter:none}
.btn.ok{background:var(--ok);color:#fff}
.btn.sm{font-size:.76rem;padding:6px 12px}
.btn.danger{background:transparent;border:1.5px solid #e06666;color:#e06666}
.btn[disabled]{opacity:.55;cursor:default}

/* ========== 준비중 ========== */
.soon{background:var(--panel);border:1.5px dashed var(--line2);border-radius:var(--rCard);padding:56px 26px;text-align:center}
.soon-ic{width:56px;height:56px;margin:0 auto 16px;border-radius:50%;background:var(--panel2);color:var(--ink3);display:flex;align-items:center;justify-content:center}
.soon-h{font-size:1.3rem;font-weight:800;margin:10px 0 7px;letter-spacing:-.02em}
.soon-p{font-size:.9rem;color:var(--ink2);max-width:46ch;margin:0 auto 20px}
.soon-box{display:inline-block;text-align:left;background:var(--panel2);border-radius:var(--rSm);padding:15px 19px;max-width:440px}
.soon-box-h{font-size:.78rem;font-weight:800;color:var(--ink2);margin-bottom:7px}
.soon-box ul{list-style:none;display:flex;flex-direction:column;gap:5px}
.soon-box li{font-size:.84rem;color:var(--ink2);padding-left:14px;position:relative}
.soon-box li::before{content:'';position:absolute;left:2px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--line2)}

/* ========== 관리자 ========== */
.admin-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--accentSoft);border-radius:var(--rSm);padding:11px 15px;margin-bottom:14px}
.admin-bar-l{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--accent);font-weight:700}
.admin-bar-r{display:flex;gap:6px;flex-wrap:wrap}

.edit-form{display:flex;flex-direction:column;gap:10px;background:var(--panel2);border-radius:var(--rSm);padding:16px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld-l{font-size:.74rem;font-weight:800;color:var(--ink3)}
.inp,.ta{width:100%;background:var(--panel);border:1.5px solid var(--line);border-radius:var(--rSm);padding:9px 11px;font-size:.85rem;color:var(--ink);resize:vertical}
.inp:focus,.ta:focus{border-color:var(--accent);outline:none}
.ta{min-height:66px;line-height:1.6}
.item-edit-row{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px}
.item-edit-row .ta{min-height:46px}

/* ========== 모달 ========== */
.back{position:fixed;inset:0;background:rgba(12,18,28,.5);display:flex;align-items:center;justify-content:center;padding:18px;z-index:90}
.sheet{background:var(--panel);border-radius:var(--rCard);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.sheet-t{font-size:1.05rem;font-weight:800}
.sheet-b{padding:18px 20px 20px;display:flex;flex-direction:column;gap:12px}
.x{width:30px;height:30px;border-radius:50%;color:var(--ink3);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.x:hover{background:var(--panel2)}
.pw{width:100%;text-align:center;font-size:1.5rem;letter-spacing:.4em;padding:12px;background:var(--panel2);border:1.5px solid var(--line);border-radius:var(--rSm);color:var(--ink)}
.err{font-size:.8rem;color:#e05555;font-weight:700;text-align:center}

/* ========== 토스트 ========== */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);font-size:.85rem;font-weight:700;padding:11px 20px;border-radius:999px;box-shadow:0 6px 22px rgba(0,0,0,.25);z-index:95}

.cloud-dot{display:inline-flex;align-items:center;gap:5px;font-size:.71rem;font-weight:800;color:var(--ink3)}
.cloud-dot i{width:7px;height:7px;border-radius:50%;background:var(--ink3);display:block}
.cloud-dot.on i{background:var(--ok)}

@media (max-width:900px){
  .body-grid{grid-template-columns:1fr}
  .side{border-right:none;border-bottom:1px solid var(--sideLine);padding-bottom:14px}
  .side-list{display:flex;flex-wrap:wrap;gap:4px}
  .side-i{width:auto;margin-bottom:0}
  .side-sep,.prog-wrap{display:none}
  body[data-design="b"] .main{padding-left:20px;background:none}
  .tools{align-items:flex-start}
  .head-in{flex-direction:column}
}
@media (max-width:560px){
  .wrap{padding:0 14px}
  .main{padding:18px 14px 50px}
  .h1{font-size:1.3rem}
  .tab{min-width:132px}
}
</style>
</head>

/* ========== 프롬프트 복사 ========== */
function Prompt({ text }){
  const [done,setDone]=useState(false);
  const mark=()=>{ setDone(true); setTimeout(()=>setDone(false),1800); };
  const copy=()=>{
    const fb=()=>{ const t=document.createElement('textarea'); t.value=text; t.style.position='fixed'; t.style.opacity='0';
      document.body.appendChild(t); t.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch{} document.body.removeChild(t); return ok; };
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(mark).catch(()=>{ fb()?mark():alert('복사가 안 됩니다. 아래 글을 직접 끌어서 복사해주세요.'); });
    } else { fb()?mark():alert('복사가 안 됩니다. 아래 글을 직접 끌어서 복사해주세요.'); }
  };
  return (
    <div className="prompt">
      <div className="prompt-h">
        <span className="prompt-l">그대로 복사해서 쓰는 문장</span>
        <button className={`copy ${done?'done':''}`} onClick={copy}>
          {done ? <>{I.check({s:13,w:3})}<span>복사했어요</span></> : <>{I.copy({s:13})}<span>복사</span></>}
        </button>
      </div>
      <div className="prompt-c">{text}</div>
    </div>
  );
}

          <div className="item-edit-row" key={i}>
            <textarea className="ta" value={it} onChange={e=>setItem(i,e.target.value)} />
            <button className="btn ghost sm" onClick={()=>delItem(i)} title="이 줄 지우기">{I.trash({s:13})}</button>
          </div>
        ))}
        <button className="btn ghost sm" onClick={addItem} style={{alignSelf:'flex-start'}}>{I.plus({s:13})}<span>줄 더하기</span></button>
      </div>
      <div className="fld"><label className="fld-l">복사용 프롬프트 · 비우면 안 보입니다</label>
        <textarea className="ta" style={{minHeight:110}} value={f.prompt||''} onChange={e=>set('prompt',e.target.value)} /></div>
      <div style={{display:'flex',gap:7,justifyContent:'flex-end'}}>
        <button className="btn ghost" onClick={onCancel}>그만두기</button>
        <button className="btn" onClick={()=>onSave(f)}>이 카드 저장</button>
      </div>
    </div>
  );
}

/* ========== 탭·메뉴 이름 편집 ========== */
function NameEdit({ kind, target, onSave, onClose }){
  const [f,setF]=useState(clone(target));
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const setPlan=(i,v)=>setF(p=>{ const a=[...(p.plan||[])]; a[i]=v; return {...p,plan:a}; });
  const addPlan=()=>setF(p=>({...p,plan:[...(p.plan||[]),'']}));

  return (
    <div className="back" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="sheet-h">
          <h3 className="sheet-t">{kind==='phase'?'위쪽 탭 고치기':'왼쪽 메뉴 고치기'}</h3>
          <button className="x" onClick={onClose}>{I.x()}</button>
        </div>
        <div className="sheet-b">
          {kind==='phase' ? (
            <>
              <div className="fld"><label className="fld-l">탭 이름</label>
                <input className="inp" value={f.name||''} onChange={e=>set('name',e.target.value)} /></div>
              <div className="fld"><label className="fld-l">탭 아래 작은 설명</label>
                <input className="inp" value={f.sub||''} onChange={e=>set('sub',e.target.value)} /></div>
              <div className="fld"><label className="fld-l">준비 상태</label>
                <select className="inp" value={f.ready?'y':'n'} onChange={e=>set('ready',e.target.value==='y')}>
                  <option value="y">내용 보여주기</option>
                  <option value="n">준비중으로 두기</option>
                </select></div>
              {!f.ready && (
                <>
                  <div className="fld"><label className="fld-l">준비중 화면 제목</label>
                    <input className="inp" value={f.title||''} onChange={e=>set('title',e.target.value)} /></div>
                  <div className="fld"><label className="fld-l">준비중 화면 설명</label>
                    <textarea className="ta" value={f.desc||''} onChange={e=>set('desc',e.target.value)} /></div>
                  <div className="fld"><label className="fld-l">이 단계에서 다룰 내용</label>
                    {(f.plan||[]).map((p,i)=>(
                      <input key={i} className="inp" style={{marginBottom:6}} value={p} onChange={e=>setPlan(i,e.target.value)} />
                    ))}
                    <button className="btn ghost sm" onClick={addPlan} style={{alignSelf:'flex-start'}}>{I.plus({s:13})}<span>줄 더하기</span></button>
                  </div>
                </>
              )}
            </>
          ) : (
            <>
              <div className="fld"><label className="fld-l">메뉴에 보일 이름</label>
                <input className="inp" value={f.name||''} onChange={e=>set('name',e.target.value)} /></div>
              <div className="fld"><label className="fld-l">작은 딱지</label>
                <input className="inp" value={f.tag||''} onChange={e=>set('tag',e.target.value)} /></div>
              <div className="fld"><label className="fld-l">본문 제목</label>
                <input className="inp" value={f.title||''} onChange={e=>set('title',e.target.value)} /></div>
              <div className="fld"><label className="fld-l">본문 설명</label>
                <textarea className="ta" value={f.subtitle||''} onChange={e=>set('subtitle',e.target.value)} /></div>
            </>
          )}
          <div style={{display:'flex',gap:7,justifyContent:'flex-end'}}>
            <button className="btn ghost" onClick={onClose}>그만두기</button>
            <button className="btn" onClick={()=>onSave(f)}>저장</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ========== 비밀번호 ========== */
function PwModal({ onOk, onClose }){
  const [v,setV]=useState(''); const [e,setE]=useState(''); const r=useRef(null);
  useEffect(()=>{ r.current?.focus(); },[]);
  const go=(ev)=>{ ev.preventDefault();
    if(v.trim()===ADMIN_PW) onOk();
    else { setE('비밀번호가 맞지 않습니다. 다시 입력해주세요.'); setV(''); r.current?.focus(); } };
  return (
    <div className="back" onClick={onClose}>
      <div className="sheet" style={{maxWidth:400}} onClick={ev=>ev.stopPropagation()}>
        <div className="sheet-h"><h3 className="sheet-t">관리자 확인</h3><button className="x" onClick={onClose}>{I.x()}</button></div>
        <form className="sheet-b" onSubmit={go}>
          <p style={{fontSize:'.86rem',color:'var(--ink2)'}}>비밀번호를 넣으면 매뉴얼 내용을 직접 고칠 수 있습니다.</p>
          <input ref={r} type="password" className="pw" placeholder="••••" maxLength={12} value={v} onChange={ev=>{ setV(ev.target.value); setE(''); }} />
          {e && <p className="err">{e}</p>}
          <div style={{display:'flex',gap:7}}>
            <button type="button" className="btn ghost" style={{flex:1}} onClick={onClose}>그만두기</button>
            <button type="submit" className="btn" style={{flex:1}}>확인</button>
          </div>
        </form>
      </div>
    </div>
  );
}

/* ========== 메인 ========== */
function App(){
  const [design,setDesign]=useState(()=>store.get(KEY.D)||'a');
  const [font,setFont]=useState(()=>store.get(KEY.F)||'nanum');
  const [data,setData]=useState(()=>{ try{ const s=store.get(KEY.DATA); return s?JSON.parse(s):clone(DEFAULT_DATA); }catch{ return clone(DEFAULT_DATA); } });
  const [done,setDone]=useState(()=>{ try{ const s=store.get(KEY.DONE); return s?JSON.parse(s):[]; }catch{ return []; } });
  const [admin,setAdmin]=useState(()=>store.get(KEY.ADMIN)==='true');

  const [phaseId,setPhaseId]=useState(0);
  const [stepId,setStepId]=useState('s1');
  const [editCardId,setEditCardId]=useState(null);
  const [nameEdit,setNameEdit]=useState(null);
  const [pwOpen,setPwOpen]=useState(false);
  const [toast,setToast]=useState(null);
  const [saving,setSaving]=useState(false);

  const say=(m)=>{ setToast(m); setTimeout(()=>setToast(null),2400); };

  useEffect(()=>{ document.body.dataset.design=design; store.set(KEY.D,design); },[design]);
  useEffect(()=>{ document.body.dataset.font=font; store.set(KEY.F,font); },[font]);
  useEffect(()=>{ store.set(KEY.DATA,JSON.stringify(data)); },[data]);
  useEffect(()=>{ store.set(KEY.DONE,JSON.stringify(done)); },[done]);
  useEffect(()=>{ store.set(KEY.ADMIN,String(admin)); },[admin]);

  useEffect(()=>{ if(!cloudReady) return; cloudLoad().then(d=>{ if(d) setData(d); }).catch(()=>{}); },[]);

  const phase = useMemo(()=>data.phases.find(p=>p.id===phaseId)||data.phases[0],[data,phaseId]);
  const step  = useMemo(()=>data.steps.find(s=>s.id===stepId)||data.steps[0],[data,stepId]);
  const cards = useMemo(()=>data.cards.filter(c=>c.stepId===stepId),[data,stepId]);
  const stepIdx = useMemo(()=>data.steps.findIndex(s=>s.id===stepId),[data,stepId]);
  const progress = useMemo(()=>{
    const total=data.steps.length||1;
    return Math.round(done.filter(d=>data.steps.some(s=>s.id===d)).length/total*100);
  },[done,data]);

  const toggleDone=(id)=>setDone(p=>{
    if(p.includes(id)) return p.filter(x=>x!==id);
    say('잘하셨습니다.'); return [...p,id];
  });

  const saveCard=(f)=>{ setData(p=>({...p,cards:p.cards.map(c=>c.id===f.id?f:c)})); setEditCardId(null); say('고친 내용을 담아뒀습니다.'); };
  const addCard=()=>{ const id='c'+Date.now();
    setData(p=>({...p,cards:[...p.cards,{id,stepId,badge:'새 딱지',title:'새 카드 제목',summary:'',tip:'',items:[],prompt:''}]}));
    setEditCardId(id); };
  const delCard=(id)=>{ if(!confirm('이 카드를 지울까요?')) return; setData(p=>({...p,cards:p.cards.filter(c=>c.id!==id)})); };

  const saveName=(f)=>{
    if(nameEdit.kind==='phase') setData(p=>({...p,phases:p.phases.map(x=>x.id===f.id?f:x)}));
    else setData(p=>({...p,steps:p.steps.map(x=>x.id===f.id?f:x)}));
    setNameEdit(null); say('이름을 고쳤습니다.');
  };

  const pushCloud=async()=>{
    if(!cloudReady){ say('파이어베이스 설정을 아직 안 넣으셨습니다.'); return; }
    setSaving(true);
    try{ await cloudSave(data); say('모두에게 보이도록 올렸습니다.'); }
    catch{ say('올리지 못했습니다. 인터넷과 설정을 확인해주세요.'); }
    setSaving(false);
  };
  const pullCloud=async()=>{
    if(!cloudReady){ say('파이어베이스 설정을 아직 안 넣으셨습니다.'); return; }
    try{ const d=await cloudLoad(); if(d){ setData(d); say('올려둔 내용을 가져왔습니다.'); } else say('아직 올려둔 내용이 없습니다.'); }
    catch{ say('가져오지 못했습니다.'); }
  };
  const resetAll=()=>{ if(!confirm('처음 내용으로 되돌릴까요? 고친 내용은 사라집니다.')) return; setData(clone(DEFAULT_DATA)); say('처음 내용으로 되돌렸습니다.'); };

  return (
    <>
      <header className="head">
        <div className="wrap">
          <div className="head-in">
            <div>
              <span className="kicker">{I.spark({s:13})} 선생님을 위한 실전 매뉴얼</span>
              <h1 className="h1">바이브코딩으로 웹앱 만들기</h1>
              <p className="sub">코딩을 한 번도 안 해보셔도 괜찮습니다. 말로 시키고, 붙여넣고, 교실에서 쓰기까지 순서대로 따라오시면 됩니다.</p>
            </div>

            <div className="tools">
              <div className="tool-row">
                <span className="tool-cap">화면</span>
                {DESIGNS.map(d=>(
                  <button key={d.k} className={`tool-btn ${design===d.k?'on':''}`} onClick={()=>setDesign(d.k)} title={d.d}>{d.n}</button>
                ))}
              </div>
              <div className="tool-row">
                <span className="tool-cap">글꼴</span>
                {FONTS.map(f=>(
                  <button key={f.k} className={`tool-btn ${font===f.k?'on':''}`} data-f={f.k} onClick={()=>setFont(f.k)}>{f.n}</button>
                ))}
              </div>
              <div className="tool-row">
                <span className={`cloud-dot ${cloudReady?'on':''}`}><i></i>{cloudReady?'클라우드 연결됨':'내 브라우저에만 저장'}</span>
                {admin
                  ? <button className="tool-btn on" onClick={()=>{ setAdmin(false); setEditCardId(null); say('편집을 끝냈습니다.'); }}>{I.unlock({s:12})} 편집 끝내기</button>
                  : <button className="tool-btn" onClick={()=>setPwOpen(true)}>{I.lock({s:12})} 관리자</button>}
              </div>
            </div>
          </div>

          <nav className="tabs">
            {data.phases.map(p=>(
              <button key={p.id} className={`tab ${phaseId===p.id?'on':''}`}
                onClick={()=>{ setPhaseId(p.id); setEditCardId(null); window.scrollTo({top:0,behavior:'smooth'}); }}
                onDoubleClick={()=>{ if(admin) setNameEdit({kind:'phase',target:p}); }}
                title={admin?'두 번 누르면 이 탭을 고칩니다':undefined}>
                <span className="tab-n">{p.name}{!p.ready && <span className="tab-badge">준비중</span>}</span>
                <span className="tab-s">{p.sub}</span>
              </button>
            ))}
          </nav>
        </div>
      </header>

      <div className="wrap">
        <div className="body-grid">
          <aside className="side">
            {phase.ready ? (
              <>
                <div className="side-h">{phase.name} 차례대로 보기</div>
                <div className="side-list">
                  {data.steps.map((s,i)=>(
                    <button key={s.id} className={`side-i ${stepId===s.id?'on':''}`}
                      onClick={()=>{ setStepId(s.id); setEditCardId(null); }}>
                      <span className={`side-n ${done.includes(s.id)?'done':''}`}>{done.includes(s.id)?'✓':i+1}</span>
                      <span className="side-txt">{s.name}</span>
                      {admin && (
                        <span className="side-pen" title="이 메뉴 고치기"
                          onClick={(e)=>{ e.stopPropagation(); setNameEdit({kind:'step',target:s}); }}>
                          {I.pen({s:12})}
                        </span>
                      )}
                    </button>
                  ))}
                </div>
                <div className="side-sep"></div>
                <div className="prog-wrap">
                  <div className="prog-top"><span>여기까지 보셨어요</span><span>{progress}%</span></div>
                  <div className="prog-track"><div className="prog-fill" style={{width:progress+'%'}}></div></div>
                </div>
              </>
            ) : (
              <>
                <div className="side-h">{phase.name}에서 다룰 내용</div>
                <div className="side-list">
                  {(phase.plan||[]).map((p,i)=>(
                    <div key={i} className="side-i" style={{opacity:.6,cursor:'default'}}>
                      <span className="side-n">{i+1}</span><span className="side-txt">{p}</span>
                    </div>
                  ))}
                </div>
              </>
            )}
          </aside>

          <main className="main">
            {admin && (
              <div className="admin-bar">
                <div className="admin-bar-l">{I.pen({s:15})}
                  <span>고치는 중입니다. 카드의 고치기 버튼, 왼쪽 메뉴의 연필, 위쪽 탭은 두 번 누르기.</span>
                </div>
                <div className="admin-bar-r">
                  <button className="btn sm" onClick={pushCloud} disabled={saving}>{saving?'올리는 중…':'클라우드에 올리기'}</button>
                  <button className="btn ghost sm" onClick={pullCloud}>클라우드에서 가져오기</button>
                  <button className="btn ghost sm" onClick={resetAll}>처음 내용으로</button>
                </div>
              </div>
            )}

            {!phase.ready ? (
              <div className="soon">
                <div className="soon-ic">{I.glass({s:26})}</div>
                <span className="tag solid">{phase.name} · 준비중</span>
                <h2 className="soon-h">{phase.title}</h2>
                <p className="soon-p">{phase.desc}</p>
                <div className="soon-box">
                  <div className="soon-box-h">이 단계에서 다룰 내용</div>
                  <ul>{(phase.plan||[]).map((p,i)=><li key={i}>{p}</li>)}</ul>
                </div>
              </div>
            ) : (
              <>
                <div className="intro">
                  <div>
                    <div className="intro-tags">
                      <span className="tag solid">{stepIdx+1}번째</span>
                      <span className="tag soft">{step.tag}</span>
                    </div>
                    <h2 className="intro-h">{step.title}</h2>
                    <p className="intro-p">{step.subtitle}</p>
                  </div>
                  <button className={`btn ${done.includes(stepId)?'ok':'ghost'}`} onClick={()=>toggleDone(stepId)}>
                    {I.check({s:15,w:3})}<span>{done.includes(stepId)?'여기까지 봤어요':'다 봤어요'}</span>
                  </button>
                </div>

                <div className="stack">
                  {cards.map(c=>(
                    <article className="card" key={c.id}>
                      {editCardId===c.id ? (
                        <div style={{padding:16}}>
                          <CardEdit card={c} onSave={saveCard} onCancel={()=>setEditCardId(null)} />
                        </div>
                      ) : (
                        <>
                          <div className="card-top">
                            <div>
                              <span className="badge">{c.badge}</span>
                              <h3 className="card-h">{c.title}</h3>
                              {c.summary && <p className="card-s">{c.summary}</p>}
                            </div>
                            {admin && (
                              <div style={{display:'flex',gap:6,flexShrink:0}}>
                                <button className="btn ghost sm" onClick={()=>setEditCardId(c.id)}>{I.pen({s:13})}<span>고치기</span></button>
                                <button className="btn danger sm" onClick={()=>delCard(c.id)} title="이 카드 지우기">{I.trash({s:13})}</button>
                              </div>
                            )}
                          </div>

                          <div className="card-body">
                            {c.tip && (
                              <div className="tip">
                                <div className="tip-h">{I.spark({s:14})}<span>선생님 꿀팁</span></div>
                                <p className="tip-p">{c.tip}</p>
                              </div>
                            )}
                            {(c.items||[]).length>0 && (
                              <div className="items">
                                {c.items.map((it,i)=>(
                                  <div className="item" key={i}><span className="dot"></span><span className="item-t">{it}</span></div>
                                ))}
                              </div>
                            )}
                            {c.prompt && <Prompt text={c.prompt} />}
                          </div>
                        </>
                      )}
                    </article>
                  ))}

                  {admin && (
                    <button className="btn ghost" onClick={addCard} style={{alignSelf:'flex-start'}}>
                      {I.plus({s:14})}<span>이 메뉴에 카드 더하기</span>
                    </button>
                  )}

                  <div className="card-foot">
                    {stepIdx < data.steps.length-1 ? (
                      <button className="btn" onClick={()=>{
                        if(!done.includes(stepId)) toggleDone(stepId);
                        setStepId(data.steps[stepIdx+1].id);
                        window.scrollTo({top:180,behavior:'smooth'});
                      }}>다음: {data.steps[stepIdx+1].name}</button>
                    ) : (
                      <button className="btn ok" onClick={()=>{
                        if(!done.includes(stepId)) toggleDone(stepId);
                        say('끝까지 오셨습니다. 수고하셨어요.');
                      }}>{phase.name} 다 봤어요</button>
                    )}
                  </div>
                </div>
              </>
            )}
          </main>
        </div>
      </div>

      {toast && <div className="toast">{I.spark({s:15})}<span>{toast}</span></div>}
      {pwOpen && <PwModal onOk={()=>{ setAdmin(true); setPwOpen(false); say('이제 내용을 고칠 수 있습니다.'); }} onClose={()=>setPwOpen(false)} />}
      {nameEdit && <NameEdit kind={nameEdit.kind} target={nameEdit.target} onSave={saveName} onClose={()=>setNameEdit(null)} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
