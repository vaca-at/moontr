
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>바이브코딩으로 웹앱 만들기 | 선생님을 위한 매뉴얼</title>
<meta name="description" content="코딩을 처음 해보는 선생님도 하나씩 따라 하며 교실에서 쓸 웹앱을 만드는 매뉴얼" />

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
@font-face{
  font-family:'OwnglyphYuntaeng';
  src:url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2608211801@font-160/font-160/%EC%98%A8%EA%B8%80%EC%9E%8E%20%EC%9C%A4%ED%83%B1%EC%B2%B4.woff2') format('woff2');
  font-weight:400;font-display:swap;
}
body[data-font="nanum"]{font-family:'NanumSquare',sans-serif}
body[data-font="pretendard"]{font-family:'Pretendard',sans-serif}
body[data-font="gowun"]{font-family:'Gowun Dodum',sans-serif}
body[data-font="yuntaeng"]{font-family:'OwnglyphYuntaeng',sans-serif}
body[data-font="yuntaeng"] .h1,body[data-font="yuntaeng"] .sec-h,body[data-font="yuntaeng"] .blk-h,body[data-font="yuntaeng"] .def-t{letter-spacing:0}

body[data-design="a"]{
  --bg:#f7f8fa;--panel:#fff;--panel2:#f2f4f6;--ink:#191f28;--ink2:#4e5968;--ink3:#8b95a1;
  --line:#e5e8eb;--line2:#d1d6db;--accent:#3182f6;--accentInk:#fff;--accentSoft:#e8f3ff;--ok:#10b981;
  --rCard:18px;--rBtn:999px;--rSm:10px;
  --sideBg:#fff;--sideInk:#4e5968;--sideActBg:#e8f3ff;--sideActInk:#3182f6;--sideLine:#e5e8eb;--sideDim:#8b95a1;
  --shadow:0 1px 3px rgba(0,0,0,.05);
}
body[data-design="b"]{
  --bg:#fdfcf8;--panel:#fff;--panel2:#f0ece0;--ink:#2f3a4a;--ink2:#5a6270;--ink3:#9c9484;
  --line:#d9d2c2;--line2:#2f3a4a;--accent:#d64545;--accentInk:#fff;--accentSoft:#fbe9e9;--ok:#3f8f5f;
  --rCard:10px;--rBtn:8px;--rSm:6px;
  --sideBg:#f0ece0;--sideInk:#6b6355;--sideActBg:#fff;--sideActInk:#2f3a4a;--sideLine:#d9d2c2;--sideDim:#9c9484;
  --shadow:none;
}
body[data-design="c"]{
  --bg:#22362d;--panel:#2a4136;--panel2:#1b2b24;--ink:#f3f7f4;--ink2:#b7ccc0;--ink3:#8fa99b;
  --line:#3d5a4c;--line2:#5a7a68;--accent:#f2c94c;--accentInk:#1b2b24;--accentSoft:#354d41;--ok:#7bd389;
  --rCard:12px;--rBtn:8px;--rSm:8px;
  --sideBg:#1b2b24;--sideInk:#c3d6cb;--sideActBg:#354d41;--sideActInk:#f2c94c;--sideLine:#3d5a4c;--sideDim:#7d9789;
  --shadow:none;
}
body[data-design="d"]{
  --bg:#f1f3f5;--panel:#fff;--panel2:#f8f9fa;--ink:#1f2937;--ink2:#4b5563;--ink3:#9ca3af;
  --line:#dee2e6;--line2:#c6ccd3;--accent:#0f766e;--accentInk:#fff;--accentSoft:#e3f1ef;--ok:#0f766e;
  --rCard:6px;--rBtn:5px;--rSm:5px;
  --sideBg:#1f2937;--sideInk:#c3cbd6;--sideActBg:#0f766e;--sideActInk:#fff;--sideLine:#2c3949;--sideDim:#7a8799;
  --shadow:0 1px 2px rgba(0,0,0,.04);
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);line-height:1.75;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}

.wrap{max-width:1320px;margin:0 auto;padding:0 20px}

.notice{background:var(--accentSoft);border-bottom:1px solid var(--line)}
.notice-in{display:flex;align-items:center;justify-content:center;gap:9px;padding:10px 0;text-align:center}
.notice-in .m{flex-shrink:0;font-size:.95rem}
.notice-in p{font-size:.83rem;font-weight:800;color:var(--accent);line-height:1.5}
body[data-design="c"] .notice-in p{color:var(--ink)}

.head{background:var(--panel);border-bottom:1px solid var(--line)}
.head-in{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;padding:18px 0 14px;flex-wrap:wrap}
.kicker{display:inline-flex;align-items:center;gap:6px;font-size:.73rem;font-weight:800;color:var(--accent);background:var(--accentSoft);padding:4px 10px;border-radius:999px;margin-bottom:8px}
.h1{font-size:1.6rem;font-weight:800;letter-spacing:-.03em;line-height:1.3}
.sub{font-size:.9rem;color:var(--ink2);margin-top:5px;max-width:60ch}

/* 화면에서 눌러야 할 버튼을 글 속에 그 모양 그대로 보여줍니다 */
.ui{display:inline-flex;align-items:center;padding:2px 9px;margin:0 1px;border-radius:6px;
  font-size:.86em;font-weight:800;line-height:1.55;white-space:nowrap;vertical-align:baseline;
  background:var(--panel2);border:1px solid var(--line2);color:var(--ink)}
.ui.green{background:#1f883d;border-color:#1a7f37;color:#fff}
.ui.blue{background:#1a73e8;border-color:#1669d6;color:#fff}
.tools{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.tool-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.tool-cap{font-size:.72rem;font-weight:800;color:var(--ink3);margin-right:2px}
.tool-btn{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:800;color:var(--ink2);background:var(--panel2);padding:6px 11px;border-radius:var(--rBtn);border:1.5px solid transparent;white-space:nowrap;transition:.15s}
.tool-btn:hover{border-color:var(--line2)}
.tool-btn.on{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
.tool-btn[data-f="nanum"]{font-family:'NanumSquare',sans-serif}
.tool-btn[data-f="pretendard"]{font-family:'Pretendard',sans-serif}
.tool-btn[data-f="gowun"]{font-family:'Gowun Dodum',sans-serif}
.tool-btn[data-f="yuntaeng"]{font-family:'OwnglyphYuntaeng',sans-serif;font-size:.9rem}

.tabs-row{display:grid;grid-template-columns:228px minmax(0,1fr)}
@media (max-width:900px){.tabs-row{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;padding:0 0 14px;overflow-x:auto}
body[data-design="b"] .tabs{align-items:flex-end;gap:4px;padding-bottom:0}
body[data-design="d"] .tabs{gap:0;padding-bottom:0}
.tab{flex:1 0 auto;min-width:180px;text-align:left;padding:11px 14px;transition:.15s}
.tab-n{display:block;font-size:.88rem;font-weight:800}
.tab-s{display:block;font-size:.72rem;margin-top:1px}
body[data-design="a"] .tab{border-radius:14px;background:var(--panel2)}
body[data-design="a"] .tab-n{color:var(--ink2)}body[data-design="a"] .tab-s{color:var(--ink3)}
body[data-design="a"] .tab.on{background:var(--accent)}
body[data-design="a"] .tab.on .tab-n,body[data-design="a"] .tab.on .tab-s{color:var(--accentInk)}
body[data-design="b"] .tab{border-radius:12px 12px 0 0;background:var(--panel2);border:1.5px solid var(--line);border-bottom:none;padding-bottom:12px}
body[data-design="b"] .tab-n{color:var(--ink3)}body[data-design="b"] .tab-s{color:var(--ink3)}
body[data-design="b"] .tab.on{background:var(--panel);border-color:var(--line2);border-width:2px}
body[data-design="b"] .tab.on .tab-n{color:var(--ink)}body[data-design="b"] .tab.on .tab-s{color:var(--accent)}
body[data-design="c"] .tab{border:1.5px dashed var(--line2);border-radius:10px}
body[data-design="c"] .tab-n{color:var(--ink)}body[data-design="c"] .tab-s{color:var(--ink3)}
body[data-design="c"] .tab.on{background:var(--accent);border-style:solid;border-color:var(--accent)}
body[data-design="c"] .tab.on .tab-n{color:var(--accentInk)}body[data-design="c"] .tab.on .tab-s{color:#6b5a1c}
body[data-design="d"] .tab{border-bottom:2.5px solid transparent;padding:12px 20px;flex:0 0 auto}
body[data-design="d"] .tab-n{color:var(--ink2)}body[data-design="d"] .tab-s{color:var(--ink3)}
body[data-design="d"] .tab.on{border-bottom-color:var(--accent)}
body[data-design="d"] .tab.on .tab-n{color:var(--accent)}

.grid{display:grid;grid-template-columns:228px minmax(0,1fr)}
body[data-design="b"] .grid{border-top:2px solid var(--line2)}
.side{background:var(--sideBg);border-right:1px solid var(--sideLine);padding:18px 12px 40px}
.side-in{position:sticky;top:14px}
.side-now{background:var(--accentSoft);border-radius:var(--rSm);padding:12px 13px;margin-bottom:14px}
body[data-design="c"] .side-now,body[data-design="d"] .side-now{background:rgba(255,255,255,.08)}
.side-now .l{display:block;font-size:.66rem;font-weight:800;color:var(--sideDim);margin-bottom:3px}
.side-now .t{display:block;font-size:.95rem;font-weight:800;color:var(--sideInk);letter-spacing:-.02em;line-height:1.35}
body[data-design="a"] .side-now .t,body[data-design="b"] .side-now .t{color:var(--accent)}
.side-now .c{display:flex;justify-content:space-between;align-items:center;margin:9px 0 5px;font-size:.7rem;font-weight:800;color:var(--sideDim)}
.side-now .bar{height:5px;border-radius:999px;background:rgba(125,140,160,.22);overflow:hidden}
.side-now .bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s}
.side-h{font-size:.68rem;font-weight:800;color:var(--sideDim);padding:0 8px 8px}
.side-i{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;font-size:.81rem;font-weight:700;color:var(--sideInk);border-radius:var(--rSm);margin-bottom:2px;transition:.15s}
.side-i:hover{background:var(--accentSoft)}
body[data-design="d"] .side-i:hover{background:#2c3949}
.side-i.on{background:var(--sideActBg);color:var(--sideActInk)}
.side-n{flex-shrink:0;font-size:.67rem;font-weight:800;min-width:18px;height:18px;padding:0 5px;white-space:nowrap;display:flex;align-items:center;justify-content:center;border-radius:5px;background:var(--panel2);color:var(--ink3)}
body[data-design="c"] .side-n,body[data-design="d"] .side-n{background:rgba(255,255,255,.12);color:inherit}
.side-i.on .side-n{background:var(--accent);color:var(--accentInk)}
.side-txt{flex:1;min-width:0}
.sep{height:1px;background:var(--sideLine);margin:14px 8px}

.bnr-zone{padding:0 3px}
.zone-h{font-size:.65rem;font-weight:800;color:var(--sideDim);padding:0 6px 8px}
.bnr-big{display:block;width:100%;text-align:left;border-radius:13px;padding:15px 15px 14px;margin-bottom:9px;background:linear-gradient(135deg,#e8453f,#c62828);color:#fff;position:relative;overflow:hidden;transition:.15s}
body[data-design="c"] .bnr-big{background:linear-gradient(135deg,#b8453f,#8e2f2a)}
.bnr-big:hover{filter:brightness(1.07)}
.bnr-big::after{content:'';position:absolute;right:-24px;top:-24px;width:86px;height:86px;border-radius:50%;background:rgba(255,255,255,.12)}
.bnr-big .ic{display:block;font-size:1.15rem;margin-bottom:5px;position:relative}
.bnr-big .t{display:block;font-size:.9rem;font-weight:800;margin-bottom:3px;line-height:1.35;position:relative}
.bnr-big .d{display:block;font-size:.72rem;opacity:.92;line-height:1.45;position:relative}
.bnr-row{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:9px 11px;border-radius:var(--rSm);background:var(--panel2);margin-bottom:5px;font-size:.77rem;font-weight:700;color:var(--ink2);transition:.15s}
body[data-design="c"] .bnr-row,body[data-design="d"] .bnr-row{background:rgba(255,255,255,.07);color:var(--sideInk)}
.bnr-row:hover{filter:brightness(.97)}
.bnr-row .sq{width:18px;height:18px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.68rem;color:#fff;font-weight:800}
.bnr-row .ar{margin-left:auto;opacity:.45;font-size:.8rem}

/* 지금 단계에서 여는 사이트 — 단계를 바꾸면 목록도 바뀝니다 */
.site-zone{margin-top:16px;padding:0 3px}
.site-h{font-size:.65rem;font-weight:800;color:var(--sideDim);padding:0 6px 8px}
.site-i{display:flex;align-items:center;gap:8px;width:100%;padding:9px 11px;margin-bottom:5px;
  border-radius:var(--rSm);background:var(--accentSoft);border:1.4px solid var(--accent);
  color:var(--accent);font-size:.77rem;font-weight:800;transition:.15s}
.site-i:hover{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
.site-i .m{flex-shrink:0;font-size:.88rem;line-height:1}
.site-i .ar{margin-left:auto;flex-shrink:0;display:flex;opacity:.8}
body[data-design="c"] .site-i,body[data-design="d"] .site-i{
  background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.22);color:var(--sideInk)}
body[data-design="c"] .site-i:hover,body[data-design="d"] .site-i:hover{
  background:var(--accent);color:var(--accentInk);border-color:var(--accent)}

.fav{margin-top:16px;padding:0 3px}
.fav-h{font-size:.65rem;font-weight:800;color:var(--sideDim);padding:0 6px 8px}
.fav-i{padding:9px 10px 11px;border-radius:var(--rSm)}
.fav-i + .fav-i{border-top:1px solid var(--sideLine)}
.fav-t{display:block;font-size:.77rem;font-weight:700;color:var(--sideInk);line-height:1.45;margin-bottom:3px}
.fav-u{display:block;font-size:.68rem;color:var(--sideDim);margin-bottom:7px;word-break:break-all;line-height:1.4}
.fav-b{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;font-weight:800;padding:5px 11px;border-radius:999px;
  background:var(--panel2);color:var(--ink2);border:1px solid var(--line);transition:.15s}
body[data-design="c"] .fav-b,body[data-design="d"] .fav-b{background:rgba(255,255,255,.08);color:var(--sideInk);border-color:rgba(255,255,255,.16)}
.fav-b:hover{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}

.main{padding:26px 26px 70px;min-width:0}
body[data-design="b"] .main{background:linear-gradient(to right,transparent 44px,#f0b8b8 44px,#f0b8b8 45px,transparent 45px),repeating-linear-gradient(var(--bg) 0 30px,#e3e9f1 30px 31px);padding-left:62px}

.sec{padding:8px 0 46px;scroll-margin-top:16px}
.sec + .sec{border-top:1px solid var(--line)}
body[data-design="b"] .sec + .sec{border-top:1px dashed var(--line)}
.sec-top{display:flex;align-items:center;gap:10px;margin-bottom:6px;padding-top:26px}
.sec-num{flex-shrink:0;min-width:28px;height:28px;padding:0 8px;border-radius:9px;background:var(--accent);color:var(--accentInk);font-size:.8rem;font-weight:800;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.sec-tag{font-size:.71rem;font-weight:800;padding:3px 10px;border-radius:var(--rBtn);background:var(--panel2);color:var(--ink2)}
.sec-h{font-size:1.45rem;font-weight:800;letter-spacing:-.03em;line-height:1.35;margin-bottom:6px}
.sec-sub{font-size:.92rem;color:var(--ink2);max-width:74ch;margin-bottom:22px}

.blk{margin-bottom:22px}
.blk.tight{margin-bottom:12px}
.blk-h{font-size:1.1rem;font-weight:800;letter-spacing:-.02em;margin-bottom:10px}
.blk-p{font-size:.94rem;color:var(--ink2)}
.blk-p + .blk-p{margin-top:12px}
.blk-p b{color:var(--ink);font-weight:800}

.def{border-left:4px solid var(--accent);padding:4px 0 4px 18px}
.def-l{display:block;font-size:.71rem;font-weight:800;color:var(--accent);margin-bottom:6px}
.def-t{font-size:1.1rem;font-weight:800;line-height:1.65;letter-spacing:-.02em}

.small{font-size:.86rem;color:var(--ink3);line-height:1.85}
.small a{color:var(--accent);font-weight:800;text-decoration:underline}

.note-box{background:var(--accentSoft);border-radius:var(--rCard);padding:18px 20px;display:flex;gap:13px;align-items:flex-start}
body[data-design="b"] .note-box{border-radius:0;border-left:3px solid var(--accent)}
.note-box .m{flex-shrink:0;font-size:1.15rem;line-height:1.5}
.note-box p{font-size:.96rem;color:var(--ink);font-weight:800;line-height:1.7}
.note-t p + p{margin-top:8px}

.mini-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:11px}
.mini-grid.six{grid-template-columns:repeat(2,1fr)}
@media (min-width:760px){.mini-grid.six{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1180px){.mini-grid.six{grid-template-columns:repeat(6,1fr);gap:9px}}
.mini{background:var(--panel);border:1px solid var(--line);border-radius:var(--rCard);padding:15px;box-shadow:var(--shadow)}
.mini .m{font-size:1.25rem;display:block;margin-bottom:7px}
/* 이 걸음을 어디서 하는지 알려주는 배지 — 같은 곳이면 같은 배지가 이어집니다 */
.mini .w{display:inline-block;margin-bottom:7px;padding:2px 9px;border-radius:999px;
  font-size:.66rem;font-weight:800;letter-spacing:0;background:var(--accentSoft);color:var(--accent)}
.mini .t{display:block;font-size:.9rem;font-weight:800;margin-bottom:5px;line-height:1.4}
.mini .d{display:block;font-size:.81rem;color:var(--ink2);line-height:1.6}
.mini-grid.six .mini .t{font-size:.86rem}
.mini-grid.six .mini .d{font-size:.78rem;line-height:1.55}
.mini .d a{color:var(--accent);font-weight:800;text-decoration:underline;text-underline-offset:2px}

/* 사례 아코디언 */
.cases{border:1px solid var(--line);border-radius:var(--rCard);overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
.case + .case{border-top:1px solid var(--line)}
.case-t{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:12px 15px;transition:.12s}
.case-t:hover{background:var(--panel2)}
.case-m{flex-shrink:0;width:30px;height:30px;border-radius:9px;background:var(--accentSoft);display:flex;align-items:center;justify-content:center;font-size:1rem}
.case-n{font-size:.93rem;font-weight:800;flex-shrink:0}
.case-d{font-size:.8rem;color:var(--ink3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.case-c{margin-left:auto;flex-shrink:0;font-size:.74rem;font-weight:800;color:var(--accent);white-space:nowrap}
.case-b{padding:0 15px 14px 56px}
.case-p{background:var(--panel2);border:1.5px dashed var(--line2);border-radius:var(--rSm);padding:12px 13px;font-size:.83rem;line-height:1.75;color:var(--ink2);white-space:pre-wrap;word-break:break-word}
.case-row{display:flex;justify-content:flex-end;margin-top:8px}
@media (max-width:760px){.case-d{display:none}.case-b{padding-left:15px}}

.link-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:11px}
.link-box{display:block;background:var(--panel);border:1.5px solid var(--line);border-radius:var(--rCard);padding:17px 18px;transition:.15s;box-shadow:var(--shadow)}
.link-box:hover{border-color:var(--accent)}
.link-box .t{display:flex;align-items:center;gap:7px;font-size:1rem;font-weight:800;margin-bottom:4px}

  refs:[
    { id:'r1', color:'red', icon:'🔒', name:'이것만은 꼭!', dim:'학생 이름, 넣어도 될까요?',
      body:
'웹앱은 주소만 알면 누구나 들어올 수 있습니다. 만들기 전에 이것만 확인해주세요.\n\n'+
'■ 개인정보가 무엇인가요\n'+
'「개인정보 보호법」 제2조는 살아 있는 개인에 관한 정보로서 성명, 주민등록번호, 영상 등을 통해 그 사람을 알아볼 수 있는 정보를 개인정보로 봅니다.\n'+
'그 자체로는 누구인지 알 수 없더라도 다른 정보와 쉽게 결합해 알아볼 수 있으면 역시 개인정보입니다.\n\n'+
'■ 학번도 개인정보입니다\n'+
'이름을 빼고 학번만 받으면 괜찮다고 생각하기 쉽지만 그렇지 않습니다. 학교에는 명렬표가 있어서 학번만으로 누구인지 바로 알 수 있기 때문입니다.\n'+
'별명이나 번호도 마찬가지입니다. 우리 반 안에서 누구인지 특정된다면 개인정보로 보아야 합니다.\n\n'+
'■ 가장 안전한 방법\n'+
'학생을 특정할 수 있는 정보를 아예 받지 않는 것입니다.\n'+
'· 누가 눌렀는지 남기지 않고 숫자만 세기 (몇 명이 제출했는지)\n'+
'· 모둠 단위로만 받기 (1모둠, 2모둠)\n'+
'· 교사만 쓰는 도구로 만들기 (자리배치기, 타이머, 뽑기)\n'+
'앞의 실습에서 소개한 도구들은 대부분 학생 정보를 받지 않아도 만들 수 있습니다.\n\n'+

'· 무엇을 왜 받는지 미리 알리고 동의를 받습니다\n'+
'· 꼭 필요한 항목만 받습니다\n'+
'· 학기가 끝나면 지웁니다\n'+
'· 만 14세 미만은 법정대리인 동의가 필요합니다\n'+
'가정통신문 양식과 학교운영위원회 절차는 왼쪽 배너와 즐겨찾기에서 확인하세요.\n\n'+
'■ 절대 넣지 마세요\n'+
'· 주민등록번호, 연락처, 집주소, 보호자 정보\n'+
'· 학생 사진 (본인과 보호자 동의 없이)\n'+
'· 성적, 상담 기록, 건강 정보\n'+
'· 생활기록부에 들어가는 내용\n\n'+
'■ 학교에 먼저 물어보세요\n'+
'학교마다 개인정보 처리 방침이 있습니다. 학생 정보를 다루는 도구를 만드실 거면 관련 부서에 한 번 확인하시는 것이 가장 안전합니다.' },

function useCopy(text){
  const [d,setD]=useState(false);
  const go=()=>{
    const mark=()=>{setD(true);setTimeout(()=>setD(false),1800)};
    const fb=()=>{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';
      document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch{}document.body.removeChild(t);return ok};
    if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(text).then(mark).catch(()=>{fb()&&mark()});
    else fb()&&mark();
  };
  return [d,go];
}

function ShotPop({ src, cap, onClose }){
  useEffect(()=>{
    const onKey=e=>{ if(e.key==='Escape') onClose(); };
    window.addEventListener('keydown',onKey);
    return ()=>window.removeEventListener('keydown',onKey);
  },[onClose]);
  return <div className="back" onClick={onClose}>
    <div className="shot-pop" onClick={e=>e.stopPropagation()}>
      <button className="shot-pop-x" onClick={onClose} aria-label="닫기">{I.x({s:16})}</button>
      <img src={src} alt={cap||''} />
      {cap&&<div className="shot-pop-cap"><span className="m">{I.img({s:14})}</span><span>{HTML(cap)}</span></div>}
    </div></div>;
}

function ShotBtn({ id, imgMap }){
  const [open,setOpen]=useState(false);
  const src=(imgMap&&imgMap[id])||'';
  if(!src) return null;
  const slot=SLOT_BY_ID[id];
  return <React.Fragment>
    <button className="shot-btn" onClick={()=>setOpen(true)} title="이 단계 화면 보기">{I.img({s:12})}<span>사진</span></button>
    {open&&<ShotPop src={src} cap={slot&&slot.cap} onClose={()=>setOpen(false)} />}
  </React.Fragment>;
}

function ImgBlock({ b, imgMap, tight }){

  return <div className={`blk ${tight?'tight':''}`}>

function RefBody({ text }){
  const blocks=[];
  String(text||'').split('\n').forEach(raw=>{
    const line=raw.trim();
    if(!line) return;
    if(line.startsWith('━')) blocks.push({k:'cat', t:line.replace(/━/g,'').trim()});
    else if(line.startsWith('■')) blocks.push({k:'h', t:line.replace(/^■\s*/,'')});
    else if(line.startsWith('·')){
      const t=line.replace(/^·\s*/,'');
      const last=blocks[blocks.length-1];
      if(last&&last.k==='ul') last.items.push(t);
      else blocks.push({k:'ul', items:[t]});
    }
    else blocks.push({k:'p', t:line});
  });
  const firstH=blocks.findIndex(b=>b.k==='h'||b.k==='cat');
  return <div className="ref-body">{blocks.map((b,i)=>
    b.k==='cat' ? <div className="ref-cat" key={i}>{HTML(b.t)}</div>
    : b.k==='h' ? <h4 className="ref-h" key={i}>{HTML(b.t)}</h4>
    : b.k==='ul' ? <ul className="ref-ul" key={i}>{b.items.map((t,j)=><li key={j}>{HTML(t)}</li>)}</ul>
    : <p className={(firstH>0&&i<firstH)?'ref-lead':'ref-p'} key={i}>{HTML(b.t)}</p>
  )}</div>;
}

function ImageAdminModal({ imgMap, setImgMap, onClose }){
  const [busy,setBusy]=useState(null);
  const [err,setErr]=useState('');

  function handlePaste(e,id){
    e.preventDefault();
    const items=e.clipboardData&&e.clipboardData.items;
    let file=null;
    if(items){ for(const it of items){ if(it.type&&it.type.startsWith('image/')){ file=it.getAsFile(); break; } } }
    if(!file){ setErr('붙여넣은 내용에서 이미지를 찾지 못했습니다. 스크린샷을 캡처한 뒤 이 칸을 클릭하고 Ctrl+V로 다시 시도해주세요.'); return; }
    setErr(''); setBusy(id);
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      // 파이어스토어 문서 한도가 1MB라 base64 길이가 90만 자 아래로 들어올 때까지 줄입니다.
      const encode=(maxW,q)=>{
        const scale=Math.min(1,maxW/img.width);
        const w=Math.round(img.width*scale), h=Math.round(img.height*scale);
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        return canvas.toDataURL('image/jpeg',q);
      };
      let maxW=1000, q=0.8, dataUrl=encode(maxW,q);
      for(let i=0;i<4&&dataUrl.length>=900000;i++){ maxW=Math.round(maxW*0.8); q=Math.max(0.45,q-0.12); dataUrl=encode(maxW,q); }
      URL.revokeObjectURL(url);
      if(dataUrl.length>=900000){ setErr('이미지가 너무 큽니다. 화면 일부만 잘라서 캡처한 뒤 다시 붙여넣어주세요.'); setBusy(null); return; }
      saveImage(id,dataUrl).then(()=>{ setImgMap(m=>({...m,[id]:dataUrl})); setBusy(null); })
        .catch(er=>{
          const code=(er&&(er.code||er.message))||'알 수 없는 오류';
          setErr(String(code).indexOf('permission')>=0
            ? '파이어스토어 보안 규칙에 막혔습니다. 규칙에서 images 컬렉션 쓰기를 허용해주세요. ('+code+')'
            : '저장에 실패했습니다. ('+code+')');
          setBusy(null);
        });
    };
    img.onerror=()=>{ setErr('이미지를 읽는 데 실패했습니다.'); setBusy(null); };
    img.src=url;
  }

  function handleDelete(id){
    setBusy(id);
    deleteImageDoc(id).then(()=>{
      setImgMap(m=>{ const n={...m}; delete n[id]; return n; });
      setBusy(null);
    }).catch(()=>setBusy(null));
  }

  return <div className="back" onClick={onClose}>
    <div className="sheet wide" onClick={e=>e.stopPropagation()}>
      <div className="sheet-h">
        <div><h3 className="sheet-t">이미지 관리</h3>
          <p className="sheet-s">자리를 클릭한 뒤 Ctrl+V로 캡처한 스크린샷을 붙여넣으세요. 파이어스토어에 저장되어 코드를 다시 올려도 사라지지 않습니다.</p></div>
        <button className="x" onClick={onClose}>{I.x()}</button></div>
      <div className="sheet-b">
        {!cloudReady&&<p className="err">파이어스토어가 연결되어 있지 않아 저장할 수 없습니다.</p>}
        {err&&<p className="err">{err}</p>}
        {IMG_SLOTS.length===0
          ? <p style={{color:'var(--ink3)',fontSize:'.88rem'}}>등록된 이미지 자리가 없습니다.</p>
          : <div className="img-admin-grid">
            {IMG_SLOTS.map(slot=>(
              <div className="img-admin-c" key={slot.id}>
                <div className="img-admin-meta">{slot.phase} · {slot.step}</div>
                <div className="img-admin-cap">{HTML(slot.cap)}</div>
                <div className="img-admin-slot" tabIndex="0" onPaste={e=>handlePaste(e,slot.id)}>
                  {busy===slot.id
                    ? <span className="img-admin-busy">저장 중…</span>
                    : imgMap[slot.id]
                      ? <img src={imgMap[slot.id]} alt={slot.cap} />
                      : <span className="img-admin-ph">여기를 클릭하고<br/>Ctrl+V로 붙여넣기</span>}
                </div>
                {imgMap[slot.id]&&<button className="btn ghost" style={{marginTop:6,fontSize:'.72rem',padding:'5px 11px'}} onClick={()=>handleDelete(slot.id)}>삭제</button>}
              </div>
            ))}
          </div>}
      </div></div></div>;
}

        {DATA.favs&&DATA.favs.length>0&&<div className="fav">
          <div className="fav-h">즐겨찾기</div>
          {DATA.favs.map((f,i)=>(
            <div className="fav-i" key={i}>
              <span className="fav-t">{f.t}</span>
              <span className="fav-u">{f.u.replace(/^https?:\/\//,'').split('/')[0]}</span>
              <a className="fav-b" href={f.u} target="_blank" rel="noopener">
                {I.out({s:12})}<span>바로가기</span></a>
            </div>))}
        </div>}
      </div></aside>

      <main className="main">
        {steps.map((s,i)=>(
          <section className="sec" key={s.id} data-sid={s.id} ref={el=>secRefs.current[s.id]=el}>
            <div className="sec-top"><span className="sec-num">{s.no||(i+1)}</span><span className="sec-tag">{s.tag}</span></div>
            <h2 className="sec-h">{s.title}{s.shot&&<ShotBtn id={s.shot} imgMap={imgMap} />}</h2>
            <p className="sec-sub">{s.subtitle}</p>
            {s.blocks.map((b,bi)=><Block key={bi} b={b} onRef={setRefOpen} imgMap={imgMap} />)}
            {s.ask&&<div className="sec-foot">
              <button className="btn ask" onClick={()=>setAskOpen({...s,phaseName:phase.name})}>
                {I.spark({s:14})}<span>AI에게 물어보기</span></button>
            </div>}
          </section>
        ))}
      </main>
    </div></div>

    <footer className="foot"><div className="wrap">
      <p>{DATA.notice}</p>
      {DATA.mail&&<span className="foot-mail">문의 이메일 <a href={`mailto:${DATA.mail}`}>{DATA.mail}</a></span>}
    </div></footer>

    {refOpen&&<RefModal r={refOpen} onClose={()=>setRefOpen(null)} />}
    {askOpen&&<AskModal info={askOpen} onSent={()=>{askCount.current++}} onClose={()=>setAskOpen(null)} />}
    {pwOpen&&<PwModal onOk={()=>{setPwOpen(false); if(pwIntent==='images') setImgAdminOpen(true); else setDashOpen(true);}} onClose={()=>setPwOpen(false)} />}
    {dashOpen&&<DashModal onClose={()=>setDashOpen(false)} />}
    {imgAdminOpen&&<ImageAdminModal imgMap={imgMap} setImgMap={setImgMap} onClose={()=>setImgAdminOpen(false)} />}
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
