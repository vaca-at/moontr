<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>관리자 허브 · moontr.site</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 관리자 대시보드 공통 모양 (진선 50주년 대시보드와 같은 틀) */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --ink:#17243B; --muted:#65728A; --line:#DCE2EC;
  --accent:#1F3A6B; --on-accent:#FFFFFF; --accent-soft:#E8EDF6; --gold:#B8923A;
  --fb:#1F9A7A; --pw:#D98A2B; --gs:#2C7FC0;
  --sheet:#1E8E4E; --code:#444C56; --etc:#6B5B95;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;color:var(--ink);background:var(--bg)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #4C7BD9;outline-offset:2px}
[hidden]{display:none !important}
svg{width:16px;height:16px;flex:none}

/* 위쪽 막대 */
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;padding:.7rem clamp(16px,2.5vw,32px)}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:700;font-size:1.1rem}
.brand .mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;font-weight:800}
.brand .badge{font-size:.72rem;font-weight:700;color:var(--gold);background:#F7EFD9;border-radius:999px;padding:.15rem .55rem}
.acts{display:flex;gap:.45rem;margin-left:auto;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:.4rem;min-height:38px;padding:0 .95rem;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;font-size:.88rem;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700;box-shadow:0 6px 16px -8px var(--accent)}
.btn.primary:hover{filter:brightness(1.12)}
.btn[aria-pressed="true"]{background:#B3261E;border-color:#B3261E;color:#fff}

/* 탭 (묶음) — 앱이 여러 개인 탭은 아래로 목록이 열림 */
.tabs{display:flex;gap:.2rem;padding:0 clamp(8px,2vw,24px);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;flex:none}
.tab > button{display:flex;align-items:center;gap:.45rem;min-height:46px;padding:0 .9rem;border:0;border-bottom:3px solid transparent;background:none;cursor:pointer;color:var(--muted);font-size:.95rem;white-space:nowrap}
.tab > button:hover{color:var(--ink)}
.tab.on > button{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.tab .cur{font-weight:400;color:var(--muted);font-size:.85rem}
.tab .caret{width:12px;height:12px;opacity:.6}
.menu{position:fixed;z-index:40;min-width:260px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px -16px rgba(0,0,0,.35)}
.menu button{display:flex;align-items:center;gap:.6rem;width:100%;min-height:40px;padding:0 .7rem;border:0;border-radius:8px;background:none;cursor:pointer;text-align:left;font-size:.92rem}
.menu button:hover{background:var(--accent-soft)}
.menu button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.dot{flex:none;display:inline-block;width:8px;height:8px;border-radius:50%}
.dot.fb{background:var(--fb)}.dot.pw{background:var(--pw)}.dot.gs{background:var(--gs)}
.menu .note{margin:.3rem .7rem .2rem;font-size:.75rem;color:var(--muted)}

/* 본문: 고른 앱의 관리자 화면 */
#frame{display:block;width:100%;height:calc(100dvh - var(--top-h, 110px));border:0;background:var(--surface)}
.frame-note{display:flex;align-items:center;gap:.5rem;padding:.45rem clamp(16px,2.5vw,32px);font-size:.8rem;color:var(--muted);background:#FBFCFE;border-bottom:1px solid var(--line)}

/* 로그인 */
.login{max-width:380px;margin:4rem auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.6rem}
.login h2{margin:0 0 .8rem;font-size:1.2rem}
.login input{width:100%;padding:.8rem;font-size:1.2rem;letter-spacing:.3em;text-align:center;border-radius:10px;border:1px solid var(--line);margin:.6rem 0}
.login button{width:100%;min-height:46px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
.err{color:#B3261E;min-height:1.4em;margin:.6rem 0 0;font-size:.9rem}

/* ===== 홈 탭: 웹앱별 방문 현황 ===== */
#home{padding:1.4rem clamp(16px,2.5vw,32px) 3rem}
.home-head{display:flex;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.home-head h1{margin:0;font-size:2rem;letter-spacing:-.02em}
.home-head p{margin:.3rem 0 0;color:var(--muted);font-size:.9rem}
.home-head .btn{margin-left:auto}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.8rem;margin-bottom:1rem}
.sum button{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.2rem;cursor:pointer;position:relative}
.sum button:hover{border-color:var(--accent)}
.sum button[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.sum button::after{content:"순위 보기 ▾";position:absolute;right:1rem;top:1rem;font-size:.72rem;color:var(--muted)}
.sum button[aria-expanded="true"]::after{content:"접기 ▴";color:var(--accent)}
/* 요약 칸을 누르면 아래로 열리는 순위 */
.rank{margin:-.2rem 0 1rem;background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:.6rem .8rem}
.rank h3{margin:.2rem .4rem .5rem;font-size:.9rem}
.rank-row{display:grid;grid-template-columns:2rem minmax(8rem,14rem) 1fr 5.5rem;align-items:center;gap:.7rem;width:100%;min-height:38px;padding:0 .4rem;border:0;border-radius:8px;background:none;cursor:pointer;text-align:left;font-size:.9rem}
.rank-row:hover{background:var(--accent-soft)}
.rank-row .no{font-weight:800;color:var(--muted);text-align:center}
.rank-row:nth-child(-n+4) .no{color:var(--gold)}
.rank-row .nm{display:flex;align-items:center;gap:.45rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-row .bar{height:8px;border-radius:99px;background:#EBEEF3;overflow:hidden}
.rank-row .bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.rank-row .v{text-align:right;font-weight:700}
.rank-row.zero{opacity:.5}
.rank .foot{margin:.4rem .4rem .1rem;font-size:.78rem;color:var(--muted)}
@media (max-width:640px){ .rank-row{grid-template-columns:1.6rem 1fr 4.5rem} .rank-row .bar{display:none} }
.sum small{display:block;color:var(--muted);font-size:.82rem}
.sum b{display:block;font-size:1.8rem;margin-top:.2rem;letter-spacing:-.02em}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:.8rem}
.card{display:flex;flex-direction:column;gap:.7rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;cursor:pointer;text-align:left}
.card:hover{border-color:var(--accent);box-shadow:0 10px 24px -18px var(--accent)}
.card-h{display:flex;align-items:center;gap:.5rem;font-weight:700}
.card-h .grp{margin-left:auto;font-weight:400;font-size:.75rem;color:var(--muted)}
.nums{display:flex;gap:1.4rem;align-items:baseline}
.nums b{font-size:1.7rem;letter-spacing:-.02em}
.nums small{color:var(--muted);font-size:.8rem;margin-left:.2rem}
.nums .tot b{font-size:1.1rem}
.grass{display:grid;grid-template-rows:repeat(7,10px);grid-auto-flow:column;grid-auto-columns:10px;gap:2px;overflow:hidden;justify-content:end}
.grass i{border-radius:2px;background:#EBEEF3}
.grass i.l1{background:#C9D5EA}.grass i.l2{background:#8FA6CF}.grass i.l3{background:#4F6FA6}.grass i.l4{background:var(--accent)}
.grass i.fut{background:transparent}
.card .msg,#homeCards .msg{font-size:.8rem;color:var(--muted);margin:0}
.nostat{margin-top:1.4rem}
.others-top{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin:0 0 .6rem}
.others-top .others-h{margin:0 auto 0 0}
.others-top .btn{min-height:32px;font-size:.8rem}
.others-top .btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.orow.edit{grid-template-columns:auto minmax(10rem,1fr) 6rem auto}
.orow.edit:hover{background:none}
.orow .mv{display:flex;gap:2px}
.orow .mv button{width:28px;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;font-size:.7rem;color:var(--muted)}
.orow .mv button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.orow .mv button:disabled{opacity:.3;cursor:default}
.orow .nm-in{min-width:0;padding:.35rem .6rem;border:1px solid var(--line);border-radius:8px;font:inherit;color:var(--ink);background:var(--surface)}
.orow .nm-in:focus{border-color:var(--accent);outline:none}
.odel{border:0;background:#FBE4E2;color:#B3261E;border-radius:999px;padding:.3rem .7rem;font-size:.75rem;cursor:pointer}
.others-h{margin:0 0 .6rem;font-size:1rem}
.others-h small{font-weight:400;color:var(--muted);font-size:.8rem;margin-left:.4rem}
.others{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.4rem .6rem}
.orow{display:grid;grid-template-columns:minmax(9rem,14rem) minmax(9rem,12rem) minmax(3rem,6rem) 5rem 6rem 1fr;align-items:center;gap:.8rem;min-height:40px;padding:.2rem .5rem;border-radius:8px;font-size:.88rem}
.orow:hover{background:var(--accent-soft)}
.orow .nm{font-weight:600}
.orow .nm:hover{text-decoration:underline}
.orow .addr{color:var(--muted);font-size:.8rem;font-family:ui-monospace,Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orow .addr:hover{color:var(--accent);text-decoration:underline}
.orow .ochips{display:flex;gap:3px}
/* 줄 아래 링크 */
.olinks{grid-column:1 / -1;display:flex;flex-direction:column;gap:2px;margin:0 0 .4rem .2rem}
.olinks a{display:flex;align-items:center;gap:.5rem;min-width:0;font-size:.78rem;color:var(--muted);font-family:ui-monospace,Consolas,monospace}
.olinks a:hover{color:var(--accent)}
.olinks a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.olinks .lb{flex:none;font-family:Pretendard,sans-serif;font-size:.7rem;padding:.1rem .45rem;border-radius:999px;border:1px solid currentColor;color:var(--etc)}
.olinks .lb.sheet{color:var(--sheet)}
.orow .v{color:var(--muted);font-size:.8rem;text-align:right}
.orow .v b{color:var(--ink);font-size:.95rem}
.orow .grass{grid-template-rows:repeat(7,6px);grid-auto-columns:6px;gap:1px}
@media (max-width:640px){ .orow{grid-template-columns:1fr 4rem 5rem} .orow .grass,.orow .addr,.orow .ochips{display:none} }

/* ===== 즐겨찾기 탭 ===== */
#bm{padding:1.4rem clamp(16px,2.5vw,32px) 3rem}
.bm-head{display:flex;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.bm-head h1{margin:0;font-size:2rem;letter-spacing:-.02em}
.bm-head p{margin:.3rem 0 0;color:var(--muted);font-size:.9rem}
.views{display:flex;gap:2px;margin-left:auto;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:999px}
.views button{min-height:34px;padding:0 .8rem;border:0;border-radius:999px;background:none;cursor:pointer;font-size:.85rem;color:var(--muted)}
.views button[aria-pressed="true"]{background:var(--accent);color:#fff}
.ic{flex:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;color:#fff;font-size:.72rem;font-weight:700;overflow:hidden}
img.ic{background:#fff;border:1px solid var(--line);padding:2px;object-fit:contain}
.chips{flex:none;display:flex;gap:3px;align-items:center}
.chip{font-size:.7rem;line-height:1;padding:.3rem .5rem;border-radius:999px;border:1px solid currentColor;background:var(--surface);white-space:nowrap}
.chip.adm{color:var(--accent)} .chip.sheet{color:var(--sheet)} .chip.code{color:var(--code)} .chip.etc{color:var(--etc)}
.chip:hover{background:currentColor}
.chip:hover span{color:#fff}
.del{display:none;flex:none;border:0;background:#FBE4E2;color:#B3261E;border-radius:999px;padding:.3rem .55rem;font-size:.7rem;line-height:1;cursor:pointer}
body.editing .del{display:inline-block}
.sub{opacity:.72}
.sub .go{font-size:.9em}
.gap{margin-top:.7rem !important}
.legend{display:flex;gap:.9rem;flex-wrap:wrap;align-items:center;margin:0 0 .9rem;font-size:.8rem;color:var(--muted)}

.v-bar .bm{display:flex;flex-wrap:wrap;gap:4px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.v-bar details{position:relative}
.v-bar summary{list-style:none;display:flex;align-items:center;gap:.4rem;min-height:36px;padding:0 .8rem;border-radius:8px;cursor:pointer;font-size:.9rem}
.v-bar summary::-webkit-details-marker{display:none}
.v-bar summary:hover,.v-bar details[open] summary{background:var(--accent-soft)}
.v-bar summary svg{color:var(--gold)}
.v-bar .bmenu{position:absolute;left:0;top:calc(100% + 4px);z-index:5;min-width:340px;max-height:70vh;overflow:auto;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 30px -12px rgba(0,0,0,.3)}
.v-bar .row{display:flex;align-items:center;gap:.6rem;padding:.4rem .6rem;border-radius:7px}
.v-bar .row:hover{background:var(--accent-soft)}
.v-bar .row a.go{flex:1;display:flex;align-items:center;gap:.6rem;min-width:0}

.v-tree{columns:2 380px;column-gap:2rem}
.v-tree details{break-inside:avoid;margin:0 0 .8rem}
.v-tree summary{display:flex;align-items:center;gap:.45rem;min-height:32px;cursor:pointer;font-weight:700}
.v-tree summary svg{width:18px;height:18px;color:var(--gold)}
.v-tree summary small{font-weight:400;color:var(--muted)}
.v-tree ul{list-style:none;margin:0 0 0 .6rem;padding:0 0 0 1rem;border-left:1px dashed var(--line)}
.v-tree li{display:flex;align-items:center;gap:.55rem;min-height:32px;padding:0 .4rem;border-radius:6px}
.v-tree li:hover{background:var(--surface)}
.v-tree li a.go{display:flex;align-items:center;gap:.55rem;min-width:0;flex:1}
.v-tree li a.go span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.v-list table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);font-size:.9rem}
.v-list th{text-align:left;font-weight:400;font-size:.78rem;color:var(--muted);padding:.5rem .8rem;border-bottom:1px solid var(--line);background:#FAFBFD}
.v-list td{padding:0 .8rem;height:34px;border-bottom:1px solid #EEF1F6;white-space:nowrap}
.v-list tr.grp td{height:28px;background:#FAFBFD;font-size:.78rem;color:var(--muted);font-weight:700}
.v-list tr.it:hover td{background:var(--accent-soft)}
.v-list td a.go{display:flex;align-items:center;gap:.55rem}
.v-list td.host{color:var(--muted);font-size:.8rem;max-width:22rem;overflow:hidden;text-overflow:ellipsis}
.v-list td.lv{font-size:.75rem;color:var(--muted)}

.v-icons section{margin-bottom:1rem}
.v-icons h2{margin:0 0 .4rem;font-size:.8rem;font-weight:700;color:var(--muted)}
.v-icons .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:.4rem}
.v-icons .tile{display:flex;flex-direction:column;align-items:center;gap:.35rem;padding:.7rem .3rem .5rem;border-radius:10px;text-align:center}
.v-icons .tile:hover{background:var(--surface)}
.v-icons .tile a.go{display:flex;flex-direction:column;align-items:center;gap:.35rem}
.v-icons .tile .ic{width:48px;height:48px;border-radius:14px;font-size:1.2rem}
.v-icons .tile b{font-weight:400;font-size:.82rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.v-icons .tile .chips{flex-wrap:wrap;justify-content:center}

.v-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:.8rem;align-items:start}
.v-cols section{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.6rem}
.v-cols h2{margin:0 0 .3rem;padding:.2rem .4rem;font-size:.9rem}
.v-cols h2 small{font-weight:400;color:var(--muted)}
.v-cols .row{display:flex;align-items:center;gap:.5rem;min-height:34px;padding:0 .4rem;border-radius:7px}
.v-cols .row:hover{background:var(--accent-soft)}
.v-cols .row a.go{flex:1;display:flex;align-items:center;gap:.5rem;min-width:0;font-size:.9rem}
.v-cols .row a.go span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.hiddenbox{margin-top:1.4rem;padding:.8rem 1rem;background:var(--surface);border:1px dashed var(--line);border-radius:10px;font-size:.85rem}
.hiddenbox b{display:block;margin-bottom:.4rem;color:var(--muted);font-weight:400}
.hiddenbox .row{display:flex;align-items:center;gap:.6rem;min-height:32px}
.hiddenbox .row span{flex:1;color:var(--muted);text-decoration:line-through}
.hiddenbox button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.15rem .7rem;font-size:.78rem;cursor:pointer}

@media (max-width:640px){
  .acts .btn span.t{display:none}
  .views{margin-left:0;width:100%;overflow-x:auto}
  .v-list td.host,.v-list th.host,.v-list td.lv,.v-list th.lv{display:none}
  .v-bar .bmenu{min-width:min(340px,calc(100vw - 32px))}
}
</style>
</head>
<body>

<header class="top" id="top">
  <div class="top-row">
    <a class="brand" href="/"><span class="mark">M</span>moontr.site <span class="badge">관리자</span></a>
    <div class="acts" id="acts" hidden>
      <a class="btn primary" id="siteBtn" href="/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span class="t">사이트 보기</span></a>
      <a class="btn" id="newWin" href="/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3h7v7"/><path d="M10 14L21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg><span class="t">새 창으로</span></a>
      <button type="button" class="btn" id="edit" aria-pressed="false" hidden><span class="t">편집</span></button>
      <button type="button" class="btn" id="logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span class="t">로그아웃</span></button>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="관리자 화면 고르기" hidden></nav>
</header>
<div class="menu" id="menu" role="menu" hidden></div>

<main>
  <form class="login" id="login" hidden>
    <h2>관리자 로그인</h2>
    <label for="pw">관리자 비밀번호(숫자 6자리)</label>
    <input type="password" id="pw" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="숫자 6자리" autocomplete="current-password" required>
    <button type="submit">로그인</button>
    <p class="err" id="err" role="alert"></p>
  </form>

  <section id="home" hidden>
    <div class="home-head">
      <div><h1>오늘의 현황</h1><p>웹앱마다 오늘 방문 · 누적 방문 · 최근 20주 잔디입니다. 카드를 누르면 그 관리자 화면이 열립니다.</p></div>
      <button type="button" class="btn" id="homeReload">새로고침</button>
    </div>

  $('#tabs').innerHTML = ADMIN_GROUPS.map((g, gi) => {

    return `<div class="tab ${on ? 'on' : ''}"><button type="button" data-g="${gi}" ${multi ? 'aria-haspopup="menu"' : ''}>

  }).join('') + `<div class="tab ${cur ? '' : 'on'}"><button type="button" data-bm>${svg('star')}즐겨찾기</button></div>`;

}

/* ---------- 탭 아래로 열리는 목록 ---------- */
let menuFor = null;
function openMenu(btn, gi){
  const g = ADMIN_GROUPS[gi], r = btn.getBoundingClientRect();
  const m = $('#menu');
  m.innerHTML = g.items.map((a, i) => `<button type="button" role="menuitem" data-i="${i}" ${a === cur ? 'aria-current="true"' : ''}>
      <span class="dot ${a.login}"></span>${esc(a.name)}</button>`).join('');
  m.hidden = false;
  m.style.left = Math.max(8, Math.min(r.left, innerWidth - m.offsetWidth - 8)) + 'px';
  m.style.top = (r.bottom + 4) + 'px';
  menuFor = gi;
  m.querySelector('button').focus();
}
function closeMenu(){ $('#menu').hidden = true; menuFor = null; }
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.hasAttribute('data-bm')) return show(null);
  if (b.hasAttribute('data-home')) return show('home');
  const gi = +b.dataset.g, g = ADMIN_GROUPS[gi];
  if (g.items.length === 1) return show(g.items[0]);
  if (menuFor === gi) return closeMenu();
  openMenu(b, gi);
});
$('#menu').addEventListener('click', e => {
  const b = e.target.closest('button[data-i]'); if (!b) return;
  show(ADMIN_GROUPS[menuFor].items[+b.dataset.i]);
});
document.addEventListener('click', e => { if (!e.target.closest('#menu') && !e.target.closest('#tabs')) closeMenu(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });

/* ============================================================

   각 앱이 Firestore 에 남기는 방문 기록을 읽어 날짜별로 셉니다.
   (기록을 남기지 않는 화면은 아래에 이름만 보여 줍니다)
   ============================================================ */
const ymd = dt => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
const toDay = v => {
  if (!v) return null;
  if (v.toDate) return ymd(v.toDate());
  if (typeof v === 'number') return ymd(new Date(v));
  const m = String(v).match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/);
  return m ? `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}` : null;
};

  '110':'1학년 10반 공지', justice01:'사회 정의 수업', common:'통사4차시(공동체주의)', c1:'/c1', c2:'2학기 통사 학습지', c4:'통사컨설팅장학(최종)',
  check:'/check', check03:'/check03', cs:'/cs', cs1:'/cs1', cs2:'/cs2', cs4:'/cs4', cs8:'통사3차시(4~11반)', drs:'또래상담부DRS', gt:'/gt',
  check04:'출석체크 (학생 화면 방문)'
};
/* 그 밖의 웹앱 줄 아래에 적어 둘 링크 (앱 이름 → [이름표, 주소]) */
const OTHER_LINKS = {
  c1: [
    ['앱스 스크립트', 'https://script.google.com/macros/s/AKfycbxQ3guglRIMm6-YPwq0sYPfiWr1FZ0-RRVN1YT3W5MHL4jMjA2aSeLm9na967Duz9t-/exec'],
    ['시트', 'https://docs.google.com/spreadsheets/d/1quS_Uxsmo-CnxP7-wrOYZYssjJGZzx4ZDBVFokb2VUU/edit?gid=951501777#gid=951501777']
  ]
};
let siteData = {};
const WEEKS = 20;
let homeData = null;

async function loadStats(){
  const today = ymd(new Date());
  const out = {};
  /* /visit.js 가 센 숫자: "이름__total", "이름__d2026-09-25" */
  siteData = {};
  try {
    (await getDocs(collection(db, 'site_counts'))).docs.forEach(d => {
      const m = d.id.match(/^(.+)__(total|d(\d{4}-\d{2}-\d{2}))$/); if (!m) return;
      const o = siteData[m[1]] = siteData[m[1]] || { total:0, days:{} };
      if (m[2] === 'total') o.total = d.data().n || 0; else o.days[m[3]] = d.data().n || 0;
    });
  } catch {}
  await Promise.all(Object.entries(STATS).map(async ([key, st]) => {
    if (st.site){
      const o = siteData[st.site] || { total:0, days:{} };
      out[key] = { today: o.days[today] || 0, total: o.total, days: o.days };
      return;
    }
    try {
      const snap = await getDocs(collection(db, st.col));
      let docs = snap.docs.map(d => d.data());
      if (st.filter) docs = docs.filter(st.filter);
      if (st.vibe){
        /* 바이브코딩: 기기마다 들어온 날짜(days)를 남깁니다 → 날짜별 인원수
           (날짜 기록을 시작하기 전 방문은 처음·마지막 방문한 날만 알 수 있어 그 두 날로 셉니다) */
        const days = {};
        docs.forEach(x => {
          const set = new Set(Object.keys(x.days || {}));
          [x.firstSeen, x.lastSeen].forEach(t => { const k = t && toDay(Date.parse(t)); if (k) set.add(k); });
          set.forEach(k => { days[k] = (days[k] || 0) + 1; });
        });
        out[key] = { today: days[today] || 0, total: docs.reduce((n, x) => n + (x.visits || 0), 0), days, devices: docs.length };
        return;
      }
      const days = {};
      docs.forEach(x => { const k = st.day(x); if (k) days[k] = (days[k] || 0) + 1; });
      out[key] = { today: days[today] || 0, total: docs.length, days };
    } catch (e) { out[key] = { error: e.code || e.message }; }
  }));
  seedSiteCounts(out, today);
  return out;
}
/* 앱이 따로 남기던 기록이 더 많으면, 웹앱에 보이는 누적·오늘 숫자를 그만큼 올려 둡니다 (줄이지는 않음) */
function seedSiteCounts(out, today){
  Object.entries(STATS).forEach(([key, st]) => {
    const d = out[key]; if (!st.seed || !d || d.error) return;
    const o = siteData[st.seed] || { total:0, days:{} };
    if (d.total > o.total) setDoc(doc(db, 'site_counts', `${st.seed}__total`), { n: d.total }).catch(() => {});
    if (d.today > (o.days[today] || 0)) setDoc(doc(db, 'site_counts', `${st.seed}__d${today}`), { n: d.today }).catch(() => {});
  });
}
function grass(days){
  const end = new Date(); end.setHours(0,0,0,0);
  const start = new Date(end); start.setDate(start.getDate() - end.getDay() - (WEEKS - 1) * 7);   // 20주 전 일요일부터
  const vals = []; for (let dt = new Date(start); dt <= end; dt.setDate(dt.getDate() + 1)) vals.push([ymd(dt), days[ymd(dt)] || 0]);
  const max = Math.max(1, ...vals.map(v => v[1]));
  const lv = n => !n ? '' : n <= max * .25 ? 'l1' : n <= max * .5 ? 'l2' : n <= max * .75 ? 'l3' : 'l4';
  const fut = 6 - end.getDay();
  return `<div class="grass" aria-hidden="true">${vals.map(([k, n]) => `<i class="${lv(n)}" title="${k.slice(5).replace('-', '/')} · ${n}"></i>`).join('')}${'<i class="fut"></i>'.repeat(fut)}</div>`;
}
async function renderHome(force){
  if (!homeData || force){
    $('#homeCards').innerHTML = '<p class="msg">불러오는 중...</p>';
    homeData = await loadStats();
    if (cur !== 'home') return;
  }
  const apps = ADMIN_GROUPS.flatMap(g => g.items.map(a => ({ a, g })));
  const withStat = apps.filter(({ a }) => STATS[a.admin]);
  const okData = withStat.map(({ a }) => homeData[a.admin]).filter(d => d && !d.error);
  const sum = f => okData.reduce((n, d) => n + f(d), 0);
  $('#homeSum').innerHTML = `
    <button type="button" data-rank="today" aria-expanded="${rankOpen === 'today'}"><small>오늘 전체</small><b>${sum(d => d.today)}회</b></button>
    <button type="button" data-rank="total" aria-expanded="${rankOpen === 'total'}"><small>누적 전체</small><b>${sum(d => d.total).toLocaleString()}회</b></button>
    <button type="button" data-rank="used" aria-expanded="${rankOpen === 'used'}"><small>오늘 쓰인 웹앱</small><b>${okData.filter(d => d.today).length} / ${withStat.length}개</b></button>`;
  renderRank();
  $('#homeCards').innerHTML = withStat.map(({ a, g }) => {
    const d = homeData[a.admin] || {}, unit = STATS[a.admin].unit;
    const body = d.error
      ? `<p class="msg">기록을 읽지 못했습니다 (${esc(d.error)})</p>`
      : `<div class="nums"><span><b>${d.today}</b><small>오늘 ${unit}</small></span><span class="tot"><b>${d.total.toLocaleString()}</b><small>누적</small></span></div>
         ${grass(d.days)}${d.devices ? `<p class="msg">기기 ${d.devices}대 · 잔디는 날짜별 들어온 기기 수</p>` : ''}`;
    return `<button type="button" class="card" data-open="${esc(a.admin)}">
      <span class="card-h"><span class="dot ${a.login}"></span>${esc(a.name)}<span class="grp">${esc(g.title)}</span></span>${body}</button>`;
  }).join('');
  renderOthers();
}

/* ---------- 그 밖의 웹앱: 순서·이름 바꾸기, 삭제 (moontr_config/adminHub 의 others 에 저장) ---------- */
let othersCfg = { order:[], names:{}, hidden:[] };
let othersEdit = false;
function othersList(){
  const today = ymd(new Date());
  const all = Object.keys(SITE_NAMES).map(k => ({ k, name: othersCfg.names[k] || SITE_NAMES[k], o: siteData[k] || { total:0, days:{} } }));
  const byVisit = (x, y) => (y.o.days[today] || 0) - (x.o.days[today] || 0) || y.o.total - x.o.total;
  const pos = k => { const i = othersCfg.order.indexOf(k); return i < 0 ? 1e9 : i; };
  all.sort((x, y) => othersCfg.order.length ? (pos(x.k) - pos(y.k)) || byVisit(x, y) : byVisit(x, y));
  return { today, shown: all.filter(r => !othersCfg.hidden.includes(r.k)), gone: all.filter(r => othersCfg.hidden.includes(r.k)) };
}
/* 즐겨찾기에 같은 주소가 있으면 그 [시트]·[코드] 버튼도 옆에 붙입니다 */
function otherLinks(k){
  const b = BOOKMARKS.flatMap(g => g.items).find(a => isHere(a.url) && new URL(a.url, location.origin).pathname.replace(/\/$/, '') === '/' + k);
  return b ? (b.links || []).map(l => { const i = linkInfo(l); return chip(i.label, i.href, i.cls); }).join('') : '';
}
function renderOthers(){
  if (!$('#homeNo')) return;
  const { today, shown, gone } = othersList();
  const sortLabel = othersCfg.order.length ? '내가 정한 순서' : '오늘 방문 많은 순';
  const row = (r, i) => othersEdit
    ? `<div class="orow edit" data-k="${esc(r.k)}">
        <span class="mv"><button type="button" data-up="${i}" aria-label="위로" ${i ? '' : 'disabled'}>▲</button><button type="button" data-down="${i}" aria-label="아래로" ${i < shown.length - 1 ? '' : 'disabled'}>▼</button></span>
        <input class="nm-in" value="${esc(r.name)}" data-name="${esc(r.k)}" aria-label="이름 (/${esc(r.k)})" maxlength="40">
        <span class="v">/${esc(r.k)}</span>
        <button type="button" class="odel" data-odel="${esc(r.k)}">삭제</button></div>`
    : `<div class="orow">
        <a class="nm" href="/${esc(r.k)}/" target="_blank" rel="noopener">${esc(r.name)}</a>
        <a class="addr" href="/${esc(r.k)}/" target="_blank" rel="noopener">moontr.site/${esc(r.k)}</a>
        <span class="ochips">${otherLinks(r.k)}</span>
        <span class="v"><b>${r.o.days[today] || 0}</b> 오늘</span><span class="v">${r.o.total.toLocaleString()} 누적</span>${grass(r.o.days)}
        ${(OTHER_LINKS[r.k] || []).length ? `<div class="olinks">${OTHER_LINKS[r.k].map(([t, u]) =>
          `<a href="${esc(u)}" target="_blank" rel="noopener"><span class="lb ${/spreadsheets/.test(u) ? 'sheet' : ''}">${esc(t)}</span>${esc(u.replace(/^https?:\/\//, ''))}</a>`).join('')}</div>` : ''}</div>`;
  $('#homeNo').innerHTML = `<div class="others-top"><h2 class="others-h">그 밖의 웹앱 <small>관리자 화면이 없는 웹앱 · ${sortLabel}</small></h2>
      ${othersEdit && othersCfg.order.length ? '<button type="button" class="btn" data-oreset>방문 많은 순으로 되돌리기</button>' : ''}
      <button type="button" class="btn" data-oedit aria-pressed="${othersEdit}">${othersEdit ? '편집 끝' : '편집'}</button></div>
    <div class="others">${shown.map(row).join('') || '<p class="msg">표시할 웹앱이 없습니다.</p>'}</div>
    ${othersEdit && gone.length ? `<div class="hiddenbox"><b>삭제한 웹앱 ${gone.length}개 — 되돌리면 다시 보입니다</b>${gone.map(r =>
      `<div class="row"><span>${esc(r.name)} (/${esc(r.k)})</span><button type="button" data-oundo="${esc(r.k)}">되돌리기</button></div>`).join('')}</div>` : ''}`;
}
async function saveOthers(){
  try { await setDoc(HIDDEN_DOC, { others: othersCfg }, { mergeFields: ['others'] }); }
  catch (err){ alert('저장하지 못했습니다: ' + err.message); }
}
$('#homeNo').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.hasAttribute('data-oedit')){ othersEdit = !othersEdit; return renderOthers(); }
  if (b.hasAttribute('data-oreset')){ if (confirm('순서를 오늘 방문 많은 순으로 되돌릴까요?')){ othersCfg.order = []; saveOthers(); renderOthers(); } return; }
  const keys = othersList().shown.map(r => r.k);
  if (b.dataset.up !== undefined || b.dataset.down !== undefined){
    const i = +(b.dataset.up ?? b.dataset.down), j = b.dataset.up !== undefined ? i - 1 : i + 1;
    if (j < 0 || j >= keys.length) return;
    [keys[i], keys[j]] = [keys[j], keys[i]];
    othersCfg.order = [...keys, ...othersCfg.hidden];
    saveOthers(); renderOthers();
    $(`#homeNo [data-${j < i ? 'up' : 'down'}="${j}"]`)?.focus();
    return;
  }
  if (b.dataset.odel){
    const name = othersList().shown.find(r => r.k === b.dataset.odel)?.name || b.dataset.odel;
    if (!confirm(`'${name}'을(를) 이 표에서 삭제할까요?\n(웹앱 자체는 지워지지 않고, 편집에서 되돌릴 수 있습니다)`)) return;
    othersCfg.hidden = [...new Set([...othersCfg.hidden, b.dataset.odel])];
    saveOthers(); renderOthers(); return;
  }
  if (b.dataset.oundo){ othersCfg.hidden = othersCfg.hidden.filter(k => k !== b.dataset.oundo); saveOthers(); renderOthers(); }
});
/* 이름은 칸에서 나가거나 Enter 를 누르면 저장 (비우면 원래 이름) */
$('#homeNo').addEventListener('change', e => {
  const inp = e.target.closest('[data-name]'); if (!inp) return;
  const k = inp.dataset.name, v = inp.value.trim();
  if (!v || v === SITE_NAMES[k]) delete othersCfg.names[k]; else othersCfg.names[k] = v;
  saveOthers();
});
$('#homeNo').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('[data-name]')) e.target.blur(); });
/* 요약 칸을 누르면 아래로 순위가 열립니다 (많은 순) */
let rankOpen = null;
function renderRank(){
  const box = $('#homeRank');
  if (!rankOpen || !homeData){ box.hidden = true; return; }
  const key = rankOpen === 'total' ? 'total' : 'today';
  const rows = ADMIN_GROUPS.flatMap(g => g.items).filter(a => STATS[a.admin])
    .map(a => ({ a, d: homeData[a.admin] || {} })).filter(r => !r.d.error)
    .map(r => ({ ...r, v: r.d[key] || 0 })).sort((x, y) => y.v - x.v);
  const list = rankOpen === 'used' ? rows.filter(r => r.v > 0) : rows;
  const max = Math.max(1, ...list.map(r => r.v));
  const title = { today:'오늘 방문이 많은 웹앱', total:'누적 방문이 많은 웹앱', used:'오늘 쓰인 웹앱 (많이 쓰인 순)' }[rankOpen];
  const unused = rankOpen === 'used' ? rows.filter(r => !r.v).map(r => r.a.name) : [];
  box.innerHTML = `<h3>${title}</h3>${list.map((r, i) => `
    <button type="button" class="rank-row ${r.v ? '' : 'zero'}" data-open="${esc(r.a.admin)}">
      <span class="no">${i + 1}</span><span class="nm"><span class="dot ${r.a.login}"></span>${esc(r.a.name)}</span>
      <span class="bar"><i style="width:${Math.round(r.v / max * 100)}%"></i></span>
      <span class="v">${r.v.toLocaleString()}${STATS[r.a.admin].unit === '출석' ? '명' : '회'}</span></button>`).join('') || '<p class="foot">오늘은 아직 쓰인 웹앱이 없습니다.</p>'}
    ${unused.length ? `<p class="foot">오늘 안 쓰인 웹앱: ${unused.map(esc).join(', ')}</p>` : ''}
    <p class="foot">줄을 누르면 그 관리자 화면이 열립니다.</p>`;
  box.hidden = false;
}
$('#homeSum').addEventListener('click', e => {
  const b = e.target.closest('[data-rank]'); if (!b) return;
  rankOpen = rankOpen === b.dataset.rank ? null : b.dataset.rank;
  $('#homeSum').querySelectorAll('[data-rank]').forEach(x => x.setAttribute('aria-expanded', x.dataset.rank === rankOpen));
  renderRank();
});
$('#homeRank').addEventListener('click', e => {
  const c = e.target.closest('[data-open]'); if (!c) return;
  show(ALL_APPS.find(a => a.admin === c.dataset.open));
});
$('#homeCards').addEventListener('click', e => {
  const c = e.target.closest('[data-open]'); if (!c) return;
  show(ALL_APPS.find(a => a.admin === c.dataset.open));
});
$('#homeReload').addEventListener('click', () => renderHome(true));

const COLORS = ['#1F3A6B','#1F7A65','#B8573A','#8A5AA8','#2C7FC0','#9A7B1C'];
const FOLDER = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.6l2 2h8.4A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>';
const host = u => { try { return new URL(u, location.origin).host; } catch { return ''; } };
const isHere = u => host(u) === location.host;
function icon(a, gi){
  if (!isHere(a.url)) return `<img class="ic" src="https://www.google.com/s2/favicons?domain=${esc(host(a.url))}&sz=64" alt="" loading="lazy">`;
  return `<span class="ic" style="background:${COLORS[gi % COLORS.length]}">${esc(a.name.replace(/^\//, '').charAt(0))}</span>`;
}
function linkInfo(l){
  const [label, href] = Array.isArray(l) ? l : [null, l];
  if (label) return { label, href, cls:'etc' };
  if (/docs\.google\.com\/spreadsheets/.test(href)) return { label:'시트', href, cls:'sheet' };
  if (/github\.com/.test(href)) return { label:'코드', href, cls:'code' };
  if (/drive\.google\.com/.test(href)) return { label:'드라이브', href, cls:'etc' };
  return { label:'관리', href, cls:'etc' };
}
const chip = (label, href, cls) => `<a class="chip ${cls}" href="${esc(href)}" target="_blank" rel="noopener"><span>${esc(label)}</span></a>`;
const chips = a => `<span class="chips">${a.admin ? chip('관리자', a.admin, 'adm') : ''}${(a.links || []).map(l => { const i = linkInfo(l); return chip(i.label, i.href, i.cls); }).join('')}<button type="button" class="del" data-del="${esc(a.url)}">삭제</button></span>`;
const go = (a, gi, inner) => `<a class="go" href="${esc(a.url)}" target="_blank" rel="noopener" title="${esc(host(a.url))}">${icon(a, gi)}${inner}</a>`;
const cls = a => [a.sub ? 'sub' : '', a.gap ? 'gap' : ''].join(' ');

let hidden = [];
const shown = g => ({ ...g, items: g.items.filter(a => !hidden.includes(a.url)) });
const each = fn => BOOKMARKS.map((g, gi) => [shown(g), gi]).filter(([g]) => g.items.length).map(([g, gi]) => fn(g, gi)).join('');

  tree: { label:'폴더', render: () => `

  list: { label:'자세히', render: () => `

    </div>` }
};
let view = 'cols';
try { if (VIEWS[localStorage.getItem('hub-view')]) view = localStorage.getItem('hub-view'); } catch {}

function renderBm(){

    .replace(/href="#" target="_blank" rel="noopener"/g, 'tabindex="-1" aria-hidden="true"') + VIEWS[view].render() + hiddenBox();

function hiddenBox(){
  if (!document.body.classList.contains('editing') || !hidden.length) return '';
  const all = BOOKMARKS.flatMap(g => g.items);
  return `<div class="hiddenbox"><b>삭제한 항목 ${hidden.length}개 — 되돌리면 다시 보입니다</b>${hidden.map(h => {
    const a = all.find(x => x.url === h);
    return `<div class="row"><span>${esc(a ? a.name : h)}</span><button type="button" data-undo="${esc(h)}">되돌리기</button></div>`;
  }).join('')}</div>`;
}
async function saveHidden(next){
  try { await setDoc(HIDDEN_DOC, { hidden: next }, { mergeFields: ['hidden'] }); }
  catch (err){ alert('저장하지 못했습니다: ' + err.message); }
}
$('#views').addEventListener('click', e => {
  const b = e.target.closest('button[data-v]'); if (!b) return;
  view = b.dataset.v;
  try { localStorage.setItem('hub-view', view); } catch {}
  renderBm();
});
$('#edit').addEventListener('click', () => {
  const on = !document.body.classList.contains('editing');
  document.body.classList.toggle('editing', on);
  $('#edit').setAttribute('aria-pressed', on);
  $('#edit .t').textContent = on ? '편집 끝' : '편집';
  renderBm();
});
$('#bmList').addEventListener('click', e => {
  const d = e.target.closest('[data-del]'), u = e.target.closest('[data-undo]');
  if (d){
    e.preventDefault();
    const a = BOOKMARKS.flatMap(g => g.items).find(x => x.url === d.dataset.del);
    if (confirm(`'${a ? a.name : d.dataset.del}'을(를) 즐겨찾기에서 삭제할까요?\n(사이트 자체는 지워지지 않고, 편집에서 되돌릴 수 있습니다)`))
      saveHidden([...new Set([...hidden, d.dataset.del])]);
  }
  if (u) saveHidden(hidden.filter(h => h !== u.dataset.undo));
});
document.addEventListener('click', e => {
  document.querySelectorAll('.v-bar details[open]').forEach(d => { if (!d.contains(e.target)) d.open = false; });
});

/* ============================================================
   로그인
   ============================================================ */
let unsubHidden = null;
onAuthStateChanged(auth, user => {
  const ok = !!user && user.email === ADMIN_EMAIL;
  $('#login').hidden = ok;
  $('#acts').hidden = $('#tabs').hidden = !ok;
  if (ok) show(cur);
  else { $('#stage').hidden = $('#bm').hidden = $('#home').hidden = true; homeData = null; $('#frame').removeAttribute('src'); delete $('#frame').dataset.src; $('#pw').focus(); }
  if (ok && !unsubHidden) unsubHidden = onSnapshot(HIDDEN_DOC, snap => {
    hidden = (snap.exists() && Array.isArray(snap.data().hidden)) ? snap.data().hidden : [];
    const o = (snap.exists() && snap.data().others) || {};
    othersCfg = { order: Array.isArray(o.order) ? o.order : [], names: o.names || {}, hidden: Array.isArray(o.hidden) ? o.hidden : [] };
    if (!cur) renderBm();
    if (cur === 'home' && homeData && !document.activeElement?.matches?.('[data-name]')) renderOthers();
  }, () => {});
  if (!ok && unsubHidden){ unsubHidden(); unsubHidden = null; }
});
$('#login').addEventListener('submit', async e => {
  e.preventDefault();
  $('#err').textContent = '';
  try { await signInWithEmailAndPassword(auth, ADMIN_EMAIL, $('#pw').value); }
  catch { $('#err').textContent = '로그인 실패: 비밀번호를 확인해 주세요'; }
  $('#pw').value = '';
});
$('#logout').addEventListener('click', () => { if (confirm('로그아웃할까요?')) signOut(auth); });
</script>
