<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>관리자 허브 · moontr.site</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap">
<style>
:root{
  --ink:#17324A; --muted:#5A6F80; --cream:#F7F4EC; --line:#E4DED0; --paper:#fff; --hover:#EEF4F7;
  --fb:#1F9A7A; --pw:#D98A2B; --gs:#2C7FC0;
}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;font-family:'Gowun Dodum',sans-serif;font-size:15px;color:var(--ink);background:var(--cream)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #1E6FA8;outline-offset:2px}

/* 위쪽 막대 */
.bar{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;padding:.7rem clamp(16px,3vw,40px);border-bottom:1px solid var(--line);background:var(--paper)}
.bar h1{margin:0;font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:1.5rem}
.bar .home{font-size:.85rem;color:var(--muted)}
.views{display:flex;gap:2px;margin-left:auto;padding:3px;background:#F1EDE3;border-radius:999px}
.views button{min-height:34px;padding:0 .8rem;border:0;border-radius:999px;background:none;cursor:pointer;font-size:.85rem;color:var(--muted)}
.views button[aria-pressed="true"]{background:var(--ink);color:#fff}
#logout{min-height:34px;padding:0 .9rem;border:1px solid var(--line);border-radius:999px;background:var(--paper);cursor:pointer;font-size:.85rem}
[hidden]{display:none !important}

main{padding:1rem clamp(16px,3vw,40px) 2rem}
.legend{display:flex;gap:1rem;flex-wrap:wrap;margin:0 0 .9rem;font-size:.8rem;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.35rem;vertical-align:middle}
.dot.fb{background:var(--fb)}.dot.pw{background:var(--pw)}.dot.gs{background:var(--gs)}

/* 로그인 */
.login{max-width:380px;margin:3rem auto;background:var(--paper);border-radius:1rem;padding:1.5rem}
.login input{width:100%;padding:.8rem;font-size:1.2rem;letter-spacing:.3em;text-align:center;border-radius:.6rem;border:1px solid #ccc;margin:.6rem 0}
.login button{width:100%;min-height:46px;border:0;border-radius:.6rem;background:var(--ink);color:#fff;font-weight:700;cursor:pointer}
.err{color:#B3261E;min-height:1.4em;margin:.6rem 0 0;font-size:.9rem}

/* 공통: 작은 아이콘 */
.ic{flex:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;color:#fff;font-size:.72rem;font-weight:700}
.stu{flex:none;font-size:.75rem;color:var(--muted);padding:.15rem .5rem;border:1px solid var(--line);border-radius:999px;background:var(--paper)}
.stu:hover{color:var(--ink);border-color:var(--muted)}

/* ① 즐겨찾기 막대 */
.v-bar .bm{display:flex;flex-wrap:wrap;gap:4px;padding:6px;background:var(--paper);border:1px solid var(--line);border-radius:10px}
.v-bar details{position:relative}
.v-bar summary{list-style:none;display:flex;align-items:center;gap:.4rem;min-height:36px;padding:0 .8rem;border-radius:8px;cursor:pointer;font-size:.9rem}
.v-bar summary::-webkit-details-marker{display:none}
.v-bar summary:hover,.v-bar details[open] summary{background:var(--hover)}
.v-bar summary svg{width:16px;height:16px;color:#C9A227}
.v-bar .menu{position:absolute;left:0;top:calc(100% + 4px);z-index:5;min-width:300px;padding:6px;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 30px -12px rgba(0,0,0,.3)}
.v-bar .row{display:flex;align-items:center;gap:.6rem;padding:.45rem .6rem;border-radius:7px}
.v-bar .row:hover{background:var(--hover)}
.v-bar .row a.go{flex:1;display:flex;align-items:center;gap:.6rem}
.v-bar .tip{margin:.9rem .2rem 0;font-size:.85rem;color:var(--muted)}

/* ② 폴더 트리 */
.v-tree{columns:2 360px;column-gap:2rem}
.v-tree details{break-inside:avoid;margin:0 0 .6rem}
.v-tree summary{display:flex;align-items:center;gap:.45rem;min-height:32px;cursor:pointer;font-weight:700}
.v-tree summary svg{width:18px;height:18px;color:#C9A227}
.v-tree summary small{font-weight:400;color:var(--muted)}
.v-tree ul{list-style:none;margin:0 0 0 .6rem;padding:0 0 0 1rem;border-left:1px dashed var(--line)}
.v-tree li{display:flex;align-items:center;gap:.55rem;min-height:32px;padding:0 .4rem;border-radius:6px}
.v-tree li:hover{background:var(--paper)}
.v-tree li a.go{display:flex;align-items:center;gap:.55rem;min-width:0;flex:1}
.v-tree li .d{color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ③ 자세히 보기 */
.v-list table{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:.9rem}
.v-list th{text-align:left;font-weight:400;font-size:.78rem;color:var(--muted);padding:.5rem .8rem;border-bottom:1px solid var(--line);background:#FBFAF6}
.v-list td{padding:0 .8rem;height:34px;border-bottom:1px solid #F1EDE3;white-space:nowrap}
.v-list tr.grp td{height:28px;background:#FBFAF6;font-size:.78rem;color:var(--muted);font-weight:700}
.v-list tr.it:hover td{background:var(--hover)}
.v-list td a.go{display:flex;align-items:center;gap:.55rem}
.v-list td.d{color:var(--muted);font-size:.82rem;white-space:normal}
.v-list td.lg{font-size:.8rem;color:var(--muted)}

/* ④ 큰 아이콘 */
.v-icons section{margin-bottom:1rem}
.v-icons h2{margin:0 0 .4rem;font-size:.8rem;font-weight:700;color:var(--muted)}
.v-icons .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:.4rem}
.v-icons .tile{display:flex;flex-direction:column;align-items:center;gap:.35rem;padding:.7rem .3rem .5rem;border-radius:10px;text-align:center}
.v-icons .tile:hover{background:var(--paper)}
.v-icons .tile .ic{width:48px;height:48px;border-radius:14px;font-size:1.2rem;position:relative}
.v-icons .tile .ic .dot{position:absolute;right:-3px;bottom:-3px;margin:0;border:2px solid var(--cream);width:12px;height:12px}
.v-icons .tile b{font-weight:400;font-size:.82rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.v-icons .tile .stu{font-size:.68rem;padding:.05rem .45rem}

/* ⑤ 칸 나누기 */
.v-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.8rem;align-items:start}
.v-cols section{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:.6rem}
.v-cols h2{margin:0 0 .3rem;padding:.2rem .4rem;font-size:.85rem}
.v-cols h2 small{font-weight:400;color:var(--muted)}
.v-cols .row{display:flex;align-items:center;gap:.5rem;min-height:36px;padding:0 .4rem;border-radius:7px}
.v-cols .row:hover{background:var(--hover)}
.v-cols .row a.go{flex:1;display:flex;align-items:center;gap:.5rem;min-width:0;font-size:.9rem}
.v-cols .row a.go span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-cols .row .stu{opacity:0}
.v-cols .row:hover .stu,.v-cols .row .stu:focus-visible{opacity:1}

/* 편집(삭제) */
#edit{min-height:34px;padding:0 .9rem;border:1px solid var(--line);border-radius:999px;background:var(--paper);cursor:pointer;font-size:.85rem}
#edit[aria-pressed="true"]{background:#B3261E;border-color:#B3261E;color:#fff}
.del{display:none;flex:none;border:0;background:#FBE4E2;color:#B3261E;border-radius:999px;padding:.15rem .55rem;font-size:.75rem;cursor:pointer}
body.editing .del{display:inline-block}
body.editing .v-cols .row .stu{opacity:1}
.v-icons .tile .del{font-size:.68rem;padding:.05rem .45rem}
.hiddenbox{margin-top:1.4rem;padding:.8rem 1rem;background:var(--paper);border:1px dashed var(--line);border-radius:10px;font-size:.85rem}
.hiddenbox b{display:block;margin-bottom:.4rem;color:var(--muted);font-weight:400}
.hiddenbox .row{display:flex;align-items:center;gap:.6rem;min-height:32px}
.hiddenbox .row span{flex:1;color:var(--muted);text-decoration:line-through}
.hiddenbox button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:.15rem .7rem;font-size:.78rem;cursor:pointer}

@media (max-width:640px){
  .views{margin-left:0;width:100%;overflow-x:auto}
  .v-list td.d,.v-list th.d,.v-list td.lg,.v-list th.lg{display:none}
  .v-bar .menu{min-width:min(300px,calc(100vw - 32px))}
  .v-cols .row .stu{opacity:1}
}
</style>
</head>
<body>

<header class="bar">
  <h1>관리자 허브</h1>
  <a class="home" href="/">moontr.site</a>
  <nav class="views" id="views" aria-label="보기 방식" hidden></nav>
  <button type="button" id="edit" aria-pressed="false" hidden>편집</button>
  <button type="button" id="logout" hidden>로그아웃</button>
</header>

<main>
  <form class="login" id="login" hidden>
    <label for="pw">관리자 비밀번호(숫자 6자리)</label>
    <input type="password" id="pw" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="숫자 6자리" autocomplete="current-password" required>
    <button type="submit">로그인</button>
    <p class="err" id="err" role="alert"></p>
  </form>

  <div id="list" hidden></div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyA3CxawUPIfGeBWyffsNbCSM3ymjKHLH6o",
  authDomain: "moon-d528d.firebaseapp.com",
  projectId: "moon-d528d",
  storageBucket: "moon-d528d.firebasestorage.app",
  messagingSenderId: "126636401536",
  appId: "1:126636401536:web:25b8a8296ec42b86f99765"
};
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
/* 허브에서 삭제한 항목(관리자 주소 목록)은 여기에 저장됩니다 → 어느 기기에서 열어도 똑같이 보입니다 */
const HIDDEN_DOC = doc(db, 'moontr_config', 'adminHub');
const ADMIN_EMAIL = 'anstjsdud@sen.go.kr';

/* ============================================================
   ✏️ 여기만 고치면 됩니다 — 웹앱이 늘면 줄 하나 추가
   login: 'fb' = 여기서 로그인하면 자동으로 들어가짐
          'pw' = 다른 주소라 처음 한 번은 같은 비밀번호 입력
          'gs' = 구글 앱스 스크립트(구글 계정으로 확인)
   student: 학생용 주소 (없으면 비워 두기)
   ============================================================ */
const GROUPS = [
  { title:'대문', items:[
    { name:'대문 시간표', desc:'종 시간과 요일별 시간표 편집', admin:'/#admin', student:'/', login:'fb' }
  ]},
  { title:'기출 학습', items:[
    { name:'생윤 만점 다이어리', desc:'문항 관리 · 학생 기록', admin:'/app/?admin', student:'/app/', login:'fb' },
    { name:'윤사 만점 다이어리', desc:'문항 관리 · 학생 기록', admin:'/idea/?admin', student:'/idea/', login:'fb' }
  ]},
  { title:'수업 도구', items:[
    { name:'출석체크', desc:'분반 수업 출석 확인 · 질문 목록', admin:'/check04/#teacher', student:'/check04/', login:'fb' },
    { name:'바이브코딩 매뉴얼', desc:'이미지 · 코드 · 방문 기록', admin:'/vibe/?admin', student:'/vibe/', login:'fb' },
    { name:'9월 컨설팅장학 수업 사례', desc:'사진 · 접속 기록', admin:'/0911/#admin', student:'/0911/', login:'fb' }
  ]},
  { title:'행사 · 연수', items:[
    { name:'진선 50주년 기념', desc:'안내글 · 후원 · 방명록 승인 · 갤러리 · 사진 제보', admin:'https://jinseon50th.com/#admin', student:'https://jinseon50th.com/', login:'pw' },
    { name:'50주년 해외연수', desc:'카테고리 · 항목 · 메모 · 접속 기록', admin:'https://jinseon50th.com/gt/#admin', student:'https://jinseon50th.com/gt/', login:'pw' }
  ]},
  { title:'교사용 화면 (앱스 스크립트)', items:[
    { name:'/ct 교사용', desc:'학생용은 /cs', admin:'/ct/', student:'/cs/', login:'gs' },
    { name:'/ct1 교사용', desc:'학생용은 /cs1', admin:'/ct1/', student:'/cs1/', login:'gs' },
    { name:'/ct2 교사용', desc:'학생용은 /cs2', admin:'/ct2/', student:'/cs2/', login:'gs' },
    { name:'/ct8 교사용', desc:'학생용은 /cs8', admin:'/ct8/', student:'/cs8/', login:'gs' }
  ]}
];

/* ============================================================
   아래부터는 작동 코드 (고치지 않아도 됩니다)
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TAG = { fb:'자동 로그인', pw:'다른 주소 (처음 한 번 비밀번호)', gs:'구글 계정' };
const COLORS = ['#17324A','#1F7A65','#B8573A','#8A5AA8','#2C7FC0','#9A7B1C'];
const FOLDER = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.6l2 2h8.4A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>';

const icon = (a, gi) => `<span class="ic" style="background:${COLORS[gi % COLORS.length]}">${esc(a.name.replace(/^\//, '').charAt(0))}</span>`;
const go = (a, gi, inner) => `<a class="go" href="${esc(a.admin)}" title="${esc(a.desc || '')}">${icon(a, gi)}${inner}</a>`;
const stu = a => (a.student ? `<a class="stu" href="${esc(a.student)}">학생용</a>` : '') +
  `<button type="button" class="del" data-del="${esc(a.admin)}">삭제</button>`;
let hidden = [];
const shown = g => ({ ...g, items: g.items.filter(a => !hidden.includes(a.admin)) });
const each = fn => GROUPS.map((g, gi) => [shown(g), gi]).filter(([g]) => g.items.length).map(([g, gi]) => fn(g, gi)).join('');

/* 보기 방식 다섯 가지 */
const VIEWS = {
  bar:  { label:'즐겨찾기 막대', render: () => `
    <div class="v-bar">
      <div class="bm">${each((g, gi) => `
        <details><summary>${FOLDER}${esc(g.title)}</summary>
          <div class="menu">${g.items.map(a => `<div class="row">${go(a, gi, `<span>${esc(a.name)}</span>`)}<span class="dot ${a.login}"></span>${stu(a)}</div>`).join('')}</div>
        </details>`)}
      </div>
      <p class="tip">폴더를 누르면 목록이 열립니다. 이름을 누르면 관리자 화면으로 갑니다.</p>
    </div>` },
  tree: { label:'폴더', render: () => `
    <div class="v-tree">${each((g, gi) => `
      <details open><summary>${FOLDER}${esc(g.title)} <small>${g.items.length}</small></summary>
        <ul>${g.items.map(a => `<li>${go(a, gi, `<span>${esc(a.name)}</span><span class="d">${esc(a.desc || '')}</span>`)}<span class="dot ${a.login}"></span>${stu(a)}</li>`).join('')}</ul>
      </details>`)}
    </div>` },
  list: { label:'자세히', render: () => `
    <div class="v-list"><table>
      <thead><tr><th>이름</th><th class="d">하는 일</th><th class="lg">로그인</th><th></th></tr></thead>
      <tbody>${each((g, gi) => `<tr class="grp"><td colspan="4">${esc(g.title)}</td></tr>` + g.items.map(a => `
        <tr class="it"><td>${go(a, gi, `<span>${esc(a.name)}</span>`)}</td><td class="d">${esc(a.desc || '')}</td>
        <td class="lg"><span class="dot ${a.login}"></span>${TAG[a.login].split(' (')[0]}</td><td>${stu(a)}</td></tr>`).join(''))}
      </tbody></table></div>` },
  icons:{ label:'큰 아이콘', render: () => `
    <div class="v-icons">${each((g, gi) => `
      <section><h2>${esc(g.title)}</h2><div class="tiles">${g.items.map(a => `
        <div class="tile"><a class="go" href="${esc(a.admin)}" title="${esc(a.desc || '')}" style="display:contents">
          <span class="ic" style="background:${COLORS[gi % COLORS.length]}">${esc(a.name.replace(/^\//, '').charAt(0))}<span class="dot ${a.login}"></span></span>
          <b>${esc(a.name)}</b></a>${stu(a)}</div>`).join('')}</div></section>`)}
    </div>` },
  cols: { label:'칸 나누기', render: () => `
    <div class="v-cols">${each((g, gi) => `
      <section><h2>${esc(g.title)} <small>${g.items.length}</small></h2>
        ${g.items.map(a => `<div class="row">${go(a, gi, `<span>${esc(a.name)}</span>`)}<span class="dot ${a.login}"></span>${stu(a)}</div>`).join('')}
      </section>`)}
    </div>` }
};

let view = 'cols';
try { if (VIEWS[localStorage.getItem('hub-view')]) view = localStorage.getItem('hub-view'); } catch {}

function renderViews(){
  $('#views').innerHTML = Object.entries(VIEWS).map(([k, v]) =>
    `<button type="button" data-v="${k}" aria-pressed="${k === view}">${v.label}</button>`).join('');
}
function renderList(){
  $('#list').innerHTML = `<p class="legend">${Object.entries(TAG).map(([k, t]) => `<span><span class="dot ${k}"></span>${t}</span>`).join('')}</p>` + VIEWS[view].render() + hiddenBox();
}
function hiddenBox(){
  if (!document.body.classList.contains('editing') || !hidden.length) return '';
  const all = GROUPS.flatMap(g => g.items);
  return `<div class="hiddenbox"><b>삭제한 항목 ${hidden.length}개 — 되돌리면 다시 보입니다</b>${hidden.map(h => {
    const a = all.find(x => x.admin === h);
    return `<div class="row"><span>${esc(a ? a.name : h)}</span><button type="button" data-undo="${esc(h)}">되돌리기</button></div>`;
  }).join('')}</div>`;
}
async function saveHidden(next){
  try { await setDoc(HIDDEN_DOC, { hidden: next }); }
  catch (err){ alert('저장하지 못했습니다: ' + err.message); }
}
$('#edit').addEventListener('click', () => {
  const on = !document.body.classList.contains('editing');
  document.body.classList.toggle('editing', on);
  $('#edit').setAttribute('aria-pressed', on);
  $('#edit').textContent = on ? '편집 끝' : '편집';
  renderList();
});
$('#list').addEventListener('click', e => {
  const d = e.target.closest('[data-del]'), u = e.target.closest('[data-undo]');
  if (d){
    e.preventDefault();
    const a = GROUPS.flatMap(g => g.items).find(x => x.admin === d.dataset.del);
    if (confirm(`'${a ? a.name : d.dataset.del}'을(를) 허브에서 삭제할까요?
(앱 자체는 지워지지 않고, 편집에서 되돌릴 수 있습니다)`))
      saveHidden([...new Set([...hidden, d.dataset.del])]);
  }
  if (u) saveHidden(hidden.filter(h => h !== u.dataset.undo));
});
$('#views').addEventListener('click', e => {
  const b = e.target.closest('button[data-v]'); if (!b) return;
  view = b.dataset.v;
  try { localStorage.setItem('hub-view', view); } catch {}
  renderViews(); renderList();
});
/* 즐겨찾기 막대: 하나를 열면 다른 폴더는 닫고, 바깥을 누르면 닫기 */
document.addEventListener('click', e => {
  document.querySelectorAll('.v-bar details[open]').forEach(d => { if (!d.contains(e.target)) d.open = false; });
});

let unsubHidden = null;
onAuthStateChanged(auth, user => {
  const ok = !!user && user.email === ADMIN_EMAIL;
  $('#login').hidden = ok;
  $('#list').hidden = !ok;
  $('#logout').hidden = !ok;
  $('#views').hidden = !ok;
  $('#edit').hidden = !ok;
  if (ok){ renderViews(); renderList(); } else $('#pw').focus();
  if (ok && !unsubHidden) unsubHidden = onSnapshot(HIDDEN_DOC, snap => {
    hidden = (snap.exists() && Array.isArray(snap.data().hidden)) ? snap.data().hidden : [];
    renderList();
  }, () => {});
  if (!ok && unsubHidden){ unsubHidden(); unsubHidden = null; }
});

$('#login').addEventListener('submit', async e => {
  e.preventDefault();
  $('#err').textContent = '';
  try { await signInWithEmailAndPassword(auth, ADMIN_EMAIL, $('#pw').value); }
  catch { $('#err').textContent = '로그인 실패: 비밀번호를 확인해 주세요'; }
  $('#pw').value = '';
});
$('#logout').addEventListener('click', () => signOut(auth));
</script>
</body>
</html>
