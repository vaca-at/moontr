<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4명 사다리 게임</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
         background: #EEF4FF; font-family: "Malgun Gothic", sans-serif; color: #1E2A55; }
  h1 { margin: 0; font-size: 30px; }
  .row { display: grid; grid-template-columns: repeat(4, 80px); gap: 0; text-align: center; }
  .row button { margin: 0 6px; padding: 10px 0; border: none; border-radius: 12px; background: #4F6BFF; color: #fff; font-size: 17px; font-weight: bold; cursor: pointer; }
  .row div { margin: 0 6px; padding: 10px 0; border-radius: 12px; background: #fff; font-weight: bold; }
  canvas { width: 320px; height: 300px; }
  #again { padding: 10px 26px; border: 2px solid #4F6BFF; border-radius: 999px; background: #fff; color: #4F6BFF; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
  <h1>🪜 4명 사다리 게임</h1>
  <div class="row" id="names"></div>
  <canvas id="ladder" width="320" height="300"></canvas>
  <div class="row" id="prizes"></div>
  <button id="again">새 사다리</button>

<script>
  // ✏️ 이름과 결과를 바꿔 보세요
  const NAMES = ["민준", "서연", "하준", "지우"];
  const PRIZES = ["청소", "꽝", "간식", "꽝"];
  const COLORS = ["#FF6B6B", "#FFB020", "#2DBE7E", "#B05CFF"];

  const canvas = document.getElementById("ladder");
  const pen = canvas.getContext("2d");
  const X = [40, 120, 200, 280];   // 세로줄 4개의 위치
  const STEPS = 8;                  // 가로줄을 놓을 수 있는 칸 수
  let rungs = [];                   // rungs[칸][줄] = true 면 그 줄과 오른쪽 줄 사이에 가로줄

  // 새 사다리 만들기 (가로줄이 붙어 있지 않게)
  function makeLadder() {
    rungs = [];
    for (let s = 0; s < STEPS; s++) {
      const line = [false, false, false];
      for (let c = 0; c < 3; c++) {
        if (Math.random() < 0.5 && !(c > 0 && line[c - 1])) line[c] = true;
      }
      rungs.push(line);
    }
    draw();
  }

  // 사다리 그리기
  function draw() {
    pen.clearRect(0, 0, 320, 300);
    pen.strokeStyle = "#B8C3E6";
    pen.lineWidth = 4;
    X.forEach(x => { pen.beginPath(); pen.moveTo(x, 0); pen.lineTo(x, 300); pen.stroke(); });
    rungs.forEach((line, s) => line.forEach((on, c) => {
      if (!on) return;
      const y = 30 + s * 32;
      pen.beginPath(); pen.moveTo(X[c], y); pen.lineTo(X[c + 1], y); pen.stroke();
    }));
  }

  // 이름을 누르면: 사다리를 따라 내려가요
  function go(start) {
    let col = start;
    const path = [[X[col], 0]];
    rungs.forEach((line, s) => {
      const y = 30 + s * 32;
      if (line[col]) { path.push([X[col], y], [X[col + 1], y]); col++; }
      else if (col > 0 && line[col - 1]) { path.push([X[col], y], [X[col - 1], y]); col--; }
    });
    path.push([X[col], 300]);
    // 한 칸씩 천천히 그려요
    let i = 1;
    pen.strokeStyle = COLORS[start];
    pen.lineWidth = 6;
    const timer = setInterval(() => {
      pen.beginPath(); pen.moveTo(...path[i - 1]); pen.lineTo(...path[i]); pen.stroke();
      i++;
      if (i >= path.length) {
        clearInterval(timer);
        setTimeout(() => alert(`${NAMES[start]} → ${PRIZES[col]}`), 100);
      }
    }, 150);
  }

  document.getElementById("names").innerHTML = NAMES.map((n, i) => `<button onclick="go(${i})">${n}</button>`).join("");
  document.getElementById("prizes").innerHTML = PRIZES.map(p => `<div>${p}</div>`).join("");
  document.getElementById("again").onclick = makeLadder;
  makeLadder();
</script>
</body>
</html>
