<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>롤스의 정의론 OX 퀴즈</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #F6F0FF; font-family: "Malgun Gothic", sans-serif; color: #2E2245; }
  .card { width: min(92vw, 440px); background: #fff; border-radius: 24px; padding: 28px; box-shadow: 0 10px 30px rgba(90, 60, 160, .15); text-align: center; }
  h1 { margin: 0 0 6px; font-size: 26px; }
  #q { font-size: 20px; font-weight: bold; margin: 18px 0; min-height: 84px; line-height: 1.5; }
  .ox { display: flex; gap: 14px; justify-content: center; }
  .ox button { width: 110px; height: 90px; border: none; border-radius: 20px; font-size: 48px; font-weight: bold; color: #fff; cursor: pointer; }
  .o { background: #3B82F6; }
  .x { background: #EF4444; }
  #why { min-height: 60px; margin-top: 16px; line-height: 1.5; }
  .next { margin-top: 10px; padding: 10px 28px; border: none; border-radius: 999px; background: #8B5CF6; color: #fff; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
  <div class="card" id="card"></div>

<script>
  // ✏️ 문제와 정답(O 또는 X), 풀이를 바꿔 보세요
  const QUIZ = [
    { q: "롤스는 '무지의 베일'을 쓰고 정의의 원칙을 정해야 한다고 했다.", a: "O",
      why: "내가 부자인지, 가난한지 모르는 상태여야 모두에게 공정한 규칙을 고를 수 있다고 봤어요." },
    { q: "롤스는 사회의 모든 불평등을 없애야 한다고 했다.", a: "X",
      why: "차등의 원칙: 가장 불리한 사람에게 가장 큰 이익이 되는 불평등은 허용할 수 있다고 했어요." },
    { q: "롤스는 기본적인 자유를 모든 사람에게 똑같이 보장해야 한다고 했다.", a: "O",
      why: "평등한 자유의 원칙: 생각 · 말 · 종교의 자유 같은 기본적 자유는 모두에게 똑같이!" },
  ];

  let n = 0;
  let score = 0;
  const card = document.getElementById("card");

  // 문제 보여 주기
  function show() {
    card.innerHTML = `
      <h1>⚖️ 롤스의 정의론 OX 퀴즈</h1>
      <div>${n + 1} / ${QUIZ.length}</div>
      <p id="q">${QUIZ[n].q}</p>
      <div class="ox"><button class="o" onclick="answer('O')">O</button><button class="x" onclick="answer('X')">X</button></div>
      <div id="why"></div>`;
  }

  // 답 고르기
  function answer(pick) {
    const right = pick === QUIZ[n].a;
    if (right) score++;
    document.querySelector(".ox").innerHTML = "";
    document.getElementById("why").innerHTML = `
      <b>${right ? "⭕ 정답!" : "❌ 아쉬워요! 정답은 " + QUIZ[n].a}</b><br>${QUIZ[n].why}<br>
      <button class="next" onclick="next()">${n + 1 < QUIZ.length ? "다음 문제" : "결과 보기"}</button>`;
  }

  function next() {
    n++;
    if (n < QUIZ.length) { show(); return; }
    card.innerHTML = `
      <h1>⚖️ 결과</h1>
      <p style="font-size:56px;margin:10px 0">${score} / ${QUIZ.length}</p>
      <p>${score === QUIZ.length ? "롤스 박사님 인정! 🎓" : "다시 도전해 볼까요?"}</p>
      <button class="next" onclick="n = 0; score = 0; show()">다시 하기</button>`;
  }
  show();
</script>
</body>
</html>
