<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4명 룰렛 게임</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
         background: #FFF4E6; font-family: "Malgun Gothic", sans-serif; color: #4A2C1A; }
  h1 { margin: 0; font-size: 30px; }
  .wheel-box { position: relative; width: 300px; height: 300px; }
  canvas { width: 300px; height: 300px; border-radius: 50%; box-shadow: 0 8px 24px rgba(160, 90, 40, .25); transition: transform 4s cubic-bezier(.15, .8, .2, 1); }
  .pin { position: absolute; left: 50%; top: -14px; transform: translateX(-50%); font-size: 34px; }
  button { padding: 14px 40px; border: none; border-radius: 999px; background: #FF7A45; color: #fff; font-size: 20px; font-weight: bold; cursor: pointer; }
  #result { min-height: 34px; font-size: 24px; font-weight: bold; }
</style>
</head>
<body>
  <h1>🎯 4명 룰렛 게임</h1>
  <div class="wheel-box">
    <div class="pin">🔻</div>
    <canvas id="wheel" width="600" height="600"></canvas>
  </div>
  <button id="spin">돌리기!</button>
  <div id="result"></div>

<script>
  // ✏️ 친구 이름을 바꿔 보세요
  const NAMES = ["민준", "서연", "하준", "지우"];
  const COLORS = ["#FFB4A2", "#FDFFB6", "#9BF6FF", "#CAFFBF"];

  const canvas = document.getElementById("wheel");
  const pen = canvas.getContext("2d");
  const slice = Math.PI * 2 / NAMES.length;
  let turned = 0;

  // 룰렛 판 그리기
  NAMES.forEach((name, i) => {
    pen.beginPath();
    pen.moveTo(300, 300);
    pen.arc(300, 300, 296, i * slice - Math.PI / 2, (i + 1) * slice - Math.PI / 2);
    pen.fillStyle = COLORS[i];
    pen.fill();
    pen.save();
    pen.translate(300, 300);
    pen.rotate(i * slice + slice / 2);
    pen.fillStyle = "#4A2C1A";
    pen.font = "bold 48px Malgun Gothic";
    pen.textAlign = "center";
    pen.fillText(name, 0, -170);
    pen.restore();
  });

  // 돌리기: 한 명을 뽑아서 그 칸이 🔻 아래에 오게 돌려요
  document.getElementById("spin").onclick = () => {
    const pick = Math.floor(Math.random() * NAMES.length);
    turned += 360 * 5 + (360 - (turned % 360)) - (pick * 90 + 45);
    canvas.style.transform = `rotate(${turned}deg)`;
    document.getElementById("result").textContent = "두근두근…";
    setTimeout(() => {
      document.getElementById("result").textContent = `🎉 ${NAMES[pick]} 당첨!`;
    }, 4000);
  };
</script>
</body>
</html>
