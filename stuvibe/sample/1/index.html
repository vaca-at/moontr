<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하굣길 간식 룰렛</title>
<style>
  /* 색과 글자 모양 */
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
         background: #FFF4E6; font-family: "Malgun Gothic", sans-serif; color: #4A2C1A; }
  h1 { margin: 0; font-size: 30px; }
  .sub { margin: 0; color: #A0704A; }
  .wheel-box { position: relative; width: 320px; height: 320px; }
  canvas { width: 320px; height: 320px; border-radius: 50%; box-shadow: 0 8px 24px rgba(160, 90, 40, .25); transition: transform 4s cubic-bezier(.15, .8, .2, 1); }
  .pin { position: absolute; left: 50%; top: -14px; transform: translateX(-50%); font-size: 34px; }
  button { padding: 14px 40px; border: none; border-radius: 999px; background: #FF7A45; color: #fff; font-size: 20px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #D4562A; }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #D4562A; }
  button:disabled { opacity: .6; }
  #result { min-height: 34px; font-size: 24px; font-weight: bold; }
</style>
</head>
<body>
  <h1>🍩 하굣길 간식 룰렛</h1>
  <p class="sub">오늘 뭐 먹지? 돌려서 정해요!</p>
  <div class="wheel-box">
    <div class="pin">🔻</div>
    <canvas id="wheel" width="640" height="640"></canvas>
  </div>
  <button id="spin">돌리기!</button>
  <div id="result"></div>

<script>
  // ✏️ 여기 간식 이름을 바꾸거나 더해 보세요
  const MENU = ["떡볶이", "붕어빵", "마라탕", "탕후루", "컵라면", "아이스크림"];
  const COLORS = ["#FFB4A2", "#FFD6A5", "#FDFFB6", "#CAFFBF", "#9BF6FF", "#BDB2FF"];

  const canvas = document.getElementById("wheel");
  const pen = canvas.getContext("2d");
  const slice = Math.PI * 2 / MENU.length;
  let turned = 0;   // 지금까지 돌린 각도

  // 룰렛 판 그리기
  MENU.forEach((name, i) => {
    pen.beginPath();
    pen.moveTo(320, 320);
    pen.arc(320, 320, 316, i * slice - Math.PI / 2, (i + 1) * slice - Math.PI / 2);
    pen.fillStyle = COLORS[i % COLORS.length];
    pen.fill();
    pen.save();
    pen.translate(320, 320);
    pen.rotate(i * slice + slice / 2);
    pen.fillStyle = "#4A2C1A";
    pen.font = "bold 40px Malgun Gothic";
    pen.textAlign = "center";
    pen.fillText(name, 0, -200);
    pen.restore();
  });

  // 돌리기 단추
  document.getElementById("spin").onclick = () => {
    const pick = Math.floor(Math.random() * MENU.length);   // 뽑힌 번호
    const spinBtn = document.getElementById("spin");
    spinBtn.disabled = true;
    document.getElementById("result").textContent = "두근두근…";
    // 뽑힌 칸이 맨 위(🔻)에 오도록 돌려요
    turned += 360 * 5 + (360 - (turned % 360)) - (pick * 360 / MENU.length + 180 / MENU.length);
    canvas.style.transform = `rotate(${turned}deg)`;
    setTimeout(() => {
      document.getElementById("result").textContent = `오늘은 ${MENU[pick]}! 😋`;
      spinBtn.disabled = false;
    }, 4000);
  };
</script>
</body>
</html>
