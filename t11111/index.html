    function sync() {
      colWrap.style.display = selType === 'table' ? '' : 'none';
      picker.refresh();
    }
    TYPE_ORDER.forEach(function(t) {
      const input = el('input', { type: 'radio', name: 'newCatType', value: t, checked: t === selType });
      input.addEventListener('change', function() {
        const prevLabel = TYPES[selType].label;
        selType = t;
        if (!nName.value.trim() || nName.value.trim() === prevLabel) nName.value = TYPES[t].label === '표' ? '' : TYPES[t].label;
        sync();
      });
      radios.appendChild(el('label', { class: 'type-card' }, [input, icon(TYPES[t].icon), el('b', { text: TYPES[t].label }), el('span', { text: TYPES[t].desc })]));
    });
    // 공지는 카테고리가 아니라 [공지・메모] 탭에서 — 찾기 쉽게 같은 자리에 바로 가기 카드
    const noticeCard = el('button', { type: 'button', class: 'type-card notice-link' }, [
      icon('speakerphone'), el('b', { text: '공지・메모' }),
      el('span', { text: '카테고리가 아니라 사이트 맨 위 공지 카드로 올라갑니다. 누르면 [공지・메모] 탭으로 이동.' })
    ]);
    noticeCard.addEventListener('click', function() { switchTab('memos', false); });
    radios.appendChild(noticeCard);
    box.appendChild(radios);
    box.appendChild(el('div', { class: 'form-row' }, [el('label', { text: '이름・아이콘' }), el('div', { style: 'display:flex;gap:6px;align-items:center' }, [picker, nName])]));
    box.appendChild(colWrap);
    sync();

    const addBtn = el('button', { class: 'btn primary', style: 'margin-top:8px' }, [icon('plus'), '카테고리 추가']);
    addBtn.addEventListener('click', function() {
      const name = nName.value.trim();
      if (!name) { toast('카테고리명을 입력하세요.', true); return; }
      const columns = selType === 'table' ? parseColumns(nCol.value) : TYPES[selType].columns.slice();
      if (!columns.length) { toast('표의 칸 이름을 하나 이상 입력하세요.', true); return; }
      const maxOrder = cats.reduce(function(m, c) { return Math.max(m, c.order || 0); }, 0);
      run(db.collection('gt_categories').add({ order: maxOrder + 1, name: name, icon: nIconVal, type: selType, columns: columns, show: true })
        .then(function(ref) { lastAddedCatId = ref.id; dashItemCatId = ref.id; }), '"' + name + '" 카테고리를 추가했습니다.', box);
    });
    box.appendChild(addBtn);
    card.appendChild(box);
    return card;
  }

  // ---------------- 탭: 내용 입력 (일정・명단・지도・표) ----------------
  function renderItemsTab() {
    const cats = sortedCategories();
    if (!cats.length) {
      dashBodyInner.appendChild(el('div', { class: 'card' }, [
        el('div', { class: 'empty', text: '먼저 카테고리 탭에서 카테고리를 만드세요.' }),
        el('button', { class: 'btn primary', onclick: function() { switchTab('categories', false); } }, [icon('plus'), '카테고리 만들러 가기'])
      ]));
      return;
    }
    if (!cats.some(function(c) { return c.id === dashItemCatId; })) dashItemCatId = cats[0].id;
    const cat = cats.find(function(c) { return c.id === dashItemCatId; });
    const type = catType(cat);


    // 일정・명단・지도는 정해진 칸 순서로 보여줌 (예전에 만든 카테고리의 저장된 순서와 달라도 됨)
    const cols = type === 'table' ? (cat.columns || []) : columnsForType(type, cat.columns);
    if (!cols.length) {
      dashBodyInner.appendChild(el('div', { class: 'card' }, [el('div', { class: 'empty', text: '이 표에 칸 이름이 없습니다. 카테고리 탭에서 칸 이름을 먼저 정하세요.' })]));
      return;
    }
    buildItemEditor(cat, type, cols);
  }

  const TYPE_HINTS = {
    schedule: '날짜와 시간을 넣으면 방문자 화면에서 날짜별(1일차, 2일차…)로 묶이고 시간 순으로 정렬됩니다. 새 줄의 날짜는 마지막 일정 날짜로 미리 채워집니다.',
    people: '이름은 전체를 입력하세요. 관리자 화면에는 전체 이름이 보이고, 방문자 화면과 공개 데이터에는 가운데를 가린 이름(정*상)만 남습니다. 전체 이름은 관리자만 읽을 수 있는 곳에 따로 저장됩니다. "정*상 교장선생님", "이*아 교감선생님", "이*호 부장선생님", "김*식 행정실장님", "김*우 행정실선생님", 그 밖에는 "국어과 손*현선생님"처럼 보입니다. 행정실장은 구분을 "행정실장"으로 쓰거나, 교장・교감 바로 다음 줄에 "행정실"로 두면 됩니다. 화살표로 순서를 바꿉니다.',
    map: '장소명을 쓰고 [검색]을 누르면 좌표가 채워집니다. 또는 [지도에서 찍기]를 누른 뒤 위 지도를 클릭하세요. 구글 지도에서 복사한 "33.59, 130.40" 형식을 위도 칸에 붙여넣어도 됩니다. 링크는 비워 두면 [길찾기]가 좌표로 구글 지도를 엽니다. 줄의 🔗 버튼이나 표 위 [빈 링크 채우기]를 누르면 그 링크가 칸에 들어갑니다. 링크 칸은 두 번 눌러야 고칠 수 있고, 구글 지도 링크를 붙여넣으면 위도・경도가 자동으로 바뀝니다. 확인은 [링크 열기](새 창)로 하세요.',
    table: '칸 안의 내용이 http:// 또는 https:// 로 시작하면 방문자 화면에 "바로가기" 링크와 복사 버튼으로 보입니다.'
  };

  function makeInput(type, col, value) {
    let attrs = { class: 'field', value: value, placeholder: col, 'aria-label': col };
    if (type === 'schedule' && col === '날짜' && (!value || parseISODate(value))) { attrs.type = 'date'; attrs.class += ' w-date'; }
    else if (type === 'schedule' && col === '시간' && (!value || /^\d{1,2}:\d{2}$/.test(value))) { attrs.type = 'time'; attrs.class += ' w-time'; }
    else if (type === 'schedule' && col === '내용') attrs.class += ' w-wide';
    else if (type === 'people' && col === '구분') { attrs.list = 'gubunList'; }
    else if (type === 'map' && (col === '위도' || col === '경도')) { attrs.inputmode = 'decimal'; attrs.class += ' w-coord'; }
    else if (type === 'map' && col === '장소명') attrs.class += ' w-wide';
    return el('input', attrs);
  }

  function round6(n) { return Math.round(n * 1e6) / 1e6; }
  function geocode(q) {
    return fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=ko&q=' + encodeURIComponent(q))
      .then(function(r) { if (!r.ok) throw new Error('검색 서버 오류 (' + r.status + ')'); return r.json(); })
      .then(function(a) {
        if (!a.length) throw new Error('"' + q + '" 검색 결과가 없습니다. 영어・일본어 이름이나 "후쿠오카 ○○"로 다시 해보세요.');
        return { lat: round6(+a[0].lat), lng: round6(+a[0].lon), name: a[0].display_name };
      });
  }

  function buildItemEditor(cat, type, cols) {
    let catItems = itemsOf(cat.id);
    if (type === 'schedule') catItems = sortSchedule(catItems);
    const rowsInfo = [];   // { tr, inputs, n } — 지도 마커 동기화용
    let pickTarget = null; // 지도에서 찍을 행

    const card = el('div', { class: 'card' }, [
      el('p', { class: 'card-title', html: iconHtml(cat.icon, type) + ' ' + escapeHtml(cat.name) + ' <span class="type-badge">' + TYPES[type].label + '</span> <span style="color:var(--muted);font-weight:600">' + catItems.length + '개</span>' }),
      el('p', { class: 'card-desc', text: TYPE_HINTS[type] })
    ]);

    // 지도 종류: 위에 편집용 지도
    let mapHelp = null;
    if (type === 'map') {
      mapHelp = el('div', { class: 'map-help' }, [icon('info-circle'), el('span', { text: '행의 [지도에서 찍기]를 누르면 지도 클릭으로 좌표를 넣을 수 있습니다.' })]);
      card.appendChild(mapHelp);
      card.appendChild(el('div', { class: 'admin-map', id: 'adminMap' }));
    }

    // 선택・한꺼번에 저장・삭제 도구줄
    const existing = [];   // 저장된 줄들 { tr, inputs, it, check }
    let lastCheckedIdx = -1;
    const allCheck = el('input', { type: 'checkbox', 'aria-label': '전체 선택' });
    const selInfo = el('span', { class: 'pill', text: '선택 0개' });
    const delSelBtn = el('button', { class: 'btn danger', disabled: true }, [icon('trash'), '선택 삭제']);
    const saveAllBtn = el('button', { class: 'btn primary', disabled: true }, [icon('device-floppy'), el('span', { text: '수정한 줄 모두 저장' })]);
    card.appendChild(el('div', { class: 'bulk-bar' }, [
      el('label', { class: 'chk' }, [allCheck, '전체 선택']), selInfo, delSelBtn, el('span', { style: 'flex:1' }), saveAllBtn
    ]));
    function updateToolbar() {
      const sel = existing.filter(function(r) { return r.check.checked; });
      const dirty = existing.filter(function(r) { return r.tr.classList.contains('dirty'); });
      selInfo.textContent = '선택 ' + sel.length + '개';
      delSelBtn.disabled = !sel.length;
      saveAllBtn.disabled = !dirty.length;
      saveAllBtn.lastChild.textContent = dirty.length ? '수정한 줄 모두 저장 (' + dirty.length + ')' : '수정한 줄 모두 저장';
      allCheck.checked = !!existing.length && sel.length === existing.length;
      allCheck.indeterminate = sel.length > 0 && sel.length < existing.length;
      existing.forEach(function(r) { r.tr.classList.toggle('selected', r.check.checked); });
      tbody.querySelectorAll('input.day-check').forEach(function(dc) {
        const group = existing.filter(function(r) { return r.dayKey === dc.dataset.day; });
        const n = group.filter(function(r) { return r.check.checked; }).length;
        dc.checked = !!group.length && n === group.length;
        dc.indeterminate = n > 0 && n < group.length;
      });
    }
    allCheck.addEventListener('change', function() {
      existing.forEach(function(r) { r.check.checked = allCheck.checked; });
      updateToolbar();
    });
    function collectFields(r) {
      const fields = Object.assign({}, r.it.fields || {});
      cols.forEach(function(c) { fields[c] = normalizeCell(type, c, r.inputs[c].value); });
      return fields;
    }
    saveAllBtn.addEventListener('click', function() {
      const dirty = existing.filter(function(r) { return r.tr.classList.contains('dirty'); });
      if (!dirty.length) return;
      saveAllBtn.disabled = true;
      const privs = [];
      batchWrite(dirty.map(function(r) {
        const s = splitPeople(type, collectFields(r));
        privs.push({ id: r.it.id, full: s.full });
        return function(b) { b.update(db.collection('gt_items').doc(r.it.id), { fields: s.pub }); };
      })).then(function() {
        return savePrivateNames(privs);
      }).then(function() {
        dirty.forEach(function(r) { r.tr.classList.remove('dirty'); });
        toast(dirty.length + '줄을 저장했습니다.');
        refreshDashboard();
      }).catch(function(err) { toast(errText(err), true); updateToolbar(); });
    });
    delSelBtn.addEventListener('click', function() {
      const sel = existing.filter(function(r) { return r.check.checked; });
      if (!sel.length) return;
      if (!confirm('선택한 ' + sel.length + '줄을 삭제할까요? 되돌릴 수 없습니다.')) return;
      delSelBtn.disabled = true;
      batchWrite(sel.map(function(r) {
        return function(b) { b.delete(db.collection('gt_items').doc(r.it.id)); };
      })).then(function() {
        if (type === 'people') deletePrivateNames(sel.map(function(r) { return r.it.id; }));
        // 다른 줄에 저장 안 한 수정이 있어도 지운 줄은 바로 사라지게
        sel.forEach(function(r) { r.tr.remove(); existing.splice(existing.indexOf(r), 1); });
        toast(sel.length + '줄을 삭제했습니다.');
        updateToolbar();
        refreshDashboard();
      }).catch(function(err) { toast(errText(err), true); updateToolbar(); });
    });

    const table = el('table', { class: 'item-table' });
    const trh = el('tr', {}, [el('th', { class: 'chkcol' }, [el('span', { class: 'sr-only', text: '선택' })]), el('th', { text: '#' })]);
    cols.forEach(function(c) { trh.appendChild(el('th', { text: c })); });
    trh.appendChild(el('th', { text: '' }));
    table.appendChild(el('thead', {}, [trh]));
    const tbody = el('tbody');
    tbody.addEventListener('input', updateToolbar);
    tbody.addEventListener('change', updateToolbar);
    const firstDate = type === 'schedule' ? catItems.map(function(it) { return parseISODate(fieldOf(it, '날짜')); }).filter(Boolean)[0] : null;
    let lastDateKey = null;

    function setPickTarget(info) {
      rowsInfo.forEach(function(r) { r.tr.classList.remove('picking'); });
      pickTarget = info;
      if (info) {
        info.tr.classList.add('picking');
        mapHelp.lastChild.textContent = (info.n ? info.n + '번' : '새') + ' 장소: 지도를 클릭하면 좌표가 들어갑니다. (취소: 다시 [지도에서 찍기])';
        document.getElementById('adminMap').scrollIntoView({ behavior: 'smooth', block: 'center' });
      } else {
        mapHelp.lastChild.textContent = '행의 [지도에서 찍기]를 누르면 지도 클릭으로 좌표를 넣을 수 있습니다.';
      }
    }
    function setCoords(info, lat, lng) {
      info.inputs['위도'].value = round6(lat);
      info.inputs['경도'].value = round6(lng);
      info.tr.classList.add('dirty');
      syncMarkers();
    }

    // 행 공통: 칸 입력 + 종류별 버튼
    function wireRow(tr, inputs, info) {
      if (type === 'map') {
        // "33.59, 130.40" 붙여넣기 → 위도・경도 나눠 넣기
        inputs['위도'].addEventListener('input', function() {
          const m = /^\s*(-?\d+(?:\.\d+)?)\s*[,\s]\s*(-?\d+(?:\.\d+)?)\s*$/.exec(inputs['위도'].value);
          if (m) { inputs['위도'].value = m[1]; inputs['경도'].value = m[2]; }
          syncMarkers();
        });
        inputs['경도'].addEventListener('input', syncMarkers);
        const searchBtn = el('button', { class: 'btn icon', title: '장소명으로 좌표 검색', 'aria-label': '장소명으로 좌표 검색' }, [icon('search')]);
        searchBtn.addEventListener('click', function() {
          const q = inputs['장소명'].value.trim();
          if (!q) { toast('장소명을 먼저 입력하세요.', true); return; }
          searchBtn.disabled = true;
          geocode(q).then(function(r) {
            setCoords(info, r.lat, r.lng);
            if (adminMap) adminMap.setView([r.lat, r.lng], 15);
            toast('찾았습니다: ' + r.name.split(',').slice(0, 3).join(','));
          }).catch(function(err) { toast(err.message, true); }).finally(function() { searchBtn.disabled = false; });
        });
        const pickBtn = el('button', { class: 'btn icon', title: '지도에서 찍기', 'aria-label': '지도에서 찍기' }, [icon('crosshair')]);
        pickBtn.addEventListener('click', function() { setPickTarget(pickTarget === info ? null : info); });
        // 이 줄 좌표로 구글 지도 링크 넣기 (저장은 [저장] 또는 [수정한 줄 모두 저장])
        const linkBtn = el('button', { class: 'btn icon', title: '좌표로 링크 넣기', 'aria-label': '좌표로 링크 넣기' }, [icon('link')]);
        linkBtn.addEventListener('click', function() {
          const lat = parseFloat(inputs['위도'].value), lng = parseFloat(inputs['경도'].value);
          if (isNaN(lat) || isNaN(lng) || Math.abs(lat) > 90) { toast('먼저 위도・경도를 넣으세요.', true); return; }
          if (inputs['링크'].value.trim() && !confirm('이미 들어 있는 링크를 좌표 링크로 바꿀까요?')) return;
          inputs['링크'].value = gmapLink(lat, lng);
          tr.classList.add('dirty');
          inputs['링크'].dispatchEvent(new Event('input', { bubbles: true }));
          toast('링크를 넣었습니다. [저장]을 누르세요.');
        });
        // 링크 칸은 그대로 고칠 수 있는 입력 칸. 옆 [링크 열기] 버튼으로 새 창에서 확인
        const linkInput = inputs['링크'];
        const openBtn = el('button', { class: 'btn', type: 'button', title: '링크를 새 창에서 열기' }, [icon('external-link'), '링크 열기']);
        openBtn.addEventListener('click', function() {
          const url = linkInput.value.trim();
          if (!/^https?:\/\//i.test(url)) { toast(url ? '링크가 http:// 또는 https:// 로 시작하지 않습니다.' : '링크 칸이 비어 있습니다. 🔗로 먼저 넣으세요.', true); return; }
          const w = Math.min(1200, screen.availWidth - 80), h = Math.min(860, screen.availHeight - 80);
          window.open(url, 'gtLinkCheck', 'noopener,width=' + w + ',height=' + h + ',left=40,top=40');
        });
        const syncOpen = function() { openBtn.disabled = !linkInput.value.trim(); };
        // 링크를 붙여넣거나 고치면 링크 속 좌표로 위도・경도 자동 수정
        function applyLinkCoords() {
          const c = coordsFromLink(linkInput.value);
          if (!c) return;
          const oldLat = parseFloat(inputs['위도'].value), oldLng = parseFloat(inputs['경도'].value);
          if (Math.abs(oldLat - c.lat) < 1e-7 && Math.abs(oldLng - c.lng) < 1e-7) return;
          setCoords(info, c.lat, c.lng);
          toast('링크에서 좌표를 읽어 위도 ' + round6(c.lat) + ', 경도 ' + round6(c.lng) + '로 바꿨습니다. [저장]을 누르세요.');
        }
        // 링크가 들어 있으면 잠가 두고, 두 번 눌러야 고칠 수 있음 (한 번 눌러서는 아무 일도 없음)
        function lockLink() {
          linkInput.readOnly = !!linkInput.value.trim();
          linkInput.classList.toggle('locked', linkInput.readOnly);
        }
        linkInput.title = '두 번 누르면 고칠 수 있습니다';
        linkInput.addEventListener('dblclick', function() {
          linkInput.readOnly = false;
          linkInput.classList.remove('locked');
          linkInput.focus();
          linkInput.select();
        });
        linkInput.addEventListener('blur', lockLink);
        linkInput.addEventListener('keydown', function(e) { if (e.key === 'Enter' && !linkInput.readOnly) linkInput.blur(); });
        linkInput.addEventListener('input', function() { if (document.activeElement !== linkInput) lockLink(); });
        lockLink();
        linkInput.addEventListener('input', syncOpen);
        linkInput.addEventListener('change', applyLinkCoords);
        linkInput.addEventListener('paste', function() { setTimeout(function() { applyLinkCoords(); syncOpen(); }, 0); });
        syncOpen();
        return [searchBtn, pickBtn, linkBtn, openBtn];
      }
      return [];
    }

    catItems.forEach(function(it, idx) {
      // 일정: 날짜가 바뀔 때마다 구분 줄 (날짜별 한꺼번에 선택 가능)
      if (type === 'schedule') {
        const key = fieldOf(it, '날짜');
        if (key !== lastDateKey) {
          lastDateKey = key;
          const d = parseISODate(key);
          const label = d && firstDate ? (Math.round((d - firstDate) / 86400000) + 1) + '일차 · ' + fmtDayW(d) : (key || '날짜 미정');
          const dayCheck = el('input', { type: 'checkbox', class: 'day-check', 'data-day': key, 'aria-label': label + ' 전체 선택' });
          dayCheck.addEventListener('change', function(e) {
            e.stopPropagation();
            existing.forEach(function(r) { if (r.dayKey === key) r.check.checked = dayCheck.checked; });
            updateToolbar();
          });
          tbody.appendChild(el('tr', { class: 'day-sep' }, [
            el('td', { class: 'chkcol' }, [dayCheck]),
            el('td', { colspan: String(cols.length + 2), text: label })
          ]));
        }
      }
      const tr = el('tr');
      markDirtyOnInput(tr);
      const check = el('input', { type: 'checkbox', 'aria-label': (idx + 1) + '번 줄 선택' });
      // 체크는 '수정됨'으로 치지 않음. Shift+클릭으로 범위 선택
      check.addEventListener('change', function(e) { e.stopPropagation(); updateToolbar(); });
      check.addEventListener('input', function(e) { e.stopPropagation(); });
      check.addEventListener('click', function(e) {
        const i = existing.indexOf(rowRec);
        if (e.shiftKey && lastCheckedIdx > -1 && lastCheckedIdx !== i) {
          const a = Math.min(i, lastCheckedIdx), b = Math.max(i, lastCheckedIdx);
          for (let k = a; k <= b; k++) existing[k].check.checked = check.checked;
        }
        lastCheckedIdx = i;
        updateToolbar();
      });
      tr.appendChild(el('td', { class: 'chkcol' }, [check]));
      tr.appendChild(el('td', { class: 'num', text: String(idx + 1) }));
      const inputs = {};
      cols.forEach(function(c) {
        // 명단 이름: 관리자 화면에는 전체 이름(있으면), 없으면 저장된 가린 이름
        const v = (type === 'people' && c === '이름' && privateNames[it.id]) ? privateNames[it.id] : fieldOf(it, c);
        inputs[c] = makeInput(type, c, v);
        tr.appendChild(el('td', {}, [inputs[c]]));
      });
      const info = { tr: tr, inputs: inputs, n: idx + 1 };
      rowsInfo.push(info);
      const rowRec = { tr: tr, inputs: inputs, it: it, check: check, dayKey: type === 'schedule' ? fieldOf(it, '날짜') : null };
      existing.push(rowRec);
      const extra = wireRow(tr, inputs, info);
      const saveBtn = el('button', { class: 'btn primary', text: '저장' });
      saveBtn.addEventListener('click', function() {
        const s = splitPeople(type, collectFields(rowRec));
        run(db.collection('gt_items').doc(it.id).update({ fields: s.pub }).then(function() {
          return savePrivateNames([{ id: it.id, full: s.full }]);
        }), '저장했습니다.', tr).then(updateToolbar);
      });
      const delBtn = el('button', { class: 'btn danger icon', title: '삭제', 'aria-label': '삭제' }, [icon('trash')]);
      delBtn.addEventListener('click', function() {
        if (!confirm((idx + 1) + '번 줄을 삭제할까요?')) return;
        db.collection('gt_items').doc(it.id).delete().then(function() {
          if (type === 'people') deletePrivateNames([it.id]);
          tr.remove(); existing.splice(existing.indexOf(rowRec), 1);
          toast('삭제했습니다.'); updateToolbar(); refreshDashboard();
        }).catch(function(err) { toast(errText(err), true); });
      });
      const acts = el('div', { class: 'acts' });
      if (type !== 'schedule') acts.appendChild(moveButtons(catItems, idx, function(m) { run(renumber('gt_items', m, function(i) { return i + 1; })); }));
      extra.forEach(function(b) { acts.appendChild(b); });
      acts.appendChild(saveBtn);
      acts.appendChild(delBtn);
      tr.appendChild(el('td', {}, [acts]));
      tbody.appendChild(tr);
    });

    // 새 줄
    const newTr = el('tr', { class: 'new-row' });
    markDirtyOnInput(newTr);
    newTr.appendChild(el('td', { class: 'chkcol' }));
    newTr.appendChild(el('td', { class: 'num', text: '+' }));
    const newInputs = {};
    cols.forEach(function(c) {
      let v = '';
      if (type === 'schedule' && c === '날짜' && lastDateKey && parseISODate(lastDateKey)) v = lastDateKey;
      else if (type === 'schedule' && c === '날짜' && !catItems.length && parseISODate(settings.ddayDate)) v = settings.ddayDate;
      newInputs[c] = makeInput(type, c, v);
      newTr.appendChild(el('td', {}, [newInputs[c]]));
    });
    const newInfo = { tr: newTr, inputs: newInputs, n: 0 };
    rowsInfo.push(newInfo);
    const newExtra = wireRow(newTr, newInputs, newInfo);
    const addBtn = el('button', { class: 'btn primary' }, [icon('plus'), '추가']);
    // 엑셀・시트에서 여러 칸/여러 줄을 새 줄 칸에 붙여넣으면 한꺼번에 추가
    cols.forEach(function(c) {
      newInputs[c].addEventListener('paste', function(e) {
        const text = (e.clipboardData || window.clipboardData).getData('text');
        if (!/[\t\n]/.test(text.trim())) return;
        e.preventDefault();
        addPastedRows(cat, type, cols, text);
      });
    });
    addBtn.addEventListener('click', function() {
      const fields = {};
      cols.forEach(function(c) { fields[c] = normalizeCell(type, c, newInputs[c].value); });
      if (!cols.some(function(c) { return fields[c]; })) { toast('내용을 입력하세요.', true); return; }
      if (type === 'people' && !fields['이름']) { toast('이름을 입력하세요.', true); return; }
      const maxOrder = itemsOf(cat.id).reduce(function(m, it) { return Math.max(m, it.order || 0); }, 0);
      const ref = db.collection('gt_items').doc();
      const s = splitPeople(type, fields);
      run(ref.set({ categoryId: cat.id, order: maxOrder + 1, fields: s.pub }).then(function() {
        return savePrivateNames([{ id: ref.id, full: s.full }]);
      }), '추가했습니다.', newTr).then(function() {
        const first = newTr.querySelector('input:not([type=date])');
        if (first && !hasUnsaved()) {
          const again = dashBodyInner.querySelector('tr.new-row input:not([type=date])');
          if (again) again.focus();
        }
      });
    });
    newInputs[cols[cols.length - 1]].addEventListener('keydown', function(e) { if (e.key === 'Enter') addBtn.click(); });
    const newActs = el('div', { class: 'acts' });
    newExtra.forEach(function(b) { newActs.appendChild(b); });
    newActs.appendChild(addBtn);
    newTr.appendChild(el('td', {}, [newActs]));
    tbody.appendChild(newTr);
    table.appendChild(tbody);
    card.appendChild(el('div', { class: 'item-table-wrap' }, [table]));
    card.appendChild(el('p', { class: 'hint', text: '여러 줄을 고친 뒤 [수정한 줄 모두 저장]을 한 번 누르면 됩니다. 체크박스는 Shift를 누른 채 누르면 범위로 선택됩니다. 엑셀에서 복사한 여러 줄을 맨 아래 새 줄 칸에 바로 붙여넣어도 한꺼번에 추가됩니다.' }));
    dashBodyInner.appendChild(card);
    updateToolbar();

    // 지도: 링크 칸이 빈 줄에 좌표로 구글 지도 링크 채우기 (칸에만 넣고, 저장은 [수정한 줄 모두 저장]으로)
    if (type === 'map') {
      const linkBtn = el('button', { class: 'btn' }, [icon('link'), '빈 링크 채우기']);
      linkBtn.addEventListener('click', function() {
        let n = 0, noCoord = 0;
        existing.forEach(function(r) {
          const inp = r.inputs['링크'];
          if (!inp || inp.value.trim()) return;
          const lat = parseFloat(r.inputs['위도'].value), lng = parseFloat(r.inputs['경도'].value);
          if (isNaN(lat) || isNaN(lng) || Math.abs(lat) > 90) { noCoord++; return; }
          inp.value = gmapLink(lat, lng);
          inp.dispatchEvent(new Event('input', { bubbles: true }));
          r.tr.classList.add('dirty');
          n++;
        });
        updateToolbar();
        if (n) toast(n + '줄에 링크를 넣었습니다. 확인 후 [수정한 줄 모두 저장]을 누르세요.' + (noCoord ? ' (좌표가 없는 ' + noCoord + '줄은 건너뜀)' : ''));
        else toast(noCoord ? '좌표가 없거나 칸이 밀린 줄이라 채우지 못했습니다. 좌표부터 정리하세요.' : '링크 칸이 빈 줄이 없습니다.', !!noCoord);
      });
      card.querySelector('.bulk-bar').insertBefore(linkBtn, saveAllBtn);
    }

    // 고쳐야 할 줄이 있으면 표 위에 눈에 띄는 경고 띠 + 버튼
    function addFixBanner(msg, btn) {
      const banner = el('div', { class: 'fix-banner', role: 'alert' }, [
        icon('alert-triangle'), el('span', { class: 'fix-banner-text', text: msg }), btn
      ]);
      const bar = card.querySelector('.bulk-bar');
      card.insertBefore(banner, bar);
      banner.scrollIntoView({ block: 'nearest' });
    }

    // 명단: 관리자용 전체 이름 저장소 상태 안내
    if (type === 'people') {
      if (privateNamesError) {
        addFixBanner('관리자용 전체 이름을 읽지 못했습니다. Firestore 규칙에 gt_people_private (관리자만 읽기・쓰기)를 추가해야 전체 이름이 보입니다. (' + (privateNamesError.code || privateNamesError.message) + ')', null);
      } else if (existing.length && !existing.some(function(r) { return privateNames[r.it.id]; }) &&
                 existing.every(function(r) { return fieldOf(r.it, '이름').indexOf('*') > -1; })) {
        addFixBanner('전체 이름이 저장되어 있지 않아 가린 이름으로 보입니다. [전체 선택] → [선택 삭제] 후 아래 "여러 줄 한 번에 추가"에 명단을 다시 붙여넣으면 관리자 화면에 전체 이름이 보입니다.', null);
      }
    }

    // 명단: "번호 / 구분 / 이름"이 한 칸씩 밀려 저장된 줄을 한꺼번에 제자리로
    if (type === 'people') {
      const shifted = existing.filter(function(r) { return peopleNeedsFix(r.it.fields); });
      if (shifted.length) {
        const fixBtn = el('button', { class: 'btn primary' }, [icon('wand'), '명단 정리・이름 가리기 (' + shifted.length + '줄)']);
        fixBtn.addEventListener('click', function() {
          const ex = peopleFields(shifted[0].it.fields);
          if (!confirm(shifted.length + '줄의 칸을 제자리로 옮겨 저장할까요?\n\n예) 구분 "' + ex.구분 + '", 이름 "' + ex.이름 + '"')) return;
          fixBtn.disabled = true;
          const privs = [];
          run(batchWrite(shifted.map(function(r) {
            const p = peopleFields(r.it.fields);
            const s = splitPeople('people', Object.assign({}, r.it.fields || {}, { 구분: p.구분, 이름: p.이름, 비고: p.비고 }));
            privs.push({ id: r.it.id, full: s.full });
            return function(b) { b.update(db.collection('gt_items').doc(r.it.id), { fields: s.pub }); };
          })).then(function() { return savePrivateNames(privs); }), shifted.length + '줄을 정리했습니다.');
        });
        addFixBanner('명단 ' + shifted.length + '줄의 칸이 밀렸거나 전체 이름이 저장되어 있습니다. 아래 버튼을 누르면 한 번에 고쳐집니다.', fixBtn);
      }
    }

    // 지도: 칸이 밀려 저장된 줄(좌표가 설명 칸에 들어간 경우 등)을 한꺼번에 제자리로
    if (type === 'map') {
      const shifted = existing.filter(function(r) { return mapNeedsFix(r.it.fields); });
      if (shifted.length) {
        const fixBtn = el('button', { class: 'btn primary' }, [icon('wand'), '좌표 칸 자동 정리 (' + shifted.length + '줄)']);
        fixBtn.addEventListener('click', function() {
          const ex = mapFields(shifted[0].it.fields);
          if (!confirm(shifted.length + '줄의 칸을 제자리로 옮겨 저장할까요?\n\n예) ' + (ex.장소명 || '(이름 없음)') + ' → 위도 ' + (ex.위도 || '없음') + ', 경도 ' + (ex.경도 || '없음'))) return;
          fixBtn.disabled = true;
          run(batchWrite(shifted.map(function(r) {
            const m = mapFields(r.it.fields);
            const f = Object.assign({}, r.it.fields || {});
            MAP_COLS.forEach(function(c) { f[c] = m[c]; });
            return function(b) { b.update(db.collection('gt_items').doc(r.it.id), { fields: f }); };
          })), shifted.length + '줄을 정리했습니다.');
        });
        addFixBanner('좌표 ' + shifted.length + '줄이 칸이 밀려 있습니다 (위도 칸에 경도, 설명 칸에 위도). 다시 입력하지 말고 아래 버튼을 누르세요.', fixBtn);
      }
    }

    // 일정: 엑셀에서 온 "2/14", "오후 2시" 같은 값을 한꺼번에 저장 형식으로
    if (type === 'schedule') {
      const fixable = existing.filter(function(r) {
        return ['날짜', '시간'].some(function(c) { const v = fieldOf(r.it, c); return v && normalizeCell(type, c, v) !== v; });
      });
      if (fixable.length) {
        const fixBtn = el('button', { class: 'btn primary' }, [icon('wand'), '날짜・시간 형식 맞추기 (' + fixable.length + '줄)']);
        fixBtn.addEventListener('click', function() {
          if (!confirm(fixable.length + '줄의 날짜・시간을 2027-02-14 / 09:30 형식으로 바꿔 저장할까요?')) return;
          fixBtn.disabled = true;
          run(batchWrite(fixable.map(function(r) {
            const f = Object.assign({}, r.it.fields || {});
            f['날짜'] = normalizeDate(f['날짜']); f['시간'] = normalizeTime(f['시간']);
            return function(b) { b.update(db.collection('gt_items').doc(r.it.id), { fields: f }); };
          })), fixable.length + '줄의 형식을 맞췄습니다.');
        });
        addFixBanner('일정 ' + fixable.length + '줄의 날짜・시간 형식이 달라 날짜별로 묶이지 않습니다. 아래 버튼을 누르면 한 번에 맞춰집니다.', fixBtn);
      }
    }

    // 지도 초기화 + 마커 동기화
    let markerLayer = null;
    function syncMarkers() {
      if (!adminMap) return;
      markerLayer.clearLayers();
      rowsInfo.forEach(function(r) {
        const lat = parseFloat(r.inputs['위도'].value), lng = parseFloat(r.inputs['경도'].value);
        if (isNaN(lat) || isNaN(lng)) return;
        const m = L.marker([lat, lng], { icon: numIcon(r.n || '+'), draggable: true });
        m.bindTooltip(r.inputs['장소명'].value || '(이름 없음)');
        m.on('dragend', function() { const p = m.getLatLng(); setCoords(r, p.lat, p.lng); });
        markerLayer.addLayer(m);
      });
    }
    if (type === 'map') {
      setTimeout(function() {
        if (typeof L === 'undefined' || !document.getElementById('adminMap')) return;
        adminMap = L.map('adminMap');
        addBaseTiles(adminMap);
        markerLayer = L.layerGroup().addTo(adminMap);
        syncMarkers();
        const pts = markerLayer.getLayers();
        if (pts.length > 1) adminMap.fitBounds(L.featureGroup(pts).getBounds().pad(0.2));
        else if (pts.length === 1) adminMap.setView(pts[0].getLatLng(), 15);
        else adminMap.setView(FUKUOKA, 11);
        adminMap.on('click', function(e) {
          if (!pickTarget) { toast('먼저 행의 [지도에서 찍기] 버튼을 누르세요.'); return; }
          setCoords(pickTarget, e.latlng.lat, e.latlng.lng);
          setPickTarget(null);
        });
      }, 0);
    }

    dashBodyInner.appendChild(buildBulkCard(cat, type, cols));
  }

  // 엑셀・시트에서 온 날짜/시간을 저장 형식(2027-02-14 / 09:30)으로 맞춤
  function normalizeDate(v) {
    const s = String(v || '').trim();
    if (!s) return '';
    let m = /^(\d{4})\s*[.\-/년]\s*(\d{1,2})\s*[.\-/월]\s*(\d{1,2})/.exec(s);
    let y, mo, d;
    if (m) { y = +m[1]; mo = +m[2]; d = +m[3]; }
    else if ((m = /^(\d{1,2})\s*[.\-/월]\s*(\d{1,2})\s*일?/.exec(s))) {
      const base = parseISODate(settings.ddayDate) || new Date();
      y = base.getFullYear(); mo = +m[1]; d = +m[2];
    } else if (/^\d{5}$/.test(s)) {
      // 엑셀 날짜 일련번호 (1900 기준)
      const dt = new Date(Math.round((+s - 25569) * 86400000));
      y = dt.getUTCFullYear(); mo = dt.getUTCMonth() + 1; d = dt.getUTCDate();
    } else return s;
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return s;
    return y + '-' + String(mo).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  }
  function normalizeTime(v) {
    const s = String(v || '').trim();
    if (!s) return '';
    const m = /^(오전|오후|AM|PM|am|pm)?\s*(\d{1,2})\s*[:시]\s*(\d{1,2})?\s*(?:분)?(?::\d{2})?\s*(AM|PM|am|pm)?/.exec(s);
    if (!m) return s;
    let h = +m[2];
    const mi = m[3] ? +m[3] : 0;
    const ap = (m[1] || m[4] || '').toLowerCase();
    if ((ap === '오후' || ap === 'pm') && h < 12) h += 12;
    if ((ap === '오전' || ap === 'am') && h === 12) h = 0;
    if (h > 23 || mi > 59) return s;
    return String(h).padStart(2, '0') + ':' + String(mi).padStart(2, '0');
  }
  function normalizeCell(type, col, v) {
    if (type === 'schedule' && col === '날짜') return normalizeDate(v);
    if (type === 'schedule' && col === '시간') return normalizeTime(v);
    return String(v == null ? '' : v).trim();
  }

  // 붙여넣은 글 → 줄 목록
  //  첫 줄에 칸 이름(장소명・위도・이름…)이 있으면 그 이름대로 칸을 맞춤 (엑셀 칸 순서가 달라도 됨)
  //  '번호・No・#' 칸은 버림. 모르는 칸 이름은 남은 칸에 차례로
  //  명단은 "교사 홍길동" 띄어쓰기도 허용
  const SKIP_HEADS = ['번호', 'no', 'no.', '#', '순번', '연번'];
  function parsePastedRows(type, cols, text) {
    let lines = String(text || '').split(/\r?\n/).filter(function(l) { return l.trim(); });
    let colMap = null;   // 붙여넣은 칸 번호 → 우리 칸 이름 (null이면 버림)
    if (lines.length) {
      const head = lines[0].split('\t').map(function(s) { return s.trim(); });
      if (head.some(function(h) { return cols.indexOf(h) > -1; })) {
        const used = {};
        colMap = head.map(function(h) {
          if (cols.indexOf(h) > -1 && !used[h]) { used[h] = true; return h; }
          return undefined;
        });
        head.forEach(function(h, i) {
          if (colMap[i] !== undefined) return;
          if (SKIP_HEADS.indexOf(h.toLowerCase()) > -1) { colMap[i] = null; return; }
          const free = cols.filter(function(c) { return !used[c]; })[0];
          colMap[i] = free || null;
          if (free) used[free] = true;
        });
        lines = lines.slice(1);
      }
    }
    return lines.map(function(line) {
      let cells = line.split('\t');
      const fields = {};
      cols.forEach(function(c) { fields[c] = ''; });
      if (colMap) {
        cells.forEach(function(v, i) { if (colMap[i]) fields[colMap[i]] = v; });
      } else {
        if (type === 'people' && cells.length === 1) {
          const parts = line.trim().split(/\s+/);
          cells = parts.length === 1 ? ['', parts[0]] : [parts[0], parts[1], parts.slice(2).join(' ')];
        }
        // 명단: 맨 앞이 번호면 버림 (번호 / 구분 / 이름)
        if (type === 'people' && cells.length >= 3 && isNumStr(cells[0])) cells = cells.slice(1);
        cols.forEach(function(c, j) { fields[c] = cells[j]; });
      }
      cols.forEach(function(c) { fields[c] = normalizeCell(type, c, fields[c]); });
      // 지도: "장소명 / 위도 / 경도"만 복사하는 등 칸 순서가 달라도 알아서 맞춤
      if (type === 'map') { const m = mapFields(fields); MAP_COLS.forEach(function(c) { if (c in fields) fields[c] = m[c]; }); }
      return fields;
    }).filter(function(f) { return cols.some(function(c) { return f[c]; }); });
  }
  function addPastedRows(cat, type, cols, text, cleanNode) {
    const rows = parsePastedRows(type, cols, text);
    if (!rows.length) { toast('붙여넣은 내용이 없습니다.', true); return Promise.resolve(); }
    if (rows.length > 1 && !confirm(rows.length + '줄을 "' + cat.name + '"에 추가할까요?\n칸 순서: ' + cols.join(' / '))) return Promise.resolve();
    const base = itemsOf(cat.id).reduce(function(m, it) { return Math.max(m, it.order || 0); }, 0);
    const privs = [];
    const ops = rows.map(function(fields, i) {
      const ref = db.collection('gt_items').doc();
      const s = splitPeople(type, fields);
      privs.push({ id: ref.id, full: s.full });
      return function(b) { b.set(ref, { categoryId: cat.id, order: base + i + 1, fields: s.pub }); };
    });
    return run(batchWrite(ops).then(function() { return savePrivateNames(privs); }), rows.length + '줄을 추가했습니다.', cleanNode);
  }

  // 일괄 추가 (스프레드시트에서 복사해 붙여넣기)
  function buildBulkCard(cat, type, cols) {
    const desc = type === 'people'
      ? '한 줄에 한 명씩 붙여넣으세요. "교사 홍길동" 처럼 띄어 쓰거나, 시트에서 구분・이름・비고 칸을 복사해도 됩니다.'
      : '구글 시트・엑셀에서 여러 행을 복사해 붙여넣으세요. 칸 순서: ' + cols.join(' / ') + ' (첫 줄이 칸 이름이면 건너뜁니다)' +
        (type === 'schedule' ? ' 날짜는 2027.2.14・2/14・2월 14일, 시간은 9:30・오후 2시 같은 형식도 알아서 맞춰 저장합니다.' : '');
    const card = el('div', { class: 'card' }, [
      el('p', { class: 'card-title' }, [icon('clipboard-text'), '여러 줄 한 번에 추가']),
      el('p', { class: 'card-desc', text: desc })
    ]);
    const ta = el('textarea', { class: 'field', rows: '5', placeholder: type === 'people' ? '교장 홍길동\n부장 김철수\n교사 이영희' : cols.join('\t') });
    markDirtyOnInput(ta);
    const bulkBtn = el('button', { class: 'btn primary', style: 'margin-top:8px' }, [icon('plus'), '붙여넣은 줄 추가']);
    bulkBtn.addEventListener('click', function() { addPastedRows(cat, type, cols, ta.value, ta); });
    card.appendChild(ta);
    card.appendChild(bulkBtn);
    return card;
  }

  // ---------------- 탭: 메모 ----------------
  function renderMemosTab() {
    const list = sortedMemos();
    const card = el('div', { class: 'card' }, [
      el('p', { class: 'card-title' }, [icon('speakerphone'), '공지・메모 (' + list.length + ')']),
      el('p', { class: 'card-desc', text: '대표 화면 아래에 붙는 공지 메모입니다. 위에 있을수록 먼저 보입니다. [중요]를 켠 메모는 강조 색 카드로 맨 위에 보입니다.' })
    ]);
    list.forEach(function(m, idx) {
      const row = el('div', { class: 'edit-row' + (m.show === false ? ' hidden-row' : '') + (m.important ? ' important-row' : '') });
      markDirtyOnInput(row);
      const dateInput = el('input', { class: 'field', value: m.date || '', placeholder: '9/3', style: 'width:72px', 'aria-label': '날짜' });
      const contentInput = el('textarea', { class: 'field', rows: '2', placeholder: '내용', 'aria-label': '내용', style: 'flex:1;min-width:180px' });
      contentInput.value = m.content || '';
      const showCheck = el('input', { type: 'checkbox', checked: m.show !== false });
      const impCheck = el('input', { type: 'checkbox', checked: !!m.important });
      impCheck.addEventListener('change', function() { row.classList.toggle('important-row', impCheck.checked); });
      const saveBtn = el('button', { class: 'btn primary', text: '저장' });
      saveBtn.addEventListener('click', function() {
        run(db.collection('gt_memos').doc(m.id).update({ date: dateInput.value.trim(), content: contentInput.value, show: showCheck.checked, important: impCheck.checked }), '저장했습니다.', row);
      });
      const delBtn = el('button', { class: 'btn danger icon', title: '삭제', 'aria-label': '삭제' }, [icon('trash')]);
      delBtn.addEventListener('click', function() {
        if (!confirm('이 메모를 삭제할까요?')) return;
        run(db.collection('gt_memos').doc(m.id).delete(), '삭제했습니다.', row);
      });
      row.appendChild(moveButtons(list, idx, function(moved) { run(renumber('gt_memos', moved, function(i) { return moved.length - i; })); }));
      row.appendChild(dateInput);
      row.appendChild(contentInput);
      row.appendChild(el('div', { class: 'row-actions' }, [
        el('label', { class: 'chk', style: 'color:var(--accent);font-weight:700' }, [impCheck, '중요']),
        el('label', { class: 'chk' }, [showCheck, '표시']), saveBtn, delBtn]));
      card.appendChild(row);
    });
    if (!list.length) card.appendChild(el('div', { class: 'empty', text: '메모가 없습니다.' }));
    dashBodyInner.appendChild(card);

    const addCard = el('div', { class: 'card' }, [el('p', { class: 'card-title' }, [icon('plus'), '새 공지・메모 (맨 위에 추가)'])]);
    const nRow = el('div', { class: 'edit-row', style: 'margin:0' });
    markDirtyOnInput(nRow);
    const d = new Date();
    const nDate = el('input', { class: 'field', value: (d.getMonth() + 1) + '/' + d.getDate(), style: 'width:72px', 'aria-label': '날짜' });
    const nContent = el('textarea', { class: 'field', rows: '2', placeholder: '내용', 'aria-label': '내용', style: 'flex:1;min-width:180px' });
    const nImp = el('input', { type: 'checkbox' });
    nImp.addEventListener('change', function() { nRow.classList.toggle('important-row', nImp.checked); });
    const addBtn = el('button', { class: 'btn primary' }, [icon('plus'), '추가']);
    addBtn.addEventListener('click', function() {
      if (!nContent.value.trim()) { toast('내용을 입력하세요.', true); return; }
      const maxOrder = list.reduce(function(m, x) { return Math.max(m, x.order || 0); }, 0);
      run(db.collection('gt_memos').add({ date: nDate.value.trim(), content: nContent.value, order: maxOrder + 1, show: true, important: nImp.checked }), '추가했습니다.', nRow);
    });
    nRow.appendChild(nDate);
    nRow.appendChild(nContent);
    nRow.appendChild(el('div', { class: 'row-actions' }, [el('label', { class: 'chk', style: 'color:var(--accent);font-weight:700' }, [nImp, '중요']), addBtn]));
    addCard.appendChild(nRow);
    dashBodyInner.appendChild(addCard);
  }
</script>
