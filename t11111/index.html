<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>50주년 해외연수(GT)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gaegu:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Firebase (compat SDK) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
  /* 온글잎 윤탱이와 친구들 (눈누). 불러오지 못하면 '나눔펜'으로 대신 표시됩니다. */
  @font-face{ font-family:'OwnglyphYuntaeng'; src:url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2608211801@font-160/font-160/온글잎 윤탱체.woff2') format('woff2'); font-weight:400; font-display:swap; }
  @font-face{ font-family:'OngleipRyudung'; src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2405-2@1.0/Ownglyph_ryuttung-Rg.woff2') format('woff2'); font-weight:normal; font-display:swap; }

  /* ───────── 디자인 3가지 (2월 후쿠오카) ───────── */
  /* 매화: 다자이후 덴만구의 2월 매화 + 금박 */
  :root, body[data-theme="ume"]{
    --bg:#FBF6F0; --surface:#FFFFFF; --tile:#FFFFFF; --ink:#2B1B1F; --muted:#7A6468; --line:#EADCD4;
    --accent:#B8325A; --on-accent:#FFFFFF; --accent-soft:#F8E4EA;
    --gold:#8C6516;
    --foil:linear-gradient(110deg,#8C6516 0%,#B8862B 22%,#F3DA8C 38%,#A57A1E 55%,#E9CC7A 70%,#8C6516 88%,#B8862B 100%);
    --foil-shadow:drop-shadow(0 2px 1px rgba(120,85,20,.22));
    --hero-bg:radial-gradient(60% 80% at 8% 40%,rgba(184,50,90,.13),transparent 70%),radial-gradient(50% 60% at 96% 0%,rgba(184,134,43,.18),transparent 70%),linear-gradient(180deg,#FFFFFF,#FBF6F0);
    --bg-img:none;
    --bar:#B8325A; --ok:#1E8E5A; --danger:#B42318; --danger-bg:#FDECEA;
    --radius:16px;
  }
  /* 야타이의 밤: 하카타 나카스 강변 포장마차 등불 */
  body[data-theme="yatai"]{
    --bg:#0F1329; --surface:#191F42; --tile:#161C3C; --ink:#F3EEE4; --muted:#A9ABC6; --line:#2E3663;
    --accent:#F08A3C; --on-accent:#1A1206; --accent-soft:rgba(240,138,60,.14);
    --gold:#E8C170;
    --foil:linear-gradient(110deg,#B8862B 0%,#E8C170 20%,#FFF4CC 35%,#D9A441 50%,#FFE9A8 65%,#B8862B 85%,#E8C170 100%);
    --foil-shadow:drop-shadow(0 0 14px rgba(240,170,80,.45));
    --hero-bg:radial-gradient(60% 80% at 15% 35%,rgba(240,138,60,.22),transparent 70%),radial-gradient(50% 60% at 90% 10%,rgba(232,193,112,.16),transparent 70%),linear-gradient(180deg,#1B2148,#0F1329);
    --bg-img:radial-gradient(1.4px 1.4px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 38% 62%,#cfd6ff 50%,transparent 51%),radial-gradient(1.6px 1.6px at 71% 27%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 86% 78%,#fff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 55% 90%,#cfd6ff 50%,transparent 51%);
    --bar:#F08A3C; --ok:#5DCAA5; --danger:#F09595; --danger-bg:#3A2422;
    --radius:14px;
  }
  /* 겨울 바다: 모모치 해변과 후쿠오카 타워, 노을빛 로즈골드 */
  body[data-theme="sea"]{
    --bg:#EEF4F8; --surface:#FFFFFF; --tile:#FFFFFF; --ink:#10263A; --muted:#56708A; --line:#D7E4EE;
    --accent:#1F6FA8; --on-accent:#FFFFFF; --accent-soft:#DDEBF5;
    --gold:#A0542F;
    --foil:linear-gradient(110deg,#9C5A3C 0%,#C98463 22%,#F7D3BF 38%,#B76E4C 55%,#EFC2AA 70%,#9C5A3C 88%,#C98463 100%);
    --foil-shadow:drop-shadow(0 2px 1px rgba(120,60,30,.2));
    --hero-bg:radial-gradient(60% 80% at 88% 18%,rgba(228,119,90,.2),transparent 70%),radial-gradient(60% 70% at 8% 60%,rgba(31,111,168,.14),transparent 70%),linear-gradient(180deg,#FFFFFF,#EEF4F8);
    --bg-img:none;
    --bar:#1F6FA8; --ok:#1E8E5A; --danger:#B42318; --danger-bg:#FDECEA;
    --radius:18px;
  }

  /* ───────── 글꼴 조합 (제목 / 본문) ─────────
     고운바탕 + 윤탱이와 친구들. 손글씨 조합은 제목=온글잎 글꼴, 본문=개구 (윤탱체 조합과 같은 짝) */
  :root, body[data-font="classic"]{ --f-head:'Gowun Batang',serif; --f-body:'Gowun Batang',serif; --head-w:700; --head-scale:1; --body-scale:1; }
  body[data-font="yuntaeng"]{ --f-head:'OwnglyphYuntaeng','Nanum Pen Script',cursive; --f-body:'Gaegu',cursive; --head-w:400; --head-scale:1.2; --body-scale:1.15; }
  body[data-font="ryudung"]{ --f-head:'OngleipRyudung','Nanum Pen Script',cursive; --f-body:'Gaegu',cursive; --head-w:400; --head-scale:1.15; --body-scale:1.15; }

  *{box-sizing:border-box;}
  body{ margin:0; font-family:var(--f-body); background-color:var(--bg); background-image:var(--bg-img); background-size:420px 420px; background-attachment:fixed;
    color:var(--ink); word-break:keep-all; transition:background-color .3s,color .3s; }
  button{ font-family:inherit; }
  :focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
  @keyframes shine{ 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
  @keyframes spin{ to{ transform:translate(-50%,-50%) rotate(360deg); } }
  .foil-text{ background:var(--foil); background-size:220% 100%; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; animation:shine 7s ease-in-out infinite; }

  /* ───────── 상단 바: 디자인・글꼴 고르기 ───────── */
  .topbar{ position:sticky; top:0; z-index:30; background:color-mix(in srgb,var(--surface) 88%,transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line); }
  .topbar::before{ content:""; position:absolute; left:0; right:0; top:0; height:3px; background:var(--foil); background-size:220% 100%; animation:shine 7s ease-in-out infinite; }
  .topbar-in{ max-width:960px; margin:0 auto; padding:10px 16px 8px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .brand{ display:flex; align-items:center; gap:8px; min-width:0; }
  .brand-50{ font-family:var(--f-head); font-weight:700; font-size:22px; line-height:1; filter:var(--foil-shadow); }
  .brand-txt{ font-family:var(--f-head); font-weight:var(--head-w); font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  @media (max-width:560px){
    .brand-txt{ display:none; }
    .topbar-in{ padding:10px 12px 8px; }
    .style-group{ padding:2px; }
    .style-group .gi{ display:none; }
    .pick{ width:28px; height:28px; }
    .pick .dot{ width:18px; height:18px; }
    #fontPicks .pick{ font-size:14px; }
  }
  .style-picks{ display:flex; gap:6px; flex-shrink:0; }
  .style-group{ display:flex; align-items:center; gap:1px; padding:2px 3px 2px 8px; background:var(--surface); border:1px solid var(--line); border-radius:999px; }
  .style-group .gi{ font-size:15px; color:var(--muted); margin-right:2px; }
  .pick{ position:relative; width:30px; height:30px; padding:0; border:none; background:transparent; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--ink); }
  .pick:hover{ background:var(--line); }
  .pick .dot{ width:20px; height:20px; border-radius:50%; box-shadow:inset 0 0 0 1px rgba(0,0,0,.18); }
  #themePicks .pick[aria-pressed="true"]{ box-shadow:inset 0 0 0 2px var(--accent); }
  #fontPicks .pick{ font-size:16px; line-height:1; }
  #fontPicks .pick[aria-pressed="true"]{ background:var(--accent); color:var(--on-accent); }
  .pick[data-tip]::after{ content:attr(data-tip); position:absolute; top:calc(100% + 8px); left:50%; transform:translate(-50%,-4px); background:var(--ink); color:var(--bg);
    font-family:'Pretendard',sans-serif; font-size:11px; white-space:nowrap; padding:5px 8px; border-radius:6px; opacity:0; pointer-events:none; transition:opacity .15s,transform .15s; z-index:40; }
  .pick[data-tip]:hover::after, .pick[data-tip]:focus-visible::after{ opacity:1; transform:translate(-50%,0); }
  #fontPicks .pick:last-child[data-tip]::after{ left:auto; right:0; transform:translate(0,-4px); }
  #fontPicks .pick:last-child[data-tip]:hover::after{ transform:translate(0,0); }

  /* ───────── 대표 화면 (회전 장식・금박 제목・반짝임) ───────── */
  .hero{ position:relative; overflow:hidden; background:var(--hero-bg); border-bottom:1px solid var(--line); }
  /* jinseon50th 대표 화면과 같은 연꽃 장식 */
  .hero-deco{ position:absolute; left:50%; top:50%; width:820px; height:820px; color:var(--gold); opacity:.24; pointer-events:none; transform:translate(-50%,-50%); animation:spin 120s linear infinite; }
  body[data-theme="yatai"] .hero-deco{ opacity:.2; }
  @media (min-width:900px){ .hero-deco{ width:1000px; height:1000px; opacity:.34; } body[data-theme="yatai"] .hero-deco{ opacity:.26; } }
  .hero-in{ position:relative; z-index:2; max-width:960px; margin:0 auto; padding:40px 108px 44px 20px; }
  body[data-theme="yatai"] .hero-in{ padding-top:84px; }
  body[data-theme="sea"] .hero-in{ padding-bottom:64px; }
  .kicker{ display:flex; align-items:center; gap:10px; margin:0 0 10px; color:var(--gold); font-family:'Pretendard',sans-serif; font-weight:700; font-size:12px; letter-spacing:.22em; }
  .kicker::before{ content:""; width:22px; height:1px; background:var(--gold); }
  .hero h1{ margin:0; font-family:var(--f-head); font-weight:var(--head-w); font-size:calc(clamp(30px,8vw,52px) * var(--head-scale)); line-height:1.18; letter-spacing:-.01em;
    background:var(--foil); background-size:220% 100%; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; animation:shine 7s ease-in-out infinite; filter:var(--foil-shadow); }
  .hero .subtitle{ margin:12px 0 0; padding-left:12px; border-left:2px solid color-mix(in srgb,var(--gold) 55%,transparent); color:var(--muted); font-size:calc(15px * var(--body-scale)); line-height:1.6; }
  .hero .subtitle:empty{ display:none; }

  .spark{ position:absolute; z-index:1; width:14px; height:14px; background:var(--foil); background-size:200% 100%; pointer-events:none; opacity:0;
    clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%); animation:twinkle 5s ease-in-out infinite; }
  .spark.s1{ left:14%; top:24%; animation-delay:.4s; }
  .spark.s2{ left:52%; top:16%; width:10px; height:10px; animation-delay:2.1s; }
  .spark.s3{ left:66%; top:66%; width:12px; height:12px; animation-delay:3.6s; }
  @keyframes twinkle{ 0%,100%{ opacity:0; transform:scale(.3) rotate(0); } 50%{ opacity:.75; transform:scale(1) rotate(45deg); } }

  /* 매화: 천천히 도는 꽃 + 드문드문 떨어지는 꽃잎 */
  .ume-deco{ display:none; position:absolute; inset:0; pointer-events:none; z-index:1; }
  body[data-theme="ume"] .ume-deco{ display:block; }
  .blossom{ position:absolute; animation:turn 40s linear infinite; }
  .blossom.b1{ right:108px; top:14px; width:58px; height:58px; opacity:.55; }
  .blossom.b2{ right:120px; bottom:10px; width:28px; height:28px; opacity:.45; animation-duration:28s; animation-direction:reverse; }
  @media (max-width:480px){ .blossom.b1{ right:88px; } }
  .blossom.b3{ right:30px; bottom:22px; width:40px; height:40px; opacity:.35; animation-duration:52s; }
  @keyframes turn{ to{ transform:rotate(360deg); } }
  .petals i{ position:absolute; top:-20px; width:11px; height:9px; border-radius:60% 0 60% 0; background:#F2C6D2; opacity:.6; animation:fall 20s linear infinite; }
  .petals i:nth-child(2n){ background:#E7A4B6; width:8px; height:7px; }
  .petals i:nth-child(1){ left:10%; animation-duration:19s; animation-delay:0s; }
  .petals i:nth-child(2){ left:32%; animation-duration:24s; animation-delay:6s; }
  .petals i:nth-child(3){ left:55%; animation-duration:21s; animation-delay:11s; }
  .petals i:nth-child(4){ left:74%; animation-duration:23s; animation-delay:3s; }
  .petals i:nth-child(5){ left:88%; animation-duration:20s; animation-delay:15s; }
  @keyframes fall{ 0%{ transform:translate(0,-20px) rotate(0); opacity:0; } 8%{ opacity:.6; } 50%{ transform:translate(26px,170px) rotate(180deg); } 92%{ opacity:.5; } 100%{ transform:translate(-8px,380px) rotate(360deg); opacity:0; } }

  /* 야타이: 등불이 바람에 위아래로 살짝 흔들림 */
  .lanterns{ display:none; position:absolute; left:0; right:0; top:0; z-index:1; justify-content:space-around; padding:0 12px; pointer-events:none; }
  body[data-theme="yatai"] .lanterns{ display:flex; }
  .lanterns i{ position:relative; width:20px; height:28px; margin-top:20px; border-radius:9px;
    background:radial-gradient(circle at 50% 38%,#FFE3B0,#F08A3C 62%,#B8561E); box-shadow:0 0 18px rgba(240,138,60,.55);
    animation:bob 6s ease-in-out infinite alternate, glow 5s ease-in-out infinite; }
  .lanterns i:nth-child(even){ margin-top:32px; background:radial-gradient(circle at 50% 38%,#FFF4CC,#E8C170 62%,#A97C2A); box-shadow:0 0 18px rgba(232,193,112,.5); }
  .lanterns i:nth-child(2){ animation-delay:-1.5s,-2s; } .lanterns i:nth-child(3){ animation-delay:-3s,-1s; } .lanterns i:nth-child(4){ animation-delay:-4.5s,-3s; }
  .lanterns i:nth-child(5){ animation-delay:-2s,-4s; } .lanterns i:nth-child(6){ animation-delay:-5s,-.5s; } .lanterns i:nth-child(7){ animation-delay:-.8s,-2.5s; }
  .lanterns i::before{ content:""; position:absolute; left:50%; bottom:100%; width:1px; height:40px; background:rgba(255,255,255,.22); }
  .lanterns i::after{ content:""; position:absolute; left:3px; right:3px; top:8px; bottom:8px; border-top:1px solid rgba(90,40,10,.35); border-bottom:1px solid rgba(90,40,10,.35); }
  @keyframes bob{ from{ transform:translateY(-3px); } to{ transform:translateY(5px); } }
  @keyframes glow{ 0%,100%{ opacity:1; } 50%{ opacity:.85; } }

  /* 겨울 바다: 잔잔한 물결 + 천천히 지는 해 */
  .sea-deco{ display:none; }
  body[data-theme="sea"] .sea-deco{ display:block; }
  .waves{ position:absolute; left:0; bottom:-1px; width:200%; height:40px; z-index:1; animation:wave 48s linear infinite; pointer-events:none; }
  .waves.back{ height:50px; opacity:.45; animation-duration:70s; animation-direction:reverse; }
  @keyframes wave{ to{ transform:translateX(-50%); } }
  .tower{ position:absolute; right:14%; bottom:26px; z-index:0; width:40px; height:150px; color:var(--accent); opacity:.16; pointer-events:none; }
  .sun{ position:absolute; right:5%; top:22px; width:84px; height:84px; border-radius:50%; z-index:0; pointer-events:none;
    background:radial-gradient(circle,#FBE0CF 0%,#F4A98A 55%,rgba(244,169,138,0) 72%); opacity:.75; animation:sunset 90s ease-in-out infinite alternate; }
  @keyframes sunset{
    from{ transform:translate(0,0); opacity:.75; filter:saturate(1); }
    to{ transform:translate(-70px,110px); opacity:.55; filter:saturate(1.5) hue-rotate(-12deg); }
  }

  /* ───────── 시계 + D-Day ───────── */
  .clock-dday-widget{ position:fixed; right:16px; z-index:20; width:76px; border-radius:14px; overflow:hidden; background:var(--surface);
    border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line)); box-shadow:0 8px 20px -10px rgba(0,0,0,.35); display:flex; flex-direction:column; }
  .cw-time-wrap{ padding:9px 0 7px; display:flex; flex-direction:column; align-items:center; gap:1px; }
  .cw-date{ font-family:'Pretendard',sans-serif; font-size:9px; font-weight:600; color:var(--muted); }
  .cw-time{ font-family:'Pretendard',sans-serif; font-size:17px; font-weight:800; color:var(--ink); letter-spacing:-0.5px; font-variant-numeric:tabular-nums; }
  .cw-dday{ display:none; align-items:center; justify-content:center; padding:4px 0; background:var(--foil); background-size:220% 100%; animation:shine 7s ease-in-out infinite;
    font-family:'Pretendard',sans-serif; font-size:12px; font-weight:800; color:#2A1A04; }
  @media (max-width:480px){ .clock-dday-widget{ width:64px; } .cw-time{ font-size:14px; } .cw-dday{ font-size:11px; } }

  /* ───────── 메모 ───────── */
  .memo-section{ max-width:760px; margin:22px auto 0; padding:0 16px; }
  .memo-card{ position:relative; background:var(--surface); border:1px solid color-mix(in srgb,var(--gold) 28%,var(--line)); border-radius:var(--radius);
    padding:14px 16px 14px 44px; margin-bottom:12px; box-shadow:0 12px 30px -26px rgba(0,0,0,.5); }
  .memo-card::after{ content:""; position:absolute; inset:5px; border:1px solid color-mix(in srgb,var(--gold) 14%,transparent); border-radius:calc(var(--radius) - 3px); pointer-events:none; }
  .memo-pin{ position:absolute; left:15px; top:15px; font-size:18px; color:var(--accent); }
  /* 중요 메모: 강조 색 바탕 + 금박 왼쪽 띠 + '중요' 배지 */
  .memo-card.important{ overflow:hidden; background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 11%,var(--surface)),var(--surface) 70%);
    border-color:color-mix(in srgb,var(--accent) 55%,var(--line)); box-shadow:0 14px 30px -22px color-mix(in srgb,var(--accent) 70%,transparent); }
  .memo-card.important::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--foil); background-size:100% 220%; }
  .memo-card.important .memo-pin{ font-size:19px; }
  .memo-card.important .memo-content{ font-weight:700; }
  .memo-badge{ display:inline-block; margin-right:8px; padding:1px 8px; border-radius:999px; background:var(--accent); color:var(--on-accent);
    font-family:'Pretendard',sans-serif; font-size:11px; font-weight:800; letter-spacing:.04em; vertical-align:2px; }
  .edit-row.important-row{ border-left:4px solid var(--accent); }
  .memo-content{ margin:0; font-size:calc(15px * var(--body-scale)); line-height:1.65; white-space:pre-line; }
  .memo-date{ font-family:'Pretendard',sans-serif; font-weight:800; color:var(--gold); margin-right:8px; font-size:13px; }

  main{ max-width:760px; margin:20px auto; padding:0 16px 4px; }

  /* ───────── 카테고리 타일 ───────── */
  .cat-grid{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px; margin-bottom:16px; }
  @media (min-width:640px){ .cat-grid{ grid-template-columns:repeat(3, minmax(0,1fr)); } }
  .tile{ position:relative; overflow:hidden; display:flex; flex-direction:column; gap:12px; padding:16px 16px 14px; text-align:left; cursor:pointer;
    background:var(--tile); color:var(--ink); border:1px solid color-mix(in srgb,var(--gold) 24%,var(--line)); border-radius:var(--radius);
    box-shadow:0 12px 30px -28px rgba(0,0,0,.5); transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s,border-color .35s; min-height:118px; }
  .tile::after{ content:""; position:absolute; inset:5px; border:1px solid color-mix(in srgb,var(--gold) 13%,transparent); border-radius:calc(var(--radius) - 3px); pointer-events:none; transition:border-color .35s; }
  .tile::before{ content:""; position:absolute; top:0; bottom:0; left:-60%; width:40%; background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent); transform:skewX(-18deg); pointer-events:none; opacity:0; }
  body[data-theme="yatai"] .tile::before{ background:linear-gradient(100deg,transparent,rgba(255,220,160,.16),transparent); }
  .tile:hover{ transform:translateY(-3px); border-color:color-mix(in srgb,var(--gold) 55%,var(--line)); box-shadow:0 22px 40px -28px color-mix(in srgb,var(--accent) 60%,transparent); }
  .tile:hover::before{ opacity:1; animation:gloss .9s ease; }
  @keyframes gloss{ from{ left:-60%; } to{ left:130%; } }
  .tile:hover::after{ border-color:color-mix(in srgb,var(--gold) 38%,transparent); }
  .tile.active{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent), 0 22px 40px -28px color-mix(in srgb,var(--accent) 60%,transparent); }
  .tile-top{ display:flex; align-items:center; gap:8px; }
  .tile-no{ font-family:'Pretendard',sans-serif; font-weight:800; font-size:13px; letter-spacing:.1em; color:var(--gold); font-variant-numeric:tabular-nums; }
  .tile-rule{ flex:1; height:1px; background:linear-gradient(90deg,color-mix(in srgb,var(--gold) 55%,transparent),transparent); }
  .tile-icon{ flex:none; display:grid; place-items:center; width:38px; height:38px; border-radius:50%; border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);
    color:var(--gold); font-size:19px; transition:background .35s,color .35s,border-color .35s; }
  .tile:hover .tile-icon, .tile.active .tile-icon{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .tile-title{ font-family:var(--f-head); font-weight:var(--head-w); font-size:calc(18px * var(--head-scale)); line-height:1.3; }
  .tile-meta{ font-family:'Pretendard',sans-serif; font-size:11px; color:var(--muted); font-weight:600; letter-spacing:.02em; }
  .tile.is-hidden{ opacity:.45; }

  /* ───────── 열린 카테고리 패널 ───────── */
  .content-panel{ display:none; position:relative; background:var(--surface); border:1px solid color-mix(in srgb,var(--gold) 30%,var(--line)); border-radius:var(--radius);
    overflow:hidden; margin-bottom:16px; box-shadow:0 20px 40px -34px rgba(0,0,0,.55); animation:panelIn .35s ease; }
  @keyframes panelIn{ from{ opacity:0; transform:translateY(8px); } }
  .content-panel::before{ content:""; position:absolute; left:0; right:0; top:0; height:3px; background:var(--foil); background-size:220% 100%; animation:shine 7s ease-in-out infinite; }
  .content-panel-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:16px 16px 12px; border-bottom:1px solid var(--line); }
  .content-panel-title{ display:flex; align-items:center; gap:10px; font-family:var(--f-head); font-weight:var(--head-w); font-size:calc(20px * var(--head-scale)); }
  .content-panel-title .ti{ color:var(--gold); font-size:22px; }
  .content-panel-close{ border:none; background:none; color:var(--muted); font-size:20px; cursor:pointer; width:40px; height:40px; border-radius:50%; }
  .content-panel-close:hover{ background:var(--line); }
  .content-panel-body{ padding:16px; overflow-x:auto; }
  .panel-edit-btn{ margin-top:16px; border:1px dashed color-mix(in srgb,var(--gold) 50%,var(--line)); background:var(--accent-soft); color:var(--ink);
    font-family:'Pretendard',sans-serif; font-size:13px; font-weight:700; padding:10px 12px; border-radius:10px; cursor:pointer; width:100%; }

  table{ width:100%; border-collapse:collapse; font-size:14px; }
  .view-table th{ background:var(--accent-soft); color:var(--ink); font-weight:700; text-align:left; padding:9px 10px; border-bottom:2px solid var(--gold); white-space:nowrap; font-family:'Pretendard',sans-serif; font-size:13px; }
  .view-table td{ padding:10px; border-bottom:1px solid var(--line); font-size:calc(14px * var(--body-scale)); }
  .view-table tr:last-child td{ border-bottom:none; }
  a.row-link{ color:var(--accent); font-weight:700; text-decoration:none; }
  body[data-theme="yatai"] a.row-link{ color:var(--gold); }
  .copy-btn{ margin-left:6px; border:1px solid var(--line); background:var(--surface); color:var(--muted); font-size:11px; padding:3px 8px; border-radius:6px; cursor:pointer; }
  .empty{ color:var(--muted); font-size:13px; padding:10px 0; font-family:'Pretendard',sans-serif; }

  /* 일정 */
  .sch-day{ margin-bottom:18px; }
  .sch-day:last-child{ margin-bottom:0; }
  .sch-day-head{ display:flex; align-items:baseline; gap:10px; margin:0 0 8px; padding-bottom:8px; border-bottom:1px solid color-mix(in srgb,var(--gold) 40%,var(--line)); }
  .sch-dn{ font-family:var(--f-head); font-weight:var(--head-w); font-size:calc(19px * var(--head-scale)); }
  .sch-date{ font-family:'Pretendard',sans-serif; font-size:13px; font-weight:600; color:var(--muted); }
  .sch-today{ margin-left:auto; font-family:'Pretendard',sans-serif; font-size:11px; font-weight:800; color:#2A1A04; padding:3px 9px; border-radius:999px; background:var(--foil); background-size:220% 100%; animation:shine 7s ease-in-out infinite; }
  .sch-list{ list-style:none; margin:0; padding:0; position:relative; }
  .sch-list::before{ content:""; position:absolute; left:61px; top:8px; bottom:8px; width:1px; background:linear-gradient(color-mix(in srgb,var(--gold) 60%,transparent),color-mix(in srgb,var(--gold) 15%,transparent)); }
  .sch-list li{ position:relative; display:grid; grid-template-columns:48px 1fr; gap:26px; padding:7px 0; }
  .sch-list li::after{ content:""; position:absolute; left:57px; top:13px; width:9px; height:9px; border-radius:50%; background:var(--surface); border:2px solid var(--gold); }
  .sch-time{ text-align:right; font-family:'Pretendard',sans-serif; font-size:13px; font-weight:800; color:var(--gold); font-variant-numeric:tabular-nums; padding-top:2px; }
  .sch-body b{ display:block; font-size:calc(15px * var(--body-scale)); font-weight:700; line-height:1.5; }
  .sch-place{ display:inline-flex; align-items:center; gap:3px; margin-top:2px; font-size:12px; color:var(--muted); font-family:'Pretendard',sans-serif; }
  .sch-day.today .sch-list li::after{ background:var(--accent); border-color:var(--accent); }

  /* 명단 */
  .name-groups{ display:flex; flex-direction:column; gap:16px; }
  .name-group-head{ display:flex; align-items:baseline; gap:8px; margin:0 0 6px; font-family:var(--f-head); font-weight:var(--head-w); font-size:calc(16px * var(--head-scale)); }
  .name-group-head small{ font-family:'Pretendard',sans-serif; font-size:12px; color:var(--gold); font-weight:700; }
  .name-list{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:0 18px; }
  .name-item{ display:flex; align-items:baseline; gap:6px; padding:9px 2px; border-bottom:1px solid var(--line); font-size:calc(15px * var(--body-scale)); min-width:0; }
  .name-num{ color:var(--gold); font-family:'Pretendard',sans-serif; font-weight:700; font-size:12px; min-width:18px; flex-shrink:0; font-variant-numeric:tabular-nums; }
  .name-star{ font-weight:700; }
  .name-label{ word-break:keep-all; }
  .name-note{ font-size:11px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  @media (max-width:600px){ .name-list{ grid-template-columns:repeat(2, minmax(0,1fr)); } }
  @media (max-width:360px){ .name-list{ grid-template-columns:1fr; } }

  /* 지도 */
  .map-wrap{ display:flex; flex-direction:column; gap:10px; }
  .map-container{ width:100%; height:260px; border-radius:12px; overflow:hidden; border:1px solid var(--line); z-index:0; }
  body[data-theme="yatai"] .leaflet-tile-pane{ filter:invert(1) hue-rotate(185deg) brightness(.85) contrast(.9) saturate(.6); }
  .map-list{ display:flex; flex-direction:column; }
  .map-list-item{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 2px; border-bottom:1px solid var(--line); font-size:calc(14px * var(--body-scale)); }
  .map-list-item:last-child{ border-bottom:none; }
  .map-list-no{ flex:none; width:24px; height:24px; border-radius:50%; background:var(--accent); color:var(--on-accent); display:grid; place-items:center; font-family:'Pretendard',sans-serif; font-size:12px; font-weight:800; }
  .map-list-text{ display:flex; flex-direction:column; min-width:0; flex:1; }
  .map-list-name{ font-weight:700; }
  .map-list-desc{ font-size:12px; color:var(--muted); margin-top:2px; }
  .num-marker{ width:26px !important; height:26px !important; margin:-13px 0 0 -13px !important; border-radius:50%; background:#B8325A; color:#fff; border:2px solid #fff;
    display:grid; place-items:center; font:800 12px 'Pretendard',sans-serif; box-shadow:0 2px 6px rgba(0,0,0,.35); }

  .error-banner{ background:var(--danger-bg); color:var(--danger); border:1px solid var(--danger); border-radius:10px; padding:16px 18px; margin:16px 0; font-size:14px; line-height:1.6; font-family:'Pretendard',sans-serif; }

  /* ───────── 날씨・환율 카드 (타일 아래 2단) ───────── */
  .info-cards{ max-width:760px; margin:0 auto; padding:0 16px 48px; display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px; }
  @media (max-width:600px){ .info-cards{ grid-template-columns:1fr; } }
  .info-card{ position:relative; display:flex; flex-direction:column; gap:12px; padding:16px; background:var(--tile); color:var(--ink);
    border:1px solid color-mix(in srgb,var(--gold) 24%,var(--line)); border-radius:var(--radius); box-shadow:0 12px 30px -28px rgba(0,0,0,.5); min-width:0; }
  .info-card::after{ content:""; position:absolute; inset:5px; border:1px solid color-mix(in srgb,var(--gold) 13%,transparent); border-radius:calc(var(--radius) - 3px); pointer-events:none; }
  .info-head{ display:flex; align-items:center; gap:8px; }
  .info-head .ti{ font-size:18px; color:var(--gold); }
  .info-title{ font-family:var(--f-head); font-weight:var(--head-w); font-size:calc(17px * var(--head-scale)); }
  .info-sub{ margin-left:auto; font-family:'Pretendard',sans-serif; font-size:11px; font-weight:600; color:var(--muted); }
  .info-big{ display:flex; align-items:center; gap:12px; }
  .info-big .wx-icon{ font-size:44px; color:var(--accent); line-height:1; }
  .info-num{ font-family:'Pretendard',sans-serif; font-weight:800; font-size:34px; letter-spacing:-1px; line-height:1; font-variant-numeric:tabular-nums;
    background:var(--foil); background-size:220% 100%; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; animation:shine 7s ease-in-out infinite; filter:var(--foil-shadow); }
  .info-desc{ font-family:'Pretendard',sans-serif; font-size:13px; color:var(--muted); line-height:1.5; }
  .info-desc b{ color:var(--ink); }
  .info-tip{ display:flex; align-items:center; gap:6px; padding:8px 10px; border-radius:10px; background:var(--accent-soft); font-family:'Pretendard',sans-serif; font-size:12px; font-weight:600; }
  .info-tip .ti{ color:var(--accent); font-size:16px; }
  .wx-days{ display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:4px; border-top:1px solid var(--line); padding-top:10px; }
  .wx-day{ display:flex; flex-direction:column; align-items:center; gap:3px; font-family:'Pretendard',sans-serif; font-size:11px; color:var(--muted); border-radius:8px; padding:4px 0; }
  .wx-day .ti{ font-size:20px; color:var(--ink); }
  .wx-day b{ color:var(--ink); font-size:12px; font-variant-numeric:tabular-nums; }
  .wx-day.trip{ background:var(--accent-soft); color:var(--ink); }
  .info-foot{ margin-top:auto; font-family:'Pretendard',sans-serif; font-size:11px; color:var(--muted); line-height:1.5; }
  .fx-row{ display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:6px; }
  .fx-field{ display:flex; align-items:center; border:1px solid var(--line); border-radius:10px; background:var(--surface); padding:0 10px; min-width:0; }
  .fx-field:focus-within{ outline:2px solid var(--accent); outline-offset:-1px; }
  .fx-field input{ flex:1; min-width:0; border:none; background:none; color:var(--ink); font-family:'Pretendard',sans-serif; font-size:16px; font-weight:700; padding:10px 0; text-align:right; outline:none; font-variant-numeric:tabular-nums; }
  .fx-field span{ font-family:'Pretendard',sans-serif; font-size:13px; font-weight:700; color:var(--muted); margin-left:4px; }
  .fx-swap{ color:var(--gold); font-size:18px; }
  .fx-chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .fx-chip{ border:1px solid var(--line); background:var(--surface); color:var(--ink); font-family:'Pretendard',sans-serif; font-size:12px; font-weight:600; padding:6px 10px; border-radius:999px; cursor:pointer; min-height:32px; }
  .fx-chip:hover{ border-color:var(--accent); background:var(--accent-soft); }

  /* ───────── 하단 ───────── */
  footer{ position:relative; background:var(--surface); border-top:1px solid var(--line); padding:26px 20px 22px; text-align:center; }
  footer::before{ content:""; position:absolute; left:0; right:0; top:0; height:3px; background:var(--foil); background-size:220% 100%; animation:shine 7s ease-in-out infinite; }
  .footer-brand{ display:inline-flex; align-items:center; gap:10px; }
  .footer-text{ font-family:var(--f-head); font-weight:var(--head-w); font-size:calc(16px * var(--head-scale)); }
  footer img{ height:32px; opacity:0.9; }
  .loading{ text-align:center; color:var(--muted); padding:60px 0; font-size:14px; }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation:none !important; transition:none !important; }
    .petals, .spark{ display:none !important; }
  }

  /* ───────── 관리자 로그인 ───────── */
  .admin-toggle{ display:block; margin:12px auto 0; background:none; border:none; color:var(--muted); font-family:'Pretendard',sans-serif; font-size:11px; text-decoration:underline; cursor:pointer; }
  .admin-login-panel{ display:none; margin:10px auto 0; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--accent-soft); text-align:left; max-width:240px; font-family:'Pretendard',sans-serif; }
  .admin-login-panel input{ width:100%; margin-bottom:8px; font-size:12px; padding:7px 8px; border:1px solid var(--line); border-radius:6px; background:var(--surface); color:var(--ink); }
  .admin-login-panel input[readonly]{ color:var(--muted); }
  .admin-login-panel button{ font-size:12px; padding:6px 12px; border-radius:6px; border:1px solid var(--line); background:var(--surface); cursor:pointer; color:var(--ink); }
  .admin-status{ font-size:11px; color:var(--muted); margin-top:6px; }
  .admin-status.error{ color:var(--danger); }

  /* ───────── 관리자 대시보드 ───────── */
  .dash{ display:none; position:fixed; inset:0; z-index:100; background:var(--bg); flex-direction:column; font-family:'Pretendard',sans-serif; }
  .dash.open{ display:flex; }
  .dash-head{ background:var(--surface); border-bottom:1px solid var(--line); position:relative; }
  .dash-head::before{ content:""; position:absolute; top:0; left:0; right:0; height:3px; background:var(--foil); background-size:220% 100%; }
  .dash-head-inner{ max-width:1000px; margin:0 auto; padding:14px 16px 0; }
  .dash-title-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .dash-title{ font-size:18px; font-weight:800; margin:0; }
  .dash-user{ font-size:11px; color:var(--muted); margin-top:2px; }
  .dash-actions{ display:flex; gap:6px; }
  .dash-tabs{ display:flex; gap:2px; overflow-x:auto; margin-top:12px; scrollbar-width:none; }
  .dash-tabs::-webkit-scrollbar{ display:none; }
  .dash-tab{ border:none; background:none; color:var(--muted); font-size:13px; font-weight:700; padding:10px 12px; cursor:pointer; border-bottom:3px solid transparent;
    white-space:nowrap; display:flex; align-items:center; gap:4px; font-family:inherit; }
  .dash-tab.active{ color:var(--ink); border-bottom-color:var(--accent); }
  .dash-cat-tabs{ display:contents; }
  .dash-tab.muted-tab{ opacity:.6; }
  .dash-body{ flex:1; overflow-y:auto; }
  .dash-body-inner{ max-width:1000px; margin:0 auto; padding:18px 16px 80px; font-size:13px; }

  .btn{ border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:12px; font-weight:700; padding:7px 11px; border-radius:8px; cursor:pointer;
    white-space:nowrap; font-family:inherit; display:inline-flex; align-items:center; gap:4px; }
  .btn:hover{ border-color:var(--muted); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .btn.danger{ background:var(--danger-bg); border-color:transparent; color:var(--danger); }
  .btn.icon{ padding:6px 7px; }
  .btn.on{ background:var(--accent-soft); border-color:var(--accent); }
  .btn:disabled{ opacity:0.4; cursor:default; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  .card-title{ font-weight:800; font-size:14px; margin:0 0 4px; display:flex; align-items:center; gap:6px; }
  .card-desc{ font-size:12px; color:var(--muted); margin:0 0 12px; line-height:1.6; }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:720px){ .grid-2{ grid-template-columns:1fr; } }

  .kpi-row{ display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; margin-bottom:14px; }
  @media (max-width:720px){ .kpi-row{ grid-template-columns:repeat(2, 1fr); } }
  .kpi{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .kpi-label{ font-size:12px; color:var(--muted); font-weight:700; }
  .kpi-value{ font-size:26px; font-weight:800; margin-top:4px; letter-spacing:-0.5px; }
  .kpi-sub{ font-size:11px; color:var(--muted); margin-top:2px; }

  .vbar-chart{ display:flex; align-items:flex-end; gap:2px; height:150px; padding-top:20px; border-bottom:1px solid var(--line); }
  .vbar-col{ flex:1; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; position:relative; cursor:default; outline:none; }
  .vbar{ width:70%; max-width:26px; background:var(--bar); border-radius:4px 4px 0 0; }
  .vbar-col.zero .vbar{ height:2px !important; background:var(--line); border-radius:0; }
  .vbar-val{ position:absolute; font-size:11px; font-weight:800; color:var(--ink); padding-bottom:2px; }
  .vbar-x{ display:flex; gap:2px; margin-top:4px; }
  .vbar-x span{ flex:1; text-align:center; font-size:10px; color:var(--muted); white-space:nowrap; }
  .tip{ position:fixed; z-index:200; pointer-events:none; background:var(--ink); color:var(--bg); font-family:'Pretendard',sans-serif; font-size:12px; padding:6px 9px;
    border-radius:6px; white-space:nowrap; display:none; box-shadow:0 2px 8px rgba(0,0,0,0.2); }
  .hbar-list{ display:flex; flex-direction:column; gap:8px; }
  .hbar-row{ display:grid; grid-template-columns:minmax(70px, 30%) 1fr 34px; gap:8px; align-items:center; font-size:12px; outline:none; }
  .hbar-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hbar-track{ height:14px; }
  .hbar{ height:100%; background:var(--bar); border-radius:0 4px 4px 0; min-width:2px; }
  .hbar-val{ text-align:right; font-weight:800; }

  .check-list, .log-list{ list-style:none; margin:0; padding:0; }
  .check-list li{ display:flex; gap:8px; align-items:flex-start; padding:8px 0; border-bottom:1px solid var(--line); line-height:1.5; }
  .check-list li:last-child, .log-list li:last-child{ border-bottom:none; }
  .check-list .ti{ font-size:16px; margin-top:1px; }
  .check-ok .ti{ color:var(--ok); }
  .check-warn .ti{ color:var(--accent); }
  .log-list li{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); }
  .log-time{ color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums; }

  .form-row{ display:grid; grid-template-columns:120px 1fr; gap:10px; align-items:center; padding:8px 0; }
  @media (max-width:520px){ .form-row{ grid-template-columns:1fr; gap:4px; } }
  .form-row > label{ font-size:12px; font-weight:700; color:var(--muted); }
  .field{ font-size:13px; padding:7px 9px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); font-family:inherit; width:100%; min-width:0; }
  .field:focus{ outline:2px solid var(--accent); outline-offset:-1px; }
  .field:disabled{ color:var(--muted); background:var(--bg); }
  textarea.field{ resize:vertical; min-height:38px; line-height:1.5; }
  select.field{ cursor:pointer; }
  .logo-preview{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .logo-preview img{ height:40px; max-width:120px; object-fit:contain; background:var(--accent-soft); border-radius:6px; padding:4px; }

  .edit-row{ display:flex; gap:8px; align-items:flex-start; padding:10px; border:1px solid var(--line); border-radius:10px; background:var(--surface); margin-bottom:8px; flex-wrap:wrap; }
  .edit-row.dirty{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .edit-row.hidden-row{ opacity:0.6; }
  .edit-row.flash{ animation:flash 2.4s ease; }
  @keyframes flash{ 0%,40%{ background:var(--accent-soft); box-shadow:0 0 0 2px var(--accent); } }

  .pill{ font-size:11px; color:var(--muted); background:var(--accent-soft); border-radius:10px; padding:2px 8px; white-space:nowrap; align-self:center; }
  .type-badge{ display:inline-flex; align-items:center; gap:3px; font-size:11px; font-weight:700; padding:2px 8px; border-radius:10px; background:var(--accent-soft); color:var(--ink); }

  .mini-grid{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px; }
  @media (max-width:720px){ .mini-grid{ grid-template-columns:repeat(2, minmax(0,1fr)); } }
  .mini-grid .tile{ min-height:96px; padding:12px; gap:8px; font-family:var(--f-body); }
  .mini-grid .tile-title{ font-size:calc(15px * var(--head-scale)); }
  .mini-grid .tile-icon{ width:30px; height:30px; font-size:15px; }

  .type-cards{ display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:8px; margin-bottom:12px; }
  @media (max-width:720px){ .type-cards{ grid-template-columns:repeat(2, minmax(0,1fr)); } }
  .type-card{ position:relative; display:flex; flex-direction:column; gap:4px; padding:12px; border:1px solid var(--line); border-radius:10px; cursor:pointer; background:var(--surface); }
  .type-card input{ position:absolute; opacity:0; pointer-events:none; }
  .type-card .ti{ font-size:22px; color:var(--gold); }
  .type-card b{ font-size:13px; }
  .type-card span{ font-size:11px; color:var(--muted); line-height:1.5; }
  .type-card.notice-link{ text-align:left; font-family:inherit; color:var(--ink); border-style:dashed; }
  .type-card.notice-link:hover{ border-color:var(--accent); background:var(--accent-soft); }
  .type-card:has(input:checked){ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); background:var(--accent-soft); }
  .type-card:has(input:focus-visible){ outline:3px solid var(--accent); outline-offset:2px; }

  .icon-pick{ position:relative; }
  .icon-pick summary{ list-style:none; width:42px; height:42px; border:1px solid var(--line); border-radius:10px; display:grid; place-items:center; cursor:pointer; font-size:20px; color:var(--gold); background:var(--surface); }
  .icon-pick summary::-webkit-details-marker{ display:none; }
  .icon-pick[open] summary{ border-color:var(--accent); }
  .icon-pop{ position:absolute; z-index:20; top:48px; left:0; width:268px; padding:10px; background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:0 12px 30px -12px rgba(0,0,0,.35); }
  .icon-pop-grid{ display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; margin-bottom:8px; }
  .icon-pop-grid button{ width:32px; height:32px; border:1px solid transparent; border-radius:8px; background:none; color:var(--ink); font-size:18px; cursor:pointer; display:grid; place-items:center; }
  .icon-pop-grid button:hover, .icon-pop-grid button.on{ border-color:var(--accent); background:var(--accent-soft); }

  .chip-row{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .chip{ border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:12px; padding:6px 12px; border-radius:16px; cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; gap:4px; }
  .chip.active{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:700; }
  .chip.muted{ color:var(--muted); text-decoration:line-through; }

  .item-table-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:var(--surface); }
  .item-table{ font-size:12px; }
  .item-table th{ background:var(--accent-soft); color:var(--ink); font-weight:700; text-align:left; padding:8px 6px; white-space:nowrap; border-bottom:1px solid var(--line); }
  .item-table td{ padding:6px; vertical-align:top; border-bottom:1px solid var(--line); }
  .item-table td.num{ color:var(--muted); text-align:center; width:28px; padding-top:13px; font-weight:700; }
  .item-table tr.dirty td{ background:var(--accent-soft); }
  .item-table tr.new-row td{ background:var(--bg); }
  .item-table tr.picking td{ background:var(--accent-soft); box-shadow:inset 0 2px 0 var(--accent), inset 0 -2px 0 var(--accent); }
  .item-table tr.day-sep td{ background:var(--bg); font-weight:800; color:var(--gold); padding:6px 10px; }
  .item-table .chkcol{ width:34px; text-align:center; padding:12px 4px 6px 8px; }
  .item-table tr.day-sep td.chkcol{ padding:6px 4px 6px 8px; }
  .item-table input[type=checkbox], .bulk-bar input[type=checkbox]{ width:17px; height:17px; accent-color:var(--accent); cursor:pointer; margin:0; }
  .item-table tr.selected td{ background:color-mix(in srgb,var(--accent) 9%,var(--surface)); }
  .bulk-bar{ position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:8px 10px; margin-bottom:8px;
    background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:0 6px 14px -12px rgba(0,0,0,.4); }
  .bulk-bar .chk{ font-weight:700; color:var(--ink); padding:4px 2px; }
  .item-table .field.locked{ background:var(--bg); cursor:default; color:var(--muted); }
  .fix-banner{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:12px 14px; margin-bottom:10px; border-radius:10px;
    background:var(--accent-soft); border:2px solid var(--accent); font-size:13px; font-weight:700; line-height:1.5; }
  .fix-banner > .ti{ font-size:22px; color:var(--accent); }

  .item-table .field{ min-width:90px; font-size:12px; padding:6px 7px; }

  .toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:300; background:var(--ink); color:var(--bg); font-family:'Pretendard',sans-serif;
    font-size:13px; padding:10px 16px; border-radius:10px; box-shadow:0 4px 14px rgba(0,0,0,0.25); display:none; max-width:calc(100% - 32px); text-align:center; }
  .toast.error{ background:var(--danger); color:#fff; }
</style>
