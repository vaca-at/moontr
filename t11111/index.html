  window.addEventListener('load', positionClockWidget);
  positionClockWidget();

  const DAYS = ['일','월','화','수','목','금','토'];
  function updateClock() {
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('cwTime').textContent = hh + ':' + mm;
    document.getElementById('cwDate').textContent = (now.getMonth()+1) + '/' + now.getDate() + '(' + DAYS[now.getDay()] + ')';
  }
  updateClock();
  setInterval(updateClock, 15000);

  function ddayValue() {
    const target = parseISODate(settings.ddayDate);
    if (!target) return null;
    return Math.round((target - startOfDay(new Date())) / 86400000);
  }
  function ddayText(dday) { return dday === 0 ? 'D-DAY' : (dday > 0 ? 'D-' + dday : 'D+' + Math.abs(dday)); }
  function updateDdayBadge() {
    const cwDday = document.getElementById('cwDday');
    const dday = ddayValue();
    if (dday === null) { cwDday.style.display = 'none'; return; }
    cwDday.style.display = 'flex';
    cwDday.textContent = ddayText(dday);
  }

  // ---------------- 날짜 도우미 ----------------
  function startOfDay(d) { const x = new Date(d); x.setHours(0,0,0,0); return x; }
  function parseISODate(s) {
    const m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(s || '').trim());
    if (!m) return null;
    const d = new Date(+m[1], +m[2] - 1, +m[3]);
    return isNaN(d) ? null : d;
  }
  function fmtDay(d) { return (d.getMonth()+1) + '/' + d.getDate(); }
  function fmtDayW(d) { return fmtDay(d) + ' (' + DAYS[d.getDay()] + ')'; }
  function fmtDateTime(d) { return fmtDay(d) + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }

  // ---------------- 카테고리 종류 ----------------
  // 일정・명단・지도는 정해진 칸, 표는 칸을 직접 정함
  const TYPES = {
    schedule: { label: '일정', icon: 'calendar-event', desc: '날짜・시간별 일정표. 날짜별로 묶여 보입니다.', columns: ['날짜', '시간', '내용', '장소'] },
    people:   { label: '명단', icon: 'users', desc: '선생님 명단. 구분(교장・부장・교사…)과 이름.', columns: ['구분', '이름', '비고'] },
    map:      { label: '지도', icon: 'map-pin', desc: '방문지 지도. 장소를 검색하거나 지도를 눌러 좌표 입력.', columns: ['장소명', '위도', '경도', '설명', '링크'] },
    table:    { label: '표', icon: 'table', desc: '자유 형식 표. 칸 이름을 직접 정합니다.', columns: null }
  };
  const TYPE_ORDER = ['schedule', 'people', 'map', 'table'];
  function catType(cat) {
    if (cat.type && TYPES[cat.type]) return cat.type;
    const cols = cat.columns || [];
    if (cols.indexOf('위도') > -1 && cols.indexOf('경도') > -1) return 'map';
    if (cols.indexOf('구분') > -1 && cols.indexOf('이름') > -1) return 'people';
    return 'table';
  }
  // 종류를 바꿀 때: 정해진 칸 + 기존에만 있던 칸(데이터 보존)
  function columnsForType(type, oldCols) {
    const preset = TYPES[type].columns;
    if (!preset) return (oldCols || []).slice();
    return preset.concat((oldCols || []).filter(function(c) { return preset.indexOf(c) === -1; }));
  }
  const ICONS = ['calendar-event','users','map-pin','bed','luggage','plane','bus','train','tools-kitchen-2','camera','school','building-bank',
    'phone','first-aid-kit','info-circle','notes','clipboard-list','currency-yen','shopping-bag','ticket','route','flag','star','heart',
    'gift','sun','cloud-snow','link'];
  function iconHtml(icon, type) {
    const v = String(icon || '').trim();
    if (!v) return '<i class="ti ti-' + TYPES[type].icon + '" aria-hidden="true"></i>';
    if (/^[a-z0-9-]+$/.test(v)) return '<i class="ti ti-' + v + '" aria-hidden="true"></i>';
    return '<span aria-hidden="true">' + escapeHtml(v) + '</span>';
  }

  // ---------------- 접속 기록 (익명: 종류・카테고리명・시각만) ----------------
  function addLog(type, category) {
    if (isAdmin) return;
    db.collection('gt_logs').add({ type: type, category: category || '', at: firebase.firestore.FieldValue.serverTimestamp() })
      .catch(function() {});
  }
  // 로그인 상태가 확인된 뒤 호출 (관리자 방문은 기록하지 않음)
  let visitChecked = false;
  function logVisitOnce() {
    if (visitChecked) return;
    visitChecked = true;
    if (isAdmin) return;
    let seen = false;
    try { seen = sessionStorage.getItem('gtVisited') === '1'; sessionStorage.setItem('gtVisited', '1'); } catch(e) {}
    if (!seen) addLog('visit', '');
  }

  // ---------------- Firestore 실시간 구독 ----------------
  db.collection('gt_settings').doc('main').onSnapshot(function(doc) {
    if (doc.exists) settings = Object.assign({ title:'', subtitle:'', kicker:'', ddayDate:'', logoUrl:'', theme:'', font:'' }, doc.data());
    loadWeather();   // 연수 기간(D-Day) 예보 표시는 설정이 와야 알 수 있음 (30분 캐시라 다시 받지 않음)
    applyStyle();
    renderAll();
  }, function(err) { showError(err); });

  db.collection('gt_categories').orderBy('order').onSnapshot(function(snap) {
    categories = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
    renderAll();
  }, function(err) { showError(err); });

  db.collection('gt_items').onSnapshot(function(snap) {
    items = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
    renderAll();
  }, function(err) { showError(err); });

  db.collection('gt_memos').orderBy('order', 'desc').onSnapshot(function(snap) {
    memos = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
    renderAll();
  }, function(err) { showError(err); });

  function showError(err) {
    document.getElementById('main').innerHTML =
      '<div class="error-banner"><strong>불러오기 오류</strong><br>' + escapeHtml(err && err.message ? err.message : String(err)) + '</div>';
  }

  // ---------------- 렌더링 ----------------
  function renderAll() {
    const title = settings.title || '50주년 해외연수(GT)';
    document.getElementById('pageTitle').textContent = title;
    document.title = title;
    document.getElementById('pageKicker').textContent = settings.kicker || DEFAULT_KICKER;
    document.getElementById('pageSubtitle').textContent = settings.subtitle || '';
    document.getElementById('schoolLogo').src = settings.logoUrl || DEFAULT_LOGO;
    updateDdayBadge();
    positionClockWidget();
    renderMemos();
    renderCategories();
    refreshDashboard();
  }

  function sortedMemos() { return memos.slice().sort(function(a,b){ return (b.order||0) - (a.order||0); }); }
  function sortedCategories() { return categories.slice().sort(function(a,b){ return (a.order||0) - (b.order||0); }); }
  function itemsOf(catId) {
    return items.filter(function(it){ return it.categoryId === catId; })
      .sort(function(a,b){ return (a.order||0) - (b.order||0); });
  }
  function fieldOf(it, col) { return (it.fields && it.fields[col] !== undefined && it.fields[col] !== null) ? String(it.fields[col]) : ''; }
  // 일정: 날짜 → 시간 → 입력 순서
  function sortSchedule(list) {
    return list.slice().sort(function(a, b) {
      const da = fieldOf(a, '날짜'), dbb = fieldOf(b, '날짜');
      if (da !== dbb) { if (!da) return 1; if (!dbb) return -1; return da < dbb ? -1 : 1; }
      const ta = fieldOf(a, '시간'), tb = fieldOf(b, '시간');
      if (ta !== tb) { if (!ta) return 1; if (!tb) return -1; return ta < tb ? -1 : 1; }
      return (a.order||0) - (b.order||0);
    });
  }

  function renderMemos() {
    const box = document.getElementById('memoSection');
    box.innerHTML = '';
    const shown = sortedMemos().filter(function(m){ return m.show !== false; });
    // 중요 메모를 맨 위로 (각 묶음 안에서는 원래 순서 유지)
    shown.filter(function(m) { return m.important; }).concat(shown.filter(function(m) { return !m.important; })).forEach(function(m) {
      const card = document.createElement('div');
      card.className = 'memo-card' + (m.important ? ' important' : '');
      card.innerHTML =
        '<i class="ti ' + (m.important ? 'ti-alert-circle' : 'ti-pin') + ' memo-pin" aria-hidden="true"></i>' +
        '<p class="memo-content">' +
        (m.important ? '<span class="memo-badge">중요</span>' : '') +
        (m.date ? '<span class="memo-date">' + escapeHtml(m.date) + '</span>' : '') + escapeHtml(m.content || '') +
        '</p>';
      box.appendChild(card);
    });
  }

  function buildTile(cat, idx) {
    const type = catType(cat);
    const count = itemsOf(cat.id).length;
    const tile = document.createElement('button');
    tile.className = 'tile';
    tile.innerHTML =
      '<span class="tile-top"><span class="tile-no">' + String(idx + 1).padStart(2, '0') + '</span><span class="tile-rule"></span>' +
      '<span class="tile-icon">' + iconHtml(cat.icon, type) + '</span></span>' +
      '<span class="tile-title">' + escapeHtml(cat.name || '') + '</span>' +
      '<span class="tile-meta">' + TYPES[type].label + (count ? ' · ' + count + (type === 'people' ? '명' : '개') : '') + '</span>';
    return tile;
  }

  function renderCategories() {
    const main = document.getElementById('main');
    main.innerHTML = '';
    const grid = document.createElement('div');
    grid.className = 'cat-grid';
    const panel = document.createElement('div');
    panel.className = 'content-panel';
    const visibleCats = categories.filter(function(c){ return c.show !== false; });

    visibleCats.forEach(function(cat, idx) {
      const tile = buildTile(cat, idx);
      tile.setAttribute('aria-expanded', String(cat.id === openCategoryId));
      if (cat.id === openCategoryId) tile.classList.add('active');
      tile.addEventListener('click', function() {
        if (openCategoryId === cat.id) { openCategoryId = null; renderCategories(); return; }
        openCategoryId = cat.id;
        addLog('open', cat.name);
        renderCategories();
        panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
      grid.appendChild(tile);
    });

    if (!visibleCats.length && categories.length === 0) {
      main.innerHTML = '<div class="empty" style="text-align:center;padding:40px 0">아직 등록된 카테고리가 없습니다.</div>';
      return;
    }
    main.appendChild(grid);
    main.appendChild(panel);

    const cat = visibleCats.find(function(c){ return c.id === openCategoryId; });
    if (cat) openCategoryPanel(cat, panel);
  }

  function openCategoryPanel(cat, panel) {
    const type = catType(cat);
    panel.innerHTML = '';
    const head = document.createElement('div');
    head.className = 'content-panel-head';
    head.innerHTML = '<span class="content-panel-title">' + iconHtml(cat.icon, type) + '<span>' + escapeHtml(cat.name) + '</span></span>';
    const closeBtn = document.createElement('button');
    closeBtn.className = 'content-panel-close';
    closeBtn.setAttribute('aria-label', '닫기');
    closeBtn.innerHTML = '<i class="ti ti-x"></i>';
    closeBtn.addEventListener('click', function() { openCategoryId = null; renderCategories(); });
    head.appendChild(closeBtn);
    panel.appendChild(head);

    const body = document.createElement('div');
    body.className = 'content-panel-body';
    window.__mapInstances = [];
    const catItems = itemsOf(cat.id);
    if (!catItems.length) body.appendChild(emptyNode());
    else if (type === 'schedule') body.appendChild(buildScheduleView(catItems));
    else if (type === 'people') body.appendChild(buildPeopleView(catItems));
    else if (type === 'map') body.appendChild(buildMapView(catItems));
    else body.appendChild(buildTable(cat.columns || [], catItems));

    if (isAdmin) {
      const editBtn = document.createElement('button');
      editBtn.className = 'panel-edit-btn';
      editBtn.innerHTML = '<i class="ti ti-pencil"></i> 관리자: 이 카테고리 내용 입력';
      editBtn.addEventListener('click', function() { dashItemCatId = cat.id; openDashboard('items'); });
      body.appendChild(editBtn);
    }
    panel.appendChild(body);
    panel.style.display = 'block';
    setTimeout(function() {
      (window.__mapInstances || []).forEach(function(m) { try { m.invalidateSize(); } catch(e) {} });
    }, 60);
  }

  function emptyNode() {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = '등록된 내용이 없습니다.';
    return empty;
  }

  function buildTable(headers, catItems) {
    if (!headers.length) return emptyNode();
    const table = document.createElement('table');
    table.className = 'view-table';
    const trh = document.createElement('tr');
    headers.forEach(function(h){ const th = document.createElement('th'); th.textContent = h; trh.appendChild(th); });
    const thead = document.createElement('thead'); thead.appendChild(trh); table.appendChild(thead);
    const tbody = document.createElement('tbody');
    catItems.forEach(function(it) {
      const tr = document.createElement('tr');
      headers.forEach(function(col) {
        const td = document.createElement('td');
        const text = fieldOf(it, col);
        if (/^https?:\/\//.test(text)) {
          const a = document.createElement('a');
          a.className = 'row-link'; a.href = text; a.target = '_blank'; a.rel = 'noopener'; a.textContent = '바로가기';
          td.appendChild(a);
          const copyBtn = document.createElement('button');
          copyBtn.className = 'copy-btn'; copyBtn.textContent = '복사';
          copyBtn.addEventListener('click', function(e){
            e.stopPropagation();
            navigator.clipboard.writeText(text).then(function(){
              copyBtn.textContent = '완료!'; setTimeout(function(){ copyBtn.textContent = '복사'; }, 1200);
            });
          });
          td.appendChild(copyBtn);
        } else {
          td.textContent = text;
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    return table;
  }

  function buildScheduleView(catItems) {
    const wrap = document.createElement('div');
    const list = sortSchedule(catItems);
    const groups = [];
    list.forEach(function(it) {
      const key = fieldOf(it, '날짜');
      let g = groups[groups.length - 1];
      if (!g || g.key !== key) { g = { key: key, rows: [] }; groups.push(g); }
      g.rows.push(it);
    });
    const firstDate = groups.map(function(g) { return parseISODate(g.key); }).filter(Boolean)[0];
    const today = startOfDay(new Date());
    groups.forEach(function(g) {
      const d = parseISODate(g.key);
      const sec = document.createElement('section');
      sec.className = 'sch-day';
      let dn, dateTxt = '';
      if (d && firstDate) { dn = (Math.round((d - firstDate) / 86400000) + 1) + '일차'; dateTxt = fmtDayW(d); }
      else dn = g.key || '날짜 미정';
      const isToday = d && d.getTime() === today.getTime();
      if (isToday) sec.classList.add('today');
      sec.innerHTML = '<h3 class="sch-day-head"><span class="sch-dn">' + escapeHtml(dn) + '</span>' +
        (dateTxt ? '<span class="sch-date">' + dateTxt + '</span>' : '') + (isToday ? '<span class="sch-today">오늘</span>' : '') + '</h3>';
      const ol = document.createElement('ol');
      ol.className = 'sch-list';
      g.rows.forEach(function(it) {
        const li = document.createElement('li');
        const place = fieldOf(it, '장소');
        li.innerHTML = '<span class="sch-time">' + escapeHtml(fieldOf(it, '시간')) + '</span>' +
          '<div class="sch-body"><b>' + escapeHtml(fieldOf(it, '내용')) + '</b>' +
          (place ? '<span class="sch-place"><i class="ti ti-map-pin" aria-hidden="true"></i>' + escapeHtml(place) + '</span>' : '') + '</div>';
        ol.appendChild(li);
      });
      sec.appendChild(ol);
      wrap.appendChild(sec);
    });
    return wrap;
  }

  // 이름 가운데 글자 가리기: 정민상 → 정*상, 홍길 → 홍*, 남궁민수 → 남**수 (이미 * 가 있으면 그대로)
  function maskName(name) {
    const s = String(name || '').trim();
    if (!s || s.indexOf('*') > -1) return s;
    const ch = Array.from(s);
    if (ch.length === 1) return s;
    if (ch.length === 2) return ch[0] + '*';
    return ch[0] + '*'.repeat(ch.length - 2) + ch[ch.length - 1];
  }
  // 명단 한 줄 읽기. "번호 / 구분 / 이름"을 붙여넣어 구분=번호, 이름=구분, 비고=이름으로 밀린 줄도 바로잡음
  function peopleFields(f) {
    f = f || {};
    const g = String(f['구분'] == null ? '' : f['구분']).trim();
    const n = String(f['이름'] == null ? '' : f['이름']).trim();
    const b = String(f['비고'] == null ? '' : f['비고']).trim();
    if (isNumStr(g) && n && b) return { 구분: n, 이름: b, 비고: '' };
    return { 구분: g, 이름: n, 비고: b };
  }
  // 칸이 밀렸거나, 공개 데이터에 가리지 않은 전체 이름이 남아 있으면 정리 대상
  function peopleNeedsFix(f) {
    const p = peopleFields(f);
    const shifted = ['구분', '이름', '비고'].some(function(c) { return String((f || {})[c] == null ? '' : f[c]).trim() !== p[c]; });
    const unmasked = !!p.이름 && p.이름.indexOf('*') === -1 && Array.from(p.이름).length > 1;
    return shifted || unmasked;
  }

  // ---- 명단 전체 이름: 공개 데이터(gt_items)에는 가린 이름만, 전체 이름은 관리자만 읽는 gt_people_private/{항목ID} = { name } ----
  let privateNames = {};        // 항목ID → 전체 이름 (관리자 로그인 중에만)
  let privateNamesError = null;
  let unsubPrivate = null;
  // 저장할 칸을 공개용(가린 이름)과 관리자용 전체 이름으로 나눔
  function splitPeople(type, fields) {
    if (type !== 'people') return { pub: fields, full: null };
    const full = String(fields['이름'] == null ? '' : fields['이름']).trim();
    return { pub: Object.assign({}, fields, { 이름: maskName(full) }), full: full && full.indexOf('*') === -1 ? full : null };
  }
  // 공개 저장이 끝난 뒤 전체 이름을 따로 저장 (규칙이 아직 없어도 공개 저장은 막히지 않게)
  function savePrivateNames(list) {
    list = list.filter(function(x) { return x && x.full; });
    if (!list.length) return Promise.resolve();
    return batchWrite(list.map(function(x) {
      return function(b) { b.set(db.collection('gt_people_private').doc(x.id), { name: x.full }); };
    })).then(function() {
      list.forEach(function(x) { privateNames[x.id] = x.full; });
    }).catch(function(err) {
      toast('가린 이름은 저장했지만 관리자용 전체 이름은 저장하지 못했습니다. Firestore 규칙에 gt_people_private를 추가하세요. (' + (err.code || err.message) + ')', true);
    });
  }
  function deletePrivateNames(ids) {
    if (!ids.length) return Promise.resolve();
    return batchWrite(ids.map(function(id) {
      return function(b) { b.delete(db.collection('gt_people_private').doc(id)); };
    })).catch(function() {});
  }
  // 명단 표기
  //  교장・교감・부장 → "정*상 교장선생님", "이*아 교감선생님", "이*호 부장선생님"
  //  행정실장 → "김*식 행정실장님" (구분이 '행정실장'이거나, 교장・교감과 함께 맨 앞 묶음에 있는 '행정실')
  //  행정실 → "김*우 행정실선생님"
  //  그 밖의 모든 분 → "국어과 손*현선생님" (구분 + 띄우고 + 이름선생님), 구분이 없으면 "손*현선생님"
  function peopleLabel(gubun, name, isChief) {
    const g = String(gubun || '').trim();
    const n = '<b class="name-star">' + escapeHtml(maskName(name)) + '</b>';
    if (g === '교장' || g === '교감' || /부장$/.test(g)) return n + ' ' + escapeHtml(g) + '선생님';
    if (g === '행정실장' || isChief) return n + ' 행정실장님';
    if (g === '행정실') return n + ' 행정실선생님';
    if (!g) return n + '선생님';
    return escapeHtml(g) + ' ' + n + '선생님';
  }
  function buildPeopleView(catItems) {
    const container = document.createElement('div');
    container.className = 'name-list';
    let num = 0;
    let inLeadBlock = true;   // 맨 앞 교장・교감・행정실장 묶음
    catItems.forEach(function(it) {
      const p = peopleFields(it.fields);
      const gubun = p.구분, name = p.이름, note = p.비고;
      if (!gubun && !name) return;
      num++;
      if (['교장', '교감', '행정실', '행정실장'].indexOf(gubun) === -1) inLeadBlock = false;
      const isChief = inLeadBlock && gubun === '행정실';
      if (isChief) inLeadBlock = false;   // 실장은 한 분
      const item = document.createElement('div'); item.className = 'name-item';
      const nameSpan = '<span class="name-label">' + peopleLabel(gubun, name, isChief) + '</span>';
      item.innerHTML = '<span class="name-num">' + num + '</span><span style="min-width:0">' + nameSpan +
        (note ? '<br><span class="name-note">' + escapeHtml(note) + '</span>' : '') + '</span>';
      container.appendChild(item);
    });
    return container;
  }

  function numIcon(n) {
    return L.divIcon({ className: '', html: '<div class="num-marker" style="background:' + getComputedStyle(document.body).getPropertyValue('--accent').trim() + '">' + n + '</div>', iconSize: [26, 26] });
  }
  const FUKUOKA = [33.5902, 130.4017];

  // 지도 바탕: OSM 공식 타일. 이용 정책상 예전 a/b/c 하위 주소는 막히고, 사이트 주소(Referer)가 있어야 함
  // (index.html 을 파일로 직접 열면 Referer가 없어 "Access blocked"가 뜸 — 실제 사이트에서는 정상)
  // 야타이 디자인은 CSS로 색을 뒤집어 어두운 지도처럼 보이게 함
  function addBaseTiles(map) {
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>',
      maxZoom: 19, referrerPolicy: 'strict-origin-when-cross-origin'
    }).addTo(map);
  }

  // 지도 한 줄 읽기. 위도・경도 칸이 정상이면 그대로, 아니면 칸이 밀렸거나
  // "33.59, 130.40"을 한 칸에 넣은 경우에도 숫자 두 개를 찾아 좌표로, http… 는 링크로 봄
  function isNumStr(v) { return /^\s*-?\d+(\.\d+)?\s*$/.test(String(v == null ? '' : v)); }
  function splitPair(v) {
    const m = /^\s*(-?\d+(?:\.\d+)?)\s*[,\s]\s*(-?\d+(?:\.\d+)?)\s*$/.exec(String(v == null ? '' : v));
    return m ? [+m[1], +m[2]] : null;
  }
  const MAP_COLS = ['장소명', '위도', '경도', '설명', '링크'];
  // 좌표로 여는 구글 지도 링크 (링크 칸이 비었을 때 [길찾기]도 같은 주소)
  function gmapLink(lat, lng) { return 'https://www.google.com/maps/search/?api=1&query=' + lat + '%2C' + lng; }
  // 구글 지도 링크에서 좌표 읽기
  //  1) !3d위도!4d경도 — 장소의 실제 위치 (여러 개면 마지막 것이 장소, 앞의 것은 찍은 핀)
  //  2) @위도,경도 — 화면 중심
  //  3) query= / q= / ll= / destination= 뒤의 "위도,경도"
  //  짧은 링크(maps.app.goo.gl)에는 좌표가 없어 읽을 수 없음
  function coordsFromLink(url) {
    let s = String(url || '');
    try { s = decodeURIComponent(s); } catch (e) {}
    let m, last = null;
    const re = /!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/g;
    while ((m = re.exec(s))) last = m;
    if (!last) last = /@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/.exec(s);
    if (!last) last = /[?&](?:query|q|ll|destination|center)=(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/.exec(s);
    if (!last) return null;
    const lat = +last[1], lng = +last[2];
    if (Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
    return { lat: lat, lng: lng };
  }
  function mapFields(f) {
    f = f || {};
    const get = function(c) { return String(f[c] == null ? '' : f[c]).trim(); };
    let out;
    if (isNumStr(get('위도')) && isNumStr(get('경도'))) {
      out = { 장소명: get('장소명'), 설명: get('설명'), 위도: get('위도'), 경도: get('경도'), 링크: get('링크') };
    } else {
      const texts = [], nums = [];
      let link = '';
      MAP_COLS.map(get).filter(Boolean).forEach(function(v) {
        const p = splitPair(v);
        if (p) nums.push(p[0], p[1]);
        else if (isNumStr(v)) nums.push(+v);
        else if (/^https?:\/\//i.test(v) && !link) link = v;
        else texts.push(v);
      });
      out = { 장소명: texts[0] || '', 설명: texts.slice(1).join(' '), 위도: nums.length >= 2 ? String(nums[0]) : '', 경도: nums.length >= 2 ? String(nums[1]) : '', 링크: link };
    }
    // 위도・경도를 거꾸로 넣은 경우 (위도는 ±90 안)
    if (isNumStr(out.위도) && isNumStr(out.경도) && Math.abs(+out.위도) > 90 && Math.abs(+out.경도) <= 90) {
      const t = out.위도; out.위도 = out.경도; out.경도 = t;
    }
    out.lat = parseFloat(out.위도); out.lng = parseFloat(out.경도);
    out.ok = !isNaN(out.lat) && !isNaN(out.lng);
    return out;
  }
  function mapNeedsFix(f) {
    const m = mapFields(f);
    return MAP_COLS.some(function(c) { return String((f || {})[c] == null ? '' : f[c]).trim() !== m[c]; });
  }

  function buildMapView(catItems) {
    const wrap = document.createElement('div');
    wrap.className = 'map-wrap';
    const mapId = 'map-' + Math.random().toString(36).slice(2, 9);
    const mapDiv = document.createElement('div'); mapDiv.className = 'map-container'; mapDiv.id = mapId;
    wrap.appendChild(mapDiv);
    const listDiv = document.createElement('div'); listDiv.className = 'map-list';
    const points = [];
    catItems.forEach(function(it, i) {
      const mf = mapFields(it.fields);
      const lat = mf.lat, lng = mf.lng;
      const hasCoords = mf.ok;
      const name = mf.장소명;
      const desc = mf.설명;
      const rawLink = mf.링크;
      const link = rawLink || (hasCoords ? gmapLink(lat, lng) : '');
      if (hasCoords) points.push({ lat: lat, lng: lng, name: name, desc: desc, n: i + 1 });
      const item = document.createElement('div'); item.className = 'map-list-item';
      item.innerHTML = '<span class="map-list-no">' + (i + 1) + '</span>';
      const textDiv = document.createElement('div'); textDiv.className = 'map-list-text';
      textDiv.innerHTML = '<span class="map-list-name">' + escapeHtml(name) + '</span>' +
        (desc ? '<span class="map-list-desc">' + escapeHtml(desc) + '</span>' : '') +
        (!hasCoords ? '<span class="map-list-desc">지도 좌표가 없습니다</span>' : '');
      item.appendChild(textDiv);
      if (link) {
        const a = document.createElement('a'); a.className = 'row-link'; a.href = link; a.target = '_blank'; a.rel = 'noopener'; a.textContent = '길찾기';
        item.appendChild(a);
      }
      listDiv.appendChild(item);
    });
    wrap.appendChild(listDiv);

    setTimeout(function() {
      if (typeof L === 'undefined') return;
      const map = L.map(mapId, { scrollWheelZoom: false });
      addBaseTiles(map);
      const markers = points.map(function(p) {
        const marker = L.marker([p.lat, p.lng], { icon: numIcon(p.n) }).addTo(map);
        if (p.name) marker.bindPopup('<b>' + escapeHtml(p.name) + '</b>' + (p.desc ? '<br>' + escapeHtml(p.desc) : ''));
        return marker;
      });
      if (!points.length) map.setView(FUKUOKA, 11);
      else if (points.length === 1) map.setView([points[0].lat, points[0].lng], 15);
      else map.fitBounds(L.featureGroup(markers).getBounds().pad(0.2));
      window.__mapInstances.push(map);
    }, 0);
    return wrap;
  }

  // ---------------- 날씨・환율 카드 ----------------
  // 30분 동안은 같은 기기에서 다시 받지 않음 (저장이 막힌 브라우저면 매번 받음)
  function cachedFetch(key, url, maxAgeMs) {
    try {
      const c = JSON.parse(localStorage.getItem(key) || 'null');
      if (c && Date.now() - c.t < maxAgeMs) return Promise.resolve(c.d);
    } catch (e) {}
    return fetch(url).then(function(r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function(d) {
      try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), d: d })); } catch (e) {}
      return d;
    });
  }
  // WMO 날씨 코드 → [설명, 아이콘]
  function wxInfo(code) {
    if (code === 0) return ['맑음', 'sun'];
    if (code <= 2) return ['구름 조금', 'sun-high'];
    if (code === 3) return ['흐림', 'cloud'];
    if (code === 45 || code === 48) return ['안개', 'mist'];
    if (code >= 51 && code <= 57) return ['이슬비', 'cloud-rain'];
    if (code >= 61 && code <= 67) return ['비', 'cloud-rain'];
    if (code >= 71 && code <= 77) return ['눈', 'snowflake'];
    if (code >= 80 && code <= 82) return ['소나기', 'umbrella'];
    if (code === 85 || code === 86) return ['눈 소나기', 'cloud-snow'];
    if (code >= 95) return ['뇌우', 'cloud-storm'];
    return ['흐림', 'cloud'];
  }
  function clothesTip(feels) {
    if (feels <= 3) return '두꺼운 패딩, 목도리・장갑까지 챙기세요.';
    if (feels <= 8) return '패딩이나 두꺼운 코트가 좋아요.';
    if (feels <= 13) return '코트나 니트 위주로 입으세요.';
    if (feels <= 18) return '가벼운 겉옷 하나면 충분해요.';
    return '얇은 옷차림으로 괜찮아요.';
  }
  function loadWeather() {
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=33.5902&longitude=130.4017' +
      '&current=temperature_2m,apparent_temperature,weather_code' +
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&forecast_days=16';
    cachedFetch('gtWx', url, 30 * 60000).then(function(d) {
      const cur = d.current || {};
      const w = wxInfo(cur.weather_code);
      const t = Math.round(cur.temperature_2m), f = Math.round(cur.apparent_temperature);
      document.getElementById('wxIcon').className = 'ti ti-' + w[1] + ' wx-icon';
      document.getElementById('wxTemp').textContent = t + '°';
      document.getElementById('wxDesc').innerHTML = '<b>' + w[0] + '</b> · 체감 ' + f + '°';
      const hm = String(cur.time || '').slice(11, 16);
      document.getElementById('wxNow').textContent = '현지 ' + (hm || '지금') + ' 기준';
      const tip = document.getElementById('wxTip');
      tip.querySelector('span').textContent = '옷차림: ' + clothesTip(f);
      tip.hidden = false;

      // 연수 기간이 예보 범위(16일) 안에 들어오면 그 날들을, 아니면 오늘부터 5일
      const days = (d.daily && d.daily.time) || [];
      const start = settings.ddayDate || '';
      let from = days.indexOf(start);
      const tripMode = from > -1;
      if (!tripMode) from = 0;
      const box = document.getElementById('wxDays');
      box.innerHTML = '';
      days.slice(from, from + 5).forEach(function(ds, i) {
        const k = from + i;
        const dt = parseISODate(ds);
        const wi = wxInfo(d.daily.weather_code[k]);
        const rain = d.daily.precipitation_probability_max ? d.daily.precipitation_probability_max[k] : null;
        const cell = document.createElement('div');
        cell.className = 'wx-day' + (tripMode && i < 4 ? ' trip' : '');
        cell.title = wi[0] + (rain != null ? ' · 강수확률 ' + rain + '%' : '');
        cell.innerHTML = '<span>' + (i === 0 && !tripMode ? '오늘' : fmtDay(dt) + ' ' + DAYS[dt.getDay()]) + '</span>' +
          '<i class="ti ti-' + wi[1] + '" aria-label="' + wi[0] + '"></i>' +
          '<b>' + Math.round(d.daily.temperature_2m_max[k]) + '° / ' + Math.round(d.daily.temperature_2m_min[k]) + '°</b>';
        box.appendChild(cell);
      });
      if (tripMode) document.getElementById('wxFoot').textContent = '색칠된 날이 연수 기간 예보입니다. · 날씨: Open-Meteo';
    }).catch(function() {
      document.getElementById('wxNow').textContent = '불러오지 못함';
      document.getElementById('wxDesc').textContent = '잠시 후 다시 열어 주세요.';
    });
  }

  let fxRate = null;   // 1엔 = ?원
  function fmtNum(n) { return Math.round(n).toLocaleString('ko-KR'); }
  function parseNum(s) { const n = parseFloat(String(s).replace(/[^\d.]/g, '')); return isNaN(n) ? 0 : n; }
  function fxFromYen() {
    if (!fxRate) return;
    const yen = parseNum(document.getElementById('fxYen').value);
    document.getElementById('fxWon').value = yen ? fmtNum(yen * fxRate) : '';
  }
  function fxFromWon() {
    if (!fxRate) return;
    const won = parseNum(document.getElementById('fxWon').value);
    document.getElementById('fxYen').value = won ? fmtNum(won / fxRate) : '';
  }
  // 입력하면서 천 단위 쉼표 넣기 (커서는 끝으로)
  function commaInput(input, after) {
    input.addEventListener('input', function() {
      const n = parseNum(input.value);
      input.value = input.value.trim() ? fmtNum(n) : '';
      after();
    });
    input.addEventListener('focus', function() { input.select(); });
  }
  function loadFx() {
    cachedFetch('gtFx', 'https://open.er-api.com/v6/latest/JPY', 30 * 60000).then(function(d) {
      if (!d || !d.rates || !d.rates.KRW) throw new Error('no rate');
      return { rate: d.rates.KRW, at: d.time_last_update_unix ? new Date(d.time_last_update_unix * 1000) : new Date() };
    }).catch(function() {
      // 예비: 다른 무료 환율 자료
      return cachedFetch('gtFx2', 'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/jpy.json', 30 * 60000)
        .then(function(d) { if (!d || !d.jpy || !d.jpy.krw) throw new Error('no rate'); return { rate: d.jpy.krw, at: parseISODate(d.date) || new Date() }; });
    }).then(function(r) {
      fxRate = r.rate;
      document.getElementById('fxRate').textContent = fmtNum(fxRate * 100) + '원';
      document.getElementById('fxDate').textContent = (r.at.getMonth() + 1) + '/' + r.at.getDate() + ' 기준';
      fxFromYen();
    }).catch(function() {
      document.getElementById('fxDate').textContent = '불러오지 못함';
      document.getElementById('fxRate').textContent = '---원';
    });
  }
  (function initInfoCards() {
    commaInput(document.getElementById('fxYen'), fxFromYen);
    commaInput(document.getElementById('fxWon'), fxFromWon);
    const chips = document.getElementById('fxChips');
    [500, 1000, 3000, 5000, 10000].forEach(function(y) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'fx-chip'; b.textContent = fmtNum(y) + '엔';
      b.addEventListener('click', function() { document.getElementById('fxYen').value = fmtNum(y); fxFromYen(); });
      chips.appendChild(b);
    });
    loadWeather();
    loadFx();
  })();

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
  }

  // ---------------- 관리자: 로그인 (Firebase Authentication) ----------------
  const adminToggleBtn = document.getElementById('adminToggleBtn');
  const adminLoginPanel = document.getElementById('adminLoginPanel');
  const adminEmailInput = document.getElementById('adminEmailInput');
  const adminPwInput = document.getElementById('adminPwInput');
  const adminLoginBtn = document.getElementById('adminLoginBtn');
  const adminLoginStatus = document.getElementById('adminLoginStatus');
  adminEmailInput.value = ADMIN_EMAIL;

  function setLoginStatus(msg, isError) {
    adminLoginStatus.textContent = msg;
    adminLoginStatus.classList.toggle('error', !!isError);
  }

  adminToggleBtn.addEventListener('click', function() {
    if (isAdmin) { openDashboard(dashTab || 'overview'); return; }
    const show = adminLoginPanel.style.display !== 'block';
    adminLoginPanel.style.display = show ? 'block' : 'none';
    if (show) adminPwInput.focus();
  });

  function doLogin() {
    const pw = adminPwInput.value;
    if (!pw) { setLoginStatus('비밀번호를 입력하세요.', true); return; }
    adminLoginBtn.disabled = true;
    setLoginStatus('확인 중...', false);
    auth.signInWithEmailAndPassword(ADMIN_EMAIL, pw).then(function() {
      adminPwInput.value = '';
      setLoginStatus('', false);
      adminLoginPanel.style.display = 'none';
      openDashboard('overview');
    }).catch(function(err) {
      const code = err && err.code;
      let msg = '로그인에 실패했습니다. (' + (code || err) + ')';
      if (code === 'auth/invalid-credential' || code === 'auth/wrong-password' || code === 'auth/invalid-login-credentials') msg = '비밀번호가 틀렸습니다.';
      else if (code === 'auth/too-many-requests') msg = '시도가 너무 많습니다. 잠시 후 다시 해주세요.';
      else if (code === 'auth/network-request-failed') msg = '네트워크 연결을 확인하세요.';
      else if (code === 'auth/unauthorized-domain') msg = '이 도메인이 Firebase 승인 도메인에 없습니다.';
      setLoginStatus(msg, true);
    }).finally(function() { adminLoginBtn.disabled = false; });
  }
  adminLoginBtn.addEventListener('click', doLogin);
  adminPwInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });

  auth.onAuthStateChanged(function(user) {
    if (user && user.email === ADMIN_EMAIL) {
      isAdmin = true;
      document.getElementById('dashUser').textContent = user.email + ' 로 로그인됨';
      startAdminData();
    } else {
      if (user) { auth.signOut(); setLoginStatus('관리자 계정이 아닙니다.', true); }
      isAdmin = false;
      stopAdminData();
      closeDashboard(true);
    }
    adminToggleBtn.textContent = isAdmin ? '관리자 대시보드' : '관리자 모드';
    logVisitOnce();
    renderCategories();
  });

  function startAdminData() {
    if (!unsubPrivate) {
      unsubPrivate = db.collection('gt_people_private').onSnapshot(function(snap) {
        privateNames = {};
        snap.docs.forEach(function(d) { privateNames[d.id] = d.data().name || ''; });
        privateNamesError = null;
        if (dashTab === 'items') refreshDashboard();
      }, function(err) {
        privateNamesError = err;
        if (dashTab === 'items') refreshDashboard();
      });
    }
    if (unsubLogs) return;
    const since = startOfDay(new Date()); since.setDate(since.getDate() - 29);
    unsubLogs = db.collection('gt_logs').where('at', '>=', since).orderBy('at', 'desc').onSnapshot(function(snap) {
      logs = snap.docs.map(function(d) {
        const data = d.data({ serverTimestamps: 'estimate' });
        return { id: d.id, type: data.type || 'open', category: data.category || '', at: data.at ? data.at.toDate() : new Date() };
      });
      logsError = null;
      if (dashTab === 'overview') refreshDashboard();
    }, function(err) {
      logsError = err;
      if (dashTab === 'overview') refreshDashboard();
    });
  }
  function stopAdminData() {
    if (unsubLogs) { unsubLogs(); unsubLogs = null; }
    if (unsubPrivate) { unsubPrivate(); unsubPrivate = null; }
    logs = []; logsError = null;
    privateNames = {}; privateNamesError = null;
  }

  // ---------------- 관리자 대시보드: 공통 ----------------
  const dash = document.getElementById('dash');
  const dashBody = document.getElementById('dashBody');
  const dashBodyInner = document.getElementById('dashBodyInner');
  let dashTab = 'overview';
  let dashItemCatId = null;
  let lastAddedCatId = null;
  let adminMap = null;

  function el(tag, attrs, children) {
    const node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function(k) {
      if (k === 'text') node.textContent = attrs[k];
      else if (k === 'html') node.innerHTML = attrs[k];
      else if (k.slice(0, 2) === 'on') node.addEventListener(k.slice(2), attrs[k]);
      else if (k === 'value') node.value = attrs[k];
      else if (k === 'checked' || k === 'disabled') node[k] = !!attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function(c) { if (c) node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return node;
  }
  function icon(name) { return el('i', { class: 'ti ti-' + name, 'aria-hidden': 'true' }); }

  let toastTimer = null;
  function toast(msg, isError) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.toggle('error', !!isError);
    t.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { t.style.display = 'none'; }, isError ? 5000 : 1800);
  }
  function errText(err) {
    if (err && err.code === 'permission-denied') return '권한이 없습니다. 로그인 상태와 Firestore 규칙을 확인하세요.';
    return '오류: ' + (err && err.message ? err.message : String(err));
  }
  // 쓰기 작업 공통 처리: 성공 시 안내 + 해당 행의 '수정됨' 표시 해제 + 화면 갱신
  function run(promise, okMsg, cleanNode) {
    return promise.then(function() {
      if (cleanNode) cleanNode.classList.remove('dirty');
      if (okMsg) toast(okMsg);
      refreshDashboard();
    }).catch(function(err) { toast(errText(err), true); });
  }
  function markDirtyOnInput(node) {
    node.addEventListener('input', function() { node.classList.add('dirty'); });
    node.addEventListener('change', function() { node.classList.add('dirty'); });
  }
  // 문서가 많아도 500개 제한에 걸리지 않게 나눠서 커밋
  function batchWrite(ops) {
    const chunks = [];
    for (let i = 0; i < ops.length; i += 400) chunks.push(ops.slice(i, i + 400));
    return chunks.reduce(function(p, chunk) {
      return p.then(function() { const b = db.batch(); chunk.forEach(function(op) { op(b); }); return b.commit(); });
    }, Promise.resolve());
  }
  function hasUnsaved() { return !!dashBodyInner.querySelector('.dirty'); }
  function confirmLeave() { return !hasUnsaved() || confirm('저장하지 않은 수정이 있습니다. 그래도 이동할까요?'); }

  function openDashboard(tab) {
    if (!isAdmin) return;
    dash.classList.add('open');
    document.body.style.overflow = 'hidden';
    switchTab(tab || 'overview', true);
  }
  function closeDashboard(force) {
    if (!force && !confirmLeave()) return;
    destroyAdminMap();
    dash.classList.remove('open');
    document.body.style.overflow = '';
    hideTip();
  }
  // 상단 탭: 카테고리마다 "○○ 수정" 탭 (카테고리를 추가・이름 변경하면 따라 바뀜)
  function renderDashTabs() {
    const box = document.getElementById('dashCatTabs');
    box.innerHTML = '';
    const cats = sortedCategories();
    if (!cats.length) {
      const b = el('button', { class: 'dash-tab', 'data-tab': 'items' }, [icon('pencil'), '내용 입력']);
      b.addEventListener('click', function() { switchTab('items', false); });
      box.appendChild(b);
    }
    cats.forEach(function(c) {
      const b = el('button', { class: 'dash-tab' + (c.show === false ? ' muted-tab' : ''), 'data-tab': 'items', 'data-cat': c.id,
        html: iconHtml(c.icon, catType(c)) + escapeHtml(c.name) + ' 수정' });
      b.addEventListener('click', function() { openItemsFor(c.id); });
      box.appendChild(b);
    });
    markActiveTab();
  }
  function markActiveTab() {
    document.querySelectorAll('.dash-tab').forEach(function(t) {
      t.classList.toggle('active', t.dataset.tab === dashTab && (!t.dataset.cat || t.dataset.cat === dashItemCatId));
    });
  }
  function openItemsFor(catId) {
    if (dashTab === 'items' && dashItemCatId === catId) return;
    if (!confirmLeave()) return;
    dashItemCatId = catId;
    dashTab = 'items';
    dashBody.scrollTop = 0;
    renderDash();
  }
  function switchTab(tab, force) {
    if (!force && tab !== dashTab && !confirmLeave()) return;
    dashTab = tab;
    markActiveTab();
    dashBody.scrollTop = 0;
    renderDash();
  }
  function destroyAdminMap() { if (adminMap) { try { adminMap.remove(); } catch(e) {} adminMap = null; } }
  function renderDash() {
    const scroll = dashBody.scrollTop;
    destroyAdminMap();
    dashBodyInner.innerHTML = '';
    hideTip();
    if (dashTab === 'overview') renderOverview();
    else if (dashTab === 'settings') renderSettingsTab();
    else if (dashTab === 'categories') renderCategoriesTab();
    else if (dashTab === 'items') renderItemsTab();
    else if (dashTab === 'memos') renderMemosTab();
    renderDashTabs();
    dashBody.scrollTop = scroll;
  }
  // 데이터가 바뀌면 다시 그리되, 편집 중인(저장 안 한) 내용이 있으면 덮어쓰지 않음
  function refreshDashboard() {
    if (!dash.classList.contains('open')) return;
    renderDashTabs();
    if (hasUnsaved()) return;
    renderDash();
  }

  document.getElementById('dashCloseBtn').addEventListener('click', function() { closeDashboard(false); });
  document.getElementById('dashLogoutBtn').addEventListener('click', function() {
    if (!confirmLeave()) return;
    auth.signOut().then(function() { toast('로그아웃했습니다.'); });
  });
  document.querySelectorAll('.dash-tab').forEach(function(t) {
    t.addEventListener('click', function() { switchTab(t.dataset.tab, false); });
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && dash.classList.contains('open')) {
      const openPick = dashBodyInner.querySelector('details.icon-pick[open]');
      if (openPick) { openPick.open = false; return; }
      closeDashboard(false);
    }
  });
  window.addEventListener('beforeunload', function(e) {
    if (dash.classList.contains('open') && hasUnsaved()) { e.preventDefault(); e.returnValue = ''; }
  });

  // 차트 툴팁
  const tipEl = document.getElementById('tip');
  function showTip(target, text) {
    tipEl.textContent = text;
    tipEl.style.display = 'block';
    const r = target.getBoundingClientRect();
    const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
    let left = r.left + r.width / 2 - w / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - w - 8));
    tipEl.style.left = left + 'px';
    tipEl.style.top = Math.max(8, r.top - h - 6) + 'px';
  }
  function hideTip() { tipEl.style.display = 'none'; }
  function bindTip(node, text) {
    node.setAttribute('tabindex', '0');
    node.setAttribute('aria-label', text);
    node.addEventListener('mouseenter', function() { showTip(node, text); });
    node.addEventListener('focus', function() { showTip(node, text); });
    node.addEventListener('mouseleave', hideTip);
    node.addEventListener('blur', hideTip);
  }
  dashBody.addEventListener('scroll', hideTip);

  // ---------------- 탭: 개요 ----------------
  function renderOverview() {
    const today0 = startOfDay(new Date());

    const opens = logs.filter(function(l) { return l.type === 'open'; });
    const todayVisits = visits.filter(function(l) { return l.at >= today0; }).length;
    const weekVisits = visits.filter(function(l) { return l.at >= week0; }).length;
    const visibleCats = categories.filter(function(c) { return c.show !== false; });
    const visibleMemos = memos.filter(function(m) { return m.show !== false; });
    const dday = ddayValue();

    if (logsError) {
      dashBodyInner.appendChild(el('div', { class: 'error-banner', html:
        '<strong>접속 기록을 불러오지 못했습니다.</strong><br>Firestore 규칙에 <b>gt_logs</b> 읽기 권한(관리자)이 있는지 확인하세요.<br><small>' +
        escapeHtml(logsError.message || String(logsError)) + '</small>' }));
    }
    function kpi(label, value, sub) {
      return el('div', { class: 'kpi' }, [
        el('div', { class: 'kpi-label', text: label }),

      ]);

      kpi('최근 7일 방문', weekVisits, '하루 평균 ' + (Math.round(weekVisits / 7 * 10) / 10)),
      kpi('30일 카테고리 열람', opens.length, '방문 ' + visits.length + '회 중'),
      kpi('D-Day', dday === null ? '—' : ddayText(dday), settings.ddayDate || '기준일 미설정')
    ]));

      el('p', { class: 'card-title' }, [icon('database'), '콘텐츠 현황']),

        statLi('내용', items.length + '개 (명단 ' + people + '명)', 'items'),
        statLi('공지・메모', memos.length + '개 (표시 ' + visibleMemos.length + ')', 'memos')
      ])

  function statLi(label, value, tab) {
    return el('li', {}, [el('span', {}, [el('b', { text: label }), '  ' + value]),
      el('button', { class: 'btn', text: '관리', onclick: function() { switchTab(tab, false); } })]);
  }

  function buildVisitChart(visits, today0) {
    const days = 14;
    const counts = [];
    for (let i = days - 1; i >= 0; i--) {
      const d0 = new Date(today0); d0.setDate(d0.getDate() - i);
      const d1 = new Date(d0); d1.setDate(d1.getDate() + 1);
      counts.push({ day: d0, n: visits.filter(function(l) { return l.at >= d0 && l.at < d1; }).length });
    }
    const max = Math.max.apply(null, counts.map(function(c) { return c.n; }));
    const card = el('div', { class: 'card' }, [
      el('p', { class: 'card-title' }, [icon('chart-bar'), '최근 14일 방문']),
      el('p', { class: 'card-desc', text: '브라우저 세션당 1회로 셉니다. 관리자 로그인 상태의 방문은 제외됩니다.' })
    ]);
    if (!max) { card.appendChild(el('div', { class: 'empty', text: '아직 방문 기록이 없습니다.' })); return card; }
    const maxIdx = counts.map(function(c) { return c.n; }).lastIndexOf(max);
    const chart = el('div', { class: 'vbar-chart', role: 'img', 'aria-label': '최근 14일 일별 방문 수 막대 그래프' });
    const xAxis = el('div', { class: 'vbar-x' });
    counts.forEach(function(c, i) {
      const col = el('div', { class: 'vbar-col' + (c.n ? '' : ' zero') });
      const bar = el('div', { class: 'vbar' });
      bar.style.height = (c.n / max * 100) + '%';
      // 오늘과 최댓값만 직접 표시, 나머지는 툴팁
      if (c.n && (i === days - 1 || i === maxIdx)) {
        const val = el('span', { class: 'vbar-val', text: String(c.n) });
        val.style.bottom = (c.n / max * 100) + '%';
        col.appendChild(val);
      }
      col.appendChild(bar);
      bindTip(col, fmtDay(c.day) + ' · 방문 ' + c.n + '회');
      chart.appendChild(col);
      xAxis.appendChild(el('span', { text: (i % 2 === (days - 1) % 2) ? fmtDay(c.day) : '' }));
    });
    card.appendChild(chart);
    card.appendChild(xAxis);
    return card;
  }

  function buildCategoryChart(opens) {
    const card = el('div', { class: 'card' }, [
      el('p', { class: 'card-title' }, [icon('list-numbers'), '카테고리별 열람 (30일)']),
      el('p', { class: 'card-desc', text: '방문자가 카테고리 타일을 눌러 연 횟수입니다.' })
    ]);
    const counts = {};
    opens.forEach(function(l) { counts[l.category] = (counts[l.category] || 0) + 1; });
    categories.forEach(function(c) { if (!(c.name in counts)) counts[c.name] = 0; });
    const rows = Object.keys(counts).map(function(k) { return { name: k, n: counts[k] }; }).sort(function(a, b) { return b.n - a.n; });
    const max = rows.length ? rows[0].n : 0;
    if (!rows.length) { card.appendChild(el('div', { class: 'empty', text: '카테고리가 없습니다.' })); return card; }
    const list = el('div', { class: 'hbar-list' });
    rows.slice(0, 12).forEach(function(r) {
      const bar = el('div', { class: 'hbar' });
      bar.style.width = max ? (r.n / max * 100) + '%' : '0';
      if (!r.n) bar.style.background = 'var(--line)';
      const row = el('div', { class: 'hbar-row' }, [
        el('span', { class: 'hbar-name', text: r.name || '(이름 없음)' }),
        el('div', { class: 'hbar-track' }, [bar]),
        el('span', { class: 'hbar-val', text: String(r.n) })
      ]);
      bindTip(row, (r.name || '(이름 없음)') + ' · 열람 ' + r.n + '회');
      list.appendChild(row);
    });
    card.appendChild(list);
    if (rows.length > 12) card.appendChild(el('p', { class: 'hint', text: '상위 12개만 표시했습니다.' }));
    return card;
  }

  function buildHealthCard(visibleCats) {
    const issues = [];
    if (!settings.title) issues.push(['제목이 비어 있습니다.', 'settings']);
    if (ddayValue() === null) issues.push(['D-Day 기준일이 설정되지 않았습니다.', 'settings']);
    if (!categories.length) issues.push(['카테고리가 하나도 없습니다. 일정・명단・지도부터 만들어 보세요.', 'categories']);
    visibleCats.forEach(function(c) {
      const type = catType(c);
      const list = itemsOf(c.id);
      if (type === 'table' && !(c.columns || []).length) { issues.push(['"' + c.name + '" 표에 칸(컬럼)이 없습니다.', 'categories']); return; }
      if (!list.length) { issues.push(['"' + c.name + '"에 내용이 없습니다 (방문자에게 "등록된 내용이 없습니다"로 보임).', 'items', c.id]); return; }
      if (type === 'map') {
        const bad = list.filter(function(it) { return !mapFields(it.fields).ok; }).length;
        if (bad) issues.push(['"' + c.name + '" 지도 장소 ' + bad + '곳에 좌표가 없습니다.', 'items', c.id]);
        const shifted = list.filter(function(it) { return mapNeedsFix(it.fields); }).length;
        if (shifted) issues.push(['"' + c.name + '" 지도 ' + shifted + '줄의 칸이 밀려 있습니다 (좌표가 설명 칸에 들어감 등). [좌표 칸 자동 정리]로 고치세요.', 'items', c.id]);
      }
      if (type === 'people') {
        const shifted = list.filter(function(it) { return peopleNeedsFix(it.fields); }).length;
        if (shifted) issues.push(['"' + c.name + '" 명단 ' + shifted + '줄이 칸이 밀렸거나 전체 이름이 저장되어 있습니다 (공개 데이터라 누구나 읽을 수 있음). [명단 정리・이름 가리기]로 고치세요.', 'items', c.id]);
      }
      if (type === 'schedule') {
        const bad = list.filter(function(it) { return !parseISODate(fieldOf(it, '날짜')); }).length;
        if (bad) issues.push(['"' + c.name + '" 일정 ' + bad + '개에 날짜가 없습니다.', 'items', c.id]);
      }
    });
    const orphan = items.filter(function(it) { return !categories.some(function(c) { return c.id === it.categoryId; }); }).length;
    if (orphan) issues.push(['어느 카테고리에도 속하지 않은 내용이 ' + orphan + '개 있습니다.', null]);

    const list = el('ul', { class: 'check-list' });
    if (!issues.length) list.appendChild(el('li', { class: 'check-ok' }, [icon('circle-check'), el('span', { text: '점검 결과 문제가 없습니다.' })]));
    issues.forEach(function(iss) {
      const li = el('li', { class: 'check-warn' }, [icon('alert-triangle'), el('span', { style: 'flex:1', text: iss[0] })]);
      if (iss[1]) li.appendChild(el('button', { class: 'btn', text: '고치기', onclick: function() {
        if (iss[2]) dashItemCatId = iss[2];
        switchTab(iss[1], false);
      } }));
      list.appendChild(li);
    });
    return el('div', { class: 'card' }, [el('p', { class: 'card-title' }, [icon('stethoscope'), '점검']), list]);
  }

  function buildRecentLogs() {
    const list = el('ul', { class: 'log-list' });
    logs.slice(0, 12).forEach(function(l) {
      list.appendChild(el('li', {}, [
        el('span', { text: l.type === 'visit' ? '사이트 방문' : '열람: ' + l.category }),

      ]));

    if (!logs.length) list.appendChild(el('li', {}, [el('span', { class: 'empty', text: '최근 30일 기록이 없습니다.' })]));

    clearBtn.addEventListener('click', function() {

      if (!confirm('30일보다 오래된 접속 기록을 모두 삭제할까요?')) return;

    });
    return el('div', { class: 'card' }, [

      el('p', { class: 'card-desc', text: '익명 기록입니다 (종류・카테고리명・시각만 저장).' }),
      list,
      el('div', { style: 'margin-top:12px' }, [clearBtn])

  // ---------------- 탭: 기본 설정 ----------------

    const subtitleInput = row('부제', el('input', { class: 'field', value: settings.subtitle || '', placeholder: '예: 2027. 2. 14. ~ 2. 17. 후쿠오카' }));

    const fontSel = el('select', { class: 'field' });
    FONTS.forEach(function(f) { fontSel.appendChild(el('option', { value: f.id, text: f.name })); });

    form.appendChild(el('p', { class: 'hint', text: '방문자가 상단 버튼으로 직접 고르면 그 사람 화면에서는 고른 것이 우선입니다.' }));

    let pendingLogo = null;

    const preview = el('img', { src: settings.logoUrl || DEFAULT_LOGO, alt: '로고 미리보기' });
    const fileInput = el('input', { type: 'file', accept: 'image/*', style: 'display:none' });
    const pickBtn = el('button', { class: 'btn' }, [icon('upload'), '이미지 선택']);
    const resetBtn = el('button', { class: 'btn', text: '기본 로고로' });
    pickBtn.addEventListener('click', function() { fileInput.click(); });
    resetBtn.addEventListener('click', function() { pendingLogo = null; removeLogo = true; preview.src = DEFAULT_LOGO; form.classList.add('dirty'); });
    fileInput.addEventListener('change', function() {
      const file = fileInput.files[0];
      if (!file) return;
      resizeImage(file, 240).then(function(dataUrl) {
        if (dataUrl.length > 700000) { toast('이미지가 너무 큽니다. 더 작은 파일을 골라주세요.', true); return; }
        pendingLogo = dataUrl; removeLogo = false; preview.src = dataUrl;
      }).catch(function() { toast('이미지를 읽지 못했습니다.', true); });
    });
    row('학교 로고', el('div', { class: 'logo-preview' }, [preview, pickBtn, resetBtn, fileInput]));

    const saveBtn = el('button', { class: 'btn primary', style: 'margin-top:12px' }, [icon('device-floppy'), '저장']);
    saveBtn.addEventListener('click', function() {
      const data = { kicker: kickerInput.value.trim(), title: titleInput.value.trim(), subtitle: subtitleInput.value.trim(),
        ddayDate: ddayInput.value, theme: themeSel.value, font: fontSel.value };
      if (pendingLogo) data.logoUrl = pendingLogo;
      if (removeLogo) data.logoUrl = firebase.firestore.FieldValue.delete();
      run(db.collection('gt_settings').doc('main').set(data, { merge: true }), '저장했습니다.', form);
    });
    form.appendChild(saveBtn);
    dashBodyInner.appendChild(form);
  }

  // 로고는 Firestore 문서(1MB 제한)에 들어가므로 작게 줄여서 저장
  function resizeImage(file, maxSize) {
    return new Promise(function(resolve, reject) {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = function(e) {
        const img = new Image();
        img.onerror = reject;
        img.onload = function() {
          const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/png'));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // ---------------- 탭: 카테고리 ----------------
  function parseColumns(str) { return str.split(',').map(function(s) { return s.trim(); }).filter(Boolean); }
  function renumber(collection, list, fieldFn) {
    return batchWrite(list.map(function(doc, i) {
      return function(b) { b.update(db.collection(collection).doc(doc.id), { order: fieldFn(i) }); };
    }));
  }
  function moveInList(list, idx, dir) {
    const to = idx + dir;
    if (to < 0 || to >= list.length) return null;
    const copy = list.slice();
    const tmp = copy[idx]; copy[idx] = copy[to]; copy[to] = tmp;
    return copy;
  }
  function moveButtons(list, idx, onMove) {
    const up = el('button', { class: 'btn icon', title: '위로', 'aria-label': '위로', disabled: idx === 0 }, [icon('chevron-up')]);
    const down = el('button', { class: 'btn icon', title: '아래로', 'aria-label': '아래로', disabled: idx === list.length - 1 }, [icon('chevron-down')]);
    up.addEventListener('click', function() { const m = moveInList(list, idx, -1); if (m) onMove(m); });
    down.addEventListener('click', function() { const m = moveInList(list, idx, 1); if (m) onMove(m); });
    return el('div', { class: 'move' }, [up, down]);
  }

  // 아이콘 고르기: 목록에서 고르거나 글자(이모지 등)를 직접 입력
  function iconPicker(value, getType, onChange) {
    let current = value || '';
    const summary = el('summary', { 'aria-label': '아이콘 고르기', html: iconHtml(current, getType()) });
    const grid = el('div', { class: 'icon-pop-grid' });
    const details = el('details', { class: 'icon-pick' }, [summary]);
    function set(v) {
      current = v;
      summary.innerHTML = iconHtml(current, getType());
      grid.querySelectorAll('button').forEach(function(b) { b.classList.toggle('on', b.dataset.icon === current); });
      onChange(current);
    }
    ICONS.forEach(function(name) {
      const b = el('button', { type: 'button', title: name, 'aria-label': name, 'data-icon': name, class: name === current ? 'on' : '' }, [icon(name)]);
      b.addEventListener('click', function() { set(name); details.open = false; });
      grid.appendChild(b);
    });
    const textIn = el('input', { class: 'field', placeholder: '또는 글자 입력 (예: 🏯)', value: /^[a-z0-9-]+$/.test(current) ? '' : current });
    textIn.addEventListener('input', function() { set(textIn.value.trim()); });
    const clearBtn = el('button', { type: 'button', class: 'btn', text: '기본 아이콘', onclick: function() { textIn.value = ''; set(''); details.open = false; } });
    details.appendChild(el('div', { class: 'icon-pop' }, [grid, el('div', { style: 'display:flex;gap:6px' }, [textIn, clearBtn])]));
    details.refresh = function() { summary.innerHTML = iconHtml(current, getType()); };
    return details;
  }

  function typeSelect(value) {
    const sel = el('select', { class: 'field', 'aria-label': '종류', style: 'width:auto;min-width:92px;flex:none' });
    TYPE_ORDER.forEach(function(t) { sel.appendChild(el('option', { value: t, text: TYPES[t].label })); });
    sel.value = value;
    return sel;
  }

  function renderCategoriesTab() {
    const cats = sortedCategories();

    // 1) 지금 방문자에게 보이는 모습 (미리보기)
    const previewCard = el('div', { class: 'card' }, [
      el('p', { class: 'card-title' }, [icon('eye'), '현재 카테고리 ' + cats.length + '개 — 방문자 화면 미리보기']),
      el('p', { class: 'card-desc', text: '흐린 타일은 숨김 상태입니다. 타일을 누르면 아래 편집 칸으로 이동합니다.' })
    ]);
    if (cats.length) {
      const mini = el('div', { class: 'mini-grid' });
      let visIdx = 0;
      cats.forEach(function(cat) {
        const hidden = cat.show === false;
        const t = buildTile(cat, hidden ? 0 : visIdx++);
        if (hidden) { t.classList.add('is-hidden'); t.querySelector('.tile-no').textContent = '숨김'; }
        t.addEventListener('click', function() {
          const target = document.getElementById('catrow-' + cat.id);
          if (target) { target.scrollIntoView({ behavior: 'smooth', block: 'center' }); target.classList.remove('flash'); void target.offsetWidth; target.classList.add('flash'); }
        });

      });

      previewCard.appendChild(el('div', { class: 'empty', text: '아직 카테고리가 없습니다. 아래에서 일정・명단・지도를 추가해 보세요.' }));

      el('p', { class: 'card-desc', text: '화살표로 순서를 바꾸고, 이름・아이콘・종류・표시 여부를 고친 뒤 저장하세요.' })
    ]);
    cats.forEach(function(cat, idx) { card.appendChild(buildCategoryRow(cats, cat, idx)); });
    if (!cats.length) card.appendChild(el('div', { class: 'empty', text: '편집할 카테고리가 없습니다.' }));
    dashBodyInner.appendChild(card);

    if (lastAddedCatId) {
      const row = document.getElementById('catrow-' + lastAddedCatId);
      lastAddedCatId = null;
      if (row) setTimeout(function() { row.scrollIntoView({ behavior: 'smooth', block: 'center' }); row.classList.add('flash'); }, 50);

  function buildCategoryRow(cats, cat, idx) {
    const oldType = catType(cat);
    const count = itemsOf(cat.id).length;
    const row = el('div', { class: 'edit-row' + (cat.show === false ? ' hidden-row' : ''), id: 'catrow-' + cat.id });
    markDirtyOnInput(row);
    let iconVal = cat.icon || '';
    const typeSel = typeSelect(oldType);
    const picker = iconPicker(iconVal, function() { return typeSel.value; }, function(v) { iconVal = v; row.classList.add('dirty'); });
    const nameInput = el('input', { class: 'field', value: cat.name || '', placeholder: '카테고리명', 'aria-label': '카테고리명' });
    const colInput = el('input', { class: 'field', value: (cat.columns || []).join(', '), placeholder: '칸 이름 (예: 날짜, 내용)', 'aria-label': '칸 이름' });
    function syncCols() {
      const t = typeSel.value;
      colInput.disabled = t !== 'table';
      if (t !== 'table') colInput.value = columnsForType(t, cat.columns).join(', ');
      picker.refresh();
    }
    typeSel.addEventListener('change', syncCols);
    syncCols();
    const showCheck = el('input', { type: 'checkbox', checked: cat.show !== false });

    const saveBtn = el('button', { class: 'btn primary', text: '저장' });
    saveBtn.addEventListener('click', function() {
      const name = nameInput.value.trim();
      if (!name) { toast('카테고리명을 입력하세요.', true); return; }
      const type = typeSel.value;
      const oldCols = cat.columns || [];
      const newCols = type === 'table' ? parseColumns(colInput.value) : columnsForType(type, oldCols);
      const ops = [function(b) {
        b.update(db.collection('gt_categories').doc(cat.id), { name: name, icon: iconVal, type: type, columns: newCols, show: showCheck.checked });
      }];
      // 표에서 칸 개수가 같고 이름만 바뀌었으면 기존 내용도 새 칸 이름으로 옮김
      const renamed = type === 'table' && oldCols.length === newCols.length && oldCols.some(function(c, i) { return c !== newCols[i]; });
      if (renamed) {
        itemsOf(cat.id).forEach(function(it) {
          const old = it.fields || {};
          const f = {};
          newCols.forEach(function(c, i) { f[c] = old[oldCols[i]] !== undefined ? old[oldCols[i]] : ''; });
          ops.push(function(b) { b.update(db.collection('gt_items').doc(it.id), { fields: f }); });
        });
      } else if (count && oldCols.some(function(c) { return newCols.indexOf(c) === -1; })) {
        if (!confirm('빠진 칸의 내용은 화면에 표시되지 않습니다 (데이터는 보존됩니다). 저장할까요?')) return;
      }
      run(batchWrite(ops), '저장했습니다.', row);
    });
    const itemsBtn = el('button', { class: 'btn' }, [icon('pencil'), '내용 입력']);
    itemsBtn.addEventListener('click', function() { dashItemCatId = cat.id; switchTab('items', false); });
    const delBtn = el('button', { class: 'btn danger icon', title: '삭제', 'aria-label': '삭제' }, [icon('trash')]);
    delBtn.addEventListener('click', function() {
      if (!confirm('"' + cat.name + '" 카테고리를 삭제할까요?\n안의 내용 ' + count + '개도 함께 삭제됩니다.')) return;
      const ops = [function(b) { b.delete(db.collection('gt_categories').doc(cat.id)); }];
      const itemIds = itemsOf(cat.id).map(function(it) { return it.id; });
      itemIds.forEach(function(id) { ops.push(function(b) { b.delete(db.collection('gt_items').doc(id)); }); });
      if (openCategoryId === cat.id) openCategoryId = null;
      run(batchWrite(ops).then(function() { if (oldType === 'people') return deletePrivateNames(itemIds); }), '삭제했습니다.', row);
    });

    row.appendChild(moveButtons(cats, idx, function(m) { run(renumber('gt_categories', m, function(i) { return i + 1; })); }));
    row.appendChild(picker);
    row.appendChild(el('div', { class: 'grow' }, [
      el('div', { style: 'display:flex;gap:6px' }, [nameInput, typeSel]),
      colInput
    ]));
    row.appendChild(el('div', { class: 'row-actions' }, [
      el('label', { class: 'chk' }, [showCheck, '표시']),
      el('span', { class: 'pill', text: '내용 ' + count }),
      saveBtn, itemsBtn, delBtn
    ]));
    return row;
  }

  function buildAddCategoryCard(cats) {
    const card = el('div', { class: 'card' }, [
      el('p', { class: 'card-title' }, [icon('plus'), '새 카테고리 추가']),
      el('p', { class: 'card-desc', text: '종류를 고르면 입력 칸이 정해집니다. 추가하면 위 미리보기와 아래 편집 목록에 바로 나타납니다.' })
    ]);
    const box = el('div', {});
    markDirtyOnInput(box);
    const radios = el('div', { class: 'type-cards', role: 'radiogroup', 'aria-label': '카테고리 종류' });
    let selType = 'schedule';
    const nName = el('input', { class: 'field', placeholder: '카테고리명 (예: 일정)', 'aria-label': '카테고리명', value: TYPES[selType].label });
    let nIconVal = '';

    const nCol = el('input', { class: 'field', placeholder: '칸 이름 (쉼표로 구분, 예: 항목, 내용, 링크)', 'aria-label': '칸 이름' });
