<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>50주년 해외연수(GT)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2107@1.1/GmarketSans.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Firebase (compat SDK) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root{
    --yellow:#FFC627;
    --yellow-text:#5a4200;
    --bg:#fafafa;
    --surface:#ffffff;
    --surface-alt:#fff7e0;
    --text:#222;
    --sub:#777;
    --border:#eee;
    --memo-accent:#D85A30;
    --tile-ring:rgba(0,0,0,0.25);
    --tile-bg-0:#FFC627; --tile-fg-0:#412402; --tile-icon-0:#412402;
    --tile-bg-1:#FAC775; --tile-fg-1:#412402; --tile-icon-1:#412402;
    --tile-bg-2:#FAEEDA; --tile-fg-2:#412402; --tile-icon-2:#854F0B;
    --tile-bg-3:#FFF7E0; --tile-fg-3:#412402; --tile-icon-3:#854F0B;
  }
  body.theme-cool{
    --yellow:#378ADD; --yellow-text:#0C447C;
    --bg:#F4F8FC; --surface:#ffffff; --surface-alt:#E6F1FB;
    --text:#0C2C43; --sub:#5C7A91; --border:#DCEAF6; --memo-accent:#0F6E56;
    --tile-bg-0:#E6F1FB; --tile-fg-0:#042C53; --tile-icon-0:#185FA5;
    --tile-bg-1:#E1F5EE; --tile-fg-1:#04342C; --tile-icon-1:#0F6E56;
    --tile-bg-2:#EEEDFE; --tile-fg-2:#26215C; --tile-icon-2:#534AB7;
    --tile-bg-3:#B5D4F4; --tile-fg-3:#042C53; --tile-icon-3:#0C447C;
  }
  body.theme-dark{
    --yellow:#FFC627; --yellow-text:#412402;
    --bg:#141412; --surface:#201F1D; --surface-alt:#2A2A26;
    --text:#F1EFE8; --sub:#B4B2A9; --border:#3A3A36; --memo-accent:#F0997B;
    --tile-ring:rgba(255,255,255,0.35);
    --tile-bg-0:#2C2C2A; --tile-fg-0:#fff; --tile-icon-0:#FFC627;
    --tile-bg-1:#2C2C2A; --tile-fg-1:#fff; --tile-icon-1:#5DCAA5;
    --tile-bg-2:#2C2C2A; --tile-fg-2:#fff; --tile-icon-2:#85B7EB;
    --tile-bg-3:#2C2C2A; --tile-fg-3:#fff; --tile-icon-3:#ED93B1;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Pretendard','Noto Sans KR',sans-serif; background:var(--bg); color:var(--text); }
  h1, .cat-tile-label, .content-panel-head, .memo-content .memo-date{ font-family:'GmarketSansMedium','Pretendard',sans-serif; }

  header{ position:sticky; top:0; z-index:10; background:var(--surface); border-bottom:1px solid var(--border);
    padding:22px 24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
  header::before{ content:""; position:absolute; top:0; left:0; right:0; height:6px; background:var(--yellow); }
  header h1{ margin:0; font-size:22px; font-weight:500; letter-spacing:-0.3px; color:var(--text); }
  header h1 span{ background:linear-gradient(180deg, transparent 60%, var(--yellow) 60%); }
  .subtitle-wrap{ display:flex; align-items:center; gap:8px; }
  .subtitle{ font-size:14px; font-weight:500; color:var(--sub); }

  .clock-dday-widget{ position:fixed; right:16px; z-index:20; width:76px; height:76px; border-radius:14px;
    overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.15); display:flex; flex-direction:column; }
  .cw-time-wrap{ flex:1; background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; }
  .cw-date{ font-size:9px; font-weight:600; color:var(--sub); }
  .cw-time{ font-size:16px; font-weight:700; color:var(--text); letter-spacing:-0.5px; }
  .cw-dday{ flex:0 0 26px; background:var(--yellow); display:none; align-items:center; justify-content:center;
    font-size:12px; font-weight:700; color:var(--yellow-text); }
  @media (max-width:480px){ .clock-dday-widget{ width:60px; height:60px; } .cw-date{ font-size:8px; } .cw-time{ font-size:13px; } .cw-dday{ font-size:10px; flex-basis:20px; } }

  .memo-section{ max-width:720px; margin:22px auto 0; padding:0 16px; }
  .memo-card{ position:relative; background:repeating-linear-gradient(var(--surface), var(--surface) 22px, var(--border) 23px);
    border-radius:6px; padding:16px 14px 14px 20px; margin-bottom:14px; box-shadow:0 1px 4px rgba(0,0,0,0.08); }
  .memo-pin{ position:absolute; top:-6px; left:12px; font-size:18px; color:var(--memo-accent); }
  .memo-inner{ border-left:2px solid var(--memo-accent); padding-left:12px; }
  .memo-content{ margin:0; font-size:14px; color:var(--text); line-height:23px; }
  .memo-date{ font-weight:700; color:var(--sub); margin-right:6px; }

  main{ max-width:720px; margin:24px auto; padding:0 16px 40px; }

  .cat-grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; margin-bottom:14px; }
  .cat-tile{ position:relative; border-radius:14px; padding:18px 12px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:6px; cursor:pointer; transition:transform .15s ease; min-height:84px; }
  .cat-tile:active{ transform:scale(0.97); }
  .cat-tile.active{ box-shadow:inset 0 0 0 2px var(--tile-ring); }
  .cat-tile-icon{ font-size:22px; }
  .cat-tile-label{ font-size:13px; font-weight:500; }
  .cat-tile-badge{ position:absolute; top:8px; right:8px; background:rgba(255,255,255,0.55); color:inherit;
    font-size:10px; font-weight:700; padding:2px 6px; border-radius:10px; }

  .content-panel{ display:none; background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; margin-bottom:14px; }
  .content-panel-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px;
    border-bottom:1px solid var(--border); font-weight:500; font-size:16px; color:var(--text); }
  .content-panel-close{ border:none; background:none; color:var(--sub); font-size:16px; cursor:pointer; padding:4px; }
  .content-panel-body{ padding:16px; overflow-x:auto; }

  table{ width:100%; border-collapse:collapse; font-size:14px; }
  th{ background:var(--surface-alt); color:var(--yellow-text); font-weight:700; text-align:left; padding:8px 10px;
    border-bottom:2px solid var(--yellow); white-space:nowrap; }
  td{ padding:9px 10px; border-bottom:1px solid var(--border); color:var(--text); }
  tr:last-child td{ border-bottom:none; }
  a.row-link{ color:var(--yellow-text); font-weight:600; text-decoration:none; }
  .copy-btn{ margin-left:6px; border:none; background:var(--surface-alt); color:var(--yellow-text); font-size:11px; padding:3px 7px; border-radius:6px; cursor:pointer; }
  .empty{ color:var(--sub); font-size:13px; padding:10px 0; }

  .name-list{ display:grid; grid-template-columns:repeat(3, 1fr); gap:0 20px; }
  .name-item{ display:flex; align-items:baseline; gap:6px; padding:9px 4px; border-bottom:1px solid var(--border); font-size:14px; }
  .name-num{ color:var(--sub); font-weight:500; min-width:20px; flex-shrink:0; }
  .name-gubun{ color:var(--sub); font-weight:500; }
  .name-star{ color:var(--text); font-weight:700; white-space:nowrap; }
  @media (max-width:600px){ .name-list{ grid-template-columns:repeat(2, 1fr); } }
  @media (max-width:400px){ .name-list{ grid-template-columns:1fr; } }

  .map-wrap{ display:flex; flex-direction:column; gap:10px; }
  .map-container{ width:100%; height:240px; border-radius:10px; overflow:hidden; border:1px solid var(--border); }
  .map-list{ display:flex; flex-direction:column; }
  .map-list-item{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 4px; border-bottom:1px solid var(--border); font-size:14px; }
  .map-list-item:last-child{ border-bottom:none; }
  .map-list-text{ display:flex; flex-direction:column; min-width:0; }
  .map-list-name{ font-weight:600; color:var(--text); }
  .map-list-desc{ font-size:12px; color:var(--sub); margin-top:2px; }

  .error-banner{ background:#fdecea; color:#c0392b; border:1px solid #f5c6cb; border-radius:10px; padding:16px 18px; margin:16px; font-size:14px; line-height:1.6; }

  .theme-switcher{ display:flex; justify-content:center; gap:12px; padding:16px 0 6px; }
  .theme-swatch{ width:28px; height:28px; border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; }
  .theme-swatch.active{ border-color:var(--text); }

  footer{ background:var(--surface); border-top:1px solid var(--border); padding:6px 20px 20px; text-align:center; }
  .footer-brand{ display:inline-flex; align-items:center; gap:10px; }
  .footer-text{ font-size:14px; font-weight:700; color:var(--text); }
  footer img{ height:32px; opacity:0.9; }
  .loading{ text-align:center; color:var(--sub); padding:60px 0; font-size:14px; }

  .admin-toggle{ display:block; margin:12px auto 0; background:none; border:none; color:var(--sub); font-size:11px; text-decoration:underline; cursor:pointer; }
  .admin-login-panel{ display:none; margin:10px auto 0; padding:12px; border:1px solid var(--border); border-radius:10px; background:var(--surface-alt); text-align:left; max-width:220px; }
  .admin-login-panel input{ width:100%; margin-bottom:8px; font-size:12px; }
  .admin-login-panel button{ font-size:12px; padding:6px 10px; border-radius:6px; border:1px solid var(--border); background:var(--surface); cursor:pointer; color:var(--text); }
  .admin-status{ font-size:11px; color:var(--sub); margin-top:6px; }

  .admin-overlay{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:100; align-items:center; justify-content:center; padding:16px; }
  .admin-overlay-inner{ background:var(--surface); border-radius:14px; max-width:520px; width:100%; max-height:85vh; overflow:hidden; display:flex; flex-direction:column; }
  .admin-overlay-head{ display:flex; justify-content:space-between; align-items:center; padding:14px 18px; border-bottom:1px solid var(--border); font-weight:700; }
  .admin-overlay-head button{ border:none; background:none; font-size:18px; cursor:pointer; color:var(--sub); }
  .admin-tabs{ display:flex; gap:6px; padding:10px 14px; border-bottom:1px solid var(--border); }
  .admin-tab{ border:1px solid var(--border); background:var(--surface); color:var(--sub); font-size:12px; padding:6px 12px; border-radius:16px; cursor:pointer; }
  .admin-tab.active{ background:var(--yellow); color:var(--yellow-text); border-color:var(--yellow); font-weight:700; }
  .admin-tab-body{ padding:16px 18px; overflow-y:auto; flex:1; font-size:13px; }
  .admin-row{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); }
  .admin-row input, .admin-row select{ font-size:12px; padding:5px 7px; border:1px solid var(--border); border-radius:6px; flex:1; min-width:70px; }
  .admin-row label{ font-size:11px; color:var(--sub); display:flex; align-items:center; gap:3px; white-space:nowrap; }
  .admin-btn{ border:none; background:var(--surface-alt); color:var(--yellow-text); font-size:11px; padding:5px 9px; border-radius:6px; cursor:pointer; white-space:nowrap; }
  .admin-btn.danger{ background:#fdecea; color:#c0392b; }
  .admin-section-title{ font-weight:700; margin:16px 0 6px; font-size:13px; }
  .admin-item-editor{ margin-top:14px; padding-top:12px; border-top:1px dashed var(--border); }
  .admin-item-row{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:6px 0; border-bottom:1px solid var(--border); }
  .admin-item-row input{ font-size:12px; padding:5px 7px; border:1px solid var(--border); border-radius:6px; flex:1; min-width:60px; }

  @media (max-width:480px){ header{ padding:16px; } header h1{ font-size:18px; } .subtitle{ font-size:12px; } }
</style>
</head>
<body class="theme-yellow">

<header>
  <h1 id="pageTitle"><span>50주년 해외연수(GT)</span></h1>
  <div class="subtitle-wrap">
    <div class="subtitle" id="pageSubtitle">불러오는 중...</div>
  </div>
</header>

<div class="clock-dday-widget" id="clockWidget">
  <div class="cw-time-wrap">
    <span class="cw-date" id="cwDate">--.--</span>
    <span class="cw-time" id="cwTime">--:--</span>
  </div>
  <div class="cw-dday" id="cwDday"></div>
</div>

<div class="memo-section" id="memoSection"></div>

<main id="main"><div class="loading">불러오는 중입니다...</div></main>

<footer>
  <div class="theme-switcher" id="themeSwitcher">
    <button class="theme-swatch" data-theme="theme-yellow" style="background:#FFC627;" aria-label="옐로 테마"></button>
    <button class="theme-swatch" data-theme="theme-cool" style="background:#378ADD;" aria-label="쿨톤 테마"></button>
    <button class="theme-swatch" data-theme="theme-dark" style="background:#141412;" aria-label="다크 테마"></button>
  </div>
  <div class="footer-brand">
    <span class="footer-text">진선여자고등학교</span>
    <img id="schoolLogo" src="https://i.namu.wiki/i/hP1GNe8Hf1UQ8C6vi0_Ea5OyKnDIXc8iAkt6yAiCWe04MXoBw6muW4LhUTb8QB0rcwPsJeYz22t1WALiKg18lH_AeaWx1QmCaiJ70tYiwFeepzaK_61QVVGk2JW-f05icUe8x1pU0Me4HCflLcXUms6Y2XleHdjhMy134Bt50jg.webp" alt="진선여자고등학교 로고">
  </div>

  <button class="admin-toggle" id="adminToggleBtn">관리자 모드</button>
  <div class="admin-login-panel" id="adminLoginPanel">
    <input type="password" id="adminPwInput" placeholder="비밀번호">
    <button id="adminLoginBtn">확인</button>
    <div class="admin-status" id="adminLoginStatus"></div>
  </div>
</footer>

<div class="admin-overlay" id="adminOverlay">
  <div class="admin-overlay-inner">
    <div class="admin-overlay-head">
      <span>관리자 모드</span>
      <button id="adminCloseBtn">✕</button>
    </div>
    <div class="admin-tabs">
      <button class="admin-tab active" data-tab="settings">설정</button>
      <button class="admin-tab" data-tab="categories">카테고리</button>
      <button class="admin-tab" data-tab="memos">메모</button>
    </div>
    <div class="admin-tab-body" id="adminTabBody"></div>
  </div>
</div>

<script>
  // ============ Firebase 설정: 아래 값을 콘솔에서 복사해 채워주세요 ============
  // Firebase 콘솔 > 프로젝트 설정(⚙) > 일반 > "내 앱" > SDK 설정 및 구성
  const firebaseConfig = {
    apiKey: "여기에_API_KEY",
    authDomain: "moon-d528d.firebaseapp.com",
    projectId: "moon-d528d",
    storageBucket: "moon-d528d.appspot.com",
    messagingSenderId: "여기에_숫자",
    appId: "여기에_APP_ID"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const ADMIN_PASSWORD = '1212';
  let isAdmin = false;

  let settings = { title: '50주년 해외연수(GT)', subtitle: '', ddayDate: '', logoUrl: '' };
  let categories = [];
  let items = [];
  let memos = [];
  window.__mapInstances = [];
  let openCategoryId = null;

  // ---------------- 테마 ----------------
  (function initTheme() {
    const saved = localStorage.getItem('gtTheme') || 'theme-yellow';
    document.body.classList.remove('theme-yellow', 'theme-cool', 'theme-dark');
    document.body.classList.add(saved);
    document.querySelectorAll('.theme-swatch').forEach(function(btn) {
      if (btn.dataset.theme === saved) btn.classList.add('active');
      btn.addEventListener('click', function() {
        document.body.classList.remove('theme-yellow', 'theme-cool', 'theme-dark');
        document.body.classList.add(btn.dataset.theme);
        document.querySelectorAll('.theme-swatch').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        localStorage.setItem('gtTheme', btn.dataset.theme);
      });
    });
  })();

  // ---------------- 시계 + D-Day 위젯 위치 ----------------
  function positionClockWidget() {
    const header = document.querySelector('header');
    document.getElementById('clockWidget').style.top = (header.offsetHeight + 10) + 'px';
  }
  window.addEventListener('resize', positionClockWidget);
  window.addEventListener('load', positionClockWidget);
  positionClockWidget();

  function updateClock() {
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('cwTime').textContent = hh + ':' + mm;
    const days = ['일','월','화','수','목','금','토'];
    document.getElementById('cwDate').textContent = (now.getMonth()+1) + '/' + now.getDate() + '(' + days[now.getDay()] + ')';
  }
  updateClock();
  setInterval(updateClock, 15000);

  function updateDdayBadge() {
    const cwDday = document.getElementById('cwDday');
    if (!settings.ddayDate) { cwDday.style.display = 'none'; return; }
    const target = new Date(settings.ddayDate);
    if (isNaN(target)) { cwDday.style.display = 'none'; return; }
    const today = new Date(); today.setHours(0,0,0,0); target.setHours(0,0,0,0);
    const dday = Math.round((target - today) / 86400000);
    cwDday.style.display = 'flex';
    cwDday.textContent = dday === 0 ? 'D-DAY' : (dday > 0 ? 'D-' + dday : 'D+' + Math.abs(dday));
  }

  // ---------------- Firestore 실시간 구독 ----------------
  db.collection('gt_settings').doc('main').onSnapshot(function(doc) {
    if (doc.exists) settings = Object.assign({ title:'', subtitle:'', ddayDate:'', logoUrl:'' }, doc.data());
    renderAll();
  }, function(err) { showError(err); });

  db.collection('gt_categories').orderBy('order').onSnapshot(function(snap) {
    categories = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
    renderAll();
  }, function(err) { showError(err); });

  db.collection('gt_items').onSnapshot(function(snap) {
    items = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
    renderAll();
  }, function(err) { showError(err); });

  db.collection('gt_memos').orderBy('order', 'desc').onSnapshot(function(snap) {
    memos = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
    renderAll();
  }, function(err) { showError(err); });

  function showError(err) {
    document.getElementById('main').innerHTML =
      '<div class="error-banner"><strong>불러오기 오류</strong><br>' + escapeHtml(err && err.message ? err.message : String(err)) + '</div>';
  }

  // ---------------- 렌더링 ----------------
  function renderAll() {
    document.getElementById('pageTitle').innerHTML = '<span>' + escapeHtml(settings.title || '50주년 해외연수(GT)') + '</span>';
    document.getElementById('pageSubtitle').textContent = settings.subtitle || '';
    if (settings.logoUrl) document.getElementById('schoolLogo').src = settings.logoUrl;
    updateDdayBadge();
    positionClockWidget();
    renderMemos();
    renderCategories();
  }

  function renderMemos() {
    const box = document.getElementById('memoSection');
    box.innerHTML = '';
    memos.filter(function(m){ return m.show !== false; }).forEach(function(m) {
      const card = document.createElement('div');
      card.className = 'memo-card';
      card.innerHTML =
        '<i class="ti ti-pin memo-pin" aria-hidden="true"></i>' +
        '<div class="memo-inner"><p class="memo-content">' +
        '<span class="memo-date">' + escapeHtml(m.date || '') + '</span>' + escapeHtml(m.content || '') +
        '</p></div>';
      box.appendChild(card);
    });
  }

  function renderCategories() {
    const main = document.getElementById('main');
    main.innerHTML = '';

    const grid = document.createElement('div');
    grid.className = 'cat-grid';
    const panel = document.createElement('div');
    panel.className = 'content-panel';

    const visibleCats = categories.filter(function(c){ return c.show !== false; });

    visibleCats.forEach(function(cat, idx) {
      const catItems = items.filter(function(it){ return it.categoryId === cat.id; })
        .sort(function(a,b){ return (a.order||0) - (b.order||0); });

      const tile = document.createElement('div');
      tile.className = 'cat-tile';
      if (cat.id === openCategoryId) tile.classList.add('active');
      const colorIdx = idx % 4;
      tile.style.background = 'var(--tile-bg-' + colorIdx + ')';
      tile.style.color = 'var(--tile-fg-' + colorIdx + ')';

      const iconSpan = document.createElement('span');
      iconSpan.className = 'cat-tile-icon';
      iconSpan.style.color = 'var(--tile-icon-' + colorIdx + ')';
      iconSpan.textContent = cat.icon || '';
      tile.appendChild(iconSpan);

      const labelSpan = document.createElement('span');
      labelSpan.className = 'cat-tile-label';
      labelSpan.textContent = cat.name;
      tile.appendChild(labelSpan);

      if (catItems.length) {
        const badge = document.createElement('span');
        badge.className = 'cat-tile-badge';
        badge.textContent = catItems.length;
        tile.appendChild(badge);
      }

      tile.addEventListener('click', function() {
        if (openCategoryId === cat.id) {
          openCategoryId = null;
          panel.style.display = 'none';
          panel.innerHTML = '';
          renderCategories();
          return;
        }
        openCategoryId = cat.id;
        try { db.collection('gt_logs').add({ category: cat.name, at: firebase.firestore.FieldValue.serverTimestamp() }); } catch(e) {}
        openCategoryPanel(cat, catItems, panel);
        renderCategories();
      });

      grid.appendChild(tile);
    });

    main.appendChild(grid);
    main.appendChild(panel);

    if (openCategoryId) {
      const cat = visibleCats.find(function(c){ return c.id === openCategoryId; });
      if (cat) {
        const catItems = items.filter(function(it){ return it.categoryId === cat.id; })
          .sort(function(a,b){ return (a.order||0) - (b.order||0); });
        openCategoryPanel(cat, catItems, panel);
      }
    }
  }

  function openCategoryPanel(cat, catItems, panel) {
    panel.innerHTML = '';
    const head = document.createElement('div');
    head.className = 'content-panel-head';
    const titleSpan = document.createElement('span');
    titleSpan.textContent = (cat.icon ? cat.icon + ' ' : '') + cat.name;
    head.appendChild(titleSpan);
    const closeBtn = document.createElement('button');
    closeBtn.className = 'content-panel-close';
    closeBtn.textContent = '✕';
    closeBtn.addEventListener('click', function() {
      openCategoryId = null;
      panel.style.display = 'none';
      panel.innerHTML = '';
      renderCategories();
    });
    head.appendChild(closeBtn);
    panel.appendChild(head);

    const body = document.createElement('div');
    body.className = 'content-panel-body';
    window.__mapInstances = [];
    body.appendChild(buildContentView(cat, catItems));

    if (isAdmin) {
      body.appendChild(buildItemAdminEditor(cat, catItems));
    }

    panel.appendChild(body);
    panel.style.display = 'block';

    setTimeout(function() {
      (window.__mapInstances || []).forEach(function(m) { try { m.invalidateSize(); } catch(e) {} });
    }, 50);
  }

  // 헤더(columns) + 행(rows, 배열) 형태로 변환해서 기존 렌더러들 재사용
  function buildContentView(cat, catItems) {
    const headers = cat.columns || [];
    const rows = catItems.map(function(it) {
      return headers.map(function(col) { return (it.fields && it.fields[col] !== undefined) ? it.fields[col] : ''; });
    });
    const fakeCat = { name: cat.name, headers: headers, rows: rows };
    return buildTable(fakeCat);
  }

  function buildTable(cat) {
    if (!cat.headers.length || !cat.rows.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '등록된 내용이 없습니다.';
      return empty;
    }

    const idxLat = cat.headers.indexOf('위도');
    const idxLng = cat.headers.indexOf('경도');
    if (idxLat > -1 && idxLng > -1) return buildMapView(cat, idxLat, idxLng);

    let idxGubun = cat.headers.indexOf('구분');
    let idxName = cat.headers.indexOf('이름');
    if (cat.name === '참여명단' && idxGubun > -1 && idxName > -1) {
      return buildNameList(cat, idxGubun, idxName);
    }

    const table = document.createElement('table');
    const thead = document.createElement('thead');
    const trh = document.createElement('tr');
    cat.headers.forEach(function(h){ const th = document.createElement('th'); th.textContent = h; trh.appendChild(th); });
    thead.appendChild(trh);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    cat.rows.forEach(function(row) {
      const tr = document.createElement('tr');
      row.forEach(function(cell) {
        const td = document.createElement('td');
        const text = String(cell);
        if (/^https?:\/\//.test(text)) {
          const a = document.createElement('a');
          a.className = 'row-link'; a.href = text; a.target = '_blank'; a.textContent = '바로가기';
          td.appendChild(a);
          const copyBtn = document.createElement('button');
          copyBtn.className = 'copy-btn'; copyBtn.textContent = '복사';
          copyBtn.addEventListener('click', function(e){
            e.stopPropagation();
            navigator.clipboard.writeText(text).then(function(){
              copyBtn.textContent = '완료!'; setTimeout(function(){ copyBtn.textContent = '복사'; }, 1200);
            });
          });
          td.appendChild(copyBtn);
        } else {
          td.textContent = text;
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    return table;
  }

  function buildMapView(cat, idxLat, idxLng) {
    const idxPlace = cat.headers.indexOf('장소명') > -1 ? cat.headers.indexOf('장소명') : 0;
    const idxDesc = cat.headers.indexOf('설명');
    const idxLink = cat.headers.indexOf('링크');

    const wrap = document.createElement('div');
    wrap.className = 'map-wrap';
    const mapId = 'map-' + Math.random().toString(36).slice(2, 9);
    const mapDiv = document.createElement('div'); mapDiv.className = 'map-container'; mapDiv.id = mapId;
    wrap.appendChild(mapDiv);

    const listDiv = document.createElement('div'); listDiv.className = 'map-list';
    const points = [];
    cat.rows.forEach(function(row) {
      const lat = parseFloat(row[idxLat]); const lng = parseFloat(row[idxLng]);
      const hasCoords = !isNaN(lat) && !isNaN(lng);
      const name = String(row[idxPlace] || '').trim();
      const desc = idxDesc > -1 ? String(row[idxDesc] || '').trim() : '';
      const rawLink = idxLink > -1 ? String(row[idxLink] || '').trim() : '';
      const link = rawLink || (hasCoords ? ('https://www.google.com/maps/search/?api=1&query=' + lat + ',' + lng) : '');
      if (hasCoords) points.push({ lat: lat, lng: lng, name: name, desc: desc });

      const item = document.createElement('div'); item.className = 'map-list-item';
      const textDiv = document.createElement('div'); textDiv.className = 'map-list-text';
      textDiv.innerHTML = '<span class="map-list-name">' + escapeHtml(name) + '</span>' +
        (desc ? '<span class="map-list-desc">' + escapeHtml(desc) + '</span>' : '') +
        (!hasCoords ? '<span class="map-list-desc">지도 좌표를 찾지 못했어요</span>' : '');
      item.appendChild(textDiv);
      if (link) {
        const a = document.createElement('a'); a.className = 'row-link'; a.href = link; a.target = '_blank'; a.textContent = '바로가기';
        item.appendChild(a);
      }
      listDiv.appendChild(item);
    });
    wrap.appendChild(listDiv);

    setTimeout(function() {
      if (typeof L === 'undefined' || !points.length) return;
      const map = L.map(mapId, { scrollWheelZoom: false });
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap', maxZoom: 19 }).addTo(map);
      const markers = points.map(function(p) {
        const marker = L.marker([p.lat, p.lng]).addTo(map);
        if (p.name) marker.bindPopup('<b>' + p.name + '</b>' + (p.desc ? '<br>' + p.desc : ''));
        return marker;
      });
      if (points.length === 1) map.setView([points[0].lat, points[0].lng], 15);
      else map.fitBounds(L.featureGroup(markers).getBounds().pad(0.2));
      window.__mapInstances.push(map);
    }, 0);

    return wrap;
  }

  function buildNameList(cat, idxGubun, idxName) {
    const specialTitles = ['부장', '교감', '교장'];
    const container = document.createElement('div'); container.className = 'name-list';
    let num = 0;
    cat.rows.forEach(function(row) {
      const gubun = String(row[idxGubun] || '').trim();
      const name = String(row[idxName] || '').trim();
      if (!gubun && !name) return;
      num++;
      const item = document.createElement('div'); item.className = 'name-item';
      const nameSpan = specialTitles.includes(gubun)
        ? '<span class="name-star">*' + escapeHtml(name) + escapeHtml(gubun) + '선생님</span>'
        : '<span class="name-gubun">' + escapeHtml(gubun) + '</span> <span class="name-star">*' + escapeHtml(name) + '선생님</span>';
      item.innerHTML = '<span class="name-num">' + num + '.</span>' + nameSpan;
      container.appendChild(item);
    });
    return container;
  }

  // ---------------- 관리자: 카테고리 내 항목 편집기 ----------------
  function buildItemAdminEditor(cat, catItems) {
    const wrap = document.createElement('div');
    wrap.className = 'admin-item-editor';
    const title = document.createElement('div');
    title.className = 'admin-section-title';
    title.textContent = '관리자: 항목 편집 (' + (cat.columns || []).join(' / ') + ')';
    wrap.appendChild(title);

    catItems.forEach(function(it) {
      const row = document.createElement('div');
      row.className = 'admin-item-row';
      const inputs = {};
      (cat.columns || []).forEach(function(col) {
        const input = document.createElement('input');
        input.placeholder = col;
        input.value = (it.fields && it.fields[col]) || '';
        inputs[col] = input;
        row.appendChild(input);
      });
      const saveBtn = document.createElement('button');
      saveBtn.className = 'admin-btn'; saveBtn.textContent = '저장';
      saveBtn.addEventListener('click', function() {
        const fields = {};
        (cat.columns || []).forEach(function(col) { fields[col] = inputs[col].value; });
        db.collection('gt_items').doc(it.id).update({ fields: fields });
      });
      row.appendChild(saveBtn);
      const delBtn = document.createElement('button');
      delBtn.className = 'admin-btn danger'; delBtn.textContent = '삭제';
      delBtn.addEventListener('click', function() {
        if (confirm('이 항목을 삭제할까요?')) db.collection('gt_items').doc(it.id).delete();
      });
      row.appendChild(delBtn);
      wrap.appendChild(row);
    });

    const newRow = document.createElement('div');
    newRow.className = 'admin-item-row';
    const newInputs = {};
    (cat.columns || []).forEach(function(col) {
      const input = document.createElement('input');
      input.placeholder = col;
      newInputs[col] = input;
      newRow.appendChild(input);
    });
    const addBtn = document.createElement('button');
    addBtn.className = 'admin-btn'; addBtn.textContent = '+ 추가';
    addBtn.addEventListener('click', function() {
      const fields = {};
      (cat.columns || []).forEach(function(col) { fields[col] = newInputs[col].value; });
      db.collection('gt_items').add({ categoryId: cat.id, order: Date.now(), fields: fields });
      (cat.columns || []).forEach(function(col) { newInputs[col].value = ''; });
    });
    newRow.appendChild(addBtn);
    wrap.appendChild(newRow);

    return wrap;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
  }

  // ---------------- 관리자 모드: 로그인 ----------------
  const adminToggleBtn = document.getElementById('adminToggleBtn');
  const adminLoginPanel = document.getElementById('adminLoginPanel');
  const adminPwInput = document.getElementById('adminPwInput');
  const adminLoginBtn = document.getElementById('adminLoginBtn');
  const adminLoginStatus = document.getElementById('adminLoginStatus');
  const adminOverlay = document.getElementById('adminOverlay');
  const adminCloseBtn = document.getElementById('adminCloseBtn');
  const adminTabBody = document.getElementById('adminTabBody');

  adminToggleBtn.addEventListener('click', function() {
    if (isAdmin) {
      adminOverlay.style.display = 'flex';
      renderAdminTab('settings');
      return;
    }
    adminLoginPanel.style.display = (adminLoginPanel.style.display === 'block') ? 'none' : 'block';
  });

  adminLoginBtn.addEventListener('click', function() {
    if (adminPwInput.value === ADMIN_PASSWORD) {
      isAdmin = true;
      adminLoginPanel.style.display = 'none';
      adminOverlay.style.display = 'flex';
      renderAdminTab('settings');
      renderCategories(); // 항목 편집기 노출
    } else {
      adminLoginStatus.textContent = '비밀번호가 틀렸습니다.';
    }
    adminPwInput.value = '';
  });

  adminCloseBtn.addEventListener('click', function() { adminOverlay.style.display = 'none'; });

  document.querySelectorAll('.admin-tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.admin-tab').forEach(function(t){ t.classList.remove('active'); });
      tab.classList.add('active');
      renderAdminTab(tab.dataset.tab);
    });
  });

  function renderAdminTab(tab) {
    adminTabBody.innerHTML = '';
    if (tab === 'settings') renderAdminSettings();
    else if (tab === 'categories') renderAdminCategories();
    else if (tab === 'memos') renderAdminMemos();
  }

  // ---- 설정 탭 ----
  function renderAdminSettings() {
    const box = document.createElement('div');

    function field(labelText, value) {
      const wrap = document.createElement('div');
      wrap.className = 'admin-row';
      const label = document.createElement('label'); label.textContent = labelText; label.style.minWidth = '70px';
      const input = document.createElement('input'); input.value = value || '';
      wrap.appendChild(label); wrap.appendChild(input);
      box.appendChild(wrap);
      return input;
    }

    const titleInput = field('제목', settings.title);
    const subtitleInput = field('부제', settings.subtitle);
    const ddayRow = document.createElement('div'); ddayRow.className = 'admin-row';
    const ddayLabel = document.createElement('label'); ddayLabel.textContent = '디데이 기준일'; ddayLabel.style.minWidth = '70px';
    const ddayInput = document.createElement('input'); ddayInput.type = 'date'; ddayInput.value = settings.ddayDate || '';
    ddayRow.appendChild(ddayLabel); ddayRow.appendChild(ddayInput);
    box.appendChild(ddayRow);

    const logoRow = document.createElement('div'); logoRow.className = 'admin-row';
    const logoLabel = document.createElement('label'); logoLabel.textContent = '학교 로고'; logoLabel.style.minWidth = '70px';
    const logoInput = document.createElement('input'); logoInput.type = 'file'; logoInput.accept = 'image/*';
    logoRow.appendChild(logoLabel); logoRow.appendChild(logoInput);
    box.appendChild(logoRow);

    const saveBtn = document.createElement('button');
    saveBtn.className = 'admin-btn'; saveBtn.textContent = '저장';
    saveBtn.style.marginTop = '10px';
    saveBtn.addEventListener('click', function() {
      const doSave = function(logoUrl) {
        const data = { title: titleInput.value, subtitle: subtitleInput.value, ddayDate: ddayInput.value };
        if (logoUrl) data.logoUrl = logoUrl;
        db.collection('gt_settings').doc('main').set(data, { merge: true });
        saveBtn.textContent = '저장됨!';
        setTimeout(function(){ saveBtn.textContent = '저장'; }, 1200);
      };
      const file = logoInput.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) { doSave(e.target.result); };
        reader.readAsDataURL(file);
      } else {
        doSave(null);
      }
    });
    box.appendChild(saveBtn);
    adminTabBody.appendChild(box);
  }

  // ---- 카테고리 탭 ----
  function renderAdminCategories() {
    const box = document.createElement('div');
    categories.slice().sort(function(a,b){ return (a.order||0)-(b.order||0); }).forEach(function(cat) {
      const row = document.createElement('div'); row.className = 'admin-row';
      const orderInput = document.createElement('input'); orderInput.type = 'number'; orderInput.value = cat.order || 0; orderInput.style.width = '50px';
      const nameInput = document.createElement('input'); nameInput.value = cat.name || '';
      const iconInput = document.createElement('input'); iconInput.value = cat.icon || ''; iconInput.style.width = '40px';
      const colInput = document.createElement('input'); colInput.value = (cat.columns || []).join(','); colInput.placeholder = '컬럼(쉼표구분)';
      const showLabel = document.createElement('label');
      const showCheck = document.createElement('input'); showCheck.type = 'checkbox'; showCheck.checked = cat.show !== false;
      showLabel.appendChild(showCheck); showLabel.appendChild(document.createTextNode('표시'));

      row.appendChild(orderInput); row.appendChild(nameInput); row.appendChild(iconInput); row.appendChild(colInput); row.appendChild(showLabel);

      const saveBtn = document.createElement('button'); saveBtn.className = 'admin-btn'; saveBtn.textContent = '저장';
      saveBtn.addEventListener('click', function() {
        db.collection('gt_categories').doc(cat.id).update({
          order: Number(orderInput.value) || 0,
          name: nameInput.value,
          icon: iconInput.value,
          columns: colInput.value.split(',').map(function(s){ return s.trim(); }).filter(Boolean),
          show: showCheck.checked
        });
      });
      row.appendChild(saveBtn);

      const delBtn = document.createElement('button'); delBtn.className = 'admin-btn danger'; delBtn.textContent = '삭제';
      delBtn.addEventListener('click', function() {
        if (confirm('"' + cat.name + '" 카테고리를 삭제할까요? (안의 항목도 함께 삭제됩니다)')) {
          db.collection('gt_categories').doc(cat.id).delete();
          items.filter(function(it){ return it.categoryId === cat.id; }).forEach(function(it) {
            db.collection('gt_items').doc(it.id).delete();
          });
        }
      });
      row.appendChild(delBtn);

      box.appendChild(row);
    });

    const newTitle = document.createElement('div'); newTitle.className = 'admin-section-title'; newTitle.textContent = '새 카테고리 추가';
    box.appendChild(newTitle);
    const newRow = document.createElement('div'); newRow.className = 'admin-row';
    const nOrder = document.createElement('input'); nOrder.type = 'number'; nOrder.placeholder = '순서'; nOrder.style.width = '50px';
    const nName = document.createElement('input'); nName.placeholder = '카테고리명';
    const nIcon = document.createElement('input'); nIcon.placeholder = '아이콘'; nIcon.style.width = '40px';
    const nCol = document.createElement('input'); nCol.placeholder = '컬럼(쉼표구분, 예: 날짜,내용)';
    newRow.appendChild(nOrder); newRow.appendChild(nName); newRow.appendChild(nIcon); newRow.appendChild(nCol);
    const addBtn = document.createElement('button'); addBtn.className = 'admin-btn'; addBtn.textContent = '+ 추가';
    addBtn.addEventListener('click', function() {
      if (!nName.value.trim()) return;
      db.collection('gt_categories').add({
        order: Number(nOrder.value) || (categories.length + 1),
        name: nName.value.trim(),
        icon: nIcon.value.trim(),
        columns: nCol.value.split(',').map(function(s){ return s.trim(); }).filter(Boolean),
        show: true
      });
      nOrder.value = ''; nName.value = ''; nIcon.value = ''; nCol.value = '';
    });
    newRow.appendChild(addBtn);
    box.appendChild(newRow);

    adminTabBody.appendChild(box);
  }

  // ---- 메모 탭 ----
  function renderAdminMemos() {
    const box = document.createElement('div');
    memos.forEach(function(m) {
      const row = document.createElement('div'); row.className = 'admin-row';
      const dateInput = document.createElement('input'); dateInput.value = m.date || ''; dateInput.style.width = '60px';
      const contentInput = document.createElement('input'); contentInput.value = m.content || '';
      const showLabel = document.createElement('label');
      const showCheck = document.createElement('input'); showCheck.type = 'checkbox'; showCheck.checked = m.show !== false;
      showLabel.appendChild(showCheck); showLabel.appendChild(document.createTextNode('표시'));
      row.appendChild(dateInput); row.appendChild(contentInput); row.appendChild(showLabel);

      const saveBtn = document.createElement('button'); saveBtn.className = 'admin-btn'; saveBtn.textContent = '저장';
      saveBtn.addEventListener('click', function() {
        db.collection('gt_memos').doc(m.id).update({ date: dateInput.value, content: contentInput.value, show: showCheck.checked });
      });
      row.appendChild(saveBtn);

      const delBtn = document.createElement('button'); delBtn.className = 'admin-btn danger'; delBtn.textContent = '삭제';
      delBtn.addEventListener('click', function() {
        if (confirm('이 메모를 삭제할까요?')) db.collection('gt_memos').doc(m.id).delete();
      });
      row.appendChild(delBtn);

      box.appendChild(row);
    });

    const newTitle = document.createElement('div'); newTitle.className = 'admin-section-title'; newTitle.textContent = '새 메모 추가';
    box.appendChild(newTitle);
    const newRow = document.createElement('div'); newRow.className = 'admin-row';
    const nDate = document.createElement('input'); nDate.placeholder = '9/3'; nDate.style.width = '60px';
    const nContent = document.createElement('input'); nContent.placeholder = '내용';
    newRow.appendChild(nDate); newRow.appendChild(nContent);
    const addBtn = document.createElement('button'); addBtn.className = 'admin-btn'; addBtn.textContent = '+ 추가';
    addBtn.addEventListener('click', function() {
      if (!nContent.value.trim()) return;
      db.collection('gt_memos').add({ date: nDate.value, content: nContent.value, order: Date.now(), show: true });
      nDate.value = ''; nContent.value = '';
    });
    newRow.appendChild(addBtn);
    box.appendChild(newRow);

    adminTabBody.appendChild(box);
  }
</script>
</body>
