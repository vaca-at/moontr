<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>진선여고 통합사회2 · 윤리 파트 수업 자료</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%96%EF%B8%8F%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#F291B2">
<meta name="description" content="통합사회2 윤리 파트 · 학습지(빈칸 정답 보기)와 사회계약설 · 교정적 정의 · 자본주의 활동 사례">
<meta property="og:type" content="website">
<meta property="og:title" content="진선여고 통합사회2 · 윤리 파트 수업 자료">
<meta property="og:description" content="학습지 빈칸 정답 보기 · 사회계약설 · 교정적 정의 · 자본주의 활동 사례">
<meta property="og:url" content="https://moontr.site/c22/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'OngleipUnz';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2406-1@1.0/Ownglyph_UNZ-Rg.woff2') format('woff2');font-weight:normal;font-display:swap;size-adjust:125%}

/* ===== 색 (소나기 연수와 같은 분홍 팔레트) ===== */
:root{
  --bg:#FFF7F2; --ink:#5B4850; --ink2:#957F87; --line:#F2DED6; --soft:#FFFBF7; --accent:#F291B2;
  --pink:#F291B2; --green:#7EC49A; --mustard:#D9A548; --rose:#E0698F; --sky:#79B4DE; --lav:#A893D6; --coral:#EE9D78; --teal:#5FBDB0;
  --hand:'OngleipUnz', 'Gowun Dodum', sans-serif;
  --body:'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --yellow:#FFE066; --yellow-soft:#FFF5C2;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
::-webkit-scrollbar{width:14px;height:12px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-button{display:none;width:0;height:0}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--c,var(--accent)) 45%,#fff);border:3px solid transparent;border-radius:99px;background-clip:padding-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:9rem}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
a{color:var(--rose)}
b{color:#3F2F36}
.muted{color:var(--ink2);font-size:.9375rem}

/* ===== 머리 + 탭 ===== */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:2px solid var(--line)}
.head-in{max-width:1240px;margin:0 auto;padding:.625rem 1rem .25rem;display:flex;align-items:center;gap:.75rem}
.logo{width:2.25rem;height:2.25rem;border-radius:.625rem;display:grid;place-items:center;background:#fff;box-shadow:0 2px 6px rgba(224,105,143,.25);font-size:1.25rem;flex:none}
.course{font-family:var(--hand);font-size:.875rem;color:#fff;background:var(--accent);padding:.0625rem .625rem .125rem;border-radius:999px;white-space:nowrap}
h1{margin:0;font-family:var(--hand);font-weight:400;font-size:1.5rem;line-height:1.2}
h1 small{font-size:1rem;color:var(--ink2)}
.site-link{margin-left:auto;font-family:var(--hand);font-size:1.375rem;color:var(--rose);text-decoration:none;border:2px dashed var(--rose);border-radius:999px;padding:0 .875rem;white-space:nowrap}
.site-link:hover{background:#fff}
nav.steps{max-width:1240px;margin:0 auto;padding:.375rem 1rem .625rem;display:flex;gap:.5rem;overflow-x:auto;scrollbar-width:none}
nav.steps::-webkit-scrollbar{display:none}
.st-tab{--c:var(--pink);flex:1 0 auto;display:flex;align-items:center;gap:.5rem;border:2px solid color-mix(in srgb,var(--c) 40%,#fff);background:#fff;border-radius:999px;padding:.3125rem .875rem .3125rem .375rem;text-align:left;transition:background .15s}
.st-tab .no{flex:none;width:1.75rem;height:1.75rem;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;font-family:var(--hand);font-size:1.0625rem}
.st-tab .lab{font-family:var(--hand);font-size:1.125rem;line-height:1.15;white-space:nowrap}
.st-tab .lab small{display:block;font-family:var(--body);font-size:.6875rem;color:var(--ink2)}
.st-tab:hover{background:color-mix(in srgb,var(--c) 12%,#fff)}
.st-tab.on{background:var(--c);border-color:var(--c);color:#fff}
.st-tab.on .no{background:#fff;color:var(--c)}
.st-tab.on .lab small{color:rgba(255,255,255,.9)}

/* 학습지 쪽 번호 막대 (1번 탭에서만 보여요) */
.pbar{max-width:1240px;margin:0 auto;padding:0 1rem .625rem;display:flex;align-items:center;gap:.375rem;flex-wrap:wrap}
.pbar .lbl{font-family:var(--hand);font-size:1.125rem;color:var(--rose);margin-right:.125rem}
.pg{width:2.5rem;height:2.5rem;border-radius:50%;border:2px solid color-mix(in srgb,var(--pink) 45%,#fff);background:#fff;font-family:var(--hand);font-size:1.25rem;line-height:1;display:grid;place-items:center;padding:0;transition:background .15s,transform .15s}
.pg:hover{background:color-mix(in srgb,var(--pink) 15%,#fff)}
.pg.on{background:var(--pink);border-color:var(--pink);color:#fff;transform:scale(1.12);box-shadow:0 3px 10px color-mix(in srgb,var(--pink) 45%,transparent)}
.pbar .sp{flex:1}
.rv{border:2px solid #E8C437;background:var(--yellow);color:#5B3A00;border-radius:999px;padding:.375rem 1rem;font-family:var(--hand);font-size:1.125rem;white-space:nowrap}
.rv:hover{filter:brightness(1.04)}
.rv.off{background:#fff}
a.rv{text-decoration:none;display:inline-block}
.rv.line{background:#fff;border-color:var(--line);color:var(--ink)}

/* ===== 페이지 ===== */
main{max-width:1240px;margin:0 auto;padding:1.25rem 1rem 2rem}
.page{--c:var(--pink)}
.page-head{display:flex;align-items:flex-end;gap:.875rem;flex-wrap:wrap;margin:0 0 1.125rem}
.page-no{font-family:var(--hand);font-size:3.25rem;line-height:.85;color:var(--c)}
.page-title{flex:1;min-width:14rem}
.page-title h2{margin:0;font-family:var(--hand);font-weight:400;font-size:2rem;line-height:1.15}
.page-title p{margin:.125rem 0 0;color:var(--ink2)}
.tag-time{font-family:var(--hand);color:var(--c);border:2px dashed var(--c);border-radius:999px;padding:0 .75rem;white-space:nowrap}

/* ===== 바둑판 카드 ===== */
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem}
.card{--c:var(--pink);position:relative;display:flex;flex-direction:column;background:#fff;border:2px solid color-mix(in srgb,var(--c) 30%,#fff);border-radius:1.25rem;padding:.875rem 1rem;box-shadow:0 2px 0 color-mix(in srgb,var(--c) 18%,#fff);cursor:pointer;transition:transform .12s, box-shadow .12s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 16px color-mix(in srgb,var(--c) 25%,transparent)}
.card .ch{display:flex;align-items:center;gap:.5rem;margin:0 0 .375rem;padding-right:2rem}
.card .ce{flex:none;width:2.25rem;height:2.25rem;border-radius:.75rem;display:grid;place-items:center;font-size:1.25rem;background:color-mix(in srgb,var(--c) 18%,#fff)}
.card .ct{margin:0;font-family:var(--hand);font-weight:400;font-size:1.375rem;line-height:1.2;color:color-mix(in srgb,var(--c) 70%,var(--ink))}
.card .key{margin:0 0 .5rem;font-size:1.0625rem;line-height:1.55}
.card .tags{margin-top:auto;display:flex;flex-wrap:wrap;gap:.25rem}
.tg{display:inline-block;font-size:.75rem;color:color-mix(in srgb,var(--c) 70%,var(--ink));background:color-mix(in srgb,var(--c) 14%,#fff);border-radius:999px;padding:0 .5rem}
.card .plus{position:absolute;top:.75rem;right:.75rem;width:1.875rem;height:1.875rem;border-radius:50%;display:grid;place-items:center;border:2px solid color-mix(in srgb,var(--c) 45%,#fff);background:color-mix(in srgb,var(--c) 10%,#fff);color:color-mix(in srgb,var(--c) 65%,var(--ink))}
.card:hover .plus{background:var(--c);color:#fff}
.mark{background:linear-gradient(transparent 55%, color-mix(in srgb,var(--c,var(--accent)) 38%, transparent) 55%);padding:0 .125rem}
.intro{background:#fff;border:2px dashed color-mix(in srgb,var(--c) 45%,#fff);border-radius:1rem;padding:.5rem 1rem;margin:0 0 1rem;font-size:.9375rem}

/* ===== 학습지 (종이 모양) ===== */
.sheet{position:relative;max-width:940px;margin:0 auto 2rem;background:#fff;border-radius:.75rem;box-shadow:0 4px 18px rgba(91,72,80,.12);padding:1.25rem 2.5rem 2.25rem;color:#2E2A2C;font-size:1rem;line-height:1.7}
.sheet-h{display:flex;align-items:center;gap:.625rem;border-bottom:2px solid #6B6B6B;padding-bottom:.5rem;margin-bottom:1.25rem}
.sheet-h .pno{font-family:var(--hand);font-size:1.5rem;color:#fff;background:var(--pink);border-radius:999px;padding:0 .875rem;line-height:1.6}
.sheet-h .cnt{color:var(--ink2);font-size:.875rem;flex:1}
.sheet-h .rv{font-size:1rem;padding:.25rem .875rem}
.unit{border:1.5px solid #333;padding:.375rem .875rem;font-size:1.125rem;margin:0 0 1.25rem}
.sheet h4{margin:1.25rem 0 .375rem;font-size:1.125rem}
.sheet p{margin:.375rem 0}
.sheet ol.par,.sheet ul.dot{margin:.25rem 0;padding-left:1.5rem}
.sheet ul.dot{list-style:none;padding-left:1rem}
.sheet ul.dot li{position:relative}
.sheet ul.dot li::before{content:"•";position:absolute;left:-.875rem}
table.ws{width:100%;border-collapse:collapse;margin:.5rem 0 1rem;font-size:.9375rem;line-height:1.6}
table.ws th,table.ws td{border:1px solid #555;padding:.375rem .5rem;vertical-align:top}
table.ws th{background:#F5F2F0;font-weight:700;text-align:center;vertical-align:middle;white-space:nowrap}
table.ws td.c{text-align:center;vertical-align:middle}
table.ws ul.dot{margin:0}
.ref-tag{display:inline-block;background:#4A4A4A;color:#fff;font-weight:700;padding:.25rem .875rem;margin:1.25rem 0 .375rem;border:2px solid #222}
.ref{border:1.5px solid #333;padding:.625rem .875rem;font-size:.9375rem;line-height:1.75;font-family:'Batang','Nanum Myeongjo',serif;color:#333}
.ref p{margin:.25rem 0;text-indent:.5rem}
.ref .src{text-align:right;text-indent:0;font-family:var(--body);font-size:.875rem}
.ref hr{border:0;border-top:1px dashed #999;margin:.625rem 0}
.exp{margin:.5rem 0 0;text-indent:.5rem}
.note{font-size:.8125rem;color:#555}

/* 빈칸: 노란 칸을 누르면 정답이 보이고, 다시 누르면 가려져요 */
.bl{display:inline-block;min-width:3.5em;margin:0 .125rem;padding:0 .375rem;border:0;border-radius:.3rem;background:var(--yellow);color:transparent;font:inherit;line-height:1.45;vertical-align:baseline;text-align:center;box-shadow:inset 0 -2px 0 #E8C437;user-select:none;transition:background .15s,color .15s}
.bl:hover{background:#FFD43B}
.bl.on{background:var(--yellow-soft);color:#C2185B;font-weight:700;box-shadow:inset 0 -2px 0 #F2D46B}

/* ===== 작은 창 ===== */
dialog.pop{--c:var(--pink);width:min(50rem,calc(100% - 2rem));max-height:calc(100dvh - 3rem);border:0;border-radius:1.5rem;padding:0;background:#fff;color:var(--ink);box-shadow:0 20px 60px rgba(91,72,80,.3)}
dialog.pop::backdrop{background:rgba(91,72,80,.35);backdrop-filter:blur(2px)}
.pop-h{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:.625rem;background:color-mix(in srgb,var(--c) 18%,#fff);padding:.75rem 1rem .75rem 1.25rem}
.pop-h h3{flex:1;margin:0;font-family:var(--hand);font-weight:400;font-size:1.75rem;line-height:1.2}
.pop-x{border:0;background:#fff;border-radius:999px;width:2.5rem;height:2.5rem;font-size:1.125rem}
.pop-b{padding:1rem 1.25rem 1.5rem;font-size:1.0625rem}
.pop-b h4{font-family:var(--hand);font-weight:400;font-size:1.375rem;margin:1.125rem 0 .25rem;color:color-mix(in srgb,var(--c) 70%,var(--ink))}
.pop-b ul{padding-left:1.25rem;margin:.25rem 0}
.pop-b li{margin:.1875rem 0}
.box{background:var(--soft);border:2px solid var(--line);border-radius:1rem;padding:.75rem 1rem;margin:.375rem 0}
.box p{margin:.25rem 0}
.box blockquote{margin:.375rem 0;padding:.375rem .75rem;border-left:4px solid color-mix(in srgb,var(--c) 55%,#fff);background:#fff;border-radius:0 .5rem .5rem 0}
ol.num{margin:.25rem 0;padding:0;list-style:none;counter-reset:n;display:grid;gap:.4375rem}
ol.num > li{counter-increment:n;position:relative;padding-left:2.125rem}
ol.num > li::before{content:counter(n);position:absolute;left:0;top:.125rem;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--hand);font-size:.9375rem}
.chips{display:flex;flex-wrap:wrap;gap:.375rem;margin:.75rem 0 0}
.chip{display:inline-flex;align-items:center;border:2px solid color-mix(in srgb,var(--c) 35%,#fff);background:#fff;border-radius:999px;padding:0 .75rem;font-size:.875rem}
details.ans{margin-top:1rem;border:2px dashed color-mix(in srgb,var(--c) 50%,#fff);border-radius:1rem;padding:.5rem 1rem;background:color-mix(in srgb,var(--c) 5%,#fff)}
details.ans summary{cursor:pointer;font-family:var(--hand);font-size:1.1875rem}
details.ans[open] summary{margin-bottom:.25rem}
table.cmp{width:100%;border-collapse:collapse;font-size:.9375rem;margin:.375rem 0}
table.cmp th,table.cmp td{border:1px solid var(--line);padding:.375rem .625rem;text-align:left;vertical-align:top}
table.cmp th{background:var(--soft);font-weight:400;font-family:var(--hand);font-size:1.0625rem}

/* ===== 맨 아래 ===== */
.policy-foot{max-width:760px;margin:1rem auto 3.5rem;padding:0 16px;font-size:12px;line-height:1.7;color:var(--ink2);text-align:center}
.pol-open{border:0;background:none;padding:0;font-size:12px;color:var(--ink2);opacity:.85}
.pol-open b{color:inherit}
.pol-open:hover{text-decoration:underline}
.pol{font-size:.9375rem;line-height:1.7}
.pol table{width:100%;border-collapse:collapse;margin:.375rem 0;font-size:.875rem}
.pol th,.pol td{border:1px solid var(--line);padding:.25rem .5rem;text-align:left;vertical-align:top}
.pol th{background:var(--soft)}
.pol .small{opacity:.7;font-size:.8125rem}
.admin-fab{position:fixed;right:12px;bottom:12px;z-index:10;padding:4px 11px;border-radius:999px;border:1px solid rgba(0,0,0,.12);background:rgba(255,255,255,.85);color:#667;font:11px/1.4 sans-serif;text-decoration:none;opacity:.45;transition:opacity .15s}
.admin-fab:hover,.admin-fab:focus-visible{opacity:1}

/* ===== 화면 크기 ===== */
@media (max-width:1060px){ .bento{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:640px){
  .bento{grid-template-columns:minmax(0,1fr)}
  h1{font-size:1.25rem} h1 small{display:none} .site-link{display:none}
  .st-tab .lab small{display:none}
  .page-no{font-size:2.5rem} .page-title h2{font-size:1.625rem}
  .sheet{padding:1rem 1rem 1.5rem}
  .pg{width:2.125rem;height:2.125rem;font-size:1.0625rem}
  table.ws{font-size:.8125rem} table.ws th,table.ws td{padding:.25rem}
}
@media print{header,.policy-foot,.admin-fab,.sheet-h .rv{display:none}.page[hidden]{display:block}.sheet{box-shadow:none;break-after:page}}
</style>
</head>
<body>

<header id="hd">
  <div class="head-in">
    <span class="logo" aria-hidden="true">⚖️</span>
    <span class="course">진선여고</span>
    <h1>통합사회2 윤리 파트 <small>수업 자료</small></h1>
    <a class="site-link" href="https://moontr.site/c22/">moontr.site/c22</a>
  </div>
  <nav class="steps" id="steps" aria-label="자료 고르기"></nav>
  <div class="pbar" id="pbar" hidden>
    <span class="lbl">쪽</span>
    <span id="pgs" style="display:contents"></span>
    <span class="sp"></span>
    <button type="button" class="rv" id="rvPage">👀 이 쪽 정답 보기</button>
    <button type="button" class="rv line" id="rvAll">📚 전체 보기</button>
    <a class="rv line" id="pdfDl" href="worksheet.pdf" download="통합사회2 윤리파트 학습지.pdf">📥 PDF 내려받기</a>
  </div>
</header>

<main id="main"></main>

<footer class="policy-foot">
  <button type="button" class="pol-open" data-pop="policy:0" aria-haspopup="dialog">통합사회2 수업 자료 · 이용약관 · <b>개인정보 처리방침</b></button>
  <template id="policyTpl">
    <div class="pol">
      <h4>이용약관</h4>
      <ul><li>진선여자고등학교 1학년 통합사회2 수업을 돕기 위한 학습 자료입니다.</li><li>학습지와 활동 사례는 수업 시간과 복습에 자유롭게 쓰되, 다른 곳에 옮길 때는 출처를 남겨 주세요.</li><li>빈칸 정답은 선생님이 수업에서 설명한 내용이 기준입니다. 이 화면의 정답과 다르면 수업 내용을 따르세요.</li></ul>
      <h4>개인정보 처리방침</h4>
      <table><tr><th>받는 정보</th><th>쓰임</th><th>보관</th></tr><tr><td>없음 (로그인 · 이름 · 학번을 받지 않습니다)</td><td>—</td><td>—</td></tr></table>
      <ul><li>빈칸을 열고 닫은 기록은 어디에도 저장하지 않습니다. 새로 고치면 처음처럼 모두 가려집니다.</li><li>왼쪽 아래 방문 수는 횟수만 세고, 누가 들어왔는지는 남기지 않습니다.</li></ul>
      <p>궁금한 점: anstjsdud@sen.go.kr</p>
      <p class="small">마지막 수정일 2026년 10월 12일 · 현재 운영 방식을 정리한 안내로, 법률 검토를 거친 문서가 아닙니다.</p>
    </div>
  </template>
</footer>
<a class="admin-fab" href="/admin/">관리자</a>

<dialog class="pop" id="pop" aria-labelledby="popTitle">
  <div class="pop-h"><h3 id="popTitle"></h3><button type="button" class="pop-x" data-close aria-label="닫기">✕</button></div>
  <div class="pop-b" id="popBody"></div>
</dialog>

<script>
/* =========================================================
   0) 작은 도구들
   ========================================================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const C = { pink: "var(--pink)", green: "var(--green)", mustard: "var(--mustard)", rose: "var(--rose)", sky: "var(--sky)", lav: "var(--lav)", coral: "var(--coral)", teal: "var(--teal)" };
// 빈칸 하나: B("정답")  → 노란 칸. 누르면 정답이 보여요
const B = a => `<button type="button" class="bl" aria-label="빈칸 (누르면 정답)">${a}</button>`;
// 참고 자료 상자: REF("제목", ["문단", ...], "출처")
const REF = (t, ps, src) => `<div class="ref-tag">참고 자료 : ${t}</div><div class="ref">${ps.map(p => p === "---" ? "<hr>" : `<p>${p}</p>`).join("")}${src ? `<p class="src">- ${src} -</p>` : ""}</div>`;
const SRC = s => `<p class="src">- ${s} -</p>`;
const EXP = (...ps) => ps.map(p => `<p class="exp">${p}</p>`).join("");
const ul = items => `<ul class="dot">${items.map(x => `<li>${x}</li>`).join("")}</ul>`;

`${REF("루소의 사회 계약론", ["그러나 이러한 평화롭고 순진한 상태는 오래가지 않았다. 농업과 금속의 발견이 인간의 운명을 바꾸었다. 철은 인간에게 농기구를 주었고, 밀은 그들에게 식량을 주었다. 그로 인해 노동이 필요해졌고, 노동은 인간을 결합시켰으며, 결합된 인간들은 분업과 비교, 불평등을 낳았다. 한 사람은 농사를 지었고, 다른 사람은 무기를 만들었으며, 그들이 서로 물물교환을 하게 되자, (사적)소유의 관념이 등장하였다. 누군가가 “이 땅은 내 것이다” 라고 말하고, 그 말을 믿을 만큼 순진한 사람들을 발견했을 때, 그 순간이 바로 시민사회의 진정한 창설이었다. 처음으로 어떤 사람이 땅을 울타리로 둘러싸고 “이것은 내 것이다.”라고 말하며, 그것을 믿을 만큼 순진한 사람들을 발견한 자야말로 시민사회의 진정한 창설자였다. 얼마나 많은 범죄, 전쟁, 살인, 고통과 공포가, 이 한마디 말에서 비롯되었는가! 만약 누군가가 그때 울타리를 뽑아 던지고 외쳤더라면 — “이 땅에 울타리를 치는 자와 그것을 믿는 자들이여, 당신들이야말로 인류를 파멸시키는 자들이다! 과일은 모두의 것이며, 땅은 아무의 것도 아니다!” — 그는 인류를 얼마나 많은 죄악과 비참으로부터 구했을 것인가! 그때부터는 자연적 평등이 영원히 사라졌다. 권력과 부, 재능과 미덕이 서로 다른 가치를 가지게 되었고, 인간은 타인에게 복종하거나 지배하려는 욕망에 사로잡혔다."], "루소, 『인간 불평등 기원론』")}

<div class="ref" style="margin-top:1rem">
<p>개인과 개인이 연합하여 공동의 힘으로 각 개인의 생명과 재산을 방어하고 보존하는 일종의 연합 형태를 발견하고, 이에 의해 각 개인은 전체에 결합하지만 종전처럼 자기 자신에게만 복종하고 전처럼 자유를 잃지 않는 연합 형태야말로 사회 계약에 의해 이루어져야 할 근본 문제인 것이다.</p>${SRC("루소, 『인간 불평등 기원론』")}<hr>

${REF("아담 스미스의 고전적 자본주의", ["우리가 저녁 식사를 기대할 수 있는 건 푸줏간 주인, 양조장 주인, 빵집 주인의 자비심 덕분이 아니라, 그들이 자기 이익을 챙기려는 생각 덕분이다. …… 각 개인은 보이지 않는 손에 의하여 인도되어 자기가 전혀 의도하지 않았던 목적을 촉진하게 된다. …… 그는 자신의 이익을 추구함으로써 오히려 더 효과적으로 사회의 이익을 촉진한다."], "아담 스미스, 『국부론』")}

`${EXP("케인즈는 이익을 고려할 필요가 없는 정부가 재정 지출을 증가시켜서 총수요를 증가시키는 것이 불황과 실업 문제를 해결할 유일한 방법으로 생각한다. 이러한 입장에서 케인즈는 공공 사업이나 구호 사업의 확대 등과 같은 정부의 재정 지출 확대를 통한 총수요 창출을 불황과 실업을 위한 대책으로 제시한다. 이러한 케인즈의 이론이 주류경제학으로 받아들여지면서 경제 정책이 자유방임주의에서 국가개입주의로 변화하게 되었다. 이후 빈부 격차, 독과점, 환경 파괴, 공공재의 부족 등 시장의 실패를 시정하기 위해서 정부가 경제에 적극적으로 개입할 것을 요청하게 되었다.")}

/* =========================================================
   3) 탭 목록
   ========================================================= */
const STEPS = [
  { t: "학습지", sub: "1~10쪽 · 빈칸 정답", c: C.pink, title: "학습지", lead: "사회계약설 · 교정적 정의 · 자본주의 (1~10페이지)", render: renderSheets },
  { t: "사회계약설", sub: `활동 사례 ${CONTRACT.length}개`, c: C.lav, title: "사회계약설 활동", lead: "홉스 · 로크 · 루소 — 카드를 눌러 사례와 활동을 보세요", data: CONTRACT, g: "contract" },
  { t: "교정적 정의", sub: `활동 사례 ${JUSTICE.length}개`, c: C.coral, title: "교정적 정의 활동", lead: "응보주의 · 공리주의 · 사형 제도 — 카드를 눌러 사례와 활동을 보세요", data: JUSTICE, g: "justice" },
  { t: "자본주의", sub: `활동 사례 ${CAPITAL.length}개`, c: C.green, title: "자본주의 활동", lead: "스미스 · 케인스 · 하이에크 · 마르크스 — 카드를 눌러 사례와 활동을 보세요", data: CAPITAL, g: "capital" }
];
const GROUPS = { contract: CONTRACT, justice: JUSTICE, capital: CAPITAL };

function card(o, i, g) {
  return `<article class="card" style="--c:${o.c}" data-pop="${g}:${i}" tabindex="0" role="button" aria-haspopup="dialog">
    <span class="plus" aria-hidden="true">＋</span>
    <div class="ch"><span class="ce">${o.e}</span><h3 class="ct">${o.t}</h3></div>
    <p class="key">${o.key}</p>
    <div class="tags">${o.tags.map(x => `<span class="tg">${x}</span>`).join("")}</div>
  </article>`;
}
const renderCards = s => `<div class="bento">${s.data.map((o, i) => card(o, i, s.g)).join("")}</div>`;
const caseBody = o => `<p style="font-size:1.125rem;margin-top:0">${o.key}</p>
  <h4>📌 사례</h4><div class="box">${o.story}</div>
  <h4>🧩 활동</h4><ol class="num">${o.act.map(x => `<li>${x}</li>`).join("")}</ol>
  <h4>💭 생각해 볼 질문</h4><ul>${o.q.map(x => `<li>${x}</li>`).join("")}</ul>
  ${o.tip ? `<details class="ans"><summary>👩‍🏫 수업 연결 포인트 (누르면 열려요)</summary>${o.tip}</details>` : ""}
  <div class="chips">${o.tags.map(x => `<span class="chip">#${x}</span>`).join("")}</div>`;

/* =========================================================
   4) 페이지 만들기 · 넘기기
   ========================================================= */
let cur = 1, pdfOk = false;
function build() {
  $("#steps").innerHTML = STEPS.map((s, i) => `<button type="button" class="st-tab" style="--c:${s.c}" data-go="${i + 1}"><span class="no">${i + 1}</span><span class="lab">${s.t}</span></button>`).join("");
  $("#main").innerHTML = STEPS.map((s, i) => `<section class="page" id="p${i + 1}" style="--c:${s.c}" hidden>
    <div class="page-head"><span class="page-no">${i + 1}</span><div class="page-title"><h2>${s.title}</h2><p>${s.lead}</p></div>${i === 0 ? "" : `<span class="tag-time">🧩 ${s.data.length}개</span>`}</div>
    ${s.render ? s.render() : renderCards(s)}
  </section>`).join("");
  $("#pgs").innerHTML = WS.map((_, i) => `<button type="button" class="pg" data-pg="${i}" aria-label="${i + 1}쪽으로">${i + 1}</button>`).join("");
  $$(".sheet").forEach(s => { const n = s.querySelectorAll(".bl").length; if (!n) s.querySelector("[data-rv]").hidden = true; });
  // PDF 원본은 이 폴더의 worksheet.pdf 파일이에요 (파일을 바꾸면 내려받는 학습지도 바뀌어요)
  fetch("worksheet.pdf", { method: "HEAD" }).then(r => { pdfOk = r.ok && /pdf/.test(r.headers.get("content-type") || ""); }).catch(() => {});
}
function go(n, push = true) {
  n = Math.min(Math.max(1, +n || 1), STEPS.length);
  cur = n;
  if ($("#pop").open) $("#pop").close();
  $$(".page").forEach((p, i) => p.hidden = i + 1 !== n);
  $$(".st-tab").forEach((t, i) => { t.classList.toggle("on", i + 1 === n); t.setAttribute("aria-current", i + 1 === n ? "page" : "false"); });
  $("#pbar").hidden = n !== 1;
  document.body.style.setProperty("--c", STEPS[n - 1].c);
  fitPad();
  if (push && location.hash !== "#" + n) history.pushState(null, "", "#" + n);
  window.scrollTo({ top: 0 });
  onScroll();
}
window.addEventListener("popstate", () => go(location.hash.slice(1), false));
// 위쪽 머리 높이만큼 띄워서 쪽 제목이 가려지지 않게
function fitPad() { document.documentElement.style.scrollPaddingTop = ($("#hd").offsetHeight + 12) + "px"; }
window.addEventListener("resize", () => { fitPad(); onScroll(); });

/* =========================================================
   5) 학습지: 쪽 번호 따라가기 · 빈칸 보이기/가리기
   ========================================================= */
let curPg = 0;
function onScroll() {
  if (cur !== 1) return;
  const sheets = $$(".sheet"), top = $("#hd").offsetHeight + 40;
  let idx = 0;
  sheets.forEach((s, i) => { if (s.getBoundingClientRect().top <= top) idx = i; });
  if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) idx = sheets.length - 1; // 맨 아래면 마지막 쪽
  setPg(idx);
}
function setPg(idx) {
  curPg = idx;
  $$(".pg").forEach((b, i) => { b.classList.toggle("on", i === idx); b.setAttribute("aria-current", i === idx ? "page" : "false"); });
  syncRv();
}
let ticking = false;
window.addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { ticking = false; onScroll(); }); } }, { passive: true });

const pageBlanks = i => [...$("#ws" + (i + 1)).querySelectorAll(".bl")];
const allOpen = list => list.length > 0 && list.every(b => b.classList.contains("on"));
function setBlanks(list, open) { list.forEach(b => b.classList.toggle("on", open)); syncRv(); }
// 단추 글씨를 지금 상태에 맞게 (모두 보이면 '가리기', 아니면 '보기')
function syncRv() {
  $$("[data-rv]").forEach(btn => { const o = allOpen(pageBlanks(+btn.dataset.rv)); btn.textContent = o ? "🙈 이 쪽 다시 가리기" : "👀 이 쪽 정답 보기"; btn.classList.toggle("off", !o); });
  const pl = pageBlanks(curPg), po = allOpen(pl), r = $("#rvPage");
  r.hidden = !pl.length;
  r.textContent = po ? `🙈 ${curPg + 1}쪽 다시 가리기` : `👀 ${curPg + 1}쪽 정답 보기`;
  r.classList.toggle("off", po);
  $("#rvAll").textContent = allOpen($$(".sheet .bl")) ? "🙈 전체 가리기" : "📚 전체 보기";
}

/* =========================================================

function openPop(key) {
  const [g, i] = key.split(":");
  const d = $("#pop");
  if (g === "policy") {
    d.style.setProperty("--c", C.pink);
    $("#popTitle").textContent = "📜 이용약관 · 개인정보 처리방침";
    $("#popBody").innerHTML = $("#policyTpl").innerHTML;
  } else {
    const o = GROUPS[g] && GROUPS[g][+i]; if (!o) return;
    d.style.setProperty("--c", o.c);
    $("#popTitle").textContent = `${o.e} ${o.t}`;
    $("#popBody").innerHTML = caseBody(o);
  }
  d.showModal(); d.scrollTop = 0;
}

/* =========================================================
   7) 누르기 한곳에서 처리
   ========================================================= */
document.addEventListener("click", e => {
  const t = e.target;
  if (t.closest("#pdfDl") && !pdfOk) { e.preventDefault(); alert("PDF 파일을 준비하고 있어요. 조금만 기다려 주세요!"); return; }
  const bl = t.closest(".bl"); if (bl) { bl.classList.toggle("on"); syncRv(); return; }
  const g = t.closest("[data-go]"); if (g) { go(g.dataset.go); return; }
  const pg = t.closest("[data-pg]"); if (pg) { const i = +pg.dataset.pg; $("#ws" + (i + 1)).scrollIntoView({ behavior: "smooth", block: "start" }); setPg(i); return; }
  const rv = t.closest("[data-rv]"); if (rv) { const l = pageBlanks(+rv.dataset.rv); setBlanks(l, !allOpen(l)); return; }
  if (t.closest("#rvPage")) { const l = pageBlanks(curPg); setBlanks(l, !allOpen(l)); return; }
  if (t.closest("#rvAll")) { const l = $$(".sheet .bl"); setBlanks(l, !allOpen(l)); return; }
  if (t.closest("[data-close]") || t === $("#pop")) { $("#pop").close(); return; }
  const pp = t.closest("[data-pop]"); if (pp && !t.closest("details")) { openPop(pp.dataset.pop); return; }
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("article[data-pop]")) { e.preventDefault(); e.target.click(); }
});

build();
go(location.hash.slice(1) || 1, false);
</script>
