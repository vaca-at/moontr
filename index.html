

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>moontr.site</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Press+Start+2P&family=Gaegu:wght@400;700&family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;600;700&family=Nanum+Myeongjo:wght@700;800&display=swap">
<style>
/* ============================================================
   기본 설정
   - 글자 크기가 화면 크기에 맞춰 자동으로 커지고 작아집니다.
     (전자칠판 = 크게, 아이패드·노트북 = 보통, 스마트폰 = 최소 16px)
   ============================================================ */
:root{
  --sky:#7CC6F0; --sky-soft:#D6EFFA; --sky-deep:#1E6FA8;
  --mint:#7FD8C2; --mint-soft:#D2F2E8; --mint-deep:#1F7A65;
  --ink:#17324A; --muted:#4A6275;
  --peach:#FFE3C7; --cream:#F7F4EC; --navy:#10263A;
  --bar-h:3.6rem;
}
*{box-sizing:border-box}
html{font-size:clamp(15px, 0.9vw + 0.7vh, 28px)}
body{
  margin:0; min-height:100vh; min-height:100dvh;
  font-family:'Gowun Dodum',sans-serif; color:var(--fg,var(--ink));
  background:var(--bg,var(--cream));
  transition:background-color .3s;
}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky-deep);outline-offset:3px}

/* 대문마다 배경색 */
body[data-v="door"]  {--bg:var(--cream);--fg:var(--ink);--bar-fg:var(--ink);--pill:#E9E3D3;--pill-on:var(--ink);--pill-on-fg:#fff}
body[data-v="time"]  {--bg:var(--navy);--fg:#EAF4F8;--bar-fg:#EAF4F8;--pill:#1B3A55;--pill-on:var(--mint);--pill-on-fg:#0B2A22}
body[data-v="school"]{--bg:#EAF6F1;--fg:var(--ink);--bar-fg:var(--ink);--pill:#D3EBE1;--pill-on:var(--ink);--pill-on-fg:#fff}
body[data-v="quote"] {--bg:#DFF3FA;--fg:var(--ink);--bar-fg:var(--ink);--pill:#C4E4F1;--pill-on:var(--ink);--pill-on-fg:#fff}

/* ============================================================
   상단 대문 선택 버튼
   ============================================================ */
/* 위쪽 막대: 대문마다 색이 다른 둥근 버튼 (입구 · 시간표 · 학교 · 한마디) */
.bar{
  height:var(--bar-h); padding:0 2.2vw;
  display:flex; align-items:center; gap:1rem;
  color:var(--bar-fg);
}
.logo{font-weight:700;font-size:1.05rem;text-decoration:none;letter-spacing:.02em;white-space:nowrap}
.logo .lg-game,.hstat,.switch button b{display:none}
.switch{margin-left:auto;display:flex;align-items:center;gap:.4rem}
.switch button{
  min-height:44px; padding:0 1rem; border:0; border-radius:999px;
  background:var(--pill); cursor:pointer; font-size:.9rem;
}
.switch button[aria-pressed="true"]{background:var(--pill-on);color:var(--pill-on-fg);font-weight:700}
.switch .shuffle{display:flex;align-items:center;gap:.35rem;background:transparent;border:2px solid var(--pill)}
.switch svg{width:1.1em;height:1.1em}

/* ⑪ 플래너 대문일 때만 게임 UI (문쌤 타이쿤 시안): 어두운 막대 · 픽셀 로고 · DATE / TIME / 지금 · 번호 붙은 네모 버튼 */
body[data-v="planner"] .bar{padding:0 1.6vw;background:#07070C;color:#EDEDF5;border-bottom:2px solid #2A2A3A;box-shadow:0 2px 0 #000,0 0 18px rgba(47,227,240,.12)}
body[data-v="planner"] .logo .lg-plain{display:none}
body[data-v="planner"] .logo .lg-game{display:block;font-family:'Press Start 2P',monospace;font-size:.72rem;font-weight:400;color:#FFD400;line-height:1.35;letter-spacing:0}
body[data-v="planner"] .logo small{display:block;font-family:'Do Hyeon',sans-serif;font-size:.7rem;color:#8C8CA6;letter-spacing:.03em}
body[data-v="planner"] .hstat{display:flex;flex-direction:column;gap:.2rem;padding-left:.8rem;border-left:2px solid #2A2A3A;white-space:nowrap}
.hstat span{font-family:'Do Hyeon',sans-serif;font-size:.62rem;color:#8C8CA6}
.hstat b{font-family:'Press Start 2P',monospace;font-size:.66rem;font-weight:400;font-variant-numeric:tabular-nums}
.hstat b.y{color:#FFD400}
.hstat b.k{font-family:'Do Hyeon',sans-serif;font-size:.92rem}
body[data-v="planner"] .switch{gap:.35rem}
body[data-v="planner"] .switch button{min-height:40px;padding:0 .75rem;border:2px solid rgba(237,237,245,.32);border-radius:0;background:transparent;color:#EDEDF5;font-family:'Do Hyeon',sans-serif;font-size:.95rem;font-weight:400;display:flex;align-items:center;gap:.4rem;white-space:nowrap}
body[data-v="planner"] .switch button b{display:inline;font-family:'Press Start 2P',monospace;font-size:.55rem;font-weight:400}
body[data-v="planner"] .switch button:hover{border-color:#FFD400}
body[data-v="planner"] .switch button[aria-pressed="true"]{background:#FFD400;border-color:#FFD400;color:#16131A}
body[data-v="planner"] .switch .shuffle{border-style:dashed}
body[data-v="planner"]{--bg:#0B0B12;--fg:#EDEDF5}

main{height:calc(100dvh - var(--bar-h)); min-height:520px}
.view{display:none;height:100%}
.view.on{display:flex;animation:enter .35s ease-out}
/* ⑪ 위클리 플래너: 어두운 픽셀 그림을 16:9 액자로 가운데에 */
#v-planner{flex-direction:column;align-items:center;justify-content:center;gap:.7rem;padding:1vh 3vw 3vh}
#v-planner .pframe{width:min(100%,calc((100dvh - var(--bar-h) - 7.6rem)*16/9));aspect-ratio:16/9;background:#07070C;border:2px solid #2A2A3A;overflow:hidden;box-shadow:0 0 0 1px #000,0 0 22px rgba(47,227,240,.14)}
/* 게임 조작판 (네모 버튼 · 픽셀 글씨 · 고른 칸은 노랗게) */
.gpanel{width:min(100%,calc((100dvh - var(--bar-h) - 7.6rem)*16/9));min-width:min(100%,640px);display:flex;flex-direction:column;gap:.4rem;padding:.5rem .7rem;background:#0B0B12;border:2px solid #2A2A3A;color:#EDEDF5;font-family:'Do Hyeon',sans-serif}
.grow{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap}
.glab{font-family:'Press Start 2P',monospace;font-size:.5rem;color:#2FE3F0;margin-right:.2rem}
.gsep{width:2px;height:1.4rem;background:#2A2A3A;margin:0 .3rem}
.gbtn{min-height:34px;padding:0 .65rem;border:2px solid rgba(237,237,245,.3);border-radius:0;background:transparent;color:#EDEDF5;cursor:pointer;font-family:'Do Hyeon',sans-serif;font-size:.85rem;display:inline-flex;align-items:center;gap:.35rem;white-space:nowrap}
.gbtn b{font-family:'Press Start 2P',monospace;font-size:.5rem;font-weight:400;color:#FFD400}
.gbtn:hover{border-color:#FFD400}
.gbtn.on{background:#FFD400;border-color:#FFD400;color:#16131A}
.gbtn.on b{color:#16131A}
#v-planner iframe{display:block;width:100%;height:100%;border:0}
@keyframes enter{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.view.on{animation:none}body{transition:none}}

/* ============================================================
   ② 대상별 입구형
   ============================================================ */
#v-door{flex-direction:column;gap:3vh;padding:1vh 4vw 5vh;font-family:'Do Hyeon',sans-serif}
#v-door h1{margin:0;font-weight:400;font-size:2.6rem}
.doors{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2.5vw;min-height:0}
.door{
  position:relative; display:flex; flex-direction:column; justify-content:space-between;
  padding:12% 8% 7%; border:0; cursor:pointer; text-align:left; color:var(--ink);
  border-radius:50% 50% 1.2rem 1.2rem / 30% 30% 1.2rem 1.2rem;
}
.door:hover .knob{transform:scale(1.25)}
.door .who{font-family:'Gowun Dodum',sans-serif;font-size:.95rem;opacity:.85;align-self:center;text-align:center}
.door .name{font-size:2.3rem;display:flex;align-items:flex-end;justify-content:space-between}
.door .name svg{width:1.4em;height:1.4em}
.knob{position:absolute;right:9%;top:55%;width:1rem;height:1rem;border-radius:50%;background:var(--ink);transition:transform .2s}
.d1{background:#BFE6F7}.d2{background:#C4EEDF}.d3{background:var(--peach)}

/* ============================================================
   ④ 시간표 연동형
   ============================================================ */
#v-time{gap:3vw;padding:1vh 4vw 5vh;font-family:'IBM Plex Sans KR',sans-serif}
.now{
  flex:1.3; display:flex; flex-direction:column; justify-content:center; gap:2.5vh;
  padding:5vh 4vw; background:#183650; border-radius:1.6rem;
}
.chip{align-self:flex-start;padding:.35rem .9rem;border-radius:999px;background:var(--mint);color:#0B2A22;font-weight:700;font-size:.9rem}
.chip.rest{background:#F5C26B;color:#3A2500}
.now .big{font-size:5.2rem;font-weight:700;line-height:1}
.now .cls{font-size:1.5rem;color:#C9DCE6}
.now .go{
  align-self:flex-start; display:flex; align-items:center; min-height:3.4rem; padding:0 2rem;
  border-radius:1rem; background:var(--mint); color:#0B2A22; font-weight:700; font-size:1.2rem; text-decoration:none;
}
.today{flex:1;display:flex;flex-direction:column;gap:.55rem;justify-content:center}
.today h2{margin:0 0 .4rem;font-size:1rem;color:#A9C2D1;font-weight:600}
.today a,.today div.row{
  display:flex;align-items:center;gap:1rem;min-height:3rem;padding:0 1.1rem;
  border-radius:.8rem;background:#15304A;color:#A9C2D1;text-decoration:none;font-size:1rem
}
.today .row.cur{background:#2A5474;color:#fff;font-weight:600}
.today .no{width:3.2rem;font-weight:700}
.today .time{margin-left:auto;font-size:.8rem;opacity:.8}

/* ============================================================
   ⑦ 학교 지도형
   ============================================================ */
#v-school{flex-direction:column;align-items:center;padding:1vh 4vw 0;font-family:'Gaegu',sans-serif;overflow:hidden}
#v-school h1{margin:0;font-size:2.5rem;text-align:center;line-height:1.1}
#v-school .hint{font-size:1.2rem;color:#3E5B6E;margin:.3rem 0 2vh}
.building{width:min(92vw,1200px);display:flex;flex-direction:column;flex:1;min-height:0}
.roof{position:relative;height:11vh;min-height:70px}
.roof svg{width:100%;height:100%;display:block}
.clock{position:absolute;left:50%;top:48%;transform:translateX(-50%);width:6.5vh;height:6.5vh;min-width:40px;min-height:40px;border-radius:50%;background:#fff;border:3px solid var(--ink)}
.clock::before,.clock::after{content:"";position:absolute;left:50%;bottom:50%;width:3px;background:var(--ink);transform-origin:bottom center;border-radius:2px}
.clock::before{height:35%;transform:translateX(-50%) rotate(var(--h,0deg))}
.clock::after{height:44%;transform:translateX(-50%) rotate(var(--m,0deg))}
.body{
  flex:1; min-height:0; padding:2.2vh 2vw; background:#FFF8E8;
  border:3px solid var(--ink); border-top:0;
  display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); grid-template-rows:1fr 1.15fr; gap:2vh 1.6vw;
}
.win{
  display:flex;align-items:center;justify-content:center;text-align:center;padding:.5rem;
  border:3px solid var(--ink);border-radius:.7rem;text-decoration:none;font-weight:700;font-size:1.6rem;line-height:1.1
}
.win:nth-child(odd){background:var(--sky-soft)}.win:nth-child(even){background:var(--mint-soft)}
.win:hover{transform:translateY(-3px)}
.gate{
  grid-column:2 / span 2; background:#F7C9A8 !important;
  border-radius:50% 50% .5rem .5rem / 45% 45% .5rem .5rem; border-bottom:0; font-size:1.9rem
}
.ground{width:100vw;height:6vh;min-height:36px;background:#9ED6A8;border-top:3px solid var(--ink)}

/* ============================================================
   ⑩ 오늘의 한마디형
   ============================================================ */
#v-quote{gap:3vw;padding:1vh 4vw 5vh}
.qcard{
  flex:1.4; display:flex; flex-direction:column; justify-content:center; gap:3vh;
  padding:6vh 5vw; background:#fff; border-radius:1.8rem;
}
.qdate{font-size:1rem;color:var(--muted)}
.qtext{margin:0;font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:2.7rem;line-height:1.55;word-break:keep-all}
.qwho{font-size:1.05rem;color:var(--muted)}
.qlinks{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:center;gap:.8rem}
.qlinks a{
  display:flex;align-items:center;justify-content:center;text-align:center;min-height:4.2rem;padding:0 .8rem;
  border-radius:1rem;background:#fff;text-decoration:none;font-weight:700;font-size:1.05rem
}
.qlinks a:first-child{grid-column:1 / -1;background:var(--ink);color:#fff;min-height:5rem;font-size:1.2rem}

/* ============================================================
   대상별 입구: 눌렀을 때 뜨는 목록 창
   ============================================================ */
.sheet{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(16,38,58,.45);padding:4vw;z-index:10}
.sheet[hidden]{display:none}
.panel{width:min(620px,100%);max-height:85dvh;overflow:auto;background:#fff;color:var(--ink);border-radius:1.4rem;padding:1.6rem}
.panel header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.panel h2{margin:0;font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:1.8rem}
.panel .close{min-width:44px;min-height:44px;border:0;border-radius:50%;background:#EEF3F5;cursor:pointer;font-size:1.3rem}
.panel a{display:flex;flex-direction:column;gap:.15rem;padding:.9rem 0;border-top:1px solid #E1E9ED;text-decoration:none}
.panel a b{font-size:1.1rem}
.panel a span{font-size:.85rem;color:var(--muted)}
.panel .note{margin:.8rem 0 0;font-size:.85rem;color:var(--muted)}
/* ⑪ 플래너 대문에서 여는 목록 창: 레트로 게임 창 (네온 테두리 · 픽셀 제목 · 고르면 노란 칸 + ▶) */
body[data-v="planner"] .sheet{background:rgba(4,4,12,.72)}
body[data-v="planner"] .panel{background:#0B0B12;color:#EDEDF5;border:2px solid #2FE3F0;border-radius:0;padding:0;box-shadow:0 0 0 2px #000,0 0 0 4px #2A2A3A,0 0 28px rgba(47,227,240,.25);font-family:'Do Hyeon',sans-serif}
body[data-v="planner"] .panel header{margin:0;padding:.7rem .9rem;background:#07070C;border-bottom:2px solid #2A2A3A;position:sticky;top:0}
body[data-v="planner"] .panel h2{font-size:1.25rem;color:#FFD400;letter-spacing:.02em}
body[data-v="planner"] .panel h2::before{content:'▣ ';color:#2FE3F0}
body[data-v="planner"] .panel .close{border-radius:0;background:transparent;color:#EDEDF5;border:2px solid rgba(237,237,245,.35);min-width:40px;min-height:40px;font-size:1rem}
body[data-v="planner"] .panel .close:hover{border-color:#FF5FAE;color:#FF5FAE}
body[data-v="planner"] #sheetList{padding:.5rem .7rem;display:flex;flex-direction:column;gap:.4rem}
body[data-v="planner"] .panel a{position:relative;border:2px solid #2A2A3A;padding:.65rem .8rem .65rem 2.1rem;background:#12121C}
body[data-v="planner"] .panel a::before{content:'▶';position:absolute;left:.75rem;top:.75rem;font-size:.75rem;color:#2A2A3A}
body[data-v="planner"] .panel a b{font-weight:400;font-size:1.08rem;color:#EDEDF5}
body[data-v="planner"] .panel a span{color:#8C8CA6;font-family:'Gowun Dodum',sans-serif}
body[data-v="planner"] .panel a:hover,body[data-v="planner"] .panel a:focus-visible{border-color:#FFD400;background:#1B1B2C;outline:none}
body[data-v="planner"] .panel a:hover::before,body[data-v="planner"] .panel a:focus-visible::before{color:#FFD400;animation:blink .6s steps(2) infinite}
body[data-v="planner"] .panel a:hover b{color:#FFD400}
body[data-v="planner"] .panel .note{margin:0;padding:.5rem .9rem .8rem;color:#8C8CA6;font-size:.8rem}
@keyframes blink{50%{opacity:0}}

/* 관리자 버튼 (오른쪽 아래, 스크롤해도 따라다님) */
.admin-fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:9;
  padding:.35rem .9rem;border-radius:999px;border:1px solid var(--pill);background:var(--bg);color:var(--fg);
  font-size:.72rem;cursor:pointer;opacity:.4;transition:opacity .15s}
.admin-fab:hover,.admin-fab:focus-visible{opacity:1}


/* ============================================================
   세로 화면 (스마트폰, 세로로 든 아이패드)
   ============================================================ */
@media (max-width:720px), (orientation:portrait) and (max-width:1024px){
  :root{--bar-h:auto}
  .bar{flex-wrap:wrap;gap:.5rem .8rem;padding:.7rem 1rem .6rem}
  body[data-v="planner"] .hstat.hnow{display:none}
  body[data-v="planner"] .bar{padding:.7rem 1rem .6rem}
  .switch{overflow-x:auto;width:100%;margin-left:0}
  .switch button{flex:0 0 auto;padding:0 .9rem}
  .switch .shuffle span{display:none}
  main{height:auto;min-height:0}
  .view.on{min-height:calc(100dvh - 7rem)}

  #v-planner{justify-content:flex-start;padding:.6rem .6rem 1.2rem}
  #v-planner .pframe,.gpanel{width:100%;min-width:0}
  .gbtn{min-height:32px;padding:0 .5rem;font-size:.82rem}
  #v-door{padding:.5rem 1rem 1.5rem;gap:1rem}
  #v-door h1{font-size:2.1rem}
  .doors{grid-template-columns:1fr;gap:.9rem}
  .door{min-height:30vh;border-radius:6rem 6rem 1.2rem 1.2rem;padding:1.4rem 1.4rem 1.2rem}
  .door .who{align-self:flex-start;text-align:left}

  #v-time{flex-direction:column;padding:.5rem 1rem 1.5rem;gap:1.2rem}
  .now{padding:1.6rem}
  .now .big{font-size:3.4rem}
  .now .cls{font-size:1.15rem}
  .now .go{align-self:stretch;justify-content:center}

  #v-school{padding:.5rem 1rem 0}
  #v-school h1{font-size:2.2rem}
  .roof{height:90px}
  .body{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:none;gap:.8rem;padding:1rem}
  .win{min-height:88px;font-size:1.35rem}
  .gate{grid-column:1 / -1;min-height:110px}
  .ground{margin-top:0}

  #v-quote{flex-direction:column;padding:.5rem 1rem 1.5rem;gap:1rem}
  .qcard{padding:2rem 1.6rem}
  .qtext{font-size:1.75rem}
}
</style>
</head>
<body data-v="door">

<header class="bar">
  <a class="logo" href="./"><span class="lg-plain">moontr.site</span><span class="lg-game">MOONTR<small>moontr.site · 문쌤의 하루</small></span></a>
  <div class="hstat"><span>DATE</span><b id="hDate">--</b></div>
  <div class="hstat"><span>TIME</span><b class="y" id="hTime">--:--</b></div>
  <div class="hstat hnow"><span>지금</span><b class="k" id="hNow">--</b></div>
  <nav class="switch" aria-label="대문 디자인 선택">
    <button type="button" data-go="door"><b>1</b>입구</button>
    <button type="button" data-go="time"><b>2</b>시간표</button>
    <button type="button" data-go="school"><b>3</b>학교</button>
    <button type="button" data-go="quote"><b>4</b>한마디</button>
    <button type="button" data-go="planner"><b>5</b>타이쿤</button>
    <button type="button" class="shuffle" id="shuffle" aria-label="다른 대문 보기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
      <span>다른 대문</span>
    </button>
  </nav>
</header>

<main>
  <!-- ② 대상별 입구형 -->
  <section class="view" id="v-door" aria-label="대상별 입구">
    <h1>어디로 들어갈까요?</h1>

const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60 + m; };

  const today = WEEK[day];
  const gate = appById(MAIN_GATE);
  let html = '', cur = -1, next = -1;

  if (today){
    BELL.forEach(([s,e], i) => {
      if (m >= toMin(s) && m <= toMin(e)) cur = i;
      if (next < 0 && m < toMin(s)) next = i;
    });
  }
  const slot = i => (today && today[i]) ? today[i] : null;

  if (!today){
    html = `<span class="chip rest">쉬는 날</span><div class="big">주말</div>
            <div class="cls">푹 쉬고 월요일에 만나요</div>`;
  } else if (cur >= 0 && slot(cur)){
    const a = appById(slot(cur).app);
    html = `<span class="chip">지금 수업 중</span><div class="big">${cur+1}교시</div>
            <div class="cls">${esc(slot(cur).c)}</div>
            ${a ? `<a class="go" href="${esc(a.url)}">${esc(a.name)} 열기</a>` : ''}`;
  } else {
    let n = -1;
    for (let i = Math.max(next, 0); next >= 0 && i < BELL.length; i++){ if (slot(i)) { n = i; break; } }
    if (n >= 0){
      html = `<span class="chip rest">다음 수업</span><div class="big">${n+1}교시</div>
              <div class="cls">${esc(slot(n).c)} · ${BELL[n][0]} 시작</div>`;
    } else {
      html = `<span class="chip rest">오늘 수업 끝</span><div class="big">수고했어요</div>
              <div class="cls">오늘 수업이 모두 끝났어요</div>`;
    }
    if (gate) html += `<a class="go" href="${esc(gate.url)}">${esc(gate.name)} 보기</a>`;
  }
  $('#now').innerHTML = html;

  const rows = BELL.map(([s], i) => {
    const x = slot(i), a = x && appById(x.app);
    const inner = `<span class="no">${i+1}교시</span><span>${x ? esc(x.c) : '공강'}</span><span class="time">${s}</span>`;
    const cls = 'row' + (i === cur ? ' cur' : '');
    return a ? `<a class="${cls}" href="${esc(a.url)}">${inner}</a>` : `<div class="${cls}">${inner}</div>`;
  }).join('');
  $('#today').innerHTML = `<h2>${today ? '오늘 시간표' : '다음 주 월요일 시간표'}</h2>` +
    (today ? rows : BELL.map(([s], i) => {
      const x = WEEK[1][i];
      return `<div class="row"><span class="no">${i+1}교시</span><span>${x ? esc(x.c) : '공강'}</span><span class="time">${s}</span></div>`;
    }).join(''));
}

/* ⑦ 학교 지도 */
function renderSchool(){
  const gate = appById(MAIN_GATE);
  $('#rooms').innerHTML =
    SCHOOL_ROOMS.map(r => `<a class="win" href="${esc(r.url)}">${esc(r.room)}</a>`).join('') +
    (gate ? `<a class="win gate" href="${esc(gate.url)}">${esc(gate.room || gate.name)}</a>` : '');
  const d = new Date(), c = $('#clock');
  c.style.setProperty('--h', ((d.getHours()%12)*30 + d.getMinutes()*0.5) + 'deg');
  c.style.setProperty('--m', (d.getMinutes()*6) + 'deg');
}

/* ⑩ 오늘의 한마디 */
function renderQuote(){
  const q = QUOTES[Math.floor(Math.random() * QUOTES.length)];
  $('#qdate').textContent = new Date().toLocaleDateString('ko-KR', { month:'long', day:'numeric', weekday:'long' });
  $('#qtext').innerHTML = esc(q.t).replace(/\n/g, '<br>');
  $('#qwho').textContent = q.w;
  $('#qlinks').innerHTML = QUOTE_LINKS.map(a => `<a href="${esc(a.url)}">${esc(a.name)}</a>`).join('');
}

const dayNames = ['일','월','화','수','목','금','토'];

/* 관리자 버튼은 관리자 허브(/admin/)로 갑니다. 방문 기록 · 시간표 편집은 따로 된 페이지 /home-admin/ 에서 해요 (허브 [대문 관리자]). */
const goHub = () => { location.href = '/admin/'; };
$('#adminBtn').addEventListener('click', goHub);
$('#doorAdmin').addEventListener('click', goHub);
$('#gAdmin').addEventListener('click', goHub);

/* ⑪ 플래너 게임 단추: 플래너(iframe) 안의 시간 · 장면 · 색을 바꿔요 */
const pw = () => { try { const w = $('#plannerFrame').contentWindow; return w && w.setSpeed ? w : null; } catch { return null; } };   // 플래너가 아직 안 열렸거나 막히면 null
const markOn = (sel, b) => document.querySelectorAll(sel).forEach(x => x.classList.toggle('on', x === b));
document.querySelectorAll('#v-planner [data-speed]').forEach(b => b.addEventListener('click', () => {
  const w = pw(); if (!w || !w.setSpeed) return;
  if (b.dataset.speed === '1') (w.goLive ? w.goLive() : w.setSpeed(1)); else w.setSpeed(+b.dataset.speed);   // 교무실 타이쿤은 setSpeed(1) = 지금으로
  markOn('#v-planner [data-speed]', b);
}));
document.querySelectorAll('#v-planner [data-jump]').forEach(b => b.addEventListener('click', () => {
  const w = pw(); if (!w || !w.jumpTo) return;
  const [d, t] = b.dataset.jump.split(','); w.jumpTo(+d, t);
  markOn('#v-planner [data-speed]', null);   // 장면으로 옮기면 '실시간'이 아니에요 (▶ 실시간을 누르면 지금으로)
}));
document.querySelectorAll('#v-planner [data-pal]').forEach(b => b.addEventListener('click', () => {
  const w = pw(); if (!w || !w.setPal) return;
  w.setPal(b.dataset.pal); markOn('#v-planner [data-pal]', b);
  try { localStorage.setItem('moontr-pal', b.dataset.pal); } catch {}
}));
/* 지난번에 고른 색은 기억해 두었다가, 플래너를 불러오면 다시 칠해요 */
$('#plannerFrame').addEventListener('load', () => {
  let v = 'a'; try { v = localStorage.getItem('moontr-pal') || 'a'; } catch {}
  const w = pw(); if (w && w.setPal) w.setPal(v);
  markOn('#v-planner [data-pal]', document.querySelector(`#v-planner [data-pal="${v}"]`));
});
/* Firestore에 저장된 시간표가 있으면 그걸로 덮어씁니다 (없으면 위 기본값 사용) */
onSnapshot(TIMETABLE_DOC, snap => {
  if (!snap.exists()) return;
  const data = snap.data();
  if (Array.isArray(data.bell)){
    BELL.length = 0;
    BELL.push(...data.bell.map(b => [b.s, b.e]));
  }
  if (data.week){
    Object.keys(WEEK).forEach(k => delete WEEK[k]);
    Object.entries(data.week).forEach(([k, v]) => { WEEK[k] = v; });
  }
  renderTime();
}, () => {});

/* 시작: 주소 끝에 #time 처럼 붙어 있으면 그 대문, 아니면 무작위 */
renderTime(); renderSchool(); renderQuote();
setInterval(() => { renderTime(); renderSchool(); }, 30000);

/* 위쪽 게임 막대: DATE · TIME · 지금(몇 교시 · 무슨 수업) */
function renderBar(){
  const d = new Date(), day = d.getDay(), p2 = n => String(n).padStart(2, '0');
  $('#hDate').textContent = `${d.getMonth()+1}/${d.getDate()} ${dayNames[day]}`;
  $('#hTime').textContent = `${p2(d.getHours())}:${p2(d.getMinutes())}`;
  const m = d.getHours()*60 + d.getMinutes(), toM = s => { const [h, mi] = String(s).split(':').map(Number); return h*60 + mi; };
  let now = '주말';
  if (day >= 1 && day <= 5 && BELL.length){
    const i = BELL.findIndex(([s, e]) => m >= toM(s) && m < toM(e)), cell = i >= 0 ? (WEEK[day] || [])[i] : '';
    now = i >= 0 ? `${i+1}교시 ${cell && cell.c ? cell.c.replace(/(\d)학년\s*(\d+)반/, '$1-$2') : '공강'}`
      : m < toM(BELL[0][0]) ? '수업 전' : m >= toM(BELL[BELL.length-1][1]) ? '방과 후' : '쉬는 시간';
  }
  $('#hNow').textContent = now;
}
renderBar(); setInterval(renderBar, 15000);
const fixed = location.hash.slice(1);
show(VIEWS.includes(fixed) ? fixed : BOARD ? 'planner' : pickRandom());   // 📺 칠판 기기는 늘 타이쿤 대문으로
</script>
