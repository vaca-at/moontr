<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리반 생기부노트</title>
<!-- 아이콘: 마주 보는 말풍선 (탭 · 즐겨찾기 = icon.svg, 휴대폰 홈 화면 = icon-180.png) -->
<link rel="icon" href="/note10/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/note10/icon-180.png">
<meta name="theme-color" content="#ee8fad">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* 🔤 온글잎 언즈체 (눈누 웹폰트) */
@font-face{font-family:'OngleipUnz';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2406-1@1.0/Ownglyph_UNZ-Rg.woff2') format('woff2');font-weight:normal;font-display:swap;}

:root{
  --bg:#fff7f2;--card:#fff;--ink:#4b3a3a;--sub:#9b8782;--line:#f2ddd6;--soft:#fdf1ec;
  --main:#ee8fad;--mainL:#fde8ef;
  --pink:#ee8fad;--pinkL:#fde8ef;--green:#7fc59a;--greenL:#e7f6ed;--mustard:#d9a74c;--mustardL:#fbf1dd;
  --purple:#a68fd8;--purpleL:#f0eafb;--blue:#7aaedb;--blueL:#e7f1fb;--red:#e0556a;--navy:#2f3b5c;
  --hand:'OngleipUnz','Gaegu',cursive;--body:'Pretendard',system-ui,sans-serif;
}
body[data-theme=mint]{--bg:#f2faf6;--line:#d3ece0;--soft:#e9f6ef;--main:#5fb894;--mainL:#dff3e9}
body[data-theme=lavender]{--bg:#f7f4fd;--line:#e3dbf5;--soft:#efe9fb;--main:#9a83d6;--mainL:#ece5fb}
body[data-font=gaegu]{--hand:'Gaegu',cursive}
body[data-font=dodum]{--hand:'Gowun Dodum',sans-serif}
body[data-big=on]{font-size:18px}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.55}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.hand{font-family:var(--hand)}
h1,h2,h3,h4{font-family:var(--hand);font-weight:700;margin:0}

/* ---------- 헤더 ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-bottom:1.5px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--pinkL),var(--mainL));display:grid;place-items:center;font-size:22px;box-shadow:0 2px 0 var(--line)}
.tag{background:var(--main);color:#fff;border-radius:99px;padding:3px 12px;font-family:var(--hand);font-size:15px}
.title{font-family:var(--hand);font-size:24px;font-weight:700}
.title small{font-size:14px;color:var(--sub);font-weight:400;margin-left:6px}
.nav{display:flex;gap:6px;margin-left:12px;flex-wrap:wrap}
.right{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;cursor:pointer;font-family:var(--hand);font-size:16px;transition:.15s;white-space:nowrap}
.pill:hover{border-color:var(--main)}
.pill.on{background:var(--main);border-color:var(--main);color:#fff}
.pill.dash{border-style:dashed;border-color:var(--main);color:var(--main)}
.badge{font-size:12px;border-radius:99px;padding:2px 9px;background:var(--soft);color:var(--sub);border:1px dashed var(--line);font-family:var(--body)}

main{padding:18px;max-width:1500px;margin:0 auto}

/* ---------- 공통 카드 (특강 웹앱 느낌) ---------- */
.cols{display:grid;gap:16px}
.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}
.box{background:var(--card);border:1.5px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.box>.hd{padding:11px 16px;color:#fff;font-family:var(--hand);font-size:20px;display:flex;align-items:center;gap:8px}
.box>.hd .n{width:26px;height:26px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;font-size:15px}
.box>.hd .sp{margin-left:auto}
.box>.bd{padding:16px;flex:1}
.hd.pink{background:var(--pink)}.hd.green{background:var(--green)}.hd.mustard{background:var(--mustard)}.hd.purple{background:var(--purple)}.hd.blue{background:var(--blue)}
.lead{font-family:var(--hand);font-size:21px;margin:0 0 12px}
.lead mark{background:linear-gradient(transparent 55%,var(--mainL) 55%);color:inherit}
.mini{font-size:12.5px;color:var(--sub)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{margin-bottom:10px}
.field label{display:block;font-family:var(--hand);font-size:16px;margin-bottom:4px}
input[type=text],input[type=date],input[type=number],input[type=password],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--main)}
textarea{resize:vertical;min-height:80px}
.btn{border:none;border-radius:99px;padding:8px 16px;cursor:pointer;background:var(--main);color:#fff;font-family:var(--hand);font-size:17px;white-space:nowrap}
.btn:hover{filter:brightness(.96)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:4px 11px;font-size:15px}
.btn.ai{background:linear-gradient(90deg,#f19ab6,#b493e6)}
.btn:disabled{opacity:.5;cursor:wait}
.x{border:none;background:none;cursor:pointer;color:var(--sub);font-size:14px}
.x:hover{color:var(--red)}
.empty{color:var(--sub);text-align:center;padding:22px 8px;font-size:13.5px;border:1.5px dashed var(--line);border-radius:12px}
.item{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff}
.item .top{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.chip{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12.5px;background:var(--soft);border:1px solid var(--line)}
.chip.자율{background:var(--pinkL);border-color:#f6c6d6}.chip.진로{background:var(--greenL);border-color:#bfe3cc}
.chip.동아리{background:var(--mustardL);border-color:#efd7a5}.chip.행특{background:var(--purpleL);border-color:#d8cdf2}
.chip.독서{background:var(--blueL);border-color:#c5dcf2}.chip.심화탐구{background:#fff2e6;border-color:#f3d2b0}
.copybox{background:#fffdf8;border:1.5px dashed var(--mustard);border-radius:12px;padding:12px;white-space:pre-wrap;font-size:13px}
.ai-out{background:linear-gradient(180deg,#fff,#fffaf6);border:1.5px dashed var(--main);border-radius:12px;padding:12px 14px;font-size:14px}
.ai-out h4{font-size:18px;margin:8px 0 4px;color:var(--main)}
.ai-out li{margin-left:14px}

/* ---------- 달력 (좋아하는 달력 화면) ---------- */
.calwrap{background:#fdfdf8;border:1.5px solid var(--line);border-radius:8px;padding:14px 18px}
.calhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.calhead h2{font-size:28px}
.dow,.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}   /* 긴 일정 글자가 칸을 밀어내지 않게 */
.calgrid{grid-template-columns:minmax(0,2.2fr) minmax(280px,1fr)}
.dow div{text-align:center;font-family:var(--hand);font-size:15px;color:var(--navy);padding:4px 0}
.dow div:first-child{color:var(--red)}.dow div:last-child{color:#3a63c9}
.cell{min-height:112px;min-width:0;border:1.5px solid #cfe0e6;border-radius:12px;background:#fff;padding:8px 9px 22px;position:relative;cursor:pointer;transition:.12s}
.cell:hover{border-color:var(--main);transform:translateY(-1px)}
.cell.future{background:#f7f9fb}
.cell.blank{visibility:hidden}
.cell.today{border:2px solid var(--red)}
.cell.sel{box-shadow:0 0 0 3px var(--mainL)}
.dnum{font-family:var(--hand);font-weight:700;font-size:19px;color:var(--navy)}
.dnum.sun{color:var(--red)}.dnum.sat{color:#3a63c9}
.hname{font-family:var(--hand);font-size:12.5px;color:var(--red);margin-left:5px}
.ev{background:#fde9b8;border-radius:5px;font-size:11.5px;padding:2px 7px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--hand)}
.ev.cs{background:var(--pinkL)}
.dots{position:absolute;left:9px;bottom:7px;display:flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;opacity:.28}
.dots i.on{opacity:1}
.dots i.d1{background:#e59bb3}.dots i.d2{background:#8fb0e4}.dots i.d3{background:#8fcf98}
.dots{flex-wrap:wrap;right:6px;gap:3px}.dots .dmore{font-size:10px;color:#e07a9c;line-height:8px}
.calnote{font-family:var(--hand);font-size:14.5px;color:var(--ink);margin-top:10px}

/* ---------- 개인 상담 기록 레이아웃 ---------- */
.note{display:grid;grid-template-columns:250px 1fr;gap:18px;align-items:start}
.side{position:sticky;top:78px;max-height:calc(100vh - 96px);overflow:auto;padding-right:4px}
/* 스크롤 막대: 얇고 둥근 분홍 막대 (위아래 화살표 없음) */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--main);opacity:.6;border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{border-width:2px}
::-webkit-scrollbar-button{display:none;width:0;height:0}
::-webkit-scrollbar-corner{background:transparent}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:var(--main) transparent}}
.side h3{font-size:19px;display:flex;align-items:center;margin-bottom:8px}
.sitem{display:flex;gap:10px;align-items:center;padding:9px 10px;margin-bottom:6px;cursor:pointer;background:#fff;border-radius:4px;clip-path:polygon(0 0,94% 0,100% 50%,94% 100%,0 100%);transition:.12s}
.sitem:hover{background:var(--soft)}
.sitem .num{width:30px;height:30px;border-radius:50%;border:2px solid var(--main);display:grid;place-items:center;font-size:17px;flex:none;background:#fff}
.sitem b{font-family:var(--hand);font-size:17px;font-weight:700;display:block;line-height:1.1}
.sitem span{font-size:11.5px;color:var(--sub)}
.sitem.on{background:var(--main);color:#fff}
.sitem.on span{color:#fff}
.sitem.on .num{border-color:#fff}
.sitem.on .warn{background:#fff;color:var(--red)}
.sitem .warn{margin-left:auto;font-size:11px;background:#fff0f2;color:var(--red);border-radius:99px;padding:0 6px}

.stitle{display:flex;align-items:baseline;gap:12px;margin:2px 0 12px;flex-wrap:wrap}
.stitle .big{font-family:var(--hand);font-size:44px;color:var(--main);line-height:1}
.stitle h2{font-size:28px}
.secbar{height:4px;border-radius:4px;background:var(--line);margin-bottom:14px;overflow:hidden}
.secbar i{display:block;height:100%;background:var(--main);transition:.3s}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.step{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:99px;background:#fff;padding:5px 14px 5px 6px;cursor:pointer}
.step .c{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--hand);font-size:15px}
.step b{font-family:var(--hand);font-size:16px;font-weight:700}
.step.on{background:var(--main);border-color:var(--main);color:#fff}
.step.on .c{background:#fff!important;color:var(--main)}

/* ---------- 문장 담벼락 ---------- */
.wallgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.post{border-radius:4px 4px 14px 4px;padding:12px 12px 10px;box-shadow:0 3px 0 rgba(0,0,0,.05);position:relative;font-size:13.5px;display:flex;flex-direction:column;gap:8px;border:1.5px solid transparent}
.post.자율{background:#ffeef4}.post.진로{background:#eaf8ef}.post.동아리{background:#fff4dc}.post.행특{background:#f2edfd}
.post.picked{border-color:var(--main);box-shadow:0 0 0 3px var(--mainL)}
.post .pin{position:absolute;top:-7px;left:50%;transform:translateX(-50%);font-size:15px}
.post .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.post .acts{display:flex;gap:6px;align-items:center;margin-top:auto}
.post textarea{min-height:90px;font-size:13px}
.post select{width:auto;padding:2px 6px;font-size:12px;border-radius:8px}
.basket{border:1.5px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px;background:#fff}
.basket h4{font-size:18px;display:flex;align-items:center;gap:6px;margin-bottom:6px}
.bitem{display:flex;gap:6px;font-size:12.5px;padding:6px 8px;border-radius:8px;background:var(--soft);margin-bottom:5px;align-items:flex-start}
.bitem div{flex:1}
.meter{height:7px;border-radius:7px;background:var(--line);overflow:hidden;margin:6px 0 2px}
.meter i{display:block;height:100%;background:var(--green)}
.meter i.over{background:var(--red)}

/* ---------- 우리반 한눈에 ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 16px}
.stat b{font-family:var(--hand);font-size:32px;color:var(--main);display:block;line-height:1.1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.scard{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;transition:.12s}
.scard:hover{border-color:var(--main);transform:translateY(-2px)}
.scard .face{font-size:30px;width:50px;height:50px;border-radius:14px;display:grid;place-items:center;background:var(--soft)}
.scard h4{font-size:20px}
.adots{display:flex;gap:4px;margin-top:8px}
.adots span{font-size:11px;border-radius:99px;padding:0 7px;border:1px solid var(--line);color:var(--sub)}
.adots span.ok{background:var(--greenL);color:#3d8a5a;border-color:#bfe3cc}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px}
.bar .t{width:90px;font-family:var(--hand);font-size:15px}
.bar .g{flex:1;height:14px;background:var(--soft);border-radius:8px;overflow:hidden}
.bar .g i{display:block;height:100%;background:var(--main);border-radius:8px}

/* ---------- 모달·토스트 ---------- */
.modal{position:fixed;inset:0;background:rgba(70,50,50,.28);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 14px;overflow:auto}
.modal.on{display:flex}
.sheet{background:#fff;border-radius:18px;max-width:720px;width:100%;border:1.5px solid var(--line);overflow:hidden}
.sheet.wide{max-width:1040px}
.sheet.wide.xwide{max-width:1400px}
.dtable{width:100%;font-size:13.5px;border-collapse:collapse}
.dtable th{text-align:left;font-weight:600;color:var(--sub);padding:4px;border-bottom:1.5px solid var(--line)}
.dtable td{padding:3px 4px}
.dtable input{padding:5px 7px}
.dtable td{white-space:pre-wrap;vertical-align:top}
.rep{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff}
.rep th,.rep td{border:1px solid #6b5a5a;padding:7px 9px;vertical-align:middle}
.rep th{background:var(--soft);font-weight:600}
.rep .hope{border-bottom:1px dashed #9b8782;padding-bottom:4px;margin-bottom:4px}
/* 📷 사진 갤러리: 가로로 넘겨 보기 */
.gal{display:flex;gap:16px;justify-content:center}   /* 세 장은 늘 한 줄, 좁으면 작아져요 */
.gal-all{flex-wrap:wrap}
.gal figure{flex:0 1 300px;min-width:0;margin:0;cursor:pointer;background:#fff;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;transition:.12s}
.gal figure:hover{transform:translateY(-2px);border-color:var(--main)}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.gal-all figure{flex-basis:220px}
.box>.hd .sp .btn{font-family:var(--hand)}
.gal figcaption{padding:6px 10px;display:flex;gap:6px;align-items:baseline;font-size:13px}
.gal figcaption b{flex:1;font-family:var(--hand);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gal figcaption span{color:var(--sub);font-size:12px}
.repwrap{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:#fffdfb}
.sheet>.hd{background:var(--main);color:#fff;padding:12px 18px;font-family:var(--hand);font-size:22px;display:flex}
.sheet>.bd{padding:18px}
.sheet section{border:1.5px dashed var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.sheet section h4{font-size:19px;margin-bottom:8px}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emojis button{font-size:22px;width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer}
.emojis button.on{border-color:var(--main);background:var(--mainL)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;transition:.25s;z-index:60;opacity:0}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}
.spin{display:inline-block;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
footer{text-align:center;color:var(--sub);font-size:12px;padding:20px}

@media(max-width:1100px){.c3,.c4{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.calgrid{grid-template-columns:minmax(0,1fr)}}
@media(max-width:820px){.note{grid-template-columns:1fr}.side{position:static;max-height:none}.c2,.c3,.c4{grid-template-columns:1fr}.cell{min-height:70px;padding:5px 5px 18px}.ev{font-size:10px;padding:1px 4px}.dnum{font-size:15px}.hname{display:none}.cal,.dow{gap:4px}main{padding:12px}}
</style>
</head>
<body data-theme="peach" data-font="unz">

<header>
  <div class="logo">🫶</div>
  <!-- 반 이름 · 앱 이름을 누르면 홈(📅 달력)으로 -->
  <span class="tag" id="classTag" style="cursor:pointer" title="홈으로" onclick="go('cal')">1학년 10반</span>
  <div class="title" style="cursor:pointer" title="홈으로" onclick="go('cal')">우리반 생기부노트 <small>상담 · 성장 · 생기부</small></div>
  <nav class="nav" id="nav"></nav>
  <div class="right">
    <span class="badge" id="syncBadge">🔒 로그인 전</span>
    <button class="pill dash" id="adminBtn" style="display:none" onclick="openDash()">🛠 관리</button>
    <button class="pill dash" id="clubBtn" style="display:none" onclick="openClub()">🎨 동아리 업무</button>
    <span class="badge">🔒 이름 없음</span>
    <button class="pill" onclick="cycleTheme()">🎨 꾸미기</button>
    <button class="pill" onclick="cycleFont()">🔤 글꼴</button>
    <button class="pill" onclick="toggleBig()">🔍 크게</button>
    <button class="pill" onclick="openSettings()">⚙️ 설정</button>
  </div>
</header>

<main id="app"></main>
<footer>우리반 생기부노트 · 학생 이름·연락처는 저장하지 않아요 · 동물 친구 별칭과 번호로만 기록해요
  <div style="margin-top:6px"><a href="#" onclick="openTerms();return false" style="color:var(--sub)">이용약관</a> · <a href="#" onclick="openPrivacy();return false" style="color:var(--sub);font-weight:700">개인정보처리방침</a></div></footer>

<div class="modal" id="modal"><div class="sheet"><div class="hd"><span id="mTitle"></span><button class="x" style="margin-left:auto;color:#fff;font-size:20px" onclick="closeModal()">✕</button></div><div class="bd" id="mBody"></div></div></div>
<div id="toast"></div>

<script>
/* =========================================================
   우리반 생기부노트 - index.html 한 파일
   · 학생은 동물 친구(이모지+별칭+번호)로만 구분 → 이름 저장 안 함

  // 바구니가 자율·자치 · 진로 · 행발 셋이 되면서, 예전 동아리 문구는 자율·자치로 옮겨요 (예전 동아리 단락 final.동아리 는 지우지 않고 둬요)

function sortStudents() {
  const tn = s => { const n = parseInt(s.tag, 10); return isNaN(n) ? 1e9 : n; };
  const nk = (a, b) => (a.nick || '').localeCompare(b.nick || '', 'ko');
  const by = S.sortBy === 'tag' ? (a, b) => tn(a) - tn(b) || nk(a, b) : (a, b) => nk(a, b) || tn(a) - tn(b);
  // 테스트 친구(28번 · 가상의 학생)는 어떤 순서든 맨 위 → 화면을 처음 열면 실제 학생 기록 대신 테스트 친구가 보여요
  const pin = s => s.num === 28 || /테스트/.test(s.nick || '') ? 0 : 1;
  D.students.sort((a, b) => pin(a) - pin(b) || by(a, b) || a.created.localeCompare(b.created));
}

/* ---------------- 개인정보 지킴이 ---------------- */
function piiCheck(t) {
  const w = [];
  if (/\b\d{5}\b/.test(t)) w.push('학번처럼 보이는 다섯 자리 숫자');
  if (/01[016789][-\s.]?\d{3,4}[-\s.]?\d{4}/.test(t)) w.push('전화번호');
  if (/[\w.-]+@[\w.-]+\.\w+/.test(t)) w.push('이메일 주소');
  if (/\d{6}[-\s]?[1-4]\d{6}/.test(t)) w.push('주민등록번호');
  return w;
}
function piiOk(t) {
  const w = piiCheck(t);
  if (!w.length) return true;
  return confirm('🔒 개인정보처럼 보이는 내용이 있어요: ' + w.join(', ') + '\n\n지우고 다시 쓰는 걸 권해요. 그래도 저장할까요?');
}

const SYS_RULES = `너는 대한민국 고등학교 담임교사의 학교생활기록부 작성을 돕는 조력자다.
지켜야 할 규칙:
- 학생 이름, 학번, 연락처 등 개인 식별 정보를 절대 쓰지 않는다. 주어는 생략하거나 '이 학생'으로만 쓴다.
- 교사가 준 관찰 내용에 있는 사실만 근거로 쓴다. 없는 활동·수치·결과를 지어내지 않는다.
- 학교생활기록부 기재요령을 따른다: 교외 수상, 공인어학시험, 부모의 직업·사회경제적 지위, 사교육, 특정 대학명, 논문 등재 등은 쓰지 않는다.
- 생기부 문체: 명사형 종결(~함, ~임, ~보임, ~함을 보여 줌)로 쓰고, 구체적 행동(관찰 사실)과 거기서 드러나는 특성·성장을 함께 담는다.
- 따뜻하지만 과장하지 않는 담백한 문장으로 쓴다.`;

// user: 글만 보낼 때는 문자열, 사진도 보낼 때는 { text, images: [{ mime, data(base64) }] }
async function callAI(system, user, maxTokens = 1800) {
  if (!S.apiKey) { openSettings(); throw new Error('설정에서 AI 키를 먼저 넣어 주세요'); }
  const text = typeof user === 'string' ? user : user.text;
  const imgs = typeof user === 'string' ? [] : (user.images || []);
  if (S.provider === 'claude') {
    const content = imgs.length ? [...imgs.map(m => ({ type: 'image', source: { type: 'base64', media_type: m.mime, data: m.data } })), { type: 'text', text }] : text;
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-api-key': S.apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: S.model || 'claude-sonnet-5-5', max_tokens: maxTokens, system, messages: [{ role: 'user', content }] })
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error?.message || ('오류 ' + r.status));
    return (j.content || []).map(c => c.text || '').join('');
  } else {
    // 기본은 gemini-3.8-flash. 설정에 예전 모델(gemini-1.x · 2.x)이 남아 있으면 막히니 기본으로 바꿔 써요
    const m = !S.model || /^gemini-[12]\./.test(S.model) ? 'gemini-3.8-flash' : S.model;
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:generateContent?key=${encodeURIComponent(S.apiKey)}`, {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ systemInstruction: { parts: [{ text: system }] }, contents: [{ role: 'user', parts: [...imgs.map(m => ({ inline_data: { mime_type: m.mime, data: m.data } })), { text }] }], generationConfig: { maxOutputTokens: maxTokens * 2 } })
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error?.message || ('오류 ' + r.status));
    return j.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || '';
  }
}
function studentContext(st, brief = true) {
  const lines = [`희망 진로 분야: ${st.career || '미정'} ${st.careerDetail ? '(' + st.careerDetail + ')' : ''}`];
  if (subjText(st)) lines.push('선택과목: ' + subjText(st));

  }
  return lines.join('\n');
}

// 일화·상담·활동 → 생기부 문구 여러 개
async function genSentences(st, text, source, btn) {
  if (!text.trim()) return toast('내용을 먼저 적어 주세요');
  if (!piiOk(text)) return;
  await withBusy(btn, async () => {
    const out = await callAI(SYS_RULES + `
출력 형식: 반드시 JSON 배열만 출력한다. 다른 말은 쓰지 않는다.
[{"area":"자율|진로|행특 중 하나","trait":"드러나는 특성 2~6글자","text":"생기부 문구"}]
- 관찰 내용에서 드러나는 특성마다 하나씩, 3~5개를 만든다.
- 각 text는 1~2문장, 한글 80~170자.
- area는 내용에 가장 잘 맞는 영역: 학급·학교 공동체 · 자치 활동은 자율(자율·자치활동), 진로 탐색·심화 탐구·진로 독서는 진로, 인성·태도·관계·성장(동아리 속 모습 포함)은 행특(행동특성 및 종합의견).`,
      `[학생 맥락]\n${studentContext(st)}\n\n[관찰 내용 - ${source}]\n${text}`);
    const arr = parseJSONArray(out);
    if (!arr.length) throw new Error('문구를 읽지 못했어요. 다시 눌러 주세요');
    arr.forEach(a => st.sentences.push({
      id: uid(), text: String(a.text || '').trim(), area: AREAS.some(x => x.k === a.area) ? a.area : '행특',
      trait: String(a.trait || '').slice(0, 10), source, picked: false, pickedAt: 0, date: today()
    }));
    saveStudent(st);
    toast(`✨ 문구 ${arr.length}개가 담벼락에 붙었어요`);
    render();
  });
}
function parseJSONArray(t) {
  try { const a = t.indexOf('['), b = t.lastIndexOf(']'); return JSON.parse(t.slice(a, b + 1)) || []; } catch (e) { return []; }
}
function parseJSONObj(t) {
  try { const a = t.indexOf('{'), b = t.lastIndexOf('}'); return JSON.parse(t.slice(a, b + 1)); } catch (e) { return null; }
}

function clearNext(sid, cid) {
  const st = D.students.find(s => s.id === sid), c = st && st.counsels.find(x => x.id === cid);
  if (!c || !confirm('이 상담 예정을 지울까요? (상담 기록은 그대로 남아요)')) return;
  c.next = ''; saveStudent(st); render(); toast('📅 상담 예정을 지웠어요');

// 글 맨 앞에 적힌 날짜 ('10/8(목) …', '10월 15일 …') 가 상담 날짜보다 앞이면 그 날짜 (지난 상담을 오늘 옮겨 적은 경우)
function textDate(text, ref) {
  const m = String(text || '').match(/^\s*[\[(]?\s*(\d{1,2})\s*(?:\/|\.|월)\s*(\d{1,2})\s*일?/);
  if (!m || !ref) return null;
  const mo = +m[1], dy = +m[2]; if (mo < 1 || mo > 12 || dy < 1 || dy > 31) return null;
  const d = `${ref.slice(0, 4)}-${String(mo).padStart(2, '0')}-${String(dy).padStart(2, '0')}`;
  return d < ref ? d : null;
}
// 이미 저장한 상담 중 글 맨 앞 날짜가 더 이른 것은 그 날짜로 고쳐 저장해요 (클라우드에서 불러온 뒤 한 번)
function fixCounselDates() {
  D.students.forEach(st => {
    let ch = false;
    st.counsels.forEach(c => { const t = textDate(c.text, c.date); if (t) { c.date = t; ch = true; } });
    if (ch) saveStudent(st);
  });
}

function setCsDate(id, v) {

function askTextDate(text, date) {

  return t && confirm(`글 맨 앞에 ${t.slice(5).replace('-', '/')} 날짜가 있어요.\n상담한 날짜를 ${t}(으)로 저장할까요?\n(취소하면 ${date}로 저장해요)`) ? t : date;
}
function dayData(ds) {
  const ev = D.events.filter(e => e.date === ds);
  const cs = [], act = [], next = [];
  D.students.forEach(st => {
    st.counsels.forEach(c => { if (c.date === ds) cs.push({ st, c }); if (c.next === ds) next.push({ st, c }); });
    st.episodes.forEach(e => { if (e.date === ds) act.push({ st, t: '일화', x: e.text }); });
    st.acts.forEach(a => { if (a.date === ds) act.push({ st, t: a.area, x: a.title || a.text }); });
  });
  return { ev, cs, act, next };
}

        ${dd.cs.map(x => `<div class="item" style="cursor:pointer" onclick="openStudent('${x.st.id}',2)"><div class="top"><span class="chip 자율">${esc(x.c.type)}</span><b class="hand" style="font-size:16px">${esc(sname(x.st))}</b></div><div class="mini">${esc(x.c.text.slice(0, 70))}${x.c.text.length > 70 ? '…' : ''}</div></div>`).join('')}
        ${dd.act.map(x => `<div class="item"><div class="top"><span class="chip ${esc(x.t)}">${esc(x.t)}</span><b class="hand" style="font-size:16px">${esc(sname(x.st))}</b></div><div class="mini">${esc(String(x.x).slice(0, 60))}</div></div>`).join('')}
        </div></details>`;
      })()}
      ${!dd.ev.length && !dd.cs.length && !dd.act.length && !dd.next.length ? '<div class="empty">이날은 아직 기록이 없어요 🌱</div>' : ''}
      <hr style="border:none;border-top:1.5px dashed var(--line);margin:14px 0">
      <div class="field"><label>💬 이날 상담 바로 기록</label>
        ${D.students.length ? `<select id="qSt">${opts}</select>
        <select id="qType" style="margin-top:6px">${CS_TYPES.map(t => `<option>${t}</option>`).join('')}</select>
        <textarea id="qText" style="margin-top:6px" placeholder="오늘 나눈 이야기를 편하게 적어요"></textarea>
        <div class="row" style="margin-top:6px"><span class="mini">다음 상담</span><input type="date" id="qNext" style="width:auto"><button class="btn sm" style="margin-left:auto" onclick="quickCounsel()">저장</button></div>`
        : '<div class="empty">개인 상담 기록에서 동물 친구를 먼저 추가해 주세요</div>'}
      </div>
    </div></div>`;
}
function pickDay(ds) { V.sel = ds; render(); }
function moveMonth(k) {
  if (k === 0) { const n = new Date(); V.y = n.getFullYear(); V.m = n.getMonth(); V.sel = today(); }
  else { V.m += k; if (V.m < 0) { V.m = 11; V.y--; } if (V.m > 11) { V.m = 0; V.y++; } }
  render();
}
function addEvent() {
  const t = $('#evTitle').value.trim(); if (!t) return;
  if (!piiOk(t)) return;
  D.events.push({ id: uid(), date: V.sel, title: t }); saveEvents(); render();
}
function delEvent(id) { D.events = D.events.filter(e => e.id !== id); saveEvents(); render(); }
// 같은 날 일정끼리 위아래 바꾸기 (달력 칸에 보이는 순서도 같이 바뀌어요)
function moveEvent(id, dir) {
  const e = D.events.find(x => x.id === id); if (!e) return;
  const same = D.events.filter(x => x.date === e.date), o = same[same.indexOf(e) + dir]; if (!o) return;
  const a = D.events.indexOf(e), b = D.events.indexOf(o);
  [D.events[a], D.events[b]] = [D.events[b], D.events[a]];
  saveEvents(); render();
}
function quickCounsel() {
  const st = D.students.find(s => s.id === $('#qSt').value); const text = $('#qText').value.trim();
  if (!st || !text) return toast('내용을 적어 주세요');
  if (!piiOk(text)) return;
  st.counsels.push({ id: uid(), date: askTextDate(text, V.sel), type: $('#qType').value, text, next: $('#qNext').value || '' });
  saveStudent(st); toast('💬 상담이 기록됐어요'); render();
}

/* ===== 2. 우리반 — 상담 현황 · 성적 · 출결 · 생기부 진행 ===== */
function lastCounsel(st) { return st.counsels.map(c => c.date).sort().pop() || ''; }
const CLASS_TABS = [['cs', '💬 상담 현황'], ['ev', '🗓️ 공통 행사'], ['score', '📊 성적'], ['att', '📋 출결'], ['rec', '✍️ 생기부 진행']];
function viewClass() {
  const t = V.csub || 'cs';
  return `<div class="row" style="margin-bottom:14px">${CLASS_TABS.map(([k, l]) => `<button class="pill ${t === k ? 'on' : ''}" style="font-size:18px;padding:7px 18px" onclick="V.csub='${k}';render()">${l}</button>`).join('')}</div>
  ${t === 'ev' ? viewClassEv() : t === 'score' ? viewClassScore() : t === 'att' ? viewClassAtt() : t === 'rec' ? viewClassRec() : viewClassCs()}`;
}
// 반 번호로 동물 친구 찾기 (친구가 없으면 '7번'처럼 — 선생님만 보는 화면)
const byNum = no => D.students.find(s => s.num === no);
const whoCell = (no, sec = 1) => { const s = byNum(no); return s ? `<a href="#" onclick="openStudent('${s.id}',${sec});return false" style="white-space:nowrap">${esc(sname(s))}</a>` : `<span class="mini">${no}번 (동물 없음)</span>`; };
const emptyGo = (msg, tab, rec) => `<div class="empty">${msg}<br><button class="btn sm" style="margin-top:10px" onclick="${rec ? `DASH.rec='${rec}';` : ''}openDash('${tab}')">🛠 관리에서 넣기</button></div>`;
// 등급 칸 색 (좋을수록 진하게)
function gradeCell(v, max) {
  if (v === undefined || v === null || v === '') return '<td class="mini">-</td>';
  const k = 1 - (v - 1) / (max - 1);
  return `<td style="text-align:center;font-weight:700;background:rgba(238,143,173,${(0.08 + k * 0.45).toFixed(2)})">${v}</td>`;
}

/* 📊 성적: 시험 하나를 골라 과목별 평균 · 등급 분포 · 친구별 표 */
function classScoreSources() {
  return [
    ...scoreDocs().map(d => ({ key: 'sc:' + scoreKey(d.year, d.exam), label: `${d.year} ${examOf(d).label}`, d, kind: examOf(d).kind })),
    ...gyogwaDocs().map(d => ({ key: 'gy:' + gyogwaKey(d.year, d.sem), label: `${d.year} ${d.sem}학기 교과 (나이스)`, d, kind: 'school' })),
  ];
}
function classGrades(src) {
  const max = src.kind === 'mock' ? 9 : 5, d = src.d, rows = {};
  let subj = [], sch = null;
  if (src.key.startsWith('sc:')) {
    const gc = gradeCols(d, max); subj = gc.map(c => c.subj);
    // 전교생 성적표면 우리반 줄만 (다른 반은 no 가 비어 있어요) + 과목별 전교 평균
    d.rows.forEach(r => { if (!r.no) return; const o = rows[r.no] = {}; gc.forEach(c => { const v = Number(r.v[c.i]); if (r.v[c.i] !== '' && !isNaN(v)) o[c.subj] = v; }); });
    if (isWhole(d)) { sch = {}; gc.forEach(c => { const vs = d.rows.map(r => r.v[c.i]).filter(v => v !== '' && !isNaN(+v)).map(Number); if (vs.length) sch[c.subj] = vs.reduce((a, b) => a + b, 0) / vs.length; }); }
  } else {
    const iS = d.cols.indexOf('과목'), iG = d.cols.findIndex(c => /석차/.test(c));
    d.rows.forEach(r => { const v = Number(r.v[iG]); if (iG < 0 || r.v[iG] === '' || isNaN(v)) return; (rows[r.no] = rows[r.no] || {})[r.v[iS]] = v; if (!subj.includes(r.v[iS])) subj.push(r.v[iS]); });
  }
  return { max, subj, rows, sch };
}
function viewClassScore() {
  const srcs = classScoreSources();
  if (!srcs.length) return emptyGo('아직 올린 성적이 없어요. 관리 > 성적 파일이나 생기부 자료 > 교과학습발달상황에서 넣어 주세요 📊', 'score');
  const src = srcs.find(s => s.key === V.cScore) || srcs[srcs.length - 1];
  const { max, subj, rows, sch } = classGrades(src);
  const avg = a => a.length ? (a.reduce((x, y) => x + y, 0) / a.length) : null;
  const nos = Object.keys(rows).map(Number).map(no => ({ no, a: avg(Object.values(rows[no])) })).sort((x, y) => (x.a ?? 99) - (y.a ?? 99));
  const stat = subj.map(s => { const vs = nos.map(n => rows[n.no][s]).filter(v => v !== undefined); const c = Array(max + 1).fill(0); vs.forEach(v => c[Math.round(v)]++); return { s, a: avg(vs), n: vs.length, c }; });
  const cmax = Math.max(1, ...stat.flatMap(x => x.c));
  return `<div class="row" style="margin-bottom:12px">${srcs.map(s => `<button class="pill ${s.key === src.key ? 'on' : ''}" style="font-size:14px;padding:4px 12px" onclick="V.cScore='${s.key}';render()">${esc(s.label)}</button>`).join('')}</div>
  <div class="cols" style="grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)">
    <div class="box"><div class="hd blue"><span class="n">1</span>과목별 평균 · 등급 분포 <span class="sp mini" style="color:#fff">${max}등급${max === 5 ? '제' : ''}</span></div><div class="bd" style="overflow:auto">
      <table class="dtable"><tr><th>과목</th><th>평균</th>${sch ? '<th>전교</th>' : ''}${Array.from({ length: max }, (_, i) => `<th style="text-align:center">${i + 1}</th>`).join('')}</tr>
      ${stat.map(x => `<tr><td><b>${esc(x.s)}</b></td><td><b>${x.a ? x.a.toFixed(2) : '-'}</b></td>${sch ? `<td class="mini">${sch[x.s] ? sch[x.s].toFixed(2) : '-'}</td>` : ''}${x.c.slice(1).map(n => `<td style="text-align:center;background:rgba(122,174,219,${(n / cmax * 0.6).toFixed(2)})">${n || ''}</td>`).join('')}</tr>`).join('')}</table>
      <p class="mini">칸 숫자 = 그 등급을 받은 친구 수</p>
    </div></div>
    <div class="box"><div class="hd pink"><span class="n">2</span>친구별 등급 <span class="sp mini" style="color:#fff">평균 좋은 순 · 이름을 누르면 개인 상담 기록</span></div><div class="bd" style="overflow:auto">
      <table class="dtable"><tr><th>친구</th>${subj.map(s => `<th style="text-align:center">${esc(s)}</th>`).join('')}<th style="text-align:center">평균</th></tr>
      ${nos.map(n => `<tr><td>${whoCell(n.no, 3)}</td>${subj.map(s => gradeCell(rows[n.no][s], max)).join('')}<td style="text-align:center"><b>${n.a ? n.a.toFixed(2) : '-'}</b></td></tr>`).join('')}</table>
    </div></div>
  </div>`;
}

/* 📋 출결: 결석 · 지각 · 조퇴 · 결과 합계, 많은 친구부터 */
function viewClassAtt() {
  const docs = Object.values(RC).filter(d => d.kind === 'att').sort((a, b) => b.year - a.year);
  if (!docs.length) return emptyGo('아직 넣은 출결이 없어요. 나이스 출결상황 표를 복사해 넣어 주세요 📋', 'rec', 'att');
  const d = docs.find(x => x.year === V.cAttY) || docs[0];
  const G = ['결석', '지각', '조퇴', '결과'];
  const idx = g => d.cols.map((c, i) => c.replace(/\s/g, '').startsWith(g) ? i : -1).filter(i => i >= 0);
  const iDays = d.cols.findIndex(c => /수업일수/.test(c)), iNote = d.cols.findIndex(c => /특기/.test(c));
  const iUn = d.cols.map((c, i) => /미인정/.test(c) ? i : -1).filter(i => i >= 0);
  const num = v => Number(v) || 0;
  const rows = d.rows.map(r => {
    const g = G.map(x => idx(x).reduce((n, i) => n + num(r.v[i]), 0));
    return { no: r.no, g, un: iUn.reduce((n, i) => n + num(r.v[i]), 0), sum: g.reduce((a, b) => a + b, 0), days: iDays >= 0 ? r.v[iDays] : '', note: iNote >= 0 ? r.v[iNote] : '',
      detail: d.cols.map((c, i) => i !== iDays && i !== iNote && num(r.v[i]) ? `${c} ${r.v[i]}` : '').filter(Boolean).join(' · ') };
  }).sort((a, b) => b.sum - a.sum || a.no - b.no);
  const perfect = rows.filter(r => !r.sum).length;
  return `${docs.length > 1 ? `<div class="row" style="margin-bottom:12px">${docs.map(x => `<button class="pill ${x === d ? 'on' : ''}" onclick="V.cAttY=${x.year};render()">${x.year}학년도</button>`).join('')}</div>` : ''}
  <div class="stats">
    <div class="stat"><b>${perfect}</b>개근 (모두 0)</div>
    <div class="stat"><b>${rows.filter(r => r.g[0]).length}</b>결석 있는 친구</div>
    <div class="stat"><b>${rows.filter(r => r.g[1]).length}</b>지각 있는 친구</div>
    <div class="stat"><b style="color:var(--red)">${rows.reduce((n, r) => n + r.un, 0)}</b>미인정 합계</div>
  </div>
  <div class="box"><div class="hd green"><span class="n">✿</span>${d.year}학년도 출결 <span class="sp mini" style="color:#fff">${new Date(d.at).toLocaleDateString()} 넣음 · 많은 친구부터</span></div><div class="bd" style="overflow:auto">
    <table class="dtable"><tr><th>친구</th><th>수업일수</th>${G.map(g => `<th style="text-align:center">${g}</th>`).join('')}<th style="text-align:center">미인정</th><th>자세히</th><th>특기사항</th></tr>
    ${rows.map(r => `<tr style="${r.sum ? '' : 'opacity:.55'}"><td>${whoCell(r.no)}</td><td>${esc(r.days)}</td>${r.g.map(n => `<td style="text-align:center;${n ? 'font-weight:700;color:var(--red)' : ''}">${n}</td>`).join('')}<td style="text-align:center;${r.un ? 'font-weight:700;color:var(--red)' : ''}">${r.un}</td><td class="mini">${esc(r.detail)}</td><td class="mini">${esc(r.note)}</td></tr>`).join('')}</table>
  </div></div>`;
}

/* ✍️ 생기부 진행: 나이스에 들어간 창체 · 행발 · 세특 + 이 앱에서 정리한 단락 */
function viewClassRec() {
  const ys = [...new Set(Object.values(RC).filter(d => !['att', 'vol', 'sel'].includes(d.kind)).map(d => d.year))].sort((a, b) => b - a);
  const y = ys.includes(V.cRecY) ? V.cRecY : ys[0] || new Date().getFullYear();
  const sd = setukDocs(y);
  const L = D.students.filter(s => s.num).sort((a, b) => a.num - b.num);
  const AR = ['자율·자치활동', '동아리활동', '진로활동'];
  const cell = t => t === null ? '<td class="mini" style="text-align:center">-</td>' : t ? `<td style="text-align:center;color:#3d8a5a">✓ <span class="mini">${nbytes(t)}B</span></td>` : '<td style="text-align:center;color:var(--red)">빈칸</td>';
  const rows = L.map(s => {
    const ch = changRows(s.num, y), get = l => { const r = ch.find(x => x.label === l); return r ? r.text : (RC[recKey(y, RECORDS.find(x => x.label === l).id)] ? '' : null); };
    const sf = sd.map(d => d.rows.find(r => r.no === s.num)).filter(Boolean);
    return { s, a: AR.map(get), h: haengText(s.num, y), sf: [sf.filter(r => r.text).length, sf.length], fin: AREAS.filter(a => s.final[a.k]).length, sent: s.sentences.length };
  });
  const filled = i => rows.filter(r => r.a[i]).length, hf = rows.filter(r => r.h).length;
  return `${ys.length > 1 ? `<div class="row" style="margin-bottom:12px">${ys.map(x => `<button class="pill ${x === y ? 'on' : ''}" onclick="V.cRecY=${x};render()">${x}학년도</button>`).join('')}</div>` : ''}
  <div class="stats">${AR.map((l, i) => `<div class="stat"><b>${filled(i)}<span class="mini">/${L.length}</span></b>${l} 나이스 입력</div>`).join('')}<div class="stat"><b>${hf}<span class="mini">/${L.length}</span></b>행발 나이스 입력</div></div>
  <div class="box"><div class="hd purple"><span class="n">✿</span>${y}학년도 친구별 진행 <span class="sp mini" style="color:#fff">- = 아직 안 넣은 자료 · 빈칸 = 나이스에 비어 있음</span></div><div class="bd" style="overflow:auto">
    ${L.length ? `<table class="dtable"><tr><th>친구</th>${AR.map(l => `<th style="text-align:center">${l.replace('활동', '')}</th>`).join('')}<th style="text-align:center">행발</th><th style="text-align:center">과목 세특</th><th style="text-align:center">앱에서 정리한 단락</th><th style="text-align:center">담벼락 문구</th></tr>
    ${rows.map(r => `<tr><td><a href="#" onclick="openStudent('${r.s.id}',7);return false" style="white-space:nowrap">${esc(sname(r.s))}</a></td>${r.a.map(cell).join('')}${cell(r.h)}
      <td style="text-align:center">${r.sf[1] ? `${r.sf[0]}/${r.sf[1]}` : '-'}</td><td style="text-align:center">${r.fin}/${AREAS.length}</td><td style="text-align:center">${r.sent}</td></tr>`).join('')}</table>`
      : '<div class="empty">반 번호가 있는 동물 친구가 없어요. 개인 상담 기록 ✏️에서 반 번호를 넣어 주세요</div>'}
    ${ys.length ? '' : emptyGo('아직 넣은 생기부 자료가 없어요 ✍️', 'rec', 'jayul')}
  </div></div>`;
}

/* 💬 상담 현황 (예전 '우리반 한눈에') */

  return `
  ${viewWeekly()}

    <div>${L.length ? `<div class="cards">${sorted.map(s => {
      const l = lastCounsel(s), dA = l ? daysAgo(l) : null;
      return `<div class="scard" onclick="openStudent('${s.id}',1)">
        <div class="row"><div class="face">${s.emoji}</div><div><h4>${esc(nname(s))}</h4><span class="chip">${esc(s.career || '진로 미정')}</span></div></div>
        <div class="mini" style="margin-top:8px">💬 ${l ? `마지막 상담 <b style="color:${dA > 30 ? 'var(--red)' : 'var(--ink)'}">${dA}일 전</b>` : '<b style="color:var(--red)">아직 상담 전</b>'} · 상담 ${s.counsels.length}회</div>

// 교과군 · 머리글 (과목이 아니라 건너뛰어요). '한문' · '정보'처럼 과목 이름이기도 한 것은 '제2외국어/한문'처럼 붙은 꼴만 건너뛰어요
const SUBJ_SKIP = ['사회(역사/도덕포함)', '제2외국어/한문', '기술·가정/정보', '기술∙가정/정보', '기술·가정/정보/제2외국어/한문/교양', '체육·예술', '예술(음악/미술)', '생활·교양', '제2외국어', '교과군', '과목', '학점', '단위', '국어', '수학', '영어', '사회', '과학', '한국사', '체육', '예술', '교양'];
// 띄어쓰기 · 줄바꿈을 모두 지운 글에서 사전 과목을 앞에서부터 가장 긴 것으로 찾아요
// 가운데 점은 문서마다 다른 글자(·ㆍ･∙•‧・)라 하나로 맞추고, '기술·가정/정보' 교과군은 점이 빠져도 알아봐요
// '기술·가정'은 과목, '기술·가정/정보'(빗금 + 정보)는 교과군
const dotFix = t => t.replace(/[·ㆍ･∙•‧・⋅∘◦˙・]/g, '·').replace(/기술[^가-힣\/]?가정/g, '기술·가정').replace(/기술·가정\s*\/\s*정\s*보/g, '기술·가정/정보');
// strict = 사전에 있는 과목만 (학기 글자 앞쪽 글에는 이름 · 제목이 섞일 수 있어서)
function subjScan(chunk, strict) {
  const s = dotFix(chunk.replace(/\s+/g, '')), dict = SUBJ_DICT.map(n => ({ f: n.replace(/\s+/g, ''), n })), out = [];
  let i = 0, buf = '';
  const flush = () => { if (!strict && /[가-힣]{2,}/.test(buf)) out.push(buf); buf = ''; };
  while (i < s.length) {
    let best = null;
    dict.forEach(d => { if (s.startsWith(d.f, i) && (!best || d.f.length > best.len)) best = { len: d.f.length, n: d.n }; });
    SUBJ_SKIP.forEach(g => { if (s.startsWith(g, i) && (!best || g.length > best.len)) best = { len: g.length, n: null }; });
    if (best) { flush(); if (best.n && !out.includes(best.n)) out.push(best.n); i += best.len; }
    else buf += s[i++];
  }
  flush();
  return out;
}
function pasteSubj() {
  const st = cur(), text = $('#subjPaste').value; if (!text.trim()) return toast('확인서 표를 붙여 넣어 주세요');
  // 탭이 없으면 (PDF에서 복사) → 학기 글자로 나누고 사전으로 과목 찾기
  if (!text.includes('\t')) {
    const out = {}, re = /([123])\s*학\s*년\s*([12])\s*학\s*기/g, ms = [...text.matchAll(re)];
    if (!ms.length) out[$('#subjSem').value] = subjScan(text);
    // '2학년 2학기' 앞에 학기 글자 없이 복사된 과목 → 그 앞 학기(2학년 1학기)로, 사전에 있는 과목만
    else if (ms[0].index > 0) {
      const pre = subjScan(text.slice(0, ms[0].index), true), k = ms[0][2] === '2' ? `${ms[0][1]}-1` : $('#subjSem').value;
      if (pre.length) out[k] = pre;
    }
    ms.forEach((m, j) => { const a = subjScan(text.slice(m.index + m[0].length, j + 1 < ms.length ? ms[j + 1].index : text.length)); if (a.length) out[`${m[1]}-${m[2]}`] = a; });
    Object.keys(out).forEach(k => { if (!SEMS.some(s => s[0] === k)) delete out[k]; });   // 2학년 1 · 2학기만
    const ks = Object.keys(out).filter(k => out[k].length); if (!ks.length) return toast('과목을 찾지 못했어요. 직접 적어 주세요');
    st.subjects = Object.assign(st.subjects || {}, out); saveStudent(st); render();
    return subjToast(out, ks);
  }
  const out = {}; let marks = [];
  text.split(/\r?\n/).forEach(line => {
    const cells = line.split('\t').map(c => c.trim());
    const mk = cells.map((c, i) => { const m = c.match(/([123])\s*학년\s*([12])\s*학기/); return m ? { i, k: `${m[1]}-${m[2]}` } : null; }).filter(Boolean);
    if (mk.length) { marks = mk; return; }
    cells.forEach((c, i) => {
      if (!c || isGroup(c) || /확인서|수강신청/.test(c)) return;
      c = dotFix(c);   // '기술･가정' → '기술·가정' (점 모양 하나로)
      const m = [...marks].reverse().find(x => x.i <= i) || marks[0];
      const k = m ? m.k : $('#subjSem').value;   // 학기 글자가 아예 없으면 고른 학기
      (out[k] = out[k] || []).includes(c) || out[k].push(c);
    });
  });
  // 학기 글자가 나오기 전 줄(이름 · 제목)은 버려요
  if (/학기/.test(text)) { const first = text.search(/[123]\s*학년\s*[12]\s*학기/); if (first > 0) { const before = text.slice(0, first).split(/[\t\n]/).map(x => x.trim()).filter(Boolean); Object.keys(out).forEach(k => out[k] = out[k].filter(x => !before.includes(x))); } }
  Object.keys(out).forEach(k => { if (!SEMS.some(s => s[0] === k)) delete out[k]; });   // 2학년 1 · 2학기만
  const ks = Object.keys(out); if (!ks.length) return toast('과목을 찾지 못했어요. 직접 적어 주세요');
  st.subjects = Object.assign(st.subjects || {}, out); saveStudent(st); render();
  subjToast(out, ks);
}

// 그래프에 쓸 줄: 관리에서 올린 성적 파일(번호로 찾기) + 여기서 직접 넣은 등급
function growthRows(st, kind) {
  const max = kind === 'mock' ? 9 : 5, rows = [], files = [];
  scoreDocs().filter(d => examOf(d).kind === kind).forEach(d => {
    const r = st.num ? d.rows.find(x => x.no === st.num) : null;
    if (!r) return;
    const o = { label: `${String(d.year).slice(2)}년 ${examOf(d).short}`, _k: d.year * 100 + EXAMS.findIndex(e => e.id === d.exam) };
    gradeCols(d, max).forEach(c => { const v = Number(r.v[c.i]); if (r.v[c.i] !== '' && !isNaN(v)) o[c.subj] = v; });
    rows.push(o); files.push({ d, r });
  });
  // 교과학습발달상황(나이스 학기 성적)의 석차등급 → 내신 그래프
  if (kind === 'school' && st.num) gyogwaDocs().forEach(d => {
    const rs = d.rows.filter(r => r.no === st.num); if (!rs.length) return;
    const iS = d.cols.findIndex(c => c === '과목'), iG = d.cols.findIndex(c => /석차/.test(c));
    const o = { label: `${String(d.year).slice(2)}년 ${d.sem}학기 (나이스)`, _k: d.year * 100 + (d.sem == 2 ? 9.5 : 6.5) };
    rs.forEach(r => { const v = Number(r.v[iG]); if (iG >= 0 && r.v[iG] !== '' && !isNaN(v)) o[r.v[iS]] = v; });
    rows.push(o);
  });
  rows.sort((a, b) => a._k - b._k);
  st[kind === 'mock' ? 'mocks' : 'grades'].forEach(r => { const o = { label: r.label }; Object.keys(r).forEach(k => { if (k !== 'id' && k !== 'label') o[k] = r[k]; }); rows.push(o); });
  rows.forEach(r => delete r._k);
  const subj = [...new Set(rows.flatMap(r => Object.keys(r).filter(k => k !== 'label')))];
  return { rows, subj, files };
}

const METRICS = { grade: '등급', pct: '백분위', std: '표준점수', raw: '원점수' };
const METRIC_RE = { pct: /백분위/, std: /표준\s*점수|표점/, raw: /원점수/ };

function metricCols(d, m) {
  return d.cols.map((h, i) => ({ h, i })).filter(c => METRIC_RE[m].test(c.h) && d.rows.some(r => r.v[c.i] !== '' && !isNaN(parseFloat(r.v[c.i]))))
    .map(c => ({ i: c.i, subj: subjName(c.h.replace(/원점수|표준\s*점수|표점|백분위|석차|등급/g, '')) || c.h }));

function growthMetric(st, kind, m) {
  if (m === 'grade') return growthRows(st, kind);
  const rows = [];

    const r = d.rows.find(x => x.no === st.num); if (!r) return;
    const o = { label: `${String(d.year).slice(2)}년 ${examOf(d).short}` };
    metricCols(d, m).forEach(c => { const v = parseFloat(r.v[c.i]); if (r.v[c.i] !== '' && !isNaN(v)) o[c.subj] = v; });

function addScore(kind) {

  const r = { id: uid(), label };

// 올렸지만 이 친구 등급이 없어 그래프에 안 나오는 시험 알려 주기
function noGrade(F) {
  const miss = F.rows.filter(r => !F.subj.some(s => r[s] != null)).map(r => r.label);
  return miss.length ? `<div class="mini" style="margin-top:6px;color:var(--red)">⚠️ ${miss.map(esc).join(', ')}: 등급 칸이 없어 그래프에 안 나와요 (중간고사처럼 원점수만 있는 성적표는 등급이 없어요). 아래 '올린 성적표에서 이 친구 줄 보기'에서 확인할 수 있어요.</div>` : '';
}
function drawCharts(st) {
  if (!window.Chart) return;
  const mk = (id, rows, subj, max, m = 'grade') => {
    const el = document.getElementById(id); if (!el) return;
    // 백분위 · 표준점수 · 원점수는 높을수록 좋아서 위로 (등급만 거꾸로)
    const y = m === 'grade' ? { reverse: true, min: 1, max, ticks: { stepSize: 1, callback: v => v + '등급' } }
      : { reverse: false, ...(m === 'pct' ? { max: 100 } : {}), grace: '5%', ticks: { callback: v => v + (m === 'pct' ? '' : '점') } };
    rows = rows.filter(r => subj.some(s => r[s] != null));   // 등급이 하나도 없는 시험(예: 원점수만 있는 중간고사)은 빼요
    charts.push(new Chart(el, {
      type: 'line',
      data: { labels: rows.map(r => r.label), datasets: subj.map((s, i) => ({ label: s, data: rows.map(r => r[s] ?? null), borderColor: SUBJ_COLORS[i % SUBJ_COLORS.length], backgroundColor: SUBJ_COLORS[i % SUBJ_COLORS.length], tension: .35, spanGaps: true, borderWidth: s === '평균' ? 4 : 2.5, pointRadius: 5, clip: false })).filter(d => d.data.some(v => v !== null)) },
      // 점이 그래프 가장자리에 붙어 잘리지 않게 양옆 · 위아래로 여유를 둬요
      options: { layout: { padding: 10 }, scales: { x: { offset: true }, y }, plugins: { legend: { labels: { boxWidth: 12, font: { family: 'Pretendard' } } } } }
    }));
  };
  const gm = V.gm || {}, M = growthMetric(st, 'mock', gm.mock || 'grade'), G = growthMetric(st, 'school', gm.school || 'grade');
  mk('chMock', M.rows, M.subj, 9, gm.mock || 'grade');
  mk('chGrade', G.rows, G.subj, 5, gm.school || 'grade');
}

function addAct() {

async function addEpisode(gen, btn) {

/* 6 문장 담벼락 */
function secWall(st) {
  const f = V.wallFilter;
  const list = st.sentences.filter(s => f === '전체' || (f === '고른 것' ? s.picked : s.area === f));
  return `<div class="cols" style="grid-template-columns:minmax(0,1.9fr) minmax(280px,1fr)">
    <div>
      <div class="row" style="margin-bottom:12px">
        ${['전체', ...AREAS.map(a => a.k), '고른 것'].map(k => `<button class="pill ${f === k ? 'on' : ''}" onclick="V.wallFilter='${k}';render()">${AN(k)} ${k === '전체' ? st.sentences.length : k === '고른 것' ? st.sentences.filter(s => s.picked).length : st.sentences.filter(s => s.area === k).length}</button>`).join('')}
      </div>
      <div class="row" style="margin-bottom:14px"><input type="text" id="wNew" placeholder="직접 문구 붙이기 (예: 학급 회의에서 소수 의견을 정리해 전달함.)" style="flex:1">
        <select id="wArea" style="width:auto">${AREAS.map(a => `<option value="${a.k}">${a.short}</option>`).join('')}</select><button class="btn sm" onclick="addManual()">📌 붙이기</button></div>
      ${list.length ? `<div class="wallgrid">${list.map((s, i) => `<div class="post ${s.area} ${s.picked ? 'picked' : ''}" style="transform:rotate(${(i % 3 - 1) * .7}deg)">
        <span class="pin">📌</span>
        <div class="meta"><select onchange="setSent('${s.id}','area',this.value)">${AREAS.map(a => `<option value="${a.k}" ${a.k === s.area ? 'selected' : ''}>${a.short}</option>`).join('')}</select>${s.trait ? `<span class="chip">#${esc(s.trait)}</span>` : ''}</div>
        ${V.editSent === s.id ? `<textarea id="ed_${s.id}">${esc(s.text)}</textarea>` : `<div>${esc(s.text)}</div>`}
        <div class="mini">${esc(s.source)} · ${nbytes(s.text)}B</div>
        <div class="acts">
          <button class="btn sm ${s.picked ? 'ghost' : ''}" onclick="togglePick('${s.id}')">${s.picked ? '➖ 빼기' : '➕ 넣기'}</button>
          ${V.editSent === s.id ? `<button class="btn ghost sm" onclick="saveEdit('${s.id}')">저장</button>` : `<button class="x" title="고치기" onclick="V.editSent='${s.id}';render()">✏️</button>`}
          <button class="x" title="떼기" onclick="delSent('${s.id}')">🗑</button>
        </div></div>`).join('')}</div>` : '<div class="empty">일화·상담·활동에서 ✨ 문구 만들기를 누르면 여기에 포스트잇이 붙어요</div>'}
    </div>
    <div>${AREAS.map(a => basket(st, a)).join('')}</div>
  </div>`;
}
function basket(st, a) {
  const items = st.sentences.filter(s => s.picked && s.area === a.k).sort((x, y) => x.pickedAt - y.pickedAt);
  const b = nbytes(items.map(s => s.text).join(' '));
  return `<div class="basket"><h4><span class="chip ${a.k}">${a.short}</span>${a.label}</h4>
    ${items.map((s, i) => `<div class="bitem"><div>${esc(s.text)}</div><div style="flex:none;display:flex;flex-direction:column">
      <button class="x" onclick="movePick('${s.id}',-1)" ${i === 0 ? 'disabled' : ''}>▲</button><button class="x" onclick="movePick('${s.id}',1)" ${i === items.length - 1 ? 'disabled' : ''}>▼</button></div></div>`).join('') || '<div class="mini">담벼락에서 ➕ 넣기를 눌러요</div>'}
    <div class="meter"><i class="${b > a.limit ? 'over' : ''}" style="width:${Math.min(100, b / a.limit * 100)}%"></i></div>
    <div class="row"><span class="mini">${b} / ${a.limit} 바이트</span>
      ${items.length ? `<button class="btn ai sm" style="margin-left:auto" onclick="polish('${a.k}',this)">✨ 한 단락으로 다듬기</button>` : ''}</div>
  </div>`;
}
function setSent(id, k, v) { const st = cur(); const s = st.sentences.find(x => x.id === id); s[k] = v; saveStudent(st); render(); }
function togglePick(id) { const st = cur(); const s = st.sentences.find(x => x.id === id); s.picked = !s.picked; s.pickedAt = Date.now(); saveStudent(st); render(); }
function movePick(id, dir) {
  const st = cur(); const s = st.sentences.find(x => x.id === id);
  const items = st.sentences.filter(x => x.picked && x.area === s.area).sort((a, b) => a.pickedAt - b.pickedAt);
  const i = items.indexOf(s), j = i + dir; if (j < 0 || j >= items.length) return;
  [items[i].pickedAt, items[j].pickedAt] = [items[j].pickedAt, items[i].pickedAt];
  saveStudent(st); render();
}
function saveEdit(id) { const st = cur(); const v = $('#ed_' + id).value.trim(); if (!piiOk(v)) return; st.sentences.find(x => x.id === id).text = v; V.editSent = null; saveStudent(st); render(); }
function delSent(id) { const st = cur(); st.sentences = st.sentences.filter(x => x.id !== id); saveStudent(st); render(); }
function addManual() {
  const st = cur(), t = $('#wNew').value.trim(); if (!t) return;
  if (!piiOk(t)) return;
  st.sentences.push({ id: uid(), text: t, area: $('#wArea').value, trait: '', source: '직접 입력', picked: false, pickedAt: 0, date: today() });
  saveStudent(st); render();
}
async function polish(area, btn) {
  const st = cur(), a = AREAS.find(x => x.k === area);
  const items = st.sentences.filter(s => s.picked && s.area === area).sort((x, y) => x.pickedAt - y.pickedAt);
  await withBusy(btn, async () => {
    const out = await callAI(SYS_RULES, `아래 문구들을 고등학교 생기부 '${a.label}' 특기사항 한 단락으로 자연스럽게 엮어 줘.
- 새 사실을 더하지 말고, 겹치는 내용은 합쳐 줘.
- 명사형 종결, 문장 순서는 흐름이 자연스럽게.
- 나이스 기준 ${a.limit}바이트(한글 1자=3바이트, 대략 ${Math.floor(a.limit / 3)}자) 이내.
- 단락 본문만 출력해. 제목·따옴표·설명 없이.
문구:\n${items.map((s, i) => `${i + 1}. ${s.text}`).join('\n')}`, 1500);
    st.final[area] = out.trim(); saveStudent(st);
    toast('✨ 생기부 정리 탭에 넣었어요'); V.sec = 7; render();
  });
}

/* 7 생기부 정리 */

  <div class="cols c3">${AREAS.map((a, i) => {
    const b = nbytes(st.final[a.k]);
    return `<div class="box"><div class="hd ${a.color}"><span class="n">${i + 1}</span>${a.label}<span class="sp" style="font-size:15px">${b} / ${a.limit}B</span></div><div class="bd">
      <textarea style="min-height:190px;font-size:13.5px" oninput="liveBytes(this,'${a.k}',${a.limit})" onchange="setFinal('${a.k}',this.value)" placeholder="담벼락 바구니에서 ✨ 한 단락으로 다듬기를 누르거나 직접 써요">${esc(st.final[a.k])}</textarea>
      <div class="meter"><i id="m_${a.k}" class="${b > a.limit ? 'over' : ''}" style="width:${Math.min(100, b / a.limit * 100)}%"></i></div>
      <div class="row"><span class="mini" id="b_${a.k}">${b > a.limit ? '⚠️ 바이트를 넘었어요' : '나이스 바이트 기준'}</span>
        <button class="btn ghost sm" style="margin-left:auto" onclick="V.sec=6;V.wallFilter='${a.k}';render()">담벼락</button>
        <button class="btn sm" onclick="copyText(cur().final['${a.k}'])">📋 복사</button></div>
    </div></div>`; }).join('')}</div>
  <div class="row" style="margin-top:14px"><button class="btn" onclick="copyAll()">📋 세 영역 한꺼번에 복사</button><span class="mini">복사한 뒤 나이스 각 영역에 붙여 넣어요.</span></div>`;
}
function liveBytes(el, k, lim) { const b = nbytes(el.value); const m = $('#m_' + k); m.style.width = Math.min(100, b / lim * 100) + '%'; m.className = b > lim ? 'over' : ''; $('#b_' + k).textContent = `${b} / ${lim} 바이트`; }
function setFinal(k, v) { const st = cur(); if (!piiOk(v)) return; st.final[k] = v; saveStudent(st); }
function copyAll() { const st = cur(); copyText(AREAS.map(a => `[${a.label}]\n${st.final[a.k] || ''}`).join('\n\n')); }
function copyText(t) { navigator.clipboard.writeText(t || '').then(() => toast('📋 복사했어요')).catch(() => toast('복사가 막혔어요. 직접 선택해 복사해 주세요')); }

/* ================= 🗓️ 공통 행사 — 반 전체 행사 칸을 12월 전까지 상담하며 채워요 =================
   행사 목록: 클라우드 meta/classev { due, events: [{ id, title, date, area, ask }] }
   학생 칸:   학생 기록 st.ev[행사 id] = { text, at } */
let CE = { events: [], due: '' }, ceTimer = null;
function saveCE() {
  if (!db) return;
  clearTimeout(ceTimer);
  ceTimer = setTimeout(() => roomRef().collection('meta').doc('classev').set(clone(CE)).catch(e => toast('☁️ 저장 실패: ' + e.message)), 400);
}
const ceDue = () => CE.due || `${new Date().getFullYear()}-12-01`;
const ceDday = () => Math.ceil((new Date(ceDue()) - new Date(today())) / 86400000);
const ceFilled = (st, ev) => !!(st.ev[ev.id] && st.ev[ev.id].text);
// 행사 목록이 바뀌면 관리 창(열려 있으면)과 뒤 화면을 같이 다시 그려요
function ceRefresh() { CE.events.sort((a, b) => (a.date || '9').localeCompare(b.date || '9')); saveCE(); if ($('#dashEv')) dashRefresh(); render(); }
function ceAdd() {
  const title = $('#ceTitle').value.trim(); if (!title) return toast('행사 이름을 적어 주세요');
  CE.events.push({ id: uid(), title, date: $('#ceDate').value || '', area: $('#ceArea').value, ask: $('#ceAsk').value.trim() }); ceRefresh();
}
function ceSet(id, k, v) { const e = CE.events.find(x => x.id === id); if (!e) return; e[k] = v; ceRefresh(); }
function ceDel(id) {
  const e = CE.events.find(x => x.id === id), n = D.students.filter(s => ceFilled(s, e)).length;
  if (!confirm(`'${e.title}' 행사를 지울까요?${n ? `\n${n}명이 채운 칸은 학생 기록에 남아 있지만 화면에서는 안 보여요.` : ''}`)) return;
  CE.events = CE.events.filter(x => x.id !== id); ceRefresh();
}
// 확인 목록(사진 · 글 · 달력에서 뽑은 것)에서 고른 것만 행사로 넣기
function ceAddRows() {
  const pick = (DASH.evRows || []).filter(r => r.on && r.title.trim());
  if (!pick.length) return toast('넣을 행사를 골라 주세요');
  pick.forEach(r => CE.events.push({ id: uid(), title: r.title.trim(), date: isYmd(r.date) ? r.date : '', area: r.area, ask: (r.ask || '').trim() }));
  DASH.evRows = []; DASH.evImgs = []; DASH.evText = ''; ceRefresh(); toast(`🗓️ 행사 ${pick.length}개를 넣었어요`);
}
const ceHas = (date, title) => CE.events.some(e => e.title === title && (!date || e.date === date));
// 달력 일정을 확인 목록으로
function ceFromCal() {
  DASH.evRows = [...D.events].sort((a, b) => a.date.localeCompare(b.date)).map(e => {
    const title = e.title.replace(/^\d{1,2}:\d{2}\s*/, ''), dup = ceHas(e.date, title);
    return { date: e.date, title, area: '자율', ask: '', on: false, dup };
  });
  if (!DASH.evRows.length) toast('달력에 일정이 없어요');
  dashRefresh();
}
// 사진 · 글에서 행사 뽑기 (AI)
async function ceExtract(btn) {
  DASH.evText = $('#evText').value.trim();
  if (!(DASH.evImgs || []).length && !DASH.evText) return toast('행사 목록 사진이나 글을 먼저 넣어 주세요');
  await withBusy(btn, async () => {
    const out = await callAI('너는 학교 · 학급 행사 계획표에서 행사를 빠짐없이 옮겨 적는 도우미다. 반드시 JSON 배열만 출력한다.', {
      text: `사진과 글에 있는 학급 · 학교 행사를 모두 찾아 아래 모양으로만 출력해.
[{"date":"YYYY-MM-DD 또는 빈 문자열","title":"행사 이름 20자 이내","area":"자율|진로|행특","ask":"담임이 상담 때 학생에게 물어볼 짧은 질문"}]
- 오늘은 ${today()}. 연도가 안 보이면 이번 학년도(3월~다음 해 2월)로 정해.
- area: 학급 · 학생 자치 · 학교 행사 · 봉사 · 안전교육은 자율, 진로 체험 · 진로 특강 · 학과 탐색은 진로, 그 밖에 학생 인성 · 태도가 드러나는 일은 행특.
- ask 예: '맡은 역할은?', '가장 기억에 남는 장면은?', '어떤 진로 생각이 들었나요?'
- 공휴일 · 방학 · 시험 기간처럼 학생이 무언가를 하지 않는 일정은 빼.
${DASH.evText ? '\n[붙여 넣은 글]\n' + DASH.evText : ''}`,
      images: DASH.evImgs || []
    }, 3000);
    const arr = parseJSONArray(out).filter(a => a.title);
    if (!arr.length) throw new Error('행사를 찾지 못했어요. 표 부분만 크게 캡처해 보세요');
    DASH.evRows = arr.map(a => {
      const title = String(a.title).trim().slice(0, 30), date = isYmd(a.date) ? a.date : '', dup = ceHas(date, title);
      return { date, title, area: AREAS.some(x => x.k === a.area) ? a.area : '자율', ask: String(a.ask || '').slice(0, 40), on: !dup, dup };
    }).sort((x, y) => (x.date || '9').localeCompare(y.date || '9'));
    dashRefresh();
  });
}
/* 🛠 관리 → 🗓️ 공통 행사: 행사 넣기 (사진 · 글 · 달력 · 직접) + 목록 고치기 · 마감 */

  const L = D.students, E = CE.events, rows = DASH.evRows || [], dd = ceDday();
  const areaSel = (v, on) => `<select style="width:auto" onchange="${on}">${AREAS.map(a => `<option value="${a.k}" ${a.k === v ? 'selected' : ''}>${a.short}</option>`).join('')}</select>`;
  return `<section id="dashEv"><h4>1. 행사 목록 사진 · 글 붙여 넣기 <span class="mini">(AI 키 필요 · Gemini 무료 키 가능)</span></h4>
    <p class="mini">학교 행사 계획표 · 학급 일정표를 캡처하거나 사진 파일을 이 창에서 <b>Ctrl+V</b> 하면 들어와요. 여러 장도 돼요. 글로 복사한 목록은 아래 칸에 붙여 넣어요.</p>
    <div class="row" style="margin:8px 0">${(DASH.evImgs || []).map((m, i) => `<div style="position:relative"><img src="data:${m.mime};base64,${m.data}" style="height:90px;border-radius:8px;border:1.5px solid var(--line);display:block"><button class="x" style="position:absolute;top:0;right:2px;background:#fff;border-radius:50%" onclick="DASH.evImgs.splice(${i},1);dashRefresh()">✕</button></div>`).join('')}
      <label class="btn sm ghost">🖼 사진 파일 고르기<input type="file" accept="image/*" multiple hidden onchange="dashFiles(this.files)"></label>
      <button class="btn sm ghost" onclick="ceFromCal()">📅 달력 일정에서 고르기</button></div>
    <textarea id="evText" oninput="DASH.evText=this.value" placeholder="(글로 붙여 넣기) 예: 3/15 환경미화, 3/25 정부회장 선거, 5/20 체육대회">${esc(DASH.evText || '')}</textarea>
    <button class="btn ai" style="margin-top:8px" onclick="ceExtract(this)">✨ 행사 뽑기</button></section>
  ${rows.length ? `<section><h4>2. 확인하고 넣기 <span class="mini">${rows.length}개 · 이미 있는 행사는 흐리게</span></h4>
    <div class="row" style="margin-bottom:6px"><button class="btn ghost sm" onclick="DASH.evRows.forEach(r=>r.on=!r.dup);dashRefresh()">모두 체크</button><button class="btn ghost sm" onclick="DASH.evRows.forEach(r=>r.on=false);dashRefresh()">모두 빼기</button></div>
    <table class="dtable"><tr><th></th><th>날짜</th><th>행사</th><th>영역</th><th>상담 때 물어볼 것</th><th></th></tr>
    ${rows.map((r, i) => `<tr style="${r.dup ? 'opacity:.5' : ''}"><td><input type="checkbox" ${r.on ? 'checked' : ''} onchange="DASH.evRows[${i}].on=this.checked"></td>
      <td style="width:150px"><input type="date" value="${r.date}" onchange="DASH.evRows[${i}].date=this.value"></td>
      <td><input type="text" value="${esc(r.title)}" onchange="DASH.evRows[${i}].title=this.value"></td>
      <td>${areaSel(r.area, `DASH.evRows[${i}].area=this.value`)}</td>
      <td><input type="text" value="${esc(r.ask)}" onchange="DASH.evRows[${i}].ask=this.value"></td>
      <td><button class="x" onclick="DASH.evRows.splice(${i},1);dashRefresh()">✕</button></td></tr>`).join('')}</table>
    <div class="row" style="margin-top:10px"><button class="btn" onclick="ceAddRows()">🗓️ 공통 행사로 넣기</button><button class="btn ghost sm" style="margin-left:auto" onclick="DASH.evRows=[];dashRefresh()">목록 비우기</button></div></section>` : ''}
  <section><h4>3. 지금 행사 목록 <span class="mini">${E.length}개</span>
      <span style="margin-left:auto;font-family:var(--body);font-size:13px">마감 <input type="date" value="${ceDue()}" onchange="CE.due=this.value;saveCE();dashRefresh();render()" style="width:auto;padding:2px 6px"> ${dd >= 0 ? `D-${dd}` : `${-dd}일 지남`}</span></h4>
    <div class="row" style="margin-bottom:8px"><input type="text" id="ceTitle" placeholder="직접 넣기: 행사 이름" style="flex:2;min-width:160px"><input type="date" id="ceDate" style="width:auto">
      <select id="ceArea" style="width:auto">${AREAS.map(a => `<option value="${a.k}">${a.short}</option>`).join('')}</select>
      <input type="text" id="ceAsk" placeholder="상담 때 물어볼 것" style="flex:2;min-width:160px"><button class="btn sm" onclick="ceAdd()">＋ 넣기</button></div>
    ${E.length ? `<table class="dtable"><tr><th>날짜</th><th>행사</th><th>영역</th><th>상담 때 물어볼 것</th><th style="text-align:center">채움</th><th></th></tr>
      ${E.map(e => `<tr><td style="width:150px"><input type="date" value="${e.date}" onchange="ceSet('${e.id}','date',this.value)"></td>
        <td><input type="text" value="${esc(e.title)}" onchange="ceSet('${e.id}','title',this.value)"></td>
        <td>${areaSel(e.area, `ceSet('${e.id}','area',this.value)`)}</td>
        <td><input type="text" value="${esc(e.ask || '')}" onchange="ceSet('${e.id}','ask',this.value)"></td>
        <td style="text-align:center;white-space:nowrap"><b>${L.filter(s => ceFilled(s, e)).length}</b>/${L.length}</td><td><button class="x" onclick="ceDel('${e.id}')">🗑</button></td></tr>`).join('')}</table>` : '<div class="empty">아직 행사가 없어요</div>'}
  </section>`;
}
// 표의 칸을 눌러 바로 적기
function ceCell(sid, eid) {
  const st = D.students.find(s => s.id === sid), e = CE.events.find(x => x.id === eid);
  openModal(`${sname(st)} · ${e.title}`, `<p class="mini">${e.date ? e.date + ' · ' : ''}${AN(e.area)}${e.ask ? ' · 💡 ' + esc(e.ask) : ''}</p>
    <textarea id="ceText" style="min-height:140px" placeholder="이 행사에서 맡은 일, 한 행동, 느낀 점, 선생님이 본 모습">${esc(st.ev[eid]?.text || '')}</textarea>
    <div class="row" style="margin-top:8px"><button class="btn" onclick="ceSave('${sid}','${eid}',false)">💾 저장</button><button class="btn ai" onclick="ceSave('${sid}','${eid}',true,this)">✨ 저장하고 문구로</button></div>`);
}
async function ceSave(sid, eid, gen, btn) {
  const st = D.students.find(s => s.id === sid), e = CE.events.find(x => x.id === eid), text = ($('#ceText') || $('#ceT_' + eid)).value.trim();
  if (text && !piiOk(text)) return;
  st.ev[eid] = { text, at: Date.now() }; saveStudent(st);
  if (gen && text) await genSentences(st, text, `공통 행사(${e.title})`, btn);
  if ($('#ceText')) closeModal();
  render(); if (!gen) toast('💾 저장했어요');
}
function viewClassEv() {
  const L = D.students, E = CE.events, dd = ceDday();
  const total = L.length * E.length, done = L.reduce((n, s) => n + E.filter(e => ceFilled(s, e)).length, 0);
  return `<div class="row" style="margin-bottom:12px"><span class="chip" style="font-size:14px;padding:4px 12px">⏰ 마감 ${ceDue()} · ${dd >= 0 ? `D-${dd}` : `${-dd}일 지남`}</span>
    <span class="mini">행사 ${E.length}개 · 상담할 때 개인 상담 기록 → 💬 상담 → 공통 행사 채우기에서 채우거나, 아래 표의 칸을 눌러 바로 적어요.</span>
    <button class="btn sm" style="margin-left:auto" onclick="openDash('ev')">🛠 관리에서 행사 넣기 · 고치기</button></div>
  ${E.length ? '' : `<div class="empty">아직 행사가 없어요.<br>🛠 관리 → 🗓️ 공통 행사에서 행사 계획표 사진을 붙여 넣거나 직접 넣어 주세요.<br><button class="btn" style="margin-top:10px" onclick="openDash('ev')">🛠 관리에서 행사 넣기</button></div>`}
  ${E.length && L.length ? `<div class="box"><div class="hd green"><span class="n">✿</span>채우기 표 <span class="sp" style="font-size:15px">${done} / ${total}칸 (${Math.round(done / total * 100)}%)</span></div><div class="bd" style="overflow:auto">
    <div class="meter" style="height:10px;margin-bottom:10px"><i style="width:${done / total * 100}%"></i></div>
    <table class="dtable"><tr><th>친구</th>${E.map(e => `<th style="text-align:center;min-width:72px">${esc(e.title)}<div class="mini">${e.date ? e.date.slice(5) : ''}</div></th>`).join('')}<th style="text-align:center">남은 칸</th></tr>
    ${[...L].sort((a, b) => E.filter(e => ceFilled(a, e)).length - E.filter(e => ceFilled(b, e)).length).map(s => { const left = E.filter(e => !ceFilled(s, e)).length;
      return `<tr><td><a href="#" onclick="openStudent('${s.id}',8);return false" style="white-space:nowrap">${esc(sname(s))}</a></td>
      ${E.map(e => ceFilled(s, e) ? `<td style="text-align:center;cursor:pointer;background:var(--greenL);color:#3d8a5a" title="${esc(s.ev[e.id].text)}" onclick="ceCell('${s.id}','${e.id}')">✓</td>` : `<td style="text-align:center;cursor:pointer;color:var(--line)" onclick="ceCell('${s.id}','${e.id}')">○</td>`).join('')}
      <td style="text-align:center;${left ? 'color:var(--red);font-weight:700' : 'color:#3d8a5a'}">${left || '다 채움'}</td></tr>`; }).join('')}</table>
    <p class="mini">남은 칸이 많은 친구부터 보여요. 칸을 누르면 바로 적을 수 있어요 (✓ 위에 올리면 내용이 보여요).</p>
  </div></div>` : ''}`;
}
/* 개인 상담 기록 — 공통 행사 채우기 (상담하면서) */

function ceSaveInline(eid, v) { const st = cur(); v = v.trim(); if (v && !piiOk(v)) return; st.ev[eid] = { text: v, at: Date.now() }; saveStudent(st); }

/* ================= 🧭 분석 (AI) — 이 친구 기록 전체를 읽고 근거를 붙여 정리해요 ================= */
// AI에 보낼 이 친구 기록 모음 (별칭 · 번호 · 이름 없이, 날짜 순). ownOnly = 담임이 직접 남긴 관찰만 (나이스 글 빼고)
function corpus(st, max = 14000, ownOnly = false) {
  const L = [];
  st.episodes.forEach(e => L.push([e.date, '일화', e.text]));
  st.counsels.forEach(c => L.push([c.date, '상담·' + c.type, c.text]));
  st.acts.forEach(a => L.push([a.date, '활동·' + a.area, (a.title ? a.title + ' — ' : '') + a.text]));
  CE.events.forEach(e => { if (ceFilled(st, e)) L.push([e.date || '', '공통 행사·' + e.title, st.ev[e.id].text]); });
  if (st.num && !ownOnly) {
    changYears().forEach(y => {
      changRows(st.num, y).forEach(r => { if (r.text || r.hope) L.push([y + '', '나이스 ' + r.label, (r.hope ? '희망분야 ' + r.hope + ' / ' : '') + r.text]); });
      const h = haengText(st.num, y); if (h) L.push([y + '', '나이스 행발', h]);
    });
    Object.values(RC).filter(d => d.kind === 'setuk').forEach(d => { const r = d.rows.find(x => x.no === st.num); if (r && r.text) L.push([`${d.year}-${d.sem}학기`, '세특 ' + d.subj, r.text]); });
    // 봉사활동은 한 번 한 번 날짜 순으로 섞어 넣어요
    Object.values(RC).filter(d => d.kind === 'vol').forEach(d => { const r = d.rows.find(x => x.no === st.num);
      (r?.items || []).forEach(x => L.push([volDate(x.date) || d.year + '', '나이스 봉사', `${x.text} (${x.h}시간${x.place ? ', ' + x.place : ''})`])); });
  }
  // 출결도 AI에 같이 보내요 (0이 아닌 칸만, 다 0이면 '모두 0') — 글이 길어도 잘리지 않게 맨 앞에 따로 붙여요
  const A = [];
  if (st.num && !ownOnly) {
    Object.values(RC).filter(d => d.kind === 'att').sort((a, b) => a.year - b.year).forEach(d => {
      const r = d.rows.find(x => x.no === st.num); if (!r) return;
      const iDays = d.cols.findIndex(c => /수업일수/.test(c)), iNote = d.cols.findIndex(c => /특기/.test(c));
      const cnt = d.cols.map((c, i) => i !== iDays && i !== iNote && Number(r.v[i]) ? `${c.replace(/\s/g, '')} ${r.v[i]}` : '').filter(Boolean).join(' · ');
      const note = iNote >= 0 && r.v[iNote] ? ` / 특기사항: ${r.v[iNote]}` : '';
      A.push(`[${d.year}학년도] (나이스 출결) ${iDays >= 0 && r.v[iDays] ? `수업일수 ${r.v[iDays]} / ` : ''}${cnt || '결석 · 지각 · 조퇴 · 결과 모두 0'}${note}`);
    });
  }

/* ================= 📷 우리반 사진 갤러리 — 달력 화면 맨 아래에 가로로 =================
   저장: 클라우드 meta/photo_아이디 { at, date, cap, img(1280px JPEG base64) } — 사진은 한 장에 문서 하나
   로그인할 때는 빼고 읽고, loadPhotos()로 따로 불러와요 */
let PH = [], phLoaded = false;
async function loadPhotos() {
  if (!db) return;
  try {
    const FP = firebase.firestore.FieldPath.documentId();
    const snap = await roomRef().collection('meta').where(FP, '>=', 'photo_').where(FP, '<', 'photo_').get();
    PH = snap.docs.map(d => ({ id: d.id, ...d.data() })); phSort(); phLoaded = true; render();
    if ($('#dashPhoto')) dashRefresh();
  } catch (e) { toast('📷 사진을 불러오지 못했어요: ' + e.message); }
}
const phSort = () => PH.sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.at - a.at);   // 최근 사진부터
// 올리기 전 사진들 (관리 창)
async function photoFiles(files) {
  DASH.phNew = DASH.phNew || [];
  for (const f of files) {
    if (!f || !f.type.startsWith('image/')) continue;
    let m = await imgToB64(f, 1280, 0.8);
    if (m.data.length > 850000) m = await imgToB64(f, 960, 0.7);   // 문서 1MB 한도 안으로
    DASH.phNew.push({ ...m, cap: '', date: today() });
  }
  dashRefresh();
}
async function photoSave() {
  const L = (DASH.phNew || []); if (!L.length) return;
  try {
    for (const p of L) {
      const id = 'photo_' + uid(), doc = { at: Date.now(), date: p.date || today(), cap: (p.cap || '').trim().slice(0, 40), img: p.data };
      await roomRef().collection('meta').doc(id).set(doc); PH.push({ id, ...doc });
    }
  } catch (e) { return toast('☁️ 올리기 실패: ' + e.message); }
  phSort(); DASH.phNew = []; dashRefresh(); render(); toast(`📷 사진 ${L.length}장을 올렸어요`);
}
async function photoDel(id) {
  if (!confirm('이 사진을 지울까요?')) return;
  try { await roomRef().collection('meta').doc(id).delete(); } catch (e) { return toast('☁️ 지우기 실패: ' + e.message); }
  PH = PH.filter(p => p.id !== id); dashRefresh(); render();
}
function photoSet(id, k, v) {
  const p = PH.find(x => x.id === id); if (!p) return;
  p[k] = k === 'cap' ? v.trim().slice(0, 40) : v; phSort();
  roomRef().collection('meta').doc(id).update({ [k]: p[k] }).catch(e => toast('☁️ 저장 실패: ' + e.message));
  render();
}
function dashPhoto() {
  const N = DASH.phNew || [];
  return `<section id="dashPhoto"><h4>1. 사진 넣기</h4>
    <p class="mini">사진을 복사하거나 캡처한 뒤 이 창에서 <b>Ctrl+V</b> 하면 들어와요. 여러 장도 돼요. 크기는 알아서 줄여서 올려요.<br>🔒 학생 얼굴이 나온 사진은 선생님 계정으로 로그인했을 때만 보여요.</p>
    <label class="btn sm ghost" style="margin-top:6px">🖼 사진 파일 고르기<input type="file" accept="image/*" multiple hidden onchange="photoFiles(this.files)"></label>
    ${N.length ? `<div class="row" style="margin-top:10px;align-items:flex-start">${N.map((p, i) => `<div style="width:170px">
        <div style="position:relative"><img src="data:${p.mime};base64,${p.data}" style="width:170px;height:120px;object-fit:cover;border-radius:10px;display:block">
          <button class="x" style="position:absolute;top:2px;right:4px;background:#fff;border-radius:50%" onclick="DASH.phNew.splice(${i},1);dashRefresh()">✕</button></div>
        <input type="text" value="${esc(p.cap)}" placeholder="한 줄 설명 (예: 체육대회)" oninput="DASH.phNew[${i}].cap=this.value" style="margin-top:4px;padding:4px 8px;font-size:13px">
        <input type="date" value="${p.date}" onchange="DASH.phNew[${i}].date=this.value" style="margin-top:4px;padding:4px 8px;font-size:13px"></div>`).join('')}</div>
      <div class="row" style="margin-top:10px"><button class="btn" onclick="photoSave()">📷 ${N.length}장 올리기</button><button class="btn ghost sm" onclick="DASH.phNew=[];dashRefresh()">비우기</button></div>` : ''}
  </section>
  <section><h4>2. 올린 사진 <span class="mini">${phLoaded ? PH.length + '장 · 최근 날짜부터 달력 아래에 보여요' : '불러오는 중…'}</span></h4>
    ${PH.length ? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px">${PH.map(p => `<div>
        <div style="position:relative"><img src="data:image/jpeg;base64,${p.img}" style="width:100%;height:110px;object-fit:cover;border-radius:10px;display:block">
          <button class="x" title="지우기" style="position:absolute;top:2px;right:4px;background:#fff;border-radius:50%" onclick="photoDel('${p.id}')">🗑</button></div>
        <input type="text" value="${esc(p.cap || '')}" placeholder="설명" onchange="photoSet('${p.id}','cap',this.value)" style="margin-top:4px;padding:3px 7px;font-size:12.5px">
        <input type="date" value="${p.date || ''}" onchange="photoSet('${p.id}','date',this.value);dashRefresh()" style="margin-top:3px;padding:3px 7px;font-size:12.5px"></div>`).join('')}</div>`
      : '<div class="empty">아직 올린 사진이 없어요 📷</div>'}
  </section>`;
}
// 달력 화면 맨 아래: 최근 사진 3장 가운데 정렬 (모두 보기 · 사진 넣기는 머리 오른쪽 단추)
function viewGallery() {

const galFig = p => `<figure onclick="photoView('${p.id}')"><img src="data:image/jpeg;base64,${p.img}" loading="lazy" alt="${esc(p.cap || '우리반 사진')}">

function photoAll() { openModal(`📷 우리반 사진 ${PH.length}장`, `<div class="gal gal-all">${PH.map(galFig).join('')}</div>`, true); }
