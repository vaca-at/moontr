<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리반 생기부노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* 🔤 온글잎 언즈체 (눈누 웹폰트) */
@font-face{font-family:'OngleipUnz';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2406-1@1.0/Ownglyph_UNZ-Rg.woff2') format('woff2');font-weight:normal;font-display:swap;}

:root{
  --bg:#fff7f2;--card:#fff;--ink:#4b3a3a;--sub:#9b8782;--line:#f2ddd6;--soft:#fdf1ec;
  --main:#ee8fad;--mainL:#fde8ef;
  --pink:#ee8fad;--pinkL:#fde8ef;--green:#7fc59a;--greenL:#e7f6ed;--mustard:#d9a74c;--mustardL:#fbf1dd;
  --purple:#a68fd8;--purpleL:#f0eafb;--blue:#7aaedb;--blueL:#e7f1fb;--red:#e0556a;--navy:#2f3b5c;
  --hand:'OngleipUnz','Gaegu',cursive;--body:'Pretendard',system-ui,sans-serif;
}
body[data-theme=mint]{--bg:#f2faf6;--line:#d3ece0;--soft:#e9f6ef;--main:#5fb894;--mainL:#dff3e9}
body[data-theme=lavender]{--bg:#f7f4fd;--line:#e3dbf5;--soft:#efe9fb;--main:#9a83d6;--mainL:#ece5fb}
body[data-font=gaegu]{--hand:'Gaegu',cursive}
body[data-font=dodum]{--hand:'Gowun Dodum',sans-serif}
body[data-big=on]{font-size:18px}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.55}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.hand{font-family:var(--hand)}
h1,h2,h3,h4{font-family:var(--hand);font-weight:700;margin:0}

/* ---------- 헤더 ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-bottom:1.5px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--pinkL),var(--mainL));display:grid;place-items:center;font-size:22px;box-shadow:0 2px 0 var(--line)}
.tag{background:var(--main);color:#fff;border-radius:99px;padding:3px 12px;font-family:var(--hand);font-size:15px}
.title{font-family:var(--hand);font-size:24px;font-weight:700}
.title small{font-size:14px;color:var(--sub);font-weight:400;margin-left:6px}
.nav{display:flex;gap:6px;margin-left:12px;flex-wrap:wrap}
.right{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;cursor:pointer;font-family:var(--hand);font-size:16px;transition:.15s;white-space:nowrap}
.pill:hover{border-color:var(--main)}
.pill.on{background:var(--main);border-color:var(--main);color:#fff}
.pill.dash{border-style:dashed;border-color:var(--main);color:var(--main)}
.badge{font-size:12px;border-radius:99px;padding:2px 9px;background:var(--soft);color:var(--sub);border:1px dashed var(--line);font-family:var(--body)}

main{padding:18px;max-width:1500px;margin:0 auto}

/* ---------- 공통 카드 (특강 웹앱 느낌) ---------- */
.cols{display:grid;gap:16px}
.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}
.box{background:var(--card);border:1.5px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.box>.hd{padding:11px 16px;color:#fff;font-family:var(--hand);font-size:20px;display:flex;align-items:center;gap:8px}
.box>.hd .n{width:26px;height:26px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;font-size:15px}
.box>.hd .sp{margin-left:auto}
.box>.bd{padding:16px;flex:1}
.hd.pink{background:var(--pink)}.hd.green{background:var(--green)}.hd.mustard{background:var(--mustard)}.hd.purple{background:var(--purple)}.hd.blue{background:var(--blue)}
.lead{font-family:var(--hand);font-size:21px;margin:0 0 12px}
.lead mark{background:linear-gradient(transparent 55%,var(--mainL) 55%);color:inherit}
.mini{font-size:12.5px;color:var(--sub)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{margin-bottom:10px}
.field label{display:block;font-family:var(--hand);font-size:16px;margin-bottom:4px}
input[type=text],input[type=date],input[type=number],input[type=password],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--main)}
textarea{resize:vertical;min-height:80px}
.btn{border:none;border-radius:99px;padding:8px 16px;cursor:pointer;background:var(--main);color:#fff;font-family:var(--hand);font-size:17px;white-space:nowrap}
.btn:hover{filter:brightness(.96)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:4px 11px;font-size:15px}
.btn.ai{background:linear-gradient(90deg,#f19ab6,#b493e6)}
.btn:disabled{opacity:.5;cursor:wait}
.x{border:none;background:none;cursor:pointer;color:var(--sub);font-size:14px}
.x:hover{color:var(--red)}
.empty{color:var(--sub);text-align:center;padding:22px 8px;font-size:13.5px;border:1.5px dashed var(--line);border-radius:12px}
.item{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff}
.item .top{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.chip{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12.5px;background:var(--soft);border:1px solid var(--line)}
.chip.자율{background:var(--pinkL);border-color:#f6c6d6}.chip.진로{background:var(--greenL);border-color:#bfe3cc}
.chip.동아리{background:var(--mustardL);border-color:#efd7a5}.chip.행특{background:var(--purpleL);border-color:#d8cdf2}
.chip.독서{background:var(--blueL);border-color:#c5dcf2}.chip.심화탐구{background:#fff2e6;border-color:#f3d2b0}
.copybox{background:#fffdf8;border:1.5px dashed var(--mustard);border-radius:12px;padding:12px;white-space:pre-wrap;font-size:13px}
.ai-out{background:linear-gradient(180deg,#fff,#fffaf6);border:1.5px dashed var(--main);border-radius:12px;padding:12px 14px;font-size:14px}
.ai-out h4{font-size:18px;margin:8px 0 4px;color:var(--main)}
.ai-out li{margin-left:14px}

/* ---------- 달력 (좋아하는 달력 화면) ---------- */
.calwrap{background:#fdfdf8;border:1.5px solid var(--line);border-radius:8px;padding:14px 18px}
.calhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.calhead h2{font-size:28px}
.dow,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.dow div{text-align:center;font-family:var(--hand);font-size:15px;color:var(--navy);padding:4px 0}
.dow div:first-child{color:var(--red)}.dow div:last-child{color:#3a63c9}
.cell{min-height:112px;border:1.5px solid #cfe0e6;border-radius:12px;background:#fff;padding:8px 9px 22px;position:relative;cursor:pointer;transition:.12s}
.cell:hover{border-color:var(--main);transform:translateY(-1px)}
.cell.future{background:#f7f9fb}
.cell.blank{visibility:hidden}
.cell.today{border:2px solid var(--red)}
.cell.sel{box-shadow:0 0 0 3px var(--mainL)}
.dnum{font-family:var(--hand);font-weight:700;font-size:19px;color:var(--navy)}
.dnum.sun{color:var(--red)}.dnum.sat{color:#3a63c9}
.hname{font-family:var(--hand);font-size:12.5px;color:var(--red);margin-left:5px}
.ev{background:#fde9b8;border-radius:5px;font-size:11.5px;padding:2px 7px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--hand)}
.ev.cs{background:var(--pinkL)}
.dots{position:absolute;left:9px;bottom:7px;display:flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;opacity:.28}
.dots i.on{opacity:1}
.dots i:nth-child(1){background:#e59bb3}.dots i:nth-child(2){background:#8fb0e4}.dots i:nth-child(3){background:#8fcf98}
.calnote{font-family:var(--hand);font-size:14.5px;color:var(--ink);margin-top:10px}

/* ---------- 학생 노트 레이아웃 ---------- */
.note{display:grid;grid-template-columns:250px 1fr;gap:18px;align-items:start}
.side{position:sticky;top:78px;max-height:calc(100vh - 96px);overflow:auto;padding-right:4px}
.side h3{font-size:19px;display:flex;align-items:center;margin-bottom:8px}
.sitem{display:flex;gap:10px;align-items:center;padding:9px 10px;margin-bottom:6px;cursor:pointer;background:#fff;border-radius:4px;clip-path:polygon(0 0,94% 0,100% 50%,94% 100%,0 100%);transition:.12s}
.sitem:hover{background:var(--soft)}
.sitem .num{width:30px;height:30px;border-radius:50%;border:2px solid var(--main);display:grid;place-items:center;font-size:17px;flex:none;background:#fff}
.sitem b{font-family:var(--hand);font-size:17px;font-weight:700;display:block;line-height:1.1}
.sitem span{font-size:11.5px;color:var(--sub)}
.sitem.on{background:var(--main);color:#fff}
.sitem.on span{color:#fff}
.sitem.on .num{border-color:#fff}
.sitem.on .warn{background:#fff;color:var(--red)}
.sitem .warn{margin-left:auto;font-size:11px;background:#fff0f2;color:var(--red);border-radius:99px;padding:0 6px}

.stitle{display:flex;align-items:baseline;gap:12px;margin:2px 0 12px;flex-wrap:wrap}
.stitle .big{font-family:var(--hand);font-size:44px;color:var(--main);line-height:1}
.stitle h2{font-size:28px}
.secbar{height:4px;border-radius:4px;background:var(--line);margin-bottom:14px;overflow:hidden}
.secbar i{display:block;height:100%;background:var(--main);transition:.3s}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.step{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:99px;background:#fff;padding:5px 14px 5px 6px;cursor:pointer}
.step .c{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--hand);font-size:15px}
.step b{font-family:var(--hand);font-size:16px;font-weight:700}
.step.on{background:var(--main);border-color:var(--main);color:#fff}
.step.on .c{background:#fff!important;color:var(--main)}

/* ---------- 문장 담벼락 ---------- */
.wallgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.post{border-radius:4px 4px 14px 4px;padding:12px 12px 10px;box-shadow:0 3px 0 rgba(0,0,0,.05);position:relative;font-size:13.5px;display:flex;flex-direction:column;gap:8px;border:1.5px solid transparent}
.post.자율{background:#ffeef4}.post.진로{background:#eaf8ef}.post.동아리{background:#fff4dc}.post.행특{background:#f2edfd}
.post.picked{border-color:var(--main);box-shadow:0 0 0 3px var(--mainL)}
.post .pin{position:absolute;top:-7px;left:50%;transform:translateX(-50%);font-size:15px}
.post .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.post .acts{display:flex;gap:6px;align-items:center;margin-top:auto}
.post textarea{min-height:90px;font-size:13px}
.post select{width:auto;padding:2px 6px;font-size:12px;border-radius:8px}
.basket{border:1.5px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px;background:#fff}
.basket h4{font-size:18px;display:flex;align-items:center;gap:6px;margin-bottom:6px}
.bitem{display:flex;gap:6px;font-size:12.5px;padding:6px 8px;border-radius:8px;background:var(--soft);margin-bottom:5px;align-items:flex-start}
.bitem div{flex:1}
.meter{height:7px;border-radius:7px;background:var(--line);overflow:hidden;margin:6px 0 2px}
.meter i{display:block;height:100%;background:var(--green)}
.meter i.over{background:var(--red)}

/* ---------- 우리반 한눈에 ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 16px}
.stat b{font-family:var(--hand);font-size:32px;color:var(--main);display:block;line-height:1.1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.scard{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;transition:.12s}
.scard:hover{border-color:var(--main);transform:translateY(-2px)}
.scard .face{font-size:30px;width:50px;height:50px;border-radius:14px;display:grid;place-items:center;background:var(--soft)}
.scard h4{font-size:20px}
.adots{display:flex;gap:4px;margin-top:8px}
.adots span{font-size:11px;border-radius:99px;padding:0 7px;border:1px solid var(--line);color:var(--sub)}
.adots span.ok{background:var(--greenL);color:#3d8a5a;border-color:#bfe3cc}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px}
.bar .t{width:90px;font-family:var(--hand);font-size:15px}
.bar .g{flex:1;height:14px;background:var(--soft);border-radius:8px;overflow:hidden}
.bar .g i{display:block;height:100%;background:var(--main);border-radius:8px}

/* ---------- 모달·토스트 ---------- */
.modal{position:fixed;inset:0;background:rgba(70,50,50,.28);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 14px;overflow:auto}
.modal.on{display:flex}
.sheet{background:#fff;border-radius:18px;max-width:720px;width:100%;border:1.5px solid var(--line);overflow:hidden}
.sheet.wide{max-width:1040px}
.dtable{width:100%;font-size:13.5px;border-collapse:collapse}
.dtable th{text-align:left;font-weight:600;color:var(--sub);padding:4px;border-bottom:1.5px solid var(--line)}
.dtable td{padding:3px 4px}
.dtable input{padding:5px 7px}
.dtable td{white-space:pre-wrap;vertical-align:top}
.rep{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff}
.rep th,.rep td{border:1px solid #6b5a5a;padding:7px 9px;vertical-align:middle}
.rep th{background:var(--soft);font-weight:600}
.rep .hope{border-bottom:1px dashed #9b8782;padding-bottom:4px;margin-bottom:4px}
.repwrap{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:#fffdfb}
.sheet .hd{background:var(--main);color:#fff;padding:12px 18px;font-family:var(--hand);font-size:22px;display:flex}
.sheet .bd{padding:18px}
.sheet section{border:1.5px dashed var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.sheet section h4{font-size:19px;margin-bottom:8px}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emojis button{font-size:22px;width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer}
.emojis button.on{border-color:var(--main);background:var(--mainL)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;transition:.25s;z-index:60;opacity:0}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}
.spin{display:inline-block;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
footer{text-align:center;color:var(--sub);font-size:12px;padding:20px}

@media(max-width:1100px){.c3,.c4{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}}
@media(max-width:820px){.note{grid-template-columns:1fr}.side{position:static;max-height:none}.c2,.c3,.c4{grid-template-columns:1fr}.cell{min-height:70px;padding:5px 5px 18px}.ev{font-size:10px;padding:1px 4px}.dnum{font-size:15px}.hname{display:none}.cal,.dow{gap:4px}main{padding:12px}}
</style>
</head>
<body data-theme="peach" data-font="unz">

<header>
  <div class="logo">🫶</div>
  <span class="tag" id="classTag">1학년 10반</span>
  <div class="title">우리반 생기부노트 <small>상담 · 성장 · 생기부</small></div>
  <nav class="nav" id="nav"></nav>
  <div class="right">
    <span class="badge" id="syncBadge">🔒 로그인 전</span>
    <button class="pill dash" id="adminBtn" style="display:none" onclick="openDash()">🛠 관리</button>
    <span class="badge">🔒 이름 없음</span>
    <button class="pill" onclick="cycleTheme()">🎨 꾸미기</button>
    <button class="pill" onclick="cycleFont()">🔤 글꼴</button>
    <button class="pill" onclick="toggleBig()">🔍 크게</button>
    <button class="pill" onclick="openSettings()">⚙️ 설정</button>
  </div>
</header>

<main id="app"></main>
<footer>우리반 생기부노트 ·학생 이름·연락처는 저장하지 않아요 · 동물 친구 별칭과 번호로만 기록해요</footer>

<div class="modal" id="modal"><div class="sheet"><div class="hd"><span id="mTitle"></span><button class="x" style="margin-left:auto;color:#fff;font-size:20px" onclick="closeModal()">✕</button></div><div class="bd" id="mBody"></div></div></div>
<div id="toast"></div>

<script>
/* =========================================================
   우리반 생기부노트 - index.html 한 파일
   · 학생은 동물 친구(이모지+별칭+번호)로만 구분 → 이름 저장 안 함
   · 성적 파일 · 출결은 학번(번호) + 칸만, 선생님 계정 클라우드에만 저장 (이 기기에는 안 남김)
   · 저장: 기본은 이 기기(localStorage), 선생님 구글 계정으로 로그인하면 클라우드(공부방 파이어베이스)
   · AI: Claude 또는 Gemini API 키 (키는 이 기기에만 저장, 클라우드로 안 올라감)
   ========================================================= */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const today = () => ymd(new Date());
const daysAgo = s => Math.floor((new Date(today()) - new Date(s)) / 86400000);
const load = (k, d) => { try { return Object.assign(Array.isArray(d) ? [] : {}, d, JSON.parse(localStorage.getItem(k) || 'null') || {}); } catch (e) { return d; } };
const clone = o => JSON.parse(JSON.stringify(o));

const AREAS = [
  { k: '자율', label: '자율·자치활동', color: 'pink', limit: 1500 },
  { k: '진로', label: '진로활동', color: 'green', limit: 2100 },
  { k: '동아리', label: '동아리활동', color: 'mustard', limit: 1500 },
  { k: '행특', label: '행동특성 및 종합의견', color: 'purple', limit: 1500 },
];
const ACT_AREAS = ['자율', '진로', '동아리', '독서', '심화탐구', '기타'];
const CS_TYPES = ['정기 상담', '진로', '학업', '교우관계', '생활', '마음', '학부모'];
const MOCK_SUBJ = ['국어', '수학', '영어', '한국사', '통합사회', '통합과학'];

function piiCheck(t) {
  const w = [];
  if (/\b\d{5}\b/.test(t)) w.push('학번처럼 보이는 다섯 자리 숫자');
  if (/01[016789][-\s.]?\d{3,4}[-\s.]?\d{4}/.test(t)) w.push('전화번호');
  if (/[\w.-]+@[\w.-]+\.\w+/.test(t)) w.push('이메일 주소');
  if (/\d{6}[-\s]?[1-4]\d{6}/.test(t)) w.push('주민등록번호');
  return w;
}
function piiOk(t) {
  const w = piiCheck(t);
  if (!w.length) return true;
  return confirm('🔒 개인정보처럼 보이는 내용이 있어요: ' + w.join(', ') + '\n\n지우고 다시 쓰는 걸 권해요. 그래도 저장할까요?');
}

// user: 글만 보낼 때는 문자열, 사진도 보낼 때는 { text, images: [{ mime, data(base64) }] }
async function callAI(system, user, maxTokens = 1800) {
  if (!S.apiKey) { openSettings(); throw new Error('설정에서 AI 키를 먼저 넣어 주세요'); }
  const text = typeof user === 'string' ? user : user.text;
  const imgs = typeof user === 'string' ? [] : (user.images || []);
  if (S.provider === 'claude') {
    const content = imgs.length ? [...imgs.map(m => ({ type: 'image', source: { type: 'base64', media_type: m.mime, data: m.data } })), { type: 'text', text }] : text;
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-api-key': S.apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: S.model || 'claude-sonnet-5-5', max_tokens: maxTokens, system, messages: [{ role: 'user', content }] })
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error?.message || ('오류 ' + r.status));
    return (j.content || []).map(c => c.text || '').join('');
  } else {
    const m = S.model || 'gemini-2.5-flash';
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:generateContent?key=${encodeURIComponent(S.apiKey)}`, {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ systemInstruction: { parts: [{ text: system }] }, contents: [{ role: 'user', parts: [...imgs.map(m => ({ inline_data: { mime_type: m.mime, data: m.data } })), { text }] }], generationConfig: { maxOutputTokens: maxTokens * 2 } })
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error?.message || ('오류 ' + r.status));
    return j.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || '';
  }
}

async function genSentences(st, text, source, btn) {
  if (!text.trim()) return toast('내용을 먼저 적어 주세요');
  if (!piiOk(text)) return;
  await withBusy(btn, async () => {
    const out = await callAI(SYS_RULES + `
출력 형식: 반드시 JSON 배열만 출력한다. 다른 말은 쓰지 않는다.
[{"area":"자율|진로|동아리|행특 중 하나","trait":"드러나는 특성 2~6글자","text":"생기부 문구"}]
- 관찰 내용에서 드러나는 특성마다 하나씩, 3~5개를 만든다.
- 각 text는 1~2문장, 한글 80~170자.
- area는 내용에 가장 잘 맞는 영역: 학급·학교 공동체 활동은 자율, 진로 탐색·심화 탐구·진로 독서는 진로, 동아리 맥락은 동아리, 인성·태도·관계·성장은 행특.`,
      `[학생 맥락]\n${studentContext(st)}\n\n[관찰 내용 - ${source}]\n${text}`);
    const arr = parseJSONArray(out);
    if (!arr.length) throw new Error('문구를 읽지 못했어요. 다시 눌러 주세요');
    arr.forEach(a => st.sentences.push({
      id: uid(), text: String(a.text || '').trim(), area: AREAS.some(x => x.k === a.area) ? a.area : '행특',
      trait: String(a.trait || '').slice(0, 10), source, picked: false, pickedAt: 0, date: today()
    }));
    saveStudent(st);
    toast(`✨ 문구 ${arr.length}개가 담벼락에 붙었어요`);
    render();
  });
}
function parseJSONArray(t) {
  try { const a = t.indexOf('['), b = t.lastIndexOf(']'); return JSON.parse(t.slice(a, b + 1)) || []; } catch (e) { return []; }
}

/* ---------------- 바이트 (나이스 기준: 한글 3, 영문·숫자·공백 1, 줄바꿈 2) ---------------- */
function nbytes(t) { let b = 0; for (const ch of String(t || '')) { if (ch === '\n') b += 2; else b += ch.charCodeAt(0) > 127 ? 3 : 1; } return b; }

/* ---------------- 화면 그리기 ---------------- */
function render() {
  document.body.dataset.theme = S.theme; document.body.dataset.font = S.font; document.body.dataset.big = S.big;
  $('#classTag').textContent = S.className || '우리반';
  const tabs = [['cal', '📅 달력'], ['class', '🏡 우리반 한눈에'], ['note', '📒 학생 노트']];
  $('#nav').innerHTML = tabs.map(([k, t]) => `<button class="pill ${V.tab === k ? 'on' : ''}" onclick="go('${k}')">${t}</button>`).join('');
  charts.forEach(c => c.destroy()); charts = [];
  const app = $('#app');
  if (syncState !== 'cloud') app.innerHTML = viewGate();
  else if (V.tab === 'cal') app.innerHTML = viewCalendar();
  else if (V.tab === 'class') app.innerHTML = viewClass();
  else { app.innerHTML = viewNote(); if (V.sec === 3 && cur()) drawCharts(cur()); }
}
function go(t) { V.tab = t; render(); window.scrollTo(0, 0); }

/* ===== 1. 달력 ===== */
function dayData(ds) {
  const ev = D.events.filter(e => e.date === ds);
  const cs = [], act = [], next = [];
  D.students.forEach(st => {
    st.counsels.forEach(c => { if (c.date === ds) cs.push({ st, c }); if (c.next === ds) next.push({ st, c }); });
    st.episodes.forEach(e => { if (e.date === ds) act.push({ st, t: '일화', x: e.text }); });
    st.acts.forEach(a => { if (a.date === ds) act.push({ st, t: a.area, x: a.title || a.text }); });
  });
  return { ev, cs, act, next };
}
function viewCalendar() {
  const { y, m } = V;
  const first = new Date(y, m, 1).getDay(), last = new Date(y, m + 1, 0).getDate();
  const td = today();
  let cells = '';
  for (let i = 0; i < first; i++) cells += '<div class="cell blank"></div>';
  for (let d = 1; d <= last; d++) {
    const ds = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const dow = (first + d - 1) % 7, hol = HOLIDAYS[ds];
    const dd = dayData(ds);
    const chips = [
      ...dd.ev.map(e => `<div class="ev">${esc(e.title)}</div>`),
      ...dd.next.map(n => `<div class="ev cs">${n.st.emoji} 상담 예정</div>`)
    ];
    const shown = chips.slice(0, 3).join('') + (chips.length > 3 ? `<div class="mini">+${chips.length - 3}</div>` : '');
    cells += `<div class="cell ${ds > td ? 'future' : ''} ${ds === td ? 'today' : ''} ${ds === V.sel ? 'sel' : ''}" onclick="pickDay('${ds}')">
      <span class="dnum ${dow === 0 || hol ? 'sun' : dow === 6 ? 'sat' : ''}">${d}</span>${hol ? `<span class="hname">${hol}</span>` : ''}
      ${shown}
      <div class="dots"><i class="${dd.cs.length ? 'on' : ''}"></i><i class="${dd.act.length ? 'on' : ''}"></i><i class="${dd.ev.length || dd.next.length ? 'on' : ''}"></i></div>
    </div>`;
  }
  return `
  <div class="cols" style="grid-template-columns:minmax(0,2.2fr) minmax(280px,1fr)">
    <div class="calwrap">
      <div class="calhead">
        <button class="pill" onclick="moveMonth(-1)">◀</button>
        <h2>${y}년 ${m + 1}월</h2>
        <button class="pill" onclick="moveMonth(1)">▶</button>
        <button class="pill dash" onclick="moveMonth(0)">오늘</button>
      </div>
      <div class="dow"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
      <div class="cal">${cells}</div>
      <div class="calnote">날짜를 누르면 오른쪽에서 그날 일정·상담을 볼 수 있어요. 칸 아래 점 세 개는 <b style="color:#e59bb3">상담</b> · <b style="color:#8fb0e4">일화·활동</b> · <b style="color:#8fcf98">일정</b>이에요 (색칠된 점 = 있음).</div>
    </div>
    ${viewDayPanel()}
  </div>`;
}

      ${dd.cs.map(x => `<div class="item" style="cursor:pointer" onclick="openStudent('${x.st.id}',2)"><div class="top"><span class="chip 자율">${esc(x.c.type)}</span><b class="hand" style="font-size:16px">${esc(sname(x.st))}</b></div><div class="mini">${esc(x.c.text.slice(0, 70))}${x.c.text.length > 70 ? '…' : ''}</div></div>`).join('')}
      ${dd.act.map(x => `<div class="item"><div class="top"><span class="chip ${esc(x.t)}">${esc(x.t)}</span><b class="hand" style="font-size:16px">${esc(sname(x.st))}</b></div><div class="mini">${esc(String(x.x).slice(0, 60))}</div></div>`).join('')}

      <div class="field"><label>💬 이날 상담 바로 기록</label>
        ${D.students.length ? `<select id="qSt">${opts}</select>
        <select id="qType" style="margin-top:6px">${CS_TYPES.map(t => `<option>${t}</option>`).join('')}</select>
        <textarea id="qText" style="margin-top:6px" placeholder="오늘 나눈 이야기를 편하게 적어요"></textarea>
        <div class="row" style="margin-top:6px"><span class="mini">다음 상담</span><input type="date" id="qNext" style="width:auto"><button class="btn sm" style="margin-left:auto" onclick="quickCounsel()">저장</button></div>`
        : '<div class="empty">학생 노트에서 동물 친구를 먼저 추가해 주세요</div>'}
      </div>
    </div></div>`;
}
function pickDay(ds) { V.sel = ds; render(); }
function moveMonth(k) {
  if (k === 0) { const n = new Date(); V.y = n.getFullYear(); V.m = n.getMonth(); V.sel = today(); }
  else { V.m += k; if (V.m < 0) { V.m = 11; V.y--; } if (V.m > 11) { V.m = 0; V.y++; } }
  render();
}
function addEvent() {
  const t = $('#evTitle').value.trim(); if (!t) return;
  if (!piiOk(t)) return;
  D.events.push({ id: uid(), date: V.sel, title: t }); saveEvents(); render();
}
function delEvent(id) { D.events = D.events.filter(e => e.id !== id); saveEvents(); render(); }
function quickCounsel() {
  const st = D.students.find(s => s.id === $('#qSt').value); const text = $('#qText').value.trim();
  if (!st || !text) return toast('내용을 적어 주세요');
  if (!piiOk(text)) return;
  st.counsels.push({ id: uid(), date: V.sel, type: $('#qType').value, text, next: $('#qNext').value || '' });
  saveStudent(st); toast('💬 상담이 기록됐어요'); render();
}

/* ===== 2. 우리반 한눈에 ===== */
function lastCounsel(st) { return st.counsels.map(c => c.date).sort().pop() || ''; }
function viewClass() {
  const L = D.students;
  const ym = today().slice(0, 7);
  const monthCs = L.reduce((n, s) => n + s.counsels.filter(c => c.date.startsWith(ym)).length, 0);
  const late = L.filter(s => { const l = lastCounsel(s); return !l || daysAgo(l) > 30; });
  const sent = L.reduce((n, s) => n + s.sentences.length, 0);
  const cnt = {}; L.forEach(s => { const k = s.career || '미정'; cnt[k] = (cnt[k] || 0) + 1; });
  const max = Math.max(1, ...Object.values(cnt));
  const sorted = [...L].sort((a, b) => (lastCounsel(a) || '0000').localeCompare(lastCounsel(b) || '0000'));
  return `
  <div class="stitle"><span class="big">✿</span><h2>우리반 한눈에</h2><span class="mini">상담이 오래된 친구부터 보여요</span></div>
  <div class="stats">
    <div class="stat"><b>${L.length}</b>동물 친구</div>
    <div class="stat"><b>${monthCs}</b>이번 달 상담</div>
    <div class="stat"><b style="color:var(--red)">${late.length}</b>30일 넘게 못 만난 친구</div>
    <div class="stat"><b>${sent}</b>담벼락 문구</div>
  </div>
  <div class="cols" style="grid-template-columns:minmax(0,2.4fr) minmax(260px,1fr)">
    <div>${L.length ? `<div class="cards">${sorted.map(s => {
      const l = lastCounsel(s), dA = l ? daysAgo(l) : null;
      return `<div class="scard" onclick="openStudent('${s.id}',1)">
        <div class="row"><div class="face">${s.emoji}</div><div><h4>${esc(nname(s))}</h4><span class="chip">${esc(s.career || '진로 미정')}</span></div></div>
        <div class="mini" style="margin-top:8px">💬 ${l ? `마지막 상담 <b style="color:${dA > 30 ? 'var(--red)' : 'var(--ink)'}">${dA}일 전</b>` : '<b style="color:var(--red)">아직 상담 전</b>'} · 상담 ${s.counsels.length}회</div>
        <div class="mini">🌱 활동 ${s.acts.length} · 일화 ${s.episodes.length} · 문구 ${s.sentences.length}</div>
        <div class="adots">${AREAS.map(a => `<span class="${s.final[a.k] ? 'ok' : ''}">${a.k}</span>`).join('')}</div>
      </div>`; }).join('')}</div>` : '<div class="empty">학생 노트에서 동물 친구를 추가하면 여기에 모여요 🐰🐻🐱</div>'}</div>
    <div class="box"><div class="hd green"><span class="n">✿</span>희망 진로 분야</div><div class="bd">
      ${Object.keys(cnt).length ? Object.entries(cnt).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div class="bar"><span class="t">${esc(k)}</span><span class="g"><i style="width:${v / max * 100}%"></i></span><b>${v}</b></div>`).join('') : '<div class="empty">아직 없어요</div>'}
      <hr style="border:none;border-top:1.5px dashed var(--line);margin:14px 0">
      <h4 style="font-size:18px;margin-bottom:6px">🔔 다가오는 상담 약속</h4>
      ${upcoming().map(x => `<div class="item" style="cursor:pointer" onclick="openStudent('${x.st.id}',2)"><b class="hand" style="font-size:16px">${esc(sname(x.st))}</b> <span class="mini">${x.c.next}</span></div>`).join('') || '<div class="empty">예정된 상담이 없어요</div>'}
    </div></div>
  </div>`;
}
function upcoming() {
  const t = today(), out = [];
  D.students.forEach(st => st.counsels.forEach(c => { if (c.next && c.next >= t) out.push({ st, c }); }));
  return out.sort((a, b) => a.c.next.localeCompare(b.c.next)).slice(0, 8);
}

function md(t) {
  return esc(t).replace(/^#{1,4}\s*(.*)$/gm, '<h4>$1</h4>').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/^\s*[-•*]\s+(.*)$/gm, '<li>$1</li>').replace(/\n(?=<h4>|<li>)/g, '').replace(/(<\/h4>|<\/li>)\n/g, '$1').replace(/\n/g, '<br>');
}

function delIn(key, id) { if (!confirm('지울까요?')) return; const st = cur(); st[key] = st[key].filter(x => x.id !== id); saveStudent(st); render(); }

/* 3 성장 그래프 */
// 그래프에 쓸 줄: 관리에서 올린 성적 파일(번호로 찾기) + 여기서 직접 넣은 등급
function growthRows(st, kind) {
  const max = kind === 'mock' ? 9 : 5, rows = [], files = [];
  scoreDocs().filter(d => examOf(d).kind === kind).forEach(d => {
    const r = st.num ? d.rows.find(x => x.no === st.num) : null;
    if (!r) return;
    const o = { label: `${String(d.year).slice(2)}년 ${examOf(d).short}`, _k: d.year * 100 + EXAMS.findIndex(e => e.id === d.exam) };
    gradeCols(d, max).forEach(c => { const v = Number(r.v[c.i]); if (r.v[c.i] !== '' && !isNaN(v)) o[c.subj] = v; });
    rows.push(o); files.push({ d, r });
  });
  // 교과학습발달상황(나이스 학기 성적)의 석차등급 → 내신 그래프
  if (kind === 'school' && st.num) gyogwaDocs().forEach(d => {
    const rs = d.rows.filter(r => r.no === st.num); if (!rs.length) return;
    const iS = d.cols.findIndex(c => c === '과목'), iG = d.cols.findIndex(c => /석차/.test(c));
    const o = { label: `${String(d.year).slice(2)}년 ${d.sem}학기 (나이스)`, _k: d.year * 100 + (d.sem == 2 ? 9.5 : 6.5) };
    rs.forEach(r => { const v = Number(r.v[iG]); if (iG >= 0 && r.v[iG] !== '' && !isNaN(v)) o[r.v[iS]] = v; });
    rows.push(o);
  });
  rows.sort((a, b) => a._k - b._k);
  st[kind === 'mock' ? 'mocks' : 'grades'].forEach(r => { const o = { label: r.label }; Object.keys(r).forEach(k => { if (k !== 'id' && k !== 'label') o[k] = r[k]; }); rows.push(o); });
  rows.forEach(r => delete r._k);
  const subj = [...new Set(rows.flatMap(r => Object.keys(r).filter(k => k !== 'label')))];
  return { rows, subj, files };
}
function secGrowth(st) {
  const M = growthRows(st, 'mock'), G = growthRows(st, 'school');
  // 이 친구 줄만 성적표 원본 그대로 (원점수 · 백분위 등)

    ${F.files.map(({ d, r }) => `<div style="overflow:auto;margin-top:8px"><b class="mini">${d.year}년 ${esc(examOf(d).label)}</b><table class="dtable"><tr>${d.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr><tr>${r.v.map(v => `<td>${esc(v)}</td>`).join('')}</tr></table></div>`).join('')}</details>` : '';

    ${subj.map(s => `<input type="number" step="0.01" min="1" max="${kind === 'mocks' ? 9 : 5}" id="${kind}_${s}" placeholder="${s}" style="width:82px">`).join('')}
    <button class="btn sm" onclick="addScore('${kind}')">추가</button></div>`;
  const table = (kind, subj) => st[kind].length ? `<table style="width:100%;font-size:13px;margin-top:10px;border-collapse:collapse">
    <tr>${['', ...subj, ''].map(h => `<th style="text-align:left;border-bottom:1.5px solid var(--line);padding:4px">${h}</th>`).join('')}</tr>
    ${st[kind].map(r => `<tr><td style="padding:4px"><b>${esc(r.label)}</b></td>${subj.map(s => `<td>${r[s] ?? '-'}</td>`).join('')}<td><button class="x" onclick="delIn('${kind}','${r.id}')">✕</button></td></tr>`).join('')}</table>` : '';
  return `<div class="cols c2">
    <div class="box"><div class="hd blue"><span class="n">1</span>모의고사 등급 <span class="sp mini" style="color:#fff">9등급 · 위로 갈수록 좋아요</span></div><div class="bd">
      ${noNum}${M.rows.length ? '<canvas id="chMock" height="220"></canvas>' : '<div class="empty">🛠 관리에서 성적 파일을 올리거나 아래에 직접 넣으면 그래프가 그려져요 📈</div>'}
      ${orig(M)}
      <details style="margin-top:10px"><summary class="mini" style="cursor:pointer">✍️ 직접 넣기</summary>${form('mocks', MOCK_SUBJ)}${table('mocks', MOCK_SUBJ)}</details>
    </div></div>
    <div class="box"><div class="hd pink"><span class="n">2</span>내신 등급 <span class="sp mini" style="color:#fff">5등급제 · 위로 갈수록 좋아요</span></div><div class="bd">
      ${noNum}${G.rows.length ? '<canvas id="chGrade" height="220"></canvas>' : '<div class="empty">🛠 관리에서 성적 파일을 올리거나 아래에 직접 넣어 주세요 🌱</div>'}
      ${orig(G)}
      ${st.num ? gyogwaDocs().filter(d => d.rows.some(r => r.no === st.num)).map(d => `<details style="margin-top:10px"><summary class="mini" style="cursor:pointer">📗 ${d.year}학년도 ${esc(d.sem)}학기 교과학습발달상황</summary>${gyogwaTable(d, st.num)}</details>`).join('') : ''}
      <details style="margin-top:10px"><summary class="mini" style="cursor:pointer">✍️ 직접 넣기</summary>${form('grades', GRADE_SUBJ)}${table('grades', GRADE_SUBJ)}</details>
    </div></div>
  </div>
  <div class="mini" style="margin-top:10px">💡 그래프는 성적표의 '등급' 칸으로 그려요. AI 담임 메모에도 등급만 보내요 (학번은 안 보내요).</div>`;
}
function addScore(kind) {
  const st = cur(), subj = kind === 'mocks' ? MOCK_SUBJ : GRADE_SUBJ;
  const label = $('#' + kind + 'Label').value.trim(); if (!label) return toast('회차/학기를 적어 주세요');
  const r = { id: uid(), label };
  subj.forEach(s => { const v = $('#' + kind + '_' + s).value; if (v !== '') r[s] = Number(v); });
  st[kind].push(r); saveStudent(st); render();
}
function drawCharts(st) {
  if (!window.Chart) return;
  const mk = (id, rows, subj, max) => {
    const el = document.getElementById(id); if (!el) return;
    charts.push(new Chart(el, {
      type: 'line',
      data: { labels: rows.map(r => r.label), datasets: subj.map((s, i) => ({ label: s, data: rows.map(r => r[s] ?? null), borderColor: SUBJ_COLORS[i % SUBJ_COLORS.length], backgroundColor: SUBJ_COLORS[i % SUBJ_COLORS.length], tension: .35, spanGaps: true, borderWidth: s === '평균' ? 4 : 2.5, pointRadius: 4 })).filter(d => d.data.some(v => v !== null)) },
      options: { scales: { y: { reverse: true, min: 1, max, ticks: { stepSize: 1, callback: v => v + '등급' } } }, plugins: { legend: { labels: { boxWidth: 12, font: { family: 'Pretendard' } } } } }
    }));
  };
  const M = growthRows(st, 'mock'), G = growthRows(st, 'school');
  mk('chMock', M.rows, M.subj, 9);
  mk('chGrade', G.rows, G.subj, 5);
}

// 사진을 1800px 안으로 줄여 base64(JPEG)로
function imgToB64(file) {
  return new Promise((ok, no) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1800 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok({ mime: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.9).split(',')[1] });
    };
    img.onerror = no; img.src = url;
  });
}

/* ② 성적 파일 — 우리반만 있는 엑셀 파일을 칸마다 올리고 조회해요
   저장: 학번(번호) + 성적 칸만. 이름 · 연락처처럼 보이는 칸은 버려요. 학번 끝 두 자리 = 번호로 동물 친구와 이어져요 */
const scoreKey = (y, id) => `scores_${y}_${id}`;
const examOf = d => EXAMS.find(e => e.id === d.exam) || { kind: 'mock', label: d.exam, short: d.exam };

// 그래프에 쓸 등급 칸: 머리글에 '등급'이 있고 값이 1~max 숫자 (없으면 1~max 정수만 있는 칸)
function gradeCols(d, max) {
  const num = v => /^\d+(\.\d+)?$/.test(v) && +v >= 1 && +v <= max;
  const ok = i => d.rows.some(r => r.v[i] !== '') && d.rows.every(r => r.v[i] === '' || num(r.v[i]));
  const all = d.cols.map((h, i) => ({ h, i }));
  let cs = all.filter(c => /등급/.test(c.h) && ok(c.i));
  if (!cs.length) cs = all.filter(c => ok(c.i) && d.rows.every(r => r.v[c.i] === '' || Number.isInteger(+r.v[c.i])));
  return cs.map(c => ({ i: c.i, subj: c.h.replace(/석차|등급/g, '').replace(/[()]/g, ' ').replace(/\s+/g, ' ').trim() || c.h }));
}
const DROP_COL = /이름|성명|생년|주민|연락|전화|휴대|주소|보호자|학부모|이메일/;
const ID_COL = /^(학년|반|번호|번|학번)$/;
// 엑셀 한 시트(줄 배열) → { cols, rows: [{ sid, no, v: [...] }], dropped }
function parseScoreSheet(aoa) {
  // 칸 안 줄바꿈(특기사항 여러 줄)은 살리고 띄어쓰기만 정리해요
  const rows = aoa.map(r => r.map(v => String(v ?? '').replace(/[ \t ]+/g, ' ').replace(/ *\n */g, '\n').trim()));
  const flat = c => c.replace(/\s/g, '');
  let idKind = 'sid', h = rows.findIndex(r => r.some(c => flat(c) === '학번'));
  if (h < 0) { idKind = 'no'; h = rows.findIndex(r => r.some(c => flat(c) === '번호')); }
  if (h < 0) throw new Error("'학번' 또는 '번호' 머리글을 찾지 못했어요");
  const idCol = rows[h].findIndex(c => flat(c) === (idKind === 'sid' ? '학번' : '번호'));
  const isData = r => {
    const x = r[idCol] || '';
    return idKind === 'sid' ? /^[\d\- ]+$/.test(x) && x.replace(/\D/g, '').length >= 4 && x.replace(/\D/g, '').length <= 6 : /^\d{1,2}$/.test(x);
  };
  const first = rows.findIndex((r, i) => i > h && isData(r));
  if (first < 0) throw new Error('학생 성적 줄을 찾지 못했어요');
  const data = rows.slice(first).filter(isData);
  const width = Math.max(...rows.slice(h).map(r => r.length));
  // 머리글이 여러 줄이면 (예: 국어 / 원점수 · 등급) 이어 붙여요. 위쪽 합친 칸 글자는 오른쪽으로 이어 받아요
  const names = [];
  for (let c = 0; c < width; c++) names.push([]);
  for (let i = h; i < first; i++) {
    let carry = '';
    for (let c = 0; c < width; c++) {
      let v = rows[i][c] || '';
      if (v) carry = v; else if (i < first - 1 && rows[first - 1][c]) v = carry;
      if (v && names[c][names[c].length - 1] !== v) names[c].push(v);
    }
  }
  // 창체 표 위쪽 공통 머리글('창의적 체험활동상황')은 떼어요
  const head = names.map(p => p.join(' ').replace(/\n/g, ' ').replace(/^창의적\s*체험\s*활동(상황)?\s*/, ''));
  const noCol = idKind === 'no' ? idCol : head.findIndex(n => flat(n) === '번호');
  const keep = [], dropped = [];
  head.forEach((n, c) => {
    if (c === idCol || c === noCol || ID_COL.test(flat(n))) return;
    const vals = data.map(r => r[c] || '').filter(Boolean);
    if (!vals.length) return;                                                     // 빈 칸
    if (DROP_COL.test(flat(n))) { dropped.push(n); return; }                       // 이름 · 연락처 칸
    if (vals.every(v => /^[가-힣]{2,4}$/.test(v)) && new Set(vals).size > vals.length / 2) { dropped.push((n || `칸${c + 1}`) + ' (이름처럼 보여서)'); return; }
    keep.push(c);
  });
  return {
    cols: keep.map(c => head[c] || `칸${c + 1}`), dropped,
    rows: data.map(r => {
      const sid = idKind === 'sid' ? r[idCol].replace(/\D/g, '') : '';
      return { sid, no: parseInt(idKind === 'sid' ? sid.slice(-2) : r[idCol], 10), v: keep.map(c => r[c] || '') };
    })
  };
}
async function scoreUpload(id, inp) {
  const f = inp.files[0]; if (!f) return;

    const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
    let p = null, err = null;
    for (const n of wb.SheetNames) {     // 첫 번째로 읽히는 시트를 써요
      try { p = parseScoreSheet(XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: '', raw: false })); break; } catch (e) { err = e; }
    }
    if (!p) throw err || new Error('빈 파일이에요');
    DASH.pending = { exam: id, year: DASH.year, file: f.name, ...p }; DASH.view = null; dashRefresh();
  } catch (e) { toast('📊 파일을 읽지 못했어요: ' + e.message); }
}

/* ③ 생기부 자료 — 나이스 표를 드래그해 복사(Ctrl+C)한 뒤 붙여 넣어요 (AI 안 씀, 무료)

function parseTSV(t) {
  const rows = [[]]; let cell = '', q = false;

/* 교과학습발달상황 — 학기마다 문서 하나 (meta/rec_연도_gyogwa_학기). 번호 + 교과 · 과목 · 학점 · 원점수 · 성취도 · 석차등급 …

    if (r.some(c => /이수학점/.test(flat(c)))) continue;                                     // 합계 줄
    if (/^\d{1,2}$/.test(r[iNo] || '')) no = +r[iNo];
    if (iSem >= 0 && /^\d$/.test(r[iSem] || '')) sem = r[iSem];
    if (iYr >= 0 && /^\d$/.test(r[iYr] || '')) yr = r[iYr];
    if (!no || !(r[iSubj] || '')) continue;
    (g[sem] = g[sem] || { sem, grade: yr, rows: [] }).rows.push({ no, v: keep.map(i => r[i] || '') });
  }
  const groups = Object.values(g).map(x => ({ ...x, cols: keep.map(i => H[i]) }));
  if (!groups.length) throw new Error('학생 줄을 찾지 못했어요');
  return groups;
}
const gyogwaKey = (y, sem) => `rec_${y}_gyogwa_${sem || 0}`;
const gyogwaDocs = () => Object.values(RC).filter(d => d.kind === 'gyogwa').sort((a, b) => a.year - b.year || String(a.sem).localeCompare(String(b.sem)));
async function gyogwaRead(src) {
  try {
    let aoa;
    if (src === 'text') aoa = parseTSV($('#recText').value);
    else {
      const f = src.files[0]; if (!f) return;
      if (/\.pdf$/i.test(f.name)) return toast('📗 PDF는 칸이 합쳐져 있어 나누기 어려워요. 나이스 출력 화면에서 엑셀로 저장해 올려 주세요');
      if (!window.XLSX) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
      const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
      aoa = wb.SheetNames.flatMap(n => XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: '', raw: false }));
    }
    if (!aoa.length) return toast('표를 복사해 붙여 넣어 주세요');
    DASH.gyPending = parseGyogwa(aoa); dashRefresh();
  } catch (e) { toast('📗 ' + e.message); }
}
async function gyogwaSave() {
  const y = DASH.year, gs = DASH.gyPending;
  try {
    for (const g of gs) {
      const key = gyogwaKey(y, g.sem), doc = { kind: 'gyogwa', year: y, sem: g.sem, grade: g.grade, cols: g.cols, rows: g.rows, at: Date.now() };
      await roomRef().collection('meta').doc(key).set(doc); RC[key] = doc;
    }
  } catch (e) { return toast('☁️ 저장 실패: ' + e.message); }
  DASH.gyPending = null; dashRefresh(); render(); toast(`📗 교과학습발달상황 ${gs.map(g => g.sem + '학기').join(' · ')}를 저장했어요`);
}
async function gyogwaDelete(key) {
  if (!confirm('이 학기 교과학습발달상황을 지울까요?')) return;
  try { await roomRef().collection('meta').doc(key).delete(); } catch (e) { return toast('☁️ 지우기 실패: ' + e.message); }
  delete RC[key]; dashRefresh(); render();
}
// 한 학생 · 한 학기 교과 표 (nos = 번호 → 표에 번호 · 동물 칸 없이)
function gyogwaTable(d, no) {
  const rs = no ? d.rows.filter(r => r.no === no) : d.rows;
  const iG = d.cols.findIndex(c => /석차/.test(c));
  return `<div style="overflow:auto"><table class="dtable"><tr>${no ? '' : '<th>번호</th><th>동물 친구</th>'}${d.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>
    ${rs.map(r => { const s = !no && D.students.find(x => x.num === r.no);
      return `<tr>${no ? '' : `<td>${r.no}</td><td style="white-space:nowrap">${s ? esc(sname(s)) : '—'}</td>`}${r.v.map((v, i) => `<td style="${i === iG ? 'font-weight:700;color:var(--main)' : ''}">${esc(v)}</td>`).join('')}</tr>`; }).join('')}</table></div>`;
}
function dashGyogwa(tabs) {
  const y = DASH.year, docs = gyogwaDocs().filter(d => d.year === y), gs = DASH.gyPending;
  return `<section>${tabs}
    <p class="mini">나이스 '교과학습발달상황' 출력 화면에서 <b>엑셀로 저장</b>한 파일을 올리거나 표를 복사해 붙여 넣어요. 1 · 2학기가 한 파일에 있어도 학기마다 나눠 저장해요.<br>🔒 성명은 버리고 번호 + 교과 칸만 저장해요. 석차등급은 학생 노트 성장 그래프의 내신에 그려져요. 같은 학기를 다시 올리면 새것으로 바뀌어요.</p>
    <textarea id="recText" style="min-height:90px;font-size:12.5px" placeholder="여기에 붙여 넣기 (Ctrl+V)"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn" onclick="gyogwaRead('text')">👀 미리 보기</button><label class="btn sm ghost">📂 엑셀 파일로<input type="file" accept=".xlsx,.xls,.csv,.pdf" hidden onchange="gyogwaRead(this)"></label></div></section>
  ${gs ? `<section><h4>👀 미리 보기 <span class="mini">${gs.map(g => `${g.sem}학기 ${new Set(g.rows.map(r => r.no)).size}명 · ${g.rows.length}줄`).join(' / ')}</span></h4>
    ${gs.map(g => gyogwaTable(g)).join('')}
    <div class="row" style="margin-top:10px"><button class="btn" onclick="gyogwaSave()">💾 ${y}학년도로 저장</button><button class="btn ghost sm" onclick="DASH.gyPending=null;dashRefresh()">취소</button></div></section>` : ''}
  ${docs.map(d => `<section><h4>📄 ${y}학년도 ${esc(d.sem)}학기 <span class="mini">${new Set(d.rows.map(r => r.no)).size}명 · ${new Date(d.at).toLocaleDateString()} 넣음</span>
      <button class="x" style="margin-left:auto" onclick="gyogwaDelete('${gyogwaKey(d.year, d.sem)}')">🗑 지우기</button></h4>
    <details><summary class="mini" style="cursor:pointer">표 펼치기</summary>${gyogwaTable(d)}</details></section>`).join('') || (gs ? '' : `<div class="empty">${y}학년도 교과학습발달상황은 아직 없어요</div>`)}`;
}
// 한 학생의 과목 세특 목록 (fold = 접어서)
function setukList(no, y, fold) {
  const items = setukDocs(y).map(d => ({ d, r: d.rows.find(r => r.no === no) })).filter(x => x.r && x.r.text);
  if (!items.length) return '';
  const body = items.map(({ d, r }) => `<div class="item"><div class="top"><span class="chip">${esc(d.subj)}</span><span class="mini">${esc(d.sem)}학기 · ${nbytes(r.text)}B</span>
    <button class="x" style="margin-left:auto" title="복사" onclick="copyText(${esc(JSON.stringify(r.text))})">📋</button></div><div style="white-space:pre-wrap;font-size:13.5px">${esc(r.text)}</div></div>`).join('');
  return fold ? `<details style="margin-top:8px"><summary class="mini" style="cursor:pointer">📚 과목 세특 ${items.length}개</summary>${body}</details>` : body;
}
// 학생 노트 '한눈에'에 보일 이 친구의 출결 (0인 칸은 빼고)
function recItems(st) {
  if (!st.num) return '';
  return Object.values(RC).filter(d => d.kind === 'att').sort((a, b) => b.year - a.year).map(d => {
    const r = d.rows.find(x => x.no === st.num); if (!r) return '';
    const parts = d.cols.map((c, i) => r.v[i] && r.v[i] !== '0' ? `${esc(c)} <b>${esc(r.v[i])}</b>` : '').filter(Boolean);
    return `<div class="item"><b class="hand" style="font-size:17px">📋 ${d.year} ${esc(recOf(d).label)}</b><div class="mini">${parts.join(' · ')}</div></div>`;
  }).join('');
}

/* ---------------- 설정 ---------------- */
function openSettings() {
  openModal('⚙️ 설정', `
  <section><h4>🔒 개인정보 약속</h4><div class="mini">· 학생은 동물 친구(별칭+번호)로만 구분해요. 이름·연락처는 어디에도 저장하지 않아요.<br>· 성적 파일 · 출결은 학번(번호)과 칸만 선생님 계정 클라우드에 저장하고, 이 기기에는 남기지 않아요.<br>· 글에 학번처럼 보이는 숫자, 전화번호, 이메일이 있으면 저장 전에 알려 줘요.<br>· AI에는 동물 별칭도 보내지 않고, 적은 내용만 보내요.<br>· AI 키는 이 기기 브라우저에만 저장되고 클라우드에는 올라가지 않아요.</div></section>
  <section><h4>🏫 반 이름</h4><input type="text" id="stClass" value="${esc(S.className)}"></section>
  <section><h4>🤖 AI 연결 (유료 API)</h4>
    <div class="row" style="margin-bottom:8px"><label><input type="radio" name="prov" value="claude" ${S.provider === 'claude' ? 'checked' : ''}> Claude</label><label><input type="radio" name="prov" value="gemini" ${S.provider === 'gemini' ? 'checked' : ''}> Gemini</label></div>
    <input type="password" id="stKey" value="${esc(S.apiKey)}" placeholder="API 키 (sk-ant-… 또는 AIza…)">
    <input type="text" id="stModel" value="${esc(S.model)}" placeholder="모델 이름 (비우면 기본: Claude는 claude-sonnet-5-5, Gemini는 gemini-2.5-flash)" style="margin-top:6px">
    <div class="row" style="margin-top:8px"><button class="btn sm ghost" onclick="testAI(this)">🔌 연결 시험</button><span class="mini">공용 컴퓨터에서는 키를 넣지 마세요.</span></div>
  </section>
  <section><h4>☁️ 클라우드 저장 (어느 기기에서나 이어 쓰기)</h4>
    <div class="row" style="margin-bottom:8px">${fbUser
      ? `<span class="mini">🔑 ${esc(fbUser.email)} ${fbUser.email === ADMIN_EMAIL ? '로그인됨' : '(이 계정은 클라우드를 못 써요)'}</span><button class="btn sm ghost" style="margin-left:auto" onclick="logout()">로그아웃</button>`
      : `<span class="mini">클라우드는 선생님 구글 계정으로 로그인했을 때만 열려요</span><button class="btn sm" style="margin-left:auto" onclick="login()">🔑 구글 로그인</button>`}</div>
    <p class="mini">어느 기기에서든 로그인하면 같은 기록이 보여요. 로그아웃하면 이 기기에 남은 사본도 지워져요.</p>
  </section>
  <section><h4>💾 백업</h4><div class="row"><button class="btn sm ghost" onclick="exportData()">⬇️ 백업 파일 받기</button><label class="btn sm ghost">⬆️ 백업 불러오기<input type="file" accept=".json" hidden onchange="importData(this)"></label></div></section>
  <button class="btn" onclick="applySettings()">저장하고 닫기</button>`);
}
function readSettingsForm() {
  S.className = $('#stClass').value.trim();
  S.provider = document.querySelector('input[name=prov]:checked').value;
  S.apiKey = $('#stKey').value.trim(); S.model = $('#stModel').value.trim();
}
async function applySettings() {
  readSettingsForm();
  saveSettings(); closeModal(); render();
}
async function testAI(btn) { readSettingsForm(); saveSettings(); await withBusy(btn, async () => { const r = await callAI('짧게 답해.', '연결됐으면 "연결 완료 🌷"라고만 답해.', 50); toast('🤖 ' + r.trim()); }); }
function exportData() {
  const blob = new Blob([JSON.stringify(D, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `생기부노트_백업_${today()}.json`; a.click();
}
function importData(inp) {
  const f = inp.files[0]; if (!f) return;
  f.text().then(t => {
    const o = JSON.parse(t); if (!o.students) throw new Error();
    if (!confirm('지금 기록을 백업 파일 내용으로 바꿀까요?')) return;
    D = { students: o.students.map(normalize), events: o.events || [] };
    D.students.forEach(saveStudent); saveEvents(); V.sid = D.students[0]?.id || null; closeModal(); render(); toast('⬆️ 불러왔어요');
  }).catch(() => toast('백업 파일을 읽지 못했어요'));
}

/* ---------------- 꾸미기 ---------------- */
function cycleTheme() { const t = ['peach', 'mint', 'lavender']; S.theme = t[(t.indexOf(S.theme) + 1) % 3]; saveSettings(); render(); toast({ peach: '🍑 복숭아', mint: '🌿 민트', lavender: '💜 라벤더' }[S.theme]); }
function cycleFont() { const t = ['unz', 'gaegu', 'dodum']; S.font = t[(t.indexOf(S.font) + 1) % 3]; saveSettings(); render(); toast({ unz: '언즈체', gaegu: '개구체', dodum: '고운돋움' }[S.font]); }
function toggleBig() { S.big = S.big === 'on' ? 'off' : 'on'; saveSettings(); render(); }

/* ---------------- 모달·토스트 ---------------- */
function openModal(t, html, wide) { $('#mTitle').textContent = t; $('#mBody').innerHTML = html; $('#modal .sheet').classList.toggle('wide', !!wide); $('#modal').classList.add('on'); }
function closeModal() { $('#modal').classList.remove('on'); }
let tt; function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2600); }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

render();
initFirebase();
</script>
