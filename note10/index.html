<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리반 생기부노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* 🔤 온글잎 언즈체 (눈누 웹폰트) */
@font-face{font-family:'OngleipUnz';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2406-1@1.0/Ownglyph_UNZ-Rg.woff2') format('woff2');font-weight:normal;font-display:swap;}

:root{
  --bg:#fff7f2;--card:#fff;--ink:#4b3a3a;--sub:#9b8782;--line:#f2ddd6;--soft:#fdf1ec;
  --main:#ee8fad;--mainL:#fde8ef;
  --pink:#ee8fad;--pinkL:#fde8ef;--green:#7fc59a;--greenL:#e7f6ed;--mustard:#d9a74c;--mustardL:#fbf1dd;
  --purple:#a68fd8;--purpleL:#f0eafb;--blue:#7aaedb;--blueL:#e7f1fb;--red:#e0556a;--navy:#2f3b5c;
  --hand:'OngleipUnz','Gaegu',cursive;--body:'Pretendard',system-ui,sans-serif;
}
body[data-theme=mint]{--bg:#f2faf6;--line:#d3ece0;--soft:#e9f6ef;--main:#5fb894;--mainL:#dff3e9}
body[data-theme=lavender]{--bg:#f7f4fd;--line:#e3dbf5;--soft:#efe9fb;--main:#9a83d6;--mainL:#ece5fb}
body[data-font=gaegu]{--hand:'Gaegu',cursive}
body[data-font=dodum]{--hand:'Gowun Dodum',sans-serif}
body[data-big=on]{font-size:18px}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.55}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.hand{font-family:var(--hand)}
h1,h2,h3,h4{font-family:var(--hand);font-weight:700;margin:0}

/* ---------- 헤더 ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-bottom:1.5px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--pinkL),var(--mainL));display:grid;place-items:center;font-size:22px;box-shadow:0 2px 0 var(--line)}
.tag{background:var(--main);color:#fff;border-radius:99px;padding:3px 12px;font-family:var(--hand);font-size:15px}
.title{font-family:var(--hand);font-size:24px;font-weight:700}
.title small{font-size:14px;color:var(--sub);font-weight:400;margin-left:6px}
.nav{display:flex;gap:6px;margin-left:12px;flex-wrap:wrap}
.right{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;cursor:pointer;font-family:var(--hand);font-size:16px;transition:.15s;white-space:nowrap}
.pill:hover{border-color:var(--main)}
.pill.on{background:var(--main);border-color:var(--main);color:#fff}
.pill.dash{border-style:dashed;border-color:var(--main);color:var(--main)}
.badge{font-size:12px;border-radius:99px;padding:2px 9px;background:var(--soft);color:var(--sub);border:1px dashed var(--line);font-family:var(--body)}

main{padding:18px;max-width:1500px;margin:0 auto}

/* ---------- 공통 카드 (특강 웹앱 느낌) ---------- */
.cols{display:grid;gap:16px}
.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}
.box{background:var(--card);border:1.5px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.box>.hd{padding:11px 16px;color:#fff;font-family:var(--hand);font-size:20px;display:flex;align-items:center;gap:8px}
.box>.hd .n{width:26px;height:26px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;font-size:15px}
.box>.hd .sp{margin-left:auto}
.box>.bd{padding:16px;flex:1}
.hd.pink{background:var(--pink)}.hd.green{background:var(--green)}.hd.mustard{background:var(--mustard)}.hd.purple{background:var(--purple)}.hd.blue{background:var(--blue)}
.lead{font-family:var(--hand);font-size:21px;margin:0 0 12px}
.lead mark{background:linear-gradient(transparent 55%,var(--mainL) 55%);color:inherit}
.mini{font-size:12.5px;color:var(--sub)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{margin-bottom:10px}
.field label{display:block;font-family:var(--hand);font-size:16px;margin-bottom:4px}
input[type=text],input[type=date],input[type=number],input[type=password],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--main)}
textarea{resize:vertical;min-height:80px}
.btn{border:none;border-radius:99px;padding:8px 16px;cursor:pointer;background:var(--main);color:#fff;font-family:var(--hand);font-size:17px;white-space:nowrap}
.btn:hover{filter:brightness(.96)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:4px 11px;font-size:15px}
.btn.ai{background:linear-gradient(90deg,#f19ab6,#b493e6)}
.btn:disabled{opacity:.5;cursor:wait}
.x{border:none;background:none;cursor:pointer;color:var(--sub);font-size:14px}
.x:hover{color:var(--red)}
.empty{color:var(--sub);text-align:center;padding:22px 8px;font-size:13.5px;border:1.5px dashed var(--line);border-radius:12px}
.item{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff}
.item .top{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.chip{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12.5px;background:var(--soft);border:1px solid var(--line)}
.chip.자율{background:var(--pinkL);border-color:#f6c6d6}.chip.진로{background:var(--greenL);border-color:#bfe3cc}
.chip.동아리{background:var(--mustardL);border-color:#efd7a5}.chip.행특{background:var(--purpleL);border-color:#d8cdf2}
.chip.독서{background:var(--blueL);border-color:#c5dcf2}.chip.심화탐구{background:#fff2e6;border-color:#f3d2b0}
.copybox{background:#fffdf8;border:1.5px dashed var(--mustard);border-radius:12px;padding:12px;white-space:pre-wrap;font-size:13px}
.ai-out{background:linear-gradient(180deg,#fff,#fffaf6);border:1.5px dashed var(--main);border-radius:12px;padding:12px 14px;font-size:14px}
.ai-out h4{font-size:18px;margin:8px 0 4px;color:var(--main)}
.ai-out li{margin-left:14px}

/* ---------- 달력 (좋아하는 달력 화면) ---------- */
.calwrap{background:#fdfdf8;border:1.5px solid var(--line);border-radius:8px;padding:14px 18px}
.calhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.calhead h2{font-size:28px}
.dow,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.dow div{text-align:center;font-family:var(--hand);font-size:15px;color:var(--navy);padding:4px 0}
.dow div:first-child{color:var(--red)}.dow div:last-child{color:#3a63c9}
.cell{min-height:112px;border:1.5px solid #cfe0e6;border-radius:12px;background:#fff;padding:8px 9px 22px;position:relative;cursor:pointer;transition:.12s}
.cell:hover{border-color:var(--main);transform:translateY(-1px)}
.cell.future{background:#f7f9fb}
.cell.blank{visibility:hidden}
.cell.today{border:2px solid var(--red)}
.cell.sel{box-shadow:0 0 0 3px var(--mainL)}
.dnum{font-family:var(--hand);font-weight:700;font-size:19px;color:var(--navy)}
.dnum.sun{color:var(--red)}.dnum.sat{color:#3a63c9}
.hname{font-family:var(--hand);font-size:12.5px;color:var(--red);margin-left:5px}
.ev{background:#fde9b8;border-radius:5px;font-size:11.5px;padding:2px 7px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--hand)}
.ev.cs{background:var(--pinkL)}
.dots{position:absolute;left:9px;bottom:7px;display:flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;opacity:.28}
.dots i.on{opacity:1}
.dots i:nth-child(1){background:#e59bb3}.dots i:nth-child(2){background:#8fb0e4}.dots i:nth-child(3){background:#8fcf98}
.calnote{font-family:var(--hand);font-size:14.5px;color:var(--ink);margin-top:10px}

/* ---------- 학생 노트 레이아웃 ---------- */
.note{display:grid;grid-template-columns:250px 1fr;gap:18px;align-items:start}
.side{position:sticky;top:78px;max-height:calc(100vh - 96px);overflow:auto;padding-right:4px}
.side h3{font-size:19px;display:flex;align-items:center;margin-bottom:8px}
.sitem{display:flex;gap:10px;align-items:center;padding:9px 10px;margin-bottom:6px;cursor:pointer;background:#fff;border-radius:4px;clip-path:polygon(0 0,94% 0,100% 50%,94% 100%,0 100%);transition:.12s}
.sitem:hover{background:var(--soft)}
.sitem .num{width:30px;height:30px;border-radius:50%;border:2px solid var(--main);display:grid;place-items:center;font-size:17px;flex:none;background:#fff}
.sitem b{font-family:var(--hand);font-size:17px;font-weight:700;display:block;line-height:1.1}
.sitem span{font-size:11.5px;color:var(--sub)}
.sitem.on{background:var(--main);color:#fff}
.sitem.on span{color:#fff}
.sitem.on .num{border-color:#fff}
.sitem.on .warn{background:#fff;color:var(--red)}
.sitem .warn{margin-left:auto;font-size:11px;background:#fff0f2;color:var(--red);border-radius:99px;padding:0 6px}

.stitle{display:flex;align-items:baseline;gap:12px;margin:2px 0 12px;flex-wrap:wrap}
.stitle .big{font-family:var(--hand);font-size:44px;color:var(--main);line-height:1}
.stitle h2{font-size:28px}
.secbar{height:4px;border-radius:4px;background:var(--line);margin-bottom:14px;overflow:hidden}
.secbar i{display:block;height:100%;background:var(--main);transition:.3s}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.step{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:99px;background:#fff;padding:5px 14px 5px 6px;cursor:pointer}
.step .c{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--hand);font-size:15px}
.step b{font-family:var(--hand);font-size:16px;font-weight:700}
.step.on{background:var(--main);border-color:var(--main);color:#fff}
.step.on .c{background:#fff!important;color:var(--main)}

/* ---------- 문장 담벼락 ---------- */
.wallgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.post{border-radius:4px 4px 14px 4px;padding:12px 12px 10px;box-shadow:0 3px 0 rgba(0,0,0,.05);position:relative;font-size:13.5px;display:flex;flex-direction:column;gap:8px;border:1.5px solid transparent}
.post.자율{background:#ffeef4}.post.진로{background:#eaf8ef}.post.동아리{background:#fff4dc}.post.행특{background:#f2edfd}
.post.picked{border-color:var(--main);box-shadow:0 0 0 3px var(--mainL)}
.post .pin{position:absolute;top:-7px;left:50%;transform:translateX(-50%);font-size:15px}
.post .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.post .acts{display:flex;gap:6px;align-items:center;margin-top:auto}
.post textarea{min-height:90px;font-size:13px}
.post select{width:auto;padding:2px 6px;font-size:12px;border-radius:8px}
.basket{border:1.5px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px;background:#fff}
.basket h4{font-size:18px;display:flex;align-items:center;gap:6px;margin-bottom:6px}
.bitem{display:flex;gap:6px;font-size:12.5px;padding:6px 8px;border-radius:8px;background:var(--soft);margin-bottom:5px;align-items:flex-start}
.bitem div{flex:1}
.meter{height:7px;border-radius:7px;background:var(--line);overflow:hidden;margin:6px 0 2px}
.meter i{display:block;height:100%;background:var(--green)}
.meter i.over{background:var(--red)}

/* ---------- 우리반 한눈에 ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 16px}
.stat b{font-family:var(--hand);font-size:32px;color:var(--main);display:block;line-height:1.1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.scard{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;transition:.12s}
.scard:hover{border-color:var(--main);transform:translateY(-2px)}
.scard .face{font-size:30px;width:50px;height:50px;border-radius:14px;display:grid;place-items:center;background:var(--soft)}
.scard h4{font-size:20px}
.adots{display:flex;gap:4px;margin-top:8px}
.adots span{font-size:11px;border-radius:99px;padding:0 7px;border:1px solid var(--line);color:var(--sub)}
.adots span.ok{background:var(--greenL);color:#3d8a5a;border-color:#bfe3cc}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px}
.bar .t{width:90px;font-family:var(--hand);font-size:15px}
.bar .g{flex:1;height:14px;background:var(--soft);border-radius:8px;overflow:hidden}
.bar .g i{display:block;height:100%;background:var(--main);border-radius:8px}

/* ---------- 모달·토스트 ---------- */
.modal{position:fixed;inset:0;background:rgba(70,50,50,.28);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 14px;overflow:auto}
.modal.on{display:flex}
.sheet{background:#fff;border-radius:18px;max-width:720px;width:100%;border:1.5px solid var(--line);overflow:hidden}
.sheet .hd{background:var(--main);color:#fff;padding:12px 18px;font-family:var(--hand);font-size:22px;display:flex}
.sheet .bd{padding:18px}
.sheet section{border:1.5px dashed var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.sheet section h4{font-size:19px;margin-bottom:8px}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emojis button{font-size:22px;width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer}
.emojis button.on{border-color:var(--main);background:var(--mainL)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;transition:.25s;z-index:60;opacity:0}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}
.spin{display:inline-block;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
footer{text-align:center;color:var(--sub);font-size:12px;padding:20px}

@media(max-width:1100px){.c3,.c4{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}}
@media(max-width:820px){.note{grid-template-columns:1fr}.side{position:static;max-height:none}.c2,.c3,.c4{grid-template-columns:1fr}.cell{min-height:70px;padding:5px 5px 18px}.ev{font-size:10px;padding:1px 4px}.dnum{font-size:15px}.hname{display:none}.cal,.dow{gap:4px}main{padding:12px}}
</style>
</head>
<body data-theme="peach" data-font="unz">

<header>
  <div class="logo">🫶</div>
  <span class="tag" id="classTag">1학년 10반</span>
  <div class="title">우리반 생기부노트 <small>상담 · 성장 · 생기부</small></div>
  <nav class="nav" id="nav"></nav>
  <div class="right">
    <span class="badge" id="syncBadge">💾 이 기기에만 저장</span>
    <button class="pill dash" id="loginBtn" style="display:none" onclick="login()">🔑 구글 로그인</button>
    <span class="badge">🔒 이름·학번 없음</span>
    <button class="pill" onclick="cycleTheme()">🎨 꾸미기</button>
    <button class="pill" onclick="cycleFont()">🔤 글꼴</button>
    <button class="pill" onclick="toggleBig()">🔍 크게</button>
    <button class="pill" onclick="openSettings()">⚙️ 설정</button>
  </div>
</header>

<main id="app"></main>
<footer>우리반 생기부노트 ·학생 이름·학번·연락처는 저장하지 않아요 · 동물 친구 이름으로만 기록해요</footer>

<div class="modal" id="modal"><div class="sheet"><div class="hd"><span id="mTitle"></span><button class="x" style="margin-left:auto;color:#fff;font-size:20px" onclick="closeModal()">✕</button></div><div class="bd" id="mBody"></div></div></div>
<div id="toast"></div>

<script>
/* =========================================================
   우리반 생기부노트 - index.html 한 파일
   · 학생은 동물 친구(이모지+별칭)로만 구분 → 이름·학번 저장 안 함
   · 저장: 기본은 이 기기(localStorage), 선생님 구글 계정으로 로그인하면 클라우드(공부방 파이어베이스)
   · AI: Claude 또는 Gemini API 키 (키는 이 기기에만 저장, 클라우드로 안 올라감)
   ========================================================= */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const today = () => ymd(new Date());
const daysAgo = s => Math.floor((new Date(today()) - new Date(s)) / 86400000);
const load = (k, d) => { try { return Object.assign(Array.isArray(d) ? [] : {}, d, JSON.parse(localStorage.getItem(k) || 'null') || {}); } catch (e) { return d; } };
const clone = o => JSON.parse(JSON.stringify(o));

const AREAS = [
  { k: '자율', label: '자율·자치활동', color: 'pink', limit: 1500 },
  { k: '진로', label: '진로활동', color: 'green', limit: 2100 },
  { k: '동아리', label: '동아리활동', color: 'mustard', limit: 1500 },
  { k: '행특', label: '행동특성 및 종합의견', color: 'purple', limit: 1500 },
];
const ACT_AREAS = ['자율', '진로', '동아리', '독서', '심화탐구', '기타'];
const CS_TYPES = ['정기 상담', '진로', '학업', '교우관계', '생활', '마음', '학부모'];
const MOCK_SUBJ = ['국어', '수학', '영어', '한국사', '통합사회', '통합과학'];
const GRADE_SUBJ = ['평균', '국어', '수학', '영어', '통합사회', '통합과학'];
const CAREERS = ['인문·어문', '사회·교육', '경영·경제', '법·행정', '자연과학', '공학·IT', '의약·보건', '예체능', '미정'];
const EMOJIS = ['🐰','🐻','🐱','🐶','🦊','🐼','🐨','🐯','🦁','🐸','🐥','🐧','🦄','🐹','🐿️','🦔','🐳','🐬','🦋','🐞','🐢','🦦','🐑','🐮','🌻','🌷','🍀','🍓','🍑','🍋','🍒','⭐','🌙','☁️','🌈','🎈'];
const SUBJ_COLORS = ['#ee8fad', '#7aaedb', '#7fc59a', '#d9a74c', '#a68fd8', '#f0a37a'];

const HOLIDAYS = {

function piiCheck(t) {
  const w = [];
  if (/\b\d{5}\b/.test(t)) w.push('학번처럼 보이는 다섯 자리 숫자');
  if (/01[016789][-\s.]?\d{3,4}[-\s.]?\d{4}/.test(t)) w.push('전화번호');
  if (/[\w.-]+@[\w.-]+\.\w+/.test(t)) w.push('이메일 주소');
  if (/\d{6}[-\s]?[1-4]\d{6}/.test(t)) w.push('주민등록번호');
  return w;
}
function piiOk(t) {
  const w = piiCheck(t);
  if (!w.length) return true;
  return confirm('🔒 개인정보처럼 보이는 내용이 있어요: ' + w.join(', ') + '\n\n지우고 다시 쓰는 걸 권해요. 그래도 저장할까요?');
}

const SYS_RULES = `너는 대한민국 고등학교 담임교사의 학교생활기록부 작성을 돕는 조력자다.
지켜야 할 규칙:
- 학생 이름, 학번, 연락처 등 개인 식별 정보를 절대 쓰지 않는다. 주어는 생략하거나 '이 학생'으로만 쓴다.
- 교사가 준 관찰 내용에 있는 사실만 근거로 쓴다. 없는 활동·수치·결과를 지어내지 않는다.
- 학교생활기록부 기재요령을 따른다: 교외 수상, 공인어학시험, 부모의 직업·사회경제적 지위, 사교육, 특정 대학명, 논문 등재 등은 쓰지 않는다.
- 생기부 문체: 명사형 종결(~함, ~임, ~보임, ~함을 보여 줌)로 쓰고, 구체적 행동(관찰 사실)과 거기서 드러나는 특성·성장을 함께 담는다.
- 따뜻하지만 과장하지 않는 담백한 문장으로 쓴다.`;

async function callAI(system, user, maxTokens = 1800) {
  if (!S.apiKey) { openSettings(); throw new Error('설정에서 AI 키를 먼저 넣어 주세요'); }
  if (S.provider === 'claude') {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-api-key': S.apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: S.model || 'claude-sonnet-5-5', max_tokens: maxTokens, system, messages: [{ role: 'user', content: user }] })
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error?.message || ('오류 ' + r.status));
    return (j.content || []).map(c => c.text || '').join('');
  } else {
    const m = S.model || 'gemini-2.5-flash';
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:generateContent?key=${encodeURIComponent(S.apiKey)}`, {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ systemInstruction: { parts: [{ text: system }] }, contents: [{ role: 'user', parts: [{ text: user }] }], generationConfig: { maxOutputTokens: maxTokens * 2 } })
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error?.message || ('오류 ' + r.status));
    return j.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || '';
  }
}
function studentContext(st, brief = true) {
  const lines = [`희망 진로 분야: ${st.career || '미정'} ${st.careerDetail ? '(' + st.careerDetail + ')' : ''}`];
  if (!brief) {
    if (st.worry) lines.push('평소 고민: ' + st.worry);
    if (st.study) lines.push('공부 패턴: ' + st.study);
  }
  return lines.join('\n');
}
async function withBusy(btn, fn) {

// 일화·상담·활동 → 생기부 문구 여러 개
async function genSentences(st, text, source, btn) {
  if (!text.trim()) return toast('내용을 먼저 적어 주세요');
  if (!piiOk(text)) return;
  await withBusy(btn, async () => {
    const out = await callAI(SYS_RULES + `
출력 형식: 반드시 JSON 배열만 출력한다. 다른 말은 쓰지 않는다.
[{"area":"자율|진로|동아리|행특 중 하나","trait":"드러나는 특성 2~6글자","text":"생기부 문구"}]
- 관찰 내용에서 드러나는 특성마다 하나씩, 3~5개를 만든다.
- 각 text는 1~2문장, 한글 80~170자.
- area는 내용에 가장 잘 맞는 영역: 학급·학교 공동체 활동은 자율, 진로 탐색·심화 탐구·진로 독서는 진로, 동아리 맥락은 동아리, 인성·태도·관계·성장은 행특.`,
      `[학생 맥락]\n${studentContext(st)}\n\n[관찰 내용 - ${source}]\n${text}`);
    const arr = parseJSONArray(out);
    if (!arr.length) throw new Error('문구를 읽지 못했어요. 다시 눌러 주세요');
    arr.forEach(a => st.sentences.push({
      id: uid(), text: String(a.text || '').trim(), area: AREAS.some(x => x.k === a.area) ? a.area : '행특',
      trait: String(a.trait || '').slice(0, 10), source, picked: false, pickedAt: 0, date: today()
    }));
    saveStudent(st);
    toast(`✨ 문구 ${arr.length}개가 담벼락에 붙었어요`);
    render();
  });
}
function parseJSONArray(t) {
  try { const a = t.indexOf('['), b = t.lastIndexOf(']'); return JSON.parse(t.slice(a, b + 1)) || []; } catch (e) { return []; }
}

function dayData(ds) {
  const ev = D.events.filter(e => e.date === ds);
  const cs = [], act = [], next = [];
  D.students.forEach(st => {
    st.counsels.forEach(c => { if (c.date === ds) cs.push({ st, c }); if (c.next === ds) next.push({ st, c }); });
    st.episodes.forEach(e => { if (e.date === ds) act.push({ st, t: '일화', x: e.text }); });
    st.acts.forEach(a => { if (a.date === ds) act.push({ st, t: a.area, x: a.title || a.text }); });
  });
  return { ev, cs, act, next };
}

function upcoming() {
  const t = today(), out = [];
  D.students.forEach(st => st.counsels.forEach(c => { if (c.next && c.next >= t) out.push({ st, c }); }));

}

async function addEpisode(gen, btn) {

/* 6 문장 담벼락 */
function secWall(st) {
  const f = V.wallFilter;
  const list = st.sentences.filter(s => f === '전체' || (f === '고른 것' ? s.picked : s.area === f));
  return `<div class="cols" style="grid-template-columns:minmax(0,1.9fr) minmax(280px,1fr)">
    <div>
      <div class="row" style="margin-bottom:12px">
        ${['전체', ...AREAS.map(a => a.k), '고른 것'].map(k => `<button class="pill ${f === k ? 'on' : ''}" onclick="V.wallFilter='${k}';render()">${k} ${k === '전체' ? st.sentences.length : k === '고른 것' ? st.sentences.filter(s => s.picked).length : st.sentences.filter(s => s.area === k).length}</button>`).join('')}
      </div>
      <div class="row" style="margin-bottom:14px"><input type="text" id="wNew" placeholder="직접 문구 붙이기 (예: 학급 회의에서 소수 의견을 정리해 전달함.)" style="flex:1">
        <select id="wArea" style="width:auto">${AREAS.map(a => `<option value="${a.k}">${a.k}</option>`).join('')}</select><button class="btn sm" onclick="addManual()">📌 붙이기</button></div>
      ${list.length ? `<div class="wallgrid">${list.map((s, i) => `<div class="post ${s.area} ${s.picked ? 'picked' : ''}" style="transform:rotate(${(i % 3 - 1) * .7}deg)">
        <span class="pin">📌</span>
        <div class="meta"><select onchange="setSent('${s.id}','area',this.value)">${AREAS.map(a => `<option ${a.k === s.area ? 'selected' : ''}>${a.k}</option>`).join('')}</select>${s.trait ? `<span class="chip">#${esc(s.trait)}</span>` : ''}</div>
        ${V.editSent === s.id ? `<textarea id="ed_${s.id}">${esc(s.text)}</textarea>` : `<div>${esc(s.text)}</div>`}
        <div class="mini">${esc(s.source)} · ${nbytes(s.text)}B</div>
        <div class="acts">
          <button class="btn sm ${s.picked ? 'ghost' : ''}" onclick="togglePick('${s.id}')">${s.picked ? '➖ 빼기' : '➕ 넣기'}</button>
          ${V.editSent === s.id ? `<button class="btn ghost sm" onclick="saveEdit('${s.id}')">저장</button>` : `<button class="x" title="고치기" onclick="V.editSent='${s.id}';render()">✏️</button>`}
          <button class="x" title="떼기" onclick="delSent('${s.id}')">🗑</button>
        </div></div>`).join('')}</div>` : '<div class="empty">일화·상담·활동에서 ✨ 문구 만들기를 누르면 여기에 포스트잇이 붙어요</div>'}
    </div>
    <div>${AREAS.map(a => basket(st, a)).join('')}</div>
  </div>`;
}
function basket(st, a) {
  const items = st.sentences.filter(s => s.picked && s.area === a.k).sort((x, y) => x.pickedAt - y.pickedAt);
  const b = nbytes(items.map(s => s.text).join(' '));
  return `<div class="basket"><h4><span class="chip ${a.k}">${a.k}</span>${a.label}</h4>
    ${items.map((s, i) => `<div class="bitem"><div>${esc(s.text)}</div><div style="flex:none;display:flex;flex-direction:column">
      <button class="x" onclick="movePick('${s.id}',-1)" ${i === 0 ? 'disabled' : ''}>▲</button><button class="x" onclick="movePick('${s.id}',1)" ${i === items.length - 1 ? 'disabled' : ''}>▼</button></div></div>`).join('') || '<div class="mini">담벼락에서 ➕ 넣기를 눌러요</div>'}
    <div class="meter"><i class="${b > a.limit ? 'over' : ''}" style="width:${Math.min(100, b / a.limit * 100)}%"></i></div>
    <div class="row"><span class="mini">${b} / ${a.limit} 바이트</span>
      ${items.length ? `<button class="btn ai sm" style="margin-left:auto" onclick="polish('${a.k}',this)">✨ 한 단락으로 다듬기</button>` : ''}</div>
  </div>`;
}
function setSent(id, k, v) { const st = cur(); const s = st.sentences.find(x => x.id === id); s[k] = v; saveStudent(st); render(); }
function togglePick(id) { const st = cur(); const s = st.sentences.find(x => x.id === id); s.picked = !s.picked; s.pickedAt = Date.now(); saveStudent(st); render(); }
function movePick(id, dir) {
  const st = cur(); const s = st.sentences.find(x => x.id === id);
  const items = st.sentences.filter(x => x.picked && x.area === s.area).sort((a, b) => a.pickedAt - b.pickedAt);
  const i = items.indexOf(s), j = i + dir; if (j < 0 || j >= items.length) return;
  [items[i].pickedAt, items[j].pickedAt] = [items[j].pickedAt, items[i].pickedAt];
  saveStudent(st); render();
}
function saveEdit(id) { const st = cur(); const v = $('#ed_' + id).value.trim(); if (!piiOk(v)) return; st.sentences.find(x => x.id === id).text = v; V.editSent = null; saveStudent(st); render(); }
function delSent(id) { const st = cur(); st.sentences = st.sentences.filter(x => x.id !== id); saveStudent(st); render(); }
function addManual() {
  const st = cur(), t = $('#wNew').value.trim(); if (!t) return;
  if (!piiOk(t)) return;
  st.sentences.push({ id: uid(), text: t, area: $('#wArea').value, trait: '', source: '직접 입력', picked: false, pickedAt: 0, date: today() });
  saveStudent(st); render();
}
async function polish(area, btn) {
  const st = cur(), a = AREAS.find(x => x.k === area);
  const items = st.sentences.filter(s => s.picked && s.area === area).sort((x, y) => x.pickedAt - y.pickedAt);
  await withBusy(btn, async () => {
    const out = await callAI(SYS_RULES, `아래 문구들을 고등학교 생기부 '${a.label}' 특기사항 한 단락으로 자연스럽게 엮어 줘.
- 새 사실을 더하지 말고, 겹치는 내용은 합쳐 줘.
- 명사형 종결, 문장 순서는 흐름이 자연스럽게.
- 나이스 기준 ${a.limit}바이트(한글 1자=3바이트, 대략 ${Math.floor(a.limit / 3)}자) 이내.
- 단락 본문만 출력해. 제목·따옴표·설명 없이.
문구:\n${items.map((s, i) => `${i + 1}. ${s.text}`).join('\n')}`, 1500);
    st.final[area] = out.trim(); saveStudent(st);
    toast('✨ 생기부 정리 탭에 넣었어요'); V.sec = 7; render();
  });
}

/* 7 생기부 정리 */
function secFinal(st) {
  return `<p class="lead">담벼락에서 고른 문구가 <mark>영역별 단락</mark>이 돼요. 고쳐 쓰고 복사해서 나이스에 붙여요.</p>
  <div class="cols c2">${AREAS.map((a, i) => {
    const b = nbytes(st.final[a.k]);
    return `<div class="box"><div class="hd ${a.color}"><span class="n">${i + 1}</span>${a.label}<span class="sp" style="font-size:15px">${b} / ${a.limit}B</span></div><div class="bd">
      <textarea style="min-height:190px;font-size:13.5px" oninput="liveBytes(this,'${a.k}',${a.limit})" onchange="setFinal('${a.k}',this.value)" placeholder="담벼락 바구니에서 ✨ 한 단락으로 다듬기를 누르거나 직접 써요">${esc(st.final[a.k])}</textarea>
      <div class="meter"><i id="m_${a.k}" class="${b > a.limit ? 'over' : ''}" style="width:${Math.min(100, b / a.limit * 100)}%"></i></div>
      <div class="row"><span class="mini" id="b_${a.k}">${b > a.limit ? '⚠️ 바이트를 넘었어요' : '나이스 바이트 기준'}</span>
        <button class="btn ghost sm" style="margin-left:auto" onclick="V.sec=6;V.wallFilter='${a.k}';render()">담벼락</button>
        <button class="btn sm" onclick="copyText(cur().final['${a.k}'])">📋 복사</button></div>
    </div></div>`; }).join('')}</div>
  <div class="row" style="margin-top:14px"><button class="btn" onclick="copyAll()">📋 네 영역 한꺼번에 복사</button><span class="mini">복사한 뒤 나이스 각 영역에 붙여 넣어요.</span></div>`;
}
function liveBytes(el, k, lim) { const b = nbytes(el.value); const m = $('#m_' + k); m.style.width = Math.min(100, b / lim * 100) + '%'; m.className = b > lim ? 'over' : ''; $('#b_' + k).textContent = `${b} / ${lim} 바이트`; }
function setFinal(k, v) { const st = cur(); if (!piiOk(v)) return; st.final[k] = v; saveStudent(st); }
function copyAll() { const st = cur(); copyText(AREAS.map(a => `[${a.label}]\n${st.final[a.k] || ''}`).join('\n\n')); }
function copyText(t) { navigator.clipboard.writeText(t || '').then(() => toast('📋 복사했어요')).catch(() => toast('복사가 막혔어요. 직접 선택해 복사해 주세요')); }

    <p class="mini">어느 기기에서든 로그인하면 같은 기록이 보여요. 로그인하지 않으면 이 기기 브라우저에만 저장돼요.</p>
  </section>
  <section><h4>💾 백업</h4><div class="row"><button class="btn sm ghost" onclick="exportData()">⬇️ 백업 파일 받기</button><label class="btn sm ghost">⬆️ 백업 불러오기<input type="file" accept=".json" hidden onchange="importData(this)"></label></div></section>
  <button class="btn" onclick="applySettings()">저장하고 닫기</button>`);
}
function readSettingsForm() {
  S.className = $('#stClass').value.trim();
  S.provider = document.querySelector('input[name=prov]:checked').value;
  S.apiKey = $('#stKey').value.trim(); S.model = $('#stModel').value.trim();
}
async function applySettings() {
  readSettingsForm();
  saveSettings(); closeModal(); render();
}
async function testAI(btn) { readSettingsForm(); saveSettings(); await withBusy(btn, async () => { const r = await callAI('짧게 답해.', '연결됐으면 "연결 완료 🌷"라고만 답해.', 50); toast('🤖 ' + r.trim()); }); }
function exportData() {
  const blob = new Blob([JSON.stringify(D, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `생기부노트_백업_${today()}.json`; a.click();
}
function importData(inp) {
  const f = inp.files[0]; if (!f) return;
  f.text().then(t => {
    const o = JSON.parse(t); if (!o.students) throw new Error();
    if (!confirm('지금 기록을 백업 파일 내용으로 바꿀까요?')) return;
    D = { students: o.students.map(normalize), events: o.events || [] };
    D.students.forEach(saveStudent); saveEvents(); V.sid = D.students[0]?.id || null; closeModal(); render(); toast('⬆️ 불러왔어요');
  }).catch(() => toast('백업 파일을 읽지 못했어요'));
}

/* ---------------- 꾸미기 ---------------- */
function cycleTheme() { const t = ['peach', 'mint', 'lavender']; S.theme = t[(t.indexOf(S.theme) + 1) % 3]; saveSettings(); render(); toast({ peach: '🍑 복숭아', mint: '🌿 민트', lavender: '💜 라벤더' }[S.theme]); }
function cycleFont() { const t = ['unz', 'gaegu', 'dodum']; S.font = t[(t.indexOf(S.font) + 1) % 3]; saveSettings(); render(); toast({ unz: '언즈체', gaegu: '개구체', dodum: '고운돋움' }[S.font]); }
function toggleBig() { S.big = S.big === 'on' ? 'off' : 'on'; saveSettings(); render(); }

/* ---------------- 모달·토스트 ---------------- */
function openModal(t, html) { $('#mTitle').textContent = t; $('#mBody').innerHTML = html; $('#modal').classList.add('on'); }
function closeModal() { $('#modal').classList.remove('on'); }
let tt; function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2600); }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

render();
initFirebase();
</script>
</body>
</html>
