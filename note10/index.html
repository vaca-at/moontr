}

/* ---------------- 학생 추가·수정 ---------------- */
let pickEmoji = '🐰';
function studentForm(st) {
  pickEmoji = st?.emoji || EMOJIS[D.students.length % EMOJIS.length];
  return `<section><h4>🐾 동물 친구 고르기</h4><div class="emojis" id="emoBox">${EMOJIS.map(e => `<button class="${e === pickEmoji ? 'on' : ''}" onclick="pickEmo(this,'${e}')">${e}</button>`).join('')}</div></section>
  <section><h4>🏷️ 별칭 + 숫자</h4><div class="row"><input type="text" id="sNick" value="${esc(st?.nick || '')}" placeholder="예: 토끼, 새벽토끼, 노랑곰 (실명·이니셜은 쓰지 않아요)" maxlength="12" style="flex:1">
    <input type="text" id="sTag" value="${esc(st?.tag || '')}" inputmode="numeric" maxlength="4" placeholder="숫자 (0~9999)" style="width:120px"></div>
  <p class="mini" style="margin-top:8px">🔒 화면에는 '🐰 토끼7'처럼 별칭과 숫자만 보여요. 숫자는 아무 숫자나 돼요 (반 번호와 달라도 돼요).</p></section>
  <section><h4>🔗 반 번호 (화면에는 안 보여요)</h4><input type="number" id="sNum" value="${st?.num || ''}" min="1" max="60" placeholder="반 번호 (예: 7)" style="width:160px">
  <p class="mini" style="margin-top:8px">관리에서 올린 성적 · 출결 · 생기부 자료(학번 끝 두 자리)와 이 번호로 이어져요. 개인 상담 기록에는 보이지 않아요.</p></section>`;
}
function readNum() { const n = parseInt($('#sNum').value, 10); return n >= 1 && n <= 60 ? n : 0; }
function readTag() { return ($('#sTag').value || '').replace(/\D/g, '').slice(0, 4); }
// 같은 별칭끼리 겹치지 않는 숫자 하나 (1~9999)
// num 을 주면 그 반 번호와 같은 숫자는 피해요 (숫자로 반 번호를 알아챌 수 없게)
function freeTag(nick, num) {
  const used = new Set(D.students.filter(s => s.nick === nick).map(s => s.tag));
  for (let i = 0; i < 50; i++) { const t = String(1 + Math.floor(Math.random() * 9999)); if (!used.has(t) && t !== String(num || '')) return t; }
  return '';
}
function numTaken(n, except) { return n && D.students.some(s => s.num === n && s.id !== except); }
function pickEmo(btn, e) { pickEmoji = e; document.querySelectorAll('#emoBox button').forEach(b => b.classList.remove('on')); btn.classList.add('on'); }
function openAddStudent() {
  openModal('동물 친구 추가', studentForm() + `<button class="btn" onclick="addStudent()">＋ 추가하기</button>
    <section style="margin-top:18px;border-top:1.5px dashed var(--line);padding-top:14px"><h4>✏️ 연필 친구 한꺼번에 만들기</h4>
    <p class="mini">아직 상담 안 한 친구들을 '✏️ 연필1, 연필2…'로 먼저 만들어 둬요. 상담을 시작할 때 학생과 함께 별칭을 정하면 돼요.</p>
    <div class="row" style="margin-top:6px"><input type="number" id="pFrom" value="1" min="1" max="60" style="width:80px">번부터 <input type="number" id="pTo" value="${Math.max(1, ...D.students.map(s => s.num || 0))}" min="1" max="60" style="width:80px">번까지
      <button class="btn sm" onclick="makePencils(+$('#pFrom').value, +$('#pTo').value)">✏️ 없는 번호만 만들기</button></div></section>`);
}
/* ✏️ 연필 친구 = 아직 별칭을 안 정한 친구 (상담을 시작할 때 별칭을 정해요) */
const PENCIL = '✏️', PENCIL_NICK = '연필';
const isPencil = s => s.emoji === PENCIL && s.nick === PENCIL_NICK;
// 반 번호 목록 중 아직 친구가 없는 번호를 연필1, 연필2… 로 만들어요 (숫자는 이어서 붙어요)
function makePencils(from, to, list, inDash) {
  const nums = (list || Array.from({ length: Math.max(0, to - from + 1) }, (_, i) => from + i)).filter(n => n >= 1 && n <= 60 && !D.students.some(s => s.num === n));
  if (!nums.length) return toast('새로 만들 번호가 없어요 (이미 다 있어요)');
  // 연필 숫자 = 반 번호 (27번 친구는 '연필27') — 별칭을 정하기 전까지만 쓰는 임시 이름이라 헷갈리지 않게
  nums.forEach(n => { const st = normalize({ emoji: PENCIL, nick: PENCIL_NICK, tag: String(n), num: n, order: D.students.length }); D.students.push(st); saveStudent(st); });
  sortStudents(); if (!cur()) V.sid = D.students[0]?.id || null;
  if (inDash) dashRefresh(); else closeModal();
  render(); toast(`✏️ 연필 친구 ${nums.length}명을 만들었어요`);
}
// 🏷️ 별칭만 고치기 — 학생 앞에서 열어도 되게 반 번호는 안 보여요
function openNick() {
  const st = cur(); if (!st) return;
  const pen = isPencil(st);
  pickEmoji = pen ? EMOJIS[Math.floor(Math.random() * EMOJIS.length)] : st.emoji;
  openModal(pen ? '🏷️ 별칭 정하기' : '🏷️ 별칭 고치기', `<section><h4>🐾 동물 고르기</h4><div class="emojis" id="emoBox">${EMOJIS.map(e => `<button class="${e === pickEmoji ? 'on' : ''}" onclick="pickEmo(this,'${e}')">${e}</button>`).join('')}</div></section>
    <section><h4>🏷️ 별칭 + 숫자</h4><div class="row"><input type="text" id="sNick" value="${pen ? '' : esc(st.nick)}" placeholder="예: 새벽토끼, 노랑곰 (실명·이니셜은 쓰지 않아요)" maxlength="12" style="flex:1">
      <input type="text" id="sTag" value="${pen ? '' : esc(st.tag || '')}" inputmode="numeric" maxlength="4" placeholder="숫자 (비우면 저절로)" style="width:150px"></div>
    <p class="mini" style="margin-top:8px">별칭을 비우면 고른 동물 이름으로 넣어요. 🔒 화면에는 '🐰 토끼7'처럼 별칭과 숫자만 보여요.</p></section>
    <button class="btn" onclick="saveNick()">💾 저장</button>`);
  setTimeout(() => $('#sNick')?.focus(), 50);
}
// '해바라기17'처럼 별칭 칸 끝에 숫자를 붙여 적으면 → 별칭 '해바라기' + 숫자 '17' (숫자 칸보다 이쪽이 먼저)
function splitNick(nick, tag) {
  const m = String(nick || '').trim().match(/^(.*?[^\d\s])\s*(\d{1,4})$/);
  return m ? { nick: m[1].trim(), tag: m[2] } : { nick: String(nick || '').trim(), tag: tag || '' };
}
// 예전에 별칭 칸에 숫자까지 적어 '해바라기17' + 아무 숫자(7104)로 저장된 친구 → '해바라기' + 17 로 고쳐 저장 (불러온 뒤 한 번)
function fixNickDigits() {
  D.students.forEach(st => {
    if (isPencil(st)) return;
    const sp = splitNick(st.nick, ''); if (!sp.tag) return;
    st.nick = sp.nick; st.tag = sp.tag !== String(st.num || '') ? sp.tag : freeTag(sp.nick, st.num);
    saveStudent(st);
  });
}
// 숫자 정하기: 반 번호와 상관없이 (비었거나 반 번호와 같으면 겹치지 않는 아무 숫자)
function nickTag(tag, nick, num) {
  if (tag && tag === String(num || '')) { toast('🔒 반 번호와 같은 숫자는 쓰지 않아요 — 다른 숫자로 바꿨어요'); return freeTag(nick, num); }
  return tag || freeTag(nick, num);
}
function saveNick() {
  const st = cur(), sp = splitNick($('#sNick').value, readTag()), nick = sp.nick || ANIMAL_NAMES[pickEmoji] || '친구';
  if (piiCheck(nick).length) return toast('별칭에 숫자·연락처는 빼 주세요');
  st.emoji = pickEmoji; st.nick = nick; st.tag = nickTag(sp.tag, nick, st.num);
  sortStudents(); saveStudent(st); closeModal(); render(); toast(`🏷️ ${sname(st)}(으)로 정했어요`);
}
function addStudent() {
  const sp = splitNick($('#sNick').value, readTag()), nick = sp.nick || ('친구' + (D.students.length + 1));
  if (piiCheck(nick).length) return toast('별칭에 숫자·연락처는 빼 주세요');
  const num = readNum(); if (numTaken(num)) return toast(`반 번호 ${num}번은 이미 있어요`);
  const st = normalize({ emoji: pickEmoji, nick, tag: nickTag(sp.tag, nick, num), num, order: D.students.length });
  D.students.push(st); sortStudents(); V.sid = st.id; V.sec = 1; saveStudent(st); closeModal(); V.tab = 'note'; render();
}
function openEditStudent() {
  const st = cur();
  openModal('친구 정보 고치기', studentForm(st) + `<div class="row"><button class="btn" onclick="editStudent()">저장</button><button class="btn ghost" style="margin-left:auto;color:var(--red)" onclick="removeStudent()">🗑 이 친구 기록 모두 지우기</button></div>`);
}
function editStudent() {
  const st = cur(), num = readNum();
  if (numTaken(num, st.id)) return toast(`반 번호 ${num}번은 이미 다른 친구예요`);
  const sp = splitNick($('#sNick').value, readTag());
  st.emoji = pickEmoji; st.nick = sp.nick || st.nick; st.num = num; st.tag = nickTag(sp.tag, st.nick, num);
  sortStudents(); saveStudent(st); closeModal(); render();
}
function removeStudent() {
  const st = cur(); if (!confirm(`${sname(st)}의 모든 기록을 지울까요? 되돌릴 수 없어요.`)) return;
  D.students = D.students.filter(s => s.id !== st.id);
  if (db) roomRef().collection('students').doc(st.id).delete();
  saveLocal(); V.sid = D.students[0]?.id || null; closeModal(); render();
}

/* 👥 우리반 명단 — 연필 친구 한꺼번에 만들기 + 번호마다 동물 · 별칭 · 숫자 바로 고치기 (선생님만 보는 관리 화면이라 반 번호도 보여요) */
function dashRoster() {
  const list = [...D.students].sort((a, b) => (a.num || 99) - (b.num || 99) || nname(a).localeCompare(nname(b), 'ko'));
  const pen = D.students.filter(isPencil).length, maxNo = Math.max(27, ...D.students.map(s => s.num || 0));
  const emoOpts = cur => [PENCIL, ...EMOJIS].map(e => `<option ${e === cur ? 'selected' : ''}>${e}</option>`).join('');
  return `<section><h4>✏️ 처음 한 번: 연필 친구 한꺼번에 만들기</h4>
    <p class="mini">반 번호마다 '✏️ 연필1, 연필2…' 친구를 만들어 둬요. 이미 친구가 있는 번호는 건너뛰어요. 별칭은 아래 표나, 상담할 때 개인 상담 기록의 🏷️ 별칭 고치기에서 언제든 바꿀 수 있어요.</p>
    <div class="row" style="margin-top:8px"><input type="number" id="pFrom" value="1" min="1" max="60" style="width:80px">번부터 <input type="number" id="pTo" value="${maxNo}" min="1" max="60" style="width:80px">번까지
      <button class="btn" onclick="makePencils(+$('#pFrom').value, +$('#pTo').value, null, true)">✏️ 한꺼번에 만들기</button></div></section>
  <section><h4>👥 우리반 명단 <span class="mini">${D.students.length}명 · 연필(별칭 안 정함) ${pen}명 · 선택과목 다 넣음 ${D.students.filter(subjOk).length}명</span></h4>
    <p class="mini">고치면 바로 저장돼요. 🔒 반 번호는 이 관리 화면에서만 보이고, 개인 상담 기록 · 홈에는 별칭과 숫자만 보여요.
      반 번호를 서로 바꿀 때는 한 줄의 반 번호를 먼저 비운 뒤 바꿔요 (같은 번호 둘은 안 돼요).</p>
    ${D.students.some(s => isPencil(s) && s.num && s.tag !== String(s.num)) ? `<div class="row" style="margin-bottom:8px"><span class="mini" style="color:var(--red)">⚠️ 연필 숫자와 반 번호가 다른 친구가 있어요</span><button class="btn sm" onclick="pencilSync()">✏️ 연필 숫자를 반 번호와 맞추기</button></div>` : ''}
    ${list.length ? `<div style="overflow:auto;max-height:60vh"><table class="dtable"><tr><th style="width:70px">반 번호</th><th style="width:80px">동물</th><th>별칭</th><th style="width:90px">숫자</th><th style="width:90px">상담</th><th style="width:120px">선택과목</th><th style="width:90px"></th></tr>
      ${list.map(s => `<tr style="${isPencil(s) ? 'background:var(--soft)' : ''}">
        <td><input type="number" min="1" max="60" value="${s.num || ''}" style="width:62px" onchange="rosterSet('${s.id}','num',this.value)"></td>
        <td><select style="width:70px;font-size:18px" onchange="rosterSet('${s.id}','emoji',this.value)">${emoOpts(s.emoji)}</select></td>

        <td class="mini" style="vertical-align:middle;white-space:nowrap;${subjOk(s) ? 'color:#3d8a5f' : SEMS.some(([k]) => (s.subjects?.[k] || []).length) ? 'color:var(--red)' : ''}">${SEMS.map(([k]) => (s.subjects?.[k] || []).length).join(' · ')}${subjOk(s) ? ' ✓' : SEMS.some(([k]) => (s.subjects?.[k] || []).length) ? ' ⚠️' : ''}</td>

}
// 연필 친구들의 숫자를 반 번호와 똑같이 맞춰요 (예전에 만든 연필 친구는 숫자가 밀려 있을 수 있어요)
function pencilSync() {
  const list = D.students.filter(s => isPencil(s) && s.num && s.tag !== String(s.num));
  if (!list.length) return toast('✏️ 연필 친구 숫자가 이미 반 번호와 같아요');
  if (!confirm(`연필 친구 ${list.length}명의 숫자를 반 번호와 똑같이 바꿀까요?\n(예: ${list.slice(0, 3).map(s => `연필${s.tag} → 연필${s.num}`).join(', ')})`)) return;
  list.forEach(s => { s.tag = String(s.num); saveStudent(s); });
  sortStudents(); render(); dashRefresh(); toast(`✏️ 연필 친구 ${list.length}명 숫자를 반 번호와 맞췄어요`);
}
// 명단 표에서 고친 칸 하나 저장
function rosterSet(id, k, v) {
  const st = D.students.find(s => s.id === id); if (!st) return;
  v = String(v).trim();
  if (k === 'num') { const n = parseInt(v, 10) || 0; if (n && (n < 1 || n > 60)) return toast('반 번호는 1~60이에요'), dashRefresh(); if (numTaken(n, id)) return toast(`반 번호 ${n}번은 이미 다른 친구예요`), dashRefresh(); st.num = n; }
  const wasPencil = isPencil(st); let typed = false;
  if (k === 'nick') {
    const sp = splitNick(v, '');   // '해바라기17' → 별칭 '해바라기' + 숫자 17
    if (!sp.nick) return dashRefresh(); if (piiCheck(sp.nick).length) return toast('별칭에 숫자·연락처는 빼 주세요'), dashRefresh();
    st.nick = sp.nick; if (sp.tag) { st.tag = nickTag(sp.tag, sp.nick, st.num); typed = true; }
  }
  if (k === 'tag') { st.tag = v.replace(/\D/g, '').slice(0, 4); if (!isPencil(st) && st.tag && st.tag === String(st.num || '')) { st.tag = freeTag(st.nick, st.num); toast('🔒 반 번호와 같은 숫자는 쓰지 않아요 — 다른 숫자로 바꿨어요'); } }
  if (k === 'emoji') { const old = st.emoji; st.emoji = v; if (st.nick === PENCIL_NICK && v !== PENCIL) st.nick = ANIMAL_NAMES[v] || st.nick; else if (st.nick === ANIMAL_NAMES[old] && ANIMAL_NAMES[v]) st.nick = ANIMAL_NAMES[v]; }
  // 연필 친구가 별칭을 받으면 연필 숫자(= 반 번호)를 버리고 반 번호와 상관없는 숫자로
  if (wasPencil && !isPencil(st) && !typed && (k === 'nick' || k === 'emoji')) st.tag = freeTag(st.nick, st.num);
  if (k === 'num' && !isPencil(st) && st.tag === String(st.num)) st.tag = freeTag(st.nick, st.num);
  sortStudents(); saveStudent(st); render(); dashRefresh();
}

/* 🏫 전교 성적 —전교생 성적표(학번 · 성적만, 이름 없음)를 과목별 · 반별 · 학생별로 한눈에 */
let SCH = { key: null, cls: 'all', sort: -1, asc: true };
function dashSchool() {
  const docs = scoreDocs().filter(isWhole);
  if (!docs.length) return `<div class="empty">아직 전교생 성적표가 없어요.<br>📊 성적 파일에서 <b>반 · 번호 · 이름</b> 칸이 있는 전교생 파일을 올리면 여기서 볼 수 있어요.<br><button class="btn sm" style="margin-top:10px" onclick="DASH.tab='score';dashRefresh()">📊 성적 파일로 가기</button></div>`;
  const d = SC[SCH.key] && isWhole(SC[SCH.key]) ? withCalc(SC[SCH.key]) : docs[docs.length - 1];
  const key = scoreKey(d.year, d.exam), me = myClass();
  const max = examOf(d).kind === 'mock' ? 9 : 5, gc = gradeCols(d, max), gset = new Set(gc.map(c => c.i));
  const num = (r, i) => r.v[i] === '' || isNaN(+r.v[i]) ? null : +r.v[i];
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  const f2 = v => v == null ? '-' : v.toFixed(2);
  // 등급 평균 칸 색 (좋을수록 진하게)
  const heat = (v, bold) => v == null ? '<td class="mini" style="text-align:center">-</td>'
    : `<td style="text-align:center;${bold ? 'font-weight:700;' : ''}background:rgba(238,143,173,${(0.06 + (1 - (v - 1) / (max - 1)) * 0.5).toFixed(2)})">${Number.isInteger(v) ? v : v.toFixed(2)}</td>`;
  const classes = [...new Set(d.rows.map(r => sidCls(r.sid)).filter(Boolean))].sort((a, b) => a - b);
  const my = d.rows.filter(r => isMine(r.sid));
  const rowAvg = r => avg(gc.map(c => num(r, c.i)).filter(v => v != null));
  // ① 과목별: 전교 평균 · 우리반 평균 · 등급 분포
  const subj = gc.map(c => {
    const all = d.rows.map(r => num(r, c.i)).filter(v => v != null), cnt = Array(max + 1).fill(0);
    all.forEach(v => cnt[Math.min(max, Math.max(1, Math.round(v)))]++);
    return { ...c, a: avg(all), m: avg(my.map(r => num(r, c.i)).filter(v => v != null)), n: all.length, cnt };
  });
  const cmax = Math.max(1, ...subj.flatMap(s => s.cnt.slice(1)));
  // ② 반별 평균 등급
  const byCls = classes.map(c => { const rs = d.rows.filter(r => sidCls(r.sid) === c); const s = gc.map(g => avg(rs.map(r => num(r, g.i)).filter(v => v != null))); return { c, n: rs.length, s, all: avg(s.filter(v => v != null)) }; });
  const allAvg = avg(d.rows.map(rowAvg).filter(v => v != null)), myAvg = avg(my.map(rowAvg).filter(v => v != null));
  const rank = [...byCls].sort((a, b) => (a.all ?? 99) - (b.all ?? 99)).findIndex(x => x.c === me.c) + 1;
  // ③ 학생별 표 (반 고르기 · 학번 찾기 · 머리글 눌러 정렬)
  let rows = d.rows.filter(r => SCH.cls === 'all' || (SCH.cls === 'mine' ? isMine(r.sid) : sidCls(r.sid) === SCH.cls));
  if (SCH.sort >= 0) { const k = SCH.sort, sgn = SCH.asc ? 1 : -1; rows = [...rows].sort((a, b) => { const x = k === 999 ? rowAvg(a) : num(a, k), y = k === 999 ? rowAvg(b) : num(b, k); return x == null ? 1 : y == null ? -1 : (x - y) * sgn || a.sid.localeCompare(b.sid); }); }
  const arrow = k => SCH.sort === k ? (SCH.asc ? ' ▲' : ' ▼') : '';
  const th = 'position:sticky;top:0;background:#fff;z-index:1;cursor:pointer;white-space:nowrap';
  const clsPill = (v, label) => `<button class="pill ${SCH.cls === v ? 'on' : ''}" style="font-size:14px;padding:3px 11px" onclick="SCH.cls=${typeof v === 'string' ? `'${v}'` : v};dashRefresh()">${label}</button>`;
  return `
  ${docs.length > 1 ? `<div class="row" style="margin-bottom:10px">${docs.map(x => { const k = scoreKey(x.year, x.exam); return `<button class="pill ${k === key ? 'on' : ''}" onclick="SCH.key='${k}';SCH.cls='all';SCH.sort=-1;dashRefresh()">${x.year} ${esc(examOf(x).label)}</button>`; }).join('')}</div>` : ''}
  <div class="stats">
    <div class="stat"><b>${d.rows.length}</b>전교 인원 · ${classes.length}개 반</div>
    <div class="stat"><b>${my.length}</b>우리반 (${me.g}학년 ${me.c}반)</div>
    <div class="stat"><b>${f2(myAvg)}</b>우리반 평균 등급 <span class="mini">(전교 ${f2(allAvg)})</span></div>
    <div class="stat"><b>${rank || '-'}<span style="font-size:18px">/${classes.length}</span></b>반 평균 순위 (등급 낮을수록 위)</div>
  </div>
  <div class="cols" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-bottom:12px">
    <div class="box"><div class="hd blue"><span class="n">1</span>과목별 평균 · 등급 분포 <span class="sp mini" style="color:#fff">${max}등급${max === 5 ? '제' : ''} · 칸 숫자 = 인원</span></div><div class="bd" style="overflow:auto">
      <table class="dtable"><tr><th>과목</th><th style="text-align:center">전교</th><th style="text-align:center">우리반</th>${Array.from({ length: max }, (_, i) => `<th style="text-align:center">${i + 1}</th>`).join('')}</tr>
      ${subj.map(s => `<tr><td><b>${esc(s.subj)}</b></td><td style="text-align:center">${f2(s.a)}</td><td style="text-align:center;font-weight:700;color:${s.m != null && s.a != null && s.m < s.a ? 'var(--green)' : 'var(--red)'}">${f2(s.m)}</td>
        ${s.cnt.slice(1).map(n => `<td style="text-align:center;background:rgba(122,174,219,${(n / cmax * 0.6).toFixed(2)})">${n || ''}</td>`).join('')}</tr>`).join('')}</table>
      <p class="mini">우리반 평균이 초록이면 전교보다 좋아요, 빨강이면 전교보다 낮아요.</p>
    </div></div>
    <div class="box"><div class="hd purple"><span class="n">2</span>반별 평균 등급 <span class="sp mini" style="color:#fff">반을 누르면 아래 표가 그 반만</span></div><div class="bd" style="overflow:auto">
      <table class="dtable"><tr><th>반</th><th style="text-align:center">인원</th>${gc.map(c => `<th style="text-align:center">${esc(c.subj)}</th>`).join('')}<th style="text-align:center">평균</th></tr>
      ${byCls.map(x => `<tr style="${x.c === me.c ? 'outline:2px solid var(--main);outline-offset:-2px' : ''}"><td style="white-space:nowrap"><a href="#" style="color:inherit;text-decoration:none" onclick="SCH.cls=${x.c};dashRefresh();return false"><b>${x.c}반</b></a>${x.c === me.c ? ' ⭐' : ''}</td><td style="text-align:center" class="mini">${x.n}</td>${x.s.map(v => heat(v)).join('')}${heat(x.all, true)}</tr>`).join('')}</table>
    </div></div>
  </div>
  <div class="box"><div class="hd pink"><span class="n">3</span>학생별 성적 <span class="sp mini" style="color:#fff">🔒 학번만 · 이름 없음 · 머리글을 누르면 정렬</span></div><div class="bd">
    <div class="row" style="margin-bottom:8px;gap:6px">${clsPill('all', '전체')}${clsPill('mine', '⭐ 우리반')}${classes.map(c => clsPill(c, c + '반')).join('')}
      <input id="schQ" placeholder="🔍 학번 찾기 (예: 110)" style="width:170px;margin-left:auto" oninput="schFind(this.value)"></div>
    <div style="overflow:auto;max-height:60vh"><table class="dtable" id="schT">
      <tr><th style="${th}" onclick="schSort(-1)">학번${arrow(-1)}</th><th style="${th}">우리반</th><th style="${th};text-align:center" onclick="schSort(999)">평균${arrow(999)}</th>${d.cols.map((c, i) => `<th style="${th};${gset.has(i) ? 'color:var(--main)' : ''}" onclick="schSort(${i})">${esc(c)}${arrow(i)}</th>`).join('')}</tr>
      ${rows.map(r => { const s = r.no ? byNum(r.no) : null;
        return `<tr data-sid="${esc(r.sid)}" style="${isMine(r.sid) ? 'background:var(--soft)' : ''}"><td><b>${esc(r.sid)}</b></td><td class="mini" style="white-space:nowrap">${isMine(r.sid) ? (s ? esc(sname(s)) : r.no + '번') : ''}</td>${heat(rowAvg(r), true)}${r.v.map((v, i) => gset.has(i) ? heat(num(r, i), true) : `<td>${esc(v)}</td>`).join('')}</tr>`; }).join('')}
    </table></div>
    <p class="mini" style="margin-top:6px">${rows.length}명 보는 중 · ${esc(d.file)} · ${new Date(d.at).toLocaleDateString()} 올림</p>
  </div></div>`;
}
function schSort(k) { if (SCH.sort === k) SCH.asc = !SCH.asc; else { SCH.sort = k; SCH.asc = true; } dashRefresh(); }
// 학번 찾기: 다시 그리지 않고 줄만 숨겨요 (입력칸 커서가 안 튀게)
function schFind(q) { q = q.replace(/\D/g, ''); document.querySelectorAll('#schT tr[data-sid]').forEach(tr => tr.style.display = !q || tr.dataset.sid.includes(q) ? '' : 'none'); }

/* ① 달력 가져오기 */
function monthStr(y, m) { const d = new Date(y, m, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function dashCal() {
  const rows = DASH.rows, who = rows.some(r => r.who);

// 사진을 max px 안으로 줄여 base64(JPEG)로
function imgToB64(file, max = 1800, q = 0.9) {
  return new Promise((ok, no) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok({ mime: 'image/jpeg', data: c.toDataURL('image/jpeg', q).split(',')[1] });
    };
    img.onerror = no; img.src = url;
  });
}

/* ② 성적 파일 — 우리반만 있는 엑셀 파일을 칸마다 올리고 조회해요
   저장: 학번(번호) + 성적 칸만. 이름 · 연락처처럼 보이는 칸은 버려요. 학번 끝 두 자리 = 번호로 동물 친구와 이어져요 */
const scoreKey = (y, id) => `scores_${y}_${id}`;
const examOf = d => EXAMS.find(e => e.id === d.exam) || { kind: 'mock', label: d.exam, short: d.exam };
function scoreDocs() { return Object.values(SC).map(withCalc).sort((a, b) => a.year - b.year || EXAMS.findIndex(e => e.id === a.exam) - EXAMS.findIndex(e => e.id === b.exam)); }
// 그래프에 쓸 등급 칸: 머리글에 '등급'이 있고 값이 1~max 숫자 (없으면 1~max 정수만 있는 칸)
function gradeCols(d, max) {
  const num = v => /^\d+(\.\d+)?$/.test(v) && +v >= 1 && +v <= max;
  const ok = i => d.rows.some(r => r.v[i] !== '') && d.rows.every(r => r.v[i] === '' || num(r.v[i]));
  const all = d.cols.map((h, i) => ({ h, i }));
  let cs = all.filter(c => /등급/.test(c.h) && ok(c.i));
  if (!cs.length) cs = all.filter(c => ok(c.i) && d.rows.every(r => r.v[c.i] === '' || Number.isInteger(+r.v[c.i])));
  return cs.map(c => ({ i: c.i, subj: subjName(c.h.replace(/석차|등급/g, '')) || c.h }));
}
// 머리글 → 과목 이름. 끝에 붙은 학점 숫자('공통국어1 4'의 4)는 떼서 시험마다 같은 과목으로 이어지게 해요
const subjName = h => h.replace(/[()]/g, ' ').replace(/\s+/g, ' ').trim().replace(/\s+\d+(\.\d+)?$/, '');

/* 🏫 중간 · 기말 전교생 성적표 (등급 칸 없이 원점수만) → 과목마다 전교 석차 · 상위 % · 5등급을 계산해요
   5등급제 누적비율: 1등급 ~10% · 2등급 ~34% · 3등급 ~66% · 4등급 ~90% · 5등급 ~100%
   동점자는 중간석차(석차 + (동점자 수 − 1) ÷ 2)로 비율을 내요. 계산한 칸은 저장하지 않고 볼 때마다 만들어요 */
const GRADE5 = [10, 34, 66, 90, 100];
const pctGrade = p => GRADE5.findIndex(x => p <= x + 1e-9) + 1;
const useCalc = d => examOf(d).kind === 'school' && isWhole(d) && !d.cols.some(h => /등급/.test(h));
// 원점수 칸 찾기: 머리글에 '원점수 · 합계 · 총점'이 있으면 그 칸, 없으면 5보다 큰 숫자가 든 과목 칸
function rawCols(d) {
  const all = d.cols.map((h, i) => ({ h, i }));
  const numOk = i => d.rows.filter(r => r.v[i] !== '').length >= d.rows.length / 2 && d.rows.every(r => r.v[i] === '' || !isNaN(parseFloat(r.v[i])));
  let cs = all.filter(c => /원점수|합계|총점/.test(c.h) && !/표준|백분위|석차/.test(c.h) && numOk(c.i));
  if (!cs.length) cs = all.filter(c => !/석차|백분위|표준|평균|편차|학점|단위|성취|수강|응시|순위/.test(c.h) && numOk(c.i) && Math.max(...d.rows.map(r => parseFloat(r.v[c.i]) || 0)) > 5);
  return cs.map(c => ({ i: c.i, subj: subjName(c.h.replace(/원점수|합계|총점|점수/g, '')) || c.h }));
}
const rankCache = new Map();
function schoolRanks(d) {
  const k = 'r' + d.exam + d.year + d.at; if (rankCache.has(k)) return rankCache.get(k);
  const out = rawCols(d).map(c => {
    const vals = d.rows.map(r => parseFloat(r.v[c.i])).filter(v => !isNaN(v)), N = vals.length, by = new Map();
    d.rows.forEach(r => {
      const v = parseFloat(r.v[c.i]); if (isNaN(v)) return;
      const rank = 1 + vals.filter(x => x > v).length, ties = vals.filter(x => x === v).length, pct = (rank + (ties - 1) / 2) / N * 100;
      by.set(r.sid, { v, rank, ties, N, pct, g: pctGrade(pct) });
    });
    return { ...c, N, by };
  });
  rankCache.set(k, out); return out;
}
// 성적표에 '과목 전교석차' · '과목 등급' 칸을 붙인 사본 → 그래프 · 우리반 성적 · 전교 성적이 그대로 등급을 읽어요
function withCalc(d) {
  if (!d || !useCalc(d)) return d;
  const k = 'a' + d.exam + d.year + d.at; if (rankCache.has(k)) return rankCache.get(k);
  const R = schoolRanks(d);
  const d2 = R.length ? { ...d, calc: true, cols: [...d.cols, ...R.flatMap(c => [`${c.subj} 전교석차`, `${c.subj} 등급`])],
    rows: d.rows.map(r => ({ ...r, v: [...r.v, ...R.flatMap(c => { const x = c.by.get(r.sid); return x ? [`${x.rank}/${x.N}`, String(x.g)] : ['', '']; })] })) } : d;
  rankCache.set(k, d2); return d2;
}
// 개인 상담 기록 > 성적: 이 친구의 과목별 전교 석차 · 상위 % · 계산 등급
function rankCard(st) {
  if (!st.num) return '';
  const docs = Object.values(SC).filter(d => useCalc(d)).sort((a, b) => a.year - b.year || EXAMS.findIndex(e => e.id === a.exam) - EXAMS.findIndex(e => e.id === b.exam));
  return docs.map((d, di) => {

    const R = schoolRanks(d).filter(c => c.by.has(r.sid)); if (!R.length) return '';
    return `<details style="margin-top:10px" ${di === docs.length - 1 ? 'open' : ''}><summary class="mini" style="cursor:pointer">🏫 ${d.year}년 ${esc(examOf(d).label)} — 전교 석차 · 등급 (원점수로 계산)</summary>
      <table class="dtable" style="margin-top:6px"><tr><th>과목</th><th style="text-align:center">원점수</th><th style="text-align:center">전교 석차</th><th style="text-align:center">상위</th><th style="text-align:center">등급</th></tr>
      ${R.map(c => { const x = c.by.get(r.sid); return `<tr><td><b>${esc(c.subj)}</b></td><td style="text-align:center">${x.v}</td><td style="text-align:center">${x.rank} / ${x.N}${x.ties > 1 ? ` <span class="mini">(동점 ${x.ties}명)</span>` : ''}</td><td style="text-align:center">${x.pct.toFixed(1)}%</td>${gradeCell(x.g, 5)}</tr>`; }).join('')}</table>
      <p class="mini" style="margin-top:4px">누적비율 1등급 ~10% · 2등급 ~34% · 3등급 ~66% · 4등급 ~90% · 5등급 ~100% (동점은 중간석차). 지필 원점수만으로 계산해서, 수행평가까지 더한 학기말 등급과는 다를 수 있어요.</p></details>`;
  }).join('');
}
const DROP_COL = /이름|성명|생년|주민|연락|전화|휴대|주소|보호자|학부모|이메일/;
const ID_COL = /^(학년|반|번호|번|학번)$/;
// 엑셀 한 시트(줄 배열) → { cols, rows: [{ sid, no, v: [...] }], dropped }
function parseScoreSheet(aoa) {
  // 칸 안 줄바꿈(특기사항 여러 줄)은 살리고 띄어쓰기만 정리해요
  const rows = aoa.map(r => r.map(v => String(v ?? '').replace(/[ \t ]+/g, ' ').replace(/ *\n */g, '\n').trim()));
  const flat = c => c.replace(/\s/g, '');
  const isNoHead = c => /^(번호|번)$/.test(flat(c));
  // 학번 칸 → 없으면 반 + 번호 칸(전교생 파일) → 없으면 번호 칸(우리반 파일)
  let idKind = 'sid', h = rows.findIndex(r => r.some(c => flat(c) === '학번'));
  if (h < 0) { idKind = 'cb'; h = rows.findIndex(r => r.some(c => flat(c) === '반') && r.some(isNoHead)); }
  if (h < 0) { idKind = 'no'; h = rows.findIndex(r => r.some(c => flat(c) === '번호')); }
  if (h < 0) throw new Error("'학번', '반 · 번호', '번호' 머리글을 찾지 못했어요");
  const idCol = idKind === 'cb' ? rows[h].findIndex(isNoHead) : rows[h].findIndex(c => flat(c) === (idKind === 'sid' ? '학번' : '번호'));
  const clsCol = idKind === 'cb' ? rows[h].findIndex(c => flat(c) === '반') : -1, grCol = rows[h].findIndex(c => flat(c) === '학년');
  const lastNum = x => (String(x || '').match(/\d+/g) || []).pop() || '';   // '1-10', '10반' → '10'
  const isData = r => {
    const x = r[idCol] || '';
    if (idKind === 'cb') return /^\d{1,2}$/.test(x) && /^\d{1,2}$/.test(lastNum(r[clsCol])) && (r[clsCol] || '').length <= 6;
    return idKind === 'sid' ? /^[\d\- ]+$/.test(x) && x.replace(/\D/g, '').length >= 4 && x.replace(/\D/g, '').length <= 6 : /^\d{1,2}$/.test(x);
  };
  const first = rows.findIndex((r, i) => i > h && isData(r));
  if (first < 0) throw new Error('학생 성적 줄을 찾지 못했어요');
  const data = rows.slice(first).filter(isData);
  const width = Math.max(...rows.slice(h).map(r => r.length));
  // 머리글이 여러 줄이면 (예: 국어 / 원점수 · 등급) 이어 붙여요. 위쪽 합친 칸 글자는 오른쪽으로 이어 받아요
  const names = [];
  for (let c = 0; c < width; c++) names.push([]);
  for (let i = h; i < first; i++) {
    let carry = '';
    for (let c = 0; c < width; c++) {
      let v = rows[i][c] || '';
      if (v) carry = v; else if (i < first - 1 && rows[first - 1][c]) v = carry;
      if (v && names[c][names[c].length - 1] !== v) names[c].push(v);
    }
  }
  // 창체 표 위쪽 공통 머리글('창의적 체험활동상황')은 떼어요
  const head = names.map(p => p.join(' ').replace(/\n/g, ' ').replace(/^창의적\s*체험\s*활동(상황)?\s*/, ''));
  const noCol = idKind === 'no' ? idCol : head.findIndex(n => flat(n) === '번호');
  const keep = [], dropped = [];
  head.forEach((n, c) => {
    if (c === idCol || c === noCol || ID_COL.test(flat(n))) return;
    const vals = data.map(r => r[c] || '').filter(Boolean);
    if (!vals.length) return;                                                     // 빈 칸
    if (DROP_COL.test(flat(n))) { dropped.push(n); return; }                       // 이름 · 연락처 칸
    if (vals.every(v => /^[가-힣]{2,4}$/.test(v)) && new Set(vals).size > vals.length / 2) { dropped.push((n || `칸${c + 1}`) + ' (이름처럼 보여서)'); return; }
    keep.push(c);
  });
  return {
    cols: keep.map(c => head[c] || `칸${c + 1}`), dropped,
    rows: data.map(r => {
      let sid = idKind === 'sid' ? r[idCol].replace(/\D/g, '') : '';
      if (idKind === 'cb') {   // 반 · 번호로 학번 5자리를 만들어요 (학년 칸이 없으면 우리반 학년)
        const g = lastNum(r[grCol]).slice(-1) || myClass().g;
        sid = `${g}${lastNum(r[clsCol]).padStart(2, '0')}${r[idCol].padStart(2, '0')}`;
      }
      return { sid, no: idKind === 'no' ? parseInt(r[idCol], 10) : sidNo(sid), v: keep.map(c => r[c] || '') };
    }).sort((a, b) => a.sid.localeCompare(b.sid))
  };
}
async function scoreUpload(id, inp) {
  const f = inp.files[0]; if (!f) return;

    if (!window.XLSX) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
    let p = null, err = null;
    for (const n of wb.SheetNames) {     // 첫 번째로 읽히는 시트를 써요
      try { p = parseScoreSheet(XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: '', raw: false })); break; } catch (e) { err = e; }

/* ③ 생기부 자료 — 나이스 표를 드래그해 복사(Ctrl+C)한 뒤 붙여 넣어요 (AI 안 씀, 무료)
   번호 · 성명 머리글까지 같이 복사하면 성명 칸은 버리고 번호 + 나머지 칸만 저장해요 */
const recKey = (y, id) => `rec_${y}_${id}`;
const recOf = d => RECORDS.find(r => r.id === d.kind) || { label: d.kind };
// 복사한 표 글 → 줄 배열. 엑셀처럼 "..." 로 감싼 여러 줄 칸도 한 칸으로 읽어요
function parseTSV(t) {
  const rows = [[]]; let cell = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"' && cell === '') q = true;
    else if (ch === '\t') { rows[rows.length - 1].push(cell); cell = ''; }
    else if (ch === '\n') { rows[rows.length - 1].push(cell); cell = ''; rows.push([]); }
    else if (ch !== '\r') cell += ch;
  }
  rows[rows.length - 1].push(cell);
  return rows.filter(r => r.some(c => c.trim()));
}
// 미리 보기를 만들고, 표의 '영역' 칸이 다른 창체 영역이면 그 영역으로 바꿔 줘요
function recSetPending(p) {
  const iArea = p.cols.findIndex(c => /영역/.test(c));
  const area = iArea >= 0 ? (p.rows.find(r => r.v[iArea]) || { v: [] }).v[iArea] : '';
  const hit = p.cols.some(c => /봉사/.test(c)) ? RECORDS.find(r => r.id === 'vol')
    : p.cols.some(c => /수업일수|결석|지각/.test(c)) ? RECORDS[0]
    : p.cols.some(c => /종합의견/.test(c)) ? RECORDS.find(r => r.id === 'haeng')
    : area && RECORDS.find(r => r.chang && r.chang.test(area));
  if (hit && hit.id !== p.kind) { p.kind = hit.id; DASH.rec = hit.id; toast(`📋 표 모양을 보니 ${hit.label}(으)로 넣을게요`); }
  DASH.recPending = p; dashRefresh();
}
// 행발처럼 긴 글 한 칸 표는 쪽이 넘어가며 이어진 글까지 합쳐 읽어요
function parseAnyRec(aoa) {
  const top = aoa.slice(0, 20).flat().join('').replace(/\s/g, '');
  if (/주관기관|봉사활동/.test(top) && /활동내용/.test(top)) return parseVol(aoa);
  if (/종합의견/.test(top)) {
    const g = parseSetuk(aoa)[0];
    return { cols: ['행동특성 및 종합의견'], dropped: ['성명'], rows: g.rows.map(r => ({ sid: '', no: r.no, v: [r.text] })) };
  }
  return parseScoreSheet(aoa);
}
/* 봉사활동상황: 한 학생이 여러 줄 (번호 · 성명은 첫 줄에만 있고 아래 줄은 비어 있어요)
   → 학생마다 한 줄로 모아요: [활동 수, 시간 합계, 활동 목록] + items(날짜 · 장소 · 내용 · 시간) */
function parseVol(aoa) {
  const rows = aoa.map(r => r.map(v => String(v ?? '').replace(/\s+/g, ' ').trim()));
  const flat = c => c.replace(/\s/g, '');
  const h = rows.findIndex(r => r.some(c => flat(c) === '활동내용'));
  if (h < 0) throw new Error("'활동 내용' 머리글을 찾지 못했어요");
  const col = re => rows[h].findIndex(c => re.test(flat(c)));
  const iNo = col(/^번호$|^번$/), iDate = col(/일자|기간/), iPlace = col(/장소|주관/), iText = col(/^활동내용$/), iH = col(/^시간$/);
  if (iNo < 0) throw new Error("'번호' 칸이 없어요 — 번호 · 성명 칸부터 같이 복사해 주세요");
  const by = new Map(); let no = null, last = null;
  rows.slice(h + 1).forEach(r => {
    if (r.some(c => flat(c) === '활동내용')) return;                 // 쪽이 넘어가며 다시 나온 머리글
    const n = r[iNo] || '';
    if (/^\d{1,6}$/.test(n)) { no = +n % 100 || +n; last = null; }   // 학번이면 끝 두 자리
    else if (n) return;                                               // 제목 · 반 같은 줄
    if (no === null) return;
    const date = r[iDate] || '', text = r[iText] || '';
    if (!date && text && last) { last.text += ' ' + text; return; }  // 쪽이 넘어가며 이어진 글
    if (!date && !text) return;
    last = { date, place: iPlace >= 0 ? r[iPlace] || '' : '', text, h: iH >= 0 ? parseFloat(r[iH]) || 0 : 0 };
    if (!by.has(no)) by.set(no, []);
    by.get(no).push(last);
  });
  if (!by.size) throw new Error('학생 봉사 줄을 찾지 못했어요');
  return {
    cols: ['활동 수', '봉사 시간 합계', '봉사 활동'], dropped: ['성명', '학년', '누계시간'],
    rows: [...by].sort((a, b) => a[0] - b[0]).map(([no, items]) => ({ sid: '', no, items,
      v: [items.length + '', items.reduce((s, x) => s + x.h, 0) + '', items.map(x => `${x.date} ${x.text} (${x.h}시간)`).join('\n')] }))
  };
}
// '2026.03.19.' → '2026-03-19' (AI에 날짜 순으로 넣을 때)
const volDate = s => { const m = String(s).match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/); return m ? `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}` : ''; };
function recPreview() {
  try {

/* 교과학습발달상황 — 학기마다 문서 하나 (meta/rec_연도_gyogwa_학기). 번호 + 교과 · 과목 · 학점 · 원점수 · 성취도 · 석차등급 …

    }
    if (!aoa.length) return toast('표를 복사해 붙여 넣어 주세요');
    DASH.gyPending = parseGyogwa(aoa); dashRefresh();
  } catch (e) { toast('📗 ' + e.message); }
}
async function gyogwaSave() {

      const key = gyogwaKey(y, g.sem), doc = { kind: 'gyogwa', year: y, sem: g.sem, grade: g.grade, cols: g.cols, rows: g.rows, at: Date.now() };

    }
  } catch (e) { return toast('☁️ 저장 실패: ' + e.message); }

}
async function gyogwaDelete(key) {

// 한 학생 · 한 학기 교과 표 (nos = 번호 → 표에 번호 · 동물 칸 없이)

/* ---------------- 🎨 동아리 업무 — 맡은 동아리 부원 (우리반 친구와 따로) ----------------
   흐름: 활동 일화 → ✨ AI 문구 → ➕ 담기 → ✨ 동아리활동 특기사항 한 단락 → 📋 복사
   저장: 클라우드 meta/club 한 문서 { name, members: [{ id, emoji, nick, tag, eps, sents, final }] } — 이름 · 학번 없음 */
let CL = { name: '', members: [] }, clubSel = null, clubTimer = null;

function saveClub() {
  if (!db) return;

  clubTimer = setTimeout(() => roomRef().collection('meta').doc('club').set(clone(CL)).catch(e => toast('☁️ 저장 실패: ' + e.message)), 500);
}
const clubCur = () => CL.members.find(m => m.id === clubSel);
const clubName = m => `${m.emoji} ${m.nick || '부원'}${m.tag || ''}`;
function openClub() {
  if (syncState !== 'cloud') return toast('🔑 로그인한 뒤에 쓸 수 있어요');
  if (!clubCur()) clubSel = clubSorted()[0]?.id || null;
  openModal('🎨 동아리 업무', viewClub(), true);
}
function clubRefresh() { $('#mBody').innerHTML = viewClub(); }
function clubSorted() {
  const tn = m => { const n = parseInt(m.tag, 10); return isNaN(n) ? 1e9 : n; };
  return [...CL.members].sort((a, b) => (a.nick || '').localeCompare(b.nick || '', 'ko') || tn(a) - tn(b));
}
// 부원 n명 만들기 (동물 · 숫자는 아무거나, 겹치지 않게)
function clubAdd(n) {
  const pool = Object.keys(ANIMAL_NAMES);
  for (let i = 0; i < n; i++) {
    const used = new Set(CL.members.map(m => m.emoji)), free = pool.filter(e => !used.has(e));
    const e = (free.length ? free : pool)[Math.floor(Math.random() * (free.length || pool.length))], nick = ANIMAL_NAMES[e];
    const tags = new Set(CL.members.filter(m => m.nick === nick).map(m => m.tag));
    let tag = ''; for (let k = 0; k < 50 && (!tag || tags.has(tag)); k++) tag = String(1 + Math.floor(Math.random() * 9999));
    const m = { id: uid(), emoji: e, nick, tag, eps: [], sents: [], final: '' };
    CL.members.push(m); clubSel = m.id;
  }
  saveClub(); clubRefresh();
}
function clubSet(k, v) {
  const m = clubCur(); if (!m) return;
  if (k === 'tag') v = String(v).replace(/\D/g, '').slice(0, 4);
  if (k === 'nick' && piiCheck(v).length) return toast('별칭에 숫자·연락처는 빼 주세요');
  m[k] = k === 'nick' ? v.trim() : v; saveClub(); clubRefresh();
}
function clubDel() {
  const m = clubCur(); if (!m || !confirm(`${clubName(m)}의 기록을 모두 지울까요?`)) return;
  CL.members = CL.members.filter(x => x !== m); clubSel = clubSorted()[0]?.id || null; saveClub(); clubRefresh();
}

    <span class="mini">🔒 부원도 이름 · 학번 대신 동물 별칭+숫자로만 적어요. 우리반 친구와 따로 저장돼요.</span></div>

      <div style="max-height:60vh;overflow:auto">${L.map(x => `<div class="sitem ${x === m ? 'on' : ''}" onclick="clubSel='${x.id}';clubRefresh()">
        <span class="num">${x.emoji}</span><div><b>${esc((x.nick || '부원') + (x.tag || ''))}</b><span>일화 ${x.eps.length} · ${x.final ? '단락 ✓' : '단락 전'}</span></div></div>`).join('') || '<div class="empty">＋ 를 눌러 부원을 만들어요</div>'}</div>
    </div>

}
function clubMember(m) {
  const picked = m.sents.filter(s => s.picked).sort((a, b) => a.pickedAt - b.pickedAt);

    <div class="cols c2">
      <div class="box"><div class="hd purple"><span class="n">1</span>활동 일화</div><div class="bd">

        ${[...m.eps].sort((a, b) => b.date.localeCompare(a.date)).map(e => `<div class="item" style="margin-top:8px"><div class="top"><b class="mini">${e.date}</b>
          <button class="x" style="margin-left:auto" onclick="clubDelEp('${e.id}')">✕</button></div><div style="white-space:pre-wrap;font-size:13px">${esc(e.text)}</div>
          <button class="btn ai sm" style="margin-top:4px" onclick="clubGen(clubCur().eps.find(x=>x.id==='${e.id}').text,this)">✨ 문구 (다시) 만들기</button></div>`).join('')}
      </div></div>
      <div class="box"><div class="hd pink"><span class="n">2</span>문구 → 담기 <span class="sp mini" style="color:#fff">${m.sents.length}개</span></div><div class="bd">
        <div class="row" style="margin-bottom:8px"><input type="text" id="clNew" placeholder="직접 문구 붙이기" style="flex:1"><button class="btn sm" onclick="clubManual()">📌</button></div>
        ${m.sents.map(s => `<div class="item" style="${s.picked ? 'border-color:var(--main);background:var(--mainL)' : ''}">
          ${s.trait ? `<span class="chip">#${esc(s.trait)}</span> ` : ''}<span style="font-size:13.5px">${esc(s.text)}</span>
          <div class="row" style="margin-top:4px"><button class="btn sm ${s.picked ? 'ghost' : ''}" onclick="clubPick('${s.id}')">${s.picked ? '➖ 빼기' : '➕ 담기'}</button>
            <span class="mini">${nbytes(s.text)}B</span><button class="x" style="margin-left:auto" onclick="clubDelSent('${s.id}')">🗑</button></div></div>`).join('') || '<div class="empty">일화에서 ✨ 문구로 바꾸기를 누르면 여기에 붙어요</div>'}
      </div></div>
    </div>
    <div class="box" style="margin-top:14px"><div class="hd green"><span class="n">3</span>동아리활동 특기사항 <span class="sp" style="font-size:15px" id="clB">${fb} / ${CLUB_LIMIT}B</span></div><div class="bd">
      <div class="basket"><h4>🧺 담은 문구 <span class="mini">${pb}B</span></h4>
        ${picked.map((s, i) => `<div class="bitem"><div>${esc(s.text)}</div><div style="flex:none;display:flex;flex-direction:column">
          <button class="x" onclick="clubMove('${s.id}',-1)" ${i === 0 ? 'disabled' : ''}>▲</button><button class="x" onclick="clubMove('${s.id}',1)" ${i === picked.length - 1 ? 'disabled' : ''}>▼</button></div></div>`).join('') || '<div class="mini">위에서 ➕ 담기를 눌러요</div>'}
        ${picked.length ? `<button class="btn ai sm" style="margin-top:6px" onclick="clubPolish(this)">✨ 한 단락으로 다듬기</button>` : ''}</div>

      <div class="row" style="margin-top:6px"><span class="mini">${fb > CLUB_LIMIT ? '⚠️ 바이트를 넘었어요' : '나이스 바이트 기준'}</span><button class="btn sm" style="margin-left:auto" onclick="copyText(clubCur().final)">📋 복사</button></div>
    </div></div>`;
}
function clubEp(gen, btn) {
  const m = clubCur(), text = $('#clEp').value.trim();
  if (!text) return toast('일화를 적어 주세요');
  if (!piiOk(text)) return;
  m.eps.push({ id: uid(), date: $('#clDate').value || today(), text }); saveClub();
  if (gen) clubGen(text, btn); else { clubRefresh(); toast('💾 저장했어요'); }
}
function clubDelEp(id) { const m = clubCur(); if (!confirm('지울까요?')) return; m.eps = m.eps.filter(e => e.id !== id); saveClub(); clubRefresh(); }
async function clubGen(text, btn) {
  const m = clubCur();
  await withBusy(btn, async () => {
    const out = await callAI(SYS_RULES + `
지금은 담임이 아니라 동아리 담당 교사로서 '동아리활동 특기사항' 문구를 쓴다.
출력 형식: 반드시 JSON 배열만 출력한다. [{"trait":"드러나는 특성 2~6글자","text":"생기부 문구"}]
- 관찰 내용에서 드러나는 특성마다 하나씩, 2~4개를 만든다.
- 각 text는 1~2문장, 한글 70~160자. 동아리 활동 속 구체적 행동과 거기서 드러나는 역량 · 성장을 함께 담는다.`,
      `[동아리] ${CL.name || '(이름 없음)'}\n\n[관찰 내용]\n${text}`);
    const arr = parseJSONArray(out);
    if (!arr.length) throw new Error('문구를 읽지 못했어요. 다시 눌러 주세요');
    arr.forEach(a => m.sents.push({ id: uid(), text: String(a.text || '').trim(), trait: String(a.trait || '').slice(0, 10), picked: false, pickedAt: 0 }));
    saveClub(); clubRefresh(); toast(`✨ 문구 ${arr.length}개를 붙였어요`);
  });
}
function clubManual() { const m = clubCur(), t = $('#clNew').value.trim(); if (!t || !piiOk(t)) return; m.sents.push({ id: uid(), text: t, trait: '', picked: false, pickedAt: 0 }); saveClub(); clubRefresh(); }
function clubPick(id) { const s = clubCur().sents.find(x => x.id === id); s.picked = !s.picked; s.pickedAt = Date.now(); saveClub(); clubRefresh(); }
function clubDelSent(id) { const m = clubCur(); m.sents = m.sents.filter(x => x.id !== id); saveClub(); clubRefresh(); }
function clubMove(id, dir) {
  const items = clubCur().sents.filter(x => x.picked).sort((a, b) => a.pickedAt - b.pickedAt);
  const i = items.findIndex(x => x.id === id), j = i + dir; if (j < 0 || j >= items.length) return;
  [items[i].pickedAt, items[j].pickedAt] = [items[j].pickedAt, items[i].pickedAt]; saveClub(); clubRefresh();
}
function clubFinal(v) { if (!piiOk(v)) return; clubCur().final = v; saveClub(); }
async function clubPolish(btn) {
  const m = clubCur(), items = m.sents.filter(s => s.picked).sort((a, b) => a.pickedAt - b.pickedAt);
  await withBusy(btn, async () => {
    const out = await callAI(SYS_RULES, `아래 문구들을 고등학교 생기부 '동아리활동' 특기사항 한 단락으로 자연스럽게 엮어 줘.
- 동아리: ${CL.name || '(이름 없음)'} — 동아리 이름은 맨 앞에 '(${CL.name || '동아리명'})' 처럼 괄호로 한 번만 써.
- 새 사실을 더하지 말고, 겹치는 내용은 합쳐 줘. 명사형 종결.
- 나이스 기준 ${CLUB_LIMIT}바이트(한글 1자=3바이트, 대략 ${Math.floor(CLUB_LIMIT / 3)}자) 이내.
- 단락 본문만 출력해. 제목 · 따옴표 · 설명 없이.
문구:\n${items.map((s, i) => `${i + 1}. ${s.text}`).join('\n')}`, 1500);
    m.final = out.trim(); saveClub(); clubRefresh(); toast('✨ 특기사항 칸에 넣었어요');
  });
}

/* ---------------- 설정 ---------------- */
function openSettings() {
  openModal('⚙️ 설정', `
  <section><h4>🔒 개인정보 약속</h4><div class="mini">· 학생은 동물 친구(별칭+번호)로만 구분해요. 이름·연락처는 어디에도 저장하지 않아요.<br>· 성적 파일 · 출결은 학번(번호)과 칸만 선생님 계정 클라우드에 저장하고, 이 기기에는 남기지 않아요.<br>· 글에 학번처럼 보이는 숫자, 전화번호, 이메일이 있으면 저장 전에 알려 줘요.<br>· AI에는 동물 별칭도 보내지 않고, 적은 내용만 보내요.<br>· AI 키는 이 기기 브라우저에만 저장되고 클라우드에는 올라가지 않아요.</div></section>
  <section><h4>🏫 반 이름</h4><input type="text" id="stClass" value="${esc(S.className)}"></section>
  <section><h4>🤖 AI 연결 (AI 단추에만 필요해요)</h4>
    <p class="mini" style="margin:0 0 8px">💚 <b>Gemini 무료 키</b>면 돈이 들지 않아요 (aistudio.google.com/apikey 에서 만들기). Claude 키는 유료(충전식)예요. 키가 없어도 AI 단추 말고 다른 기능은 다 써요.</p>
    <div class="row" style="margin-bottom:8px"><label><input type="radio" name="prov" value="claude" ${S.provider === 'claude' ? 'checked' : ''}> Claude</label><label><input type="radio" name="prov" value="gemini" ${S.provider === 'gemini' ? 'checked' : ''}> Gemini</label></div>
    <input type="password" id="stKey" value="${esc(S.apiKey)}" placeholder="API 키 (sk-ant-… 또는 AIza…)">
    <input type="text" id="stModel" value="${esc(S.model)}" placeholder="모델 이름 (비우면 기본: Claude는 claude-sonnet-5-5, Gemini는 gemini-3.8-flash)" style="margin-top:6px">
    <div class="row" style="margin-top:8px"><button class="btn sm ghost" onclick="testAI(this)">🔌 연결 시험</button><span class="mini">공용 컴퓨터에서는 키를 넣지 마세요.</span></div>
  </section>
  <section><h4>☁️ 클라우드 저장 (어느 기기에서나 이어 쓰기)</h4>
    <div class="row" style="margin-bottom:8px">${fbUser
      ? `<span class="mini">🔑 ${esc(fbUser.email)} ${fbUser.email === ADMIN_EMAIL ? '로그인됨' : '(이 계정은 클라우드를 못 써요)'}</span><button class="btn sm ghost" style="margin-left:auto" onclick="logout()">로그아웃</button>`
      : `<span class="mini">클라우드는 선생님 구글 계정으로 로그인했을 때만 열려요</span><button class="btn sm" style="margin-left:auto" onclick="login()">🔑 구글 로그인</button>`}</div>
    <p class="mini">어느 기기에서든 로그인하면 같은 기록이 보여요. 로그아웃하면 이 기기에 남은 사본도 지워져요.</p>
  </section>
  <section><h4>💾 백업</h4><div class="row"><button class="btn sm ghost" onclick="exportData()">⬇️ 백업 파일 받기</button><label class="btn sm ghost">⬆️ 백업 불러오기<input type="file" accept=".json" hidden onchange="importData(this)"></label></div></section>
  <button class="btn" onclick="applySettings()">저장하고 닫기</button>`);
}
function readSettingsForm() {
  S.className = $('#stClass').value.trim();
  S.provider = document.querySelector('input[name=prov]:checked').value;
  S.apiKey = $('#stKey').value.trim(); S.model = $('#stModel').value.trim();
}
async function applySettings() {
  readSettingsForm();
  saveSettings(); closeModal(); render();
}
async function testAI(btn) { readSettingsForm(); saveSettings(); await withBusy(btn, async () => { const r = await callAI('짧게 답해.', '연결됐으면 "연결 완료 🌷"라고만 답해.', 50); toast('🤖 ' + r.trim()); }); }
function exportData() {
  const blob = new Blob([JSON.stringify(D, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `생기부노트_백업_${today()}.json`; a.click();
}
function importData(inp) {
  const f = inp.files[0]; if (!f) return;
  f.text().then(t => {
    const o = JSON.parse(t); if (!o.students) throw new Error();
    if (!confirm('지금 기록을 백업 파일 내용으로 바꿀까요?')) return;
    D = { students: o.students.map(normalize), events: o.events || [] };
    D.students.forEach(saveStudent); saveEvents(); V.sid = D.students[0]?.id || null; closeModal(); render(); toast('⬆️ 불러왔어요');
  }).catch(() => toast('백업 파일을 읽지 못했어요'));
}

/* ---------------- 꾸미기 ---------------- */
function cycleTheme() { const t = ['peach', 'mint', 'lavender']; S.theme = t[(t.indexOf(S.theme) + 1) % 3]; saveSettings(); render(); toast({ peach: '🍑 복숭아', mint: '🌿 민트', lavender: '💜 라벤더' }[S.theme]); }
function cycleFont() { const t = ['unz', 'gaegu', 'dodum']; S.font = t[(t.indexOf(S.font) + 1) % 3]; saveSettings(); render(); toast({ unz: '언즈체', gaegu: '개구체', dodum: '고운돋움' }[S.font]); }
function toggleBig() { S.big = S.big === 'on' ? 'off' : 'on'; saveSettings(); render(); }

/* ---------------- 모달·토스트 ---------------- */
function openModal(t, html, wide) { $('#mTitle').textContent = t; $('#mBody').innerHTML = html; $('#modal .sheet').classList.toggle('wide', !!wide); $('#modal .sheet').classList.remove('xwide'); $('#modal').classList.add('on'); }
function closeModal() { $('#modal').classList.remove('on'); }
let tt; function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2600); }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

render();
initFirebase();
</script>
