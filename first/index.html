<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>먼저 플래너</title>
<meta name="description" content="약한 과목을 먼저, 작게 계획하고 실천하는 학생 플래너. 잔소리 쌤이 다정하게(F쌤) 또는 숫자로 딱(T쌤) 챙겨 줘요.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<link rel="icon" href="icon-512.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* 먼저 플래너 (2026-11-13, 주소 /first, 시안 https://claude.ai/artifact/TfMYANU6DV3m7dXEi5AYsP)
   주아체 · 동글한 흰 카드 · 포인트 색 하나(⚙︎ 설정에서 6가지 중 고름) · 배경 4가지(흰 바탕 · 딸기우유 · 스티커 다이어리 · 소다 리본)
   캐릭터 세 명: ① 말하는 쌤(말풍선) ② 카드 위 친구(첫 할 일 위) ③ 막대 걷는 친구(진행 막대) — 기본 6명 + 캡처한 그림 3개까지
   탭 4개(오늘 · 달력 · 성적 · 음악) · 오른쪽 끝 ⏱ 단추 = 오른쪽에서 밀려 나오는 과목 타이머 · 오른쪽 위 ⚙︎ = 설정
   모든 기록은 이 기기(브라우저 저장소 first-v1)에만 저장해요. 로그인 · 서버 없음 */
:root{ color-scheme:light;
  --bg:#FFFFFF; --ink:#1D1D1F; --sub:#8E8E93; --hair:rgba(60,60,67,.14); --soft:#F2F2F7; --soft2:#E5E5EA;
  --f:#FF6F91; --f-soft:#FFF0F3; --t:#0A84FF; --t-soft:#EEF5FF; --ok:#30C46B;
  --sys:-apple-system,BlinkMacSystemFont,'SF Pro Display','Apple SD Gothic Neo','Pretendard','Malgun Gothic',sans-serif;
  --mode:var(--f); --mode-soft:var(--f-soft);
}
body.t{--mode:var(--t);--mode-soft:var(--t-soft)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#F2F2F7;color:var(--ink);font-family:'Jua',var(--sys);font-size:16px;line-height:1.45;word-break:keep-all;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.app{position:relative;max-width:480px;height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:520px){ .app{height:calc(100% - 40px);margin:20px auto;border-radius:28px;box-shadow:0 10px 40px rgba(0,0,0,.08)} }
main{flex:1;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 18px) max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sub{color:var(--sub);font-size:13px}
.big{font-weight:700;font-size:30px;letter-spacing:-.02em;line-height:1.15;margin:0}
.ic{width:34px;height:34px;border-radius:50%;border:0;background:var(--soft);color:var(--sub);display:grid;place-items:center;cursor:pointer;flex:none;font-size:16px}
.say{font-size:15px;line-height:1.5;padding:12px 14px;border-radius:16px;background:var(--mode-soft)}
.say b{display:block;font-size:11px;font-weight:600;color:var(--mode);margin-bottom:2px}
.list{display:flex;flex-direction:column}
.item{border-bottom:.5px solid var(--hair)}.item:last-child{border-bottom:0}
.row{display:flex;align-items:center;gap:10px;padding:13px 0;min-height:52px}
.row .nm{flex:1;min-width:0;cursor:pointer}
.row .nm small{color:var(--sub);font-size:13px;margin-left:6px}
.first{color:var(--mode);font-size:11px;font-weight:600;margin-left:6px}
.dot{width:24px;height:24px;border-radius:50%;border:1.5px solid #C7C7CC;background:none;flex:none;cursor:pointer;padding:0}
.done .dot{background:var(--mode);border-color:var(--mode)}
.done .nm>span{color:var(--sub);text-decoration:line-through}
.play{border:0;background:var(--soft);color:var(--mode);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer}
.det{margin:-6px 0 10px;padding:0 0 0 20px;color:var(--sub);font-size:13.5px;line-height:1.6}
.det li::marker{color:var(--mode);font-weight:600}
.det-act{display:flex;gap:14px;margin:-4px 0 12px 20px}
.link{border:0;background:none;padding:0;color:var(--mode);font-size:13px;cursor:pointer}
.link.del{color:var(--sub)}
.add{border:0;width:100%;border-radius:14px;padding:13px;text-align:center;font-weight:600;font-size:15px;color:var(--mode);background:var(--mode-soft);cursor:pointer}
.empty{color:var(--sub);text-align:center;padding:20px 0;font-size:14px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:.5px solid var(--hair);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.tabs button{border:0;background:none;color:var(--sub);font-size:11px;font-weight:500;display:grid;justify-items:center;gap:3px;cursor:pointer;padding:2px 0}
.tabs svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--mode);font-weight:600}
/* ⏱ 오른쪽에서 밀려 나오는 타이머 */
.edge{touch-action:none;position:absolute;right:0;top:44%;width:36px;height:100px;border:0;border-radius:18px 0 0 18px;background:var(--mode);color:#fff;font-size:19px;padding-left:3px;cursor:pointer;z-index:4;box-shadow:-2px 2px 8px rgba(0,0,0,.12)}
.edge.run{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.2);z-index:5;opacity:0;pointer-events:none;transition:opacity .25s}
.side{position:absolute;top:0;bottom:0;right:0;width:88%;background:rgba(255,255,255,.97);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:-10px 0 30px rgba(0,0,0,.12);border-radius:28px 0 0 28px;transform:translateX(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:6;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 16px) 20px calc(20px + env(safe-area-inset-bottom,0px));gap:12px}
.app.timer-open .side{transform:none}.app.timer-open .scrim{opacity:1;pointer-events:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:0;font-size:13px;padding:6px 12px;border-radius:999px;background:var(--soft);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--mode);color:#fff}
.clock{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.clock .num{font-weight:200;font-size:76px;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.bar{width:220px;height:6px;border-radius:3px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--mode);border-radius:3px}
.pill{border:0;border-radius:999px;padding:13px 32px;font-weight:600;font-size:16px;background:var(--ink);color:#fff;cursor:pointer}
.pill.light{background:var(--soft);color:var(--ink)}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
/* 📅 달력 */
.mnav{display:flex;align-items:center;gap:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .dh{color:var(--sub);font-size:12px}
.cal button{aspect-ratio:1;border:0;border-radius:50%;display:grid;place-items:center;font-size:13px;color:var(--ink);background:none;cursor:pointer;padding:0}
.cal button.today{outline:2px solid var(--ink);outline-offset:1px}
.l0{box-shadow:inset 0 0 0 1px #D1D1D6;color:var(--sub)!important}
.l1{background:color-mix(in srgb,var(--mode) 10%,#fff)!important}
.l2{background:color-mix(in srgb,var(--mode) 35%,#fff)!important}
.l3{background:color-mix(in srgb,var(--mode) 72%,#fff)!important;color:#fff!important;font-weight:600}
.l4{background:color-mix(in srgb,var(--mode) 85%,#000)!important;color:#fff!important;font-weight:700}
.fut{color:#C7C7CC!important;box-shadow:none!important;background:none!important}
.lg{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:11.5px;color:var(--sub)}
.lg i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-2px;margin-right:4px}
.dayinfo{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14px}
.dayinfo .r{display:flex;justify-content:space-between;padding:3px 0}
/* 📈 성적 */
.chart svg{width:100%;height:auto;display:block}
.glist .row{min-height:44px}
/* 설정 · 시트 */
.gh{font-size:12.5px;color:var(--sub);margin:4px 4px -10px}
.grp{background:var(--soft);border-radius:14px;padding:0 14px}
.grp .row{min-height:48px;border-bottom:.5px solid var(--hair);justify-content:space-between}
.grp .row:last-child{border-bottom:0}
.seg{display:inline-flex;background:var(--soft2);border-radius:9px;padding:2px}
.seg button{border:0;background:none;font-weight:600;font-size:13px;padding:5px 14px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.step{display:inline-flex;align-items:center;gap:8px}
.step button{width:28px;height:28px;border-radius:50%;border:0;background:#fff;font-weight:600;font-size:16px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.step b{min-width:48px;text-align:center;font-weight:600;font-size:15px}
.mini{width:14px;height:14px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:-2px}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.25);z-index:8}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:9;background:#fff;border-radius:22px 22px 0 0;padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:88%;overflow-y:auto;box-shadow:0 -10px 30px rgba(0,0,0,.12)}
.sheet h2{margin:0;font-size:20px}
.sheet label{display:grid;gap:6px;font-size:13px;color:var(--sub)}
.sheet input,.sheet textarea,.sheet select{border:0;background:var(--soft);border-radius:12px;padding:11px 12px;font-size:16px;color:var(--ink);width:100%}
.sheet textarea{min-height:96px;resize:vertical;line-height:1.5}
.gpick{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:center;font-size:14px}
.gpick .chips button{min-width:30px;padding:5px 0;text-align:center}
.note{font-size:12.5px;color:var(--sub);margin:0}
.policy summary{cursor:pointer;color:var(--sub);font-size:13px}
.policy div{font-size:12.5px;color:var(--sub);line-height:1.6}
.policy h4{margin:10px 0 2px;font-size:13px;color:var(--ink)}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(29,29,31,.92);color:#fff;font-size:14px;padding:9px 16px;border-radius:999px;z-index:20;white-space:nowrap}
:focus-visible{outline:3px solid var(--mode);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.side,.scrim{transition:none}.edge.run{animation:none}.sayw .ava,.walker,.peeker{animation:none}}
/* ===== 꾸미기 (2026-11-13): 배경 4가지 · 카드 · 캐릭터 세 명 ===== */
.app.bg-s{background-color:#FFF6F8;background-image:linear-gradient(90deg,rgba(255,170,190,.2) 50%,transparent 0),linear-gradient(rgba(255,170,190,.2) 50%,transparent 0);background-size:28px 28px}
.app.bg-d{background-color:#FFFBF2;background-image:radial-gradient(circle,#E9DFC9 1.2px,transparent 1.6px);background-size:16px 16px}
.app.bg-r{background-color:#EEF7FF;background-image:radial-gradient(circle,#fff 5px,transparent 5.5px);background-size:34px 34px}
.bg-r .big.ttl::after{content:"🎀";font-size:22px;margin-left:6px;vertical-align:4px}
.big{font-weight:400}
.cards{display:flex;flex-direction:column;gap:9px}
.cards .item{background:#fff;border:1.5px solid #F0EAED;border-radius:18px;padding:0 14px;position:relative}
.cards .item:last-child{border-bottom:1.5px solid #F0EAED}
.bg-s .cards .item{border-color:#FFD0DC;box-shadow:0 3px 0 #FFD0DC}
.bg-d .cards .item{border-radius:8px;border-color:#EFE4D2;box-shadow:2px 3px 0 rgba(74,59,53,.1);rotate:-.5deg}.bg-d .cards .item:nth-child(2n){rotate:.6deg}
.bg-d .cards .item:not(:first-child)::before{content:"";position:absolute;top:-7px;left:20px;width:50px;height:14px;rotate:-4deg;background:repeating-linear-gradient(90deg,rgba(140,205,170,.75) 0 6px,rgba(170,225,195,.75) 6px 12px)}
.bg-d .cards .item:nth-child(2n)::before{left:auto;right:22px;rotate:5deg;background:repeating-linear-gradient(90deg,rgba(255,180,200,.8) 0 6px,rgba(255,210,222,.8) 6px 12px)}
.bg-r .cards .item{border-color:#DCEBF8}
.cards .dot{border-color:#DDD5D9}
.done .dot{animation:pop .45s cubic-bezier(.3,1.8,.5,1)}@keyframes pop{35%{transform:scale(1.3) rotate(-10deg)}}
.done .nm>span{text-decoration:none;opacity:.45}
.first{background:var(--mode-soft);border-radius:999px;padding:1px 7px;vertical-align:2px}
.play{background:var(--mode-soft)}
.add{background:#fff;border:1.5px dashed var(--mode)}
.tabs{background:rgba(255,255,255,.95)}
.ch{display:block;width:100%;height:100%}.ch svg,.ch img{width:100%;height:100%;object-fit:contain;display:block}
.sayw{display:flex;gap:10px;align-items:flex-start}
.sayw .ava{flex:none;width:48px;height:48px;animation:nod 3s ease-in-out infinite}
@keyframes nod{50%{transform:rotate(-7deg) translateY(-2px)}}
@keyframes hop{50%{transform:translateY(-4px)}}
.sayw .say{flex:1;border-radius:18px 18px 18px 6px}
.say b{display:none}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;margin-top:14px}
.prog .tr{flex:1;height:8px;border-radius:4px;background:#F2EEF0;position:relative}
.prog .tr i{display:block;height:100%;border-radius:4px;background:var(--mode);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.walker{position:absolute;width:32px;height:32px;top:-30px;margin-left:-16px;transition:left .6s cubic-bezier(.2,.8,.2,1);animation:hop .5s ease-in-out infinite;pointer-events:none}
.cards.peek{margin-top:18px}
.peeker{position:absolute;right:62px;top:-31px;width:40px;height:40px;z-index:2;pointer-events:none;animation:nod 3.4s ease-in-out infinite}
.say2{position:absolute;right:106px;top:-28px;z-index:2;background:#fff;border:1px solid #F0EAED;font-size:12px;padding:3px 9px;border-radius:12px 12px 4px 12px;white-space:nowrap;opacity:0;transform:translateY(4px);transition:.3s;pointer-events:none}
.say2.on{opacity:1;transform:none}
/* 설정 · 꾸미기 */
.grp.pad{padding:12px 14px;display:grid;gap:12px}
.bgs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bgs button{border:1.5px solid #E5E5EA;border-radius:14px;padding:0;height:58px;cursor:pointer;font-size:11.5px;display:grid;align-items:end;padding-bottom:4px;background-size:auto}
.bgs button[aria-pressed="true"]{border-color:var(--mode);box-shadow:0 0 0 3px var(--mode-soft)}
.cols{display:flex;gap:12px;flex-wrap:wrap}.cols button{width:28px;height:28px;border-radius:50%;border:0;cursor:pointer;background:var(--c)}
.cols button[aria-pressed="true"]{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--c)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border:1.5px solid #E5E5EA;background:#fff;border-radius:16px;padding:8px 4px 6px;display:grid;justify-items:center;gap:1px;cursor:pointer}
.slot .ch{width:52px;height:52px}.slot b{font-size:12.5px;font-weight:400}.slot small{font-size:10.5px;color:var(--sub)}
.slot[aria-pressed="true"]{border-color:var(--mode);box-shadow:0 0 0 3px var(--mode-soft)}
.lib{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.lib .it{position:relative}
.lib .it>button:first-child{width:100%;aspect-ratio:1;border:1.5px solid #E5E5EA;background:#fff;border-radius:14px;padding:4px;cursor:pointer}
.lib .it>button[aria-pressed="true"]{border-color:var(--mode)}
.lib .x{position:absolute;right:-5px;top:-5px;width:20px;height:20px;border-radius:50%;border:0;background:#8E8E93;color:#fff;font-size:11px;cursor:pointer;line-height:1}
.capb{display:flex;gap:10px;align-items:center;text-align:left;border:1.5px dashed var(--mode);background:var(--mode-soft);border-radius:14px;padding:10px 12px;cursor:pointer;width:100%}
.capb i{font-style:normal;font-size:24px}.capb b{display:block;color:var(--mode);font-weight:400}.capb small{display:block;font-size:11.5px;color:var(--sub);line-height:1.4}
.cap-paste{border:1.5px dashed #C7C7CC;border-radius:14px;min-height:64px;padding:12px;text-align:center;color:var(--sub);font-size:13px;outline:0}
.cap-view{display:flex;gap:16px;justify-content:center;align-items:center}
.cap-view canvas{width:130px;height:130px;border-radius:16px;background:repeating-conic-gradient(#EEE 0 25%,#fff 0 50%) 0 0/16px 16px}
.sheet input[type=range]{padding:0;background:none}
/* 🌙 어두운 화면 (아이폰 설정이 다크 모드일 때) */
@media (prefers-color-scheme:dark){
  :root{color-scheme:dark;--bg:#16151A;--ink:#F2F0F4;--sub:#9C98A3;--hair:rgba(255,255,255,.12);--soft:#26242C;--soft2:#33303A}
  body{background:#0E0D11}
  .app{--mode-soft:color-mix(in srgb,var(--mode) 24%,#1E1C23)!important}
  .app.bg-w{background:#16151A}
  .app.bg-s{background-color:#1D1519;background-image:linear-gradient(90deg,rgba(255,111,145,.045) 50%,transparent 0),linear-gradient(rgba(255,111,145,.045) 50%,transparent 0)}
  .app.bg-d{background-color:#1B1915;background-image:radial-gradient(circle,#3A342A 1.2px,transparent 1.6px)}
  .app.bg-r{background-color:#12171D;background-image:radial-gradient(circle,rgba(255,255,255,.06) 5px,transparent 5.5px)}
  .cards .item,.add,.week,.slot,.lib .it>button:first-child,.bgs button,.say2,.ied input,.ied textarea,.step button,.seg button[aria-pressed="true"]{background:#201E26!important;border-color:#34313B!important;color:var(--ink)}
  .add{color:var(--mode)!important}
  .bg-s .cards .item{box-shadow:0 3px 0 #3A2A31}.bg-d .cards .item{box-shadow:2px 3px 0 rgba(0,0,0,.4)}
  .tabs{background:rgba(22,21,26,.94)}.side{background:rgba(26,25,31,.97)}.sheet{background:#1C1B21}
  .prog .tr{background:#2C2A32}.pill{background:#F2F0F4;color:#16151A}.pill.light{background:var(--soft);color:var(--ink)}
  .cal button{color:var(--ink)}.l0{box-shadow:inset 0 0 0 1px #3A3740}.l1{background:color-mix(in srgb,var(--mode) 18%,#16151A)!important}.l2{background:color-mix(in srgb,var(--mode) 45%,#16151A)!important}
  .fut{color:#4A4752!important}.cal button.today{outline-color:var(--ink)}.toast{background:rgba(242,240,244,.92);color:#16151A}
}
/* 📱 아이패드 · 큰 화면: 조금 넓게 */
@media (min-width:768px){ .app{max-width:620px;zoom:1.25;height:calc((100vh - 48px) / 1.25);margin:calc(24px / 1.25) auto} main{padding-left:28px;padding-right:28px} }   /* 아이패드: 글씨 · 카드를 1.25배로 */
/* 카드 안에서 바로 고치기 */
.ied{display:grid;gap:8px;padding:12px 0}
.ied input,.ied textarea{border:1.5px solid #E5E5EA;background:#fff;border-radius:12px;padding:9px 11px;font-size:16px;width:100%;font-family:inherit;resize:vertical}
.ied input:focus,.ied textarea:focus{border-color:var(--mode);outline:0}
.ied .chips{gap:5px}.ied .chips button{padding:6px 10px}
.dday{margin-left:6px;background:var(--mode);color:#fff;border-radius:999px;padding:1px 8px;font-size:11.5px;vertical-align:1px}
.week{background:#fff;border:1.5px solid #F0EAED;border-radius:18px;padding:14px;display:grid;gap:12px}

=\"#4A3B35\" stroke-width=\"2.6\" stroke-linecap=\"round\"/><path d=\"M60 22l-12-8v14zM60 22l12-8v14z\" fill=\"#7EC4F5\" stroke=\"#4A3B35\" stroke-width=\"2.4\" stroke-linejoin=\"round\"/><circle cx=\"60\" cy=\"22\" r=\"4\" fill=\"#5AA9F0\" stroke=\"#4A3B35\" stroke-width=\"2.2\"/></svg>"};
CHAR_SVG.cat = "<svg viewBox=\"0 0 120 120\" aria-hidden=\"true\"><path d=\"M18 60 L24 18 Q25 11 31 15 L56 40 Z\" fill=\"#FFF8F0\" stroke=\"#4A3B35\" stroke-width=\"3.5\" stroke-linejoin=\"round\"/><path d=\"M28 46 L29 26 L45 38 Z\" fill=\"#FFC2D1\"/><path d=\"M102 60 L96 18 Q95 11 89 15 L64 40 Z\" fill=\"#FFF8F0\" stroke=\"#4A3B35\" stroke-width=\"3.5\" stroke-linejoin=\"round\"/><path d=\"M92 46 L91 26 L75 38 Z\" fill=\"#FFC2D1\"/><ellipse cx=\"60\" cy=\"72\" rx=\"44\" ry=\"35\" fill=\"#FFF8F0\" stroke=\"#4A3B35\" stroke-width=\"3.5\"/><ellipse cx=\"45\" cy=\"70\" rx=\"4.4\" ry=\"5.6\" fill=\"#4A3B35\"/><ellipse cx=\"75\" cy=\"70\" rx=\"4.4\" ry=\"5.6\" fill=\"#4A3B35\"/><circle cx=\"46.5\" cy=\"67.6\" r=\"1.5\" fill=\"#fff\"/><circle cx=\"76.5\" cy=\"67.6\" r=\"1.5\" fill=\"#fff\"/><ellipse cx=\"34\" cy=\"81\" rx=\"7\" ry=\"4\" fill=\"#FFB3C6\"/><ellipse cx=\"86\" cy=\"81\" rx=\"7\" ry=\"4\" fill=\"#FFB3C6\"/><path d=\"M56.5 78h7l-3.5 3.6z\" fill=\"#FF8FA3\" stroke=\"#4A3B35\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><path d=\"M54 83q3 3 6 0q3 3 6 0\" fill=\"none\" stroke=\"#4A3B35\" stroke-width=\"2.6\" stroke-linecap=\"round\"/><path d=\"M12 72h14M13 80l13-2M108 72H94M107 80l-13-2\" stroke=\"#4A3B35\" stroke-width=\"2.2\" stroke-linecap=\"round\" opacity=\".55\"/><path d=\"M84 40l3 6 6.5 1-4.8 4.5 1.2 6.5-5.9-3.1-5.9 3.1 1.2-6.5-4.8-4.5 6.5-1z\" fill=\"#FFD95A\" stroke=\"#4A3B35\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/></svg>";  // 냥쌤: 흰 고양이 · 노란 별 핀 · 머리 위에 똑바로 선 세모 귀(끝만 살짝 둥글게)
const INK = "#2E2A33";
const N = 32;
function pixel(o){
  const G = Array.from({ length:N }, () => Array(N).fill(null));
  const put = (x, y, c) => { x = Math.round(x); y = Math.round(y); if (x >= 0 && y >= 0 && x < N && y < N) G[y][x] = c; };
  const ell = (cx, cy, rx, ry, c, keep = () => true) => { for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry; if (dx*dx + dy*dy <= 1 && keep(x, y)) G[y][x] = c; } };
  const box = (x, y, w, h, c) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) put(i, j, c); };
  const H = o.hc, SK = "#FFE0C7", SK2 = "#F6C9A8", OUT = o.oc, AC = o.tc || "#FFFFFF";
  // 뒤쪽 머리 (얼굴 뒤로 내려오는 머리)
  if (o.hair === "bob") { box(7, 9, 4, 13, H); box(21, 9, 4, 13, H); }
  if (o.hair === "wave") { for (let y = 9; y < 28; y++) { const w = y % 4 < 2 ? 4 : 3; box(6 - (w === 4 ? 1 : 0), y, w, 1, H); box(23, y, w, 1, H); } }
  if (o.hair === "pony") { ell(26, 15, 3.2, 7, H); box(24, 8, 3, 3, o.rc || "#FF6B8A"); }
  if (o.hair === "bun") ell(16, 3.5, 4.5, 3.6, H);
  // 몸 · 목 · 얼굴
  ell(16, 31, 11, 7.5, OUT); box(14, 21, 4, 3, SK2);
  ell(16, 14, 8.2, 9, SK);
  // 옷 꾸미기
  if (o.top === "collar") { box(13, 24, 2, 2, "#FFFFFF"); box(17, 24, 2, 2, "#FFFFFF"); box(15, 24, 2, 1, "#FFFFFF"); }
  if (o.top === "tie") { box(13, 24, 2, 2, "#FFFFFF"); box(17, 24, 2, 2, "#FFFFFF"); box(15, 24, 2, 2, AC); box(15, 26, 2, 4, AC); box(14, 27, 4, 2, AC); }
  if (o.top === "cardi") { box(15, 24, 2, 8, AC); [26, 28, 30].forEach(y => put(14, y, "#FFFFFF")); }
  if (o.top === "hood") { ell(16, 24.5, 6, 2.2, AC); box(13, 26, 1, 4, "#FFFFFF"); box(18, 26, 1, 4, "#FFFFFF"); }
  if (o.top === "coat") { box(14, 24, 4, 8, AC); box(15, 24, 2, 3, "#E55A6A"); box(9, 27, 3, 2, "#9ACBF5"); }
  if (o.whistle) { box(20, 26, 3, 2, "#FFD43B"); box(19, 24, 1, 2, "#8A8A8A"); }
  // 앞머리 · 정수리 (이마 위쪽만)
  const top = (x, y) => y < 12;
  if (["bob", "wave", "pony", "bun"].includes(o.hair)) { ell(16, 10, 9.4, 6.4, H, top); box(9, 9, 2, 4, H); box(21, 9, 2, 3, H); }
  if (o.hair === "band") { ell(16, 10, 9.4, 6.4, H, top); box(7, 9, 4, 12, H); box(21, 9, 4, 12, H); box(9, 11, 14, 2, H); box(9, 6, 14, 2, o.rc || "#FFD43B"); }
  if (o.hair === "short") { ell(16, 9.5, 8.8, 5.6, H, (x, y) => y < 11); box(8, 10, 2, 4, H); box(22, 10, 2, 4, H); }
  if (o.hair === "part") { ell(16, 9.5, 9, 5.8, H, (x, y) => y < 11.5); box(8, 10, 2, 5, H); box(22, 10, 2, 5, H); box(18, 6, 1, 4, "#6A5A52"); }
  if (o.hair === "curly") { [[9,9],[12,6],[16,5],[20,6],[23,9],[10,12],[22,12],[14,7],[18,7]].forEach(([x, y]) => ell(x, y, 2.6, 2.6, H)); }
  if (o.hair === "cap") { box(9, 10, 14, 2, H); ell(16, 8, 9, 5, o.rc || "#E55A6A", (x, y) => y < 10); box(16, 9, 11, 2, o.rc || "#E55A6A"); box(15, 4, 2, 1, "#FFFFFF"); }
  if (o.hair === "messy") { ell(16, 9.5, 8.6, 5.4, H, (x, y) => y < 11); [[9,4],[13,3],[18,3],[22,4],[11,5],[20,5]].forEach(([x, y]) => box(x, y, 1, 3, H)); box(8, 10, 2, 3, H); box(22, 10, 2, 3, H); }
  // 학교 쌤: 교직원증 목걸이 · 학원 쌤: 블레이저 깃 · 조끼
  if (o.top === "blazer") { box(14, 24, 4, 8, "#FFFFFF"); [[13,24],[13,25],[14,26],[18,24],[18,25],[17,26]].forEach(([x, y]) => put(x, y, AC)); }
  if (o.top === "vest") { box(10, 26, 12, 6, AC); box(15, 24, 2, 8, "#FFFFFF"); box(15, 25, 2, 4, o.tie || "#2E2A33"); [27, 29].forEach(y => put(13, y, "#C9C9D6")); }
  if (o.lanyard) { [[13,24],[13,25],[14,26],[14,27],[19,24],[19,25],[18,26],[18,27]].forEach(([x, y]) => put(x, y, o.lc || "#4C8DF6")); box(14, 28, 5, 4, "#FFFFFF"); box(14, 28, 5, 1, o.lc || "#4C8DF6"); box(15, 30, 3, 1, "#C9C9D6"); }
  // 뿔테 안경: 렌즈는 밝게(눈이 보여요), 테는 두껍게 (위쪽 두 줄)
  const horn = o.glasses ? (o.gc || "#3A2618") : null;
  if (horn) { [[9, 12], [18, 12]].forEach(([x, y]) => { box(x, y, 6, 6, "#EAF4FF"); box(x, y, 6, 2, horn); box(x, y, 1, 6, horn); box(x + 5, y, 1, 6, horn); box(x, y + 5, 6, 1, horn); }); box(15, 13, 3, 1, horn); put(8, 13, horn); put(24, 13, horn); }
  // 얼굴: 눈(반짝) · 볼 · 입
  [[11, 14], [20, 14]].forEach(([x, y]) => { if (horn) { box(x, y + 1, 2, 2, INK); put(x + 1, y + 1, "#FFFFFF"); } else { box(x, y, 2, 3, INK); put(x + 1, y, "#FFFFFF"); } });
  box(9, 19, 3, 1, "#FF9DB0"); box(21, 19, 3, 1, "#FF9DB0");
  box(15, 20, 2, 1, "#E55A6A"); put(14, 19, "#E55A6A"); put(17, 19, "#E55A6A");
  // 학원 쌤 헤드셋 마이크: 머리띠 · 귀 덮개 · 입가로 오는 마이크
  if (o.headset) { box(10, 4, 12, 1, "#2E2A33"); box(8, 6, 1, 7, "#2E2A33"); box(7, 13, 3, 5, "#2E2A33"); [[10,19],[11,20],[12,21]].forEach(([x, y]) => put(x, y, "#2E2A33")); box(13, 21, 2, 1, "#5B5468"); }
  // 윤곽선: 칠한 칸 바로 바깥 빈칸을 진하게
  const O = G.map(r => r.slice());
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!G[y][x] && [[1,0],[-1,0],[0,1],[0,-1]].some(([a, b]) => G[y + b]?.[x + a])) O[y][x] = INK;
  let out = ""; O.forEach((row, y) => row.forEach((c, x) => { if (c) out += `<rect x="${x}" y="${y}" width="1.03" height="1.03" fill="${c}"/>`; }));
  return `<svg class="av px" viewBox="-2 -2 36 36" aria-hidden="true" shape-rendering="crispEdges">${out}</svg>`;
}

function charArt(id){
  if (String(id).startsWith("m:")){ const m = D.mine.find(x => x.id === id.slice(2)); if (m) return `<img src="${m.url}" alt="">`; id = "rabbit"; }

/* ↓ 캡처한 그림 다듬기: 아이아이노트와 같은 코드 (가장자리 바탕색 지우기 · 부스러기 지우기 · 정사각형 맞추기) */
async function charLoad(blob){
  // 그림 열기: createImageBitmap 이 안 되는 기기(옛 사파리 · 일부 앱 웹 화면)는 <img> 로
  const bm=await createImageBitmap(blob).catch(()=>new Promise((ok,no)=>{ const u=URL.createObjectURL(blob), im=new Image();
    im.onload=()=>{ ok(im); setTimeout(()=>URL.revokeObjectURL(u),1000); }; im.onerror=()=>no(new Error("그림을 열 수 없어요")); im.src=u; }));
  const bw=bm.naturalWidth||bm.width, bh=bm.naturalHeight||bm.height; if(!bw || !bh) throw new Error("그림 크기를 알 수 없어요");
  const k=Math.min(1,640/Math.max(bw,bh)), W=Math.max(1,Math.round(bw*k)), H=Math.max(1,Math.round(bh*k));
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H; cv.getContext("2d").drawImage(bm,0,0,W,H); bm.close?.();
  return cv;
}
// 바탕 지우기(tol: 0 이면 안 지움) + 작은 부스러기 지우기 → {cv, box:[x0,y0,x1,y1]}
function charProcess(base, tol){
  const W=base.width, H=base.height, cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  const g=cv.getContext("2d",{willReadFrequently:true}); g.drawImage(base,0,0);
  const im=g.getImageData(0,0,W,H), d=im.data, px=(x,y)=>(y*W+x)*4;
  const near=(a,b,t)=>Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])+Math.abs(a[2]-b[2])<=t;
  if(tol>0){
    // 바탕색: 네 테두리 줄에서 가장 많이 나온 색 (비슷한 색은 묶어서 셈, 이미 투명하면 그대로)
    const cnt=new Map(), edge=[]; for(let x=0;x<W;x+=2){ edge.push(px(x,0),px(x,H-1)); } for(let y=0;y<H;y+=2){ edge.push(px(0,y),px(W-1,y)); }
    for(const i of edge){ const key=d[i+3]<128?"t":(d[i]>>4)+","+(d[i+1]>>4)+","+(d[i+2]>>4); const c=cnt.get(key)||{n:0,i}; c.n++; cnt.set(key,c); }
    const top=[...cnt.values()].sort((a,b)=>b.n-a.n)[0], bg=[d[top.i],d[top.i+1],d[top.i+2],d[top.i+3]];
    if(bg[3]>200){
      const seen=new Uint8Array(W*H), st=[];
      for(let x=0;x<W;x++){ st.push(x, x+(H-1)*W); } for(let y=0;y<H;y++){ st.push(y*W, y*W+W-1); }
      while(st.length){ const p=st.pop(); if(seen[p]) continue; seen[p]=1; const i=p*4;
        if(d[i+3]<20 || near([d[i],d[i+1],d[i+2]],bg,tol)){ d[i+3]=0; const x=p%W, y=(p/W)|0;
          if(x>0) st.push(p-1); if(x<W-1) st.push(p+1); if(y>0) st.push(p-W); if(y<H-1) st.push(p+W); } }
    }
  }
  // 남은 덩어리 중 가장 큰 것(= 캐릭터)과 그만큼 큰 덩어리만 남기고, 캡처 화면의 글씨 · 작은 부스러기는 지워요
  const lab=new Int32Array(W*H), sizes=[0], boxes=[null];
  for(let p0=0;p0<W*H;p0++){ if(lab[p0] || d[p0*4+3]<=40) continue;
    const L=sizes.length, st=[p0]; lab[p0]=L; let n=0; const bx=[W,H,-1,-1];
    while(st.length){ const p=st.pop(), x=p%W, y=(p/W)|0; n++;
      if(x<bx[0])bx[0]=x; if(x>bx[2])bx[2]=x; if(y<bx[1])bx[1]=y; if(y>bx[3])bx[3]=y;
      if(x>0 && !lab[p-1] && d[(p-1)*4+3]>40){ lab[p-1]=L; st.push(p-1); }
      if(x<W-1 && !lab[p+1] && d[(p+1)*4+3]>40){ lab[p+1]=L; st.push(p+1); }
      if(y>0 && !lab[p-W] && d[(p-W)*4+3]>40){ lab[p-W]=L; st.push(p-W); }
      if(y<H-1 && !lab[p+W] && d[(p+W)*4+3]>40){ lab[p+W]=L; st.push(p+W); } }
    sizes.push(n); boxes.push(bx); }
  // 가는 줄(캡처 화면의 테두리 · 밑줄)은 캐릭터가 아니라서 빼요
  const thin=i=>{ const q=boxes[i]; return Math.min(q[2]-q[0],q[3]-q[1])<Math.max(6,Math.min(W,H)*0.03); };
  const big=Math.max(0,...sizes.map((n,i)=>i>0 && !thin(i)?n:0)), keep=sizes.map((n,i)=>i>0 && !thin(i) && n>=big*0.15);
  let x0=W,y0=H,x1=-1,y1=-1;
  keep.forEach((k,i)=>{ if(!k) return; const b=boxes[i]; x0=Math.min(x0,b[0]); y0=Math.min(y0,b[1]); x1=Math.max(x1,b[2]); y1=Math.max(y1,b[3]); });
  if(big) for(let p=0;p<W*H;p++) if(lab[p] && !keep[lab[p]]) d[p*4+3]=0;
  g.putImageData(im,0,0);
  if(x1<0){ x0=0;y0=0;x1=W-1;y1=H-1; }
  return {cv, box:[x0,y0,x1,y1]};
}
// 정사각형으로 담기: zoom 이 크면 더 크게, dx · dy 는 칸 너비에 대한 비율(끌어서 옮긴 만큼)
function charCompose(r, zoom=1, dx=0, dy=0, size=320, out){
  const [x0,y0,x1,y1]=r.box, side=Math.max(x1-x0+1,y1-y0+1)*1.08/zoom, cx=(x0+x1+1)/2-dx*side, cy=(y0+y1+1)/2-dy*side;
  out=out||document.createElement("canvas"); out.width=out.height=size; const o=out.getContext("2d");
  o.clearRect(0,0,size,size); o.imageSmoothingQuality="high"; o.drawImage(r.cv, cx-side/2, cy-side/2, side, side, 0, 0, size, size);
  return out;
}


/* 약한 과목 = 설정에서 정한 것, 없으면 가장 최근 성적에서 등급이 가장 낮은(숫자가 큰) 과목 */
function weakSubj(){
  if (D.weak) return D.weak;
  const g = D.grades[D.grades.length - 1]; if (!g) return "";
  let w = "", wg = 0; for (const [n, v] of Object.entries(g.g)) if (v > wg){ wg = v; w = n; }   // 한 시험 안에서는 등급 숫자가 클수록 약해요 (내신 1~5 · 모의 1~9)
  return w;
}
const plansOf = k => (D.plans[k] = D.plans[k] || []);
/* 오늘 할 일 순서: 약한 과목이 늘 맨 위 (그다음은 넣은 순서) */
/* 할 일 순서 = 학생이 정한 순서 그대로 (↑ ↓ 로 바꿔요). 매일 처음 채울 때만 약한 과목을 맨 앞에 둬요 */
const sorted = list => list;
/* 매일 기본 할 일: 그날 처음 열 때 할 일이 비어 있으면 설정의 '매일 기본 할 일'(D.base)로 채워요. 다 지워도 그날은 다시 안 채워요 */
function seedToday(){
  const k = today(); if (D.seeded === k) return; D.seeded = k;
  if (!plansOf(k).length && D.base.length){ const w = weakSubj();
    D.plans[k] = [...D.base].sort((a, b) => (b.s === w) - (a.s === w)).map(b => ({ id:uid(), s:b.s, det:[], done:false })); }
  save();
}
/* 오늘 순공(초): 기록된 것 + 지금 재고 있는 타이머(아직 끝내기 전)까지 */
const liveSec = () => secOf(today()) + (D.timer ? tsec() : 0);
/* 할 일 세기: 세부 계획이 있으면 한 줄 = 할 일 1개 (국어 2줄 + 수학 2줄 + 영어 2줄 = 6개), 없으면 과목 하나 = 1개
   p.dd = 세부 계획 줄마다 했는지 [true, false…], p.done = 그 과목을 다 했는지 */
const unitsOf = p => p.det.length ? p.det.map((t, i) => ({ t, d:!!(p.dd || [])[i] })) : [{ t:p.s, d:!!p.done }];
const countUnits = L => { let n = 0, all = 0; for (const p of L.filter(p => p.s)) for (const u of unitsOf(p)){ all++; if (u.d) n++; } return { n, all }; };
const syncDone = p => { if (p.det.length){ p.dd = p.det.map((_, i) => !!(p.dd || [])[i]); p.done = p.dd.every(Boolean); } };
/* 진행 막대 = 체크한 할 일 비율 · 오른쪽 글씨 = 오늘 순공 전체(재는 중인 타이머 포함). 과목별 시간은 정하지 않아요 */
function progHtml(){ const c = countUnits(plansOf(today()));
  return { txt:`순공 ${hm(liveSec())}`, pct:c.all ? c.n / c.all * 100 : 0, n:c.n, all:c.all }; }
const secOf = k => Object.values(D.log[k] || {}).reduce((a, b) => a + b, 0);
function daysSince(subj){ for (let i = 0; i < 60; i++){ const d = new Date(); d.setDate(d.getDate() - i); if ((D.log[dk(d)] || {})[subj] > 60) return i; } return 60; }

/* ===================== 쌤 한마디 (F = 다정하게, T = 숫자로 딱) ===================== */
const say = (f, t) => `<div class="sayw"><span class="ava">${ch(0)}</span><div class="say"><b>${D.mode === "t" ? "T쌤" : "F쌤"}</b>${esc(D.mode === "t" ? t : f)}</div></div>`;
function todaySay(){
  const L = plansOf(today()), w = weakSubj(), cu = countUnits(L), done = cu.n, sec = secOf(today());
  if (!L.length) return say("오늘 할 일을 한두 개만 넣어 볼까? 작게 시작하면 돼.", "계획 0개. 1개부터 넣어.");
  if (done === cu.all) return say(`오늘 할 일 다 했어! 순공 ${hm(sec)}, 정말 대단해.`, `${done}/${cu.all} 완료. 순공 ${hm(sec)}.`);
  if (cu.all > 12) return say("오늘 할 일이 좀 많은데? 꼭 할 것만 남겨 보자.", `할 일 ${cu.all}개. 너무 많아. 줄여.`);
  const wp = L.find(p => p.s === w && !p.done);
  if (wp){ const n = daysSince(w); return say(`${w}를 맨 앞에 뒀어. 조금만 같이 해 보자.`, n >= 2 ? `${w} ${n}일째 0분. ${w} 먼저.` : `${w} 먼저.`); }
  if (w && !L.some(p => p.s === w)) return say(`오늘은 ${w}가 없네. 작게 하나만 넣어 볼까?`, `${w} 계획 없음. 하나 추가해.`);
  if (!done){ const f = L.find(p => !p.done); return say(`${f.s}부터 시작해 볼까? 오른쪽 ⏱를 당기면 타이머가 나와.`, `${f.s}부터. ⏱ 당겨.`); }
  return say(`벌써 ${done}개 했어! 남은 것도 하나씩 가 보자.`, `${done}/${cu.all} 완료. 남은 ${cu.all - done}개.`);
}

/* ===================== 오늘 ===================== */

      <p class="note" style="text-align:center">과목 이름을 누르면 고치기 · 순서 바꾸기가 나와요<br>세부 계획을 한 줄씩 추가하면 할 일이 늘어나요 (쪽수 · 문제 수 등)</p>` : `<div class="empty">아직 오늘 공부할 과목이 없어요</div>`}

/* 고치기: 카드 안에서 바로 이름 · 시간 · 순서/쪽수를 고쳐요 */
/* 📅 시험 D-day: 설정에 넣은 시험 중 오늘부터 가장 가까운 것 */

const dLeft = d => Math.round((new Date(d + "T00:00") - new Date(today() + "T00:00")) / 864e5);
function ddayTag(){ const x = nextExam(); if (!x) return ""; const n = dLeft(x.d); return ` <span class="dday">${esc(x.n)} ${n ? "D-" + n : "D-day"}</span>`; }

/* ===================== 달력 ===================== */
const lvOf = h => !h ? 0 : h < D.th[0] ? 1 : h < D.th[1] ? 2 : h < D.th[2] ? 3 : 4;
/* 📊 지난 7일 돌아보기 (오늘 포함 7일): 순공 합 · 공부한 날 · 가장 많이 한 것 · 체크한 할 일 */
function weekStats(end = new Date()){
  let sec = 0, days = 0, by = {}, done = 0, all = 0;
  for (let i = 0; i < 7; i++){ const d = new Date(end); d.setDate(d.getDate() - i); const k = dk(d), s1 = secOf(k); sec += s1; if (s1 >= 60) days++;
    for (const [n, v] of Object.entries(D.log[k] || {})) by[n] = (by[n] || 0) + v;
    const cu = countUnits(D.plans[k] || []); all += cu.all; done += cu.n; }
  const top = Object.entries(by).sort((a, b) => b[1] - a[1])[0];
  return { sec, days, top: top ? top[0] : "", done, all };
}
function weekCard(w){
  return `<div class="week"><div class="sayw"><span class="ava">${ch(0)}</span><div class="say">${esc(D.mode === "t" ? `7일 순공 ${hm(w.sec)} · ${w.days}일 · 체크 ${w.done}/${w.all}.` : w.days >= 5 ? `일주일에 ${w.days}일이나 공부했어! 정말 멋져.` : w.days ? `이번 주 ${w.days}일 공부했어. 다음 주엔 하루만 더 해 보자!` : "이번 주는 쉬어 갔네. 내일 10분부터 다시 해 보자!")}</div></div>
    <div class="wk"><div><b>${hm(w.sec)}</b><small>순공 합계</small></div><div><b>${w.days}일</b><small>공부한 날</small></div><div><b>${w.all ? Math.round(w.done / w.all * 100) : 0}%</b><small>할 일 체크</small></div></div>
    ${w.top ? `<p class="note" style="text-align:center">가장 많이 한 과목 · <b style="color:var(--mode)">${esc(w.top)}</b></p>` : ""}</div>`;
}
function viewCal(){
  const now = new Date(), m = S.calM || new Date(now.getFullYear(), now.getMonth(), 1), y = m.getFullYear(), mo = m.getMonth();
  const days = new Date(y, mo + 1, 0).getDate(), first = new Date(y, mo, 1).getDay(), tk = today();
  // 하루 평균 순공: 이번 달 지난 날(오늘까지) 모두로 나눠요 (안 한 날 포함)
  const isThis = y === now.getFullYear() && mo === now.getMonth(), upto = isThis ? now.getDate() : days, future = new Date(y, mo, 1) > now;
  let sum = 0; for (let i = 1; i <= upto; i++) sum += secOf(`${y}-${pad(mo + 1)}-${pad(i)}`);
  const avg = future ? 0 : sum / Math.max(1, upto);
  let cells = WD.map(x => `<span class="dh">${x}</span>`).join("") + "<span></span>".repeat(first);
  for (let i = 1; i <= days; i++){ const k = `${y}-${pad(mo + 1)}-${pad(i)}`, h = secOf(k) / 3600, fut = k > tk;
    cells += `<button type="button" class="${fut ? "fut" : "l" + lvOf(h)} ${k === tk ? "today" : ""}" data-act="day" data-v="${k}" aria-label="${mo + 1}월 ${i}일 순공 ${hm(secOf(k))}">${i}</button>`; }
  const sel = S.calDay && S.calDay.startsWith(`${y}-${pad(mo + 1)}`) ? S.calDay : "";
  const dl = sel ? Object.entries(D.log[sel] || {}).filter(([, v]) => v >= 60).sort((a, b) => b[1] - a[1]) : [];
  const studied = [...Array(upto)].filter((_, i) => secOf(`${y}-${pad(mo + 1)}-${pad(i + 1)}`) >= 60).length;
  return `<div class="hd"><div><div class="sub">하루 평균 순공 <b style="color:var(--ink)">${hm(avg)}</b></div><div class="mnav"><button type="button" class="ic" data-act="mPrev" aria-label="지난달">‹</button><h1 class="big">${y === now.getFullYear() ? "" : y + "년 "}${mo + 1}월</h1><button type="button" class="ic" data-act="mNext" aria-label="다음 달">›</button></div></div><button type="button" class="ic" data-act="settings" aria-label="설정">⚙︎</button></div>
    <div class="cal">${cells}</div>

/* 📷 성적표 사진 읽기 (아이폰 앱): 휴대폰 안(애플 Vision)에서 글자를 읽어 와서, 과목 줄마다 등급을 찾아요. 사진은 저장하지 않아요
   lines = [{ t:글자, x, y, w, h }] (0~1, 위가 0). 같은 높이의 글자를 한 줄로 묶어요
   내신(나이스 성적 통지표): 과목 줄에서 성취도(A~E) 뒤에 나오는 1~5 숫자 = 석차등급
   모의고사(전국연합 성적표): 과목 줄에서 백분위(소수) 뒤에 나오는 1~9 숫자 = 등급, 없으면 줄의 마지막 1~9 숫자 */
const ALIAS = { "국어":["국어","공통국어","국 어"], "수학":["수학","공통수학","수 학"], "영어":["영어","공통영어","영 어"], "한국사":["한국사"], "통합사회":["통합사회","사회"], "통합과학":["통합과학","과학"] };
function parseReport(lines){
  const all = lines.map(l => l.t).join(" "), type = /성취도|석차등급|통지표/.test(all) ? "naesin" : "mock", MX = type === "naesin" ? 5 : 9;
  const L = [...lines].sort((a, b) => a.y - b.y), rows = [];
  for (const l of L){ const r = rows.find(r => Math.abs(r.y - l.y) < Math.max(l.h, r.h) * .6); if (r){ r.items.push(l); r.y = (r.y + l.y) / 2; } else rows.push({ y:l.y, h:l.h, items:[l] }); }
  const g = {};
  for (const sb of D.subj.map(s => s.n)){
    const keys = ALIAS[sb] || [sb];
    for (const r of rows){
      const it = r.items.sort((a, b) => a.x - b.x), i0 = it.findIndex(x => keys.some(k => x.t.replace(/\s/g, "").startsWith(k.replace(/\s/g, ""))));
      if (i0 < 0 || g[sb]) continue;
      const toks = it.slice(i0 + 1).flatMap(x => x.t.split(/\s+/)).filter(Boolean);
      let v = 0;
      if (type === "naesin"){ const a = toks.findIndex(t => /^[A-E]$/.test(t)); if (a >= 0) for (const t of toks.slice(a + 1)){ if (/\(/.test(t)) continue; if (/^[1-5]$/.test(t)){ v = +t; break; } } }
      else { const pIdx = toks.findIndex(t => /^\d{1,3}\.\d{1,2}$/.test(t)); if (pIdx >= 0) for (const t of toks.slice(pIdx + 1)){ if (/^[1-9]$/.test(t)){ v = +t; break; } } }
      if (!v){ const ns = toks.filter(t => new RegExp(`^[1-${MX}]$`).test(t)); if (ns.length) v = +ns[ns.length - 1]; }
      if (v) g[sb] = v;
    }
  }
  return { type, g };
}

   D.timer = { s:과목, pid:할 일 번호, start:시작 시각(돌고 있을 때), acc:이미 잰 초 } — 앱을 껐다 켜도 이어져요 */
const tsec = () => { const t = D.timer; return t ? t.acc + (t.start ? (Date.now() - t.start) / 1000 : 0) : 0; };

  if (!t || !$("tnum")) return;
  const sec = tsec(), h = Math.floor(sec / 3600), mm = `${h ? h + ":" + pad(Math.floor(sec / 60) % 60) : Math.floor(sec / 60)}:${pad(Math.floor(sec % 60))}`;
  $("tnum").textContent = mm; if ($("tgoal")) $("tgoal").textContent = `오늘 순공 ${hm(liveSec())}`;

/* 끝내기: 자정을 넘긴 시간은 날짜별로 나눠서 넣어요 (쉬기 전에 잰 시간은 처음 시작한 날로) */
function addLog(day, subj, sec){ if (sec < 1) return; D.log[day] = D.log[day] || {}; D.log[day][subj] = (D.log[day][subj] || 0) + Math.round(sec); }
function endTimer(keep){
  const t = D.timer; if (!t) return;
  const sec = Math.round(tsec());
  if (keep && sec >= 30){
    addLog(t.d0 || today(), t.s, t.acc);
    if (t.start){ let a = t.start; const now = Date.now();
      while (true){ const m = new Date(a); m.setHours(24, 0, 0, 0); if (m.getTime() >= now) break; addLog(dk(new Date(a)), t.s, (m - a) / 1000); a = m.getTime(); }
      addLog(dk(new Date(a)), t.s, (now - a) / 1000); }
    toast(`${t.s} 순공 ${hm(sec)} 기록했어요`); haptic("ok"); }
  D.timer = null; save();
}

const CAPS = { base:null, res:null, tol:60, zoom:1 };

/* ⏱ 단추를 왼쪽으로 끌어당겨도 타이머가 따라 나와요 (조금만 끌고 놓으면 다시 들어가요) */
let edgeDragged = false;
(() => {

(() => {

    case "mv": { const L = plansOf(k), i = L.findIndex(x => x.id === v), j = i + +b.dataset.d; if (i < 0 || j < 0 || j >= L.length) return; [L[i], L[j]] = [L[j], L[i]]; save(); break; }
    case "baseDel": D.base.splice(+v, 1); save(); break;
    case "exAdd": { const n = $("exName").value.trim(), d = $("exDate").value; if (!n || !d){ toast("시험 이름과 날짜를 넣어 주세요"); return; } D.exams.push({ id:uid(), n, d }); save(); break; }
    case "exDel": D.exams = D.exams.filter(x => x.id !== v); save(); break;
    case "focusOff": D.focusOff = true; save(); break;
    case "baseUp": { const i = +v; if (i > 0){ [D.base[i - 1], D.base[i]] = [D.base[i], D.base[i - 1]]; save(); } break; }
    case "baseAdd": { const n = $("baseNew").value.trim(); if (!n) return; if (D.base.length >= 10){ toast("10개까지 넣을 수 있어요"); return; } D.base.push({ s:n }); save(); break; }
    case "pS": S.newS = v; pick("pS", "pS"); $("pName").value = v; return;
    case "pSave": { const s = $("pName").value.trim(), det = $("pDet").value.split("\n").map(x => x.trim()).filter(Boolean).slice(0, 8);
      if (!s){ toast("이름을 써 주세요"); return; }
      if (v){ const p = plansOf(k).find(x => x.id === v); if (p) Object.assign(p, { s, det }); } else plansOf(k).push({ id:uid(), s, det, done:false });
      save(); closeSheet(); break; }
    case "sheetClose": closeSheet(); return;
    case "closeT": closeTimer(); return;
    case "tsel": S.tsel = v; break;
    case "tGo": { const p = sorted(plansOf(k)).find(x => x.s === v && !x.done); D.timer = { s:v, pid:p ? p.id : "", start:Date.now(), acc:0, d0:k }; haptic("tap"); save(); break; }
    case "tPause": if (D.timer && D.timer.start){ D.timer.acc = tsec(); D.timer.start = 0; save(); } break;
    case "tResume": if (D.timer && !D.timer.start){ D.timer.start = Date.now(); save(); } break;
    case "tEnd": endTimer(true); break;
    case "tCancel": D.timer = null; save(); toast("기록하지 않았어요"); break;
    case "mPrev": case "mNext": { const now = new Date(), m = S.calM || new Date(now.getFullYear(), now.getMonth(), 1); S.calM = new Date(m.getFullYear(), m.getMonth() + (a === "mNext" ? 1 : -1), 1); S.calDay = ""; break; }
    case "day": S.calDay = S.calDay === v ? "" : v; break;
    case "gAdd": S.sheet = { t:"grade" }; S.newG = {}; S.newT = S.gtype || "mock"; S.newName = null; openSheet(sheetGrade()); return;
    case "gEdit": { const g = D.grades.find(x => x.id === v); if (g){ S.sheet = { t:"grade", g }; S.newG = { ...g.g }; S.newT = g.type || "mock"; S.newName = null; openSheet(sheetGrade(g)); } return; }
    case "gType": S.gtype = v; break;
    case "gT": { S.newT = v; S.newName = $("gName").value; const mx = v === "naesin" ? 5 : 9; for (const n in S.newG) if (S.newG[n] > mx) delete S.newG[n]; openSheet(sheetGrade(S.sheet.g)); return; }
    case "gPhoto": { if (!NAT) return; S.newName = $("gName").value; toast("성적표 사진을 골라 주세요");
      NAT.scanGrades().then(r => { const lines = (r && r.lines) || []; if (!lines.length){ toast("글자를 못 읽었어요. 밝은 곳에서 반듯하게 찍어 볼까요?"); return; }
        const o = parseReport(lines), n = Object.keys(o.g).length; S.newT = o.type; S.newG = o.g;
        if (!S.newName){ const d = new Date(); S.newName = `${d.getMonth() + 1}월 ${o.type === "naesin" ? "내신" : "모의고사"}`; }
        openSheet(sheetGrade()); toast(n ? `${n}과목을 읽었어요. 맞는지 확인해 주세요` : "등급을 못 찾았어요. 직접 눌러 주세요"); }).catch(() => toast("사진 읽기를 그만뒀어요")); return; }
    case "gv": { S.newG = S.newG || {}; const s = b.dataset.s, n = +v; S.newG[s] = S.newG[s] === n ? 0 : n; if (!S.newG[s]) delete S.newG[s];
      b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", S.newG[s] === +x.dataset.v)); return; }
    case "gSave": { const name = $("gName").value.trim() || `${new Date().getMonth() + 1}월 시험`, g = { ...(S.newG || {}) };
      if (!Object.keys(g).length){ toast("등급을 하나 이상 눌러 주세요"); return; }
      const type = S.newT || "mock"; S.gtype = type;
      if (v){ const o = D.grades.find(x => x.id === v); if (o) Object.assign(o, { name, g, type }); } else D.grades.push({ id:uid(), name, at:Date.now(), g, type });
      save(); closeSheet(); break; }
    case "gDel": D.grades = D.grades.filter(x => x.id !== v); save(); closeSheet(); break;
    case "rec": S.sheet = { t:"rec" }; openSheet(sheetRec()); return;
    case "recSend": { const u = $("rUrl").value.trim(), why = $("rWhy").value.trim();
      if (!/^https?:\/\/(www\.|m\.)?(youtube\.com|youtu\.be)\//i.test(u)){ toast("유튜브 주소를 붙여 넣어 주세요"); return; }
      sendRec(u, why).then(() => toast("추천을 보냈어요. 선생님이 확인할게요")).catch(() => toast("보내지 못했어요. 인터넷을 확인해 주세요")); closeSheet(); return; }
    case "mode": D.mode = v; save(); break;
    case "th": { const i = +v, d = +b.dataset.d, lo = i ? D.th[i - 1] + 1 : 1, hi = i < 2 ? D.th[i + 1] - 1 : 16; D.th[i] = Math.max(lo, Math.min(hi, D.th[i] + d)); save(); break; }
    case "subDel": if (D.subj.length > 1){ D.subj.splice(+v, 1); save(); } break;
    case "subAdd": { const n = $("subNew").value.trim(); if (!n || D.subj.some(s => s.n === n)) return; const C = ["#5AC8FA","#FF375F","#64D2FF","#BF5AF2","#FFD60A","#32D74B","#FF9F0A"]; D.subj.push({ n, c:C[D.subj.length % C.length] }); save(); break; }
    case "wipe": if (!S.wipe){ S.wipe = true; break; } try { localStorage.removeItem(KEY); } catch (err) {} location.reload(); return;
  }
  render();
});
/* ===================== 🔐 관리자 (#admin 또는 ?admin): 학생이 보낸 공부 음악 추천 확인 =====================
   moontr.site 공용 관리자 로그인(구글, 관리자 구글 계정)을 써요. 관리자 아닌 계정이면 바로 로그아웃
   올리기 = first_music 에 제목 · 갈래 · 주소를 넣고 추천은 지워요 · 지우기 = 추천만 지워요 */
const ADMIN_EMAILS = ["anstjsdud@sen.go.kr", "bellachord@gmail.com"];
const isAdminEmail = e => ADMIN_EMAILS.includes(String(e || "").toLowerCase());
const IS_ADMIN_PAGE = /(^|[?&])admin\b/.test(location.search) || location.hash === "#admin";
async function loadScript(u){ await new Promise((ok, no) => { const sc = document.createElement("script"); sc.src = u; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); }); }
async function adminPage(){
  const app = $("app"); app.innerHTML = `<main id="main"><div class="hd"><div><div class="sub">먼저 플래너 · 관리자</div><h1 class="big">공부 음악 추천</h1></div></div><div id="adm" class="empty">불러오는 중…</div></main>`;
  const V = "10.12.2"; for (const m of ["app", "auth", "firestore"]) await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-${m}-compat.js`);
  if (!firebase.apps.length) firebase.initializeApp({ apiKey:FKEY, authDomain:"moon-d528d.firebaseapp.com", projectId:"moon-d528d", storageBucket:"moon-d528d.firebasestorage.app", messagingSenderId:"126636401536", appId:"1:126636401536:web:25b8a8296ec42b86f99765" });
  const auth = firebase.auth(), db = firebase.firestore(), box = () => $("adm");
  const login = () => { box().className = ""; box().innerHTML = `<button type="button" class="pill" id="gIn">G 구글 계정으로 로그인</button><p class="note">관리자 구글 계정으로 로그인해 주세요.</p>`;
    $("gIn").onclick = async () => { const pr = new firebase.auth.GoogleAuthProvider(); pr.setCustomParameters({ prompt:"select_account" });
      try { const r = await auth.signInWithPopup(pr); if (!isAdminEmail(r.user.email)){ await auth.signOut(); toast("관리자 구글 계정으로 골라 주세요"); } } catch (e) { toast("로그인하지 못했어요"); } }; };
  async function draw(){
    const [rq, mq] = await Promise.all([db.collection("first_recs").orderBy("at", "desc").get(), db.collection("first_music").orderBy("at", "desc").get()]);
    box().className = ""; box().innerHTML = `<p class="gh">새 추천 ${rq.size}개</p><div class="grp">${rq.docs.map(d => { const r = d.data(); return `<div class="row" style="flex-wrap:wrap;gap:6px;padding:10px 0"><a href="${esc(r.url)}" target="_blank" rel="noopener" style="flex:1 1 100%;color:var(--mode);word-break:break-all">${esc(r.url)}</a><span class="sub" style="flex:1 1 100%">${esc(r.why || "(이유 없음)")}</span>
      <input data-t="${d.id}" placeholder="목록에 보일 제목" maxlength="30" style="flex:1;min-width:0;border:0;border-radius:10px;padding:8px;background:#fff"><input data-g="${d.id}" placeholder="갈래 (예: 피아노)" maxlength="10" style="width:110px;border:0;border-radius:10px;padding:8px;background:#fff">
      <button type="button" class="link" data-adm="ok" data-id="${d.id}">올리기</button><button type="button" class="link del" data-adm="no" data-id="${d.id}">지우기</button></div>`; }).join("") || `<div class="row"><span class="sub">새 추천이 없어요</span></div>`}</div>
      <p class="gh">목록에 올린 곡 ${mq.size}개</p><div class="grp">${mq.docs.map(d => { const m = d.data(); return `<div class="row"><span>${esc(m.t)} <small class="sub">${esc(m.g || "")}</small></span><button type="button" class="link del" data-adm="down" data-id="${d.id}">내리기</button></div>`; }).join("") || `<div class="row"><span class="sub">아직 없어요</span></div>`}</div>
      <p class="note">다른 가수 노래를 모아 다시 올린 영상은 올리지 말아 주세요. 위 기본 5곡은 코드의 MUSIC 목록이에요.</p>
      <button type="button" class="link del" id="gOut">로그아웃</button>`;
    $("gOut").onclick = () => auth.signOut();
  }
  document.addEventListener("click", async e => { const b = e.target.closest("[data-adm]"); if (!b) return; const id = b.dataset.id;
    try {
      if (b.dataset.adm === "ok"){ const t = document.querySelector(`[data-t="${id}"]`).value.trim(); if (!t){ toast("제목을 써 주세요"); return; }
        const r = (await db.collection("first_recs").doc(id).get()).data(); await db.collection("first_music").add({ t, g:document.querySelector(`[data-g="${id}"]`).value.trim(), url:r.url, at:Date.now() }); await db.collection("first_recs").doc(id).delete(); toast("올렸어요"); }
      if (b.dataset.adm === "no"){ await db.collection("first_recs").doc(id).delete(); toast("지웠어요"); }
      if (b.dataset.adm === "down"){ await db.collection("first_music").doc(id).delete(); toast("내렸어요"); }
      draw();
    } catch (err) { toast("안 됐어요. 보안 규칙을 게시했는지 확인해 주세요"); } });
  auth.onAuthStateChanged(async u => { if (!u) return login(); if (!isAdminEmail(u.email)){ await auth.signOut(); return; } draw().catch(() => { box().innerHTML = `<p class="note">불러오지 못했어요. Firebase 콘솔에 새 보안 규칙(first_recs · first_music)을 게시했는지 확인해 주세요.</p>`; }); });
}

/* ===================== 📱 아이폰 앱 연결 =====================
   앱(Capacitor)에서만 Capacitor.Plugins.First 가 있어요. 웹에서는 아무 일도 안 해요
   - setData({json}): 위젯 · 잠금 화면 타이머용 (오늘 할 일 · 순공 · 타이머 · 말하는 쌤 그림)
   - backup({json}) · restore(): 내 아이클라우드에 기록 백업 / 새 폰에서 되살리기
   - haptic({style}): "tap" · "ok" 진동
   - scanGrades(): 사진을 골라 글자 읽기 → { lines:[{t,x,y,w,h}] } */
const NAT = window.Capacitor?.isNativePlatform?.() ? window.Capacitor.Plugins.First : null;
function haptic(style){ try { NAT?.haptic({ style }); } catch (e) {} }
let avaKey = "", avaPng = "";
function avaImage(){   // 말하는 쌤 그림을 위젯용 PNG로 (바뀔 때만 다시 그려요)
  const id = D.chars[0]; if (id === avaKey) return Promise.resolve(avaPng);
  return new Promise(ok => { const im = new Image(), src = charArt(id), url = src.startsWith("<img") ? src.match(/src="([^"]+)"/)[1] : "data:image/svg+xml;charset=utf-8," + encodeURIComponent(src.includes("xmlns") ? src : src.replace("<svg", '<svg xmlns="http://www.w3.org/2000/svg"'));
    im.onload = () => { const c = document.createElement("canvas"); c.width = c.height = 160; c.getContext("2d").drawImage(im, 0, 0, 160, 160); avaKey = id; avaPng = c.toDataURL("image/png"); ok(avaPng); };
    im.onerror = () => ok(""); im.src = url; });
}
let natT = 0, bakT = 0;
function nativeSync(){
  if (!NAT) return;
  clearTimeout(natT); natT = setTimeout(async () => {
    const k = today(), L = plansOf(k), t = D.timer, c = COLORS[D.acc] || COLORS[0], x = nextExam();
    const w = { date:k, tasks:L.filter(p => p.s).flatMap(p => p.det.length ? unitsOf(p).map(u => ({ t:`${p.s} · ${u.t}`, d:u.d })) : [{ t:p.s, d:!!p.done }]), sec:Math.round(secOf(k)), color:c[0], soft:c[1], mode:D.mode,
      say:D.mode === "t" ? "할 일부터. 지금 시작." : "오늘도 같이 해 보자!", dday:x ? `${x.n} ${dLeft(x.d) ? "D-" + dLeft(x.d) : "D-day"}` : "",
      timer:t ? { s:t.s, run:!!t.start, from:Date.now() - tsec() * 1000, sec:Math.round(tsec()) } : null, ava:await avaImage() };
    try { await NAT.setData({ json:JSON.stringify(w) }); } catch (e) {}
  }, 300);
  clearTimeout(bakT); bakT = setTimeout(() => { try { NAT.backup({ json:JSON.stringify(D) }); } catch (e) {} }, 4000);
}
async function nativeStart(){
  if (!NAT) return;
  try { const has = localStorage.getItem(KEY); if (!has){ const r = await NAT.restore(); if (r && r.json){ D = { ...D, ...JSON.parse(r.json) }; localStorage.setItem(KEY, r.json); toast("아이클라우드에서 기록을 되살렸어요"); render(); } } } catch (e) {}
  nativeSync();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") nativeSync(); else render(); });
}
/* 📊 새 주가 시작되면(월요일 이후 처음 열 때) 지난 7일 돌아보기를 한 번 보여 줘요 */
function weekPopup(){
  const d = new Date(), mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay() + 6) % 7)); const wk = dk(mon);
  if (D.weekSeen === wk) return; const end = new Date(mon); end.setDate(mon.getDate() - 1); const w = weekStats(end);
  D.weekSeen = wk; save(); if (!w.sec && !w.all) return;
  S.sheet = { t:"week" }; openSheet(`<h2>지난주 돌아보기</h2>${weekCard(w)}<div class="btns"><button type="button" class="pill" data-act="sheetClose">좋아, 이번 주도!</button></div>`);
}

/* 🎵 추천 보내기: 서버로 보내는 길(관리자 확인)은 아직 정하지 않았어요. 정할 때까지 이 기기에만 모아 둬요 */
/* 🎵 추천 보내기: Firestore first_recs 에 주소 · 이유 · 시각만 넣어요 (누가 보냈는지는 남기지 않아요). 선생님이 #admin 에서 확인해요 */
async function sendRec(url, why){
  const body = { fields:{ url:{ stringValue:url.slice(0, 200) }, why:{ stringValue:why.slice(0, 60) }, at:{ integerValue:String(Date.now()) } } };
  const r = await fetch(`${FS}/first_recs?key=${FKEY}`, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(body) });
  if (!r.ok) throw new Error("send");
}
if (IS_ADMIN_PAGE) adminPage(); else {
render();
nativeStart();
setTimeout(weekPopup, 600);
}
