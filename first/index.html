// 정사각형으로 담기: zoom 이 크면 더 크게, dx · dy 는 칸 너비에 대한 비율(끌어서 옮긴 만큼)

/* 약한 과목 = 설정에서 정한 것, 없으면 가장 최근 성적에서 등급이 가장 낮은(숫자가 큰) 과목 */

  let w = "", wg = 0; for (const [n, v] of Object.entries(g.g)) if (v > wg){ wg = v; w = n; }   // 한 시험 안에서는 등급 숫자가 클수록 약해요 (내신 1~5 · 모의 1~9)

/* 🔁 반복 할 일: 그 요일이 되면(오늘 · 앞으로 올 날만) 한 번씩 넣어요. 넣은 날은 D.rs[날짜]에 적어 두어 지워도 다시 안 생겨요 */
function applyReps(k){
  if (k < today() || !D.reps.length) return;
  const wd = new Date(k + "T00:00").getDay(), seen = D.rs[k] = D.rs[k] || []; let n = 0;
  for (const r of D.reps) if (r.days.includes(wd) && k >= r.from && !seen.includes(r.id)){ addLine(k, r.s, r.t); seen.push(r.id); n++; }

/* 오늘 순공(초): 기록된 것 + 지금 재고 있는 타이머(아직 끝내기 전)까지 */

/* ===================== 달력 (월 · 주) ===================== */
const lvOf = h => !h ? 0 : h < D.th[0] ? 1 : h < D.th[1] ? 2 : h < D.th[2] ? 3 : 4;
/* 📊 지난 7일 돌아보기 (오늘 포함 7일): 순공 합 · 공부한 날 · 가장 많이 한 것 · 체크한 할 일 */
function weekStats(end = new Date()){
  let sec = 0, days = 0, by = {}, done = 0, all = 0;
  for (let i = 0; i < 7; i++){ const d = new Date(end); d.setDate(d.getDate() - i); const k = dk(d), s1 = secOf(k); sec += s1; if (s1 >= 60) days++;
    for (const [n, v] of Object.entries(D.log[k] || {})) by[n] = (by[n] || 0) + v;
    const cu = countUnits(D.plans[k] || []); all += cu.all; done += cu.n; }
  const top = Object.entries(by).sort((a, b) => b[1] - a[1])[0];
  return { sec, days, top: top ? top[0] : "", done, all };
}
/* 📈 공부 돌아보기 (자습 습관 분석, 2026-11-15)
   한 주(월~일)의 순공 · 공부한 날 · 할 일 체크 · 요일별 막대 · 지난주와 비교 · 연속 공부 · 한 번에 집중한 시간 · 주로 공부한 때
   타이머를 끝낼 때마다 D.sess 에 { d:날짜, h:시작 시각(시), m:분 }을 남겨요 (최근 500개). 쌤 한마디는 규칙으로 (F = 다정하게, T = 사실대로) */
function habit(mon){
  const wk = dk(mon), tk = today(), days = [...Array(7)].map((_, i) => addDays(wk, i));
  const mins = k => Math.round(secOf(k) / 60);
  const cur = days.map(k => k > tk ? null : mins(k)), sum = cur.reduce((a, b) => a + (b || 0), 0);
  const psum = [...Array(7)].reduce((a, _, i) => a + mins(addDays(wk, i - 7)), 0);
  const past = cur.filter(v => v !== null), studied = past.filter(v => v >= 1).length;
  const best = cur.reduce((bi, v, i) => (v || 0) > (cur[bi] || 0) ? i : bi, 0);
  let done = 0, all = 0; days.forEach(k => { if (k <= tk){ const c = countUnits(D.plans[k] || []); done += c.n; all += c.all; } });
  const ss = (D.sess || []).filter(x => x.d >= wk && x.d <= days[6]);
  const slots = [["아침", 5, 12], ["오후", 12, 18], ["저녁", 18, 22], ["밤", 22, 29]].map(([n, a, b]) => [n, ss.filter(x => { const h = x.h < 5 ? x.h + 24 : x.h; return h >= a && h < b; }).reduce((s, x) => s + x.m, 0)]);
  const top = slots.slice().sort((a, b) => b[1] - a[1])[0];
  const avg = ss.length ? Math.round(ss.reduce((s, x) => s + x.m, 0) / ss.length) : 0;
  let streak = 0; for (let i = mins(tk) ? 0 : 1; i < 90; i++){ if (mins(addDays(tk, -i)) >= 1) streak++; else break; }
  const isEnd = k => [0, 6].includes(new Date(k + "T00:00").getDay());   // 토 · 일 (최근 7일로 볼 때도 날짜로 따져요)
  const weekday = days.reduce((a, k, i) => a + (isEnd(k) ? 0 : cur[i] || 0), 0), weekend = days.reduce((a, k, i) => a + (isEnd(k) ? cur[i] || 0 : 0), 0);
  return { wk, days, cur, sum, psum, studied, nPast:past.length, best, done, all, top:top[1] ? top[0] : "", night:slots[3][1], avg, sessN:ss.length, streak, weekday, weekend, endPast:days[6] <= tk };
}
function habitTips(h){
  const T = D.mode === "t", L = [];
  if (h.psum && (h.sum || h.endPast)){ const r = Math.round((h.sum - h.psum) / h.psum * 100);
    L.push(r >= 0 ? (T ? `지난주보다 순공이 ${r}% 늘었어.` : `지난주보다 ${r}% 더 공부했어! 멋져.`) : (T ? `지난주보다 순공이 ${-r}% 줄었어. 하루 20분만 더하면 따라잡아.` : `지난주보다 조금 줄었어. 괜찮아, 하루 20분만 더해 보자.`)); }
  if (h.nPast >= 3){
    if (h.studied >= Math.min(5, h.nPast)) L.push(T ? `${h.nPast}일 중 ${h.studied}일 공부했어. 매일 하는 습관이 잡혀 가고 있어.` : `거의 매일 공부했어! 꾸준함이 제일 큰 힘이야.`);
    else if (h.studied <= Math.floor(h.nPast / 2)) L.push(T ? `${h.nPast}일 중 ${h.studied}일만 공부했어. 쉬는 날도 10분짜리 할 일 하나면 돼.` : `쉬는 날이 좀 있었네. 바쁜 날은 10분짜리 할 일 하나만 해 보자.`);
  }
  if (h.sessN >= 2){
    if (h.avg < 15) L.push(T ? `한 번에 평균 ${h.avg}분 집중했어. 25분 하고 5분 쉬는 걸로 늘려 보자.` : `한 번에 ${h.avg}분씩 했어. 다음엔 25분 버티고 5분 쉬어 볼까?`);
    else if (h.avg > 70) L.push(T ? `한 번에 평균 ${h.avg}분이야. 50분마다 10분 쉬면 덜 지쳐.` : `한 번에 ${h.avg}분이나 집중했어! 중간에 물 마시고 쉬어 가자.`);
  }
  if (h.night >= 60 && h.night >= h.sum * 0.4) L.push(T ? `밤 10시 넘어 한 공부가 ${hm(h.night * 60)}이야. 잠이 줄면 다음 날 집중이 떨어져.` : `밤늦게 공부를 많이 했네. 잠은 꼭 챙기자 🌙`);
  if (h.endPast && h.weekday >= 60 && h.weekend === 0) L.push(T ? `주말 순공이 0분이야. 주말에 30분씩만 해도 한 주가 달라져.` : `주말엔 푹 쉬었네. 다음 주말엔 30분만 해 볼까?`);
  if (h.all >= 4){ const p = Math.round(h.done / h.all * 100);
    if (p < 50) L.push(T ? `할 일 ${h.all}개 중 ${h.done}개(${p}%)를 했어. 계획을 더 작게 나누면 체크가 늘어.` : `계획이 조금 많았나 봐. 할 일을 더 작게 나눠 보자.`);
    else if (p >= 80) L.push(T ? `할 일 ${p}%를 끝냈어. 계획과 실천이 잘 맞고 있어.` : `계획한 걸 거의 다 해냈어! 정말 대단해 🎉`); }
  if (!L.length) L.push(h.sum ? (T ? `이번 주 순공은 ${hm(h.sum * 60)}이야.` : "이번 주도 차곡차곡 쌓고 있어!") : (T ? "아직 이번 주 순공이 없어. 타이머로 10분부터 재 보자." : "이번 주 첫 순공을 재 볼까? 10분이면 충분해!"));
  return L.slice(0, 3);
}
/* 처음 일주일은 월~일(이번 주), 쓴 지 일주일이 넘으면 '최근 7일'(오늘까지)로 보여 줘요 */
function rolling(){ const ks = Object.keys(D.log).filter(k => secOf(k) > 0).sort(); return !!ks.length && ks[0] <= addDays(today(), -6); }
function nowCard(){ return rolling() ? habitCard(new Date(addDays(today(), -6) + "T00:00"), "최근 7일 공부 돌아보기") : habitCard(weekStart(new Date()), "이번 주 공부 돌아보기"); }
function habitCard(mon, title){
  const h = habit(mon), mx = Math.max(30, ...h.cur.map(v => v || 0)), e = addDays(h.wk, 6);
  const bars = h.cur.map((v, i) => `<div class="hb${v === null ? " fut" : ""}${i === h.best && v ? " top" : ""}"><span class="hv">${v ? (v >= 60 ? Math.floor(v / 60) + "h" + (v % 60 ? v % 60 : "") : v + "m") : ""}</span><i style="height:${v ? Math.max(6, v / mx * 100) : 2}%"></i><small>${WD[new Date(h.days[i] + "T00:00").getDay()]}</small></div>`).join("");

    <div class="wk"><div><b>${hm(h.sum * 60)}</b><small>순공 합계</small></div><div><b>${h.studied}/${h.nPast}일</b><small>공부한 날</small></div><div><b>${h.all ? Math.round(h.done / h.all * 100) + "%" : "-"}</b><small>할 일 체크</small></div></div>
    <div class="hbars" role="img" aria-label="요일별 순공 시간">${bars}</div>
    <div class="hrow"><span>🔥 연속 ${h.streak}일</span>${h.sessN ? `<span>⏱ 한 번에 평균 ${h.avg}분</span>` : ""}${h.top ? `<span>🕘 주로 ${h.top}에</span>` : ""}${h.psum ? `<span>지난주 ${hm(h.psum * 60)}</span>` : ""}</div>

}

// same = 같은 계정의 다른 기기 기록: 순공은 더하지 않고 큰 쪽으로 (같은 시간을 두 번 세지 않게)
function mergeData(o, same){
  if (!o || typeof o !== "object") return;
  const sig = p => JSON.stringify([p.s, p.det || []]);
  for (const [k, L] of Object.entries(o.plans || {})){ const A = D.plans[k] = D.plans[k] || []; const ids = new Set(A.map(p => p.id)), ss = new Set(A.map(sig)); (L || []).forEach(p => { if (!ids.has(p.id) && !ss.has(sig(p))) A.push(p); }); }
  for (const [k, by] of Object.entries(o.log || {})){ const A = D.log[k] = D.log[k] || {}; for (const [s, v] of Object.entries(by || {})) A[s] = same ? Math.max(A[s] || 0, v) : (A[s] || 0) + v; }   // 다른 계정에서 따로 잰 시간이면 더해요
  for (const [k, v] of Object.entries(o.fix || {})) if (D.fix[k] == null) D.fix[k] = v;
  for (const [k, v] of Object.entries(o.diary || {})){ const a = D.diary[k]; if (!a || (v && (v.at || 0) > (a.at || 0) && !(a.log || a.cheer || a.fix))) D.diary[k] = v; }
  for (const [w, G] of Object.entries(o.goals || {})){ const A = D.goals[w] = D.goals[w] || []; const ids = new Set(A.map(g => g.id)); (G || []).forEach(g => { if (!ids.has(g.id)) A.push(g); }); }
  for (const [k, L] of Object.entries(o.rs || {})) D.rs[k] = [...new Set([...(D.rs[k] || []), ...(L || [])])];
  const byId = (a, b, same) => { const ids = new Set(a.map(x => x.id)); (b || []).forEach(x => { if (!ids.has(x.id) && !(same && a.some(y => same(x, y)))) a.push(x); }); };
  byId(D.grades, o.grades, (x, y) => x.name === y.name && JSON.stringify(x.g) === JSON.stringify(y.g));
  byId(D.exams, o.exams, (x, y) => x.n === y.n && x.d === y.d);
  byId(D.reps, o.reps, (x, y) => x.s === y.s && x.t === y.t);
  byId(D.mine, (o.mine || []).slice(0, Math.max(0, 10 - D.mine.length)));
  byId(D.memos, o.memos, (x, y) => x.t === y.t);
  for (const [k, L] of Object.entries(o.events || {})){ const A = D.events[k] = D.events[k] || []; byId(A, L, (x, y) => x.t === y.t && x.kind === y.kind); }
  save(); render();
}

function addLog(day, subj, sec){ if (sec < 1) return; D.log[day] = D.log[day] || {}; D.log[day][subj] = (D.log[day][subj] || 0) + Math.round(sec);
  if (D.fix && D.fix[day] != null) D.fix[day] += Math.round(sec); }   // 그날 순공을 고쳐 둔 날이면 고친 값에도 더해요

function endTimer(keep, upto){

/* ===================== 🐰 친구들 (화면 여기저기에) =====================
   꾸미기에서 고른 친구들(D.crew)이 화면 위에 떠 있어요. 친구가 버튼을 가리지 않게, 친구를 톡 누르면 그 아래 버튼이 눌려요
   - 움직임 D.move: still 가만히 · breath 숨만 쉬기 · roam 돌아다니기
   - 꾹 누른 채 끌면 옮겨요 (자리는 D.spots 에 기억, [다시 흩어 놓기]로 처음처럼)
   - 상황 따라(D.react): 다 하면 가운데로 나와 축하(moment) · 3분 넘게 가만히 있으면 졸기 · 시험 사흘 전부터 머리띠
   - 가끔 말 걸기(D.pop): 2~4분마다 한 친구가 한마디 */
const CREW = { els:{}, idle:Date.now(), sleep:false, drag:null, eat:0 };
/* 친구들 크기 (2026-11-17, 패드에서 작다는 말에): 자동 = 휴대폰 보통 · 패드처럼 넓은 화면은 크게 */
const CSIZE = [["auto", "자동"], ["s", "작게"], ["m", "보통"], ["l", "크게"], ["xl", "아주 크게"]];
const csScale = () => { const k = D.csize || "auto"; return k === "s" ? .8 : k === "l" ? 1.3 : k === "xl" ? 1.65 : k === "m" ? 1 : (innerWidth >= 700 ? 1.3 : 1); };
const crewRnd = () => { const r = Math.random(); return { x:r < .4 ? .07 + Math.random() * .15 : r < .8 ? .78 + Math.random() * .15 : .25 + Math.random() * .5, y:.24 + Math.random() * .64 }; };   // 글씨를 덜 가리게 대부분 양쪽 가장자리에
function crewPlace(el, p){ el._p = p; el.style.left = (p.x * 100) + "%"; el.style.top = (p.y * 100) + "%"; el.classList.toggle("rt", p.x > .6); }
function crewSync(){
  const box = $("crew"); if (!box) return;
  const ids = D.crew.filter(id => !id.startsWith("m:") || D.mine.some(m => "m:" + m.id === id)).slice(0, 9);

    const msg = od ? `${name}로 따로 만든 계정에 기록이 있어요 (${window.dataSummary?.(od) || ""}).\n\n지금 계정과 하나로 합칠까요?\n· 할 일 · 순공 · 일기 · 성적 · 시험이 모두 지금 계정으로 모여요\n· 앞으로 어느 방법으로 들어와도 같은 기록이에요\n· 합친 뒤에는 되돌릴 수 없어요`
      : `${name}로 들어와도 지금 기록이 열리게 연결할까요?`;
    if (!confirm(msg)) return;
    if (od) window.mergeData?.(od);
    if (!(await doPush())) throw new Error("지금 기록을 서버에 올리지 못했어요. 인터넷을 확인해 주세요");
    try { await deleteDoc(doc(S2.db, "first_users", o.uid)); await deleteDoc(doc(S2.db, "first_stat", o.uid)); } catch (e) {}
    await bridge("/merge", { main:await user.getIdToken(true), other:await o.getIdToken(true) });
    await user.reload(); push(true);
    T(od ? `하나로 합쳤어요. 이제 ${name}로 들어와도 같은 기록이에요` : `${name} 연결했어요. 이제 어느 쪽으로 들어와도 같은 기록이에요`);
  } finally { try { await signOut(S2.auth); } catch (e) {} }
}
window.FB = { push:() => push(false), sync:() => doPush(), who, out, quit, syncText, syncBad:() => !!syncErr, kinds, link };

/* ===================== 📊 관리자 화면 (#admin): 가입 · 사용 숫자만 ===================== */
if (ADMIN){

  const box = document.createElement("div"); box.className = "gate"; box.innerHTML = `<div class="gbox" id="admBox"><h1>먼저 플래너 · 관리자</h1><p>불러오는 중…</p></div>`; document.body.appendChild(box);
  const B = el("admBox");

  onAuthStateChanged(auth, async u => {
    if (!u || !ADMIN_EMAILS.includes(String(u.email || "").toLowerCase())){
      if (u) await signOut(auth);   // 관리자가 아닌 계정은 바로 로그아웃 (공용 로그인에 남지 않게)
      B.innerHTML = `<h1>먼저 플래너 · 관리자</h1><p>관리자 구글 계정으로 로그인해 주세요</p><div class="gbtns"><button type="button" class="gb google" id="admIn"><b>G</b> 구글 계정으로 로그인</button></div><p class="gerr" id="admErr"></p>`;
      el("admIn").onclick = async () => { const p = new GoogleAuthProvider(); p.setCustomParameters({ prompt:"select_account" }); try { await signInWithPopup(auth, p); } catch (e) { el("admErr").textContent = "로그인하지 못했어요"; } };
      return;
    }
    // 📊 대시보드 (2026-11-21): 사용 숫자(first_stat)만 모두 읽어 이 화면에서 셈해요. 학생 기록(first_users)은 읽지 않아요
    B.innerHTML = `<h1>먼저 플래너 · 관리자</h1><p>숫자를 모으는 중…</p>`;
    let rows = [];
    try { rows = (await getDocs(collection(db, "first_stat"))).docs.map(x => x.data()); }
    catch (e) { B.innerHTML = `<h1>먼저 플래너 · 관리자</h1><p>숫자를 불러오지 못했어요 (${String(e.code || e.message).replace(/</g, "&lt;")})</p>`; return; }
    box.className = "adm"; box.innerHTML = admDash(rows);
    box.querySelector("[data-adm=re]")?.addEventListener("click", () => location.reload());
  });

  // 기능 이름 (앱의 단추 이름 → 화면에 보일 이름). 새 기능을 세면 여기에도 한 줄
  const ADM_USE = [["plan", "할 일 넣기"], ["check", "할 일 체크"], ["carry", "내일로 넘기기"], ["timer", "타이머 시작"], ["sound", "공부 소리"], ["secfix", "순공 고치기"],
    ["ev", "일정 · 수행평가"], ["exam", "시험 D-day"], ["memo", "메모 쓰기"], ["grade", "성적 넣기"], ["gphoto", "성적표 사진"], ["pics", "사진에서 할 일"],
    ["diary", "하루 마무리 일기"], ["deco", "꾸미기"], ["mine", "내 캐릭터 만들기"], ["reps", "반복 할 일"], ["goal", "주간 목표"], ["rem", "알림 켜기"], ["guide", "사용 설명서"], ["backup", "백업 파일"]];
  const ADM_TAB = [["t_today", "오늘"], ["t_cal", "달력"], ["t_memo", "메모"], ["t_grades", "성적"], ["t_pics", "사진"]];
  const WD = ["일", "월", "화", "수", "목", "금", "토"];
  function admDash(R){
    const T = dkey(new Date()), ago = n => { const d = new Date(); d.setDate(d.getDate() - n); return dkey(d); };
    const cday = r => r.created?.toDate ? dkey(r.created.toDate()) : "";
    const act = r => { const s = new Set(Object.keys(r.days || {})); if (r.lastDay) s.add(r.lastDay); return s; };   // 쓴 날짜 (예전 학생은 마지막 쓴 날만)
    const A = R.map(r => ({ r, c:cday(r), a:act(r) })), N = R.length;
    const pct = (n, of) => of ? Math.round(n / of * 100) : 0;
    const since = (n, f) => A.filter(x => x.r.lastDay && x.r.lastDay >= ago(n) && (!f || f(x))).length;
    const tracked = A.filter(x => x.r.days || x.r.use || x.r.hrs).length;
    // 처음 숫자 칸
    const old7 = A.filter(x => x.c && x.c <= ago(7)), back = old7.filter(x => x.r.lastDay > x.c).length, week1 = old7.filter(x => x.r.lastDay >= addDays(x.c, 7)).length;
    const avgDays = tracked ? (A.filter(x => x.r.days).reduce((s, x) => s + Object.keys(x.r.days).length, 0) / A.filter(x => x.r.days).length).toFixed(1) : "—";
    const tiles = [[N, "전체 가입"], [since(0), "오늘 쓴 학생"], [since(6), "7일 안에 쓴 학생"], [since(29), "30일 안에 쓴 학생"],
      [A.filter(x => x.c === T).length, "오늘 가입"], [A.filter(x => x.c >= ago(6)).length, "7일 안에 가입"], [pct(back, old7.length) + "%", "다시 온 학생", "가입한 날 말고 다른 날에도 쓴 비율 (가입 7일 넘은 학생)"], [pct(week1, old7.length) + "%", "1주 뒤에도 쓰는 학생", "가입하고 7일 뒤에도 쓴 비율"]];
    // 날마다 쓴 학생 · 가입 (30일)
    const D30 = Array.from({ length:30 }, (_, i) => ago(29 - i));
    const dau = D30.map(d => A.filter(x => x.a.has(d)).length), join = D30.map(d => A.filter(x => x.c === d).length);
    // 시간대 · 요일 · 기능
    const H = Array.from({ length:24 }, (_, h) => R.reduce((s, r) => s + (+(r.hrs || {})[h] || 0), 0));
    const W = WD.map(() => 0); A.forEach(x => x.a.forEach(d => { if (d >= ago(55)) W[new Date(d + "T12:00").getDay()]++; }));
    const feat = L => L.map(([k, n]) => ({ k, n, users:R.filter(r => (r.use || {})[k] > 0).length, times:R.reduce((s, r) => s + (+(r.use || {})[k] || 0), 0) })).sort((a, b) => b.users - a.users || b.times - a.times);
    const F = feat(ADM_USE), TB = feat(ADM_TAB), usedN = R.filter(r => r.use).length;
    // 기기 · 로그인 · 쓴 날 수
    const plat = [["ios", "아이폰 · 아이패드 앱"], ["app", "안드로이드 앱"], ["web", "웹"]].map(([k, n]) => [n, R.filter(r => (r.plat || "web") === k).length]);
    const kind = [["google.com", "구글"], ["oidc.kakao", "카카오"], ["apple.com", "Apple"]].map(([k, n]) => [n, R.filter(r => (r.kinds || []).some(p => String(p).startsWith(k))).length]);
    const nd = A.filter(x => x.r.days).map(x => Object.keys(x.r.days).length);
    const bins = [["1일", n => n === 1], ["2~3일", n => n >= 2 && n <= 3], ["4~7일", n => n >= 4 && n <= 7], ["8~14일", n => n >= 8 && n <= 14], ["15일 넘게", n => n >= 15]].map(([t, f]) => [t, nd.filter(f).length]);

    // 그리기
    const peak = L => Math.max(1, ...L);
    const cols = (L, labels, every, hi) => { const m = peak(L); return `<div class="ac">${L.map((v, i) => `<div class="acol ${hi === i ? "hi" : ""}" title="${labels[i]} · ${v}"><i style="height:${Math.round(v / m * 100)}%"></i><span>${i % every === 0 ? labels[i] : ""}</span></div>`).join("")}</div>`; };
    const bars = (L, of, unit) => `<div class="ab">${L.map(([t, v, sub]) => `<div class="arow"><span class="an">${t}</span><span class="abar"><i style="width:${pct(v, of)}%"></i></span><span class="av">${v}${unit} <small>${sub || pct(v, of) + "%"}</small></span></div>`).join("")}</div>`;
    const hPeak = H.indexOf(Math.max(...H)), wPeak = W.indexOf(Math.max(...W));
    const card = (t, sub, body, wide) => `<section class="acard ${wide ? "wide" : ""}"><h2>${t}</h2>${sub ? `<p class="asub">${sub}</p>` : ""}${body}</section>`;
    return `<style>
      .adm{position:fixed;inset:0;overflow:auto;background:#F6F4F7;z-index:50;font-family:var(--sys,-apple-system,'Malgun Gothic',sans-serif);color:#2E2A33}
      .adm .aw{max-width:1120px;margin:0 auto;padding:28px 20px 60px}
      .adm header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
      .adm h1{font-size:26px;margin:0}.adm header p{margin:4px 0 0;color:#6B5E66;font-size:14px}
      .adm header button{border:1px solid #D9D2DB;background:#fff;border-radius:10px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
      .adm .at{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
      .adm .tile{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
      .adm .tile b{display:block;font-size:28px;color:#FF5C84;font-variant-numeric:tabular-nums}.adm .tile span{font-size:13px;color:#6B5E66}.adm .tile small{display:block;font-size:11px;color:#9A8F9C;margin-top:4px}
      .adm .ag{display:grid;grid-template-columns:1fr 1fr;gap:14px}
      .adm .acard{background:#fff;border-radius:16px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.05);min-width:0}.adm .acard.wide{grid-column:1/-1}
      .adm h2{font-size:16px;margin:0}.adm .asub{font-size:13px;color:#6B5E66;margin:4px 0 12px}.adm .asub b{color:#FF5C84}
      .adm .ac{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:6px}
      .adm .acol{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}
      .adm .acol i{display:block;width:100%;background:#FFC2D1;border-radius:4px 4px 0 0;min-height:2px}.adm .acol.hi i{background:#FF5C84}
      .adm .acol span{font-size:10px;color:#9A8F9C;height:14px;margin-top:4px;white-space:nowrap}
      .adm .ac.small{height:70px}
      .adm .arow{display:grid;grid-template-columns:120px 1fr 160px;align-items:center;gap:10px;padding:5px 0;font-size:14px}
      .adm .abar{height:12px;background:#F3EEF2;border-radius:6px;overflow:hidden}.adm .abar i{display:block;height:100%;background:#FF7A9A;border-radius:6px}
      .adm .av{text-align:right;font-variant-numeric:tabular-nums}.adm .av small{color:#9A8F9C}
      .adm .anote{font-size:12px;color:#9A8F9C;margin-top:14px}
      @media (max-width:760px){.adm .at{grid-template-columns:repeat(2,1fr)}.adm .ag{grid-template-columns:1fr}.adm .arow{grid-template-columns:96px 1fr 92px}}
    </style><div class="aw">
      <header><div><h1>먼저 플래너 · 관리자</h1><p>가입 · 사용 숫자만 보여요. 학생이 쓴 할 일 · 메모 · 일기는 볼 수 없어요</p></div><button type="button" data-adm="re">↻ 새로 셈하기</button></header>
      <div class="at">${tiles.map(([n, t, s]) => `<div class="tile"><b>${n}</b><span>${t}</span>${s ? `<small>${s}</small>` : ""}</div>`).join("")}</div>
      <div class="ag">
        ${card("날마다 쓴 학생 · 최근 30일", `오늘 <b>${dau.at(-1)}명</b> · 30일 동안 하루 평균 ${(dau.reduce((a, b) => a + b, 0) / 30).toFixed(1)}명`, cols(dau, D30.map(d => +d.slice(8) + "일"), 5, 29) + `<p class="asub" style="margin-top:14px">날마다 새로 가입 · 30일 동안 ${join.reduce((a, b) => a + b, 0)}명</p>` + cols(join, D30.map(d => +d.slice(8) + "일"), 5).replace('class="ac"', 'class="ac small"'), true)}
        ${card("자주 들어오는 시간대", H.some(v => v) ? `가장 많이 여는 때 <b>${hPeak}시</b> · 30분 안에 다시 열면 한 번으로 세요` : "아직 모인 숫자가 없어요", cols(H, H.map((_, h) => h + "시"), 3, hPeak))}
        ${card("요일별로 쓴 학생 · 최근 8주", W.some(v => v) ? `가장 많이 쓰는 요일 <b>${WD[wPeak]}요일</b>` : "", cols(W, WD, 1, wPeak))}
        ${card("자주 쓰는 기능", `숫자를 보낸 학생 ${usedN}명 가운데 한 번이라도 쓴 학생 · 누른 횟수`, bars(F.map(f => [ADM_USE.find(x => x[0] === f.k)[1], f.users, `${pct(f.users, usedN)}% · ${f.times}번`]), usedN, "명"), true)}
        ${card("자주 여는 화면", "아래 메뉴를 누른 학생 수 · 횟수", bars(TB.map(f => [ADM_TAB.find(x => x[0] === f.k)[1], f.users, `${pct(f.users, usedN)}% · ${f.times}번`]), usedN, "명"))}
        ${card("쓴 날 수", `날짜를 센 학생 ${nd.length}명 · 평균 ${avgDays}일`, bars(bins, nd.length, "명"))}
        ${card("기기", "마지막으로 쓴 기기 기준", bars(plat, N, "명"))}
        ${card("로그인 종류", "계정을 여러 개 이으면 겹쳐 세요", bars(kind, N, "명"))}
      </div>
      <p class="anote">기능 · 시간대 · 쓴 날짜 숫자는 2026년 11월 21일부터 모여요 (지금까지 ${tracked}명). 앱 설치 수는 App Store Connect · Play Console 의 통계에서 봐요.</p>
    </div>`;
  }
}
