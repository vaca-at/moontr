<style>
/* 먼저 플래너 (2026-11-13, 주소 /first, 시안 https://claude.ai/artifact/TfMYANU6DV3m7dXEi5AYsP)
   동글한 흰 카드 · 포인트 색 하나 · 배경 4가지 · 글꼴(기본 온글잎 언즈체)
   2026-11-15: 과목 목록 하나(과목마다 '매일 할 일에 넣기' 스위치) · 달력 월/주 · 반복 할 일 · 이번 주 목표 · 내일로 넘기기
               아래 탭 = 오늘 · 달력 · 사진 · 성적 (공부 소리는 타이머 안 🎧) · 사진 → 할 일 찾기(휴대폰 안에서 글자 읽기)
               캐릭터 = 좋아하는 친구 여러 명이 화면 여기저기에 (가만히 · 숨만 쉬기 · 돌아다니기, 꾹 눌러 옮기기)
   모든 기록은 이 기기(브라우저 저장소 first-v1, 사진은 IndexedDB first-pics)에만 저장해요. 로그인 · 서버 없음 */
:root{ color-scheme:light;
  --bg:#FFFFFF; --ink:#1D1D1F; --sub:#8E8E93; --hair:rgba(60,60,67,.14); --soft:#F2F2F7; --soft2:#E5E5EA;
  --f:#FF6F91; --f-soft:#FFF0F3; --t:#0A84FF; --t-soft:#EEF5FF; --ok:#30C46B;
  --sys:-apple-system,BlinkMacSystemFont,'SF Pro Display','Apple SD Gothic Neo','Pretendard','Malgun Gothic',sans-serif;
  --mode:var(--f); --mode-soft:var(--f-soft);
}
body.t{--mode:var(--t);--mode-soft:var(--t-soft)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
@font-face{font-family:'OngleipUnz';src:url(https://cdn.jsdelivr.net/gh/projectnoonnu/2406-1@1.0/Ownglyph_UNZ-Rg.woff2) format('woff2');font-display:swap}
body{margin:0;background:#F2F2F7;color:var(--ink);font-family:var(--font,'Jua'),var(--sys);font-size:16px;line-height:1.45;word-break:keep-all;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.app{font-family:var(--font,'Jua'),var(--sys);position:relative;max-width:480px;height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:520px){ .app{height:calc(100% - 40px);margin:20px auto;border-radius:28px;box-shadow:0 10px 40px rgba(0,0,0,.08)} }
main{flex:1;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 18px) max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sub{color:var(--sub);font-size:13px}
.big{font-weight:700;font-size:30px;letter-spacing:-.02em;line-height:1.15;margin:0}
.ic{width:44px;height:44px;font-size:21px!important;border-radius:50%;border:0;background:var(--soft);color:var(--sub);display:grid;place-items:center;cursor:pointer;flex:none;font-size:16px}
.say{font-size:15px;line-height:1.5;padding:12px 14px;border-radius:16px;background:var(--mode-soft)}
.say b{display:block;font-size:11px;font-weight:600;color:var(--mode);margin-bottom:2px}
.list{display:flex;flex-direction:column}
.item{border-bottom:.5px solid var(--hair)}.item:last-child{border-bottom:0}
.row{display:flex;align-items:center;gap:10px;padding:13px 0;min-height:52px}
.row .nm{flex:1;min-width:0;cursor:pointer}
.row .nm small{color:var(--sub);font-size:13px;margin-left:6px}
.first{color:var(--mode);font-size:11px;font-weight:600;margin-left:6px}
.dot{width:24px;height:24px;border-radius:50%;border:1.5px solid #C7C7CC;background:none;flex:none;cursor:pointer;padding:0}
.done .dot{background:var(--mode);border-color:var(--mode)}
.done .nm>span{color:var(--sub);text-decoration:line-through}
.play{border:0;background:var(--soft);color:var(--mode);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer}
.det{margin:-6px 0 10px;padding:0 0 0 20px;color:var(--sub);font-size:13.5px;line-height:1.6}
.det li::marker{color:var(--mode);font-weight:600}
.det-act{display:flex;gap:14px;margin:-4px 0 12px 20px}
.link{border:0;background:none;padding:0;color:var(--mode);font-size:13px;cursor:pointer}
.link.del{color:var(--sub)}
.add{border:0;width:100%;border-radius:14px;padding:13px;text-align:center;font-weight:600;font-size:15px;color:var(--mode);background:var(--mode-soft);cursor:pointer}
.empty{color:var(--sub);text-align:center;padding:20px 0;font-size:14px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:.5px solid var(--hair);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.tabs button{border:0;background:none;color:var(--sub);font-size:11px;font-weight:500;display:grid;justify-items:center;gap:3px;cursor:pointer;padding:2px 0}
.tabs svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--mode);font-weight:600}
/* ⏱ 오른쪽에서 밀려 나오는 타이머 */
.edge svg{display:block}
.edge{touch-action:none;position:absolute;right:0;top:44%;width:36px;height:100px;border:0;border-radius:18px 0 0 18px;background:var(--mode);color:#fff;font-size:19px;padding:0;display:grid;place-items:center;cursor:pointer;z-index:4;box-shadow:-2px 2px 8px rgba(0,0,0,.12)}
.edge.run{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.2);z-index:5;opacity:0;pointer-events:none;transition:opacity .25s}
.side{position:absolute;top:0;bottom:0;right:0;width:88%;background:rgba(255,255,255,.97);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:-10px 0 30px rgba(0,0,0,.12);border-radius:28px 0 0 28px;transform:translateX(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:6;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 16px) 20px calc(20px + env(safe-area-inset-bottom,0px));gap:12px}
.app.tl .edge{right:auto;left:0;border-radius:0 18px 18px 0;box-shadow:2px 2px 8px rgba(0,0,0,.12)}
.app.tl .side{right:auto;left:0;transform:translateX(-105%);border-radius:0 28px 28px 0;box-shadow:10px 0 30px rgba(0,0,0,.12)}
.app.timer-open .side{transform:none}.app.timer-open .scrim{opacity:1;pointer-events:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:0;font-size:13px;padding:6px 12px;border-radius:999px;background:var(--soft);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--mode);color:#fff}
.clock{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.clock .num{font-weight:200;font-size:76px;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.bar{width:220px;height:6px;border-radius:3px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--mode);border-radius:3px}
.pill{border:0;border-radius:999px;padding:13px 32px;font-weight:600;font-size:16px;background:var(--ink);color:#fff;cursor:pointer}
.pill.light{background:var(--soft);color:var(--ink)}
.pill.sm{padding:8px 14px;font-size:13.5px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
/* 📅 달력 */
.mnav{display:flex;align-items:center;gap:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .dh{color:var(--sub);font-size:12px}
.cal button{aspect-ratio:1;border:0;border-radius:50%;display:grid;place-items:center;font-size:13px;color:var(--ink);background:none;cursor:pointer;padding:0}
.cal button.today{outline:2px solid var(--ink);outline-offset:1px}
.l0{box-shadow:inset 0 0 0 1px #D1D1D6;color:var(--sub)!important}
.l1{background:color-mix(in srgb,var(--mode) 10%,#fff)!important}
.l2{background:color-mix(in srgb,var(--mode) 35%,#fff)!important}
.l3{background:color-mix(in srgb,var(--mode) 72%,#fff)!important;color:#fff!important;font-weight:600}
.l4{background:color-mix(in srgb,var(--mode) 85%,#000)!important;color:#fff!important;font-weight:700}
.fut{color:#C7C7CC!important;box-shadow:none!important;background:none!important}
.lg{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:11.5px;color:var(--sub)}
.lg i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-2px;margin-right:4px}
.dayinfo{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14px}
.dayinfo .r{display:flex;justify-content:space-between;padding:3px 0}
/* 📈 성적 */
.chart svg{width:100%;height:auto;display:block}
.glist .row{min-height:44px}
/* 설정 · 시트 */
.gh{font-size:12.5px;color:var(--sub);margin:4px 4px -10px}
.grp{background:var(--soft);border-radius:14px;padding:0 14px}
.grp .row{min-height:48px;border-bottom:.5px solid var(--hair);justify-content:space-between}
.grp .row:last-child{border-bottom:0}
.seg{display:inline-flex;background:var(--soft2);border-radius:9px;padding:2px}
.seg button{border:0;background:none;font-weight:600;font-size:13px;padding:5px 14px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.step{display:inline-flex;align-items:center;gap:8px}
.step button{width:28px;height:28px;border-radius:50%;border:0;background:#fff;font-weight:600;font-size:16px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.step b{min-width:48px;text-align:center;font-weight:600;font-size:15px}
.mini{width:14px;height:14px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:-2px}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.25);z-index:8}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:9;background:#fff;border-radius:22px 22px 0 0;padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:88%;overflow-y:auto;box-shadow:0 -10px 30px rgba(0,0,0,.12)}
.sheet h2{margin:0;font-size:20px}
.sheet label{display:grid;gap:6px;font-size:13px;color:var(--sub)}
.sheet input,.sheet textarea,.sheet select{border:0;background:var(--soft);border-radius:12px;padding:11px 12px;font-size:16px;color:var(--ink);width:100%}
.sheet textarea{min-height:96px;resize:vertical;line-height:1.5}
.gpick{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:center;font-size:14px}
.gpick .chips button{min-width:30px;padding:5px 0;text-align:center}
.note{font-size:12.5px;color:var(--sub);margin:0}
.policy summary{cursor:pointer;color:var(--sub);font-size:13px}
.policy div{font-size:12.5px;color:var(--sub);line-height:1.6}
.policy h4{margin:10px 0 2px;font-size:13px;color:var(--ink)}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(29,29,31,.92);color:#fff;font-size:14px;padding:9px 16px;border-radius:999px;z-index:20;white-space:nowrap}
:focus-visible{outline:3px solid var(--mode);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.side,.scrim{transition:none}.edge.run{animation:none}.sayw .ava,.walker,.peeker,.popper,.moment .mc{animation:none!important}}
/* ===== 꾸미기 (2026-11-13): 배경 4가지 · 카드 · 캐릭터 세 명 ===== */
.app.bg-s{background-color:#FFF6F8;background-image:linear-gradient(90deg,rgba(255,170,190,.2) 50%,transparent 0),linear-gradient(rgba(255,170,190,.2) 50%,transparent 0);background-size:28px 28px}
.app.bg-d{background-color:#FFFBF2;background-image:radial-gradient(circle,#E9DFC9 1.2px,transparent 1.6px);background-size:16px 16px}
.app.bg-r{background-color:#EEF7FF;background-image:radial-gradient(circle,#fff 5px,transparent 5.5px);background-size:34px 34px}
.bg-r .big.ttl::after{content:"🎀";font-size:22px;margin-left:6px;vertical-align:4px}
.big{font-weight:400}
.cards{display:flex;flex-direction:column;gap:9px}
.cards .item{background:#fff;border:1.5px solid #F0EAED;border-radius:18px;padding:0 14px;position:relative}
.cards .item:last-child{border-bottom:1.5px solid #F0EAED}
.bg-s .cards .item{border-color:#FFD0DC;box-shadow:0 3px 0 #FFD0DC}
.bg-d .cards .item{border-radius:8px;border-color:#EFE4D2;box-shadow:2px 3px 0 rgba(74,59,53,.1);rotate:-.5deg}.bg-d .cards .item:nth-child(2n){rotate:.6deg}
.bg-d .cards .item:not(:first-child)::before{content:"";position:absolute;top:-7px;left:20px;width:50px;height:14px;rotate:-4deg;background:repeating-linear-gradient(90deg,rgba(140,205,170,.75) 0 6px,rgba(170,225,195,.75) 6px 12px)}
.bg-d .cards .item:nth-child(2n)::before{left:auto;right:22px;rotate:5deg;background:repeating-linear-gradient(90deg,rgba(255,180,200,.8) 0 6px,rgba(255,210,222,.8) 6px 12px)}
.bg-r .cards .item{border-color:#DCEBF8}
.cards .dot{border-color:#DDD5D9}
.done .dot{animation:pop .45s cubic-bezier(.3,1.8,.5,1)}@keyframes pop{35%{transform:scale(1.3) rotate(-10deg)}}
.done .nm>span{text-decoration:none;opacity:.45}
.first{background:var(--mode-soft);border-radius:999px;padding:1px 7px;vertical-align:2px}
.play{background:var(--mode-soft)}
.add{background:#fff;border:1.5px dashed var(--mode)}
.tabs{background:rgba(255,255,255,.95)}
.ch{display:block;width:100%;height:100%}.ch svg,.ch img{width:100%;height:100%;object-fit:contain;display:block}
.sayw{display:flex;gap:10px;align-items:flex-start}
.sp-r .sayw{flex-direction:row-reverse}.sp-r .sayw .say{border-radius:18px 18px 6px 18px}
.sp-c .sayw{flex-direction:column;align-items:center;text-align:center}.sp-c .sayw .say{border-radius:18px}.sp-c .sayw .ava{width:64px;height:64px}
/* 🐰 캐릭터 움직임 (꾸미기에서): 가만히 · 숨만 쉬기 · 조금 움직이기 · 많이 움직이기 */
@keyframes breath{50%{transform:scale(1.05)}}
@keyframes wig{0%,100%{transform:rotate(0) translateY(0)}20%{transform:rotate(-10deg) translateY(-4px)}40%{transform:rotate(8deg) translateY(0)}60%{transform:rotate(-5deg) translateY(-6px)}80%{transform:rotate(4deg)}}
@keyframes jump{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-10px) scale(1.06,.94)}}
.mv-still .sayw .ava,.mv-still .peeker,.mv-still .walker{animation:none!important}
.mv-breath .sayw .ava,.mv-breath .peeker{animation:breath 3.6s ease-in-out infinite!important}.mv-breath .walker{animation:none!important}
.mv-lots .sayw .ava{animation:wig 1.8s ease-in-out infinite!important}.mv-lots .peeker{animation:jump 1.4s ease-in-out infinite!important}.mv-lots .walker{animation:jump .7s ease-in-out infinite!important}
/* 중요할 때 가운데로 · 가끔 튀어나오기 */
.moment{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:rgba(0,0,0,.18);animation:mfade .25s both}
.moment .mc{position:relative;z-index:1;display:grid;justify-items:center;gap:10px;animation:mpop .55s cubic-bezier(.3,1.6,.5,1) both}
.moment .mc .ch{width:150px;height:150px}.moment .mc p{margin:0;background:#fff;color:#2B2B33;border-radius:20px;padding:12px 18px;font-size:18px;max-width:260px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.15)}
@keyframes mfade{from{opacity:0}}@keyframes mpop{from{transform:scale(.3) translateY(40px);opacity:0}}
.popper{position:absolute;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:12;display:flex;align-items:flex-end;gap:6px;pointer-events:none;animation:pin 3.2s cubic-bezier(.3,1.4,.5,1) both}
.popper.l{left:-8px}.popper.r{right:-8px;flex-direction:row-reverse}
.popper .ch{width:72px;height:72px}.popper p{margin:0 0 40px;background:#fff;border-radius:14px;padding:6px 10px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.12);white-space:nowrap}
@keyframes pin{0%{transform:translateY(120%)}14%,82%{transform:translateY(0)}100%{transform:translateY(130%)}}
.sayw .ava{flex:none;width:48px;height:48px;animation:nod 3s ease-in-out infinite}
@keyframes nod{50%{transform:rotate(-7deg) translateY(-2px)}}
@keyframes hop{50%{transform:translateY(-4px)}}
.sayw .say{flex:1;border-radius:18px 18px 18px 6px}
.say b{display:none}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;margin-top:14px;position:sticky;top:-18px;z-index:4;padding:12px 0 10px;margin-bottom:-10px}
.prog::before{content:"";position:absolute;inset:0 -20px;z-index:-1;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);opacity:0;transition:opacity .2s}
main.scrolled .prog::before{opacity:1}
.prog .tr{flex:1;height:8px;border-radius:4px;background:#F2EEF0;position:relative}
.prog .tr i{display:block;height:100%;border-radius:4px;background:var(--mode);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.walker{position:absolute;width:32px;height:32px;top:-30px;margin-left:-16px;transition:left .6s cubic-bezier(.2,.8,.2,1);animation:hop .5s ease-in-out infinite;pointer-events:none}
.cards.peek{margin-top:18px}
.peeker{position:absolute;right:62px;top:-31px;width:40px;height:40px;z-index:2;pointer-events:none;animation:nod 3.4s ease-in-out infinite}
.say2{position:absolute;right:106px;top:-28px;z-index:2;background:#fff;border:1px solid #F0EAED;font-size:12px;padding:3px 9px;border-radius:12px 12px 4px 12px;white-space:nowrap;opacity:0;transform:translateY(4px);transition:.3s;pointer-events:none}
.say2.on{opacity:1;transform:none}
/* 설정 · 꾸미기 */
.grp.pad{padding:12px 14px;display:grid;gap:12px}
.bgs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bgs button{border:1.5px solid #E5E5EA;border-radius:14px;padding:0;height:58px;cursor:pointer;font-size:11.5px;display:grid;align-items:end;padding-bottom:4px;background-size:auto}
.bgs button[aria-pressed="true"]{border-color:var(--mode);box-shadow:0 0 0 3px var(--mode-soft)}
.cols{display:flex;gap:12px;flex-wrap:wrap}.cols button{width:28px;height:28px;border-radius:50%;border:0;cursor:pointer;background:var(--c)}
.cols button[aria-pressed="true"]{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--c)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border:1.5px solid #E5E5EA;background:#fff;border-radius:16px;padding:8px 4px 6px;display:grid;justify-items:center;gap:1px;cursor:pointer}
.slot .ch{width:52px;height:52px}.slot b{font-size:12.5px;font-weight:400}.slot small{font-size:10.5px;color:var(--sub)}
.slot[aria-pressed="true"]{border-color:var(--mode);box-shadow:0 0 0 3px var(--mode-soft)}
.lib{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.lib .it{position:relative}

/* 진행 막대 = 체크한 할 일 비율 · 오른쪽 글씨 = 오늘 순공 전체(재는 중인 타이머 포함). 과목별 시간은 정하지 않아요 */
function progHtml(){ const c = countUnits(plansOf(today()));
  return { txt:`순공 ${hm(liveSec())}`, pct:c.all ? c.n / c.all * 100 : 0, n:c.n, all:c.all }; }
const secOf = k => Object.values(D.log[k] || {}).reduce((a, b) => a + b, 0);
function daysSince(subj){ for (let i = 0; i < 60; i++){ const d = new Date(); d.setDate(d.getDate() - i); if ((D.log[dk(d)] || {})[subj] > 60) return i; } return 60; }

/* ===================== 쌤 한마디 (F = 다정하게, T = 숫자로 딱) ===================== */
const say = (f, t) => `<div class="sayw"><div class="say">${esc(D.mode === "t" ? t : f)}</div></div>`;
function todaySay(){
  const L = plansOf(today()), w = weakSubj(), cu = countUnits(L), done = cu.n, sec = secOf(today());
  if (!L.length) return say("오늘 할 일을 한두 개만 넣어 볼까? 작게 시작하면 돼.", "오늘 할 일이 아직 0개야. 한 개부터 넣으면 돼.");
  if (done === cu.all) return say(`오늘 할 일 다 했어! 순공 ${hm(sec)}, 정말 대단해.`, `${cu.all}개 중 ${done}개를 다 했어. 오늘 순공은 ${hm(sec)}이야.`);
  if (cu.all > 12) return say("오늘 할 일이 좀 많은데? 꼭 할 것만 남겨 보자.", `할 일이 ${cu.all}개야. 하루에 끝내기엔 많아서, 꼭 할 것만 남기자.`);
  const wp = L.find(p => p.s === w && !p.done);
  if (wp){ const n = daysSince(w); return say(`${w}를 맨 앞에 뒀어. 조금만 같이 해 보자.`, n >= 2 ? `${w}는 ${n}일째 0분이야. 오늘은 ${w}부터 하자.` : `가장 약한 과목이 ${w}야. ${w}부터 하면 돼.`); }
  if (w && !L.some(p => p.s === w)) return say(`오늘은 ${w}가 없네. 작게 하나만 넣어 볼까?`, `오늘 계획에 ${w}가 없어. 하나 넣으면 돼.`);
  if (!done){ const f = L.find(p => !p.done); return say(`${f.s}부터 시작해 볼까? 옆의 타이머 단추를 눌러 봐.`, `아직 0개야. ${f.s}부터 타이머를 켜고 시작하자.`); }
  return say(`벌써 ${done}개 했어! 남은 것도 하나씩 가 보자.`, `${cu.all}개 중 ${done}개 했어. ${cu.all - done}개 남았어.`);
}

/* 📅 시험 D-day: 설정에 넣은 시험 중 오늘부터 가장 가까운 것 */
function nextExam(){ const t = today(); return [...D.exams].filter(x => x.d >= t).sort((a, b) => a.d < b.d ? -1 : 1)[0]; }
const dLeft = d => Math.round((new Date(d + "T00:00") - new Date(today() + "T00:00")) / 864e5);
function ddayTag(){ const x = nextExam(); if (!x) return ""; const n = dLeft(x.d); return ` <span class="dday">${esc(x.n)} ${n ? "D-" + n : "D-day"}</span>`; }
/* 고치기: 카드 안에서 바로 이름 · 세부 계획을 고쳐요. 커서는 세부 계획 칸 맨 끝 (새 줄을 바로 쓰게) */
function focusDet(){ const el = $("eDet"); if (!el) return; el.focus(); const n = el.value.length; el.setSelectionRange(n, n); el.scrollIntoView({ block:"center", behavior:"smooth" }); }
function inlineEdit(p){
  const dr = S.draft && S.draft.id === p.id ? S.draft : { name:p.s, det:p.det.join("\n") };
  return `<div class="ied">
    <input id="eName" value="${esc(dr.name)}" maxlength="16" aria-label="이름" placeholder="과목 이름 (예: 수학)">

    <div class="ied-b"><button type="button" class="link del" data-act="eCancel">취소</button><button type="button" class="link" data-act="eSave" data-v="${p.id}">저장</button></div></div>`;
}

/* ===================== 달력 (월 · 주) ===================== */
const lvOf = h => !h ? 0 : h < D.th[0] ? 1 : h < D.th[1] ? 2 : h < D.th[2] ? 3 : 4;
/* 📊 지난 7일 돌아보기 (오늘 포함 7일): 순공 합 · 공부한 날 · 가장 많이 한 것 · 체크한 할 일 */
function weekStats(end = new Date()){
  let sec = 0, days = 0, by = {}, done = 0, all = 0;
  for (let i = 0; i < 7; i++){ const d = new Date(end); d.setDate(d.getDate() - i); const k = dk(d), s1 = secOf(k); sec += s1; if (s1 >= 60) days++;
    for (const [n, v] of Object.entries(D.log[k] || {})) by[n] = (by[n] || 0) + v;
    const cu = countUnits(D.plans[k] || []); all += cu.all; done += cu.n; }
  const top = Object.entries(by).sort((a, b) => b[1] - a[1])[0];
  return { sec, days, top: top ? top[0] : "", done, all };
}
/* 📈 공부 돌아보기 (자습 습관 분석, 2026-11-15)
   한 주(월~일)의 순공 · 공부한 날 · 할 일 체크 · 요일별 막대 · 지난주와 비교 · 연속 공부 · 한 번에 집중한 시간 · 주로 공부한 때
   타이머를 끝낼 때마다 D.sess 에 { d:날짜, h:시작 시각(시), m:분 }을 남겨요 (최근 500개). 쌤 한마디는 규칙으로 (F = 다정하게, T = 사실대로) */
function habit(mon){
  const wk = dk(mon), tk = today(), days = [...Array(7)].map((_, i) => addDays(wk, i));
  const mins = k => Math.round(secOf(k) / 60);
  const cur = days.map(k => k > tk ? null : mins(k)), sum = cur.reduce((a, b) => a + (b || 0), 0);
  const psum = [...Array(7)].reduce((a, _, i) => a + mins(addDays(wk, i - 7)), 0);
  const past = cur.filter(v => v !== null), studied = past.filter(v => v >= 1).length;
  const best = cur.reduce((bi, v, i) => (v || 0) > (cur[bi] || 0) ? i : bi, 0);
  let done = 0, all = 0; days.forEach(k => { if (k <= tk){ const c = countUnits(D.plans[k] || []); done += c.n; all += c.all; } });
  const ss = (D.sess || []).filter(x => x.d >= wk && x.d <= days[6]);
  const slots = [["아침", 5, 12], ["오후", 12, 18], ["저녁", 18, 22], ["밤", 22, 29]].map(([n, a, b]) => [n, ss.filter(x => { const h = x.h < 5 ? x.h + 24 : x.h; return h >= a && h < b; }).reduce((s, x) => s + x.m, 0)]);
  const top = slots.slice().sort((a, b) => b[1] - a[1])[0];
  const avg = ss.length ? Math.round(ss.reduce((s, x) => s + x.m, 0) / ss.length) : 0;
  let streak = 0; for (let i = mins(tk) ? 0 : 1; i < 90; i++){ if (mins(addDays(tk, -i)) >= 1) streak++; else break; }
  const isEnd = k => [0, 6].includes(new Date(k + "T00:00").getDay());   // 토 · 일 (최근 7일로 볼 때도 날짜로 따져요)
  const weekday = days.reduce((a, k, i) => a + (isEnd(k) ? 0 : cur[i] || 0), 0), weekend = days.reduce((a, k, i) => a + (isEnd(k) ? cur[i] || 0 : 0), 0);
  return { wk, days, cur, sum, psum, studied, nPast:past.length, best, done, all, top:top[1] ? top[0] : "", night:slots[3][1], avg, sessN:ss.length, streak, weekday, weekend, endPast:days[6] <= tk };
}
function habitTips(h){
  const T = D.mode === "t", L = [];
  if (h.psum && (h.sum || h.endPast)){ const r = Math.round((h.sum - h.psum) / h.psum * 100);
    L.push(r >= 0 ? (T ? `지난주보다 순공이 ${r}% 늘었어.` : `지난주보다 ${r}% 더 공부했어! 멋져.`) : (T ? `지난주보다 순공이 ${-r}% 줄었어. 하루 20분만 더하면 따라잡아.` : `지난주보다 조금 줄었어. 괜찮아, 하루 20분만 더해 보자.`)); }
  if (h.nPast >= 3){
    if (h.studied >= Math.min(5, h.nPast)) L.push(T ? `${h.nPast}일 중 ${h.studied}일 공부했어. 매일 하는 습관이 잡혀 가고 있어.` : `거의 매일 공부했어! 꾸준함이 제일 큰 힘이야.`);
    else if (h.studied <= Math.floor(h.nPast / 2)) L.push(T ? `${h.nPast}일 중 ${h.studied}일만 공부했어. 쉬는 날도 10분짜리 할 일 하나면 돼.` : `쉬는 날이 좀 있었네. 바쁜 날은 10분짜리 할 일 하나만 해 보자.`);
  }
  if (h.sessN >= 2){
    if (h.avg < 15) L.push(T ? `한 번에 평균 ${h.avg}분 집중했어. 25분 하고 5분 쉬는 걸로 늘려 보자.` : `한 번에 ${h.avg}분씩 했어. 다음엔 25분 버티고 5분 쉬어 볼까?`);
    else if (h.avg > 70) L.push(T ? `한 번에 평균 ${h.avg}분이야. 50분마다 10분 쉬면 덜 지쳐.` : `한 번에 ${h.avg}분이나 집중했어! 중간에 물 마시고 쉬어 가자.`);
  }
  if (h.night >= 60 && h.night >= h.sum * 0.4) L.push(T ? `밤 10시 넘어 한 공부가 ${hm(h.night * 60)}이야. 잠이 줄면 다음 날 집중이 떨어져.` : `밤늦게 공부를 많이 했네. 잠은 꼭 챙기자 🌙`);
  if (h.endPast && h.weekday >= 60 && h.weekend === 0) L.push(T ? `주말 순공이 0분이야. 주말에 30분씩만 해도 한 주가 달라져.` : `주말엔 푹 쉬었네. 다음 주말엔 30분만 해 볼까?`);
  if (h.all >= 4){ const p = Math.round(h.done / h.all * 100);
    if (p < 50) L.push(T ? `할 일 ${h.all}개 중 ${h.done}개(${p}%)를 했어. 계획을 더 작게 나누면 체크가 늘어.` : `계획이 조금 많았나 봐. 할 일을 더 작게 나눠 보자.`);
    else if (p >= 80) L.push(T ? `할 일 ${p}%를 끝냈어. 계획과 실천이 잘 맞고 있어.` : `계획한 걸 거의 다 해냈어! 정말 대단해 🎉`); }
  if (!L.length) L.push(h.sum ? (T ? `이번 주 순공은 ${hm(h.sum * 60)}이야.` : "이번 주도 차곡차곡 쌓고 있어!") : (T ? "아직 이번 주 순공이 없어. 타이머로 10분부터 재 보자." : "이번 주 첫 순공을 재 볼까? 10분이면 충분해!"));
  return L.slice(0, 3);
}
/* 처음 일주일은 월~일(이번 주), 쓴 지 일주일이 넘으면 '최근 7일'(오늘까지)로 보여 줘요 */
function rolling(){ const ks = Object.keys(D.log).filter(k => secOf(k) > 0).sort(); return !!ks.length && ks[0] <= addDays(today(), -6); }
function nowCard(){ return rolling() ? habitCard(new Date(addDays(today(), -6) + "T00:00"), "최근 7일 공부 돌아보기") : habitCard(weekStart(new Date()), "이번 주 공부 돌아보기"); }
function habitCard(mon, title){
  const h = habit(mon), mx = Math.max(30, ...h.cur.map(v => v || 0)), e = addDays(h.wk, 6);
  const bars = h.cur.map((v, i) => `<div class="hb${v === null ? " fut" : ""}${i === h.best && v ? " top" : ""}"><span class="hv">${v ? (v >= 60 ? Math.floor(v / 60) + "h" + (v % 60 ? v % 60 : "") : v + "m") : ""}</span><i style="height:${v ? Math.max(6, v / mx * 100) : 2}%"></i><small>${WD[new Date(h.days[i] + "T00:00").getDay()]}</small></div>`).join("");
  return `<div class="habit">
    <div class="hh"><b>${esc(title)}</b><span class="sub">${+h.wk.slice(5, 7)}/${+h.wk.slice(8)} ~ ${+e.slice(5, 7)}/${+e.slice(8)}</span></div>
    <div class="wk"><div><b>${hm(h.sum * 60)}</b><small>순공 합계</small></div><div><b>${h.studied}/${h.nPast}일</b><small>공부한 날</small></div><div><b>${h.all ? Math.round(h.done / h.all * 100) + "%" : "-"}</b><small>할 일 체크</small></div></div>
    <div class="hbars" role="img" aria-label="요일별 순공 시간">${bars}</div>
    <div class="hrow"><span>🔥 연속 ${h.streak}일</span>${h.sessN ? `<span>⏱ 한 번에 평균 ${h.avg}분</span>` : ""}${h.top ? `<span>🕘 주로 ${h.top}에</span>` : ""}${h.psum ? `<span>지난주 ${hm(h.psum * 60)}</span>` : ""}</div>
    <div class="say htips">${habitTips(h).map(t => `<p>${esc(t)}</p>`).join("")}</div>
  </div>`;
}
function weekCard(w){
  return `<div class="week">${say(w.days >= 5 ? `일주일에 ${w.days}일이나 공부했어! 정말 멋져.` : w.days ? `이번 주 ${w.days}일 공부했어. 다음 주엔 하루만 더 해 보자!` : "이번 주는 쉬어 갔네. 내일 10분부터 다시 해 보자!", `지난 7일 순공은 ${hm(w.sec)}, 공부한 날은 ${w.days}일이야. 할 일은 ${w.all}개 중 ${w.done}개 했어.`)}
    <div class="wk"><div><b>${hm(w.sec)}</b><small>순공 합계</small></div><div><b>${w.days}일</b><small>공부한 날</small></div><div><b>${w.all ? Math.round(w.done / w.all * 100) : 0}%</b><small>할 일 체크</small></div></div></div>`;
}
/* 그날 할 일 목록 (달력에서): 줄마다 체크 · ✕ 지우기 */
function dayTasks(k){

/* 📷 성적표 사진 읽기 (아이폰 앱): 휴대폰 안(애플 Vision)에서 글자를 읽어 와서, 과목 줄마다 등급을 찾아요. 사진은 저장하지 않아요
   lines = [{ t:글자, x, y, w, h }] (0~1, 위가 0). 같은 높이의 글자를 한 줄로 묶어요
   내신(나이스 성적 통지표): 과목 줄에서 성취도(A~E) 뒤에 나오는 1~5 숫자 = 석차등급
   모의고사(전국연합 성적표): 과목 줄에서 백분위(소수) 뒤에 나오는 1~9 숫자 = 등급, 없으면 줄의 마지막 1~9 숫자 */
const ALIAS = { "사회":["사회","통합사회"], "과학":["과학","통합과학"], "국어":["국어","공통국어","국 어"], "수학":["수학","공통수학","수 학"], "영어":["영어","공통영어","영 어"], "한국사":["한국사"], "통합사회":["통합사회","사회"], "통합과학":["통합과학","과학"] };
function parseReport(lines){
  const all = lines.map(l => l.t).join(" "), type = /성취도|석차등급|통지표/.test(all) ? "naesin" : "mock", MX = type === "naesin" ? 5 : 9;
  const L = [...lines].sort((a, b) => a.y - b.y), rows = [];
  for (const l of L){ const r = rows.find(r => Math.abs(r.y - l.y) < Math.max(l.h, r.h) * .6); if (r){ r.items.push(l); r.y = (r.y + l.y) / 2; } else rows.push({ y:l.y, h:l.h, items:[l] }); }
  const g = {};
  for (const sb of D.subj.map(s => s.n)){
    const keys = ALIAS[sb] || [sb];
    for (const r of rows){
      const it = r.items.sort((a, b) => a.x - b.x), i0 = it.findIndex(x => keys.some(k => x.t.replace(/\s/g, "").startsWith(k.replace(/\s/g, ""))));
      if (i0 < 0 || g[sb]) continue;
      const toks = it.slice(i0 + 1).flatMap(x => x.t.split(/\s+/)).filter(Boolean);
      let v = 0;
      if (type === "naesin"){ const a = toks.findIndex(t => /^[A-E]$/.test(t)); if (a >= 0) for (const t of toks.slice(a + 1)){ if (/\(/.test(t)) continue; if (/^[1-5]$/.test(t)){ v = +t; break; } } }
      else { const pIdx = toks.findIndex(t => /^\d{1,3}\.\d{1,2}$/.test(t)); if (pIdx >= 0) for (const t of toks.slice(pIdx + 1)){ if (/^[1-9]$/.test(t)){ v = +t; break; } } }
      if (!v){ const ns = toks.filter(t => new RegExp(`^[1-${MX}]$`).test(t)); if (ns.length) v = +ns[ns.length - 1]; }
      if (v) g[sb] = v;
    }
  }
  return { type, g };
}

/* ===================== 🎧 공부 소리 (타이머 안 🎧 단추) =====================
   앱이 직접 만드는 소리라 인터넷도 저작권 걱정도 없어요: 빗소리 · 백색소음 · 잔잔한 파도 */
const SOUNDS = [["white","🌫 백색소음"],["wave","🌊 잔잔한 파도"],["rain","🌧 빗소리"]];
const PLAY = { k:"", on:false, ctx:null, src:null, lfo:null };
function soundStop(){ try { PLAY.src && PLAY.src.stop(); } catch (e) {} try { PLAY.lfo && PLAY.lfo.stop(); } catch (e) {} PLAY.src = PLAY.lfo = null; PLAY.on = false; PLAY.k = ""; }
function soundPlay(kind){
  soundStop();
  const C = PLAY.ctx = PLAY.ctx || new (window.AudioContext || window.webkitAudioContext)(); C.resume();
  const len = C.sampleRate * 4, buf = C.createBuffer(2, len, C.sampleRate), a = kind === "wave" ? 0.02 : 0.04;
  for (let c = 0; c < 2; c++){ const d = buf.getChannelData(c); let last = 0;
    for (let k = 0; k < len; k++){ const w = Math.random() * 2 - 1; if (kind === "white") d[k] = w * 0.25; else { last = (last + a * w) / (1 + a); d[k] = last * (kind === "wave" ? 3.5 : 3.2); } } }
  const src = C.createBufferSource(); src.buffer = buf; src.loop = true;
  const g = C.createGain(); g.gain.value = kind === "rain" ? 0.9 : kind === "wave" ? 0.6 : 0.35;
  if (kind === "white") src.connect(g);
  else { const f = C.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = kind === "wave" ? 700 : 1400; src.connect(f).connect(g); }
  g.connect(C.destination);
  if (kind === "wave"){ const o = C.createOscillator(), og = C.createGain(); o.frequency.value = 0.12; og.gain.value = 0.35; o.connect(og).connect(g.gain); o.start(); PLAY.lfo = o; }   // 파도처럼 천천히 커졌다 작아졌다
  src.start(); PLAY.src = src; PLAY.on = true; PLAY.k = kind;
}

/* ===================== 📷 사진 → 할 일 =====================
   일정표 · 칠판 공지 · 선생님 공지 캡처 · 가정통신문을 찍거나 불러오면 앱 안 사진첩(IndexedDB first-pics)에 줄여서 저장해요
   글자는 휴대폰 안에서 읽어요: 아이폰 앱 = 애플 Vision(NAT.ocrImage), 웹 = Tesseract.js 한국어 (사진은 밖으로 안 보내요)
   날짜 · 할 일 찾기는 규칙으로: '11/20' · '11월 20일' · '다음 주 금요일' · '~까지' · '제출' · '준비물' · '수행평가' · '시험' 등이 있는 줄
   바로 넣지 않고 후보를 보여 준 뒤, 학생이 체크한 것만 넣어요 (날짜 · 내용 고치기 가능) */
const PIC_CATS = ["공지","가정통신문","시간표","기타"];
let pdb = null;
const picDB = () => pdb = pdb || new Promise((ok, no) => { const r = indexedDB.open("first-pics", 1); r.onupgradeneeded = () => r.result.createObjectStore("p"); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
const picTx = (mode, fn) => picDB().then(db => new Promise((ok, no) => { const tx = db.transaction("p", mode), r = fn(tx.objectStore("p")); tx.oncomplete = () => ok(r && r.result); tx.onerror = () => no(tx.error); }));
const picPut = (id, blob) => picTx("readwrite", st => st.put(blob, id));
const picGet = id => picTx("readonly", st => st.get(id));
const picDel = id => { if (PURL[id]){ URL.revokeObjectURL(PURL[id]); delete PURL[id]; } return picTx("readwrite", st => st.delete(id)).catch(() => {}); };
const PURL = {};
async function picUrl(id){ if (PURL[id]) return PURL[id]; try { const b = await picGet(id); return b ? (PURL[id] = URL.createObjectURL(b)) : ""; } catch (e) { return ""; } }
function picHydrate(){ document.querySelectorAll("img[data-pic]").forEach(async im => { if (im.getAttribute("src")) return; const u = await picUrl(im.dataset.pic); if (u) im.src = u; else im.closest(".pt")?.classList.add("gone"); }); }
function picCleanup(){   // '30일 지난 사진 자동 정리'를 켜면 앱을 열 때마다 정리해요
  if (!D.picClean) return; const lim = Date.now() - 30 * 864e5, old = D.pics.filter(p => p.at < lim); if (!old.length) return;
  D.pics = D.pics.filter(p => p.at >= lim); old.forEach(p => picDel(p.id)); save();
}
/* 사진 줄이기: 긴 쪽 1600px · JPEG (글자는 읽히고 용량은 작게) */
async function picShrink(file, max = 1600){
  const bm = await createImageBitmap(file).catch(() => new Promise((ok, no) => { const u = URL.createObjectURL(file), im = new Image(); im.onload = () => ok(im); im.onerror = () => no(new Error("img")); im.src = u; }));
  const w = bm.naturalWidth || bm.width, h = bm.naturalHeight || bm.height, k = Math.min(1, max / Math.max(w, h));
  const cv = document.createElement("canvas"); cv.width = Math.round(w * k); cv.height = Math.round(h * k); cv.getContext("2d").drawImage(bm, 0, 0, cv.width, cv.height); bm.close?.();
  return new Promise((ok, no) => cv.toBlob(b => b ? ok(b) : no(new Error("blob")), "image/jpeg", 0.8));
}
const b64 = blob => new Promise(ok => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.readAsDataURL(blob); });
/* Vision 글자 조각을 같은 높이끼리 한 줄로 묶어요 (위가 0) */
function rowsOf(lines){
  const rows = [];
  for (const l of [...lines].sort((a, b) => a.y - b.y)){ const r = rows.find(r => Math.abs(r.y - l.y) < Math.max(l.h, r.h) * .6); if (r) r.items.push(l); else rows.push({ y:l.y, h:l.h, items:[l] }); }
  return rows.map(r => r.items.sort((a, b) => a.x - b.x).map(x => x.t).join(" "));
}
let tessP = null;
async function ocr(blob){
  if (NAT){ try { const r = await NAT.ocrImage({ data:await b64(blob) }); if (r && r.lines) return rowsOf(r.lines); } catch (e) {} }   // 예전 앱(ocrImage 없음)이면 아래 웹 방식으로
  if (!window.Tesseract) await (tessP = tessP || new Promise((ok, no) => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"; s.onload = ok; s.onerror = () => { tessP = null; no(new Error("tess")); }; document.head.appendChild(s); }));
  const w = await Tesseract.createWorker("kor+eng");
  try { const r = await w.recognize(blob); return String(r.data.text || "").split("\n"); } finally { w.terminate(); }
}
/* 날짜 찾기 → "2026-11-20" (없으면 "") */
const WDK = "일월화수목금토";
function findDate(s, rel = true){   // rel=false 면 '오늘 · 내일 · 모레'는 날짜로 안 봐요
  const t0 = new Date(); t0.setHours(0, 0, 0, 0); const Y = t0.getFullYear(), off = n => { const x = new Date(t0); x.setDate(x.getDate() + n); return dk(x); };
  const fix = (y, m, d, given) => { if (m < 1 || m > 12 || d < 1 || d > 31) return ""; const x = new Date(y, m - 1, d); if (x.getDate() !== d) return ""; if (!given && x - t0 < -60 * 864e5) x.setFullYear(y + 1); return dk(x); };   // 두 달 넘게 지난 날짜면 내년
  let m;
  if ((m = s.match(/(20\d\d)\s*[.\-/년]\s*(\d{1,2})\s*[.\-/월]\s*(\d{1,2})/))) return fix(+m[1], +m[2], +m[3], true);
  if ((m = s.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/))) return fix(Y, +m[1], +m[2]);
  if ((m = s.match(/(?:^|[^\d.])(\d{1,2})\s*[/.]\s*(\d{1,2})(?![\d.])/))) return fix(Y, +m[1], +m[2]);
  if (rel && /모레/.test(s)) return off(2);
  if (rel && /내일/.test(s)) return off(1);
  if ((m = s.match(/(다다음|다음|이번)\s*주\s*([월화수목금토일])/))){ const mon = weekStart(t0), w = (WDK.indexOf(m[2]) + 6) % 7, add = m[1] === "이번" ? 0 : m[1] === "다음" ? 7 : 14; return off(Math.round((mon - t0) / 864e5) + add + w); }
  if ((m = s.match(/([월화수목금토일])요일/))) return off((WDK.indexOf(m[1]) - t0.getDay() + 7) % 7);
  if (rel && /오늘/.test(s)) return off(0);
  return "";
}
const KW = /(까지|제출|준비물|수행평가|시험|마감|발표|숙제|과제|신청|회신|가져오|챙기|챙겨|지참|평가|퀴즈|단어|확인)/;
const EXAM = /(시험|수행평가|평가|퀴즈|모의고사)/;
const DATE_RE = /(20\d\d\s*[.\-/년]\s*\d{1,2}\s*[.\-/월]\s*\d{1,2}\s*일?|\d{1,2}\s*월\s*\d{1,2}\s*일|(?:^|[^\d.])\d{1,2}\s*[/.]\s*\d{1,2}(?![\d.]))\s*(\(\s*[월화수목금토일]\s*\))?/g;
const cleanTask = s => s.replace(DATE_RE, " ").replace(/(다다음|다음|이번)\s*주\s*[월화수목금토일](요일)?|[월화수목금토일]요일|오늘|내일|모레/g, " ").replace(/^\s*(?:[\-•·*▶▷◦○●□■◆◇※☞✔✓]+|\d{1,2}[.)])\s*/, "").replace(/^[\s,:~\-]*(까지)?[\s,:~\-]*/, "").replace(/[\s,:~\-]+$/, "").replace(/\s+/g, " ").trim();
function findTasks(lines){
  const out = [], seen = new Set(), L = lines.map(x => String(x).replace(/\s+/g, " ").trim()).filter(x => x.length > 1);
  for (let i = 0; i < L.length; i++){
    const t = L[i], flat = t.replace(/\s/g, ""), kw = KW.test(flat), d = findDate(t, kw);   // '오늘 점심…'처럼 할 일 낱말이 없으면 '오늘 · 내일'만으로는 안 뽑아요
    if (!d && !kw) continue;
    let text = cleanTask(t);
    if (text.replace(/[\s\d()~.\-:]/g, "").length < 2 && L[i + 1] && !findDate(L[i + 1])){ text = cleanTask(L[i + 1]); i++; }   // 날짜만 있는 줄이면 다음 줄이 내용
    if (text.replace(/\s/g, "").length < 2 || seen.has(text)) continue; seen.add(text);
    out.push({ t:text.slice(0, 40), d, exam:EXAM.test(flat + text), ex:true, on:true });
  }
  return out.slice(0, 15);
}
function guessCat(lines, n){
  const f = lines.join(" ").replace(/\s/g, "");
  if (/가정통신문|학부모|보호자|회신서/.test(f)) return "가정통신문";
  if (/시간표|\d교시/.test(f)) return "시간표";
  return n || /공지|안내|알림/.test(f) ? "공지" : "기타";
}
const subjIn = t => [...D.subj].sort((a, b) => b.n.length - a.n.length).find(s => t.includes(s.n))?.n || "학교 공지";
async function picAdd(file){
  if (!file || (file.type && !/^image\//.test(file.type))){ toast("사진 파일만 넣을 수 있어요"); return; }
  let blob; try { blob = await picShrink(file); } catch (e) { toast("사진을 열 수 없어요"); return; }
  const id = uid(), rec = { id, at:Date.now(), cat:"기타", txt:"" };
  try { await picPut(id, blob); } catch (e) { toast("사진을 저장하지 못했어요. 휴대폰 저장 공간을 확인해 주세요"); return; }
  D.pics.unshift(rec); S.reading = id; save(); render();
  let lines = []; try { lines = await ocr(blob); } catch (e) { lines = []; }
  S.reading = ""; rec.txt = lines.join("\n").slice(0, 1500);
  const c = findTasks(lines); rec.cat = guessCat(lines, c.length); save(); render();
  if (c.length) openCands(id, c);
  else toast(lines.join("").trim() ? "할 일을 찾지 못했어요. 사진첩에 저장했어요" : "글자를 읽지 못했어요. 사진첩에 저장했어요");
}

/* 과목 이름을 바꾸면: 오늘 · 앞으로의 할 일, 반복 할 일, 성적, 약한 과목도 같이 바꿔요 */
function renameSubj(old, n, alsoPlans = true){
  const s = D.subj.find(x => x.n === old); if (s) s.n = n;
  if (alsoPlans) for (const k in D.plans) if (k >= today()) D.plans[k].forEach(p => { if (p.s === old) p.s = n; });
  D.reps.forEach(r => { if (r.s === old) r.s = n; });
  D.grades.forEach(g => { if (g.g[old] != null && g.g[n] == null){ g.g[n] = g.g[old]; delete g.g[old]; } });
  if (D.weak === old) D.weak = n;
}

async function backupOut(){
  const json = JSON.stringify({ app:"first", v:1, at:new Date().toISOString(), data:D }), name = `먼저플래너-백업-${today()}.json`;
  if (NAT){ try { await NAT.shareFile({ name, text:json }); return; } catch (e) {} }

}

  const sec = tsec(), h = Math.floor(sec / 3600), mm = `${h ? h + ":" + pad(Math.floor(sec / 60) % 60) : Math.floor(sec / 60)}:${pad(Math.floor(sec % 60))}`;

/* 끝내기: 자정을 넘긴 시간은 날짜별로 나눠서 넣어요 (쉬기 전에 잰 시간은 처음 시작한 날로) */
function addLog(day, subj, sec){ if (sec < 1) return; D.log[day] = D.log[day] || {}; D.log[day][subj] = (D.log[day][subj] || 0) + Math.round(sec); }
function endTimer(keep){
  const t = D.timer; if (!t) return;
  const sec = Math.round(tsec());
  if (keep && sec >= 30){
    const tk0 = today(), before = secOf(tk0), best = bestDay(tk0);   // 끝내기 전 값 (특별한 순간 고르기)
    addLog(t.d0 || today(), t.s, t.acc);
    if (t.start){ let a = t.start; const now = Date.now();
      while (true){ const m = new Date(a); m.setHours(24, 0, 0, 0); if (m.getTime() >= now) break; addLog(dk(new Date(a)), t.s, (m - a) / 1000); a = m.getTime(); }
      addLog(dk(new Date(a)), t.s, (now - a) / 1000); }
    (D.sess = D.sess || []).push({ d:t.d0 || today(), h:new Date(Date.now() - sec * 1000).getHours(), m:Math.round(sec / 60) }); D.sess = D.sess.slice(-500);   // 📈 공부 돌아보기용
    toast(`순공 ${hm(sec)} 기록했어요`); haptic("ok");
    const after = secOf(tk0), st = streakTo(tk0), cel = (D.cel = D.cel || {})[tk0] = D.cel[tk0] || [], once = k => cel.includes(k) ? false : (cel.push(k), true);
    for (const x in D.cel) if (x < addDays(tk0, -7)) delete D.cel[x];
    const T = D.mode === "t";
    if (before <= best && after > best && best >= 1800 && once("best")) setTimeout(() => moment(T ? `오늘 순공 ${hm(after)}, 지금까지 하루 최고 기록이야.` : `오늘 ${hm(after)}! 내 하루 최고 기록이야`, "🏆 순공 최고 기록"), 400);
    else if (before < 60 && [7, 14, 30, 50, 100].includes(st) && once("streak")) setTimeout(() => moment(T ? `${st}일 연속으로 공부했어.` : `${st}일 연속 공부! 꾸준함이 최고야`, `🔥 ${st}일 연속`), 400);
    else if (sec >= 3600 && once("hour")) setTimeout(() => moment(T ? `한 번에 ${hm(sec)} 집중했어.` : `한 번에 ${hm(sec)}이나 집중했어! 대단해`, "⏱ 1시간 집중"), 400);
    else setTimeout(() => moment(T ? `순공 ${hm(sec)} 기록했어. 오늘 순공은 ${hm(after)}이야.` : `${hm(sec)} 집중했어! 수고했어, 잠깐 쉬자 ☕`), 400); }
  D.timer = null; save();
}

/* ===================== 🐰 친구들 (화면 여기저기에) =====================
   꾸미기에서 고른 친구들(D.crew)이 화면 위에 떠 있어요. 친구가 버튼을 가리지 않게, 친구를 톡 누르면 그 아래 버튼이 눌려요
   - 움직임 D.move: still 가만히 · breath 숨만 쉬기 · roam 돌아다니기
   - 꾹 누른 채 끌면 옮겨요 (자리는 D.spots 에 기억, [다시 흩어 놓기]로 처음처럼)
   - 상황 따라(D.react): 다 하면 가운데로 나와 축하(moment) · 3분 넘게 가만히 있으면 졸기 · 시험 사흘 전부터 머리띠
   - 가끔 말 걸기(D.pop): 2~4분마다 한 친구가 한마디 */
const CREW = { els:{}, idle:Date.now(), sleep:false, drag:null, eat:0 };
const crewRnd = () => { const r = Math.random(); return { x:r < .4 ? .07 + Math.random() * .15 : r < .8 ? .78 + Math.random() * .15 : .25 + Math.random() * .5, y:.24 + Math.random() * .64 }; };   // 글씨를 덜 가리게 대부분 양쪽 가장자리에
function crewPlace(el, p){ el._p = p; el.style.left = (p.x * 100) + "%"; el.style.top = (p.y * 100) + "%"; el.classList.toggle("rt", p.x > .6); }
function crewSync(){
  const box = $("crew"); if (!box) return;
  const ids = D.crew.filter(id => !id.startsWith("m:") || D.mine.some(m => "m:" + m.id === id)).slice(0, 9);
  for (const id in CREW.els) if (!ids.includes(id)){ CREW.els[id].remove(); delete CREW.els[id]; }
  ids.forEach(id => { if (CREW.els[id]) return;
    const el = document.createElement("div"); el.className = "mate"; el.dataset.id = id; el.style.setProperty("--bt", BAND[id] || "6%");
    el.innerHTML = `<p class="bub"></p><span class="fl"><span class="ch">${charArt(id)}</span><i class="band"></i></span><i class="zz">💤</i>`;
    box.appendChild(el); CREW.els[id] = el; crewPlace(el, D.spots[id] || crewRnd()); });
  const x = nextExam();
  box.className = `crew mv-${D.move}${D.react !== false && x && dLeft(x.d) <= 3 ? " exam" : ""}${CREW.sleep ? " sleep" : ""}`;
}
function mateSay(text, id){
  if (!text || $("app").classList.contains("timer-open")) return;
  const els = Object.values(CREW.els); if (!els.length) return;

async function appCreds(kind){
  const P = FA(); if (!P) throw new Error("앱을 최신 버전으로 업데이트해 주세요");
  if (kind === "kakao"){
    const r = await P.signInWithOpenIdConnect({ providerId:KAKAO, skipNativeAuth:true }), c = (r && r.credential) || {}, L = [];
    if (c.idToken) L.push({ idToken:c.idToken, ...(c.nonce ? { rawNonce:c.nonce } : {}), ...(c.accessToken ? { accessToken:c.accessToken } : {}) });
    if (c.accessToken) L.push({ accessToken:c.accessToken });
    if (!L.length) throw new Error("카카오 로그인을 하지 못했어요. 다시 눌러 주세요");
    return L.map(o => new OAuthProvider(KAKAO).credential(o));
  }
  if (kind === "apple"){
    const r = await P.signInWithApple({ skipNativeAuth:true }), c = r && r.credential;
    if (!c || !c.idToken) throw new Error("Apple 로그인을 하지 못했어요. 다시 눌러 주세요");
    return [new OAuthProvider("apple.com").credential({ idToken:c.idToken, rawNonce:c.nonce })];
  }
  const r = await P.signInWithGoogle(), c = r && r.credential;
  if (!c || !c.idToken) throw new Error("구글 로그인을 하지 못했어요. 다시 눌러 주세요");
  return [GoogleAuthProvider.credential(c.idToken, c.accessToken || null)];
}
const INAPP = /KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|FB_IAB|\bLine\/|DaumApps|everytimeApp|BAND\/|; wv\)/i.test(navigator.userAgent);
async function signIn(kind){
  gErr.textContent = "";
  if (!NATIVE && INAPP){
    if (/KAKAOTALK/i.test(navigator.userAgent)){ location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(location.href); return; }
    gErr.textContent = "이 앱 안의 브라우저에서는 로그인이 막혀요. ⋮ 메뉴에서 '다른 브라우저로 열기'를 눌러 주세요"; return;
  }
  gate.querySelectorAll(".gb").forEach(b => b.disabled = true);
  try {
    if (NATIVE){ let err; for (const c of await appCreds(kind)){ try { await signInWithCredential(auth, c); err = null; break; } catch (e){ err = e; } } if (err) throw err; }
    else await signInWithPopup(auth, kind === "kakao" ? new OAuthProvider(KAKAO) : gProv());
  } catch (e){
    const m = String((e && (e.code || e.message)) || "");
    gErr.textContent = /cancel|popup-closed|1001|취소/i.test(m) ? "" : /account-exists/.test(m) ? "이미 다른 방법(구글 · 카카오 · Apple)으로 가입한 이메일이에요. 처음 가입한 방법으로 로그인해 주세요" : /network/.test(m) ? "인터넷 연결을 확인해 주세요" : (e && e.message && !/^Firebase/.test(e.message) ? e.message : "로그인하지 못했어요. 다시 눌러 주세요");
  } finally { gate.querySelectorAll(".gb").forEach(b => b.disabled = false); }
}
el("gApple").onclick = () => signIn("apple"); el("gGoogle").onclick = () => signIn("google"); el("gKakao").onclick = () => signIn("kakao");

/* ---------- 서버 저장 ---------- */
const userRef = () => doc(db, "first_users", user.uid), statRef = () => doc(db, "first_stat", user.uid);
async function pull(){
  let snap; try { snap = await getDoc(userRef()); } catch (e) { return; }   // 인터넷이 막혀도 이 기기 기록으로 계속 써요
  known = snap.exists();
  if (known){
    const s = snap.data();
    if (s.d && (s.at || 0) > (D.at || 0)){   // 서버가 더 최근 → 서버 기록으로 바꾸고 한 번 다시 열어요
      try { localStorage.setItem(KEY, s.d); } catch (e) {}
      if (!sessionStorage.getItem("first-pulled")){ sessionStorage.setItem("first-pulled", "1"); location.reload(); return; }
    }
  }
  push(true);
}
function push(now){ if (!user) return; clearTimeout(pushT); pushT = setTimeout(doPush, now ? 0 : 3000); }
async function doPush(){
  if (!user) return;
  let d = JSON.stringify(D); if (d.length > 900000) d = JSON.stringify({ ...D, mine:[] });   // 너무 크면 내 캐릭터 그림은 빼고 (서버 한 칸 1MB)
  try {
    await setDoc(userRef(), { d, at:D.at || Date.now(), v:1 });
    await setDoc(statRef(), { lastDay:dkey(new Date()), plat:IOS ? "ios" : NATIVE ? "app" : "web", kinds:(user.providerData || []).map(p => p.providerId).slice(0, 4), ...(known ? {} : { created:serverTimestamp() }) }, { merge:true });
    known = true;
  } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") push(true); });

/* ---------- 계정 (⚙︎ 설정 › 계정) ---------- */
function who(){
  if (!user) return "";
  const k = (user.providerData[0] || {}).providerId || "", n = k === "apple.com" ? "Apple" : k === KAKAO ? "카카오" : "구글";
  const em = user.email || (user.providerData.find(p => p.email) || {}).email || "";
  return `${n} 계정${em ? " · " + em.replace(/^(.{2}).*(@.*)$/, "$1***$2") : ""}`;
}
async function out(){ await doPush(); try { localStorage.removeItem(KEY); localStorage.removeItem(SEEN); } catch (e) {} await signOut(auth); location.reload(); }   // 로그아웃: 서버에 올리고 이 기기 기록은 지워요 (다시 로그인하면 돌아와요)
async function quit(){
  const u = auth.currentUser; if (!u) return;
  try { await deleteDoc(userRef()); await deleteDoc(statRef()); } catch (e) { toast?.("지우지 못했어요. 인터넷을 확인해 주세요"); return; }
  try { window.Capacitor?.Plugins?.First?.backup({ json:"{}" }); } catch (e) {}   // 아이클라우드 백업도 비워요
  try { localStorage.removeItem(KEY); localStorage.removeItem(SEEN); indexedDB.deleteDatabase("first-pics"); } catch (e) {}
  try { await deleteUser(u); alert?.("모두 지웠어요. 그동안 써 줘서 고마워요."); }
  catch (e){ await signOut(auth); }   // 오래전에 로그인했으면 로그인 정보는 다시 로그인한 뒤에 지워져요 (기록은 이미 지웠어요)
  location.reload();
}
window.FB = { push:() => push(false), who, out, quit };

/* ---------- 로그인 상태 ---------- */
if (!ADMIN) onAuthStateChanged(auth, async u => {
  user = u;
  if (!u){ try { localStorage.removeItem(SEEN); } catch (e) {} gate.hidden = false; return; }
  try { localStorage.setItem(SEEN, "1"); } catch (e) {}
  gate.hidden = true; await pull(); window.render?.();
});

/* ===================== 📊 관리자 화면 (#admin): 가입 · 사용 숫자만 ===================== */
if (ADMIN){
  gate.hidden = true;
  const box = document.createElement("div"); box.className = "gate"; box.innerHTML = `<div class="gbox" id="admBox"><h1>먼저 플래너 · 관리자</h1><p>불러오는 중…</p></div>`; document.body.appendChild(box);
  const B = el("admBox");
  const cnt = async q => { try { return (await getCountFromServer(q)).data().count; } catch (e) { return "—"; } };
  onAuthStateChanged(auth, async u => {
    if (!u || !ADMIN_EMAILS.includes(String(u.email || "").toLowerCase())){
      if (u) await signOut(auth);   // 관리자가 아닌 계정은 바로 로그아웃 (공용 로그인에 남지 않게)
      B.innerHTML = `<h1>먼저 플래너 · 관리자</h1><p>관리자 구글 계정으로 로그인해 주세요</p><div class="gbtns"><button type="button" class="gb google" id="admIn"><b>G</b> 구글 계정으로 로그인</button></div><p class="gerr" id="admErr"></p>`;
      el("admIn").onclick = async () => { const p = new GoogleAuthProvider(); p.setCustomParameters({ prompt:"select_account" }); try { await signInWithPopup(auth, p); } catch (e) { el("admErr").textContent = "로그인하지 못했어요"; } };
      return;
    }
    const C = collection(db, "first_stat"), t0 = new Date(); t0.setHours(0, 0, 0, 0);
    const ago = n => { const d = new Date(); d.setDate(d.getDate() - n); return dkey(d); };
    const [all, today, week, d1, ios] = await Promise.all([cnt(C), cnt(query(C, where("created", ">=", Timestamp.fromDate(t0)))), cnt(query(C, where("lastDay", ">=", ago(6)))), cnt(query(C, where("lastDay", "==", dkey(new Date())))), cnt(query(C, where("plat", "==", "ios")))]);
    const tile = (n, t) => `<div style="background:#fff;border-radius:16px;padding:14px 10px;box-shadow:0 2px 8px rgba(0,0,0,.06)"><b style="display:block;font-size:30px;color:#FF5C84;font-weight:400;font-variant-numeric:tabular-nums">${n}</b><span style="font:13px var(--sys);color:#6B5E66">${t}</span></div>`;
    B.innerHTML = `<h1>먼저 플래너 · 관리자</h1><p>가입 · 사용 숫자만 보여요 (학생 기록은 볼 수 없어요)</p>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;margin-top:12px">${tile(all, "전체 가입")}${tile(today, "오늘 가입")}${tile(d1, "오늘 쓴 사람")}${tile(week, "7일 안에 쓴 사람")}${tile(ios, "아이폰 · 아이패드 앱")}${tile(all === "—" ? "—" : all - ios, "웹 · 기타")}</div>
      <p class="gnote">설치 수는 App Store Connect › 먼저 플래너 › 앱 분석에서 봐요</p>`;
  });
}
