<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>공문 레이더 · 문쌤의 AI 연구소</title>
<meta name="description" content="받은 공문 제목을 갈래 · 주제로 나누고, 해마다 돌아오는 공문과 신청 · 제출할 일을 한눈에 보여 주는 공문 레이더">
<meta name="robots" content="noindex">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'OngleipUnz';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2406-1@1.0/Ownglyph_UNZ-Rg.woff2') format('woff2');font-display:swap;size-adjust:125%}
:root{--bg:#F6F4EF;--ink:#2F3437;--ink2:#7B8287;--line:#E4E0D8;--card:#fff;--accent:#2F3437;
  --hand:'OngleipUnz','Gowun Dodum',sans-serif;--body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button{font-family:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.wrap{max-width:1360px;margin:0 auto;padding:14px 16px 70px}
/* 머리줄 */
.top{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.8rem;padding-right:3.2rem}   /* 오른쪽 끝은 새로고침 단추 자리 */
.top h1{margin:0;font-family:var(--hand);font-weight:400;font-size:2rem;line-height:1.1}
.top h1 small{font-family:var(--body);font-size:.85rem;color:var(--ink2);margin-left:.4rem}
.top .sp{flex:1}
.btn{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:.3rem .85rem;font-size:.88rem;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
/* 숫자 칩 (대시보드) */
.kpis{display:flex;flex-wrap:wrap;gap:.5rem;margin:0 0 .8rem}
.kpi{display:flex;align-items:baseline;gap:.4rem;background:#fff;border:1px solid var(--line);border-radius:14px;padding:.45rem .85rem}
.kpi b{font-size:1.45rem;letter-spacing:-.02em}
.kpi small{color:var(--ink2);font-size:.8rem}
.trend{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;margin:-.2rem 0 .9rem;font-size:.82rem;color:var(--ink2)}
.tw{background:#fff;border:1px solid var(--line);border-radius:999px;padding:.05rem .6rem;color:var(--ink)}
.tw .up{color:#1E7B4F;font-weight:700}.tw .down{color:#B3261E;font-weight:700}
/* 거르개 칩 */
.filters{background:#fff;border:1px solid var(--line);border-radius:16px;padding:.7rem .9rem;display:grid;gap:.45rem;margin-bottom:.9rem}
.frow{display:flex;flex-wrap:wrap;gap:.3rem .4rem;align-items:center}
.frow > b{width:8.6rem;font-size:.85rem;font-weight:400;color:var(--ink2)}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:.12rem .7rem;font-size:.84rem;white-space:nowrap}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:#fff}
.chip.off{background:#F1EFEA;color:#A39E95;text-decoration:line-through;border-color:#E4E0D8}
.chip small{opacity:.75;margin-left:.2rem}
.search{border:1.5px solid var(--line);border-radius:999px;padding:.2rem .8rem;font:inherit;font-size:.86rem;min-width:13rem;background:#fff}
.note{font-size:.8rem;color:var(--ink2)}
/* 칸반 */
.kan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.7rem;align-items:start}
@media(max-width:1100px){.kan{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.kan{grid-template-columns:1fr}.frow > b{width:100%}}
.lane{background:#ECE9E2;border-radius:16px;padding:.6rem .55rem .7rem;min-height:14rem}
.lane h2{margin:0 0 .15rem;font-family:var(--hand);font-weight:400;font-size:1.4rem;display:flex;align-items:baseline;gap:.4rem}
.lane h2 small{font-family:var(--body);font-size:.8rem;color:var(--ink2);margin-left:auto}
.lane .why{font-size:.76rem;color:var(--ink2);margin:0 0 .5rem}
.lane .more{display:block;width:100%;border:1.5px dashed #CFC9BE;background:transparent;border-radius:10px;padding:.3rem;font-size:.8rem;color:var(--ink2);margin-top:.2rem}
.kc{background:#fff;border-radius:12px;padding:.55rem .6rem .5rem;margin-bottom:.45rem;box-shadow:0 1px 3px rgba(0,0,0,.06);border-left:5px solid var(--c);cursor:pointer}
.kc:hover{box-shadow:0 4px 12px rgba(0,0,0,.08)}
.kc .tt{font-size:.9rem;line-height:1.4}
.kc .cs{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.35rem;align-items:center}
.mc{display:inline-block;border-radius:999px;padding:0 .45rem;font-size:.7rem;line-height:1.55;white-space:nowrap;background:#F1EFEA;color:#5E5850}
.mc.cat{background:var(--c);color:#fff}
.mc.rep{background:#FFE8F0;color:#B23A64}
.mc.new{background:#E3F4EA;color:#1E7B4F}
.mc.d{background:transparent;color:var(--ink2);padding:0}
.star{color:#E0A800;font-size:.8rem;margin-left:auto;white-space:nowrap}
.kc .ex{display:none;margin-top:.45rem;padding-top:.45rem;border-top:1px dashed var(--line);font-size:.8rem;color:#4F565B}
.kc.open .ex{display:block}
.kc .ex .row{display:flex;gap:.4rem;margin:.15rem 0}
.kc .ex .row b{flex:none;width:4.2rem;color:var(--ink2);font-weight:400}
.kc .ex .acts{display:flex;gap:.3rem;margin-top:.4rem}
.kc .ex .acts button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:0 .55rem;font-size:.76rem}
.empty{font-size:.82rem;color:var(--ink2);padding:.6rem .3rem}
/* 로그인 · 안내 */
.gate{max-width:440px;margin:12vh auto 0;background:#fff;border:1px solid var(--line);border-radius:18px;padding:1.4rem 1.5rem;text-align:center}
.gate h2{font-family:var(--hand);font-weight:400;font-size:1.7rem;margin:0 0 .4rem}
.gate p{color:var(--ink2);font-size:.9rem;margin:.3rem 0 1rem}
.gate .g{display:inline-flex;align-items:center;gap:.5rem;background:var(--ink);color:#fff;border:0;border-radius:12px;padding:.6rem 1.1rem;font-size:.95rem}
.demo-badge{display:inline-block;background:#FFF3C4;color:#7A5A00;border-radius:999px;padding:.05rem .6rem;font-size:.78rem}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#2F3437;color:#fff;border-radius:999px;padding:.45rem 1rem;font-size:.86rem;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.policy-foot{margin-top:2rem;text-align:center;font-size:.8rem;color:var(--ink2)}
.policy-foot a{color:var(--ink2)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<footer class="policy-foot"><a href="../policy/">이용약관 · 개인정보 처리방침</a> · 문쌤의 AI 연구소 · 공문 레이더</footer>

<script type="module">
/* =========================================================================
   📡 공문 레이더 (moontr.site/ailab/radar/)
   자료: 연구소 1층 접수처에 넣은 '공문 목록(문서등록대장)' 캡쳐를 AI가 한 줄씩 옮긴 표 → Firestore ailab_meta/registry 의 rows
   여기서는 그 제목을 보고 ① 갈래 ② 주제 ③ 할 일(신청 · 제출 · 참고) ④ 해마다 오는 달 ⑤ 나와 맞는 정도(★)를 저절로 붙여요.
   선생님이 고칠 곳: 아래 CATS(갈래 낱말) · TOPICS(주제 낱말) · LIKE(★ 낱말). 낱말만 더하거나 지우면 돼요.
   관리자 구글 계정으로만 열려요 (규칙 isTeacher). 주소 끝 ?demo (예시 공문)는 이 컴퓨터에서 시험할 때만 돼요.
   ========================================================================= */
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getFirestore, doc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
import { firebaseConfig } from '../firebase-config.js';

const ADMIN_EMAILS = ['bellachord@gmail.com', 'anstjsdud@sen.go.kr'];   // 관리자 구글 계정 (보안 규칙 isTeacher 와 같게)
const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
const DEMO = /[?&]demo/.test(location.search) && /^(127\.0\.0\.1|localhost)$/.test(location.hostname);   // 예시 공문은 이 컴퓨터에서 시험할 때만 (연구소는 관리자만)

/* ---------- ① 갈래: 위에서부터 먼저 맞는 갈래 하나 (색 · 낱말) ---------- */
const CATS = [
  ['교사 모집', '#E07A5F', /선도교사|지원단|강사.*(모집|선발)|위원.*(모집|위촉|추천)|교사.*(모집|선발)|연구회.*(모집|구성)|컨설턴트/],
  ['선도 · 중점학교', '#2BA38A', /선도학교|중점학교|연구학교|시범학교|운영학교|거점학교|정책연구|선정 학교|학교 공모/],
  ['공모 · 대회', '#E0698F', /공모|대회|경진|해커톤|챌린지|공모전|어워드|올림피아드|콘테스트/],
  ['연수', '#3B6FD4', /연수|직무|원격|워크숍|워크샵|아카데미|역량 ?강화|교육과정 운영 안내|수업 나눔/],
  ['행사 · 박람회', '#8A63D2', /박람회|페어|축제|행사|포럼|설명회|세미나|캠프|주간|전시|체험|토론회|콘퍼런스|컨퍼런스/],
  ['사업 · 예산', '#D9A548', /예산|교부|사업비|정산|보조금|구입|보급|구축|계약|운영비|집행/],
  ['조사 · 제출', '#8A939B', /조사|제출|보고|현황|수요|점검|실태|회신|협조|실적|결과|설문|명단/],
  ['안내 · 홍보', '#B7B0A3', /./]
];
/* ---------- ② 주제: 제목에 낱말이 있으면 붙어요 (여러 개 가능) ---------- */
const TOPICS = [
  ['디벗(학생 태블릿)', /디벗|태블릿|스마트기기|스마트 기기|1인 1기기|기기 ?(보급|관리|파손|분실)/],
  ['로봇', /로봇/],
  ['드론 · 메이커', /드론|메이커|3D ?프린|피지컬/],
  ['과학 · 발명', /과학|발명|STEAM|탐구|실험/],
  ['수학', /(^|[^교])수학(?!습)/],
  ['영재', /영재/],
  ['정보보호 · 개인정보', /정보보호|개인정보|보안|사이버|해킹/],
  ['코딩 · SW', /코딩|SW|소프트웨어|정보 ?교육|프로그래밍|바이브/],
  ['생성형 AI', /생성형|챗GPT|ChatGPT|GPT|LLM|프롬프트/i],
  ['AI 윤리', /윤리/],
  ['AI 교육', /AI|인공지능|에이아이/i],
  ['에듀테크', /에듀테크|디지털 ?교과서|AIDT|AI ?디지털|플랫폼|디지털 ?(교육|기반|전환|수업)/],
  ['디지털 시민성', /시민성|리터러시|미디어|디지털 ?윤리|과의존/],
  ['독서 · 인문', /독서|인문|토론|글쓰기/]
];
/* ---------- ③ 할 일 ---------- */
const actOf = t => /결과|보고|제출|정산|조사|회신|점검|실적|명단|설문|협조/.test(t) ? '제출' : /모집|공모|신청|참가|선발|대회|경진|해커톤|공고|추천|희망|연수/.test(t) ? '신청' : '참고';   // 결과 · 보고가 들어가면 제출이 먼저
/* ---------- ⑤ 나와 맞는 정도 (★ 0~3): 문쌤 = 도덕 · AI 윤리 · 생성형 AI · 바이브코딩 ---------- */
const LIKE = [[/윤리|도덕|인권|철학/, 2], [/생성형|바이브|프롬프트|ChatGPT|GPT/i, 2], [/AI|인공지능|코딩|SW|에듀테크/i, 1], [/연수|연구회|선도교사|지원단|강사|공모/, 1]];

const store = (k, v) => { try { if (v === undefined) return JSON.parse(localStorage.getItem('radar_' + k)); localStorage.setItem('radar_' + k, JSON.stringify(v)); } catch (e) { return null; } };
const F = Object.assign({ off: ['디벗(학생 태블릿)', '로봇'], cats: [], year: '전체', dept: false, q: '', hide: [], lim: {} }, store('f') || {});
const save = () => store('f', F);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toast = t => { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1800); };
const $app = document.getElementById('app');

/* 제목 → 해마다 같은 공문을 알아보는 열쇠 (연도 · 회차 · 기수 · 괄호 · 재공고 빼고) */
const keyOf = t => t.replace(/\(.*?\)|\[.*?\]|「|」|『|』/g, ' ').replace(/20\d\d\s*(학년도|년도|년)?|\d+\s*(회|기|차|학기|분기|월)|제\s*\d+|재공고|변경|수정|추가|연장/g, ' ').replace(/[^가-힣A-Za-z]/g, '').slice(0, 40);
function enrich(rows) {
  const list = rows.filter(r => r && r.title).map(r => {
    const t = String(r.title), cat = CATS.find(c => c[2].test(t)), tp = TOPICS.filter(x => x[1].test(t)).map(x => x[0]);
    let st = LIKE.reduce((s, [re, n]) => s + (re.test(t) ? n : 0), 0); st = Math.min(3, st);
    return { no: String(r.no || ''), t, dept: r.dept || '', d: r.date || '', kind: r.kind || '', cat: cat[0], c: cat[1], tp, a: actOf(t), st, k: keyOf(t) };
  });
  /* 해마다: 같은 열쇠가 서로 다른 해에 2번 이상, 달이 1달 안쪽이면 '매년 ○월' */
  const by = {}; list.forEach(x => (by[x.k] = by[x.k] || []).push(x));
  list.forEach(x => {
    const g = (by[x.k] || []).filter(y => y.d), yrs = new Set(g.map(y => y.d.slice(0, 4)));
    if (x.k.length >= 6 && yrs.size >= 2) {
      const ms = g.map(y => +y.d.slice(5, 7)).sort((a, b) => a - b), m = ms[Math.floor(ms.length / 2)];
      if (ms.every(v => Math.min(Math.abs(v - m), 12 - Math.abs(v - m)) <= 1)) x.rep = m;
    }
    x.sib = (by[x.k] || []).filter(y => y !== x);
  });
  return list;
}

/* ---------- 화면 ---------- */
let ALL = [], user = null;
const curYear = String(new Date().getFullYear());
function visible() {
  return ALL.filter(x => !x.tp.some(t => F.off.includes(t)) && (!F.cats.length || F.cats.includes(x.cat)) && (F.year === '전체' || x.d.startsWith(F.year))
    && (!F.dept || /창의미래/.test(x.dept)) && !F.hide.includes(x.no + x.t) && (!F.q || `${x.t} ${x.dept} ${x.no}`.includes(F.q)));
}
function draw() {
  if (!ALL.length && !DEMO) {
    $app.innerHTML = head() + `<div class="gate"><h2>📥 아직 공문 목록이 없어요</h2><p>업무관리시스템의 <b>공문 목록 · 문서등록대장</b> 화면을 캡쳐해서 연구소 <b>1층 접수처</b>에 넣으면, AI가 한 줄씩 옮겨 여기에 쌓여요.</p><a class="btn dark" href="../">연구소 접수처로</a></div>`;
    return;
  }
  const L = visible(), m = new Date().getMonth() + 1, soonM = [m, m % 12 + 1, (m + 1) % 12 + 1];
  /* 📡 곧 올 공문: 해마다 오는 공문 중 다음 3달 안 + 올해는 아직 안 온 것 (열쇠마다 하나) */
  const seen = new Set(), soon = [];
  L.filter(x => x.rep && soonM.includes(x.rep)).sort((a, b) => soonM.indexOf(a.rep) - soonM.indexOf(b.rep) || b.st - a.st).forEach(x => {
    if (seen.has(x.k)) return; seen.add(x.k);
    const thisYear = [x, ...x.sib].some(y => y.d.startsWith(curYear) && +y.d.slice(5, 7) >= m - 1);
    if (!thisYear) soon.push(x);
  });
  const lanes = [
    ['soon', '📡 곧 올 공문', '해마다 이맘때 오던 공문 · 앞으로 3달', soon],
    ['apply', '🎯 신청해 볼 것', '모집 · 공모 · 대회 중 ★ 2개 이상 · 최근 순', L.filter(x => x.a === '신청' && x.st >= 2).sort(byDate)],
    ['submit', '📝 제출할 것', '조사 · 보고 · 회신 · 최근 순', L.filter(x => x.a === '제출').sort(byDate)],
    ['etc', '👀 참고 · 관심 낮음', '안내 · 행사, ★ 낮은 신청 · 최근 순', L.filter(x => x.a === '참고' || (x.a === '신청' && x.st < 2)).sort(byDate)]
  ];
  $app.innerHTML = head() + kpis(L, soon) + trend(L) + filters() + `<div class="kan">${lanes.map(([id, h, why, xs]) => {
    const lim = F.lim[id] || 30;
    return `<section class="lane"><h2>${h}<small>${xs.length}건</small></h2><p class="why">${why}</p>
      ${xs.slice(0, lim).map(x => card(x, id === 'soon')).join('') || '<p class="empty">없어요</p>'}
      ${xs.length > lim ? `<button class="more" data-more="${id}">${xs.length - lim}건 더 보기 ▾</button>` : ''}</section>`;
  }).join('')}</div>`;
}
const byDate = (a, b) => String(b.d).localeCompare(String(a.d)) || b.st - a.st;
function head() {
  return `<div class="top"><h1>📡 공문 레이더<small>받은 공문 제목을 갈래 · 주제로 나누고, 해마다 오는 공문과 할 일을 보여 줘요</small></h1>
    ${DEMO ? '<span class="demo-badge">예시 공문으로 보는 중</span>' : ''}<span class="sp"></span>
    <a class="btn" href="../">🏠 연구소</a>${DEMO ? '<a class="btn" href="./">진짜 공문 보기</a>' : user ? `<button class="btn" data-act="logout">나가기</button>` : ''}</div>`;
}
function kpis(L, soon) {
  const k = (n, label) => `<div class="kpi"><b>${n}</b><small>${label}</small></div>`;
  return `<div class="kpis">${k(L.length, `보이는 공문 · 전체 ${ALL.length}건`)}${k(L.filter(x => x.a === '신청').length, '신청할 수 있는 것')}${k(L.filter(x => x.a === '제출').length, '제출 · 보고')}${k(L.filter(x => x.st === 3).length, '⭐ 나에게 딱 (★★★)')}${k(new Set(L.filter(x => x.rep).map(x => x.k)).size, '해마다 오는 공문')}${k(soon.length, '📡 곧 올 공문')}</div>`;
}
function trend(L) {
  const ys = [...new Set(ALL.map(x => x.d.slice(0, 4)).filter(Boolean))].sort(); if (ys.length < 2) return '';
  const [p, c] = ys.slice(-2), cnt = (tp, y) => L.filter(x => x.tp.includes(tp) && x.d.startsWith(y)).length;
  const rows = TOPICS.map(([tp]) => [tp, cnt(tp, p), cnt(tp, c)]).filter(r => r[1] + r[2] > 0 && !F.off.includes(r[0])).sort((a, b) => (b[2] - b[1]) - (a[2] - a[1])).slice(0, 6);
  return `<div class="trend">📈 ${p} → ${c} 주제 흐름 ${rows.map(([tp, a, b]) => `<span class="tw">${esc(tp)} ${a}→${b} ${b > a ? '<span class="up">▲</span>' : b < a ? '<span class="down">▼</span>' : ''}</span>`).join('')}</div>`;
}
function filters() {
  const n = (f) => ALL.filter(f).length;
  const years = ['전체', ...[...new Set(ALL.map(x => x.d.slice(0, 4)).filter(Boolean))].sort().reverse()];
  return `<div class="filters">
    <div class="frow"><b>🙈 관심 없는 주제</b>${TOPICS.map(([tp]) => `<button class="chip ${F.off.includes(tp) ? 'off' : ''}" data-off="${esc(tp)}" title="누르면 ${F.off.includes(tp) ? '다시 보여요' : '숨겨요'}">${esc(tp)}<small>${n(x => x.tp.includes(tp))}</small></button>`).join('')}</div>
    <div class="frow"><b>🗂 갈래 (누르면 그것만)</b>${CATS.map(([c, col]) => `<button class="chip ${F.cats.includes(c) ? 'on' : ''}" style="--c:${col}" data-cat="${esc(c)}">${esc(c)}<small>${n(x => x.cat === c)}</small></button>`).join('')}${F.cats.length ? '<button class="chip" data-cat="">모두</button>' : ''}</div>
    <div class="frow"><b>📅 해 · 부서 · 찾기</b>${years.map(y => `<button class="chip ${F.year === y ? 'on' : ''}" data-year="${y}">${y}</button>`).join('')}
      <button class="chip ${F.dept ? 'on' : ''}" data-act="dept">창의미래교육과만</button>
      <input class="search" id="q" placeholder="제목 · 부서 · 번호 찾기" value="${esc(F.q)}" autocomplete="off">
      ${F.hide.length ? `<button class="chip" data-act="unhide">숨긴 공문 ${F.hide.length}건 되돌리기</button>` : ''}
      <button class="chip" data-act="csv" title="지금 보이는 공문을 갈래 · 주제 · 할 일 · 반복 · ★ 와 함께 엑셀(CSV)로">📥 엑셀로 내려받기</button>
      <span class="note">칩 · 숨김은 이 기기에 기억돼요</span></div>
  </div>`;
}
function card(x, soon) {
  const sibs = x.sib.filter(y => y.d).sort(byDate);
  return `<article class="kc" style="--c:${x.c}" data-card="${esc(x.no + x.t)}">
    <div class="tt">${soon ? `<b>${x.rep}월쯤</b> · ` : ''}${esc(soon ? x.t.replace(/20\d\d\s*(학년도|년도|년)?\s*/, '') : x.t)}</div>
    <div class="cs"><span class="mc cat">${esc(x.cat)}</span>${x.tp.slice(0, 3).map(t => `<span class="mc">${esc(t)}</span>`).join('')}${x.rep ? `<span class="mc rep">매년 ${x.rep}월</span>` : x.sib.length ? '' : '<span class="mc new">처음</span>'}<span class="mc d">${soon ? `작년 ${esc(x.d.slice(5).replace('-', '/'))}` : esc(x.d.slice(2).replace(/-/g, '.'))}</span><span class="star">${'★'.repeat(x.st)}</span></div>
    <div class="ex">
      <div class="row"><b>할 일</b>${x.a}</div>
      <div class="row"><b>보낸 곳</b>${esc(x.dept) || '-'}</div>
      <div class="row"><b>공문번호</b>${esc(x.no) || '-'} ${x.kind ? `· ${esc(x.kind)}` : ''}</div>
      ${sibs.length ? `<div class="row"><b>다른 해</b><span>${sibs.slice(0, 4).map(y => `${esc(y.d)} ${esc(y.t)}`).join('<br>')}</span></div>` : ''}
      <div class="acts"><button data-copy="${esc(x.t)}">제목 복사</button><button data-hide="${esc(x.no + x.t)}">이 공문 숨기기</button></div>
    </div></article>`;
}

/* ---------- 누르기 ---------- */
document.addEventListener('click', async e => {
  const t = e.target;
  const b = t.closest('button, [data-card]'); if (!b) return;
  if (b.dataset.act === 'login') { const p = new GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' }); try { await signInWithPopup(auth, p); } catch (err) { if (!/popup-closed|cancelled/.test(err.code || '')) toast('로그인하지 못했어요 (' + (err.code || err.message) + ')'); } return; }
  if (b.dataset.act === 'logout') { await signOut(auth); return; }
  if (b.dataset.off !== undefined) { const v = b.dataset.off; F.off = F.off.includes(v) ? F.off.filter(x => x !== v) : [...F.off, v]; save(); return draw(); }
  if (b.dataset.cat !== undefined) { const v = b.dataset.cat; F.cats = !v ? [] : F.cats.includes(v) ? F.cats.filter(x => x !== v) : [...F.cats, v]; save(); return draw(); }
  if (b.dataset.year) { F.year = b.dataset.year; save(); return draw(); }
  if (b.dataset.act === 'dept') { F.dept = !F.dept; save(); return draw(); }
  if (b.dataset.act === 'csv') {   // 엑셀로: 보이는 공문 + 붙인 분류 (분류 낱말을 다듬을 때 Claude 에게 이 파일을 주면 돼요)
    const rows = [['날짜', '공문번호', '제목', '보낸 곳', '갈래', '주제', '할 일', '매년', '별', '다른 해 같은 공문 수']]
      .concat(visible().sort(byDate).map(x => [x.d, x.no, x.t, x.dept, x.cat, x.tp.join(' / '), x.a, x.rep ? x.rep + '월' : '', x.st, x.sib.length]));
    const csv = '\ufeff' + rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })), download: `공문레이더_${new Date().toISOString().slice(0, 10)}.csv` });
    a.click(); toast(`${rows.length - 1}건을 내려받았어요`); return;
  }
  if (b.dataset.act === 'unhide') { F.hide = []; save(); toast('숨긴 공문을 되돌렸어요'); return draw(); }
  if (b.dataset.more) { F.lim[b.dataset.more] = (F.lim[b.dataset.more] || 30) + 30; save(); return draw(); }
  if (b.dataset.copy) { try { await navigator.clipboard.writeText(b.dataset.copy); toast('제목을 복사했어요'); } catch (x) { toast('복사하지 못했어요'); } return; }
  if (b.dataset.hide) { F.hide = [...F.hide, b.dataset.hide]; save(); toast('숨겼어요 · 위 칩에서 되돌릴 수 있어요'); return draw(); }
  if (b.dataset.card !== undefined && !t.closest('.ex')) b.classList.toggle('open');
});
let qt; document.addEventListener('input', e => { if (e.target.id !== 'q') return; clearTimeout(qt); qt = setTimeout(() => { F.q = e.target.value.trim(); save(); const pos = e.target.selectionStart; draw(); const q = document.getElementById('q'); q.focus(); q.setSelectionRange(pos, pos); }, 250); });

/* ---------- 자료 ---------- */
function gate(msg) {
  $app.innerHTML = head() + `<div class="gate"><h2>📡 공문 레이더</h2><p>${msg || '관리자 구글 계정으로 로그인하면 연구소에 쌓인 공문 목록을 보여 줘요.'}</p>
    <button class="g" data-act="login">G 구글 계정으로 로그인</button></div>`;
}
if (DEMO) {
  const R = [['2025-02-17','2025학년도 디벗 기기 보급 및 관리 지침 안내'],['2025-03-04','2025학년도 AI · 디지털 선도교사 모집 안내'],['2025-03-18','2025 AI 중점학교 운영 계획서 제출'],['2025-03-25','디벗 기기 파손 · 분실 현황 조사'],['2025-04-07','교원 대상 생성형 AI 활용 수업 직무연수 안내'],['2025-04-22','학생 로봇 활용 교육 운영 학교 공모'],['2025-05-12','제5회 서울 학생 AI 해커톤 대회 참가 안내'],['2025-06-02','디지털 기기 활용 실태 조사 협조'],['2025-07-07','2025 여름방학 교원 AI 디지털 연수 안내'],['2025-09-08','2025 서울 에듀테크 페어 참관 안내'],['2025-10-13','2025 AI 윤리 수업 사례 공모'],['2025-11-17','2026 교과 연구회 수요 조사'],['2025-12-08','2025 디지털 교육 사업 정산 및 결과 보고'],['2026-02-16','2026학년도 디벗 기기 보급 및 관리 지침 안내'],['2026-03-03','2026학년도 AI · 디지털 선도교사 모집 안내'],['2026-03-17','2026 AI 중점학교 운영 계획서 제출'],['2026-04-06','교원 대상 생성형 AI 활용 수업 직무연수 안내'],['2026-04-21','AI 윤리 교육 교수학습자료 개발 연구회 공모'],['2026-05-11','제6회 서울 학생 AI 해커톤 대회 참가 안내'],['2026-06-08','디지털 시민성 교육 주간 운영 안내'],['2026-07-06','2026 여름방학 교원 AI 디지털 연수 안내'],['2026-09-07','2026 서울 에듀테크 페어 참관 안내'],['2026-10-12','2026 AI 윤리 수업 사례 공모'],['2026-10-26','바이브코딩 수업 나눔 연수 강사 모집']];
  ALL = enrich(R.map(([d, t], i) => ({ no: String(1000 + i), title: t, date: d, dept: '서울특별시교육청 창의미래교육과', kind: '접수' })));
  draw();
} else {
  gate('불러오는 중…');
  let unsub = null;
  onAuthStateChanged(auth, u => {
    if (unsub) { unsub(); unsub = null; }
    user = u;
    if (!u) return gate();
    if (!ADMIN_EMAILS.includes(u.email)) { signOut(auth); return gate('관리자 구글 계정으로 로그인해 주세요.'); }   // 다른 계정은 바로 나가요 (다른 앱 관리자 로그인이 막히지 않게)
    unsub = onSnapshot(doc(db, 'ailab_meta', 'registry'), s => { ALL = enrich(Object.values((s.exists() && s.data().rows) || {})); draw(); },
      err => gate(err.code === 'permission-denied' ? '이 계정으로는 볼 수 없어요. 관리자 구글 계정으로 로그인해 주세요.' : '불러오지 못했어요 (' + err.code + ')'));
  });
}
</script>
<script type="module" src="/visit.js?app=ailab&hide=1"></script>
<script src="/refresh.js" defer></script>
</body>
</html>
