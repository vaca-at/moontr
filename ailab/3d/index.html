<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Lab 3D 건물</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 레이아웃: 첫 화면은 화면보호기처럼 3D 건물이 화면 가득(이름표는 HTML로 겹침), 단추 몇 개만 떠 있다가 가만히 있으면 숨어요.
   ☰ 를 누르면 오른쪽 서랍에 배치판(층·방 → 직원 10명)과 원장실(나 · 친구 10명) */
:root {
  --sky: #dfeaf1; --card: #ffffff; --card2: #f3f6f7; --ink: #22303a; --muted: #566570; --line: #c3d0d8;
  --accent: #2b7ea1; --accent-bg: #dcecf3; --hot: #e0693f; --on-accent: #ffffff; --thumb: #efe6d8;
  --f-display: "Jua", "IBM Plex Sans KR", system-ui, sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --sky: #121b22; --card: #1b252c; --card2: #212d35; --ink: #e6edf1; --muted: #9aabb6; --line: #2c3a44; --accent: #6cc0e4; --accent-bg: #1c3440; --hot: #ef7f57; --on-accent: #0f1a20; --thumb: #3a332b; color-scheme: dark; }
}
:root[data-theme="dark"] { --sky: #121b22; --card: #1b252c; --card2: #212d35; --ink: #e6edf1; --muted: #9aabb6; --line: #2c3a44; --accent: #6cc0e4; --accent-bg: #1c3440; --hot: #ef7f57; --on-accent: #0f1a20; --thumb: #3a332b; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--sky); color: var(--ink); font: 15px/1.6 var(--f-body); overflow: hidden; }
#drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 20; width: min(560px, 100%); overflow-y: auto; overscroll-behavior: contain;
  background: var(--sky); border-left: 1px solid var(--line); box-shadow: -18px 0 40px -28px rgba(0, 0, 0, .55);
  display: grid; gap: 14px; align-content: start;
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(28px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  transform: translateX(105%); visibility: hidden; transition: transform .3s ease, visibility 0s linear .3s;
}
#drawer.open { transform: none; visibility: visible; transition: transform .3s ease; }
.head .row { display: flex; gap: 6px; flex-wrap: wrap; }

/* 화면 위에 떠 있는 단추들 (가만히 있으면 숨어요) */
.hud { position: fixed; z-index: 10; transition: opacity .35s; }
body.idle .hud:not(:focus-within):not(:focus) { opacity: 0; pointer-events: none; }
body.idle .stage { cursor: none; }
.hudb { display: inline-flex; align-items: center; gap: 6px; height: 42px; padding: 0 14px; border-radius: 21px; border: 1px solid var(--line); background: color-mix(in srgb, var(--card) 86%, transparent); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); color: var(--ink); font: 500 13.5px var(--f-body); cursor: pointer; box-shadow: 0 6px 18px -12px rgba(0, 0, 0, .5); }
#hudMenu { top: calc(12px + env(safe-area-inset-top, 0px)); left: calc(12px + env(safe-area-inset-left, 0px)); }
#hudMenu b { font-size: 18px; font-weight: 400; }
#back { top: calc(12px + env(safe-area-inset-top, 0px)); left: calc(184px + env(safe-area-inset-left, 0px)); }
#hudFs { top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); width: 42px; padding: 0; justify-content: center; font-size: 18px; }
#hudTheme { left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 0 4px; gap: 2px; cursor: default; max-width: calc(100% - 24px); }
#hudTheme > button { border: 0; background: transparent; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 13px; }
#hudTheme .nm { font: 400 15px var(--f-display); padding: 0 8px; white-space: nowrap; }
#hudTheme .nums { display: flex; gap: 2px; }
#hudTheme .nums button { border: 0; background: transparent; width: 28px; height: 28px; border-radius: 50%; font: 500 12px var(--f-mono); cursor: pointer; }
#hudTheme .nums button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
#hudTheme button:hover { background: var(--card2); }
.hint { right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); font-size: 12px; color: var(--muted); background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 2px 10px; pointer-events: none; }
@media (max-width: 900px) { .hint { display: none; } }
@media (max-width: 560px) { #hudMenu span, #hudTheme .nums { display: none; } #back { left: calc(66px + env(safe-area-inset-left, 0px)); } }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; margin: 0; line-height: 1.3; text-wrap: balance; }
h1 { font-size: 28px; }
h2 { font-size: 21px; }
h3 { font-size: 16px; }
button { font: inherit; color: inherit; }
button:focus-visible, .sign:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.head { display: flex; gap: 12px 24px; align-items: end; justify-content: space-between; flex-wrap: wrap; }
.head p { margin: 4px 0 0; color: var(--muted); max-width: 64ch; font-size: 14px; }
.ghost { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 6px 12px; font-size: 13px; cursor: pointer; }

.stage { position: fixed; inset: 0; overflow: hidden; background: var(--sky); touch-action: none; cursor: grab; }
.stage.drag { cursor: grabbing; }
.stage.hover { cursor: pointer; }
.stage canvas { display: block; width: 100%; height: 100%; }
.labels { position: absolute; inset: 0; pointer-events: none; }
.sign { position: absolute; left: 0; top: 0; pointer-events: auto; transform: translate(-50%, -50%); display: inline-flex; align-items: center; gap: 6px; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 1px 9px; font: 400 14px var(--f-display); white-space: nowrap; cursor: pointer; box-shadow: 0 4px 10px -6px rgba(0, 0, 0, .4); }
.sign:hover, .sign.on { border-color: var(--accent); color: var(--accent); }
.sign i { font: 500 10.5px/16px var(--f-mono); font-style: normal; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--card2); border: 1px solid var(--line); text-align: center; color: var(--ink); }
.sign i.hot { background: var(--hot); border-color: var(--hot); color: #fff; }
.tag { position: absolute; left: 0; top: 0; transform: translate(-100%, -50%); font: 500 12px var(--f-mono); color: var(--muted); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; }
.roofsign { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); font: 400 20px var(--f-display); background: var(--card); color: var(--ink); border: 2px solid var(--ink); border-radius: 8px; padding: 0 16px; }
.fail { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); }

.panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.panel > p, .step { margin: 0; font-size: 14px; color: var(--muted); }
.step b { color: var(--ink); }
.cols { display: grid; grid-template-columns: 1fr; gap: 14px; }

/* 층 · 방 고르기 */
.floors { display: grid; gap: 6px; }
.frow { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 6px; align-items: stretch; }
.frow .rooms { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px; }
.fbtn, .rbtn { border: 1px solid var(--line); background: var(--card2); border-radius: 10px; padding: 6px 9px; cursor: pointer; text-align: left; min-width: 0; }
.fbtn { font: 500 12.5px var(--f-mono); display: grid; place-items: center; text-align: center; }
.fbtn small { display: block; font: 400 11px var(--f-body); color: var(--muted); }
.rbtn { display: grid; gap: 0; font: 400 15px var(--f-display); }
.rbtn small { font: 400 12px var(--f-body); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fbtn:hover, .rbtn:hover { border-color: var(--accent); }
.fbtn.on, .rbtn.on { border-color: var(--accent); background: var(--accent-bg); box-shadow: inset 0 0 0 1px var(--accent); }

/* 캐릭터 카드 */
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
.pc { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 0 0 7px; cursor: pointer; display: grid; gap: 1px; text-align: center; overflow: hidden; min-width: 0; }
.pc canvas { width: 100%; aspect-ratio: 120 / 128; max-width: 100%; display: block; background: var(--thumb); }
.pc b { font: 400 14.5px var(--f-display); padding: 4px 6px 0; }
.pc b span { font: 500 10.5px var(--f-mono); color: var(--accent); margin-right: 4px; }
.pc small { font-size: 11.5px; color: var(--muted); padding: 0 6px; line-height: 1.35; min-height: 1.35em; }
.pc:hover { border-color: var(--accent); }
.pc.on { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.pc.on b { color: var(--accent); }
.pc[disabled] { opacity: .55; cursor: not-allowed; }

.boss-me { display: grid; gap: 8px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.seg button { border: 0; background: transparent; font: 500 13px var(--f-body); padding: 5px 10px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
.seg button b { font: 500 11px var(--f-mono); color: var(--accent); margin-right: 5px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.seg button[aria-pressed="true"] b { color: inherit; }
.note { font-size: 13.5px; color: var(--muted); margin: 0; }
.note b { color: var(--ink); font-weight: 500; }
.head-r { display: grid; gap: 6px; justify-items: end; }
.head-r > span { font-size: 12px; color: var(--muted); }
.head-r .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.me-row { display: flex; gap: 8px 14px; flex-wrap: wrap; align-items: center; }
.me-row > span { font-size: 12.5px; color: var(--muted); }

/* 마우스를 올리면 뜨는 작은 설명 창 */
.tip { position: fixed; left: 0; top: 0; z-index: 50; max-width: 240px; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px 8px; box-shadow: 0 8px 22px -10px rgba(0, 0, 0, .45); pointer-events: none; font-size: 12.5px; line-height: 1.45; display: grid; gap: 2px; }
.tip b { font: 400 15px var(--f-display); }
.tip i { font-style: normal; font: 500 11px var(--f-mono); color: var(--accent); }
.tip p { margin: 0; color: var(--muted); }
.tip .job { color: var(--ink); }
.tip .job span { font-size: 11px; font-weight: 700; color: var(--accent); margin-right: 4px; }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="labels" id="labels"></div>
</div>
<button class="hud hudb" id="hudMenu" type="button" aria-controls="drawer" aria-expanded="false"><b aria-hidden="true">☰</b><span>배치 · 원장실</span></button>
<button class="hud hudb" id="back" type="button" hidden>← 건물 전체</button>
<button class="hud hudb" id="hudFs" type="button" aria-label="전체 화면" title="전체 화면">⛶</button>
<div class="hud hudb" id="hudTheme" role="group" aria-label="건물 시안">
  <button type="button" id="thPrev" aria-label="이전 건물 시안">◀</button>
  <span class="nm" id="thName"></span>
  <span class="nums" id="themePick"></span>
  <button type="button" id="thNext" aria-label="다음 건물 시안">▶</button>
</div>
<span class="hud hint">끌어서 돌리기 · 휠로 확대 · 캐릭터에 마우스를 올려 보세요</span>

<aside id="drawer" aria-label="직원 배치와 원장실">
  <div class="head">
    <div>
      <h1>AI Lab</h1>
      <p>직원 10명 가운데 누가 어느 층, 어느 방에서 일할지 고르고, 원장실의 나와 친구를 정해요. 고른 것은 이 브라우저에 기억돼요.</p>
    </div>
    <div class="row">
      <button class="ghost" id="reset" type="button">처음 배치로</button>
      <button class="ghost" id="drawerX" type="button">닫기 ✕</button>
    </div>
  </div>

  <section class="panel">
    <h2>직원 배치</h2>
    <p class="step" id="stepText"></p>
    <div class="cols">
      <div class="floors" id="floors"></div>
      <div class="gallery" id="staff"></div>
    </div>
  </section>

  <section class="panel">
    <h2>5층 원장실 · 나와 친구</h2>
    <div class="boss-me">
      <h3>나 (원장님)</h3>
      <div class="me-row">
        <div class="seg" id="genderPick" role="group" aria-label="원장님 모습">
          <button type="button" data-g="f" aria-pressed="false">여자</button>
          <button type="button" data-g="m" aria-pressed="false">남자</button>
        </div>
        <div class="seg" id="mePick" role="group" aria-label="나"></div>
      </div>
      <p class="note" id="meNote"></p>
    </div>
    <h3>내 옆 친구</h3>
    <div class="gallery" id="friends"></div>
    <p class="note" id="friendNote"></p>
  </section>
</aside>
<div class="tip" id="tip" hidden></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// ---------- 층과 방 (앱의 rooms.js 와 같은 구성) ----------
// job: 그 방 직원이 하는 일 (마우스를 올리면 보여요)
const ROOMS = {
  boss: { name: '원장실', n: 2 },
  train: { name: '연수 기록실', n: 4, job: '연수 안내 공문을 읽고 연수명·일시·장소·이수 시간을 정리해요.' },
  links: { name: '링크 서재', n: 6, job: '연수 사이트 캡쳐에서 주소와 중요 안내, 마감일을 뽑아 즐겨찾기로 꽂아 둬요.' },
  moral: { name: '도덕실', n: 2, job: '수업 공개 공문에서 도덕 수업을 골라 날짜순으로 안내해요.' },
  others: { name: '타교과실', n: 3, job: '도덕이 아닌 다른 교과의 공개수업을 모아 안내해요.' },
  plans: { name: '지도안 연구실', n: 5, job: '다른 선생님 지도안을 읽고 활동 방식별로 묶어 둬요.' },
  task: { name: '과제 작업실', n: 1, job: '연수 과제 안내를 정리하고 단계별 진행과 제출일을 챙겨요.' },
  lobby: { name: '접수처', n: 3, hot: true, job: '들어온 캡쳐를 받아 AI에게 읽히고, 어느 방으로 보낼지 정해요.' },
  archive: { name: '원본 보관실', n: 24, job: '넣은 캡쳐 원본을 고치지 않고 그대로 보관해요.' },
};
const ME_JOB = '건물 전체를 둘러보며 다가오는 연수·공개수업·과제 마감을 챙겨요.';
const FLOORS = [
  { floor: '5F', name: '원장실', rooms: ['boss'] },
  { floor: '4F', name: '연수 층', rooms: ['train', 'links'] },
  { floor: '3F', name: '수업 공개 층', rooms: ['moral', 'others'] },
  { floor: '2F', name: '연구 층', rooms: ['plans', 'task'] },
  { floor: '1F', name: '접수처', rooms: ['lobby'] },
  { floor: 'B1', name: '원본 보관실', rooms: ['archive'] },
];
const DEFAULT = { assign: { train: 3, links: 3, moral: 1, others: 1, plans: 4, task: 4, lobby: 2, archive: 5 }, me: 1, friend: 1, gender: 'm', theme: 1 };
const saved = (() => { try { return JSON.parse(localStorage.getItem('ailab3d') || 'null'); } catch { return null; } })();
const STATE = { ...DEFAULT, ...(saved || {}), assign: { ...DEFAULT.assign, ...(saved?.assign || {}) } };
const save = () => { try { localStorage.setItem('ailab3d', JSON.stringify(STATE)); } catch {} };

// ---------- 색 ----------
const P = {
  wall: '#efe4d3', wall2: '#e3d4bf', wallB1: '#cbbfae', slab: '#ddd2c2', edge: '#353c44', wood: '#c99a5c', woodD: '#8e6640',
  glass: '#bfe0ee', frame: '#f7f3ec', grass: '#9cc87a', dirt: '#9b7653', dirtD: '#7f5f42', trunk: '#8a5a35', leaf: '#6fae4f', leaf2: '#5c9a40',
  skin: '#e8925f', cap: '#62b0d0', gold: '#e3b23a', eye: '#2a2522', white: '#eef4f6', blush: '#f27a7a', shirt: '#2b7ea1', pants: '#2f3e5c',
  coat: '#f1f3f2', steel: '#a9b4bb', panel: '#14202a', glow: '#5fe0e6', red: '#e0693f', teal: '#2f9c8f', screen: '#26313a', monitor: '#7cc3e0',
  pot: '#c8693f', paper: '#fbfaf6', crate: '#c08a52', crateD: '#8f6337', belt: '#2f353b', metal: '#7d878f', book: ['#62b0d0', '#e0693f', '#2f9c8f', '#e3b23a', '#6e5ea0'],
};
const shade = (hex, k) => { const c = new THREE.Color(hex); return '#' + (k > 0 ? c.lerp(new THREE.Color('#ffffff'), k) : c.lerp(new THREE.Color('#000000'), -k)).getHexString(); };

// ---------- three.js 기본 ----------
const stage = document.getElementById('stage');
const labelsEl = document.getElementById('labels');
let renderer, thumbR;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  thumbR = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
} catch {
  stage.insertAdjacentHTML('beforeend', '<p class="fail">이 브라우저에서는 3D 화면을 열 수 없어요. 다른 브라우저로 열어 주세요.</p>');
  throw new Error('WebGL 없음');
}
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, .1, 400);
const hemi = new THREE.HemisphereLight('#ffffff', '#b9a68a', 1.6);
const sun = new THREE.DirectionalLight('#fff4e2', 2.3);
sun.position.set(-14, 34, 26);
sun.target.position.set(0, 7, 0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -22, right: 22, top: 24, bottom: -10, near: 1, far: 90 });
sun.shadow.bias = -.0004;
sun.shadow.normalBias = .03;
scene.add(hemi, sun, sun.target);

function applyTheme() {
  const css = getComputedStyle(document.documentElement);
  scene.background = new THREE.Color(css.getPropertyValue('--sky').trim() || '#dfeaf1');
  const dark = scene.background.getHSL({}).l < .3;
  hemi.intensity = dark ? 1.05 : 1.6;
  sun.intensity = dark ? 1.5 : 2.3;
}
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

// 상자 하나 = 같은 정육면체 모양을 늘려서 씁니다. 'holo:' · 'ghost:' 로 시작하는 색은 비치는 재질
const UNIT = new THREE.BoxGeometry(1, 1, 1);
const mats = new Map();
function mat(color, opts = {}) {
  const key = `${color}|${JSON.stringify(opts)}`;
  if (!mats.has(key)) {
    let m;
    if (color.startsWith('holo:')) m = new THREE.MeshStandardMaterial({ color: color.slice(5), emissive: color.slice(5), emissiveIntensity: .7, transparent: true, opacity: .55, depthWrite: false });
    else if (color.startsWith('ghost:')) m = new THREE.MeshStandardMaterial({ color: color.slice(6), roughness: .6, transparent: true, opacity: .82 });
    else m = new THREE.MeshStandardMaterial({ color, roughness: .85, metalness: 0, ...opts });
    mats.set(key, m);
  }
  return mats.get(key);
}
function B(parent, w, h, d, color, x, y, z, { shadow = true, m = null } = {}) {
  const mesh = new THREE.Mesh(UNIT, m || mat(color));
  mesh.scale.set(w, h, d);
  mesh.position.set(x, y, z);
  mesh.castShadow = shadow && !String(color).startsWith('holo:');
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

// ---------- 글씨가 있는 면 (캔버스 그림) ----------
function texMat(draw, w = 512, h = 320) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return new THREE.MeshStandardMaterial({ map: t, roughness: .7, emissive: '#ffffff', emissiveMap: t, emissiveIntensity: .25 });
}
const FONT = '"Jua", "IBM Plex Sans KR", sans-serif';
function checklist(title, items) {
  return texMat((g, w, h) => {
    g.fillStyle = '#26313a'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#f2b84a'; g.font = `34px ${FONT}`; g.fillText(title, 28, 50);
    items.forEach(([label, done], i) => {
      const y = 92 + i * 46;
      g.fillStyle = done ? '#4cc07a' : '#55636d'; g.fillRect(28, y - 24, 28, 28);
      if (done) { g.strokeStyle = '#fff'; g.lineWidth = 5; g.beginPath(); g.moveTo(33, y - 10); g.lineTo(41, y - 2); g.lineTo(52, y - 18); g.stroke(); }
      g.fillStyle = '#eef4f6'; g.font = `27px ${FONT}`; g.fillText(label, 72, y);
      g.fillStyle = done ? '#4cc07a' : '#55636d'; g.fillRect(250, y - 14, done ? 220 : 120, 8);
    });
  });
}
const calendarMat = () => texMat((g, w, h) => {
  g.fillStyle = '#fbfaf6'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#e0693f'; g.fillRect(0, 0, w, 70);
  g.fillStyle = '#fff'; g.font = `40px ${FONT}`; g.fillText('11월 연수', 24, 50);
  g.font = '22px "IBM Plex Mono", monospace';
  for (let i = 0; i < 30; i++) {
    const x = 26 + (i % 7) * 68, y = 112 + Math.floor(i / 7) * 46;
    if ([3, 11, 19, 25].includes(i)) { g.fillStyle = '#62b0d0'; g.fillRect(x - 8, y - 26, 52, 36); g.fillStyle = '#fff'; } else g.fillStyle = '#566570';
    g.fillText(String(i + 1), x, y);
  }
}, 512, 340);
const posterMat = (title, color) => texMat((g, w, h) => {
  g.fillStyle = '#fbfaf6'; g.fillRect(0, 0, w, h);
  g.fillStyle = color; g.fillRect(30, 40, 300, 22); g.fillRect(30, 80, 200, 14);
  g.fillStyle = '#c3d0d8'; for (let i = 0; i < 5; i++) g.fillRect(30, 130 + i * 30, 380 - (i % 2) * 90, 10);
  g.fillStyle = color; g.font = `54px ${FONT}`; g.fillText(title, 300, 290);
}, 512, 340);

function buildParts(parts, into, origin, named, groups) {
  const [ox, oy, oz] = origin;
  for (const p of parts) {
    if (p.group) {
      const g = new THREE.Group();
      const [px, py, pz] = p.pivot;
      g.position.set((px - ox) * V, -(py - oy) * V, (pz - oz) * V);
      named[p.group] = g;
      groups.push({ name: p.group, g });
      buildParts(p.parts, g, p.pivot, named, groups);
      into.add(g);
      continue;
    }
    const { x = 0, y = 0, z = 0, w, h, d, c, front = [] } = p;
    B(into, w * V, h * V, d * V, c, (x - ox) * V, -(y - oy) * V, (z - oz) * V);
    for (const [l, t, mw, mh, mc] of front) {
      const cx = x - w / 2 + l + mw / 2, cy = y - h / 2 + t + mh / 2;
      B(into, mw * V, mh * V, .12 * V, mc, (cx - ox) * V, -(cy - oy) * V, (z + d / 2 + .06 - oz) * V, { shadow: false });
    }
  }
}
function makeChar(def) {
  const root = new THREE.Group();
  const lift = new THREE.Group();
  const named = {}, groups = [];
  buildParts(def.parts, lift, [0, def.foot, 0], named, groups);
  root.add(lift);
  return { root, lift, groups, ...named, sway: !!def.sway };
}

// ---------- 움직임 ----------
const people = [];
// role: desk(타자) · stand(둘러보기) · walk(오가기) · wave(손 흔들기) · me · float · pet · hop
function addChar(parent, x, y, z, role, { def, face = 0, walk, hold, info } = {}) {
  const c = makeChar(def);
  c.info = info;
  c.root.userData.char = c;
  const seat = role === 'desk' ? def.stool || 0 : 0;
  if (seat) B(parent, .8, seat, .8, P.woodD, x, y + seat / 2, z);
  c.root.position.set(x, y + seat, z);
  c.root.rotation.y = face;
  Object.assign(c, { base: { x, y: y + seat, face }, role, walk, hold, ph: Math.random() * 10 });
  parent.add(c.root);
  people.push(c);
  return c;
}
function groupAnim(c, s) {
  for (const { name, g } of c.groups) {
    if (name === 'tail') g.rotation.y = Math.sin(s * 2.4) * .35;
    else if (name === 'wag') g.rotation.z = Math.sin(s * 14) * .5;
    else if (name === 'prop') g.rotation.y = s * 28;
    else if (name === 'leaves') g.rotation.z = Math.sin(s * 1.6) * .14;
    else if (name === 'ear') g.rotation.x = Math.sin(s * 2.2) * .18;
    else if (name === 'flapL') g.rotation.y = c.role === 'float' && c.groups.some((x) => x.name === 'flapR') && g.children.length > 1 ? .5 + Math.sin(s * 2.4) * .3 : 0;
    else if (name === 'flapR') g.rotation.y = c.role === 'float' && g.children.length > 1 ? -.5 - Math.sin(s * 2.4) * .3 : 0;
    else if (name === 'flame') g.scale.set(1, 1 + Math.sin(s * 22) * .25, 1);
    else if (name === 'steam') g.children.forEach((m, i) => {
      if (m.userData.y0 === undefined) m.userData.y0 = m.position.y;
      const k = (s * .5 + i / 3) % 1;
      m.position.y = m.userData.y0 + k * .25;
      m.visible = k < .85;
    });
  }
  // 유령의 짧은 팔은 파닥파닥
  if (c.flapGhost) { c.flapL.rotation.z = Math.sin(s * 6) * .4; c.flapR.rotation.z = -Math.sin(s * 6) * .4; }
}
function animate(c, t) {
  const s = t + c.ph;
  const arms = c.armL && c.armR;
  groupAnim(c, s);
  switch (c.role) {
    case 'me': {

function fitDist(w, h) {
  const v = THREE.MathUtils.degToRad(camera.fov) / 2;
  const hz = Math.atan(Math.tan(v) * camera.aspect);
  return Math.max((h / 2) / Math.tan(v), (w / 2) / Math.tan(hz));
}
function overview() {
  selected = null;
  // 위로는 옥상 장식(시계탑 · 풍선)까지, 아래로는 B1 흙까지 들어오게

}
function enter(k) {

  if (k === 'boss' && f) { goal.target.set(f.x + .4, f.y + .35, 1); goal.dist = fitDist(10, 5.2) + 2; } else { goal.target.set(b.cx, b.y + FH * .46, .3); goal.dist = fitDist(b.w + 1.2, FH + 1) + D / 2; }
  goal.yaw = THREE.MathUtils.clamp(view.yaw, -.35, .35) * .5;

}

function markSigns() {

  labelsEl.querySelectorAll('.sign').forEach((s) => s.classList.toggle('on', s.dataset.room === selected || !!on(s.dataset.room)));

function placeCamera() {
  const k = .09;
  view.target.lerp(goal.target, k);
  view.dist += (goal.dist - view.dist) * k;
  view.yaw += (goal.yaw - view.yaw) * k;
  view.pitch += (goal.pitch - view.pitch) * k;
  const cp = Math.cos(view.pitch);
  camera.position.set(view.target.x + Math.sin(view.yaw) * cp * view.dist, view.target.y + Math.sin(view.pitch) * view.dist, view.target.z + Math.cos(view.yaw) * cp * view.dist);
  camera.lookAt(view.target);
}

// ---------- 끌기 · 누르기 · 휠 ----------
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let drag = null, hovered = null;
function pick(e) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  return ray.intersectObjects(roomBoxes, false)[0]?.object.userData.room || null;
}
function hoverRoom(k) {
  if (hovered === k) return;
  roomBoxes.forEach((b) => { b.material.opacity = b.userData.room === k ? .07 : 0; });
  hovered = k;
}
renderer.domElement.addEventListener('pointerdown', (e) => {
  drag = { x: e.clientX, y: e.clientY, yaw: goal.yaw, pitch: goal.pitch, moved: false };
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove', (e) => {
  if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 5) { drag.moved = true; stage.classList.add('drag'); }
    if (drag.moved) {
      goal.yaw = THREE.MathUtils.clamp(drag.yaw - dx * .005, -1, 1);
      goal.pitch = THREE.MathUtils.clamp(drag.pitch + dy * .004, -.02, .7);
    }
    return;
  }
  const ch = pickChar(e);
  if (ch) { showTip(ch.info, e.clientX, e.clientY); hoverRoom(null); stage.classList.add('hover'); return; }
  hideTip();
  const k = pick(e);
  stage.classList.toggle('hover', !!k);
  hoverRoom(k);
});
renderer.domElement.addEventListener('pointerup', (e) => {
  stage.classList.remove('drag');
  if (drag && !drag.moved) {
    const ch = pickChar(e);
    if (ch) showTip(ch.info, e.clientX, e.clientY); // 휴대폰은 눌러서 설명 보기
    else { hideTip(); const k = pick(e); if (k) chooseRoom(k); }
  }
  drag = null;
});
renderer.domElement.addEventListener('pointerleave', () => { hoverRoom(null); hideTip(); });
// 캐릭터를 맞혔는지 (pick 이 광선을 맞춘 뒤에 불러요)
function pickChar(e) {
  pick(e);
  const hit = ray.intersectObjects(people.map((c) => c.root), true)[0];
  let o = hit?.object;
  while (o && !o.userData.char) o = o.parent;
  return o?.userData.char?.info ? o.userData.char : null;
}
stage.addEventListener('wheel', (e) => {

  document.getElementById('friendNote').innerHTML = `지금 친구: <b>${fr.name}</b> · ${fr.note}`;
  document.getElementById('meNote').innerHTML = `<b>${me.name}</b> · ${me.note}`;
  document.querySelectorAll('#mePick button').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.me) === STATE.me)));
  document.querySelectorAll('#genderPick button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.g === STATE.gender)));
  markSigns();
}
floorsEl.addEventListener('click', (e) => {
  const f = e.target.closest('.fbtn'), r = e.target.closest('.rbtn');
  if (f) { target = { kind: 'floor', key: f.dataset.floor }; FLOORS.find((x) => x.floor === f.dataset.floor).rooms.length > 1 ? enterFloor(f.dataset.floor) : enter(FLOORS.find((x) => x.floor === f.dataset.floor).rooms[0]); renderBoard(); }
  if (r) chooseRoom(r.dataset.room);
});
staffEl.addEventListener('click', (e) => {
  const c = e.target.closest('.pc');
  if (!c) return;
  const rooms = targetRooms();
  if (!rooms.length) { stepEl.innerHTML = '<b>먼저 왼쪽에서 층이나 방을 골라 주세요.</b> 그다음 직원을 누르면 배치돼요.'; return; }
  rooms.forEach((k) => { STATE.assign[k] = Number(c.dataset.id); });
  save();
  rebuild();
});
friendsEl.addEventListener('click', (e) => {
  const c = e.target.closest('.pc');
  if (!c) return;
  STATE.friend = Number(c.dataset.id);
  save();
  rebuild();
  enter('boss');
});
const mePick = document.getElementById('mePick');
mePick.innerHTML = ME.map((m) => `<button type="button" data-me="${m.id}" aria-pressed="false"><b>${m.id}</b>${m.name}</button>`).join('');
mePick.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  STATE.me = Number(b.dataset.me);
  save();
  rebuild();
  enter('boss');
});
document.getElementById('genderPick').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  STATE.gender = b.dataset.g;
  save();
  rebuild();
  enter('boss');
});
// 카드에 마우스를 올려도 설명이 떠요
for (const [el, info] of [[staffEl, (id) => staffInfo(id)], [friendsEl, (id) => friendInfo(id)]]) {
  el.addEventListener('pointermove', (e) => { const c = e.target.closest('.pc'); if (c) showTip(info(Number(c.dataset.id)), e.clientX, e.clientY); else hideTip(); });
  el.addEventListener('pointerleave', hideTip);
  el.addEventListener('focusin', (e) => { const c = e.target.closest('.pc'); if (!c) return; const r = c.getBoundingClientRect(); showTip(info(Number(c.dataset.id)), r.left, r.bottom - 10); });
  el.addEventListener('focusout', hideTip);
}
document.getElementById('reset').addEventListener('click', () => {
  Object.assign(STATE, { assign: { ...DEFAULT.assign }, me: DEFAULT.me, friend: DEFAULT.friend, gender: STATE.gender, theme: STATE.theme });
  save();
  target = null;
  rebuild();
  overview();
});
function rebuild() { buildWorld(); renderBoard(); }

// ---------- 캐릭터 사진(작은 3D 그림) ----------
const TW = 120, TH = 128;
thumbR.setPixelRatio(2);
thumbR.setSize(TW, TH, false);
const tScene = new THREE.Scene();
tScene.add(new THREE.HemisphereLight('#ffffff', '#b9a68a', 1.8));
const tSun = new THREE.DirectionalLight('#fff4e2', 2);
tSun.position.set(-3, 6, 6);
tScene.add(tSun);
const tCam = new THREE.PerspectiveCamera(28, TW / TH, .05, 50);
const box3 = new THREE.Box3(), size = new THREE.Vector3(), center = new THREE.Vector3();
function snapshot(def, canvas) {
  const c = makeChar(def);
  c.groups.forEach(({ name, g }) => { if (name === 'flapL') g.rotation.y = .5; if (name === 'flapR') g.rotation.y = -.5; });
  tScene.add(c.root);
  box3.setFromObject(c.root);
  box3.getSize(size); box3.getCenter(center);
  const dist = (Math.max(size.y, size.x * TH / TW) / 2) / Math.tan(THREE.MathUtils.degToRad(tCam.fov / 2)) * 1.25 + size.z / 2;
  tCam.position.set(center.x - Math.sin(.42) * dist, center.y + dist * .2, center.z + Math.cos(.42) * dist);
  tCam.lookAt(center);
  thumbR.render(tScene, tCam);
  canvas.width = TW * 2; canvas.height = TH * 2;
  canvas.getContext('2d').drawImage(thumbR.domElement, 0, 0);
  tScene.remove(c.root);
}
function gallery(el, list) {
  el.innerHTML = list.map((x) => `<button type="button" class="pc" data-id="${x.id}"><canvas aria-hidden="true"></canvas><b><span>${x.id}</span>${x.name}</b><small>${x.note}</small></button>`).join('');
  el.querySelectorAll('.pc').forEach((btn, i) => snapshot(list[i].def(), btn.querySelector('canvas')));
}

// ---------- 화면 크기 · 이름표 위치 ----------
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  if (!selected) overview(); else if (target?.kind === 'floor') enterFloor(target.key); else enter(selected);
}
const tmp = new THREE.Vector3();
function placeLabels() {
  const w = stage.clientWidth, h = stage.clientHeight;
  for (const { el, pos } of labelItems) {
    tmp.copy(pos).project(camera);
    const off = tmp.z > 1 || tmp.x < -1.1 || tmp.x > 1.1 || tmp.y < -1.1 || tmp.y > 1.1;
    el.style.visibility = off ? 'hidden' : 'visible';
    if (!off) el.style.translate = `${((tmp.x + 1) / 2) * w}px ${((1 - tmp.y) / 2) * h}px`;
  }
}

const still = matchMedia('(prefers-reduced-motion: reduce)');
const clock = new THREE.Clock();
let t = 0, tour = 0;
function loop() {
  const dt = Math.min(clock.getDelta(), .05);
  if (!still.matches) t += dt;
  for (const c of people) animate(c, t);
  for (const { d, x0, x1, off } of docs) d.position.x = x0 + (((t * .18 + off) % 1) * (x1 - x0));
  if (flag) flag.rotation.y = Math.sin(t * 3) * .25;
  for (const b of bobbers) b.m.position.y = b.y0 + Math.sin(t * 1.5 + b.ph) * .12;
  // 6초 넘게 가만히 있으면 화면보호기처럼 천천히 둘러봐요 (건물 전체 보기일 때만)
  if (!selected && !drag && !drawer.classList.contains('open') && performance.now() - lastInput > 6000 && !still.matches) {
    tour += dt;
    goal.yaw = -.32 + Math.sin(tour * .09) * .5;
    goal.pitch = .16 + Math.sin(tour * .05) * .05;
  }
  placeCamera();
  renderer.render(scene, camera);
  placeLabels();
  requestAnimationFrame(loop);
}

await Promise.race([document.fonts.load(`34px ${FONT}`), new Promise((r) => setTimeout(r, 1500))]).catch(() => {});
// #t3 처럼 열면 건물 시안 3으로, #boss 를 붙이면 원장실로 바로 들어가요 (예: #t3-boss)
const linkTheme = /t([1-5])/.exec(location.hash);
if (linkTheme) STATE.theme = Number(linkTheme[1]);
gallery(staffEl, STAFF);
gallery(friendsEl, FRIENDS);
buildWorld();
renderBoard();
renderTheme();
poke();
new ResizeObserver(resize).observe(stage);
resize();
// #boss 로 열면 원장실로 바로 들어가요
if (location.hash.includes('boss')) enter('boss');
view.target.copy(goal.target); view.dist = goal.dist; view.yaw = goal.yaw; view.pitch = goal.pitch;
loop();
</script>
