<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>방 문패 · 문쌤의 AI 연구소</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@600&display=swap">
<style>
  @font-face { font-family: 'Ownglyph_UNZ-Rg'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2406-1@1.0/Ownglyph_UNZ-Rg.woff2') format('woff2'); font-display: swap; }
  html { font-synthesis: none; }
  body { margin: 0; padding: 24px; background: #f3efe7; font-family: "IBM Plex Sans KR", sans-serif; color: #2b2620; }
  h1 { font: 28px "Ownglyph_UNZ-Rg", sans-serif; margin: 0 0 6px; }
  p { margin: 0 0 18px; color: #6d6458; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
  figure { margin: 0; display: grid; gap: 6px; justify-items: center; }
  canvas { width: 100%; max-width: 220px; height: auto; }
  figcaption { font-size: 13px; }
  a { color: inherit; }
  body.one { padding: 0; background: transparent; overflow: hidden; } body.one h1, body.one p { display: none; } body.one .grid { display: block; } body.one figcaption { display: none; } body.one canvas { width: 256px; height: 256px; max-width: none; display: block; }
</style>
</head>
<body>
<h1>방 문패</h1>
<p>방마다 색 · 그림 · 이름이 다른 정사각형 문패예요. 그림을 누르면 PNG 로 내려받아요. (마을 건물 앞 · 방 화면에 쓰여요)</p>
<div class="grid" id="grid"></div>
<script type="module">
  import { PLATES, drawPlate } from './plates.js';
  const one = new URLSearchParams(location.search).get('k');
  if (one) document.body.classList.add('one');
  await document.fonts.load('40px "Ownglyph_UNZ-Rg"');
  for (const k of one ? [one] : Object.keys(PLATES)) {
    const f = document.createElement('figure'), c = drawPlate(k, 512);
    const a = document.createElement('a'); a.href = c.toDataURL('image/png'); a.download = `plate-${k}.png`; a.append(c);
    f.append(a); const cap = document.createElement('figcaption'); cap.textContent = `${PLATES[k].name} · plate-${k}.png`; f.append(cap);
    document.getElementById('grid').append(f);
  }
</script>
</body>
</html>
