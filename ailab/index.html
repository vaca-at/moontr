<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body class="guest">
  <header class="top">
    <a class="brand" href="#"><span class="bot boss" aria-hidden="true"></span><span class="app-name">AI Lab</span></a>
    <label class="search teacher-only"><span class="sr">자료 찾기</span><input id="search" type="search" placeholder="자료 찾기 (제목, 장소, 교과…)" autocomplete="off"></label>
    <button class="btn primary teacher-only" data-act="upload">사진 넣기</button>
    <button class="btn ghost" id="authBtn" data-act="login">선생님 로그인</button>
  </header>
  <main id="view" class="page"></main>

  <input type="file" id="fileInput" accept="image/*" multiple hidden>
  <div id="dropOverlay" class="drop-overlay" hidden><p>여기에 놓으면 1층 접수처로 들어가요</p></div>
  <dialog id="dlg"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
