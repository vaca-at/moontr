<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>문쌤의 AI 연구소</title>
  <meta name="description" content="연수 공문, 수업 공개 공문, 다른 선생님 지도안 캡쳐를 AI 직원들이 읽고 층마다 정리해 주는 선생님의 자료 연구실">
  <!-- 링크 미리보기 (카톡 · 밴드 등) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="문쌤의 AI 연구소">
  <meta property="og:description" content="캡쳐 한 장이면 AI 직원들이 연수 · 수업 공개 · 지도안을 층마다 정리해요">
  <meta property="og:url" content="https://moontr.site/ailab/">
  <meta property="og:image" content="https://moontr.site/ailab/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <!-- 아이콘: 작은 건물 -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#dfeaf1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body class="guest">
  <header class="top">
    <a class="brand" href="#"><span class="bot boss" aria-hidden="true"></span><span class="app-name">문쌤의 AI 연구소</span></a>
    <label class="search teacher-only"><span class="sr">자료 찾기</span><input id="search" type="search" placeholder="자료 찾기 (제목, 장소, 교과…)" autocomplete="off"></label>
    <button class="btn primary teacher-only" data-act="upload">사진 넣기</button>
    <a class="btn ghost teacher-only" href="#admin" title="관리자 현황">현황</a>
    <button class="btn ghost" id="authBtn" data-act="login">선생님 로그인</button>
  </header>
  <main id="view" class="page"></main>
  <footer class="policy-foot"><a href="policy/">이용약관 · 개인정보 처리방침</a> · 문쌤의 AI 연구소 · moontr.site</footer>

  <!-- 첫 화면: 3D 건물 (building3d.js). 방을 누르면 그 방 화면으로 들어가요 -->
  <div id="b3d" hidden>
    <div class="stage" id="stage"><div class="labels" id="labels"></div></div>
    <button class="hud hudb" id="hudMenu" type="button" aria-controls="drawer" aria-expanded="false"><b aria-hidden="true">☰</b><span>메뉴</span></button>
    <button class="hud hudb" id="back" type="button" hidden>← 건물 전체</button>
    <button class="hud hudb" id="hudFs" type="button" aria-label="전체 화면" title="전체 화면">⛶</button>
    <div class="hud hudb" id="hudTheme" role="group" aria-label="건물 시안">
      <button type="button" id="thPrev" aria-label="이전 건물 시안">◀</button>
      <span class="nm" id="thName"></span>
      <span class="nums" id="themePick"></span>
      <button type="button" id="thNext" aria-label="다음 건물 시안">▶</button>
    </div>
    <div class="hud" id="wx" hidden aria-live="polite"></div>
    <span class="hud hint">방을 누르면 들어가요 · 끌어서 돌리기 · 캐릭터에 마우스를 올려 보세요</span>
    <aside id="drawer" aria-label="안내 · 직원 배치 · 사장실">
      <div class="head">
        <h2>메뉴</h2>
        <div class="row">
          <button class="ghost" id="reset" type="button">처음 배치로</button>
          <button class="ghost" id="drawerX" type="button">닫기 ✕</button>
        </div>
      </div>
      <div id="b3dTop"></div>
      <section class="panel">
        <h2>직원 배치</h2>
        <p class="step" id="stepText"></p>
        <div class="floors" id="floors"></div>
        <div class="gallery" id="staff"></div>
      </section>
      <section class="panel">
        <h2>사장실 · 나와 친구</h2>
        <h3>나 (사장님)</h3>
        <div class="me-row">
          <div class="seg" id="genderPick" role="group" aria-label="사장님 모습">
            <button type="button" data-g="f" aria-pressed="false">여자</button>
            <button type="button" data-g="m" aria-pressed="false">남자</button>
          </div>
          <div class="seg" id="mePick" role="group" aria-label="나"></div>
        </div>
        <p class="note" id="meNote"></p>
        <h3>내 옆 친구</h3>
        <div class="gallery" id="friends"></div>
        <p class="note" id="friendNote"></p>
      </section>
      <p class="note pol-link"><a href="policy/">이용약관 · 개인정보 처리방침</a></p>
    </aside>
    <div class="tip" id="tip" hidden></div>
  </div>

  <input type="file" id="fileInput" accept="image/*,application/pdf,.pdf" multiple hidden>
  <div id="dropOverlay" class="drop-overlay" hidden><p>여기에 놓으면 1층 접수처로 들어가요</p></div>
  <dialog id="dlg"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
  <!-- 방문 수 세기 (moontr 다른 웹앱과 같은 방식, 화면에는 안 보임 · #admin 에서는 세지 않음) -->
  <script type="module" src="/visit.js?app=ailab&hide=1"></script>
</body>
</html>
